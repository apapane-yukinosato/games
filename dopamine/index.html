<style>
html,body{touch-action:manipulation}
:root{--bg:#160d2e;--bg2:#241447;--ink:#fff;--pink:#ff4f9a;--yellow:#ffd23f;--cyan:#2ee6d6;--purple:#8a5cff;--green:#4fe08a;--mute:#b9a9e6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","IPAGothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 8px calc(6px + env(safe-area-inset-bottom,0px))}
#top{width:100%;max-width:600px;display:flex;align-items:center;gap:6px;height:34px;flex:none}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap;padding:6px 4px}
#top h1{flex:1;margin:0;text-align:center;font-size:14px;font-weight:900;color:var(--yellow);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:12px;font-weight:800;border:1px solid #4a3a82;border-radius:999px;padding:5px 10px;background:var(--bg2);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
#sndBtn[aria-pressed=false]{opacity:.6}
#wrap{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:390px;height:656px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #3b2a74,0 10px 30px rgba(0,0,0,.5)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#241447}
.scr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;background:rgba(22,13,46,.55)}
#scrOver,#scrCodex{background:rgba(22,13,46,.88)}
.logo{font-size:44px;line-height:1.05;font-weight:900;letter-spacing:.02em;background:linear-gradient(90deg,#ff4f9a,#ffd23f,#2ee6d6,#8a5cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0b0620);padding:4px 0}
.tag{margin:0;font-size:14px;line-height:1.5;color:#e9defc;font-weight:700}
.best{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:340px}
.best div{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 4px;font-size:11px;color:var(--mute);font-weight:800}
.best b{display:block;font-size:20px;color:var(--yellow);font-weight:900}
.btn{font-weight:900;border:0;border-radius:20px;padding:13px 26px;font-size:22px;color:#2a1000;background:linear-gradient(#ffe45c,#ffb21f);box-shadow:0 5px 0 #b86a00;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86a00}
.btn.alt{background:linear-gradient(#8ff5ee,#2ec9dc);box-shadow:0 5px 0 #0a7a8a;color:#00252b}
.btn.alt:active{box-shadow:0 2px 0 #0a7a8a}
.btn.sm{font-size:15px;padding:9px 16px;border-radius:16px}
.how{margin:0;font-size:11.5px;line-height:1.6;color:var(--mute);font-weight:700;max-width:330px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{font-size:30px;font-weight:900;margin:0}
.res{display:grid;gap:4px;font-size:15px;font-weight:800;margin:0}
.res b{color:var(--yellow);font-size:22px}
.newrec{color:var(--pink);font-weight:900}
.unl{font-size:13px;color:var(--cyan);font-weight:800;margin:0;max-width:330px}
#codexBody{overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;flex:1;min-height:0;text-align:left}
#codexBody h3{margin:8px 2px 6px;font-size:14px;color:var(--yellow)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cc{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 4px;text-align:center;min-height:92px}
.cc .i{font-size:28px;line-height:1.2}
.cc .n{font-size:11.5px;font-weight:900}
.cc .s{font-size:9.5px;color:var(--mute);font-weight:700;line-height:1.35;margin-top:2px}
.cc.lock{opacity:.55}
.cc.unseen .i{filter:grayscale(1) brightness(.6)}
#codexHead{display:flex;align-items:center;justify-content:space-between;width:100%}
#codexHead h2{margin:0;font-size:20px}
#hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:10.5px;color:#cbbcf2;pointer-events:none;z-index:2;opacity:.8}
</style>

<body>
<div id="app">
  <div id="top">
    <a href="../" id="backLink">← 一覧</a>
    <h1>ドーパミン・ジャンキー</h1>
    <button id="autoBtn" class="mini" type="button" aria-pressed="false">🤖 オート</button>
    <button id="sndBtn" class="mini" type="button" aria-pressed="true" aria-label="音">🔊</button>
  </div>
  <div id="wrap">
    <div id="box">
      <canvas id="cv" width="390" height="656"></canvas>
      <div id="scrTitle" class="scr">
        <div class="logo">ドーパミン<br>ジャンキー</div>
        <p class="tag">どんどん新しいことが起こる。<br>絶対にだれない。</p>
        <div class="best" id="bestBox"></div>
        <button id="btnStart" class="btn" type="button">▶ スタート</button>
        <div class="row">
          <button id="btnCodex" class="btn alt sm" type="button">📖 図鑑 <span id="codexCount"></span></button>
          <button id="btnAutoStart" class="btn alt sm" type="button">🤖 オートで見る</button>
        </div>
        <p class="how">3〜5秒の指示にしたがってタップ・スワイプ・こする！<br>ライフは4つ。10本ごとにボス、ルールもどんどん変わる。<br>PC：マウス / 矢印キー＋スペース ・ Oキーでオート</p>
      </div>

        <div class="row">
          <button id="btnCodex2" class="btn alt sm" type="button">📖 図鑑</button>
          <button id="btnTitle" class="btn alt sm" type="button">タイトルへ</button>
        </div>
        <a href="../" class="btn alt sm" style="text-decoration:none">← ゲーム一覧にもどる</a>
      </div>
      <div id="scrCodex" class="scr" hidden>
        <div id="codexHead"><h2>📖 図鑑</h2><button id="btnCodexClose" class="btn alt sm" type="button">とじる</button></div>
        <div id="codexBody"></div>
      </div>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const CW=390, CH=656, TOP=96, GW=390, GH=560;
const FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","IPAGothic","Noto Sans CJK JP",sans-serif';
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot;
const gauss=s=>{let u=0;for(let i=0;i<6;i++)u+=Math.random();return (u-3)*s*1.4;};

/* ---------- storage ---------- */
const LS={
  get(k,d){ try{ const v=localStorage.getItem('dopamine.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('dopamine.'+k,JSON.stringify(v)); }catch(e){} }
};
const prog=Object.assign({total:0,seen:{},mseen:{}},LS.get('prog',{}));
const best=Object.assign({n:0,score:0,combo:0},LS.get('best',{}));
let muted=!!LS.get('mute',false);

/* ---------- seeded random (game logic only) ---------- */
let seedV=(Math.random()*4294967296)>>>0;
function rnd(){ seedV=(seedV+0x6D2B79F5)>>>0; let t=seedV; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
const ri=(a,b)=>Math.floor(a+rnd()*(b-a));
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- drawing helpers ---------- */
function emo(c,e,x,y,s,rot){ c.save(); c.translate(x,y); if(rot) c.rotate(rot); c.font=`${s}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillStyle='#000'; c.fillText(e,0,s*.06); c.restore(); }
function txt(c,s,x,y,size,col,o){ o=o||{}; c.font=`900 ${size}px ${FONT}`; c.textAlign=o.al||'center'; c.textBaseline='middle'; if(o.stroke!==0){ c.lineWidth=o.sw||Math.max(3,size*.15); c.strokeStyle=o.stroke||'#1b1038'; c.lineJoin='round'; c.strokeText(s,x,y); } c.fillStyle=col; c.fillText(s,x,y); }
function rrect(c,x,y,w,h,r){ c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h); }
function disc(c,x,y,r,col,stroke,lw){ c.beginPath(); c.arc(x,y,Math.max(0,r),0,TAU); if(col){ c.fillStyle=col; c.fill(); } if(stroke){ c.lineWidth=lw||3; c.strokeStyle=stroke; c.stroke(); } }
const COLS=['#ff4d6d','#3a86ff','#2ec27e','#ffc233','#a64dff','#ff8a2b'];
function shp(c,k,x,y,r,col){
  c.fillStyle=col; c.strokeStyle='#1b1038'; c.lineWidth=Math.max(2,r*.12); c.lineJoin='round'; c.beginPath();
  switch(k){
    case 0: c.arc(x,y,r,0,TAU); break;
    case 1: c.moveTo(x,y-r); c.lineTo(x+r*.95,y+r*.75); c.lineTo(x-r*.95,y+r*.75); c.closePath(); break;
    case 2: c.rect(x-r*.85,y-r*.85,r*1.7,r*1.7); break;
    case 3: for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; c[i?'lineTo':'moveTo'](x+Math.cos(a)*q,y+Math.sin(a)*q); } c.closePath(); break;
    case 4: c.moveTo(x,y+r*.9); c.bezierCurveTo(x-r*1.5,y-r*.2,x-r*.6,y-r*1.1,x,y-r*.35); c.bezierCurveTo(x+r*.6,y-r*1.1,x+r*1.5,y-r*.2,x,y+r*.9); break;
    default: c.moveTo(x,y-r); c.lineTo(x+r*.8,y); c.lineTo(x,y+r); c.lineTo(x-r*.8,y); c.closePath();
  }
  c.fill(); c.stroke();
}
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=clamp(t,0,1); return hyp(px-(ax+dx*t),py-(ay+dy*t)); }

/* ---------- matrices (mutator view transform) ---------- */
const mMul=(m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]];
function mInv(m){ const d=m[0]*m[3]-m[1]*m[2]; return [m[3]/d,-m[1]/d,-m[2]/d,m[0]/d,(m[2]*m[5]-m[3]*m[4])/d,(m[1]*m[4]-m[0]*m[5])/d]; }
const mPt=(m,x,y)=>({x:m[0]*x+m[2]*y+m[4],y:m[1]*x+m[3]*y+m[5]});
function viewMat(muts,w,h,side){
  let M=[1,0,0,1,0,0]; const cx=w/2, cy=h/2;
  const about=op=>mMul(mMul([1,0,0,1,cx,cy],op),[1,0,0,1,-cx,-cy]);
  if(muts.includes('mirror')) M=mMul(about([-1,0,0,1,0,0]),M);
  if(muts.includes('flip')) M=mMul(about([-1,0,0,-1,0,0]),M);
  if(muts.includes('side')){ const s=Math.min(w/h,h/w); M=mMul(about([0,side*s,-side*s,0,0,0]),M); }
  return M;
}

/* ---------- audio ---------- */
let AC=null, master=null, noiseBuf=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ AC=null; } }
  if(AC&&AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,vol,when,slide){
  if(muted||!AC) return; const t=AC.currentTime+(when||0); const o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(25,f*slide),t+d);
  gn.gain.setValueAtTime(vol==null?.12:vol,t); gn.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t+d+.03);
}
function hiss(d,vol,when,hp){
  if(muted||!AC||!noiseBuf) return; const t=AC.currentTime+(when||0); const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||4000; const gn=AC.createGain(); gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(.0008,t+d);
  s.connect(f); f.connect(gn); gn.connect(master); s.start(t); s.stop(t+d+.02);
}
const PENT=[0,2,4,7,9];
const ladder=i=>{ i=Math.max(0,Math.floor(i)); return 392*Math.pow(2,(PENT[i%5]+12*Math.floor(i/5))/12); };
function sfx(name,a){
  if(muted||!AC) return;
  switch(name){
    case 'tap': tone(520,.05,'triangle',.08); break;
    case 'pop': tone(ladder((a||0)+2),.1,'square',.1,0,1.5); hiss(.05,.05); break;
    case 'ok': { const f=ladder(a||0); tone(f,.12,'square',.11); tone(f*1.5,.16,'triangle',.09,.06); break; }
    case 'bad': tone(180,.28,'sawtooth',.14,0,.5); tone(120,.3,'square',.1,.08,.5); break;
    case 'coin': tone(988,.06,'square',.08); tone(1319,.14,'square',.08,.06); break;
    case 'whoosh': hiss(.12,.08,0,1500); break;
    case 'tick': tone(1200,.03,'square',.05); break;
    case 'hit': tone(150,.1,'square',.12,0,.4); hiss(.08,.08,0,800); break;
    case 'level': [0,4,7,12].forEach((s,i)=>tone(440*Math.pow(2,s/12),.14,'square',.1,i*.06)); break;
    case 'boss': tone(110,.5,'sawtooth',.14,0,.7); tone(165,.5,'sawtooth',.1,.1,.7); break;
    case 'win': [0,4,7,12,16].forEach((s,i)=>tone(523*Math.pow(2,s/12),.2,'square',.1,i*.07)); break;
    case 'heal': tone(660,.1,'triangle',.12); tone(880,.1,'triangle',.12,.08); tone(1320,.2,'triangle',.12,.16); break;
    case 'new': [0,5,9,14,17].forEach((s,i)=>tone(587*Math.pow(2,s/12),.18,'triangle',.1,i*.06)); break;
    case 'fever': [0,3,7,10,14,19].forEach((s,i)=>tone(440*Math.pow(2,s/12),.12,'square',.09,i*.05)); break;
    case 'over': [0,-3,-7,-12].forEach((s,i)=>tone(330*Math.pow(2,s/12),.3,'sawtooth',.12,i*.18,.97)); break;
  }
}
let bgmT=0, bgmStep=0;
const BASS_PAT=[0,-1,0,-1,0,-1,3,-1, 5,-1,5,-1,3,-1,7,-1];
const CHORD=[0,0,5,3,0,0,7,5];
function bgmTick(){
  if(!AC) return;
  if(muted||S.scene!=='play'||!R||R.dead){ bgmT=AC.currentTime+.05; return; }
  const stepDur=60/S.bpm/2;
  if(bgmT<AC.currentTime) bgmT=AC.currentTime+.03;
  while(bgmT<AC.currentTime+.15){
    const w=bgmT-AC.currentTime, s=bgmStep%16, root=CHORD[Math.floor(bgmStep/16)%CHORD.length];
    if(s%4===0){ tone(130,.14,'sine',.2,w,.35); }
    if(s%4===2) hiss(.04,.06,w,6000);
    if(s%8===4) hiss(.1,.05,w,2500);
    const b=BASS_PAT[s]; if(b>=0) tone(55*Math.pow(2,(root+b)/12),stepDur*1.6,'sawtooth',.08,w);
    const arp=[0,3,7,10,12,10,7,3][s%8]; tone(220*Math.pow(2,(root+arp)/12),stepDur*.8,'square',R&&R.fever>0?.045:.025,w);
    bgmStep++; bgmT+=stepDur;
  }
}
setInterval(bgmTick,30);

/* ---------- effects ---------- */
const P=[], POPS=[], BANS=[], RINGS=[];
function confetti(x,y,n,pw){
  pw=pw||1; for(let i=0;i<n&&P.length<420;i++){ const a=Math.random()*TAU, s=(120+Math.random()*320)*pw;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-180*pw,life:0,max:.8+Math.random()*.7,c:`hsl(${Math.floor(Math.random()*360)},95%,62%)`,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*TAU,vr:(Math.random()-.5)*14}); }
}
function popText(t,x,y,col,size,life){ POPS.push({t,x,y,col:col||'#fff',size:size||30,life:0,max:life||.9}); if(POPS.length>16) POPS.shift(); }
function ringFx(x,y,col){ RINGS.push({x,y,col:col||'#fff',life:0}); if(RINGS.length>20) RINGS.shift(); }
function banner(t,col,sub,kind,life){ BANS.push({t,col:col||'#ffe45c',sub:sub||'',kind:kind||'',life:0,max:life||1.3}); if(BANS.length>3) BANS.shift(); }
function fxUpdate(dt){
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.life+=dt; p.vy+=620*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-1.2*dt; p.r+=p.vr*dt; if(p.life>p.max||p.y>CH+20) P.splice(i,1); }
  for(let i=POPS.length-1;i>=0;i--){ const p=POPS[i]; p.life+=dt; p.y-=60*dt; if(p.life>p.max) POPS.splice(i,1); }
  for(let i=BANS.length-1;i>=0;i--){ const b=BANS[i]; b.life+=dt; if(b.life>b.max) BANS.splice(i,1); }
  for(let i=RINGS.length-1;i>=0;i--){ const r=RINGS[i]; r.life+=dt; if(r.life>.4) RINGS.splice(i,1); }
  if(S.shakeT>0) S.shakeT=Math.max(0,S.shakeT-dt);
}

/* ---------- registry ---------- */
const DEFS=[];
function def(id,o,make){ o.id=id; o.make=make; DEFS.push(o); return o; }
const MUTS=[
  {id:'mirror',name:'左右反転',icon:'🪞',desc:'画面が左右ぎゃく。',unlock:0,col:'#4aa8ff'},
  {id:'shake',name:'ゆれゆれ',icon:'🌊',desc:'画面がゆれる。',unlock:0,col:'#ff8a2b'},
  {id:'big',name:'巨大化',icon:'🍄',desc:'ぜんぶ巨大化。',unlock:0,col:'#4fe08a'},
  {id:'time',name:'時間半分',icon:'⏱️',desc:'制限時間が半分。',unlock:0,col:'#ff4d6d'},
  {id:'flip',name:'さかさま',icon:'🙃',desc:'上下がぎゃく。',unlock:12,col:'#a64dff'},
  {id:'nope',name:'指示ぎゃく',icon:'🚫',desc:'「さわるな！」何もしないのが正解。',unlock:28,col:'#ff4f9a'},
  {id:'gray',name:'モノクロ',icon:'🩶',desc:'色が消える。',unlock:48,col:'#aab'},
  {id:'dark',name:'くらやみ',icon:'🔦',desc:'指のまわりだけ見える。',unlock:72,col:'#7a7ad6'},
  {id:'split',name:'2本同時',icon:'🔀',desc:'画面が上下に分かれて2本同時。',unlock:100,col:'#2ee6d6'},
  {id:'side',name:'よこむき',icon:'🔄',desc:'画面が90度回って重力が横。',unlock:140,col:'#ffd23f'},
  {id:'tiny',name:'ちびちび',icon:'🐜',desc:'ぜんぶ小さい。',unlock:190,col:'#ff7ad9'},
  {id:'blur',name:'ぼやぼや',icon:'🌫️',desc:'画面がぼやける。',unlock:250,col:'#9ab'}
];
const CONFLICT=[['mirror','flip'],['mirror','side'],['flip','side'],['nope','big'],['nope','tiny'],['nope','time'],['nope','split'],['big','tiny'],['split','side'],['gray','blur'],['dark','blur']];
const conflict=(a,b)=>CONFLICT.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
const unlockedDef=d=>d.unlock<=prog.total;
const unlockedMut=m=>m.unlock<=prog.total;

/* ---------- state ---------- */
const S={scene:'title',time:0,auto:false,bot:null,bpm:112,test:false,shakeT:0,force:{game:null,muts:null,gold:null},forceKeep:false,overT:0,kcur:null,kdown:false,ptrView:null,invincible:false};
let R=null, M=null;

function saveBest(){ if(!R) return; let ch=false; if(R.n>best.n){ best.n=R.n; ch=true; } if(R.score>best.score){ best.score=R.score; ch=true; } if(R.maxCombo>best.combo){ best.combo=R.maxCombo; ch=true; } if(ch) LS.set('best',best); }

/* ---------- slots / views ---------- */
function viewRects(n){ return n===2?[{x:0,y:TOP,w:GW,h:278},{x:0,y:TOP+282,w:GW,h:278}]:[{x:0,y:TOP,w:GW,h:GH}]; }
function toScreenLocal(v,x,y){ return mPt(v.mat,x,y); }
function toScreen(v,x,y){ const p=mPt(v.mat,x,y); return {x:p.x+v.rect.x,y:p.y+v.rect.y}; }

function mkView(def,rect,Mo){
  const lvl=Mo.level, sp=Math.min(2.2,1+.1*lvl), dm=Math.max(.62,1/(1+.06*lvl));
  let dur=def.dur*(def.boss?Math.max(.85,dm):dm);
  if(Mo.muts.includes('time')) dur=Math.max(2.4,dur*.5);
  if(Mo.nope) dur=clamp(def.dur*.8,2.6,3.4);
  const v={def,rect,res:null,t:0,q:[],cur:{x:rect.w/2,y:rect.h/2,on:false,vis:false},light:{x:rect.w/2,y:rect.h/2},lag:0,nope:Mo.nope,payload:null,dur,
           mat:viewMat(Mo.muts,rect.w,rect.h,Mo.side)};
  v.imat=mInv(v.mat);
  const bot=S.bot;
  if(bot) v.lag=bot.lagMin+Math.random()*(bot.lagMax-bot.lagMin);
  const big=Mo.muts.includes('big')?1.6:Mo.muts.includes('tiny')?.68:1;
  const g={W:rect.w,H:rect.h,sp,dur,big,rnd,ri,pick,shuffle,
    lead:bot?Math.max(0,v.lag*(bot.leadK==null?.9:bot.leadK)+gauss(bot.sigma)):0,
    retry:bot?v.lag+.25:.09, rate:bot?bot.rate:20, aiSpeed:bot?bot.speed:1, human:!!bot,
    get t(){ return v.t; },
    has:m=>Mo.muts.includes(m),
    finish(ok,payload){ if(v.nope) return; if(v.res===null){ v.res=ok?'win':'fail'; v.payload=payload; } },
    due(o,cd){ const k=(cd==null?g.retry:cd); if(g.t-(o.tt==null?-9:o.tt)<k) return false; o.tt=g.t; return true; },
    tap(x,y){
      if(bot&&Math.random()<bot.miss){ const a=Math.random()*TAU, d=34+Math.random()*34; x+=Math.cos(a)*d; y+=Math.sin(a)*d; }
      send(v,'down',x,y); send(v,'up',x,y);
    },
    in:{down:(x,y)=>send(v,'down',x,y),move:(x,y)=>send(v,'move',x,y),up:(x,y)=>send(v,'up',x,y)},
    pop(t,x,y,col,size){ const p=toScreen(v,x,y); popText(t,p.x,p.y,col,size); },
    burst(x,y,n,pw){ const p=toScreen(v,x,y); confetti(p.x,p.y,n||14,pw||.6); },
    ring(x,y,col){ const p=toScreen(v,x,y); ringFx(p.x,p.y,col); },
    sfx(n,a){ sfx(n,a); }
  };
  v.g=g; v.o=def.make(g);
  return v;
}
function send(v,type,x,y){
  if(S.bot){
    if(type==='move'&&S.bot.jit){ x+=gauss(S.bot.jit); y+=gauss(S.bot.jit); }
    v.q.push({at:v.t+v.lag,type,x,y});
  } else deliver(v,type,x,y);
}
function deliver(v,type,x,y){
  if(v.res!==null||S.scene!=='play'||!M||M.state!=='run') return;
  v.cur.x=x; v.cur.y=y; v.cur.vis=true; if(type==='down') v.cur.on=true; if(type==='up') v.cur.on=false;
  const p=toScreenLocal(v,x,y); v.light.x=p.x; v.light.y=p.y;
  const h=v.o[type]; if(h) h.call(v.o,x,y);
}
function mkSlot(o){
  const defs=o.defs, muts=o.muts||[];
  const Mo={defs,muts,gold:!!o.gold,boss:!!defs[0].boss,inter:!!defs[0].inter,nope:muts.includes('nope'),state:'run',t:0,res:null,gapT:0,stampT:0,touched:false,views:[],
    level:o.level||0,side:Math.random()<.5?1:-1,n:(R?R.n:0)+1,hue:Math.floor(Math.random()*360),fresh:false,stamp:''};
  const rects=viewRects(defs.length);
  defs.forEach((d,i)=>{ if(!prog.seen[d.id]){ Mo.fresh=true; } Mo.views.push(mkView(d,rects[i],Mo)); prog.seen[d.id]=1; });
  muts.forEach(m=>{ prog.mseen[m]=1; });
  LS.set('prog',prog);
  Mo.dur=Math.max(...Mo.views.map(v=>v.dur));
  if(Mo.nope) Mo.cmd='さわるな！';
  else if(defs.length===2) Mo.cmd=defs[0].cmd.replace(/[！？…]+$/,'')+'＆'+defs[1].cmd;
  else Mo.cmd=defs[0].cmd;
  return Mo;
}

/* ---------- run flow ---------- */
function startRun(){
  R={n:0,lives:4,maxLives:6,score:0,combo:0,maxCombo:0,fever:0,shield:0,level:0,lastLevel:0,clears:0,recent:[],pending:null,lastInter:-9,newU:[],log:[],dead:false,bossBag:shuffle(DEFS.filter(d=>d.boss)),startTotal:prog.total,stats:{ok:0,miss:0},pb:Object.assign({},best),ev:{fever:0,heal:0,gold:0,boss:0,roulette:0,chest:0,mut:0,levelup:0}};
  S.scene='play'; S.bpm=116; bgmStep=0; setScreen(null); nextSlot();
}
function pickGame(){
  const pool=DEFS.filter(d=>!d.boss&&!d.inter&&unlockedDef(d));
  const cand=pool.filter(d=>!R.recent.includes(d.id));
  const list=cand.length?cand:pool;
  const w=list.map(d=>prog.seen[d.id]?1:4); let tot=w.reduce((a,b)=>a+b,0), r=rnd()*tot;
  for(let i=0;i<list.length;i++){ r-=w[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function pickMuts(def,n){
  if(n<4) return [];
  const p=Math.min(.6,.18+.025*n);
  if(rnd()>p) return [];
  const pool=MUTS.filter(m=>unlockedMut(m)&&compatible(m.id,def,[]));
  if(!pool.length) return [];
  const out=[pick(pool).id];
  if(n>=25&&rnd()<.3){ const p2=MUTS.filter(m=>unlockedMut(m)&&m.id!==out[0]&&compatible(m.id,def,out)); if(p2.length) out.push(pick(p2).id); }
  return out;
}
function compatible(m,def,cur){
  if(def.boss&&(m==='nope'||m==='split'||m==='time')) return false;
  if(m==='split'&&def.nosplit) return false;
  if(m==='side'&&def.noside) return false;
  return !cur.some(c=>conflict(c,m));
}
function nextSlot(){
  if(R.pending){ const k=R.pending; R.pending=null; R.ev[k]++; M=mkSlot({defs:[DEFS.find(d=>d.id===k)],level:R.level}); return; }
  const n=R.n+1; R.level=Math.floor((n-1)/10);
  if(R.level>R.lastLevel){ R.lastLevel=R.level; R.ev.levelup++; banner('SPEED UP!','#4fe08a','テンポ＆BPMアップ','',1.3); sfx('level'); }
  S.bpm=Math.min(190,116+9*R.level);
  const f=S.force; let def, muts, gold;
  const boss=n%10===0;
  if(f.game){ def=DEFS.find(d=>d.id===f.game); }
  else if(boss) def=R.bossBag[(n/10-1)%R.bossBag.length];
  else def=pickGame();
  if(f.muts) muts=f.muts.filter(m=>MUTS.some(x=>x.id===m)); else muts=pickMuts(def,n);
  gold=f.gold!=null?f.gold:(!def.boss&&n>=3&&rnd()<.03);
  const defs=[def];
  if(muts.includes('split')){ const pool=DEFS.filter(d=>!d.boss&&!d.inter&&!d.nosplit&&d.id!==def.id&&unlockedDef(d)); defs.push(f.game2?DEFS.find(d=>d.id===f.game2):pick(pool)); }
  if(!S.forceKeep) S.force={game:null,muts:null,gold:null};
  R.recent.push(def.id); if(R.recent.length>4) R.recent.shift();
  M=mkSlot({defs,muts,gold,level:R.level});
  if(muts.length) R.ev.mut++; if(M.gold) R.ev.gold++; if(M.boss) R.ev.boss++;
  if(M.boss){ banner('BOSS!!','#ff4d6d',def.name,'',1.4); sfx('boss'); }
  else if(M.gold){ banner('✨ RARE GOLD ✨','#ffd23f','得点 ×10','',1.4); sfx('win'); }
  else if(muts.length){ const m=MUTS.find(x=>x.id===muts[0]); banner(m.icon+' '+m.name,m.col,muts.length>1?'＋ '+MUTS.find(x=>x.id===muts[1]).name:'ルール変化！','',1.0); }
  if(M.fresh&&!M.boss) popText('📖 はじめて！',CW/2,TOP+GH-30,'#2ee6d6',22,1.4);
}

const WORDS=['OK!','NICE!','GOOD!','いいね！','GREAT!','COOL!','やるぅ！'];
function endSlot(res){
  if(!M||M.state!=='run') return;
  M.state='gap'; M.res=res; M.stampT=0;
  R.log.push({n:M.n,id:M.defs.map(d=>d.id).join('+'),muts:M.muts.join('+'),res,t:+M.t.toFixed(2)});
  const gapBase=(S.auto&&!S.bot)?.28:.42;
  M.gapT=gapBase;
  if(M.inter){ applyInter(res); M.stamp=res==='win'?'GET!':'…'; return; }
  R.n++;
  const feverNow=R.fever>0;
  if(res==='win'){
    R.combo++; R.maxCombo=Math.max(R.maxCombo,R.combo); R.clears++; R.stats.ok++; prog.total++;
    const mult=(feverNow?2:1)*(M.gold?10:1);
    const speedBonus=Math.round(80*clamp(1-M.t/M.dur,0,1));
    let base=100+Math.min(R.combo,40)*15;
    if(M.boss) base=1500*(1+R.level);
    const pts=Math.round((base*(1+R.level*.1)+speedBonus)*mult);
    R.score+=pts;
    M.stamp=M.boss?'BOSS CLEAR!':WORDS[(R.n)%WORDS.length]; 
    sfx('ok',R.combo); 
    const cx=CW/2, cy=TOP+GH*.42;
    popText('+'+pts.toLocaleString(),cx,cy,M.gold?'#ffd23f':feverNow?'#ff9ae6':'#ffe45c',M.boss?54:44,1.0);
    if(R.combo>=3) popText(R.combo+' COMBO',cx,cy+46,'#ff8ad6',26,.9);
    confetti(cx,cy,Math.min(60,16+R.combo*2),1);
    if(M.boss){ confetti(cx,cy,120,1.4); sfx('win'); banner('BOSS CLEAR!!','#ffd23f','ライフ+1 ・ ボーナス '+pts.toLocaleString(),'',1.6); if(R.lives<R.maxLives) R.lives++; }
    if([5,10,15,20,30,40,50,75,100].includes(R.combo)){ const bo=R.combo*30; R.score+=bo; banner(R.combo+' COMBO!','#ff8ad6',['GREAT!','AWESOME!','AMAZING!','UNSTOPPABLE!','LEGENDARY!'][Math.min(4,Math.floor(Math.log2(R.combo/5)))]+' +'+bo,'',1.2); confetti(CW/2,TOP+120,50,1.2); }
    // unlocks
    DEFS.filter(d=>d.unlock>0&&d.unlock===prog.total).forEach(d=>{ R.newU.push(d.icon+' '+d.name); banner('NEW! '+d.icon+' '+d.name,'#2ee6d6','マイクロゲーム解禁','new',2.0); sfx('new'); confetti(CW/2,TOP+GH-60,40,.9); });
    MUTS.filter(m=>m.unlock>0&&m.unlock===prog.total).forEach(m=>{ R.newU.push(m.icon+' '+m.name); banner('NEW! '+m.icon+' '+m.name,'#ff9ae6','ミューテーター解禁','new',2.0); sfx('new'); });
    LS.set('prog',prog);
    // events
    if(!M.boss){
      if(!R.fever&&!feverNow&&R.n>=5&&rnd()<.07) startFever();
      if(R.lives<R.maxLives&&rnd()<.05){ R.ev.heal++; R.lives++; banner('❤️ ライフ回復！','#ff6a8a','','',1.1); sfx('heal'); }
      if(R.n>=4&&R.n-R.lastInter>=5&&(R.n+1)%10!==0&&rnd()<.2){ R.pending=rnd()<.55?'roulette':'chest'; R.lastInter=R.n; }
    }
  } else {
    R.stats.miss++;
    M.stamp='MISS…';
    if(R.shield>0){ R.shield--; banner('🛡 シールドでガード！','#4aa8ff','','',1.0); sfx('heal'); }
    else { sfx('bad'); R.combo=0; if(!S.invincible) R.lives--; S.shakeT=.3; }
    if(R.lives<=0){ R.dead=true; M.gapT=.9; M.stamp='GAME OVER'; sfx('over'); }
  }
  if(feverNow){ R.fever--; if(R.fever<=0) banner('フィーバー終了','#ff9ae6','','',.9); }
  saveBest();
}
function startFever(){ R.ev.fever++; R.fever=6; banner('🌈 FEVER!! ×2','#ff9ae6','6本のあいだ得点2倍','',1.5); sfx('fever'); confetti(CW/2,TOP+160,60,1.2); }
function applyInter(res){
  const p=M.views[0].payload;
  if(res!=='win'||!p){ popText('ざんねん…',CW/2,TOP+GH*.4,'#ccc',34,1); return; }
  const cx=CW/2, cy=TOP+GH*.4;
  switch(p.k){
    case 'life': if(R.lives<R.maxLives) R.lives++; else R.score+=1000; banner('❤️ ライフ+1','#ff6a8a','','',1.2); sfx('heal'); break;
    case 'gem': R.score+=p.v||1500; banner('💎 +'+(p.v||1500).toLocaleString(),'#2ee6d6','','',1.2); sfx('coin'); break;
    case 'fever': startFever(); break;
    case 'shield': R.shield++; banner('🛡 シールド獲得','#4aa8ff','次のミスを1回ガード','',1.2); sfx('heal'); break;
    case 'combo': R.combo+=5; R.maxCombo=Math.max(R.maxCombo,R.combo); banner('🍀 コンボ+5','#4fe08a','','',1.2); sfx('heal'); break;
    case 'chest': R.pending='chest'; banner('🎁 宝箱チャンス！','#ffd23f','','',1.0); break;
  }
  confetti(cx,cy,70,1.2);
}

/* ---------- per-frame update ---------- */
function step(dt){
  dt=Math.min(dt,.2); let left=dt;
  while(left>1e-9){ const d=Math.min(left,1/60); sub(d); left-=d; }
}
function sub(dt){
  S.time+=dt; fxUpdate(dt);
  if(S.scene==='play'&&M) playUpdate(dt);
  else if(S.scene==='over'&&S.auto){ S.overT+=dt; if(S.overT>2.2) startRun(); }
}
function viewUpdate(v,dt){
  if(v.res!==null){ if(v.o.post) v.o.post(dt); return; }
  while(v.q.length&&v.q[0].at<=v.t) { const e=v.q.shift(); deliver(v,e.type,e.x,e.y); }
  v.t+=dt;
  if(v.nope){ v.o.update&&v.o.update(dt); return; }
  if((S.auto||S.bot)&&v.o.ai) v.o.ai(dt);
  if(v.res===null&&v.o.update) v.o.update(dt);
  if(v.res===null&&v.t>=v.dur) v.res=v.def.survive?'win':'fail';
}
function playUpdate(dt){
  if(M.state==='run'){
    M.t+=dt;
    for(const v of M.views) viewUpdate(v,dt);
    if(M.nope){ if(M.touched) endSlot('fail'); else if(M.t>=M.dur) endSlot('win'); return; }
    if(M.views.some(v=>v.res==='fail')) endSlot('fail');
    else if(M.views.every(v=>v.res==='win')) endSlot('win');
  } else {
    M.stampT+=dt; M.gapT-=dt; for(const v of M.views) if(v.o.post) v.o.post(dt);
    if(M.gapT<=0){ if(R.dead) showOver(); else if(!S.test) nextSlot(); else M.gapT=1e9; }
  }
}

/* ---------- rendering ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), box=$('box');
function drawBg(c){
  const lv=R?R.level:0, hue=(250+lv*14)%360, tm=S.time;
  const gr=c.createLinearGradient(0,0,0,CH); gr.addColorStop(0,`hsl(${hue},55%,17%)`); gr.addColorStop(1,`hsl(${(hue+40)%360},60%,10%)`);
  c.fillStyle=gr; c.fillRect(0,0,CW,CH);
  c.globalAlpha=.09;
  for(let i=0;i<10;i++){ const x=(i*97+tm*8*(1+i%3))%(CW+80)-40, y=CH-((i*131+tm*(14+i*3))%(CH+80))+40; disc(c,x,y,20+(i%4)*14,`hsl(${(hue+i*36)%360},80%,60%)`); }
  c.globalAlpha=1;
  if(R&&R.fever>0&&S.scene==='play'){
    for(let i=0;i<9;i++){ c.fillStyle=`hsla(${(i*40+tm*50)%360},90%,55%,.30)`; c.beginPath(); const x0=i*70-120+((tm*40)%70); c.moveTo(x0,0); c.lineTo(x0+50,0); c.lineTo(x0+50-260,CH); c.lineTo(x0-260,CH); c.closePath(); c.fill(); }
  }
}
function drawTitleDeco(c){
  const ic=['🎈','🧺','🎯','🐹','🚀','🍣','🐶','☄️','🔑','🍜','🎰','🪙','⭐','💎','🌈','🎁'];
  for(let i=0;i<16;i++){ const x=(i*83+Math.sin(S.time*.6+i)*30)%CW, y=CH-((i*117+S.time*(30+i*4))%(CH+60))+30; c.globalAlpha=.55; emo(c,ic[i],x,y,34+(i%3)*10,Math.sin(S.time+i)*.4); }
  c.globalAlpha=1;
}
function drawView(c,v){
  const r=v.rect; c.save(); c.translate(r.x,r.y); c.beginPath(); c.rect(0,0,r.w,r.h); c.clip();
  c.fillStyle='#2a1a52'; c.fillRect(0,0,r.w,r.h);
  c.save(); const m=v.mat; c.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
  if(M.muts.includes('shake')&&M.state==='run') c.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  c.save(); c.beginPath(); c.rect(0,0,v.g.W,v.g.H); c.clip();
  c.fillStyle=v.def.bg||'#fff'; c.fillRect(0,0,v.g.W,v.g.H);
  const blur=M.muts.includes('blur'); if(blur&&'filter' in c) c.filter='blur(2.5px)';
  try{ v.o.draw(c); }catch(e){ if(!S.err){ S.err=e; console.error(e); } }
  if(blur&&'filter' in c) c.filter='none';
  if(blur&&!('filter' in c)){ c.fillStyle='rgba(255,255,255,.35)'; c.fillRect(0,0,v.g.W,v.g.H); }
  if(M.muts.includes('gray')){ c.globalCompositeOperation='saturation'; c.fillStyle='#000'; c.fillRect(0,0,v.g.W,v.g.H); c.globalCompositeOperation='source-over'; }
  if(v.cur.vis&&!M.nope){ c.globalAlpha=v.cur.on?.55:.3; disc(c,v.cur.x,v.cur.y,15,'#fff','#1b1038',2); c.globalAlpha=1; }
  c.restore(); c.restore();
  if(M.muts.includes('dark')){
    const R0=96, gr=c.createRadialGradient(v.light.x,v.light.y,R0*.5,v.light.x,v.light.y,R0);
    gr.addColorStop(0,'rgba(8,4,20,0)'); gr.addColorStop(1,'rgba(8,4,20,.94)'); c.fillStyle=gr; c.fillRect(0,0,r.w,r.h);
  }
  if(M.gold){ c.fillStyle='rgba(255,215,0,.16)'; c.fillRect(0,0,r.w,r.h); c.strokeStyle='#ffd23f'; c.lineWidth=6; c.strokeRect(3,3,r.w-6,r.h-6); }
  if(v.res==='win'&&M.defs.length>1){ txt(c,'✓',r.w-26,26,34,'#4fe08a'); }
  if(M.nope&&M.state==='run'){ c.globalAlpha=.5+.2*Math.sin(S.time*5); txt(c,'🚫',r.w/2,r.h/2,96,'#fff',{stroke:0}); c.globalAlpha=1; }
  c.restore();
}
function drawSlot(c){
  const m=M;
  for(const v of m.views) drawView(c,v);
  if(m.defs.length===2){ c.fillStyle='#1b1038'; c.fillRect(0,TOP+278,GW,4); }
  // frame
  c.lineWidth=6;
  if(R.fever>0){ const gr=c.createLinearGradient(0,0,CW,0); for(let i=0;i<=6;i++) gr.addColorStop(i/6,`hsl(${(i*60+S.time*60)%360},95%,60%)`); c.strokeStyle=gr; c.strokeRect(3,TOP+3,CW-6,GH-6); c.globalAlpha=.10; c.fillStyle=gr; c.fillRect(0,TOP,CW,GH); c.globalAlpha=1; }
  else if(m.boss){ c.strokeStyle='#ff4d6d'; c.globalAlpha=.7+.3*Math.sin(S.time*3); c.strokeRect(3,TOP+3,CW-6,GH-6); c.globalAlpha=1; }
  drawHud(c);
}
function drawHud(c){
  const m=M;
  c.fillStyle='rgba(12,6,30,.55)'; c.fillRect(0,0,CW,TOP);

/* 7 なぞれ */
function bez(p0,p1,p2,p3,t){ const u=1-t; return {x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}; }
def('trace',{name:'なぞり線',icon:'〰️',cmd:'なぞれ！',desc:'スタートからゴールまで、道からはみ出さずになぞる。',dur:5,unlock:0,bg:'#f1ffe6',noside:false},g=>{
  const vert=g.H>=480&&g.rnd()<.4, N=90, pts=[];
  let p0,p3,p1,p2;
  if(vert){ p0={x:60+g.rnd()*(g.W-120),y:50}; p3={x:60+g.rnd()*(g.W-120),y:g.H-50}; p1={x:30+g.rnd()*(g.W-60),y:g.H*.33}; p2={x:30+g.rnd()*(g.W-60),y:g.H*.66}; }
  else { p0={x:42,y:g.H*(.2+g.rnd()*.6)}; p3={x:g.W-42,y:g.H*(.2+g.rnd()*.6)}; p1={x:g.W*.33,y:g.H*(.08+g.rnd()*.84)}; p2={x:g.W*.66,y:g.H*(.08+g.rnd()*.84)}; }
  for(let i=0;i<=N;i++) pts.push(bez(p0,p1,p2,p3,i/N));
  let plen=0; for(let i=1;i<=N;i++) plen+=hyp(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  const tol=30*Math.sqrt(g.big)*(g.big<1?.9:1); let on=false, idx=0, ax=0, af=0, started=false;
  const near=(x,y)=>{ let d=1e9,j=0; for(let i=0;i<=N;i++){ const e=hyp(x-pts[i].x,y-pts[i].y); if(e<d){ d=e; j=i; } } let ds=1e9; for(let i=0;i<N;i++) ds=Math.min(ds,segDist(x,y,pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y)); return {d:ds,j}; };
  return {
    down(x,y){ if(hyp(x-p0.x,y-p0.y)<46){ on=true; idx=0; g.sfx('tap'); } else g.sfx('tap'); },
    move(x,y){ if(!on) return; const n=near(x,y); if(n.d>tol){ on=false; g.sfx('bad'); g.finish(false); return; }
      if(n.j<=idx+22) idx=Math.max(idx,n.j); if(idx>=N-3&&hyp(x-p3.x,y-p3.y)<50){ g.sfx('ok',3); g.burst(p3.x,p3.y,24); g.finish(true); } },
    up(){ if(on){ on=false; idx=0; } },
    draw(c){ c.lineCap='round'; c.lineJoin='round'; c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.strokeStyle='#cfe8b5'; c.lineWidth=tol*2; c.stroke();
      c.setLineDash([2,14]); c.strokeStyle='#5b8c3a'; c.lineWidth=4; c.stroke(); c.setLineDash([]);
      if(idx>0){ c.beginPath(); for(let i=0;i<=idx;i++) i?c.lineTo(pts[i].x,pts[i].y):c.moveTo(pts[i].x,pts[i].y); c.strokeStyle='#ff4f9a'; c.lineWidth=10; c.stroke(); }
      disc(c,p0.x,p0.y,24,'#4fe08a','#1b1038',4); txt(c,'S',p0.x,p0.y,20,'#fff',{stroke:0}); emo(c,'🏁',p3.x,p3.y,48); },
    ai(dt){ const sp=1800*g.aiSpeed;
      if(!started){ started=true; g.in.down(p0.x,p0.y); }
      af=Math.min(N,af+sp*dt/(plen/N)); const i=Math.floor(af), q=pts[Math.min(N,i)]; g.in.move(q.x,q.y); if(af>=N&&g.due({},.5)){ g.in.move(p3.x,p3.y); } }
  };
});

/* 8 迷路 */
def('maze',{name:'一筆迷路',icon:'🌀',cmd:'ぬけろ！',desc:'壁にふれずに、スタートからゴールまで一筆で。',dur:5.8,unlock:0,bg:'#2a2250',nosplit:true,noside:false},g=>{
  const cols=4, rows=5, cs=Math.min((g.W-50)/cols,(g.H-70)/rows), ox=(g.W-cols*cs)/2, oy=(g.H-rows*cs)/2, hw=Math.min(cs*.36,20*(g.big>1?1.35:g.big<1?.72:1));
  const links=Array.from({length:cols*rows},()=>[]), vis=Array(cols*rows).fill(false), st=[0]; vis[0]=true;
  while(st.length){ const cur=st[st.length-1], x=cur%cols, y=Math.floor(cur/cols), nb=[]; if(x>0)nb.push(cur-1); if(x<cols-1)nb.push(cur+1); if(y>0)nb.push(cur-cols); if(y<rows-1)nb.push(cur+cols);
    const cand=nb.filter(n=>!vis[n]); if(!cand.length){ st.pop(); continue; } const n=cand[Math.floor(g.rnd()*cand.length)]; links[cur].push(n); links[n].push(cur); vis[n]=true; st.push(n); }
  const ctr=i=>({x:ox+(i%cols+.5)*cs,y:oy+(Math.floor(i/cols)+.5)*cs}), rects=[];
  for(let i=0;i<cols*rows;i++){ const a=ctr(i); rects.push([a.x-hw,a.y-hw,hw*2,hw*2]); for(const j of links[i]) if(j>i){ const b=ctr(j); rects.push([Math.min(a.x,b.x)-hw,Math.min(a.y,b.y)-hw,Math.abs(a.x-b.x)+hw*2,Math.abs(a.y-b.y)+hw*2]); } }
  const inside=(x,y)=>rects.some(r=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]);
  const goal=ctr(cols*rows-1), start=ctr(0);
  // BFS path
  const prev=Array(cols*rows).fill(-1); prev[0]=0; const qu=[0]; while(qu.length){ const u=qu.shift(); for(const v of links[u]) if(prev[v]<0){ prev[v]=u; qu.push(v); } }
  const path=[]; for(let u=cols*rows-1;u!==0;u=prev[u]) path.push(ctr(u)); path.push(start); path.reverse();
  let on=false, ai_i=0, ai_p={x:start.x,y:start.y}, started=false;
  return {
    down(x,y){ if(hyp(x-start.x,y-start.y)<hw+16){ on=true; g.sfx('tap'); } },
    move(x,y){ if(!on) return; if(!inside(x,y)){ on=false; g.sfx('bad'); g.finish(false); return; } if(hyp(x-goal.x,y-goal.y)<hw){ g.sfx('ok',3); g.burst(goal.x,goal.y,24); g.finish(true); } },
    up(){ on=false; },
    draw(c){ c.fillStyle='#fff7d6'; for(const r of rects) c.fillRect(r[0],r[1],r[2],r[3]);
      disc(c,start.x,start.y,hw*.8,'#4fe08a','#1b1038',3); txt(c,'S',start.x,start.y,16,'#fff',{stroke:0}); emo(c,'🏁',goal.x,goal.y,hw*1.9); },
    ai(dt){ if(!started){ started=true; g.in.down(start.x,start.y); }
      let rem=1700*g.aiSpeed*dt; while(rem>0&&ai_i<path.length-1){ const t=path[ai_i+1], d=hyp(t.x-ai_p.x,t.y-ai_p.y); if(d<=rem){ ai_p={x:t.x,y:t.y}; rem-=d; ai_i++; } else { ai_p={x:ai_p.x+(t.x-ai_p.x)/d*rem,y:ai_p.y+(t.y-ai_p.y)/d*rem}; rem=0; } }
      g.in.move(ai_p.x,ai_p.y); }
  };
});

/* 9 弾よけ (ボスと共用) */
function dodgeCore(g,boss){
  const pr=8, br=9*Math.min(1.4,Math.max(.85,g.big)), bl=[], reach0=1e9;
  let px=g.W/2, py=g.H-70, acc=.3, ang=0, acc2=1.2, sentX=px, sentY=py, started=false;
  const bx0=g.W/2, by0=70;
  const spawnRain=()=>{ const side=g.rnd()<.2; if(side){ const l=g.rnd()<.5; bl.push({x:l?-8:g.W+8,y:g.rnd()*g.H*.5,vx:(l?1:-1)*(120+g.rnd()*70)*g.sp,vy:(40+g.rnd()*60)*g.sp}); }
    else { const vy=(165+g.rnd()*90)*g.sp, x=g.rnd()*g.W; if(g.rnd()<.35){ const tt=(py+10)/vy; bl.push({x,y:-10,vx:clamp((px-x)/tt,-220,220),vy}); } else bl.push({x,y:-10,vx:(g.rnd()-.5)*70,vy}); } };
  const rate=boss?0:Math.min(11,5.4*Math.pow(g.sp,.8))*(g.H<400?.8:1);
  function sim(b,t){ return {x:b.x+b.vx*t,y:b.y+b.vy*t}; }
  return {
    down(x,y){ px=clamp(x,pr,g.W-pr); py=clamp(y,pr,g.H-pr); }, move(x,y){ px=clamp(x,pr,g.W-pr); py=clamp(y,pr,g.H-pr); },
    update(dt){
      if(!boss){ acc-=dt; while(acc<=0){ spawnRain(); acc+=1/rate*(.7+g.rnd()*.6); } }
      else { acc-=dt; const k=Math.pow(g.sp,.5); while(acc<=0){ for(let a=0;a<2;a++){ const an=ang+a*Math.PI, v=150*Math.pow(g.sp,.8); bl.push({x:bx0,y:by0,vx:Math.cos(an)*v,vy:Math.sin(an)*v}); } ang+=.55; acc+=.1/k; }
        acc2-=dt; if(acc2<=0){ const an=Math.atan2(py-by0,px-bx0), v=210*Math.pow(g.sp,.7); bl.push({x:bx0,y:by0,vx:Math.cos(an)*v,vy:Math.sin(an)*v}); acc2=1.3/k; } }
      for(let i=bl.length-1;i>=0;i--){ const b=bl[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.y>g.H+20||b.x<-30||b.x>g.W+30||b.y<-30) { bl.splice(i,1); continue; }
        if(hyp(b.x-px,b.y-py)<pr+br*.85){ g.sfx('hit'); g.burst(px,py,24,1); g.finish(false); return; } }
    },
    draw(c){ if(boss){ emo(c,'🐙',bx0,by0,84+Math.sin(g.t*4)*4); }
      for(const b of bl){ disc(c,b.x,b.y,br,'#ff4f9a','#fff',3); }
      emo(c,'🚀',px,py+2,38,-Math.PI/4*0); disc(c,px,py,3,'#2ee6d6'); },
    ai(dt){
      if(!started){ started=true; g.in.down(sentX,sentY); }
      const L=g.lead, vmax=g.human?520*g.aiSpeed*2:1e9, reach=g.human?vmax*.6:1e9;
      const times=[L,L+.07,L+.14,L+.21,L+.3,L+.4];
      const pos=bl.map(b=>times.map(t=>sim(b,t)));
      const score=(x,y)=>{ let m=80; for(let i=0;i<pos.length;i++){ for(let k=0;k<times.length;k++){ const d=hyp(pos[i][k].x-x,pos[i][k].y-y)-br-pr; if(d<m) m=d; } } return m; };
      let bx=sentX, by=sentY, cur=score(sentX,sentY);
      if(cur<34){ let bs=-1e9;
        for(let x=pr+26;x<=g.W-pr-26;x+=22) for(let y=boss?120:Math.min(g.H*.3,70);y<=g.H-pr;y+=22){ const dd=hyp(x-sentX,y-sentY); if(dd>reach) continue; const s=Math.min(score(x,y),60)-dd*.02+y*.01; if(s>bs){ bs=s; bx=x; by=y; } } }
      const dx=bx-sentX, dy=by-sentY, d=hyp(dx,dy), stepMax=g.human?vmax*dt:1e9;
      if(d>0.5){ const f=Math.min(1,stepMax/d); sentX+=dx*f; sentY+=dy*f; g.in.move(sentX,sentY); }
    }
  };
}

def('sushi',{name:'寿司キャッチ',icon:'🍣',cmd:'とれ！',desc:'回るレーンから、指定された寿司だけを2皿とる。',dur:4.4,unlock:0,bg:'#fde7d9'},g=>{

function slashCore(g,o){
  const n=o.n, vy=o.vy*Math.pow(g.sp,.8), r=26*g.big, fall=g.H/vy;

  let cut=0, landed=0, last=null, down=false;
  const slice=(x0,y0,x1,y1)=>{ for(const m of ms) if(m.on&&!m.dead&&segDist(m.x,m.y,x0,y0,x1,y1)<r+10){ m.dead=true; cut++; g.sfx('pop',cut+1); g.burst(m.x,m.y,12,.7); g.ring(m.x,m.y,'#fff'); if(cut>=n) g.finish(true); } };
  return {
    down(x,y){ down=true; last={x,y}; slice(x,y,x,y); }, move(x,y){ if(!down) return; slice(last.x,last.y,x,y); last={x,y}; }, up(){ down=false; last=null; },
    update(dt){ for(const m of ms){ if(!m.on&&g.t>=m.t0){ m.on=true; if(o.boss) m.x=clamp(g.W/2+Math.sin(m.t0*1.7)*(g.W*.38),r+10,g.W-r-10); }

    draw(c){ if(o.boss) emo(c,'🐉',g.W/2+Math.sin(g.t*1.3)*g.W*.3,40,76); c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(0,g.H-18,g.W,18);
      for(const m of ms){ if(!m.on) continue; if(m.dead&&!m.landed){ continue; } if(m.landed) continue; emo(c,o.boss?'🔥':'☄️',m.x,m.y,r*2.3,Math.PI*.25*0); }
      txt(c,cut+'/'+n,g.W/2,g.H-34,22,'#fff'); },
    ai(){ for(const m of ms) if(m.on&&!m.dead&&m.y>r*.2&&g.due(m)){ const y=m.y+vy*g.lead; g.in.down(m.x-r*1.3-10,y); g.in.move(m.x+r*1.3+10,y); g.in.up(m.x+r*1.3+10,y); } }
  };
}

        c.save(); c.rotate((i+.5)*sg); emo(c,segs[i].e,rw*.66,0,rw*.3,Math.PI/2); c.restore(); } c.restore();

function buildCodex(){
  const gl=gamesList(), bosses=DEFS.filter(d=>d.boss);
  const card=(d)=>{ const seen=prog.seen[d.id], un=d.boss||unlockedDef(d);
    if(seen) return `<div class="cc"><div class="i">${d.icon}</div><div class="n">${d.name}</div><div class="s">「${d.cmd}」<br>${d.desc}</div></div>`;
    if(un) return `<div class="cc unseen"><div class="i">${d.icon}</div><div class="n">？？？</div><div class="s">まだ見ていない</div></div>`;
    return `<div class="cc lock unseen"><div class="i">🔒</div><div class="n">？？？</div><div class="s">あと${d.unlock-prog.total}本クリアで解禁</div></div>`; };
  const mcard=(m)=>{ const seen=prog.mseen[m.id], un=unlockedMut(m);
    if(seen) return `<div class="cc"><div class="i">${m.icon}</div><div class="n">${m.name}</div><div class="s">${m.desc}</div></div>`;
    if(un) return `<div class="cc unseen"><div class="i">${m.icon}</div><div class="n">？？？</div><div class="s">まだ見ていない</div></div>`;
    return `<div class="cc lock unseen"><div class="i">🔒</div><div class="n">？？？</div><div class="s">あと${m.unlock-prog.total}本クリアで解禁</div></div>`; };
  const sg=gl.filter(d=>prog.seen[d.id]).length, sb=bosses.filter(d=>prog.seen[d.id]).length, sm=MUTS.filter(m=>prog.mseen[m.id]).length;
  $('codexBody').innerHTML=`<h3>🎮 マイクロゲーム ${sg}/${gl.length}</h3><div class="cg">${gl.map(card).join('')}</div><h3>👹 ボス ${sb}/${bosses.length}</h3><div class="cg">${bosses.map(card).join('')}</div><h3>🌀 ミューテーター ${sm}/${MUTS.length}</h3><div class="cg">${MUTS.map(mcard).join('')}</div><p class="how" style="margin:10px 0 4px">通算クリア ${prog.total} 本。遊ぶほど新しいゲームとルールが解禁されるよ。</p>`;

const BOT_DEFAULT={lagMin:.25,lagMax:.4,miss:.06,sigma:.05,rate:7,speed:.4,jit:5};
function playSlot(ids,muts,o){
  o=o||{}; S.test=true; if(!R||R.dead||S.scene!=='play'){ const keep=S.force; startRun(); }
  R.dead=false; R.lives=4; R.level=o.level||0; S.err=null;
  const defs=[].concat(ids).map(id=>DEFS.find(d=>d.id===id));
  if(muts&&muts.includes('split')&&defs.length<2){ const pool=DEFS.filter(d=>!d.boss&&!d.inter&&!d.nosplit&&d.id!==defs[0].id); defs.push(pick(pool)); }
  M=mkSlot({defs,muts:muts||[],gold:!!o.gold,level:o.level||0});
  return M;
}
function runOne(ids,muts,o){
  o=o||{}; if(o.seed!=null) seedV=o.seed>>>0;
  if(o.bot) S.bot=Object.assign({},BOT_DEFAULT,o.bot===true?{}:o.bot); else S.bot=null;
  S.auto=!o.bot&&o.auto!==false;
  playSlot(ids,muts,o);
  const maxT=(o.maxT||40);
  let guard=0; while(M.state==='run'&&M.t<maxT&&guard++<60*maxT+50){ step(1/60); if(o.render&&guard%7===0) render(); }
  if(o.render) render();
  if(M.state==='run') endSlot('fail');
  const r={res:M.res,t:+M.t.toFixed(2),dur:+M.dur.toFixed(2),err:S.err?String(S.err.message||S.err):null,id:[].concat(ids).join('+'),muts:(muts||[]).join('+'),views:M.views.map(v=>v.res)};
  S.bot=null; return r;
}
function runGame(o){ // whole-run simulation without rendering
  o=o||{}; if(o.seed!=null) seedV=o.seed>>>0;
  S.test=false; S.force={game:null,muts:null,gold:null}; S.forceKeep=false;
  if(o.bot) S.bot=Object.assign({},BOT_DEFAULT,o.bot===true?{}:o.bot); else S.bot=null;
  S.auto=!o.bot; S.invincible=!!o.invincible;
  if(o.total!=null) prog.total=o.total;
  startRun(); const maxN=o.maxN||200, maxT=o.maxT||4000; let t=0;
  while(!R.dead&&R.n<maxN&&t<maxT){ step(1/30); t+=1/30; if(S.scene==='over') break; }
  const out={n:R.n,lives:R.lives,dead:R.dead,score:R.score,maxCombo:R.maxCombo,t:Math.round(t),ev:R.ev,newU:R.newU,fails:R.log.filter(l=>l.res==='fail').map(l=>l.id+(l.muts?'['+l.muts+']':'')+'@'+l.n),err:S.err?String(S.err.message||S.err):null};
  S.bot=null; S.invincible=false; return out;
}
window.__dopamine={
  get S(){ return S; }, get R(){ return R; }, get M(){ return M; }, get prog(){ return prog; }, get best(){ return best; },
  get state(){ return {scene:S.scene,auto:S.auto,n:R?R.n:0,lives:R?R.lives:0,score:R?R.score:0,combo:R?R.combo:0,fever:R?R.fever:0,level:R?R.level:0,bpm:S.bpm,muted,game:M?M.defs.map(d=>d.id):null,muts:M?M.muts:null,phase:M?M.state:null,res:M?M.res:null,boss:M?M.boss:false,gold:M?M.gold:false}; },
  defs:DEFS.map(d=>({id:d.id,boss:!!d.boss,inter:!!d.inter,unlock:d.unlock,nosplit:!!d.nosplit})), muts:MUTS.map(m=>m.id),
  step, render, setAuto, setMute, seed:n=>{ seedV=n>>>0; }, startRun, showTitle, openCodex, closeCodex, buildCodex,
  setBot:cfg=>{ S.bot=cfg?Object.assign({},BOT_DEFAULT,cfg===true?{}:cfg):null; },
  force:(game,muts,gold,keep,game2)=>{ S.force={game,muts,gold,game2}; S.forceKeep=!!keep; },
  clearForce:()=>{ S.force={game:null,muts:null,gold:null}; S.forceKeep=false; },
  unlockAll:()=>{ prog.total=9999; }, setTotal:n=>{ prog.total=n; }, setLevelN:n=>{ if(R) R.n=n; },
  setLives:n=>{ if(R) R.lives=n; }, startFever:()=>{ if(R) startFever(); }, setInvincible:v=>{ S.invincible=!!v; },
  playSlot, runOne, runGame, endSlot, banner,
  press:(x,y)=>inputDown(x,y), release:(x,y)=>inputUp(x,y), moveTo:(x,y)=>inputMove(x,y,true),
  resetProgress:()=>{ prog.total=0; prog.seen={}; prog.mseen={}; best.n=0; best.score=0; best.combo=0; }
};

/* ---------- boot ---------- */
setMute(muted);
resize();
if(window.ResizeObserver) new ResizeObserver(resize).observe($('wrap'));
showTitle();
requestAnimationFrame(frame);
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
