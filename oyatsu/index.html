<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="コーギーが庭に埋めたおやつを守るマインスイーパ風パズル">
<title>コーギーのおやつかくし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --bg:#EAF4DC; --ink:#3E2A1C; --mute:#7F6A55; --card:#FFFBF2;
  --grass:#7CC56A; --grass2:#5FAE52; --soil:#B7864F; --soil2:#9A6C3C; --dug:#EDD5AE; --dug2:#E2C497;
  --orange:#EE9A3E; --orange2:#C9761F;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;max-width:560px;margin:0 auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px}
#top{display:flex;align-items:center;gap:8px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800}
#top h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:800}
.mini{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:999px;padding:6px 10px;background:var(--card);color:var(--ink);box-shadow:0 2px 0 #CBD9B6;cursor:pointer}
.mini:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 #CBD9B6}
.stat{display:flex;flex-direction:column}
.stat.r{align-items:flex-end}
.lbl{font-size:10px;font-weight:800;color:var(--mute);letter-spacing:.06em}
.val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#corgiBtn{border:0;background:none;padding:0;cursor:pointer;width:68px;height:60px;border-radius:12px}
#corgiBtn:focus-visible{outline:3px solid var(--orange)}
#corgi{width:68px;height:60px;display:block}
#msg{text-align:center;font-size:12px;font-weight:800;color:var(--mute);min-height:18px}
#wrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;position:relative}
#board{position:relative;display:grid;gap:2px;padding:6px;background:#6E4A2A;border-radius:14px;box-shadow:0 5px 0 #4E331C;touch-action:manipulation}
.c{position:relative;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;
  background:linear-gradient(var(--grass) 0 30%,var(--grass2) 30% 38%,var(--soil) 38%);box-shadow:inset 0 -3px 0 var(--soil2)}
.c.alt{background:linear-gradient(#86CD73 0 30%,#66B558 30% 38%,#BE8C55 38%)}
.c:active:not(.o){filter:brightness(.92)}
.c.o{background:var(--dug);box-shadow:inset 0 2px 0 var(--dug2);cursor:default}
.c.o.alt{background:#F0DAB5}
.c.f::before{content:"";position:absolute;left:12%;right:12%;bottom:14%;height:52%;border-radius:50% 50% 30% 30%;
  background:radial-gradient(circle at 40% 35%,#8A5A2E,#5C3A1B);box-shadow:0 2px 0 #3E2712}
.c.f::after{content:"🐾";position:relative;font-size:.62em;margin-top:6%}
.c.t{background:#F6C9A0}
.c.boom{background:#FF8A7A}
.c.wrong::after{content:"✖";color:#C0392B;font-size:.8em;position:relative}
.n1{color:#2F6FD6}.n2{color:#2E8B3E}.n3{color:#D6412F}.n4{color:#6B3FB8}.n5{color:#8B2A1A}.n6{color:#138F8A}.n7{color:#222}.n8{color:#777}
.dog{position:absolute;pointer-events:none;transition:left .9s ease-in,top .9s ease-in;z-index:3;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.dog.eat{animation:munch .25s ease-in-out infinite alternate}
@keyframes munch{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-2px)}}
#mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb{font:inherit;font-weight:800;font-size:16px;height:52px;border:0;border-radius:14px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 4px 0 #CBD9B6}
.mb small{display:block;font-size:10px;color:var(--mute)}
.mb[aria-pressed=true]{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange2)}
.mb[aria-pressed=true] small{color:#FFE7CC}
.mb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;background:rgba(62,42,28,.55);overflow:auto;z-index:10;border-radius:14px}
.card{background:var(--card);border-radius:18px;padding:18px 16px;width:100%;max-width:340px;margin:auto;text-align:center;box-shadow:0 6px 0 #4E331C}
.card h2{margin:0 0 6px;font-size:23px;font-weight:800;line-height:1.3}
.card p{margin:6px 0;font-size:13px;line-height:1.6;color:var(--mute)}
.card ul{text-align:left;margin:8px 0;padding-left:1.2em;font-size:12.5px;line-height:1.65}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.seg button{font:inherit;font-weight:800;font-size:13px;padding:8px 0;border:2px solid #E3D6BF;border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.seg button span{display:block;font-size:10px;font-weight:500;opacity:.75}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.go{font:inherit;font-weight:800;font-size:17px;width:100%;height:50px;border:0;border-radius:14px;cursor:pointer;margin-top:6px;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange2)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange2)}
.go.alt{background:#E9DFCB;color:var(--ink);box-shadow:0 4px 0 #CDBFA4}
.go:focus-visible,.seg button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.big{font-size:40px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>おやつかくし</h1>
    <button class="mini" id="muteBtn">音 ON</button>
    <button class="mini" id="menuBtn">庭をえらぶ</button>
  </div>

  <div id="bar">
    <div class="stat"><span class="lbl">かくれたおやつ</span><span class="val">🦴<span id="left">0</span></span></div>
    <button id="corgiBtn" aria-label="はじめからやり直す"><canvas id="corgi" width="136" height="120"></canvas></button>
    <div class="stat r"><span class="lbl">タイム</span><span class="val" id="time">0</span></div>
  </div>
  <div id="msg">くんくん…どこにうめたっけ？</div>

  <div id="wrap">
    <div id="board" role="grid" aria-label="庭"></div>

    <div class="ov" id="titleOv">
      <div class="card">
        <h2>コーギーのおやつかくし</h2>
        <p>庭にうめたおやつ、ほかの犬に見つからないように守ろう！</p>
        <ul>
          <li>タップで土を<b>ほる</b>。数字は、まわり8マスにうまっている<b>おやつの数</b>（コーギーは鼻がいい！）</li>
          <li>おやつがあると思ったら<b>土をかけ直す</b>🐾（長押し・右クリック・下の「うめる」）</li>
          <li>おやつをほり出しちゃうと、ほかの犬に食べられてゲームオーバー</li>
          <li>おやつ以外の土をぜんぶほったらクリア！</li>
        </ul>
        <div class="seg" id="diffs">
          <button data-d="0" aria-pressed="true">小さい庭<span>8×8・10こ</span></button>
          <button data-d="1" aria-pressed="false">ふつうの庭<span>9×12・18こ</span></button>
          <button data-d="2" aria-pressed="false">広い庭<span>10×16・32こ</span></button>
        </div>
        <button class="go" id="startBtn">ほりはじめる</button>
        <p id="bestTxt" style="font-size:12px"></p>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>

    <div class="ov" id="endOv" hidden>
      <div class="card">
        <h2 id="endTitle"></h2>
        <div class="big" id="endBig"></div>
        <p id="endText"></p>
        <button class="go" id="againBtn">もう一回</button>
        <button class="go alt" id="toMenuBtn">庭をえらぶ</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
  </div>

  <div id="mode">
    <button class="mb" id="digBtn" aria-pressed="true">⛏ ほる<small>タップでほる</small></button>
    <button class="mb" id="flagBtn" aria-pressed="false">🐾 うめる<small>タップで土をかけ直す</small></button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const DIFF=[{w:8,h:8,m:10,name:'小さい庭'},{w:9,h:12,m:18,name:'ふつうの庭'},{w:10,h:16,m:32,name:'広い庭'}];
const DOGS=['🐕','🐩','🐕‍🦺','🐶','🦮'];

// ---------- sound ----------
let AC=null, muted=false;
try{muted=localStorage.getItem('oyatsuMute')==='1';}catch(e){}
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type='square',vol=.05,slide=0,delay=0){
  if(muted)return; const a=ac(); if(!a)return;
  const t=a.currentTime+delay, o=a.createOscillator(), v=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d,freq,vol,delay=0){
  if(muted)return; const a=ac(); if(!a)return;
  const t=a.currentTime+delay, b=a.createBuffer(1,a.sampleRate*d,a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource(), f=a.createBiquadFilter(), v=a.createGain();
  s.buffer=b; f.type='lowpass'; f.frequency.value=freq; v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(v).connect(a.destination); s.start(t);
}
const sDig=()=>noise(.09,900,.25);
const sBigDig=()=>{ noise(.18,700,.3); tone(520,.08,'triangle',.04,1.4,.05); };
const sCover=()=>{ noise(.12,400,.3); tone(300,.06,'sine',.06,.7); };
const sUncover=()=>noise(.06,1200,.15);
const sWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.07,0,i*.12));
function sBarks(){ for(let i=0;i<4;i++){ const f=380+Math.random()*260; tone(f,.12,'sawtooth',.06,.55,i*.22); tone(f*1.1,.1,'sawtooth',.05,.55,i*.22+.13); } }
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{localStorage.setItem('oyatsuMute',m?'1':'0');}catch(e){} }
setMute(muted);

// ---------- corgi face ----------
const cg=$('corgi').getContext('2d');
function drawCorgi(mode){
  const c=cg, W=136, H=120; c.clearRect(0,0,W,H); c.save(); c.translate(W/2,H/2+8); const r=42;
  const fur='#EE9A3E', dark='#C06A1C', lite='#FFC98A';
  for(const k of [-1,1]){
    c.fillStyle=dark; c.beginPath(); c.moveTo(k*r*.92,-r*.2); c.lineTo(k*r*.8,-r*1.15); c.lineTo(k*r*.18,-r*.72); c.closePath(); c.fill();
    c.fillStyle='#FFC2C7'; c.beginPath(); c.moveTo(k*r*.76,-r*.38); c.lineTo(k*r*.7,-r*.94); c.lineTo(k*r*.36,-r*.66); c.closePath(); c.fill();
  }
  const gr=c.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.05); gr.addColorStop(0,lite); gr.addColorStop(.55,fur); gr.addColorStop(1,fur);
  c.fillStyle=gr; c.strokeStyle=dark; c.lineWidth=2.5; c.beginPath(); c.ellipse(0,r*.06,r,r*.88,0,0,Math.PI*2); c.fill(); c.stroke();
  c.fillStyle='#FFFDF8';
  c.beginPath(); c.moveTo(-r*.07,-r*.78); c.quadraticCurveTo(0,-r*.86,r*.07,-r*.78); c.lineTo(r*.2,-r*.05); c.lineTo(-r*.2,-r*.05); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(0,r*.4,r*.6,r*.42,0,0,Math.PI*2); c.fill();
  c.fillStyle='rgba(255,120,140,.35)'; for(const k of [-1,1]){ c.beginPath(); c.ellipse(k*r*.64,r*.3,r*.15,r*.1,0,0,Math.PI*2); c.fill(); }
  const ink='#2A1D1D'; c.strokeStyle=ink; c.fillStyle=ink; c.lineCap='round'; c.lineWidth=4; const ex=r*.38, ey=-r*.1;
  for(const k of [-1,1]){
    c.beginPath();
    if(mode==='happy'){ c.arc(k*ex,ey+r*.05,r*.12,Math.PI*1.1,Math.PI*1.9); c.stroke(); }
    else if(mode==='sniff'){ c.moveTo(k*ex-r*.12,ey); c.lineTo(k*ex+r*.12,ey); c.stroke(); }
    else if(mode==='sad'){ c.moveTo(k*ex-k*r*.14,ey-r*.1); c.lineTo(k*ex+k*r*.06,ey); c.lineTo(k*ex-k*r*.14,ey+r*.1); c.stroke(); }
    else{ c.arc(k*ex,ey,r*.12,0,Math.PI*2); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(k*ex+r*.04,ey-r*.05,r*.04,0,Math.PI*2); c.fill(); c.fillStyle=ink; }
  }
  if(mode==='sad'){ c.fillStyle='#6FB7FF'; c.beginPath(); c.ellipse(-ex,ey+r*.3,r*.07,r*.12,0,0,Math.PI*2); c.fill(); c.fillStyle=ink; }
  const ny=mode==='sniff'?r*.16:r*.2, nw=mode==='sniff'?r*.17:r*.14;
  c.beginPath(); c.ellipse(0,ny,nw,r*.1,0,0,Math.PI*2); c.fill();
  c.lineWidth=3;
  if(mode==='happy'){ c.fillStyle='#8B2E3A'; c.beginPath(); c.arc(0,r*.38,r*.16,0,Math.PI); c.fill(); c.fillStyle='#FF8FA0'; c.beginPath(); c.ellipse(0,r*.48,r*.09,r*.06,0,0,Math.PI*2); c.fill(); }
  else if(mode==='sad'){ c.beginPath(); c.arc(0,r*.5,r*.14,Math.PI*1.15,Math.PI*1.85); c.stroke(); }
  else{ c.beginPath(); c.moveTo(0,r*.28); c.lineTo(0,r*.36); c.arc(-r*.1,r*.36,r*.1,0,Math.PI*.9); c.moveTo(0,r*.36); c.arc(r*.1,r*.36,r*.1,Math.PI,Math.PI*.1,true); c.stroke(); }
  if(mode==='sniff'){ c.fillStyle=ink; c.font='800 14px "M PLUS Rounded 1c",sans-serif'; c.textAlign='left'; c.fillText('くん',r*.7,-r*.7); }
  c.restore();
}
let face='normal';
function setFace(f){ if(f!==face){ face=f; drawCorgi(f); } }

// ---------- state ----------
let diff=0, W, H, M, cells, state='title', firstDig, flagMode=false, t0=0, elapsed=0, timer=null, opened=0, flags=0, size=36;
const idx=(x,y)=>y*W+x;
function nbrs(i){ const x=i%W, y=(i/W)|0, out=[]; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue; const nx=x+dx, ny=y+dy; if(nx>=0&&nx<W&&ny>=0&&ny<H)out.push(idx(nx,ny)); } return out; }

function newGame(){
  const D=DIFF[diff]; W=D.w; H=D.h; M=D.m;
  cells=Array.from({length:W*H},()=>({t:false,n:0,o:false,f:false}));
  state='play'; firstDig=true; opened=0; flags=0; elapsed=0; clearInterval(timer); timer=null;
  $('time').textContent='0'; $('left').textContent=M; setFace('normal'); msg('くんくん…どこにうめたっけ？');
  for(const d of document.querySelectorAll('.dog'))d.remove();
  build(); $('titleOv').hidden=true; $('endOv').hidden=true;
}
function plant(safe){
  const ban=new Set([safe,...nbrs(safe)]);
  const pool=[...cells.keys()].filter(i=>!ban.has(i));
  for(let k=0;k<M;k++){ const j=k+Math.floor(Math.random()*(pool.length-k)); [pool[k],pool[j]]=[pool[j],pool[k]]; cells[pool[k]].t=true; }
  cells.forEach((c,i)=>{ c.n=nbrs(i).filter(j=>cells[j].t).length; });
}
function msg(s){ $('msg').textContent=s; }

// ---------- board DOM ----------
function build(){
  const b=$('board'); b.innerHTML='';
  b.style.gridTemplateColumns=`repeat(${W},${size}px)`; b.style.gridAutoRows=`${size}px`;
  cells.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='c'+(((i%W)+((i/W)|0))%2?' alt':'');
    el.style.fontSize=Math.round(size*.55)+'px'; el.dataset.i=i; el.setAttribute('role','gridcell');
    c.el=el; b.appendChild(el);
  });
}
function paint(i){
  const c=cells[i], el=c.el;
  el.classList.toggle('o',c.o); el.classList.toggle('f',c.f&&!c.o);
  el.className=el.className.replace(/\bn\d\b/g,'').trim();
  if(c.o){ if(c.t){ el.textContent='🦴'; el.classList.add('t'); } else if(c.n){ el.textContent=c.n; el.classList.add('n'+c.n); } else el.textContent=''; }
  else el.textContent='';
}
function layout(){
  if(!W)return;
  const wrap=$('wrap'), aw=wrap.clientWidth-12-4, ah=wrap.clientHeight-12-4;
  size=Math.max(22,Math.floor(Math.min((aw-(W-1)*2)/W,(ah-(H-1)*2)/H,52)));
  const b=$('board'); b.style.gridTemplateColumns=`repeat(${W},${size}px)`; b.style.gridAutoRows=`${size}px`;
  for(const c of cells) c.el.style.fontSize=Math.round(size*.55)+'px';
}
addEventListener('resize',layout);

// ---------- actions ----------
function dig(i){
  const c=cells[i]; if(state!=='play'||c.o||c.f)return;
  if(firstDig){ firstDig=false; plant(i); t0=performance.now(); timer=setInterval(tick,250); }
  if(c.t){ c.o=true; paint(i); c.el.classList.add('boom'); return lose(i); }
  const q=[i]; let n=0;
  while(q.length){ const j=q.pop(), d=cells[j]; if(d.o||d.f)continue; d.o=true; opened++; n++; paint(j); if(d.n===0) for(const k of nbrs(j)) if(!cells[k].o&&!cells[k].f&&!cells[k].t) q.push(k); }
  n>3?sBigDig():sDig();
  const hint=c.n===0?'ここのまわりには、おやつのにおいがしない':`くんくん…まわりに ${c.n}こ おやつのにおい！`;
  msg(hint);
  if(opened===W*H-M) win();
}
function chord(i){
  const c=cells[i]; if(!c.o||!c.n)return;
  const ns=nbrs(i), f=ns.filter(j=>cells[j].f).length;
  if(f!==c.n){ msg(`まわりに ${c.n}こ。土をかけたのは ${f}こ`); return; }
  for(const j of ns) if(!cells[j].o&&!cells[j].f){ dig(j); if(state!=='play')return; }
}
function toggleFlag(i){
  const c=cells[i]; if(state!=='play'||c.o)return;
  if(!c.f&&flags>=M){ msg('おやつの数より多くは うめられないよ'); return; }
  c.f=!c.f; flags+=c.f?1:-1; paint(i); c.f?sCover():sUncover();
  $('left').textContent=M-flags;
  if(c.f) msg('土をかけ直した！🐾');
}
function tick(){ elapsed=(performance.now()-t0)/1000; $('time').textContent=Math.floor(elapsed); }
function stopTimer(){ clearInterval(timer); timer=null; if(t0)elapsed=(performance.now()-t0)/1000; }

function win(){
  state='won'; stopTimer(); setFace('happy');
  cells.forEach((c,i)=>{ if(c.t&&!c.f){ c.f=true; paint(i); } }); $('left').textContent=0;
  const sec=Math.max(1,Math.round(elapsed));
  let best=0; try{ best=+localStorage.getItem('oyatsuBest'+diff)||0; if(!best||sec<best)localStorage.setItem('oyatsuBest'+diff,sec); }catch(e){}
  msg('ぜんぶのおやつを守りきった！'); sWin();
  setTimeout(()=>{
    $('endTitle').textContent='おやつを守りきった！🎉'; $('endBig').textContent=`${sec}秒`;
    $('endText').textContent=(!best||sec<best)?`${DIFF[diff].name}のベスト記録！`:`${DIFF[diff].name}のベスト ${best}秒`;
    $('endOv').hidden=false;
  },900);
}
function lose(i){
  state='lost'; stopTimer(); setFace('sad'); msg('あっ！ほり出しちゃった…においをかぎつけて、犬たちが来た！');
  cells.forEach((c,j)=>{ if(c.t&&!c.f){ c.o=true; paint(j); } else if(c.f&&!c.t) c.el.classList.add('wrong'); });
  sBarks();
  // other dogs run in and eat the uncovered treats
  const board=$('board'), br=board.getBoundingClientRect();
  const treats=cells.map((c,j)=>j).filter(j=>cells[j].t&&cells[j].o);
  treats.sort((a,b)=>(a===i?-1:b===i?1:0));
  treats.forEach((j,k)=>{
    const el=cells[j].el, r=el.getBoundingClientRect();
    const dog=document.createElement('div'); dog.className='dog'; dog.textContent=DOGS[k%DOGS.length];
    dog.style.fontSize=Math.round(size*.9)+'px';
    const side=k%4, bw=br.width, bh=br.height;
    const start=[[-size,Math.random()*bh],[bw,Math.random()*bh],[Math.random()*bw,-size],[Math.random()*bw,bh]][side];
    dog.style.left=start[0]+'px'; dog.style.top=start[1]+'px';
    if(start[0]<r.left-br.left) dog.style.transform='scaleX(-1)';
    board.appendChild(dog);
    setTimeout(()=>{ dog.style.left=(r.left-br.left)+'px'; dog.style.top=(r.top-br.top-size*.15)+'px'; },60+k*110);
    setTimeout(()=>{ dog.classList.add('eat'); el.textContent=''; el.classList.remove('t'); el.style.background='#E2C497'; },1000+k*110);
  });
  setTimeout(()=>{
    $('endTitle').textContent='ほかの犬に食べられちゃった…';
    $('endBig').textContent='🐕🦴💨';
    $('endText').textContent=`おやつ ${M}こ中、守れたのは ${cells.filter(c=>c.t&&c.f).length}こ。つぎは慎重にほろう。`;
    $('endOv').hidden=false;
  },1500+treats.length*110);
}

// ---------- input ----------
let press=null;
const board=$('board');
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.c'); if(!el||state!=='play')return;
  ac(); const i=+el.dataset.i;
  if(e.button===2){ e.preventDefault(); toggleFlag(i); return; }
  if(!cells[i].o) setFace('sniff');
  press={i,x:e.clientX,y:e.clientY,long:false,timer:setTimeout(()=>{ if(press&&!cells[i].o){ press.long=true; toggleFlag(i); if(navigator.vibrate)navigator.vibrate(20); setFace('normal'); } },420)};
});
board.addEventListener('pointermove',e=>{ if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>12){ clearTimeout(press.timer); press=null; if(state==='play')setFace('normal'); } });
function release(e){
  if(!press)return; clearTimeout(press.timer); const p=press; press=null;
  if(state==='play') setFace('normal');
  if(p.long||e.type==='pointercancel')return;
  const c=cells[p.i];
  if(c.o) chord(p.i);
  else if(flagMode) toggleFlag(p.i);
  else dig(p.i);
}
board.addEventListener('pointerup',release); board.addEventListener('pointercancel',release);
board.addEventListener('contextmenu',e=>e.preventDefault());
function setMode(f){ flagMode=f; $('digBtn').setAttribute('aria-pressed',!f); $('flagBtn').setAttribute('aria-pressed',f); }
$('digBtn').onclick=()=>setMode(false); $('flagBtn').onclick=()=>setMode(true);
addEventListener('keydown',e=>{ if(e.code==='KeyF'||e.code==='Space'){ e.preventDefault(); setMode(!flagMode); } });

// ---------- screens ----------
function showMenu(){ state='title'; stopTimer(); $('endOv').hidden=true; $('titleOv').hidden=false; showBest(); }
function showBest(){ let b=0; try{b=+localStorage.getItem('oyatsuBest'+diff)||0;}catch(e){} $('bestTxt').textContent=b?`${DIFF[diff].name}のベスト ${b}秒`:''; }
for(const b of document.querySelectorAll('#diffs button')){
  b.onclick=()=>{ diff=+b.dataset.d; for(const o of document.querySelectorAll('#diffs button'))o.setAttribute('aria-pressed',o===b); showBest(); };
}
$('startBtn').onclick=()=>{ ac(); newGame(); layout(); };
$('againBtn').onclick=()=>{ newGame(); layout(); };
$('toMenuBtn').onclick=showMenu; $('menuBtn').onclick=showMenu;
$('corgiBtn').onclick=()=>{ if(state!=='title'){ newGame(); layout(); } };
$('muteBtn').onclick=()=>setMute(!muted);

// preview board behind the title
drawCorgi('normal');
(function preview(){ const D=DIFF[0]; W=D.w; H=D.h; M=D.m; cells=Array.from({length:W*H},()=>({t:false,n:0,o:false,f:false})); build(); layout(); })();
state='title'; showBest();

// test hook
window.__oyatsu={get s(){return {state,W,H,M,opened,flags,firstDig};}, cells:()=>cells.map(c=>({t:c.t,n:c.n,o:c.o,f:c.f})), dig, toggleFlag, chord, setDiff(d){diff=d;}};
})();
</script>
