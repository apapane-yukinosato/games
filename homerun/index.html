<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="犬たちが投げてくる変化球をコーギーが打つ！ 決められた球数でノルマのホームランを打てばステージクリア。">
<title>コーギーのホームランダービー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
html,body{touch-action:manipulation}
:root{--bg:#FFF6E4;--ink:#3A2A1E;--card:#FFFDF7;--line:#EAD9BC;--mute:#8A7866;--red:#E0533D;--green:#3E9E5E;--gold:#F2B233;--blue:#3F6FD8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#wrap{position:relative}
#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;background:#8FD0F5;touch-action:none;cursor:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,28,18,.5);border-radius:14px;padding:12px;z-index:3}
.card{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:400px;max-height:100%;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card h2{margin:0;text-align:center;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:22px;line-height:1.3}
.card h2 span{color:var(--red)}
.sub{text-align:center;font-size:12px;color:var(--mute);margin:6px 0 10px;line-height:1.6}
.stages{display:grid;gap:6px}
.sg{display:grid;grid-template-columns:40px 1fr auto;gap:0 8px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 10px;cursor:pointer}
.sg .no{font-family:"Dela Gothic One",sans-serif;font-size:18px;color:var(--red);text-align:center}
.sg b{font-size:14px;display:block}
.sg span{font-size:11px;color:var(--mute);display:block}
.sg i{font-style:normal;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.sg i.ok{color:var(--green)}
.sg:disabled{opacity:.45;cursor:not-allowed}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;background:var(--red);color:#fff;box-shadow:0 4px 0 #9E2A1D}
.go.alt{background:#EFE3CE;color:var(--ink);box-shadow:0 4px 0 #D2BF9E}
.back{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.big{font-family:"Dela Gothic One",sans-serif;font-size:44px;text-align:center;line-height:1.1;margin:6px 0}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin:8px 0}
.rows b{text-align:right}
.help{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>コーギーのホームランダービー</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap">
    <canvas id="cv" width="360" height="480" aria-label="バッティング画面。ボールが来たらタップして打つ"></canvas>
    <div class="ov" id="titleOv">
      <div class="card">
        <h2>コーギーの<br><span>ホームランダービー</span></h2>
        <p class="sub">決められた球数のうちに、ノルマの数だけホームランを打てばクリア。<br>ホームラン以外（ヒット・ファウル・空振り）は、ぜんぶミス！</p>
        <div class="stages" id="stages"></div>
        <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
    <div class="ov" id="endOv" hidden>
      <div class="card">
        <h2 id="endTitle"></h2>
        <div class="big" id="endBig"></div>
        <p class="sub" id="endSub"></p>
        <div class="rows" id="endRows"></div>
        <button class="go" id="nextBtn">つぎのステージへ</button>
        <button class="go alt" id="retryBtn">もう一回</button>
        <button class="go alt" id="selBtn">ステージをえらぶ</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
  </div>
  <p class="help">ボールが来たら、<b>ボールの位置をタップ</b>して打つ（タップした所にバットの芯が行く）。<br><span class="pc">PC：マウスで芯を動かしてクリック／矢印キーで動かしてスペース</span></p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const gauss=()=>{ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ================= stages (same pitch counts and quotas as the original) ================= */
const STAGES=[
  {dog:'ゴン',breed:'柴犬のおじいちゃん',n:10,q:3,body:'#C8884A',ear:'up',belly:'#F4E4CC',desc:'ゆっくりのまっすぐだけ',mix:{st:1},spd:[15,15]},
  {dog:'ブル',breed:'ブルドッグ',n:15,q:5,body:'#D8C8B0',ear:'rose',belly:'#F4ECE0',desc:'まっすぐだけ。ちょっと速い',mix:{st:1},spd:[19,19]},
  {dog:'チワ',breed:'チワワ',n:20,q:8,body:'#E8C898',ear:'big',belly:'#FFF4E4',desc:'速い・遅いと、内角・外角の投げ分け',mix:{st:4,curve:1},spd:[16,26],corner:1},
  {dog:'ダックス＆チビ',breed:'ダックスフンド親子',n:25,q:12,body:'#8A4A26',ear:'long',belly:'#C87A4A',desc:'飛んでいるとちゅうで、速くなったり遅くなったり',mix:{wave:3,st:1,slider:1},spd:[18,22],corner:1},
  {dog:'ボーダー',breed:'ボーダーコリー',n:30,q:15,body:'#1E1E22',ear:'fold',belly:'#F4F4F0',desc:'とちゅうで急にビュンと加速',mix:{accel:3,st:1,fork:1},spd:[20,24],corner:1},
  {dog:'マダム・プー',breed:'プードル',n:35,q:19,body:'#F0E0E8',ear:'curl',belly:'#FFF8FA',desc:'左右にジグザグにゆれる魔球',mix:{zig:3,curve:1,shoot:1},spd:[19,23],corner:1},
  {dog:'ハスキー',breed:'シベリアンハスキー',n:40,q:28,body:'#6A7A8A',ear:'up',belly:'#F4F4F4',desc:'投げたとたんに消える魔球',mix:{vanish:3,st:1,slider:1},spd:[21,24],corner:1},
  {dog:'キング',breed:'ゴールデンレトリバー',n:50,q:40,body:'#E0A850',ear:'fold',belly:'#F8DCA0',desc:'ここまでの魔球と変化球、ぜんぶ',mix:{st:1,wave:1,accel:1,zig:1,vanish:1,curve:1,slider:1,fork:1,shoot:1},spd:[18,26],corner:1,special:1},
];
const PITCH_NAME={st:'ストレート',curve:'カーブ',slider:'スライダー',fork:'フォーク',shoot:'シュート',wave:'緩急の魔球',accel:'加速の魔球',zig:'ジグザグ魔球',vanish:'消える魔球'};

/* ================= world / camera ================= */
const W=360,H=480, CX=180, HOR=150, F=700, CAMZ=3.2, CAMY=1.35;
const L=17.5, ZI=0.3;                                 // release distance and ideal contact point (m in front of the plate)
const proj=(x,y,z)=>{ const d=z+CAMZ; if(d<.3) return null; const k=F/d; return {x:CX+x*k,y:HOR+(CAMY-y)*k,k}; };
const unprojPlate=(sx,sy)=>{ const k=F/(ZI+CAMZ); return {x:(sx-CX)/k,y:CAMY-(sy-HOR)/k}; };
const ZONE={x0:-.23,x1:.23,y0:.48,y1:1.08};
const FENCE=a=>{ const t=Math.abs(a)/45; return 86+ (1-t*t)*16; };   // 86 m on the lines, 102 m to center

/* ================= pitches ================= */
function makePitch(st){
  const keys=Object.keys(st.mix), tot=keys.reduce((s,k)=>s+st.mix[k],0); let r=rnd()*tot, type='st'; for(const k of keys){ r-=st.mix[k]; if(r<0){ type=k; break; } }
  let v=st.spd[0]+(st.spd[1]-st.spd[0])*rnd();
  const tx=st.corner?(rnd()<.5?-1:1)*(.06+rnd()*.13):(rnd()-.5)*.14, ty=.62+rnd()*.34;
  const brk={curve:[-.26,.32],slider:[-.3,.04],fork:[0,.42],shoot:[.24,.06]}[type]||[0,0];
  if(type==='vanish') v=st.spd[0]+1;
  return {type,v,tx,ty,bx:brk[0],by:brk[1],s:0,t:0,done:false,res:null,zAmp:.34};
}
function speedAt(p,u){
  switch(p.type){
    case 'wave': return p.v*(1+.55*Math.sin(u*Math.PI*4));            // 速い・遅いをくりかえす
    case 'accel': return u<.55?p.v*.55:p.v*1.9;                          // とちゅうで急加速
    default: return p.v;
  }
}
function ballAt(p,u){
  const rx=0, ry=1.75;
  let x=rx+(p.tx-rx)*u, y=ry+(p.ty-ry)*u+.5*u*(1-u);
  if(p.bx||p.by){ const k=u*(1-u*u*u)*1.6; x+=p.bx*k; y+=p.by*k; }   // looks headed elsewhere, then breaks late
  if(p.type==='zig') x+=Math.sin(u*Math.PI*5)*p.zAmp*(1-u*.6);
  const vis=p.type!=='vanish'||u<.1||u>1.02;
  return {x,y,z:L*(1-u),vis};
}
// simulate a pitch to learn when it reaches the ideal contact point (used by the auto batter)
function arrivalOf(p){ const q={...p,s:0}; let t=0; const dt=1/240; while(q.s<L-ZI&&t<5){ q.s+=speedAt(q,q.s/L)*dt; t+=dt; } const b=ballAt(q,q.s/L); return {t,x:b.x,y:b.y}; }

/* ================= game state ================= */
const S={scene:'title',si:0,pitch:null,phase:'idle',pt:0,hr:0,thrown:0,results:[],msg:'',msgT:0,flight:null,swing:null,cursor:{x:0,y:.8},auto:false,autoPlan:null,manual:false,combo:0,maxDist:0};
let save={best:STAGES.map(()=>0),clear:STAGES.map(()=>false)};
try{ const v=JSON.parse(localStorage.getItem('corgiHR')||'null'); if(v&&Array.isArray(v.best)) save={best:STAGES.map((_,i)=>+v.best[i]||0),clear:STAGES.map((_,i)=>!!(v.clear&&v.clear[i]))}; }catch(e){}
const persist=()=>{ try{ localStorage.setItem('corgiHR',JSON.stringify(save)); }catch(e){} };
const unlocked=i=>i===0||save.clear[i-1];

function buildStages(){
  $('stages').innerHTML=STAGES.map((st,i)=>{ const open=unlocked(i);
    return `<button class="sg" data-i="${i}" ${open?'':'disabled'}><span class="no">${st.special?'★':i+1}</span><span><b>${st.dog}（${st.breed}）</b><span>${open?`${st.n}球中 ${st.q}本 ─ ${st.desc}`:'🔒 前のステージをクリアすると挑戦できる'}</span></span><i class="${save.clear[i]?'ok':''}">${save.clear[i]?'CLEAR':''}<br>最高 ${save.best[i]}本</i></button>`; }).join('');
}
function startStage(i){
  S.si=i; S.scene='play'; S.hr=0; S.thrown=0; S.results=[]; S.phase='ready'; S.pt=0; S.pitch=null; S.flight=null; S.swing=null; S.msg=`${STAGES[i].dog}の${STAGES[i].special?'スペシャル':'ステージ'}！`; S.msgT=0; S.maxDist=0; S.autoPlan=null;
  $('titleOv').hidden=true; $('endOv').hidden=true; sfx('whistle');
}
function nextPitch(){
  const st=STAGES[S.si];
  if(S.hr>=st.q&&S.thrown>=st.n||S.thrown>=st.n||st.q-S.hr>st.n-S.thrown){ endStage(); return; }
  S.pitch=makePitch(st); S.phase='windup'; S.pt=0; S.swing=null; S.flight=null; S.autoPlan=null;
}
function endStage(){
  const st=STAGES[S.si], ok=S.hr>=st.q; S.scene='end';
  if(!S.auto){ if(S.hr>save.best[S.si]) save.best[S.si]=S.hr; if(ok) save.clear[S.si]=true; persist(); }
  $('endTitle').innerHTML=ok?'🎉 <span>ステージクリア！</span>':'ざんねん…';
  $('endBig').textContent=`${S.hr} / ${st.q}本`;
  $('endSub').textContent=ok?(st.special?'スペシャルステージまで制覇！ 伝説のスラッガーだ！':`${st.dog}（${st.breed}）に勝った！`):`ノルマまで あと${st.q-S.hr}本。${S.thrown<st.n?'のこりの球では、もう届かない…':''}`;
  $('endRows').innerHTML=[['投げた球',`${S.thrown}球`],['ホームラン',`${S.hr}本`],['いちばん飛んだ',`${Math.round(S.maxDist)}m`],['このステージの最高',S.auto?'（オートは記録しない）':`${save.best[S.si]}本`]].map(([a,b])=>`<span>${a}</span><b>${b}</b>`).join('');
  const hasNext=ok&&S.si<STAGES.length-1; $('nextBtn').hidden=!hasNext;
  $('endOv').hidden=false; sfx(ok?'clear':'fail'); S.endT=0; buildStages();
}

/* ================= batting ================= */
const SWING_DELAY=.075;
function swing(late=0){
  if(S.scene!=='play'||S.swing) return;
  if(!(S.phase==='pitch'||S.phase==='windup')) return;
  S.swing={t:late,cx:S.cursor.x,cy:S.cursor.y,done:false,fresh:late>0}; sfx('whoosh');
}
function resolveSwing(){
  const p=S.pitch, sw=S.swing; sw.done=true;
  if(!p||S.phase!=='pitch'){ return; }
  // judge at the exact moment of contact, not at the frame boundary
  const over=Math.max(0,sw.t-SWING_DELAY), v=speedAt(p,p.s/L), sE=Math.max(0,p.s-v*over), u=sE/L, b=ballAt(p,u);
  const et=(b.z-ZI)/v;                                  // + = swung early, - = late
  const dx=b.x-sw.cx, dy=b.y-sw.cy;
  if(Math.abs(et)>.11||Math.abs(dy)>.1||Math.abs(dx)>.26){ return; }   // whiff: the pitch continues to the mitt
  // contact!
  const q=1-Math.abs(et)*2.6-Math.max(0,Math.abs(dx)-.05)*2.2-Math.max(0,Math.abs(dy)-.03)*2.6;
  const ev=48*clamp(q,.15,1);
  const la=clamp(28+dy*260,-20,75);
  const dir=clamp(-et*430+dx*40,-80,80);
  const g=9.8, d=ev*ev/g*Math.sin(2*Math.max(0,la)*Math.PI/180)*.66;
  const foul=Math.abs(dir)>45, hr=!foul&&la>12&&d>=FENCE(dir);
  p.done=true; S.phase='flight';
  S.flight={t:0,ev,la,dir,d:la<=3?Math.min(d,30):d,foul,hr,T:clamp(d/34,.6,2.8),x:b.x,y:b.y,z:b.z};
  sfx(q>.8?'crackBig':'crack');
}
function pitchResult(kind,dist){
  const st=STAGES[S.si]; S.thrown++; S.results.push(kind);
  if(kind==='hr'){ S.hr++; S.maxDist=Math.max(S.maxDist,dist); }
  S.msg=kind==='hr'?'ホームラン！':kind==='foul'?'ファウル':kind==='hit'?'ヒット…（ミス）':kind==='grounder'?'ゴロ…（ミス）':'ストライク！';
  S.msgSub=kind==='hr'||kind==='hit'?`${Math.round(dist)}m`:''; S.msgT=0; S.phase='result'; S.pt=0;
  sfx(kind==='hr'?'cheer':kind==='strike'?'mitt':'aww');
}

/* ================= auto batter: reads the pitch and puts the sweet spot on it ================= */
const AUTO_SKILL={tSd:.011,pSd:.012};   // about as steady as a very good human
function autoTick(dt){
  if(S.scene!=='play') return;
  const p=S.pitch;
  if(S.phase==='pitch'&&p&&!S.autoPlan){
    const a=arrivalOf(p);
    // a real batter can't see the vanishing ball: it guesses from the release and the rhythm
    const vis=p.type==='vanish';
    S.autoPlan={at:a.t-SWING_DELAY+gauss()*AUTO_SKILL.tSd*(vis?1.6:1),x:a.x+gauss()*AUTO_SKILL.pSd*(vis?2:1),y:a.y-.008+gauss()*AUTO_SKILL.pSd*(vis?2:1),swung:false};
  }
  if(S.autoPlan&&p){ const P=S.autoPlan; S.cursor.x+=(P.x-S.cursor.x)*Math.min(1,dt*10); S.cursor.y+=(P.y-S.cursor.y)*Math.min(1,dt*10);
    if(!P.swung&&S.phase==='pitch'&&p.t>=P.at){ P.swung=true; S.cursor.x=P.x; S.cursor.y=P.y; swing(p.t-P.at); } }
}

/* ================= update ================= */
function update(dt){
  if(S.scene==='title'){ if(S.auto){ S.titleT=(S.titleT||0)+dt; if(S.titleT>1){ S.titleT=0; let i=STAGES.findIndex((_,k)=>unlocked(k)&&!save.clear[k]); if(i<0) i=(S.lastAuto=(S.lastAuto??-1)+1)%STAGES.length; startStage(i); } } return; }
  if(S.scene==='end'){ if(S.auto){ S.endT+=dt; if(S.endT>3){ const st=STAGES[S.si]; const ok=S.hr>=st.q; startStage(ok&&S.si<STAGES.length-1?S.si+1:ok?0:S.si); } } return; }
  S.msgT+=dt; S.pt+=dt;
  const p=S.pitch;
  // 1) the ball moves, 2) the batter decides, 3) the swing is judged at the exact moment of contact
  if(S.phase==='pitch'){ p.t+=dt; p.s+=speedAt(p,p.s/L)*dt; }
  if(S.auto) autoTick(dt);
  if(S.swing&&!S.swing.done){ if(S.swing.fresh) S.swing.fresh=false; else S.swing.t+=dt; if(S.swing.t>=SWING_DELAY) resolveSwing(); }
  if(S.swing){ S.swing.anim=(S.swing.anim||0)+dt; }
  switch(S.phase){
    case 'ready': if(S.pt>1.3) nextPitch(); break;
    case 'windup': if(S.pt>1.1){ S.phase='pitch'; S.pt=0; p.t=0; sfx('throw'); } break;
    case 'pitch': {
      if(p.s>L*1.12){ pitchResult(S.swing?'strike':'strike',0); sfx('mitt'); }
      break; }
    case 'flight': {
      const f=S.flight; f.t+=dt;
      if(f.t>=f.T+.2){ pitchResult(f.foul?'foul':f.hr?'hr':f.la<=8?'grounder':'hit',f.d); }
      break; }
    case 'result': if(S.pt>(S.results[S.results.length-1]==='hr'?1.3:1.0)) nextPitch(); break;
  }
}

/* ================= drawing ================= */
const cv=$('cv'), g=cv.getContext('2d');
function crowd(){ const c=document.createElement('canvas'); c.width=W; c.height=H; const b=c.getContext('2d');
  const gr=b.createLinearGradient(0,0,0,HOR); gr.addColorStop(0,'#5AB8F0'); gr.addColorStop(1,'#BDE6FF'); b.fillStyle=gr; b.fillRect(0,0,W,HOR);
  // clouds
  b.fillStyle='rgba(255,255,255,.85)'; for(const [x,y,s] of [[60,30,1],[250,50,1.3],[170,20,.8]]){ b.beginPath(); b.arc(x,y,12*s,0,7); b.arc(x+14*s,y-6*s,14*s,0,7); b.arc(x+30*s,y,11*s,0,7); b.fill(); }
  // stands
  b.fillStyle='#5A6A8A'; b.fillRect(0,86,W,52);
  let s0=7; const r=()=>{ s0=s0*16807%2147483647; return (s0-1)/2147483646; };
  for(let y=90;y<136;y+=5) for(let x=0;x<W;x+=5){ b.fillStyle=['#F2B233','#E0533D','#FFFFFF','#3F6FD8','#F4C8A0','#6A3A2A'][r()*6|0]; b.fillRect(x+r()*2,y+r()*2,3,3); }

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
