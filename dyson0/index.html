function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function txt(s,x,y,size,col,w='800',al='center',stroke){ g.font=F(w,size); g.textAlign=al; g.textBaseline='middle'; if(stroke){ g.lineWidth=4; g.strokeStyle=stroke; g.lineJoin='round'; g.strokeText(s,x,y);} g.fillStyle=col; g.fillText(s,x,y); }

function pair(x,y,size,col,stroke){ txt(PAIR[0],x,y,size,col,'800','center',stroke); txt(PAIR[1],x,y+size*1.18,size,col,'800','center',stroke); }
function wrap(s,x,y,w,lh,size,col){ g.font=F('800',size); g.textAlign='left'; g.fillStyle=col; let line='',yy=y; for(const ch of s){ if(ch==='\n'||g.measureText(line+ch).width>w){ g.fillText(line,x,yy); line=ch==='\n'?'':ch; yy+=lh; } else line+=ch; } g.fillText(line,x,yy); }

function person(x,y,s,o,mood){
  s*=o.s||1; const r=26*s;
  g.save(); g.lineJoin='round';
  if(o.cape){ g.fillStyle='#5A2A8A'; g.beginPath(); g.moveTo(x-34*s,y+r*.8); g.lineTo(x-60*s,y+r*3.6); g.lineTo(x+60*s,y+r*3.6); g.lineTo(x+34*s,y+r*.8); g.closePath(); g.fill(); }
  g.fillStyle=o.cloth||'#555'; rr(x-38*s,y+r*.8,76*s,80*s,22*s); g.fill();
  if(o.tie){ g.fillStyle=o.tie; g.beginPath(); g.moveTo(x-5*s,y+r*.95); g.lineTo(x+5*s,y+r*.95); g.lineTo(x+7*s,y+r*2.4); g.lineTo(x,y+r*2.7); g.lineTo(x-7*s,y+r*2.4); g.closePath(); g.fill(); }
  g.fillStyle=o.skin; g.fillRect(x-7*s,y+r*.75,14*s,12*s);
  const hair=()=>{ g.fillStyle=o.hair; const st=o.style;
    if(st==='twin'){ g.beginPath(); g.arc(x-r*1.15,y+r*.2,r*.38,0,7); g.arc(x+r*1.15,y+r*.2,r*.38,0,7); g.fill(); }
    if(st==='pony'){ g.beginPath(); g.arc(x+r*1.0,y+r*.4,r*.4,0,7); g.fill(); }
    if(st==='long'){ g.fillRect(x-r*1.08,y-r*.2,r*.5,r*1.6); g.fillRect(x+r*.58,y-r*.2,r*.5,r*1.6); }
    if(st==='bob'){ g.fillRect(x-r*1.08,y-r*.2,r*.4,r*1.1); g.fillRect(x+r*.68,y-r*.2,r*.4,r*1.1); }
    if(st==='bun'){ g.beginPath(); g.arc(x,y-r*1.1,r*.4,0,7); g.fill(); }
  };
  hair();
  g.fillStyle=o.skin; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  if(o.style!=='bald'){ g.fillStyle=o.hair; g.beginPath(); g.arc(x,y,r*1.06,Math.PI*1.02,Math.PI*1.98); g.closePath(); g.fill();
    if(o.style==='cap'){ g.fillStyle=o.cloth; g.fillRect(x-r*1.1,y-r*.35,r*2.2,r*.18); } }
  const ey=y+r*.05;
  if(mood==='shock'){ g.fillStyle='#fff'; g.beginPath(); g.arc(x-r*.38,ey,r*.2,0,7); g.arc(x+r*.38,ey,r*.2,0,7); g.fill(); g.fillStyle='#111'; g.beginPath(); g.arc(x-r*.38,ey,r*.08,0,7); g.arc(x+r*.38,ey,r*.08,0,7); g.fill(); }
  else if(o.shades){ g.fillStyle='#111'; g.fillRect(x-r*.65,ey-r*.12,r*1.3,r*.26); }
  else if(mood==='smile'){ g.strokeStyle='#222'; g.lineWidth=2.2*s; g.beginPath(); g.arc(x-r*.38,ey+r*.05,r*.15,Math.PI*1.1,Math.PI*1.9); g.moveTo(x+r*.38+r*.15,ey+r*.05); g.arc(x+r*.38,ey+r*.05,r*.15,Math.PI*1.1,Math.PI*1.9); g.stroke(); }
  else { g.fillStyle='#222'; g.beginPath(); g.arc(x-r*.38,ey,r*.09,0,7); g.arc(x+r*.38,ey,r*.09,0,7); g.fill(); }
  if(mood==='sad'||mood==='tired'){ g.strokeStyle='#222'; g.lineWidth=2*s; g.beginPath(); g.moveTo(x-r*.6,ey-r*.35); g.lineTo(x-r*.2,ey-r*.2); g.moveTo(x+r*.6,ey-r*.35); g.lineTo(x+r*.2,ey-r*.2); g.stroke(); }
  if(o.bags||mood==='tired'){ g.strokeStyle='rgba(90,60,90,.6)'; g.lineWidth=2*s; g.beginPath(); g.arc(x-r*.38,ey+r*.2,r*.16,.2,2.9); g.arc(x+r*.38,ey+r*.2,r*.16,.2,2.9); g.stroke(); }
  if(o.glasses){ g.strokeStyle='#222'; g.lineWidth=2*s; g.beginPath(); g.arc(x-r*.38,ey,r*.27,0,7); g.moveTo(x+r*.65,ey); g.arc(x+r*.38,ey,r*.27,0,7); g.stroke(); }
  g.strokeStyle='#7A3A2A'; g.fillStyle='#7A3A2A'; g.lineWidth=2.2*s; const my=y+r*.5;
  if(mood==='smile'||o.grin){ g.beginPath(); g.arc(x,my-r*.12,r*.28,.15,Math.PI-.15); g.stroke(); }
  else if(mood==='sad'){ g.beginPath(); g.arc(x,my+r*.2,r*.2,Math.PI*1.15,Math.PI*1.85); g.stroke(); }
  else if(mood==='shock'){ g.beginPath(); g.ellipse(x,my,r*.12,r*.18,0,0,7); g.fill(); }
  else if(mood==='tired'){ g.beginPath(); g.moveTo(x-r*.2,my); g.quadraticCurveTo(x,my+r*.1,x+r*.2,my-r*.04); g.stroke(); }
  else { g.beginPath(); g.moveTo(x-r*.18,my); g.lineTo(x+r*.18,my); g.stroke(); }
  if(o.must){ g.fillStyle=o.hair; g.fillRect(x-r*.35,my-r*.2,r*.7,r*.12); }
  g.restore();
}

/* ----- vending machine ----- */

function beginVend(lv){

function vendTap(x,y){ const V=G.vend; let best=null,bd=28;

  if(best) vendCollect(best); return !!best; }
function updateVend(dt){
  const V=G.vend; V.t+=dt; V.say-=dt;
  const botOn=G.auto||G.bot;

      const sp=G.auto?2400:600; const dx=V.tx-V.lx, dy=V.ty-V.ly, d=Math.hypot(dx,dy); if(d>1){ const m=Math.min(d,sp*dt); V.lx+=dx/d*m; V.ly+=dy/d*m; }

  for(const it of V.items) if(it.kind==='bug'&&!it.got){ it.x+=it.vx*dt; if(it.x<22||it.x>338) it.vx*=-1; }

function edgeD(a){ const c=Math.cos(a), s=Math.sin(a); const tx=c>1e-4?(W-CX)/c:c<-1e-4?(-CX)/c:1e9, ty=s>1e-4?(H-CY)/s:s<-1e-4?(-CY)/s:1e9; return Math.min(tx,ty); }
function spawnKind(key,aOverride,dAdd){
  const D=K[key]; let a=aOverride;
  if(a===undefined){ for(let k=0;k<6;k++){ a=rnd()*Math.PI*2; if(Math.abs(Math.atan2(Math.sin(a-G.lastA),Math.cos(a-G.lastA)))>.7) break; } G.lastA=a; }
  const h={def:D,key,a,d:edgeD(a)+40+(dAdd||0),r:D.r||28,hp:D.hp||1,dirs:[],si:0,state:'in',spd:D.spd,t:0,pv:0,x:0,y:0,life:1,p:0,bt:null,ign:false};

  if(D.k==='seq'){ let prev=''; for(let i=0;i<D.n;i++){ let d; do{ d=pick(['L','R','U','D']); }while(d===prev); h.dirs.push(d); prev=d; } }

}
function place(h){ const lat=h.def.zig?Math.sin(h.t*4)*22:0; h.x=CX+Math.cos(h.a)*h.d-Math.sin(h.a)*lat; h.y=CY+Math.sin(h.a)*h.d+Math.cos(h.a)*lat; }
function spawnPool(){
  const c=CH[G.ch], ps=c.pool.filter(e=>G.t>=(e[2]||0)&&!(K[e[0]].max&&(G.stats['sp_'+e[0]]||0)>=K[e[0]].max)); let tot=0; ps.forEach(e=>tot+=e[1]); let r=rnd()*tot, key=ps[0][0];
  for(const e of ps){ r-=e[1]; if(r<=0){ key=e[0]; break; } }
  const D=K[key]; G.stats['sp_'+key]=(G.stats['sp_'+key]||0)+1;
  if(D.swarm){ const a=rnd()*Math.PI*2; for(let i=0;i<D.swarm;i++) spawnKind(key,a+(i-1)*.28,i*26); } else spawnKind(key);
}
function dmgOf(D){ return Math.max(10,Math.round(G.start*D.dmg/10)*10); }
function retreat(h,sp=300){ h.state='out'; h.vx=Math.cos(h.a)*sp; h.vy=Math.sin(h.a)*sp; h.life=.5; }
function arrive(h){
  const D=h.def;
  if(G.rev){ suckHand(h,false); return; }
  if(D.k==='giant'){ startDrain(); return; }
  if(D.k==='mai'){ G.money-=dmgOf(D); G.aff+=D.aff; SV.aff=(SV.aff||0)+D.aff; addFx('ありがとう♡',h.x,h.y-30,18,'#FF8FB0'); SND.mai(); G.stats.mai=(G.stats.mai||0)+1; retreat(h,200); return; }
  const v=dmgOf(D); G.money-=v; G.stats.leak++; G.shake=.25; G.hurt=.35; addFx(pick(['ジュルルル！','ズズズ…！','チュー！'])+' -'+yen(v),CX,CY-70,16,'#FF6A5A'); SND.drain(); retreat(h);
  if(G.ch===5&&!G.drain) G.money=Math.max(G.money,1000);
}
function deflect(h){ h.state='out'; h.vx=Math.cos(h.a)*640; h.vy=Math.sin(h.a)*640; h.life=.45; G.stats.def++;
  addFx(pick(['ペチーン！','バシッ！','ポン！','ぺしっ！']),h.x,h.y,17,'#fff',-30); for(let i=0;i<5;i++) G.parts.push({x:h.x,y:h.y,vx:(rnd()-.5)*240,vy:(rnd()-.8)*240,life:.5}); SND.hit(); }
function suckHand(h,player){
  h.state='suck'; h.p=0; h.x0=h.x; h.y0=h.y; if(player){ G.combo++; G.stats.sucked++; } else G.combo=0;
  const v=1e6*Math.pow(1.1,Math.min(G.combo,70))*(h.def.k==='multi'||h.def.k==='seq'?1.4:1)*(player?1:.1);

  for(let i=0;i<4;i++) G.parts.push({x:h.x,y:h.y,vx:(CX-h.x)*3+(rnd()-.5)*60,vy:(CY-h.y)*3+(rnd()-.5)*60,life:.35});
}
function actTap(h){

  else if(D.k==='mai'){ G.aff-=1; G.stats.slip++; addFx('えーん…',h.x,h.y-30,16,'#FF8FB0'); retreat(h,260); }
  else if(D.k==='giant'){ h.pv+=200; addFx('ぐぐぐ…！',h.x,h.y,16,'#FF8A8A'); }
  else { addFx('スワイプ！',h.x,h.y-h.r-8,14,'#FFE040'); h.pv+=80; }

function actSwipe(h,dir){

  if(D.k==='swipe'||D.k==='seq'){

    else { addFx('✕',h.x,h.y,22,'#FF6A5A'); h.pv+=40; }
  } else actTap(h);
}
function startDrain(){ if(G.drain) return; G.drain=true; G.drainT=0; G.drainFrom=G.money; for(const h of G.hands) if(h.state==='in') retreat(h); SND.drain(); G.shake=1; addFx('ぜんぶ持ってかれた…',CX,CY-80,20,'#FF8A8A',-20); }
function tickFx(dt){ for(const f of G.fx){ f.life-=dt; f.y+=f.vy*dt; } G.fx=G.fx.filter(f=>f.life>0);

    if(h.bt===null){ h.bt=B.react[0]+rnd()*(B.react[1]-B.react[0]); h.ign=rnd()<B.miss&&h.def.k!=='mai'; }
    if(h.def.k==='mai'&&!G.rev) continue;
    h.bt-=dt; if(h.bt>0||h.ign) continue;
    const k=h.def.k;
    if(G.rev){ actTap(h); continue; }
    if(k==='tap') actTap(h);
    else if(k==='multi'){ h.acc=(h.acc||0)+dt*B.tps; let n=0; while(h.acc>=1&&h.state==='in'&&n++<60){ h.acc--; actTap(h); } }
    else if(k==='swipe') actSwipe(h,h.dirs[0]);

}
const AUTO_BOT={react:[0,0],miss:0,tps:1e9,gap:0};

function updatePlay(dt){
  const c=CH[G.ch]; G.t+=dt; G.disp+=(G.money-G.disp)*Math.min(1,dt*(G.rev?10:8));
  if(Math.abs(G.money-G.disp)<1) G.disp=G.money;
  tickFx(dt); const f=clamp(G.t/G.T,0,1); G.spdMul=G.rev?1.1:1+.18*f;
  // spawning
  if(!G.drain&&G.mode==='play'){
    if(G.rev){ G.nextSp-=dt; if(G.nextSp<=0){ const iv=lerp(.55,.18,f); G.nextSp=iv*(.8+.4*rnd()); spawnPool(); } }
    else if(G.t>1.2||G.ch>1){ G.nextSp-=dt; if(G.nextSp<=0){ const iv=lerp(c.i0,c.i1,f); G.nextSp=iv*(.8+.4*rnd()); spawnPool(); } }
    if(G.ch===5&&!G.rev&&!G.giant&&G.t>=6.5){ G.giant=spawnKind('giant'); }
    if(G.ch===5&&!G.rev&&G.giant&&G.t>=G.T&&G.giant.state==='in') G.giant.d=Math.min(G.giant.d,REACH);
  }
  if(G.bot||G.auto) botTick(dt);
  for(const h of G.hands){
    if(h.state==='in'){ h.t+=dt; if(h.def.k==='giant') h.spd+=7*dt;
      h.d+=-h.spd*G.spdMul*dt+h.pv*dt; h.pv*=Math.exp(-8*dt); place(h); if(h.d<=REACH) arrive(h); }
    else if(h.state==='out'){ h.x+=h.vx*dt; h.y+=h.vy*dt; h.life-=dt*2.2; }
    else if(h.state==='suck'){ h.p+=dt/.28; const e=clamp(h.p,0,1); h.x=lerp(h.x0,CX,e*e); h.y=lerp(h.y0,CY+24,e*e); }

  if(G.ch<5){
    if(G.money<=0){ G.money=0; failChapter(); return; }
    if(G.t>=G.T) finishChapter();
  }
}

function finishChapter(){

  SV.unlocked=Math.max(SV.unlocked||1,Math.min(5,ch+1)); save();
  G.result={ch,rank,ratio,bal:G.money,aff:G.aff}; SND.clear();
  $('resCard').innerHTML=`<h2>第${ch}章 クリア！</h2><div class="rank">${rank}</div>
   <div class="rows"><div><span>のこった残高</span><b>${yen(G.money)}</b></div><div><span>守った割合</span><b>${Math.round(ratio*100)}%</b></div><div><span>麻依の好感度</span><b>♡ ${G.aff}</b></div>${ch<=2?`<div><span>自販機の収入</span><b>${G.vendBonus}円（ベスト ${SV.vend[ch]||0}円）</b></div>`:''}<div><span>この章のベスト</span><b>${bestRank(ch)}</b></div></div>
   <div class="tag"><span>通帳の名義</span><span class="pair">大存<br>麻依</span></div>
   <div class="post">${CH[ch].post}</div>
   <button class="go gold" data-act="next">${ch===4?'覚醒の夜へ':'つぎの章へ'}</button><button class="go alt" data-act="retry">もう一度あそぶ</button><button class="go alt" data-act="title">タイトルへ</button><a class="back" href="../">← ゲーム一覧にもどる</a>`;
  setMode('result');
}
function failChapter(){
  SND.fail(); $('resCard').innerHTML=`<h2>吸い尽くされた…</h2><div class="post" style="text-align:center">残高が0円になってしまった。<br>もう一度、守り抜こう。</div>
   <div class="tag"><span>通帳の名義</span><span class="pair">大存<br>麻依</span></div>
   <button class="go gold" data-act="retry">もう一度</button><button class="go alt" data-act="title">タイトルへ</button><a class="back" href="../">← ゲーム一覧にもどる</a>`;
  G.stats.failed=true; setMode('fail');
}
function finishB(){
  const v=Math.round(G.suckTotal); if(v>(SV.suck||0)) SV.suck=v; SV.unlocked=5; SV.best[5]={rank:'—',bal:SV.suck}; save(); SND.clear();
  G.result={ch:5,sucked:v};
  $('resCard').innerHTML=`<h2>吸い返した！</h2><div class="rank" style="font-size:30px;line-height:1.3">${yen(v)}</div>
   <div class="rows"><div><span>吸い返した手</span><b>${G.stats.sucked}本</b></div><div><span>最大コンボ</span><b>${G.maxCombo||G.combo}</b></div><div><span>ベスト</span><b>${yen(SV.suck)}</b></div></div>
   <div class="post">吸われ続けた男の手のひらが、はじめて「吸う」側になった。\nそして、あくる朝――。</div>
   <button class="go gold" data-act="next">つづきを見る</button><button class="go alt" data-act="retry">もう一度あそぶ</button><button class="go alt" data-act="title">タイトルへ</button>`;
  setMode('result');
}
function doAct(a){
  if(a==='next'){ if(G.ch<5) startRun(G.ch+1); else startTalk('epi',()=>startTalk('fin1',startLoop)); }
  else if(a==='retry'){ startPlay(); }
  else if(a==='title'){ showTitle(); }
}
function startLoop(){ G.loopT=0; setMode('loop'); SND.vortex(); }
function endLoop(){ if(G.mode!=='loop') return; startTalk('fin2',startLogo); }
function startLogo(){
  SV.ending=true; save(); setMode('logo');
  $('resCard').innerHTML=`<div class="rows" style="text-align:center;margin:0"><div style="justify-content:center">― おわり ―</div></div>
   <div class="tag"><span>ベスト：吸い返した額</span><b>${yen(SV.suck||0)}</b></div>
   <button class="go gold" data-act="title">タイトルへ</button><button class="go alt" data-act="again">はじめから もう一度</button><a class="back" href="../">← ゲーム一覧にもどる</a>`;
}
function showTitle(){
  setMode('title'); const el=$('chs'); el.innerHTML='';
  for(let i=1;i<=5;i++){ const b=document.createElement('button'); b.disabled=i>(SV.unlocked||1); b.innerHTML=(i===5?'終':i)+'<small>'+(i===5?(SV.suck?'済':'—'):bestRank(i))+'</small>'; b.onclick=()=>{ ac(); startRun(i); }; el.appendChild(b); }
  $('bestTx').textContent=`吸い返した最高額：${yen(SV.suck||0)} ／ 自販機ベスト：1章 ${SV.vend[1]||0}円・2章 ${SV.vend[2]||0}円 ／ 麻依の好感度 ♡${SV.aff||0}`;
}
function setAuto(b){ G.auto=!!b; $('autoBtn').setAttribute('aria-pressed',G.auto?'true':'false'); G.bot=G.auto?AUTO_BOT:null; G.autoT=0; if(G.auto&&G.mode==='title'){ ac(); startRun(1); } }

/* ----- master update ----- */
function update(dt){
  G.clock+=dt; if(G.rev&&G.combo>(G.maxCombo||0)) G.maxCombo=G.combo; if(!G.rev) G.maxCombo=0;
  const m=G.mode;
  if(G.auto){ G.autoT+=dt;
    if(m==='title') startRun(1);
    else if(m==='talk'&&G.autoT>.12) skipTalk();
    else if(m==='result'&&G.autoT>1.2) doAct('next');
    else if(m==='fail'&&G.autoT>.8) doAct('retry');
    else if(m==='loop'&&G.autoT>3) endLoop();
    else if(m==='logo'&&G.autoT>3.5) startRun(1); }
  if(G.mode==='play') updatePlay(dt);
  else if(G.mode==='vend') updateVend(dt);
  else if(G.mode==='talk'&&G.talk) G.talk.fx=Math.max(0,G.talk.fx-dt);
  else if(G.mode==='loop'){ G.loopT+=dt; if(G.loopT>=7.5) endLoop(); }
}
function step(dt){ while(dt>0){ const d=Math.min(dt,1/60); update(d); dt-=d; } }
function render(){
  const m=G.mode;
  if(m==='talk'&&G.talk) drawTalk(); else if(m==='play'||m==='result'||m==='fail') drawPlay(); else if(m==='vend') drawVend();
  else if(m==='loop') drawLoop(); else if(m==='logo') drawLogo();
  else { bgDraw('cosmos',G.clock); vortex(CX,150,90,G.clock,'#F2C23A'); }
}

/* ----- input ----- */
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; }
function nearestHand(p,margin,filter){ let b=null,bd=1e9; for(const h of G.hands){ if(h.state!=='in') continue; if(filter&&!filter(h)) continue; const d=Math.hypot(h.x-p.x,h.y-p.y); if(d<=h.r+margin&&d<bd){ bd=d; b=h; } } return b; }
let DRAG=null;
const dirOf=(dx,dy)=>Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U');
cv.addEventListener('pointerdown',e=>{
  ac(); const p=pt(e); if(G.auto&&G.mode!=='title') setAuto(false);
  if(G.mode==='talk'){ talkNext(); return; }
  if(G.mode==='loop'){ endLoop(); return; }
  if(G.mode==='vend'){ const V=G.vend; V.tx=p.x; V.ty=clamp(p.y,330,398); if(!V.touched){ V.touched=1; } vendTap(p.x,p.y); DRAG={vend:true}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} return; }
  if(G.mode!=='play') return;
  const h=nearestHand(p,18); DRAG={h,x0:p.x,y0:p.y,used:false};
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(h&&(G.rev||(h.def.k!=='swipe'&&h.def.k!=='seq'))) { actTap(h); DRAG.used=true; }
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(G.mode==='vend'){ const V=G.vend; if(!G.auto){ V.tx=p.x; V.ty=clamp(p.y,330,398); } return; }
  if(G.mode!=='play'||!DRAG) return;
  if(G.rev){ const h=nearestHand(p,10); if(h) actTap(h); return; }
  if(DRAG.used) return; const dx=p.x-DRAG.x0, dy=p.y-DRAG.y0; if(Math.hypot(dx,dy)<26) return;
  let h=DRAG.h&&DRAG.h.state==='in'&&(DRAG.h.def.k==='swipe'||DRAG.h.def.k==='seq')?DRAG.h:nearestHand({x:DRAG.x0,y:DRAG.y0},50,x=>x.def.k==='swipe'||x.def.k==='seq')||nearestHand(p,30,x=>x.def.k==='swipe'||x.def.k==='seq');
  DRAG.used=true; if(h) actSwipe(h,dirOf(dx,dy));
});
const up=()=>{ DRAG=null; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{
  if(e.key==='o'||e.key==='O'){ setAuto(!G.auto); return; }
  if(e.ctrlKey||e.metaKey||e.altKey||e.key==='Shift') return;
  if(G.auto&&G.mode!=='title') setAuto(false);
  if((e.key===' '||e.key==='Enter')&&G.mode==='talk'&&!$('logOv').hidden===false){ e.preventDefault(); talkNext(); }
});
$('talk').addEventListener('click',()=>talkNext());
$('autoBtn').addEventListener('click',()=>setAuto(!G.auto));
$('muteBtn').addEventListener('click',()=>setMute(!muted));
$('startBtn').addEventListener('click',()=>{ ac(); startRun(1); });
$('autoStartBtn').addEventListener('click',()=>{ ac(); setAuto(true); });
$('skipBtn').addEventListener('click',()=>{ if(G.auto) setAuto(false); if(G.mode==='talk') skipTalk(); else endLoop(); });
$('logBtn').addEventListener('click',()=>{ $('logList').innerHTML=G.log.slice(-60).map(l=>`<p>${l.n?'<b>'+l.n+'</b>　':''}${l.t.replace(/\n/g,' ')}</p>`).join(''); $('logOv').hidden=false; $('logList').scrollTop=1e6; });
$('logClose').addEventListener('click',()=>{ $('logOv').hidden=true; });
$('resCard').addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('[data-act]'); if(!a) return; ac(); const act=a.dataset.act; if(act==='again') startRun(1); else doAct(act); });

/* ----- hooks ----- */
function snapshot(){ return {mode:G.mode,ch:G.ch,t:G.t,T:G.T,money:G.money,start:G.start,aff:G.aff,rev:G.rev,combo:G.combo,suckTotal:G.suckTotal,hands:G.hands.map(h=>({k:h.key,st:h.state,x:h.x,y:h.y,d:h.d})),auto:G.auto,stats:G.stats,vend:G.vend?{t:G.vend.t,T:G.vend.T,total:G.vend.total,lx:G.vend.lx,ly:G.vend.ly,items:G.vend.items.map(i=>({k:i.kind,v:i.v,x:i.x,y:i.y,got:!!i.got}))}:null,talk:G.talk?{i:G.talk.i,n:G.talk.sc.lines.length,t:G.talk.sc.lines[G.talk.i].t}:null,result:G.result,unlocked:SV.unlocked,best:SV.best,suck:SV.suck,vendBest:SV.vend,vendBonus:G.vendBonus,ending:SV.ending}; }
window.__dyson0={
  get:snapshot, step, setAuto, seed:n=>{ seed=n; }, setBot:o=>{ G.bot=o; }, next:talkNext, skipTalk, startRun, startPlay:ch=>{ G.ch=ch; G.vendBonus=G.vendBonus||0; startPlay(); },
  startB:()=>{ G.ch=5; startPlay(); startB(); }, spawn:(k,a)=>spawnKind(k,a), tap:(x,y)=>{ const h=nearestHand({x,y},18); if(h) actTap(h); }, vendTap:(x,y)=>{ G.vend.lx=x; G.vend.ly=y; return vendTap(x,y); },
  startVend:lv=>{ G.vendLv=lv; beginVend(lv); }, endVend, startTalk:(k,after)=>startTalk(k,after||null), startLoop, endLoop, startLogo, showTitle, doAct,
  setLoopT:t=>{ G.loopT=t; }, reset:()=>{ SV={unlocked:1,best:{},vend:{},ending:false,suck:0,aff:0}; save(); showTitle(); }, unlockAll:()=>{ SV.unlocked=5; save(); showTitle(); },
  sim(ch,bot,n){ const out=[]; const keepAuto=G.auto; G.auto=false; for(let i=0;i<n;i++){ G.bot=bot; G.ch=ch; G.vendBonus=0; startPlay(); let s=0; while(G.mode==='play'&&s++<20000) update(1/60); out.push({m:G.mode,rank:G.result&&G.result.ch===ch&&G.mode==='result'?G.result.rank:null,money:Math.round(G.money),leak:G.stats.leak,slip:G.stats.slip}); } G.bot=null; G.auto=keepAuto; return out; }
};

/* ----- boot ----- */
setMute(muted); showTitle();
let last=0; function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; step(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>

<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
