<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="マネーダイソンの続編。世界のお金を吸い尽くし、人類は石器時代へ。お金のない人から吸いつづけたダイソンは、ついに「寿命」を吸えるようになった。人から、木から、そして地球から──。">
<title>マネーダイソン2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#10140E;--ink:#F0ECE0;--card:#1E2418;--line:#3A4430;--mute:#A0A890;--gold:#F2C23A;--red:#E0433D;--green:#7AC85A;--purple:#8A5AE0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;font-family:"Dela Gothic One",sans-serif;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:var(--red)}
#wrap{position:relative}
#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;background:#2A3420;touch-action:none}
#pad{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:8px}
#suckBtn{grid-row:span 2;min-height:96px;border:0;border-radius:20px;background:radial-gradient(circle at 35% 30%,#B08AF8,#6A3AC8);box-shadow:0 5px 0 #3E2280;font-size:20px;font-weight:800;color:#fff;cursor:pointer;touch-action:none;font-family:"Dela Gothic One",sans-serif}
#suckBtn.on{transform:translateY(3px);box-shadow:0 2px 0 #3E2280;filter:brightness(1.25)}
#shopBtn,#skBtn{min-height:44px;border:0;border-radius:14px;font-weight:800;font-size:13px;cursor:pointer;color:#221A10}
#shopBtn{background:#C8A060;box-shadow:0 4px 0 #7A5A26}
#skBtn{background:#E8D8A8;box-shadow:0 4px 0 #9A8A5A}
#skBtn:disabled{opacity:.4}
.skbar{display:flex;gap:6px;margin-top:8px}
.skb{flex:1;min-height:44px;border:0;border-radius:12px;font-weight:800;font-size:12px;line-height:1.2;cursor:pointer;color:#fff;background:#3A4A2A;box-shadow:0 3px 0 #1A2410;touch-action:manipulation}
.skb small{display:block;font-size:10px;opacity:.85}
.skb:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.skb.kinki{background:linear-gradient(135deg,#5A1A7A,#1A0A2A);color:#F2C0FF}
.ov{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;background:rgba(6,8,4,.74);border-radius:14px;padding:12px;z-index:3;overflow-y:auto;overscroll-behavior:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:400px;text-align:center;margin:auto 0}
.card h2{margin:0;font-family:"Dela Gothic One",sans-serif;font-size:24px;line-height:1.3;color:var(--gold)}
.story{font-size:14px;line-height:1.85;text-align:left;margin:10px 0;white-space:pre-line}
.sub{font-size:12px;color:var(--mute);line-height:1.6;margin:6px 0;white-space:pre-line}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;background:var(--purple);color:#fff;box-shadow:0 4px 0 #4A2A90}
.go.alt{background:#34402A;box-shadow:0 4px 0 #1A2410}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.skills{display:grid;gap:6px;text-align:left;margin-top:8px}
.sk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:#28301E;border-radius:12px;padding:8px 10px}
.sk b{font-size:14px}.sk small{grid-column:1;font-size:11px;color:var(--mute)}
.sk.kinki{background:#2A0E2E;outline:2px solid #B03AC8}.sk.kinki b{color:#F2A0FF}
.sk button{grid-row:1/3;grid-column:2;border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;background:var(--gold);color:#221A10;cursor:pointer;min-width:96px}
.sk button:disabled{background:#3A4430;color:#8A9A7A;cursor:default}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:8px;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>⏳ マネーダイソン2</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap">
    <canvas id="cv" width="360" height="480" aria-label="森にのまれた世界で寿命を吸うダイソン"></canvas>
    <div class="ov" id="storyOv">
      <div class="card">
        <h2 id="storyTitle"></h2>
        <div class="story" id="storyText"></div>
        <button class="go" id="storyBtn">すすむ</button>
        <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
        <a class="back" href="../" id="storyBack">← ゲーム一覧にもどる</a>
      </div>
    </div>
    <div class="ov" id="shopOv" hidden>
      <div class="card">
        <h2>🪨 石器ショップ</h2>
        <p class="sub">お支払いは「寿命」のみ。お金？ それは石ころと同じです。<br>使いすぎると、寿命がつきるので注意。</p>
        <div class="skills" id="skills"></div>
        <button class="go" id="closeShop">もどる</button>
      </div>
    </div>
  </div>
  <div id="pad"><button id="suckBtn">⏳ 吸う<br><small style="font-size:12px;font-family:sans-serif">（長押し）</small></button><button id="shopBtn">🪨 ショップ</button><button id="skBtn" hidden>🔥 たき火</button></div>
  <div class="skbar" id="skbar" hidden><button class="skb" id="sk_stop">⏸ 時間停止<small></small></button><button class="skb kinki" id="sk_hole">🕳 タイムホール<small></small></button></div>
  <p class="keys">画面をさわった所へ歩く。<span class="pc">PC：矢印/WASDで移動　スペース長押しで吸う　S ショップ　F たき火　O オート　M 音</span></p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(rnd()*a.length)], lr=(a,b)=>a+(b-a)*rnd();
const W=360,H=480, AREA={x0:16,x1:344,y0:84,y1:466};
const cv=$('cv'), g=cv.getContext('2d');
// years, with 万 / 億 units
const yrs=n=>{ n=Math.max(0,n); if(n>=1e8) return (n/1e8>=100?Math.round(n/1e8).toLocaleString():(n/1e8).toFixed(1))+'億年'; if(n>=1e4) return (n/1e4>=100?Math.round(n/1e4).toLocaleString():(n/1e4).toFixed(1))+'万年'; return (n<10?n.toFixed(1):Math.round(n).toLocaleString())+'年'; };

/* ================= who has years left ================= */
const T={
  kid:{n:'子ども',life:[62,76],age:[5,10],sp:1.25,kind:'person',react:'flee'},
  young:{n:'若者',life:[45,56],age:[16,24],sp:1.05,kind:'person',react:'stone'},
  adult:{n:'大人',life:[28,40],age:[30,45],sp:.9,kind:'person',react:'stone'},
  elder:{n:'長老',life:[2,7],age:[80,95],sp:.5,kind:'person',react:'none'},
  warrior:{n:'戦士',life:[35,45],age:[22,32],sp:1.1,kind:'person',react:'charge'},
  shaman:{n:'森の呪術師',life:[300,600],age:[60,80],sp:.7,kind:'person',react:'curse'},
  hermit:{n:'仙人',life:[3000,6000],age:[300,500],sp:.6,kind:'person',react:'curse'},
  mammoth:{n:'マンモス',life:[50,70],age:[10,20],sp:.8,kind:'beast',react:'stampede'},
  sapling:{n:'若木',life:[60,160],kind:'tree',r:12},
  tree:{n:'大木',life:[600,1600],kind:'tree',r:18},
  giant:{n:'巨木',life:[5000,12000],kind:'tree',r:26},
  sacred:{n:'千年樹',life:[40000,90000],kind:'tree',r:34},
  vent:{n:'地脈',life:[1.6e8,1.8e8],kind:'vent',r:24},
};
const STAGES=[
  {n:'森にのまれた街',goal:300,drain:1,dmg:4,mix:{kid:3,young:3,adult:3,elder:2},count:10,trees:{sapling:7,tree:2},bg:['#3A4A2A','#4A5A34'],
   intro:'お金がなくなった世界で、街はまたたく間に荒れはてた。\nビルはつたにおおわれ、道路は森にのまれた。\n人々は毛皮を着て、石器を手にくらしている。\n\nだが、ダイソン自身も年老いていた。\n残りの寿命は、あとわずか――。',
   tip:'人に手をかざすと、その人の寿命が自分に流れこむ（吸われた人は年をとる）。\n木からも吸える。ダイソンの寿命は、何もしなくても毎秒へっていく！\n\n🎯 特別標的を最後まで吸うとボーナス。吸い続けるほど警戒度が上がり、MAXになると全員が襲ってくる。短く吸って逃げるか、コンボを伸ばすかが勝負。'},
  {n:'マンモスの草原',goal:2000,drain:3,dmg:15,mix:{kid:2,young:3,adult:3,warrior:2,mammoth:2,elder:1},count:11,trees:{sapling:4,tree:4},bg:['#6A7A3A','#8A9A4A'],
   intro:'街の外には、どこまでも草原が広がっていた。\nマンモスがもどってきている。\n戦士たちは、石の槍を持っている。',tip:'戦士は怒ると突進してくる。マンモスは暴走する。\n🪨ショップで寿命をはらって能力をきたえよう。'},
  {n:'巨木の森',goal:20000,drain:10,dmg:80,mix:{young:2,adult:2,warrior:3,shaman:2,mammoth:2,kid:2},count:11,trees:{tree:5,giant:4},bg:['#1E3A1E','#2A4A26'],
   intro:'人がいなくなった土地には、巨大な木々がしげっていた。\n樹齢数千年の巨木たち。\n森の呪術師が、木を守っている。',tip:'呪術師の呪いは、ダイソンの寿命をけずる。\n巨木の寿命はたっぷり。呪術師から目をはなすな。'},
  {n:'千年樹の聖域',goal:2.5e5,drain:40,dmg:900,mix:{hermit:3,shaman:3,warrior:3},count:9,trees:{giant:3,sacred:4},bg:['#2A2A40','#3A3A54'],
   intro:'森のいちばん奥。\n千年、いや何万年も生きる「千年樹」と、\n寿命の長い仙人たちが住む聖域。',tip:'千年樹から寿命を吸い尽くせ。仙人の呪いは強い。'},
  {n:'地球',goal:1e9,drain:1000,dmg:0,earth:1,mix:{},count:0,trees:{},bg:['#3A1A10','#5A2A14'],
   intro:'人からも、木からも、吸い尽くした。\nダイソンは足もとを見つめた。\n\n──地球にも、寿命がある。\n\n残り、およそ10億年。',tip:'地面の「地脈」から地球の寿命を吸え。\n吸うほど地球は怒り、噴火と地震でダイソンの寿命を削ってくる（寿命の何％かが持っていかれる）。'},
];
/* ================= skills (paid in years) ================= */
const powOf=l=>5*Math.pow(2.6,l-1), rngOf=l=>[56,88,122,156,190][l-1], stlOf=l=>Math.pow(.6,l-1), spdOf=l=>1+.22*(l-1), armOf=l=>Math.pow(.62,l-1);
const SK=[
  {id:'pow',n:'吸引力',d:l=>`1秒に ${yrs(powOf(l))} 吸う`,max:9,cost:l=>40*Math.pow(3.1,l-1)},
  {id:'rng',n:'吸引距離',d:l=>`とどく距離 ${rngOf(l)}`,max:5,cost:l=>50*Math.pow(4.2,l-1)},
  {id:'stl',n:'気づかれにくさ',d:l=>`気づかれる速さ ${Math.round(stlOf(l)*100)}%`,max:5,cost:l=>40*Math.pow(3.6,l-1)},
  {id:'arm',n:'石あたま',d:l=>`うける被害 ${Math.round(armOf(l)*100)}%`,max:4,cost:l=>70*Math.pow(4.5,l-1)},
  {id:'spd',n:'若い足',d:l=>`足の速さ ${Math.round(spdOf(l)*100)}%`,max:4,cost:l=>30*Math.pow(3.6,l-1)},
  {id:'multi',n:'同時吸引',d:l=>`${l}つから同時に吸う`,max:3,cost:l=>[450,7000][l-1]},
  {id:'fire',act:1,n:'🔥 お札たき火',desc:'使い道のない一万円札を燃やして、たき火をする。まわりの人は火にあたってぼーっとし、気づかなくなる（25秒ごと）',max:1,cost:()=>90},
  {id:'stop',act:1,n:'⏸ 時間停止',desc:'6秒間、世界の時間を止める。止まっている間は気づかれない（1つの面で1回）',max:1,cost:()=>3000},
  {id:'hole',act:1,kinki:1,n:'🕳 禁忌「タイムホール」',desc:'まわりの全員と全部の木から、寿命を一瞬で吸い尽くす。そのあと、空から石の雨がふる（1つの面で1回）',max:1,cost:()=>60000},
];

/* ================= state ================= */
const LV0={pow:1,rng:1,stl:1,arm:1,spd:1,multi:1,fire:0,stop:0,hole:0};
const S={scene:'story',stage:0,life:30,lv:{...LV0},npcs:[],trees:[],fx:[],shots:[],fires:[],rocks:[],p:null,t:0,sucking:false,targets:[],paused:false,auto:false,manual:false,msg:'',msgT:9,endT:0,stopT:0,stopUsed:false,holeUsed:false,fireCd:0,quake:0,earthT:0,shake:0,alert:0,combo:0,comboT:0,comboClock:0,focusType:null,contract:null,contractDone:0,
  move:null,keys:{},best:(()=>{ try{ return JSON.parse(localStorage.getItem('dyson2Best')||'null')||{stage:0,clears:0,max:0}; }catch(e){ return {stage:0,clears:0,max:0}; } })(),stats:{sucked:0,aged:0,trees:0,hits:0},ending:null};
let nid=1;
function saveBest(){ if(S.auto) return; try{ localStorage.setItem('dyson2Best',JSON.stringify(S.best)); }catch(e){} }
const st=()=>STAGES[S.stage];

function mkNpc(type,x,y){ const t=T[type]; const life=lr(t.life[0],t.life[1]);
  return {id:nid++,type,t,x,y,tx:x,ty:y,life,max:life,age:t.age?lr(t.age[0],t.age[1]):0,sp:(t.sp||1)*(30+rnd()*8),state:'walk',sus:0,wary:0,idle:0,face:1,angryT:0,cd:0}; }
function spawnPerson(edge){ const s=st(), keys=Object.keys(s.mix); if(!keys.length) return; const tot=keys.reduce((a,k)=>a+s.mix[k],0); let r=rnd()*tot, type=keys[0]; for(const k of keys){ r-=s.mix[k]; if(r<0){ type=k; break; } }
  const x=edge?(rnd()<.5?AREA.x0:AREA.x1):lr(AREA.x0,AREA.x1), y=lr(AREA.y0+20,AREA.y1-20); S.npcs.push(mkNpc(type,x,y)); }
function startStage(i){
  S.stage=i; const s=st(); S.npcs=[]; S.trees=[]; S.fx=[]; S.shots=[]; S.fires=[]; S.rocks=[]; S.targets=[]; S.stopT=0; S.stopUsed=false; S.holeUsed=false; S.fireCd=0; S.quake=4; S.scene='play'; S.paused=false; S.t=0; S.autoShopT=0;
  S.p={x:180,y:AREA.y1-30,vx:0,vy:0,inv:0,face:1};
  for(let k=0;k<s.count;k++) spawnPerson(false);
  for(const [k,n] of Object.entries(s.trees)) for(let j=0;j<n;j++){ let x,y,ok=false,tries=0; while(!ok&&tries++<50){ x=lr(AREA.x0+20,AREA.x1-20); y=lr(AREA.y0+20,AREA.y1-60); ok=S.trees.every(t=>Math.hypot(t.x-x,t.y-y)>t.t.r+T[k].r+16); }
    const tr=mkNpc(k,x,y); tr.state='tree'; S.trees.push(tr); }
  if(s.earth){ const spots=[[90,150],[270,150],[180,250],[80,360],[280,360],[180,420]]; for(const [x,y] of spots){ const v=mkNpc('vent',x,y); v.state='vent'; S.trees.push(v); } }
  S.start={life:S.life,lv:{...S.lv}}; S.alert=0; S.combo=0; S.comboT=0; S.comboClock=0; S.contractDone=0; S.lastSpawn=-99; S.focusType=null; S.contract=Object.keys(s.mix||{}).filter(k=>T[k]).sort(()=>rnd()-.5)[0]||null; say(`第${i+1}章　${s.n}`); hideAll(); sfx('start'); syncButtons();
  if(i>S.best.stage){ S.best.stage=i; saveBest(); }
}
function say(m){ S.msg=m; S.msgT=0; }
function fx(o){ S.fx.push(Object.assign({t:0},o)); }
function hideAll(){ $('storyOv').hidden=true; $('shopOv').hidden=true; }
let storyFn=null;
function story(title,text,btn,fn,showAuto){ S.scene='story'; $('storyTitle').textContent=title; $('storyText').textContent=text; $('storyBtn').textContent=btn; storyFn=fn; $('autoStartBtn').hidden=!showAuto; $('storyBack').hidden=!showAuto; $('storyOv').hidden=false; S.endT=0; }
function titleScreen(){ S.life=30; S.lv={...LV0}; S.ending=null; S.stats={sucked:0,aged:0,trees:0,hits:0};
  story('マネーダイソン2','世界のお金を吸い尽くした男、マネーダイソン。\nダイソン以外の人間はお金を持てなくなり、\n人類は石器時代――ストーンワールドに逆もどりした。\n\nお金のない人から、それでも吸いつづけたある日。\nダイソンの手に流れこんできたのは、お金より大事なもの──\n「寿命」だった。\n\n吸われた人は、みるみる年をとっていく。\n'+`（とうたつ：第${S.best.stage+1}章　クリア ${S.best.clears}回）`,'はじめる',()=>stageIntro(0),true); }
function stageIntro(i){ const s=STAGES[i]; story(`第${i+1}章　${s.n}`,s.intro+'\n\n💡 '+s.tip+`\n\n目標：寿命 ${yrs(s.goal)}${s.earth?'（地球の寿命をすべて）':''}`,'この地へ',()=>startStage(i),false); }
function stageClear(){ S.scene='cleared'; sfx('clear'); const s=st();
  if(S.stage<STAGES.length-1) story(`第${S.stage+1}章 クリア`,`ダイソンの寿命は ${yrs(S.life)} になった。\n吸われた人たちは、すっかりお年寄りに。\n\n${S.stage===3?'もう、吸える人も木も、ほとんど残っていない。':'次の地へ向かう。'}🪨ショップで能力をきたえよう。`,'次へ',()=>stageIntro(S.stage+1),false);
  else endingStart(); }
function lifeOut(){ S.scene='down'; sfx('lose'); story('寿命がつきた…',`ダイソンは、静かに年老いて……ねむりについた。\n第${S.stage+1}章のはじめからやり直しだ。`,'もう一度',()=>{ S.life=S.start.life; S.lv={...S.start.lv}; stageIntro(S.stage); },false); }

/* ================= sucking ================= */
const canSuck=n=>n.life>0.5&&n.wary<=0&&n.state!=='old'&&n.state!=='leave'&&n.state!=='dead';
function suckTargets(){ const p=S.p, R=rngOf(S.lv.rng)*(st().earth?1.25:1), all=[...S.npcs,...S.trees].filter(n=>canSuck(n)&&Math.hypot(n.x-p.x,n.y-p.y)<=R+(n.t.r||0));
  all.sort((a,b)=>(b.life*(b.sus>.85?.1:1))-(a.life*(a.sus>.85?.1:1))); return all.slice(0,S.lv.multi); }
function update(dt){
  S.t+=dt; S.msgT+=dt; for(const f of S.fx) f.t+=dt; S.fx=S.fx.filter(f=>f.t<(f.life||1.3)); S.shake=Math.max(0,S.shake-dt*20);
  if(S.scene==='ending'){ endingTick(dt); return; }

function autoTick(dt){
  const p=S.p, s=st(); S.move=null;
  // shopping when there is a safe surplus
  const buffer=Math.max(20,s.drain*30,s.goal*.04);
  if(!S.autoShopT||S.t>S.autoShopT){ S.autoShopT=S.t+3;
    for(const id of ['pow','multi','pow','rng','stl','arm','fire','spd','stop','hole']){ const sk=SK.find(x=>x.id===id); if(S.lv[id]>=sk.max) continue; const c=costOf(sk); if(S.life-c>buffer+c*.5&&S.life-c>s.goal*.05){ S.life-=c; S.lv[id]++; sfx('buy'); syncButtons(); break; } } }
  // dodge: incoming shots, falling rocks, chargers, lava warnings
  const threat=[...S.shots.map(x=>({x:x.x,y:x.y})),...S.rocks.filter(r=>!r.hit).map(r=>({x:r.x,y:r.y,r:r.r+10})),...S.npcs.filter(n=>n.state==='angry'&&(n.t.react==='charge'||n.t.react==='stampede')).map(n=>({x:n.x,y:n.y,r:60})),...S.fx.filter(f=>f.k==='warn').map(f=>({x:f.x,y:f.y,r:f.r+12}))]
    .find(o=>Math.hypot(o.x-p.x,o.y-p.y)<(o.r||46));

  if(S.lv.hole&&!S.holeUsed&&s.goal-S.life>0&&[...S.npcs,...S.trees].filter(n=>canSuck(n)&&n.type!=='vent').reduce((a,n)=>a+n.life,0)>(s.earth?0:s.goal*.25)&&!s.earth) useHole();
  if(s.earth&&S.lv.hole&&!S.holeUsed) useHole();
  // the best target: lots of years, not watching (sus), not angry, not too far
  const R=rngOf(S.lv.rng);
  let best=null,bv=-1; for(const n of [...S.npcs,...S.trees]){ if(!canSuck(n)) continue; if(n.state==='angry'||n.state==='flee') continue; if(n.sus>.8&&n.t.kind!=='tree'&&n.type!=='vent') continue;
    const d=Math.hypot(n.x-p.x,n.y-p.y), v=Math.min(n.life,powOf(S.lv.pow)*(n.type==='vent'?380:1)*6)/(1+d/90); if(v>bv){ bv=v; best=n; } }
  if(S.lv.fire&&S.fireCd<=0&&S.npcs.filter(n=>Math.hypot(n.x-p.x,n.y-p.y)<120&&n.life>5).length>=3) useFire();
  if(S.lv.stop&&!S.stopUsed&&S.npcs.filter(n=>n.state==='angry').length>=2) useStop();
  if(!best){ S.sucking=false; S.move={x:180,y:280}; return; }
  const d=Math.hypot(best.x-p.x,best.y-p.y);
  if(d>R*.8+(best.t.r||0)) S.move={x:best.x,y:best.y+(best.t.r||0)+10};
  S.sucking=d<=R+(best.t.r||0);
  // let go before a person gets angry (the vents of the Earth too)
  if(S.targets.some(n=>n.sus>.85&&n.t.kind!=='tree')&&S.targets.length===1) S.sucking=false;

cv.addEventListener('pointermove',e=>{ if(drag) S.move=toW(e); });
for(const ev of ['pointerup','pointercancel']) cv.addEventListener(ev,()=>{ drag=false; S.move=null; });
const sb=$('suckBtn');
sb.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); user(); if(S.scene==='play'&&!S.paused) S.sucking=true; try{ sb.setPointerCapture(e.pointerId); }catch(_){} sfx('suck'); });
for(const ev of ['pointerup','pointercancel','lostpointercapture']) sb.addEventListener(ev,()=>{ if(!S.auto) S.sucking=false; });
$('shopBtn').onclick=()=>{ ac(); user(); openShop(); };
$('closeShop').onclick=()=>{ user(); closeShop(); };
$('skBtn').onclick=()=>{ ac(); user(); useFire(); };
$('sk_stop').onclick=()=>{ ac(); user(); useStop(); };
$('sk_hole').onclick=()=>{ ac(); user(); useHole(); };
$('storyBtn').onclick=()=>{ ac(); user(); if(storyFn){ const f=storyFn; f(); } };
$('autoStartBtn').onclick=()=>{ ac(); setAuto(true); };
$('autoBtn').onclick=()=>{ ac(); setAuto(!S.auto); };
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };
const KM={arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',arrowdown:'d'};
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!S.auto); return; } if(k==='m'){ ac(); setMute(!muted); return; }
  if(KM[k]){ e.preventDefault(); user(); S.keys[KM[k]]=true; return; }
  if(k===' '){ e.preventDefault(); ac(); user(); if(S.scene==='play'&&!S.paused) S.sucking=true; else if(S.scene==='story'&&!e.repeat) $('storyBtn').click(); else if(S.scene==='ending'&&S.ending.t>26) titleScreen(); return; }
  if(e.repeat) return;
  if(k==='s'){ user(); if(S.paused) closeShop(); else openShop(); } else if(k==='f'){ ac(); user(); useFire(); } });
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(KM[k]) S.keys[KM[k]]=false; if(k===' '&&!S.auto) S.sucking=false; });
addEventListener('blur',()=>{ S.keys={}; if(!S.auto) S.sucking=false; });

/* ================= sound ================= */
let AC=null, muted=false; try{ muted=localStorage.getItem('dyson2Mute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='sine',v=.07,delay=0,f2){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v=.1,f=800,delay=0){ if(muted||!AC) return; const t=AC.currentTime+delay, n=Math.floor(AC.sampleRate*d), buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), fl=AC.createBiquadFilter(), gn=AC.createGain(); s.buffer=buf; fl.type='lowpass'; fl.frequency.value=f; gn.gain.value=v; s.connect(fl).connect(gn).connect(AC.destination); s.start(t); }
function sfx(k){
  if(k==='suck') tone(300,.3,'sine',.04,0,700);
  else if(k==='old') [523,494,440].forEach((q,i)=>tone(q,.2,'triangle',.04,i*.15));
  else if(k==='wither') noise(.5,.06,700);
  else if(k==='angry') tone(200,.2,'square',.05,0,140);
  else if(k==='cry') tone(900,.4,'triangle',.04,0,600);
  else if(k==='throw') noise(.08,.05,1200);
  else if(k==='curse') tone(180,.6,'sine',.05,0,90);
  else if(k==='hit'){ tone(160,.2,'square',.06,0,90); }
  else if(k==='quake'){ noise(.9,.18,200); }
  else if(k==='fire') noise(.6,.07,900);
  else if(k==='stop') tone(1200,.6,'sine',.05,0,300);
  else if(k==='hole'){ tone(80,1.4,'sawtooth',.08,0,30); noise(1.2,.15,400); }
  else if(k==='buy') tone(880,.12,'triangle',.05,0,1320);
  else if(k==='start') [330,392,494].forEach((q,i)=>tone(q,.14,'triangle',.05,i*.1));
  else if(k==='clear') [523,659,784,1046].forEach((q,i)=>tone(q,.18,'square',.05,i*.1));
  else if(k==='lose') [392,330,262,196].forEach((q,i)=>tone(q,.3,'triangle',.06,i*.2));
  else if(k==='end') [262,330,392,523,392,330,262].forEach((q,i)=>tone(q,.8,'sine',.04,i*.7));
}
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{ localStorage.setItem('dyson2Mute',m?'1':'0'); }catch(e){} }

setMute(muted); titleScreen();
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!S.manual) update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__dyson2={ get S(){ return S; }, setAuto, manual(v=true){ S.manual=v; }, step(dt=1/60){ update(dt); }, seed(v){ seed=(Math.abs(v|0)%2147483646)+1; }, startStage, stageIntro, titleScreen, buy, STAGES };
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
