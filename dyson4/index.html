const AI={lr:0,gt:0,tg:null,t:0,dash:false,px:0,py:0,st:0,esc:0,escDir:1,ban:new Map()};
function aiInput(dt){ const R=G.r, lim=STICK*R*.94; AI.t-=dt; AI.st+=dt; if(AI.esc>0) AI.esc-=dt;
  if(G.r>AI.lr*1.015){ AI.lr=G.r; AI.gt=G.el; } else if(G.el-AI.gt>9&&!G.over){ AI.gt=G.el; AI.esc=2.2; const a=Math.random()*6.28; AI.escV={x:Math.cos(a),y:Math.sin(a)}; AI.tg=null; AI.t=0; for(const o of G.objs) if(!o.dead&&o.r<=lim&&Math.random()<.5) AI.ban.set(o,G.el+6); }
  if(AI.st>.8){ AI.st=0; if(Math.hypot(G.x-AI.px,G.y-AI.py)<R*.5&&!G.over){ if(AI.tg) AI.ban.set(AI.tg,G.el+9); AI.tg=null; AI.t=0; AI.esc=1.3; AI.escDir=Math.random()<.5?1:-1; let ex=0,ey=0; for(const o of G.objs){ if(o.dead||o.r<=lim) continue; const dx=G.x-o.x, dy=G.y-o.y, dd=Math.hypot(dx,dy)||1; if(dd<R+o.r+R*1.2){ ex+=dx/dd; ey+=dy/dd; } } const el=Math.hypot(ex,ey); if(el>.2){ AI.escV={x:ex/el,y:ey/el}; } else { const a=Math.random()*6.28; AI.escV={x:Math.cos(a),y:Math.sin(a)}; } } AI.px=G.x; AI.py=G.y; }
  if(AI.t<=0||!AI.tg||AI.tg.dead||AI.tg.r>lim){ AI.t=.4; const cand=[]; const solids=[];
    for(const o of G.objs){ if(o.dead) continue; if(o.r>lim){ if(Math.hypot(o.x-G.x,o.y-G.y)<R*40) solids.push(o); continue; } if(o.nt>0) continue; const bn=AI.ban.get(o); if(bn&&bn>G.el) continue; const d=Math.hypot(o.x-G.x,o.y-G.y); cand.push([(o.r**3)/Math.pow(d+R*1.5,1.7),o,d]); }
    cand.sort((p,q)=>q[0]-p[0]); let best=null; const tops=cand.slice(0,14);
    for(const [sc,o,d] of tops){ const ux=(o.x-G.x)/(d||1), uy=(o.y-G.y)/(d||1); let blk=false; for(const s of solids){ const sx=s.x-G.x, sy=s.y-G.y, al=sx*ux+sy*uy; if(al<0||al>d) continue; if(Math.abs(sx*uy-sy*ux)<R+s.r*.9){ blk=true; break; } } if(!blk){ best=o; break; } }

  let tx=0,ty=0,far=0; if(AI.tg){ const dx=AI.tg.x-G.x, dy=AI.tg.y-G.y, d=Math.hypot(dx,dy)||1; tx=dx/d; ty=dy/d; far=d; }
  let ax=0,ay=0,near=false; const reach=R*1.5;
  for(const o of G.objs){ if(o.dead||o.r<=lim) continue; const dx=G.x-o.x, dy=G.y-o.y, d=Math.hypot(dx,dy)||1, gap=d-(R+o.r); if(gap<reach){ const w=1-Math.max(0,gap)/reach, nx=dx/d, ny=dy/d; let px=-ny, py=nx; if(px*tx+py*ty<0){ px=-px; py=-py; } ax+=nx*w*.7+px*w*1.6; ay+=ny*w*.7+py*w*1.6; near=true; } }
  const H=G.half, m=R*1.6; if(G.x<-H+m) ax+=1; if(G.x>H-m) ax-=1; if(G.y<-H+m) ay+=1; if(G.y>H-m) ay-=1;
  let x=tx+ax, y=ty+ay; if(AI.esc>0&&AI.escV){ x=AI.escV.x+ax*.3; y=AI.escV.y+ay*.3; }
  const l=Math.hypot(x,y)||1; x/=l; y/=l; let clear=true; if(AI.tg&&far>R*7&&G.dashCD<=0){ for(const o of G.objs){ if(o.dead||o.r<=lim) continue; const ox=o.x-G.x, oy=o.y-G.y, al=ox*x+oy*y; if(al<0||al>far+R*2) continue; const pd=Math.abs(ox*y-oy*x); if(pd<R+o.r+R*.8){ clear=false; break; } } }

  $('#stName').textContent=`第${st.id}面 ${st.name}　${sz} / ${goalText(st)}`; $('#bar').firstElementChild.style.width=(pr*100).toFixed(1)+'%'; $('#barT').textContent=Math.floor(pr*100)+'%';
  const m=Math.floor(G.t/60), s=Math.floor(G.t%60); const tm=$('#tm'); tm.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`; tm.classList.toggle('low',G.t<20);
  const b=$('#bDash'); b.disabled=G.dashCD>0; b.textContent=G.dashCD>0?Math.ceil(G.dashCD):'ダッシュ'; }
function tick(dt){ T+=dt/1000; S.sceneT+=dt;
  for(const tm of timers.slice()){ tm.t-=dt; if(tm.t<=0){ timers.splice(timers.indexOf(tm),1); tm.r(); } }
  dlgTick(dt);
  if(G&&S.phase==='game'&&!S.sceneOn&&G.playing){ let rest=dt/1000; while(rest>0){ const h=Math.min(rest,1/30); rest-=h; let inp; if(S.auto&&!G.bh) inp=aiInput(h); else { const v=inputVec(); inp={x:v.x,y:v.y,dash:false}; }
      if(dashReq){ inp.dash=true; dashReq=false; } update(h,inp); } hud(); if(G.over&&!G.fin){ G.fin=true; snd(G.over==='clear'?'clear':'fail'); toast(G.over==='clear'?'目標達成！':'時間切れ…',2000); wait(S.turbo?20:1700).then(()=>{ G.playing=false; if(G.done) G.done(G.over); }); } }
  if(S.auto){ if(S.phase==='title'){ S.titleT=(S.titleT||0)+dt; if(S.titleT>1200){ S.titleT=-1e9; runGame(0); } }
    if(S.phase==='ending'){ S.endT=(S.endT||0)+dt; if(S.endT>(S.turbo?200:8000)) toTitle(); } } }
let last=0; function frame(ts){ const dt=last?Math.min(100,ts-last):0; last=ts; tick(dt); if(S.phase==='title') drawTitle(); else render(); requestAnimationFrame(frame); }
function playStage(si){ return new Promise(res=>{ G=newGame(si); G.cam.s=Math.min(CW,CH)/(G.r*5.4); G.cam.x=G.x; G.cam.y=G.y; G.done=res; G.playing=true; AI.tg=null; AI.ban=new Map(); AI.esc=0; AI.lr=0; AI.gt=0; AI.px=0; AI.py=0; S.sceneOn=false; document.body.classList.remove('scene'); $('#hint').style.opacity=.8; hud(); }); }

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
