<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火器円舞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
:root{
  --bg:#171210; --panel:#241c18; --panel2:#2f2520; --ink:#f3e9d8; --sub:#b9a78e; --line:#4a3a30;
  --gold:#d9ae5c; --red:#c8413a; --blue:#4d7fc0; --green:#4fa36b; --warn:#e0a13a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 50% -10%,#3a2418 0,transparent 60%),var(--bg);min-height:100vh}
.mincho{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
#app{max-width:560px;margin:0 auto;padding:10px 12px 30px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pri{background:linear-gradient(#a8322c,#7c201c);border-color:#e0766c;font-weight:700}
.gold{background:linear-gradient(#b8893a,#8a6222);border-color:#f0cf8a;color:#fff8e6;font-weight:700}
[hidden]{display:none!important}
header.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
header.top a{color:var(--sub);text-decoration:none;font-size:14px;padding:6px 2px}
header.top .ttl{flex:1;text-align:center;font-size:18px;color:var(--gold);letter-spacing:.1em}
header.top button{padding:5px 9px;font-size:13px}
#autoBtn[aria-pressed="true"]{background:var(--gold);color:#1b1410;border-color:#fff0c8}
.res{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.res b{color:var(--ink);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.tabs button{padding:8px 0;font-size:14px}
.tabs button.on{background:var(--gold);color:#1b1410;border-color:#fff0c8;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* タイトル */
#sc-title{text-align:center;padding-top:6vh}
.logo{font-size:clamp(52px,17vw,84px);letter-spacing:.12em;margin:10px 0 0;color:#f6e3b4;text-shadow:0 0 18px rgba(217,174,92,.45),0 3px 0 #6b1d18}
.logo-sub{letter-spacing:.5em;color:var(--sub);font-size:13px;margin:6px 0 20px}
#titleArt{width:100%;max-width:420px;aspect-ratio:3/2;display:block;margin:0 auto 18px;border-radius:12px;border:1px solid var(--line)}
#sc-title .pri,#sc-title .gold{width:100%;max-width:360px;font-size:18px;padding:12px;margin:6px auto;display:block}
/* 初期銃 */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick img{width:84px;height:84px;border-radius:10px}
/* 部隊カード */
.pcard{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:6px}
.pcard img{width:64px;height:64px;border-radius:8px;grid-row:span 3}
.pcard .nm{font-weight:700;font-size:15px}
.pcard .nm small{font-weight:400;color:var(--sub);font-size:11px;margin-left:4px}
.lead{display:inline-block;background:var(--red);color:#fff;font-size:10px;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:2px}
.hpbar{height:8px;background:#120d0b;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--green)}
.hpbar i.l{background:#9bb34a}.hpbar i.m{background:var(--warn)}.hpbar i.h{background:var(--red)}
.sous{display:flex;gap:4px;flex-wrap:wrap}
.sous select{font:inherit;font-size:11px;background:#1b1512;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px;max-width:120px}
.tag{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--sub)}
.tag.sakura{color:#ffb7c9;border-color:#ffb7c9}.tag.tired{color:#ff8a7a;border-color:#ff8a7a}
.tag.h{color:#fff;background:var(--red);border-color:var(--red)}.tag.m{color:#1b1410;background:var(--warn);border-color:var(--warn)}.tag.l{color:#1b1410;background:#9bb34a;border-color:#9bb34a}
.mini{display:flex;gap:4px}
.mini button{padding:3px 8px;font-size:12px}
/* 合戦場 */
.maps button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px}
.maps .mn{font-size:17px;font-weight:700}
.maps .ms{font-size:12px;color:var(--sub)}
.maps .clr{color:var(--gold);float:right}
/* 工房 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid4 button,.grid3 button{padding:8px 2px;font-size:13px;line-height:1.3}
.grid4 small,.grid3 small{display:block;font-size:10px;color:var(--sub)}
/* 地図 */
#mapBox{position:relative;width:100%;aspect-ratio:16/10;background:linear-gradient(#2c3a2a,#1f2a1d);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#mapBox.night{background:linear-gradient(#141a2e,#0b0f1c)}
#mapBox svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid #0006;color:#1b1410;background:#d8c9a8}
.node.b{background:#d98a6a}.node.r{background:#8fc27a}.node.boss{background:#c8413a;color:#fff;width:42px;height:42px;margin:-21px 0 0 -21px}.node.S{background:#e7d9b3}
.node.done{opacity:.55}
#marker{position:absolute;width:26px;height:26px;margin:-36px 0 0 -13px;transition:left .6s,top .6s;pointer-events:none;font-size:22px;text-align:center}
#compass{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:radial-gradient(#f3e3bb,#b58d45);border:3px solid #6b4a1c;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 30px #0009}
#compass i{display:block;transition:transform 1s cubic-bezier(.2,.9,.3,1);font-style:normal}
.plist{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
/* 戦闘 */
#sc-battle{position:relative}
.bhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:6px}
.side{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.u{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 3px 4px;text-align:center;min-height:98px;transition:transform .15s}
.u img{width:100%;aspect-ratio:1;border-radius:6px;display:block}
.u .n{font-size:10px;line-height:1.2;height:12px;overflow:hidden;white-space:nowrap;margin:2px 0}
.u .hpbar{height:6px}
.u .sp{display:flex;gap:2px;margin-top:2px;height:4px}
.u .sp i{flex:1;background:#6b8fc7;border-radius:2px}
.u .sp i.x{background:#3a2e28}
.u .st{position:absolute;left:2px;right:2px;top:30%;font-size:11px;font-weight:700;border-radius:4px;padding:1px 0;pointer-events:none}
.u.down{filter:grayscale(1) brightness(.55)}
.u.brk{filter:grayscale(1) brightness(.3)}
.u.act{transform:translateY(-8px) scale(1.06);border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.enemy .u.act{transform:translateY(8px) scale(1.06);border-color:var(--red);box-shadow:0 0 12px var(--red)}
.u.hit{animation:hit .35s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-4px);background:#6b1d18}75%{transform:translateX(4px)}}
.u.shin{border-color:#ff6ad5;box-shadow:0 0 10px #ff6ad5}
.dmg{position:absolute;left:0;right:0;top:20%;font-weight:800;font-size:16px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;animation:up .8s forwards;pointer-events:none;z-index:3}
.dmg.c{color:#ffd24a;font-size:19px}.dmg.s{color:#9cc3ff;font-size:13px}.dmg.m{color:#ccc;font-size:12px}
@keyframes up{to{transform:translateY(-26px);opacity:0}}
.form{font-size:11px;color:var(--sub);margin:4px 0}
.form b{color:var(--gold)}
#stage{position:relative;height:118px;margin:6px 0;border-radius:10px;background:linear-gradient(#2a1d17,#1b1411);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#stage.night{background:linear-gradient(#141a2e,#0b0f1c)}
#phase{font-size:13px;color:var(--gold);letter-spacing:.2em}
#msg{font-size:17px;font-weight:700;padding:0 10px;line-height:1.4}
#msg.big{font-size:28px;color:#ff9ad8;text-shadow:0 0 12px #ff3fb0}
#msg.duel{font-size:26px;color:#ffd24a}
#bubble{font-size:13px;color:#f3e9d8;margin-top:4px;min-height:18px;padding:0 8px}
#forms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
#forms button{padding:9px 2px;font-size:14px;line-height:1.25}
#forms small{display:block;font-size:10px;color:var(--sub)}
#forms button.adv{border-color:#6fd08a;box-shadow:inset 0 0 0 1px #6fd08a}
#forms button.dis{border-color:#e0766c}
#forms .adv small{color:#8fe0a4}#forms .dis small{color:#ff9d93}
.bctl{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.bctl button{font-size:12px;padding:5px 10px}
/* モーダル */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
#mbox{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:14px}
#mbox h2{margin:0 0 8px;text-align:center;color:var(--gold)}
.rank{font-size:64px;text-align:center;line-height:1;margin:4px 0;color:#ffd24a;text-shadow:0 0 16px #c8413a}
.rank small{display:block;font-size:14px;color:var(--ink);text-shadow:none}
.homare{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:8px;margin:8px 0}
.homare img{width:60px;height:60px;border-radius:8px}
.explist{font-size:13px;line-height:1.7}
.up{color:#ffd24a;font-weight:700}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns button{flex:1;padding:11px}
.rlist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rlist button{padding:4px;font-size:11px}
.rlist img{width:100%;border-radius:6px;display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);border-radius:20px;padding:8px 16px;font-size:13px;z-index:30;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
.keys{font-size:11px;color:var(--sub);margin-top:10px;text-align:center}
@media (pointer:coarse){.keys{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <header class="top">
    <a href="../">← 一覧</a>
    <span class="ttl mincho">火器円舞</span>
    <button id="autoBtn" aria-pressed="false" title="オート（O キー）">🤖 オート</button>
    <button id="sndBtn" aria-pressed="true" title="音（M キー）">🔊</button>
  </header>

  <!-- タイトル -->
  <section id="sc-title">
    <div class="logo mincho">火器円舞</div>
    <div class="logo-sub mincho">かきえんぶ</div>
    <canvas id="titleArt" width="600" height="400"></canvas>
    <button class="pri mincho" id="startBtn">はじめる</button>
    <button id="resetBtn" style="margin-top:14px;font-size:12px">最初からやり直す</button>
    <p class="note" id="bestT" style="margin-top:14px"></p>
    <p class="note">銃に宿った九十九神「銃士（じゅうし）」を率いて、<br>歴史をむしばむ「錆鬼（さびおに）」をうち払え。</p>
  </section>

  <!-- 初期銃えらび -->
  <section id="sc-pick" hidden>
    <div class="panel">
      <h3 class="mincho">最初の一挺をえらぶ</h3>
      <p class="note">はじめに共に戦う銃士をえらんでください。馬上筒と狭間筒もなかまに加わります。</p>
      <div class="pick" id="pickBox"></div>
    </div>
  </section>

  <!-- 本陣 -->
  <section id="sc-home" hidden>
    <div class="res" id="resBar"></div>
    <div class="tabs" id="tabs">
      <button data-t="party" class="on">部隊</button><button data-t="sortie">出陣</button><button data-t="work">工房</button><button data-t="list">名簿</button>
    </div>
    <div id="tab-party"></div>
    <div id="tab-sortie" hidden></div>
    <div id="tab-work" hidden></div>
    <div id="tab-list" hidden></div>
  </section>

  <!-- 合戦場マップ -->
  <section id="sc-map" hidden>
    <div class="row" style="margin-bottom:6px"><b class="mincho grow" id="mapTitle" style="font-size:17px;color:var(--gold)"></b><span class="note" id="mapInfo"></span></div>
    <div id="mapBox"><svg id="mapSvg" viewBox="0 0 100 62.5" preserveAspectRatio="none"></svg><div id="marker">🚩</div><div id="compass" hidden><i>🧭</i></div></div>
    <div class="plist" id="mapParty"></div>
    <p class="note" id="mapNote" style="min-height:20px;margin:8px 0"></p>
    <div class="row"><button class="pri grow" id="goBtn" style="padding:12px;font-size:17px">進軍</button><button id="backBtn" style="padding:12px 18px">帰還</button></div>
  </section>

  <!-- 戦闘 -->
  <section id="sc-battle" hidden>
    <div class="bhead"><span id="bTitle"></span><span id="bSpeedWrap"><button id="speedBtn">▶▶ 倍速</button></span></div>
    <div class="side enemy" id="sideE"></div>
    <div class="form" id="formE"></div>
    <div id="stage"><div id="phase"></div><div id="msg"></div><div id="bubble"></div></div>
    <div class="form" id="formU"></div>
    <div class="side" id="sideU"></div>
    <div id="forms" hidden></div>
    <p class="keys">PC：1〜6 陣形　Enter 決定・次へ　O オート　M 音</p>
  </section>
</div>

<div id="modal" hidden><div id="mbox"></div></div>
<div id="toast" style="opacity:0"></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let seedV=(Date.now()%2147483646)+1;
function rnd(){ seedV=seedV*16807%2147483647; return (seedV-1)/2147483646; }
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function wpick(pairs){ let s=0; for(const p of pairs) s+=p[1]; let r=rnd()*s; for(const p of pairs){ r-=p[1]; if(r<0) return p[0]; } return pairs[pairs.length-1][0]; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= データ ================= */
// 銃種（刀種にあたる）
const TYPES={
  tan:{n:'短筒',slots:1,range:'単',night:1.3,col:'#a8443c',sou:['軽歩','重歩','投石']},
  ki:{n:'騎銃',slots:2,range:'単',night:1.15,col:'#b0702c',sou:['軽歩','重歩','軽騎','盾','投石']},
  sho:{n:'小銃',slots:2,range:'単',night:1.0,col:'#35699a',sou:['軽歩','重歩','軽騎','重騎','盾','投石','砲兵']},
  sam:{n:'士筒',slots:3,range:'単',night:.8,col:'#4a579c',sou:['軽歩','重歩','軽騎','重騎','盾','弓','砲兵']},
  oz:{n:'大筒',slots:3,range:'複',night:.6,col:'#6a4394',sou:['軽歩','重歩','盾']},
  haz:{n:'狭間筒',slots:1,range:'貫',night:1.0,col:'#2f8266',sou:['軽歩','重歩','盾']},
  rap:{n:'喇叭銃',slots:2,range:'全',night:.9,col:'#8f7630',sou:['軽歩','重歩','軽騎','盾']},
};
const RANGE_TXT={'単':'単体','複':'複数（2〜3体）','全':'全体','貫':'貫通（護装を無視）'};
const BASE={
  tan:{hp:24,atk:30,def:22,mob:42,crit:48,scout:32,hide:46},
  ki:{hp:30,atk:34,def:28,mob:37,crit:40,scout:28,hide:38},
  sho:{hp:38,atk:44,def:36,mob:32,crit:30,scout:22,hide:26},
  sam:{hp:48,atk:54,def:46,mob:26,crit:22,scout:18,hide:16},
  oz:{hp:58,atk:60,def:52,mob:15,crit:18,scout:12,hide:10},
  haz:{hp:42,atk:46,def:30,mob:30,crit:28,scout:30,hide:22},
  rap:{hp:46,atk:40,def:36,mob:22,crit:24,scout:20,hide:18},
};
// 護装（刀装にあたる）
const SOU={
  '軽歩':{n:'軽歩兵',dur:6,def:2,mob:2},
  '重歩':{n:'重歩兵',dur:10,def:4,mob:-1},
  '盾':{n:'盾兵',dur:14,def:3},
  '軽騎':{n:'軽騎兵',dur:8,atk:2,mob:3},
  '重騎':{n:'重騎兵',dur:12,atk:3,def:2},
  '投石':{n:'投石兵',dur:5,ranged:7},
  '弓':{n:'弓兵',dur:6,ranged:9},
  '砲兵':{n:'砲兵',dur:6,ranged:12,scout:3},
};
const SOU_KEYS=Object.keys(SOU);
const RANKS=['並','上','特上'], RMUL=[1,1.5,2.1];
const RANGED_ORDER=['弓','砲兵','投石'];
// 陣形：魚鱗＞鶴翼＞横隊＞方陣＞雁行＞逆行＞魚鱗
const FORMS=[
  {n:'魚鱗陣',d:'打撃↑ 統率↓',m:{atk:1.1,def:.9}},
  {n:'鶴翼陣',d:'打撃↑ 統率・機動↓',m:{atk:1.12,def:.9,mob:.9}},
  {n:'横隊陣',d:'統率・必殺↑',m:{def:1.1,crit:1.3,atk:.95}},
  {n:'方陣',d:'統率↑↑ 機動・打撃↓',m:{def:1.18,mob:.9,atk:.92}},
  {n:'雁行陣',d:'機動↑ 統率・必殺↓',m:{mob:1.12,def:.92,crit:.8}},
  {n:'逆行陣',d:'機動↑↑ 統率↓',m:{mob:1.18,def:.9}},
];
const BEATS=[1,2,3,4,5,0];
const advOf=(a,b)=>BEATS[a]===b?1:BEATS[b]===a?-1:0;

const CH=[
  {id:'tane',n:'種子島',t:'sho',r:2,hair:'#2a211c',eye:'#c9463d',cloth:'#9c2f2a',sty:2,
   join:'種子島だ。この国で最初に火を噴いた一挺……って言えば、わかるかな',hom:'当然。始まりの銃だからね',shin:'火縄はまだ燃えてる……！',brk:'……火が、消える……'},

function tone(f,d=.1,type='square',v=.05,f2=0,delay=0){ if(!soundOn||!AC||S.manual)return; const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d=.15,v=.12,f=1200,delay=0){ if(!soundOn||!AC||S.manual)return; const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; fl.type='bandpass'; fl.frequency.value=f; g.gain.value=v; s.connect(fl).connect(g).connect(AC.destination); s.start(AC.currentTime+delay); }

/* ================= 銃士の計算 ================= */
function rmulOf(r){ return 1+(r-1)*.06; }
function maxHp(c){ const d=CHM[c.cid]; return Math.round(BASE[d.t].hp*rmulOf(d.r)*(1+c.lv*.03)); }
function expNext(lv){ return 25+lv*18; }
function addChar(cid,lv=1){ const c={u:G.uid++,cid,lv,exp:0,hp:0,cond:49,sou:[],omamori:false}; c.hp=maxHp(c); const T=TYPES[CHM[cid].t]; c.sou=new Array(T.slots).fill(null); G.chars.push(c); return c; }
function charBy(u){ return G.chars.find(c=>c.u===u); }
function itemBy(u){ return G.items.find(i=>i.u===u); }
function hpState(hp,max){ const r=hp/max; return hp<=0?'崩':r<=.25?'重傷':r<=.5?'中傷':r<=.75?'軽傷':''; }
function hpCls(hp,max){ const r=hp/max; return r<=.25?'h':r<=.5?'m':r<=.75?'l':''; }
function condTag(c){ return c.cond>=50?'<span class="tag sakura">🌸 桜</span>':c.cond<=20?'<span class="tag tired">疲労</span>':''; }
function condMul(c){ return c.cond>=50?1.1:c.cond<=20?.8:c.cond<=29?.9:1; }
function power(c){ const d=CHM[c.cid], b=BASE[d.t]; return Math.round((b.atk+b.def+b.hp*.5)*rmulOf(d.r)*(1+c.lv*.04)); }

function repairCost(c){ const miss=maxHp(c)-c.hp; return [0,0,0,0].map(()=>Math.ceil(miss*.45)); }
function canPay(cost){ return cost.every((v,i)=>G.res[i]>=v); }
function pay(cost){ cost.forEach((v,i)=>G.res[i]-=v); }
function repairAll(silent){
  let n=0,fail=0; for(const c of G.chars){ if(c.hp<maxHp(c)){ const cost=repairCost(c); if(canPay(cost)){ pay(cost); c.hp=maxHp(c); n++; } else fail++; } }
  saveG(); if(!silent){ toast(n?`${n} 挺を手入れしました`+(fail?`（資材不足で ${fail} 挺は手入れできず）`:''):fail?'資材が足りません':'手入れの必要はありません'); SFX.ok(); renderHome(); }
  return n;
}
function autoEquip(all){
  // 空いている枠に、在庫からいちばん良い護装をつける（遠戦用を1つ入れる）
  const list=all?G.chars:G.party.map(charBy);
  for(const c of list){ const T=TYPES[CHM[c.cid].t];
    c.sou.forEach((iu,k)=>{ if(iu&&itemBy(iu)) return; c.sou[k]=null;
      const hasRanged=c.sou.some(x=>x&&SOU[itemBy(x).type].ranged);
      const free=G.items.filter(x=>T.sou.includes(x.type)&&!isEquipped(x.u));
      const score=x=>{ const s=SOU[x.type]; let v=(s.dur+(s.def||0)*2+(s.atk||0)*2)*RMUL[x.rank]; if(s.ranged) v=(!hasRanged&&T.slots>=2)?s.ranged*3*RMUL[x.rank]:v*.4; return v; };
      free.sort((a,b)=>score(b)-score(a)); if(free[0]) c.sou[k]=free[0].u; }); }
}

/* ---------- 出陣・マップ ---------- */
function sortie(mi){

  const party=G.party.map(charBy);
  const lead=party[0]; if(lead.hp/maxHp(lead)<=.25){ toast('隊長が重傷です。手入れしてから出陣しよう'); return; }
  G.stats.sorties++;
  const dur={}; party.forEach(c=>c.sou.forEach(iu=>{ if(iu){ const it=itemBy(iu); if(it) dur[iu]=Math.round(SOU[it.type].dur*RMUL[it.rank]); } }));
  S.sortie={mi,node:'S',visited:['S'],dur,battles:0,over:false,why:''};
  saveG(); show('map'); renderMap(); setMapNote('羅針盤にしたがって進軍します。'); SFX.taiko();
}
function curMap(){ return MAPS[S.sortie.mi]; }

  $('mapSvg').innerHTML=lines;
  for(const k in N){ const n=N[k], e=document.createElement('div'); e.className='node '+(k==='S'?'S':n.k)+(so.visited.includes(k)&&k!=='S'?' done':''); e.style.left=n.x+'%'; e.style.top=(n.y/62.5*100)+'%'; e.textContent=k==='S'?'本':k==='X'?'将':n.k==='r'?'資':k; box.appendChild(e); }

function leaderHeavy(){ const c=charBy(G.party[0]); return c.hp/maxHp(c)<=.25; }
function updateMapButtons(){
  const so=S.sortie, m=curMap(); const ended=so.over||(so.node!=='S'&&!(m.nodes[so.node].nx||[]).length);
  $('goBtn').disabled=ended||!!S.moving||leaderHeavy(); $('backBtn').disabled=!!S.moving;
  $('backBtn').textContent=ended?'本陣へ帰還':'帰還';
  if(!ended&&leaderHeavy()) setMapNote('隊長が重傷のため、これ以上は進軍できない。帰還しよう。');
  else if(!ended){ const heavy=G.party.map(charBy).filter(c=>c.hp>0&&c.hp/maxHp(c)<=.25&&!c.omamori); if(heavy.length) setMapNote(`⚠ ${heavy.map(c=>CHM[c.cid].n).join('・')} が重傷！ このまま進軍して倒れると破壊されます。`); }
}
function setMapNote(t){ $('mapNote').textContent=t; }
function advance(){
  const so=S.sortie; if(!so||S.moving||so.over) return; const m=curMap();
  const opts=so.node==='S'?m.start:m.nodes[so.node].nx; if(!opts||!opts.length) return;
  const nxt=wpick(opts); const multi=opts.length>1;
  S.moving={t:0,dur:multi?1.6:.7,to:nxt,multi};
  if(multi){ const cp=$('compass'); cp.hidden=false; const ang=Math.atan2(m.nodes[nxt].y-m.nodes[so.node].y,m.nodes[nxt].x-m.nodes[so.node].x)*180/Math.PI+90+720; cp.firstChild.style.transform=`rotate(${ang}deg)`; setMapNote('羅針盤が回る……'); }

function arrive(k){

  else { setMapNote('敵部隊と遭遇！'); startBattle(k); }
}
function endSortie(){
  // 帰還：護装の耐久を戻す（こわれた護装はなくなる）。気力を少し下げる
  const so=S.sortie; if(!so) return;

/* ================= 戦闘 ================= */
function unitFromChar(c,idx){
  const d=CHM[c.cid], b=BASE[d.t], m=rmulOf(d.r);
  const sou=c.sou.map(iu=>{ const it=iu&&itemBy(iu); if(!it) return null; const dur=S.sortie.dur[iu]??Math.round(SOU[it.type].dur*RMUL[it.rank]); return {u:iu,type:it.type,rank:it.rank,dur,max:Math.round(SOU[it.type].dur*RMUL[it.rank])}; }).filter(x=>x&&x.dur>0);
  const mh=maxHp(c);
  return {side:0,i:idx,ref:c,name:d.n,t:d.t,lv:c.lv,hp:c.hp,max:mh,atk:b.atk*m,def:b.def*m,mob:b.mob*m,crit:b.crit,scout:b.scout,hide:b.hide,cm:condMul(c),
    sou,state:c.hp<=0?'down':'ok',pre:c.hp<=0,wasHeavy:c.hp>0&&c.hp/mh<=.25,omamori:c.omamori,shin:false,mHurt:false,dealt:0,kills:0,img:charImg(c.cid)};
}
function enemyUnit(code,idx,m){

  const hp=Math.round(b.hp*f*(boss?1.5:1)*(1+lv*.03));
  const sou=[]; const T=TYPES[t]; const ns=Math.min(T.slots,m.souLv+(boss?1:0)+(rnd()<.5?1:0));
  for(let k=0;k<ns;k++){ const ty=pick(T.sou), rk=Math.min(2,Math.max(0,m.souLv-1+ri(0,1))); const mx=Math.round(SOU[ty].dur*RMUL[rk]); sou.push({type:ty,rank:rk,dur:mx,max:mx}); }
  return {side:1,i:idx,name:boss?m.boss:EN_NAME[t],t,lv,hp,max:hp,atk:b.atk*f,def:b.def*f,mob:b.mob*f,crit:b.crit*.6,scout:b.scout*f,hide:b.hide*f,cm:1,
    sou,state:'ok',pre:false,wasHeavy:false,shin:false,dealt:0,kills:0,boss,img:enImg(t,boss)};
}
function startBattle(k){

}
function buildBattleUI(){

function drawU(u){

function floatDmg(u,txt,cls){ if(!u.el) return; const s=document.createElement('div'); s.className='dmg '+(cls||''); s.textContent=txt; u.el.appendChild(s); setTimeout(()=>s.remove(),820); }
function flash(u,cls,ms=350){ if(!u.el) return; u.el.classList.remove(cls); void u.el.offsetWidth; u.el.classList.add(cls); setTimeout(()=>u.el&&u.el.classList.remove(cls),ms); }

function scout(){

function aiForm(){

  let best=0,bs=-1e9; FORMS.forEach((_,i)=>{ let s=0; m.forms.forEach((w,j)=>s+=w*advOf(i,j)); if(s>bs){bs=s;best=i;} }); return best;
}

/* ---------- 戦闘の計算 ---------- */
function statOf(u,k,B){
  let v=u[k]; for(const s of u.sou) if(s.dur>0) v+=(SOU[s.type][k]||0)*RMUL[s.rank];
  const form=FORMS[u.side?B.enForm:B.myForm]; v*=form.m[k]||1;
  if(k==='atk'||k==='mob') v*=u.cm;
  if(B.night&&(k==='atk'||k==='crit')) v*=TYPES[u.t].night;
  return v;
}
const alive=(arr)=>arr.filter(u=>u.state==='ok');
function snap(u){ return {hp:u.hp,sou:u.sou.map(s=>s.dur),state:u.state,shin:u.shin}; }
function applyDmg(B,att,tgt,dmg,pierce,melee,ev,crit){
  const parts=[]; let rest=dmg, total=0;
  if(!pierce) for(const s of tgt.sou){ if(s.dur<=0||rest<=0) continue; const take=Math.min(s.dur,rest); s.dur-=take; rest-=take; total+=take; parts.push({sou:1,v:take}); }
  let broke=false,om=false;
  if(rest>0){ const take=Math.min(tgt.hp,rest); tgt.hp-=take; total+=take; parts.push({v:take});
    if(tgt.hp<=0){ tgt.hp=0;
      if(tgt.side===0&&tgt.wasHeavy){ if(tgt.omamori){ tgt.omamori=false; tgt.hp=tgt.max; om=true; } else { tgt.state='brk'; broke=true; } }
      else tgt.state='down';
      if(tgt.state!=='ok'){ att.kills++; tgt.downNow=true; } } }
  if(melee&&tgt.side===0&&tgt.hp>0&&tgt.hp/tgt.max<=.5) tgt.mHurt=true;
  att.dealt+=total; B.dmg[att.side]+=total;
  return {tgt:[tgt.side,tgt.i],parts,crit,after:snap(tgt),broke,om};
}
function meleeDmg(B,a,t,mul){
  const A=statOf(a,'atk',B)*(1+a.lv*.04), D=statOf(t,'def',B)*(1+t.lv*.04);
  let d=(A*.55-D*.3)*(.85+rnd()*.3)*mul;
  const adv=advOf(a.side?B.enForm:B.myForm,a.side?B.myForm:B.enForm); if(adv>0) d*=1.2; else if(adv<0) d*=.85;
  return Math.max(1,Math.round(d));
}
function attack(B,a,ev,duel){
  const foes=alive(a.side?B.us:B.them); if(!foes.length) return;
  const T=TYPES[a.t]; let targets=[pick(foes)], mul=1;
  if(!duel){ if(T.range==='複'){ const n=Math.min(foes.length,ri(2,3)); targets=foes.slice().sort(()=>rnd()-.5).slice(0,n); mul=.85; } else if(T.range==='全'){ targets=foes; mul=.7; } }
  // 真剣必殺（中傷以下で白兵戦の攻撃を受けていると、確率で発動）
  let shinNow=false;
  if(a.side===0&&!a.shin&&a.mHurt&&rnd()<.18+statOf(a,'crit',B)/300){ a.shin=true; shinNow=true; ev.push({k:'shin',a:[0,a.i],after:snap(a),dur:1.3}); }
  const crit=a.shin||rnd()<Math.min(.3,statOf(a,'crit',B)/320);
  const hits=targets.map(t=>applyDmg(B,a,t,meleeDmg(B,a,t,mul*(crit?1.5:1)),T.range==='貫',true,ev,crit));
  ev.push({k:'hit',a:[a.side,a.i],hits,crit,dur:.62,melee:true,duel});
  if(shinNow&&alive(a.side?B.us:B.them).length&&a.state==='ok') attack(B,a,ev,duel);
}
function simulate(B){
  const ev=B.q; B.dmg=[0,0];
  B.hp0=[B.us,B.them].map(s=>s.filter(u=>!u.pre).reduce((a,u)=>a+u.hp+u.sou.reduce((x,s)=>x+s.dur,0),0));
  const adv=advOf(B.myForm,B.enForm);
  ev.push({k:'phase',p:'遠戦',m:adv>0?'陣形有利！':adv<0?'陣形不利……':'',dur:.8});
  // 遠戦：弓→砲→投石の順
  let any=false;
  for(const ty of RANGED_ORDER) for(const side of [B.us,B.them]) for(const u of side){ if(u.state!=='ok') continue;
    for(const s of u.sou){ if(s.type!==ty||s.dur<=0) continue; const foes=alive(side===B.us?B.them:B.us); if(!foes.length) break; const t=pick(foes); any=true;
      if(B.night&&rnd()<.55){ ev.push({k:'miss',a:[u.side,u.i],t:[t.side,t.i],sou:SOU[ty].n,dur:.5}); continue; }
      const D=statOf(t,'def',B)*(1+t.lv*.04);
      const dmg=Math.max(1,Math.round(SOU[ty].ranged*RMUL[s.rank]*(.9+rnd()*.2)*(1+u.lv*.03)-D*.1));
      ev.push({k:'hit',a:[u.side,u.i],hits:[applyDmg(B,u,t,dmg,false,false,ev,false)],ranged:SOU[ty].n,dur:.55}); } }
  if(!any) ev.push({k:'phase',p:'遠戦',m:'遠戦なし',dur:.4});
  // 白兵戦：機動の高い順に二巡
  ev.push({k:'phase',p:'白兵戦',m:'',dur:.7});
  for(let r=0;r<2;r++){
    const order=[...B.us,...B.them].filter(u=>u.state==='ok').map(u=>({u,m:statOf(u,'mob',B)*(.9+rnd()*.2)})).sort((a,b)=>b.m-a.m).map(x=>x.u);
    for(const u of order){
      if(u.state!=='ok') continue;
      const mine=alive(B.us), foes=alive(B.them); if(!mine.length||!foes.length) break;
      // 一騎打ち：こちらが隊長だけ、敵も1体だけ
      if(!B.duel&&mine.length===1&&mine[0].i===0&&foes.length===1&&B.us.length>1){ duel(B,mine[0],foes[0],ev); break; }
      attack(B,u,ev,false);
    }
    if(B.duel||!alive(B.us).length||!alive(B.them).length) break;
  }
  judge(B); ev.push({k:'end',dur:.9});
}
function duel(B,me,en,ev){
  B.duel=true; ev.push({k:'duel',dur:1.3});
  let a=statOf(me,'mob',B)>=statOf(en,'mob',B)?me:en;
  for(let n=0;n<16&&me.state==='ok'&&en.state==='ok';n++){ attack(B,a,ev,true); a=a===me?en:me; }
  B.duelWin=me.state==='ok';
}
function judge(B){
  const ourDown=B.us.filter(u=>u.downNow).length, enDown=B.them.filter(u=>u.state!=='ok').length, tot=B.them.length;
  const dealt=B.dmg[0]/Math.max(1,B.hp0[1]), taken=B.dmg[1]/Math.max(1,B.hp0[0]);
  let r;
  if(!alive(B.us).length) r='敗北';
  else if(B.duel&&B.duelWin) r='S';
  else if(enDown===tot) r=(ourDown===0&&B.dmg[1]===0)?'S':ourDown<=1?'A':ourDown===2?'B':'C';
  else if(enDown>tot/2&&ourDown<=2) r='B';
  else if(dealt>taken) r='C';
  else r='敗北';
  // 誉：一騎打ち勝者＞与ダメージ＞撃破数＞並び順
  let hom=null; if(r!=='敗北'){ const c=B.us.filter(u=>!u.pre&&u.state!=='brk'); if(B.duel&&B.duelWin) hom=B.us[0]; else { c.sort((a,b)=>b.dealt-a.dealt||b.kills-a.kills||a.i-b.i); hom=c[0]; } }
  B.result={rank:r,hom,dealt,taken,duelWin:B.duel&&B.duelWin};
}
function U(ref){ const B=S.B; return (ref[0]?B.them:B.us)[ref[1]]; }
function playEvent(e){
  const B=S.B;
  const msg=$('msg'); msg.className='';
  if(e.k==='phase'){ $('phase').textContent=e.p; msg.textContent=e.m||e.p+'！'; if(e.p==='白兵戦') SFX.taiko(); }
  else if(e.k==='miss'){ const a=U(e.a), t=U(e.t); flash(a,'act',420); floatDmg(t,'回避','m'); msg.textContent=`${a.name}の${e.sou}……${t.name}がよけた！`; SFX.miss(); }
  else if(e.k==='hit'){ const a=U(e.a); flash(a,'act',480);
    const names=e.hits.map(h=>U(h.tgt).name);
    msg.textContent=e.ranged?`${a.name}の${e.ranged}が撃つ！`:e.crit?'会心の一撃！':`${a.name}の攻撃！`+(names.length>1?`（${names.length}体）`:'');
    for(const h of e.hits){ const t=U(h.tgt); t.dhp=h.after.hp; t.dsou=h.after.sou; t.dstate=h.after.state; flash(t,'hit');
      const bodyV=h.parts.filter(p=>!p.sou).reduce((s,p)=>s+p.v,0), souV=h.parts.filter(p=>p.sou).reduce((s,p)=>s+p.v,0);
      if(souV) floatDmg(t,'護'+souV,'s'); if(bodyV||!souV) setTimeout(()=>floatDmg(t,String(bodyV),e.crit?'c':''),souV?140:0);
      drawU(t);
      if(h.om){ msg.textContent=`${t.name}のお守りが砕けた……身代わりになった！`; SFX.bell(); }
      if(h.broke){ msg.textContent=`${t.name}が……砕け散った`; $('bubble').textContent=`${t.name}「${CHM[t.ref.cid].brk}」`; SFX.brk(); } }
    e.crit?SFX.crit():e.ranged?SFX.shot():SFX.hit(); if(e.ranged) SFX.shot(); }
  else if(e.k==='shin'){ const a=U(e.a); a.dshin=true; drawU(a); msg.className='big mincho'; msg.textContent='真剣必殺'; $('bubble').textContent=`${a.name}「${CHM[a.ref.cid].shin}」`; SFX.shin(); flash(a,'act',900); }
  else if(e.k==='duel'){ msg.className='duel mincho'; msg.textContent='一騎打ち'; $('bubble').textContent='隊長と敵の一騎打ちだ！'; SFX.taiko(); }
  else if(e.k==='end'){ endBattle(); }
}
function endBattle(){
  const B=S.B, R=B.result, m=curMap(), so=S.sortie;
  B.phase='done'; so.battles++; G.stats.battles++; S.stats.battles++;
  // 永続データへ反映
  const lines=[];
  const base=20+m.lv*6, rk={S:1.2,A:1,B:.8,C:.6,'敗北':.4}[R.rank]*(B.boss?1.5:1);
  const broken=[];
  for(const u of B.us){ const c=u.ref;
    for(const s of u.sou) so.dur[s.u]=s.dur;
    if(u.state==='brk'){ broken.push(c); continue; }
    c.hp=u.hp; c.omamori=u.omamori;
    if(u.pre) continue;
    let g=Math.round(base*rk*(u.i===0?1.5:1)*(R.hom===u?1.2:1)*(u.state==='down'?.5:1));
    c.cond=Math.max(0,Math.min(100,c.cond-(u.i===0?3:2)+(R.hom===u?10:0)));
    c.exp+=g; let up=0; while(c.lv<99&&c.exp>=expNext(c.lv)){ c.exp-=expNext(c.lv); const old=maxHp(c); c.lv++; c.hp=Math.min(maxHp(c),c.hp+(maxHp(c)-old)); up++; }
    lines.push(`${CHM[c.cid].n} +${g}${up?` <span class="up">Lv${c.lv}！</span>`:''}`);
  }
  // 壊れた護装は失う
  for(const u of B.us) for(const s of u.sou) if(s.dur<=0){ G.items=G.items.filter(x=>x.u!==s.u); u.ref.sou=u.ref.sou.map(x=>x===s.u?null:x); }
  for(const c of broken){ G.chars=G.chars.filter(x=>x!==c); G.party=G.party.filter(x=>x!==c.u); c.sou.forEach(iu=>{ G.items=G.items.filter(x=>x.u!==iu); }); G.stats.breaks++; S.stats.breaks++; }
  if(R.hom) G.stats.homare++; if(R.rank==='S') G.stats.sWins++;
  const win=R.rank!=='敗北'; if(win) S.stats.wins++; else S.stats.loses++;
  win?SFX.win():SFX.lose();
  let clear=false, drop=null;
  if(win&&B.boss&&'SAB'.includes(R.rank)){ clear=!G.cleared[so.mi]; G.cleared[so.mi]=true; S.stats.clears++; }
  if(win&&'SAB'.includes(R.rank)&&rnd()<(B.boss?.6:.28)){ drop=pick(m.drop); }
  const gainRes=win?[0,0,0,0].map(()=>ri(10,25)+m.lv*2):[0,0,0,0]; G.res=G.res.map((v,i)=>v+gainRes[i]);
  if(!win||B.boss||!G.party.length) so.over=true;
  if(!G.party.length){ so.why='部隊が全滅した'; }
  saveG();
  const hom=R.hom;
  const html=`<h2 class="mincho">${B.boss?'ボス戦 ':''}戦果</h2><div class="rank mincho">${R.rank==='敗北'?'敗北':R.rank}<small>${R.duelWin?'一騎打ち勝利':R.rank==='S'?'完全勝利':R.rank==='敗北'?'撤退……':'勝利'}</small></div>
    ${hom?`<div class="homare"><img src="${hom.img}" alt=""><div><b style="color:var(--gold)">誉</b> ${hom.name}<br>「${esc(CHM[hom.ref.cid].hom)}」</div></div>`:''}
    <div class="explist">${lines.join('<br>')}</div>
    ${broken.length?`<p style="color:#ff8a7a">${broken.map(c=>CHM[c.cid].n).join('・')} が破壊された……</p>`:''}
    ${win?`<p class="note">資材 ${gainRes.map((v,i)=>RES_N[i]+'+'+v).join(' ')}</p>`:''}
    ${clear?`<p style="color:var(--gold)">🎉 ${m.n} を攻略した！${MAPS[so.mi+1]?`「${MAPS[so.mi+1].n}」へ出陣できるようになった`:'すべての合戦場を攻略！'}</p>`:''}`;
  const openR=()=>{ if(S.screen!=='battle') return; openModal(html,[{t:'次へ',pri:1,cls:'pri',f:()=>afterResult(drop)}]); };
  if(S.manual) openR(); else setTimeout(openR,350);
}
function afterResult(drop){
  if(S.screen!=='battle') return;
  S.B=null; show('map'); renderMap();
  const so=S.sortie;
  if(drop){ const d=CHM[drop]; getChar(drop,'ドロップ'); }
  if(so.over) setMapNote(so.why||(curMap().nodes[so.node].k==='boss'?'ボスとの戦いが終わった。本陣へ帰還しよう。':'敗北……本陣へ帰還しよう。'));
  else if(!leaderHeavy()) setMapNote('進軍するか、帰還するか。');
  updateMapButtons();
}

/* ================= オート（上手な遊び方） ================= */
function autoHome(){
  // 1) 手入れ 2) 部隊をととのえる 3) 護装を補充 4) お守り 5) 鍛銃 6) 出陣先えらび
  repairAll(true);
  const sorted=G.chars.slice().sort((a,b)=>power(b)-power(a));
  G.party=sorted.slice(0,6).map(c=>c.u);
  if(G.party.length){ const lead=G.party.map(charBy).sort((a,b)=>maxHp(b)-maxHp(a))[0]; G.party=[lead.u,...G.party.filter(x=>x!==lead.u)]; }
  for(const c of G.party.map(charBy)){ const T=TYPES[CHM[c.cid].t];
    c.sou.forEach((iu,k)=>{ if(iu&&itemBy(iu)) return; if(G.res.some(v=>v<250)) return;
      const hasR=c.sou.some(x=>x&&itemBy(x)&&SOU[itemBy(x).type].ranged);
      const want=(!hasR&&T.slots>=2)?(T.sou.includes('砲兵')?'砲兵':T.sou.includes('弓')?'弓':'投石'):(T.sou.includes('盾')?'盾':'重歩');
      if(!G.items.some(x=>x.type===want&&!isEquipped(x.u))) makeSou(want); }); }
  autoEquip(false);
  for(const c of G.party.map(charBy)) if(!c.omamori){ if(G.omamori<=0&&G.res.every(v=>v>=900)){ pay([150,150,150,150]); G.omamori++; } if(G.omamori>0){ G.omamori--; c.omamori=true; } }
  if(G.res.every(v=>v>=1400)) forge(2); else if(G.res.every(v=>v>=700)&&G.chars.length<8) forge(1);
  saveG();
}
function autoMapChoice(){
  const avg=G.party.reduce((s,u)=>s+charBy(u).lv,0)/G.party.length;
  let mi=0; for(let i=0;i<MAPS.length;i++){ const unlocked=i===0||G.cleared[i-1]; if(!unlocked) break; if(!G.cleared[i]){ mi=(avg>=MAPS[i].lv*.85||i===0)?i:Math.max(0,i-1); break; } mi=i; if(avg<MAPS[i].lv) break; }
  return mi;
}
function autoRetreat(){ const ps=G.party.map(charBy); return ps.some(c=>c.hp>0&&c.hp/maxHp(c)<=.25&&!c.omamori)||ps.filter(c=>c.hp<=0).length>=2; }
function updateAuto(dt){
  S.autoT+=dt;
  if(S.modalOn){ if(S.autoT>1.4){ const b=S.modalA; if(b&&b.length===1&&b[0].t==='やめる'){ closeModal(); return; } modalPrimary(); S.autoT=0; } return; }
  if(S.screen==='title'&&S.autoT>.6){ startGame(); }
  else if(S.screen==='pick'&&S.autoT>.8){ choose('tane'); }
  else if(S.screen==='home'&&S.autoT>1.0){
    const tired=G.party.map(charBy).filter(c=>c.cond<=25).length;
    if(tired>=2&&S.autoT<8) return;               // 疲労がぬけるまで休む
    autoHome(); renderHome();
    // けが人がいて資材が足りないときは、資材がたまるまで待つ
    if(G.party.map(charBy).some(c=>c.hp<maxHp(c)*.6)){ S.autoT=-2; return; }
    S.tab='sortie'; sortie(autoMapChoice());
  }
  else if(S.screen==='map'&&!S.moving&&S.autoT>.9){
    const so=S.sortie, m=curMap(); const ended=so.over||(so.node!=='S'&&!(m.nodes[so.node].nx||[]).length);
    if(ended||leaderHeavy()||autoRetreat()) goHome(); else advance();
  }
  else if(S.screen==='battle'&&S.B&&S.B.phase==='form'&&S.autoT>.8){ chooseForm(aiForm()); }
}

/* ================= 更新ループ ================= */
function update(dt){
  S.t+=dt;
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  if(S.screen==='home'&&G){ S.regenT+=dt; if(S.regenT>1.5){ S.regenT=0; let ch=false; for(const c of G.chars){ if(c.cond<49){ c.cond++; ch=true; } else if(c.cond>49&&rnd()<.3){ c.cond--; ch=true; } }
      for(let i=0;i<4;i++) if(G.res[i]<1500){ G.res[i]=Math.min(1500,G.res[i]+3); ch=true; } if(ch&&!S.auto){ renderRes(); } } }
  if(S.moving){ const mv=S.moving; mv.t+=dt; if(mv.t>=mv.dur-.6&&!mv.moved){ mv.moved=true; const n=curMap().nodes[mv.to]; $('marker').style.left=n.x+'%'; $('marker').style.top=(n.y/62.5*100)+'%'; }
    if(mv.t>=mv.dur){ S.moving=null; arrive(mv.to); } }
  const B=S.B;
  if(S.screen==='battle'&&B){
    B.t+=dt;
    if(B.phase==='intro'&&B.t>1.0){ B.phase='scout'; B.t=0; $('phase').textContent='索敵'; $('msg').textContent='索敵中……'; scout(); }
    else if(B.phase==='scout'&&B.t>.9){ B.phase='form'; showForms(); S.autoT=0; }
    else if(B.phase==='play'){ B.wait-=dt*S.speed; while(B.wait<=0&&B.qi<B.q.length&&B.phase==='play'){ const e=B.q[B.qi++]; playEvent(e); B.wait+=e.dur; } }
  }
  if(S.auto) updateAuto(dt);
}
let last=performance.now();
function frame(now){ const dt=Math.min(.1,(now-last)/1000); last=now; if(!S.manual) update(dt); requestAnimationFrame(frame); }

/* ================= 操作 ================= */
function setAuto(v){ S.auto=!!v; $('autoBtn').setAttribute('aria-pressed',String(S.auto)); S.autoT=0; }
function userAct(){ if(S.auto) setAuto(false); }
function setSound(v){ soundOn=v; LS.set('kaki_sound',v?'1':'0'); $('sndBtn').setAttribute('aria-pressed',String(v)); $('sndBtn').textContent=v?'🔊':'🔇'; }
$('autoBtn').addEventListener('click',()=>{ ac(); setAuto(!S.auto); });
$('sndBtn').addEventListener('click',()=>{ ac(); setSound(!soundOn); });
$('startBtn').addEventListener('click',()=>{ ac(); userAct(); startGame(); });
$('resetBtn').addEventListener('click',()=>{ userAct(); openModal('<h2>最初からやり直す？</h2><p class="note">銃士・資材・攻略の記録がすべて消えます。</p>',[{t:'やめる'},{t:'消してやり直す',cls:'pri',f:()=>{ LS.del('kaki_save'); G=null; renderTitle(); }}]); });
$('goBtn').addEventListener('click',()=>{ ac(); userAct(); advance(); });
$('backBtn').addEventListener('click',()=>{ ac(); goBack(); });
$('speedBtn').addEventListener('click',()=>{ S.speed=S.speed===1?2:1; LS.set('kaki_speed',S.speed); $('speedBtn').textContent=S.speed===1?'▶▶ 倍速':'▶ 通常'; });
$('speedBtn').textContent=S.speed===1?'▶▶ 倍速':'▶ 通常';
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!S.auto); return; }
  if(k==='m'){ ac(); setSound(!soundOn); return; }
  if(S.modalOn&&(k==='enter'||k===' ')){ e.preventDefault(); ac(); userAct(); modalPrimary(); return; }
  if(S.screen==='battle'&&S.B&&S.B.phase==='form'&&/^[1-6]$/.test(k)){ ac(); userAct(); chooseForm(+k-1); return; }
  if(k==='enter'){ if(S.screen==='title'){ ac(); userAct(); startGame(); } else if(S.screen==='map'&&!$('goBtn').disabled){ ac(); userAct(); advance(); } }
});

/* ================= テスト用フック ================= */
window.__kaki={
  get G(){ return G; }, get S(){ return S; },
  setAuto, manual:()=>{ S.manual=true; }, step:(dt=1/60)=>update(dt), seed:v=>{ seedV=(Math.abs(v|0)%2147483646)+1; },
  reset:()=>{ LS.del('kaki_save'); G=null; S.sortie=null; S.B=null; closeModal(); show('title'); renderTitle(); },
  choose, sortie, advance, chooseForm, goHome, maxHp, MAPS, FORMS, advOf,
};

setSound(soundOn); renderTitle(); show('title');
requestAnimationFrame(frame);
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
