<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="description" content="高校入学から卒業まで、恋と大学受験の三年間をすごす本格恋愛シミュレーション。8人のヒロイン、男の娘、模試と合格発表。女゛ぁ！の続編。">
<title>女゛ぁ！2</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html,body{touch-action:manipulation}
:root{--ink:#3A2430;--pink:#FF5A8A;--pink2:#FFD0DE;--card:rgba(255,250,252,.94);--line:#F2C8D4;--mute:#9A7A88;--blue:#4A8AE0;--gold:#E8A820;--green:#2FB26A;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#14102a;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(6px + var(--sat)) 8px 0;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:6}
#hud>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:6px}
#backLink{color:#fff;text-decoration:none;font-weight:800;font-size:13px;white-space:nowrap;background:rgba(40,20,60,.55);padding:6px 9px;border-radius:999px}
#dateTx{flex:1;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
.mini{font-size:12px;font-weight:800;border:0;border-radius:999px;padding:6px 10px;background:rgba(40,20,60,.55);color:#fff;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--pink)}
#autoBtn{padding:6px 11px}
.hstat{display:flex;gap:8px;align-items:center;color:#fff;font-size:11px;font-weight:800;background:rgba(40,20,60,.5);border-radius:10px;padding:3px 8px;align-self:center;max-width:100%}
.bar{width:56px;height:7px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;border-radius:5px}
#tbox{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));width:min(96vw,900px);min-height:138px;background:linear-gradient(180deg,rgba(255,250,253,.93),rgba(255,238,246,.93));border:2px solid #fff;border-radius:18px;box-shadow:0 6px 24px rgba(40,10,60,.35),inset 0 0 0 1.5px var(--pink2);padding:22px 16px 14px;z-index:5;cursor:pointer}
#nameplate{position:absolute;left:14px;top:-15px;background:linear-gradient(135deg,#FF7AA2,#FF4F86);color:#fff;font-weight:800;font-size:15px;padding:3px 16px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff;letter-spacing:.04em}
#msgtext{font-size:17px;line-height:1.7;white-space:pre-line;min-height:84px;font-weight:500}
#msgtext.narr{color:#5A3A4C}
#nx{position:absolute;right:14px;bottom:8px;color:var(--pink);font-size:14px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}

.chbtn{min-height:52px;border:2px solid #fff;border-radius:16px;background:linear-gradient(180deg,#fff,#FFE6EF);box-shadow:0 4px 0 #E8A8BE,0 8px 18px rgba(40,10,60,.3);font-weight:800;font-size:16px;padding:10px 14px;text-align:left;line-height:1.35}
.chbtn:active{transform:translateY(2px)}
#toast{position:absolute;left:50%;top:calc(76px + var(--sat));transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.95);color:var(--ink);font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}

#cgTag{position:absolute;left:12px;top:calc(112px + var(--sat));z-index:8;background:rgba(18,10,30,.72);color:#FFE3EE;font-weight:800;font-size:12px;letter-spacing:.06em;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,200,225,.5);pointer-events:none;max-width:calc(100vw - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:8px 8px calc(8px + var(--sab));background:linear-gradient(180deg,rgba(255,244,250,.0),rgba(255,244,250,.96) 18%);}
#cmdBox{max-width:620px;margin:0 auto;background:var(--card);border-radius:18px;border:2px solid #fff;box-shadow:0 6px 24px rgba(40,10,60,.35),inset 0 0 0 1.5px var(--pink2);padding:10px}

#freeRow{display:flex;gap:6px;margin-top:8px}

.badge{position:absolute;right:2px;top:-6px;background:var(--pink);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(30,10,50,.55);padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab))}

.card h2{margin:0 0 6px;font-family:"Dela Gothic One",sans-serif;font-size:21px;color:var(--pink);text-align:center;letter-spacing:.04em}

.opt:active:not(:disabled){background:var(--pink2)}
.go{display:block;width:100%;min-height:46px;border:0;border-radius:14px;font-weight:800;font-size:16px;margin-top:10px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #C8306A}

.go:active{transform:translateY(2px)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center;font-size:12px;font-weight:800;margin:3px 0}
.meter{height:10px;border-radius:6px;background:#F4E4EA;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#FF8AA8,#FF5A8A)}
.rk{font-family:"Dela Gothic One",sans-serif;font-size:15px;text-align:right}
.hl{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0}

.hearts{letter-spacing:1px;font-size:13px}
.up{display:grid;grid-template-columns:62px 1fr auto;gap:6px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0;font-size:13px;font-weight:800}

.up button{border:0;border-radius:10px;background:var(--pink);color:#fff;font-weight:800;padding:8px 12px;font-size:13px;min-width:54px}
.up button:disabled{background:#E8D8DE;color:#A898A0}
#title{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(60px + var(--sat)) 14px calc(18px + var(--sab));pointer-events:none}
#title>*{pointer-events:auto}
#logo{font-family:"Dela Gothic One",sans-serif;font-size:min(22vw,100px);line-height:1;text-align:center;color:#fff;-webkit-text-stroke:3px var(--pink);paint-order:stroke fill;text-shadow:0 4px 0 #C8306A,0 8px 24px rgba(120,20,70,.5);margin-bottom:4px}
#logo small{display:block;font-size:min(5vw,22px);-webkit-text-stroke:0;text-shadow:0 2px 8px rgba(120,20,70,.7);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;margin-top:6px;letter-spacing:.08em}
#titleBtns{width:min(92vw,380px);display:flex;flex-direction:column;gap:2px;margin-top:6px}
#bestTx{color:#fff;font-size:12px;font-weight:800;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.7);margin-top:8px;line-height:1.5}
#nameIn{width:100%;font-size:18px;padding:10px;border-radius:12px;border:2px solid var(--pink);background:#FFF8FA;text-align:center;-webkit-user-select:text;user-select:text}
.rar{display:inline-block;font-family:"Dela Gothic One",sans-serif;font-size:26px;color:var(--gold);text-shadow:1px 1px 0 #fff}
.pill{display:inline-block;background:var(--pink2);color:#A02050;border-radius:999px;font-size:11px;font-weight:800;padding:2px 9px;margin:2px 2px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-weight:800}
.tbl td,.tbl th{padding:5px 4px;border-bottom:1px dashed var(--line);text-align:center}
.tbl th{color:var(--mute);font-size:11px}
.jd{display:inline-block;min-width:26px;color:#fff;border-radius:8px;padding:1px 6px;font-family:"Dela Gothic One",sans-serif}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gal button{border:0;padding:0;border-radius:12px;overflow:hidden;background:#EDE0E8;aspect-ratio:4/3;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.gal canvas{width:100%;height:100%;display:block}
.gal .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B8A0AE;background:repeating-linear-gradient(45deg,#EDE0E8,#EDE0E8 8px,#F6EAF0 8px,#F6EAF0 16px)}
.gal span{position:absolute;left:0;right:0;bottom:0;background:rgba(40,10,60,.55);color:#fff;font-size:10px;padding:2px 4px;text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;border:0;border-radius:10px;padding:8px;font-weight:800;background:#F4E4EA}.tabs button.on{background:var(--pink);color:#fff}
#cgView{position:absolute;inset:0;z-index:30;background:#000}
#cgView canvas{width:100%;height:100%;display:block}
#cgClose{position:absolute;right:12px;top:calc(10px + var(--sat));z-index:31}
#endCv{width:100%;border-radius:14px;display:block;background:#222;margin-bottom:8px}
.shout{font-family:"Dela Gothic One",sans-serif;font-size:30px;text-align:center;color:var(--pink);margin:2px 0 6px;line-height:1.2}
.story{font-size:14px;line-height:1.8;white-space:pre-line;margin:8px 0}
.sumline{font-size:12px;color:var(--mute);text-align:center;line-height:1.7;font-weight:800}
#boardCv{width:100%;border-radius:12px;display:block;background:#fdfcf6;border:3px solid #8A6A3A}
.keys{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 3px #000;position:absolute;left:0;right:0;bottom:calc(2px + var(--sab));z-index:3;pointer-events:none}
@media (pointer:coarse){.keys{display:none}}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  #cmd{left:auto;right:18px;bottom:18px;top:90px;width:430px;padding:0;background:none;display:flex;align-items:flex-end}
  #cmdBox{width:100%;max-width:none}
  .act{min-height:68px;font-size:16px}
  #msgtext{font-size:19px}
}
@media (max-height:620px){ #msgtext{font-size:15px;line-height:1.55;min-height:62px} #tbox{min-height:110px} }
</style>

<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="hud">
    <div class="hrow">
      <a id="backLink" href="../">← 一覧</a>
      <div id="dateTx">女゛ぁ！2</div>
      <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
      <button class="mini" id="skipBtn" aria-pressed="false" title="Sキー：既読スキップ">⏩</button>
      <button class="mini" id="advBtn" aria-pressed="false" title="Aキー：自動送り">送り</button>
      <button class="mini" id="muteBtn" aria-pressed="true" title="Mキー">♪</button>
    </div>
    <div class="hstat" id="hstat" hidden></div>
  </div>
  <div id="toast"></div>
  <div id="cgTag" hidden></div>
  <div id="tbox" hidden><div id="nameplate"></div><div id="msgtext"></div><div id="nx">▼</div></div>
  <div id="choices" hidden></div>
  <div id="cmd" hidden><div id="cmdBox"><div id="nextEv"></div><div id="acts"></div><div id="freeRow"></div></div></div>
  <div id="title">
    <div id="logo">女゛ぁ！2<small>―恋と受験の三年間―</small></div>
    <div id="titleBtns">
      <button class="go" id="newBtn">はじめから</button>
      <button class="go alt" id="contBtn" hidden>つづきから</button>
      <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
      <div class="row2"><button class="go alt" id="galBtn">📔 回想</button><button class="go alt" id="loadBtn">💾 ロード</button></div>
    </div>
    <div id="bestTx"></div>
  </div>
  <p class="keys">Enter/Space：つぎへ　1〜9：コマンド　U：能力アップ　H：ヒロ　O：オート　S：スキップ　A：自動送り　M：音</p>
</div>
<script>
(()=>{'use strict';
/* ================= ART: portrait engine ================= */
const ART=(()=>{
const PW=420, PH=640, CX=210, RS=1.5;
const TAU=Math.PI*2;
/* ---- color helpers ---- */
const hx=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);};
const dk=(c,t)=>mix(c,'#20102e',t), lt=(c,t)=>mix(c,'#ffffff',t);
const rgba=(c,a)=>{const[r,g,b]=hx(c);return `rgba(${r},${g},${b},${a})`;};
const lg=(g,x0,y0,x1,y1,st)=>{const o=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>o.addColorStop(s[0],s[1]));return o;};
const rg=(g,x0,y0,r0,x1,y1,r1,st)=>{const o=g.createRadialGradient(x0,y0,r0,x1,y1,r1);st.forEach(s=>o.addColorStop(s[0],s[1]));return o;};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;};
const qpt=(p0,c,p1,t)=>[(1-t)*(1-t)*p0[0]+2*(1-t)*t*c[0]+t*t*p1[0],(1-t)*(1-t)*p0[1]+2*(1-t)*t*c[1]+t*t*p1[1]];

/* ---- hair lock (tapered strand) ---- */
const Lk=(x0,y0,x1,y1,w,b=0,tw=0,o)=>Object.assign({x0,y0,x1,y1,w,b,tw},o||{});
const Ml=l=>Object.assign({},l,{x0:2*CX-l.x0,x1:2*CX-l.x1,b:-l.b});
function lockGeom(L){
  const dx=L.x1-L.x0, dy=L.y1-L.y0, d=Math.hypot(dx,dy)||1, nx=-dy/d, ny=dx/d;
  const mx=(L.x0+L.x1)/2+nx*L.b, my=(L.y0+L.y1)/2+ny*L.b;
  return {nx,ny,mx,my,d};
}
function lockPts(L,N){
  const {nx,ny,mx,my}=lockGeom(L), P0=[L.x0,L.y0], C=[mx,my], P1=[L.x1,L.y1], w=L.w, tw=L.tw||0, sg=L.b>=0?1:-1;
  const left=[], right=[];
  for(let i=0;i<=N;i++){
    const t=i/N, p=qpt(P0,C,P1,t); const e=.05, p2=qpt(P0,C,P1,Math.min(1,t+e)), p1=qpt(P0,C,P1,Math.max(0,t-e));
    let tx=p2[0]-p1[0], ty=p2[1]-p1[1]; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl; const px=-ty, py=tx;
    const s=Math.sin(t*Math.PI*2)*w*.07*sg; // slight S-curve
    const hw=Math.max(tw/2, (w/2)*Math.pow(Math.max(0,1-Math.pow(t,2.3)),.75)*(1+.18*Math.sin(t*Math.PI)) );
    left.push([p[0]+px*(hw+s),p[1]+py*(hw+s)]); right.push([p[0]-px*(hw-s),p[1]-py*(hw-s)]);
  }
  return {left,right};
}
function lockPath(g,L){
  const N=14, {left,right}=lockPts(L,N); g.beginPath(); g.moveTo(left[0][0],left[0][1]);
  for(let i=1;i<=N;i++){ const m=[(left[i-1][0]+left[i][0])/2,(left[i-1][1]+left[i][1])/2]; g.quadraticCurveTo(left[i-1][0],left[i-1][1],m[0],m[1]); }
  g.lineTo(left[N][0],left[N][1]);
  if((L.tw||0)>2){ const t0=left[N], t1=right[N], dx=L.x1-L.x0, dy=L.y1-L.y0, d=Math.hypot(dx,dy)||1; g.quadraticCurveTo((t0[0]+t1[0])/2+dx/d*L.tw*.5,(t0[1]+t1[1])/2+dy/d*L.tw*.5,t1[0],t1[1]); } else g.lineTo(right[N][0],right[N][1]);
  for(let i=N-1;i>=0;i--){ const m=[(right[i+1][0]+right[i][0])/2,(right[i+1][1]+right[i][1])/2]; g.quadraticCurveTo(right[i+1][0],right[i+1][1],m[0],m[1]); }
  g.lineTo(right[0][0],right[0][1]); g.quadraticCurveTo((left[0][0]+right[0][0])/2-(L.x1-L.x0)*.05,(left[0][1]+right[0][1])/2-(L.y1-L.y0)*.05,left[0][0],left[0][1]); g.closePath();
}
function drawLock(g,ch,L,o){
  o=o||{};
  const H=ch.hair, hair=L.col||H.c, hd=L.dcol||H.d, hl=H.l;
  g.save(); lockPath(g,L);
  g.fillStyle=lg(g,L.x0,L.y0,L.x1,L.y1,[[0,dk(hair,.34)],[.2,mix(hair,hd,.18)],[.5,hair],[1,L.tip||mix(hair,hd,.5)]]); g.fill();
  g.clip();
  const {nx,ny,mx,my,d}=lockGeom(L), P0=[L.x0,L.y0], C=[mx,my], P1=[L.x1,L.y1];
  // shade side
  g.strokeStyle=rgba(hd,.3); g.lineWidth=L.w*.45; g.lineCap='round'; g.beginPath(); let s=qpt(P0,C,P1,.05); g.moveTo(s[0]-nx*L.w*.3,s[1]-ny*L.w*.3);

}
function earrings(g,ch){ for(const s of[-1,1]){ const x=CX+s*(ch.face.w+3), y=268; g.strokeStyle='#F0D060'; g.lineWidth=3; g.beginPath(); g.arc(x,y+10,10,0,TAU); g.stroke(); g.strokeStyle='#FFF6B0'; g.lineWidth=1; g.beginPath(); g.arc(x,y+10,10,3.6,4.6); g.stroke(); } }
function headphones(g,ch){ g.save(); g.strokeStyle='#2A2A34'; g.lineWidth=9; g.lineCap='round'; g.beginPath(); g.moveTo(CX-60,398); g.bezierCurveTo(CX-48,452,CX+48,452,CX+60,398); g.stroke();
  g.strokeStyle='#7A7A90'; g.lineWidth=2; g.stroke(); for(const s of[-1,1]){ g.fillStyle='#E86A3A'; g.beginPath(); g.ellipse(CX+s*62,410,13,20,s*.2,0,TAU); g.fill(); g.strokeStyle='#2A2A34'; g.lineWidth=3; g.stroke(); } g.restore(); }
function ears(g,ch){ const sk=ch.skin; for(const s of[-1,1]){ const x=CX+s*(ch.face.w+1), y=246; g.beginPath(); g.ellipse(x,y,9,16,s*-.15,0,TAU); g.fillStyle=mix(sk,'#D08A86',.15); g.fill(); g.strokeStyle=rgba(mix(sk,'#8a4a4a',.5),.8); g.lineWidth=1.3; g.stroke(); g.fillStyle=rgba('#FF9AA0',.35); g.beginPath(); g.ellipse(x-s*1,y+1,4,8,0,0,TAU); g.fill(); } }

/* ---- main portrait render ---- */
function renderPortrait(id,outfit,expr,opt){
  const ch=CHR[id], E=EXPR[expr]||EXPR.normal, st=styleOf(ch);
  const cv=mk(PW*RS,PH*RS), g=cv.getContext('2d'); g.scale(RS,RS);
  g.lineJoin='round'; g.lineCap='round';
  const HY=340,HY2=374,HS=1.25, hT=()=>{g.save();g.translate(CX,HY2);g.scale(HS,HS);g.translate(-CX,-HY);};
  // 1 back hair
  hT(); backMass(g,ch,st); drawLocks(g,ch,st.back,{noSheen:false}); g.restore();
  // 2 body
  neckAndShadow(g,ch);
  if(outfit==='coat') {} 
  drawOutfit(g,ch,outfit);
  if(ch.style==='spiky'&&ch.uni.phones&&outfit!=='coat') headphones(g,ch);
  hT();
  // 3 ears (behind face) for short hair
  if(['sport','spiky','pony'].includes(ch.style)) ears(g,ch);
  // 4 face
  facePath(g,ch); g.fillStyle=lg(g,CX-70,100,CX+70,330,[[0,lt(ch.skin,.12)],[.55,ch.skin],[1,mix(ch.skin,'#D08A86',.28)]]); g.fill();
  g.save(); facePath(g,ch); g.clip();
  // cheek/jaw shade right & left edge
  g.fillStyle=lg(g,CX-80,0,CX+80,0,[[0,rgba(mix(ch.skin,'#C97C7C',.5),.38)],[.14,rgba(mix(ch.skin,'#C97C7C',.5),0)],[.86,rgba(mix(ch.skin,'#C97C7C',.5),0)],[1,rgba(mix(ch.skin,'#C97C7C',.5),.5)]]); g.fillRect(CX-90,90,180,270);
  // chin shade
  g.fillStyle=rg(g,CX,360,10,CX,350,70,[[0,rgba(mix(ch.skin,'#C97C7C',.5),.4)],[1,rgba(mix(ch.skin,'#C97C7C',0),0)]]); g.fillRect(CX-90,280,180,90);
  // bangs shadow cast
  g.save(); g.translate(0,13); g.globalAlpha=.30; for(const l of st.bang){ lockPath(g,l); g.fillStyle=mix(ch.skin,'#9A4F55',.7); g.fill(); } g.restore();
  g.save(); g.translate(0,26); g.globalAlpha=.10; for(const l of st.bang){ lockPath(g,l); g.fillStyle=mix(ch.skin,'#9A4F55',.7); g.fill(); } g.restore();
  g.restore();
  g.lineWidth=1.8; facePath(g,ch); g.strokeStyle=rgba(mix(ch.skin,'#6a3a3a',.62),.85); g.stroke();
  drawBlush(g,ch,E); drawFreckle(g,ch);
  drawNose(g,ch);
  // 5 features
  for(const s of[-1,1]) drawEye(g,ch,s,CX+s*ch.eye.sep,ch.eye.y,E);
  drawMouth(g,ch,E);
  // 6 front hair
  drawLocks(g,ch,st.side);
  drawLocks(g,ch,st.bang);
  hairCap(g,ch);
  if(ch.glasses) glasses(g,ch);
  g.save(); g.globalAlpha=.9; for(const s of[-1,1]) drawBrow(g,ch,s,E); g.restore();
  extras(g,ch,st,'front');
  if(ch.earring) earrings(g,ch);
  // 7 marks
  if(E.sweat){ g.fillStyle='rgba(150,210,255,.9)'; g.strokeStyle='#4A8AD0'; g.lineWidth=1.4; const sx=CX+ch.face.w-6, sy=168; g.beginPath(); g.moveTo(sx,sy); g.quadraticCurveTo(sx+12,sy+20,sx,sy+26); g.quadraticCurveTo(sx-12,sy+20,sx,sy); g.fill(); g.stroke(); }
  if(E.vein){ g.strokeStyle='#E0302A'; g.lineWidth=3; g.lineCap='round'; const vx=CX+ch.face.w-14, vy=156; for(const [a,b,c2,d] of [[-8,-4,-3,-1],[8,-4,3,-1],[-8,8,-3,3],[8,8,3,3]]){ g.beginPath(); g.moveTo(vx+a,vy+b); g.quadraticCurveTo(vx+c2*1.6,vy+d*1.6,vx+c2*.4,vy+d*.4); g.stroke(); } }
  if(E.tear){ g.fillStyle='rgba(180,225,255,.85)'; g.strokeStyle='rgba(90,150,220,.9)'; g.lineWidth=1.2; for(const s of[-1,1]){ const tx=CX+s*(ch.eye.sep+10), ty=ch.eye.y+14; g.beginPath(); g.moveTo(tx,ty); g.quadraticCurveTo(tx+5,ty+28,tx,ty+44); g.quadraticCurveTo(tx-5,ty+28,tx,ty); g.fill(); g.stroke(); g.fillStyle='rgba(255,255,255,.8)'; g.beginPath(); g.arc(tx-1,ty+14,1.4,0,TAU); g.fill(); g.fillStyle='rgba(180,225,255,.85)'; } }
  g.restore();
  return cv;
}

function loveAdd(id,da,dt){

  if(!L.met){ L.met=true; L.aff=Math.max(L.aff,8); }
  const f=fit(id); const stressM=G.stress>78?.75:1;
  if(da>0) da=Math.max(1,Math.round(da*.45*(.85+.2*Math.min(1,f))*stressM*(G.tal.kiki?1.2:1)*(1-L.aff/120))); else da=Math.round(da*.8);
  if(dt>0) dt=Math.max(1,Math.round(dt*.42*(.35+.75*Math.min(1,f))*stressM*(1-L.toki/115))); else dt=Math.round(dt*.8);
  L.aff=cl(L.aff+da,0,100); L.toki=cl(L.toki+dt,0,100); L.last=G.t;
  if(!HL){ if(da>0||dt>0) UI.sfx('heart'); else if(da<0||dt<0) UI.sfx('bad'); UI.hearts&&UI.hearts(id,da,dt); }
}

function applyE(e,ctx){
  if(!e) return; const id=e.who||ctx.who;
  if((e.aff||e.toki)&&id) loveAdd(id,e.aff||0,e.toki||0);
  if(e.st){ for(const k in e.st){ G.st[k]=cl(G.st[k]+e.st[k],0,100); } if(!HL) UI.toast('能力アップ！ '+Object.keys(e.st).map(k=>SN[k]+'+'+e.st[k]).join(' ')); }

}
function evalE(e,ctx){ let v=(e.aff||0)+(e.toki||0)*1.25; if(e.st) for(const k in e.st) v+=e.st[k]*3; if(e.flag==='m_ok') v+=30; v+=(e.stress||0)*-.2; v+=(e.money||0)*.003; const id=e.who||ctx.who; if(id&&G.auto&&id!==G.target) v*=.2; return v; }
function compile(lines,ctx){
  const out=[];
  for(const it of lines){
    if(typeof it==='string'){ if(!HL) out.push(()=>UI.say(null,'',fmt(it),ctx)); }
    else if(Array.isArray(it)){ if(!HL) out.push(()=>UI.say(it[0],it[1],fmt(it[2]),ctx)); }
    else if(it.cg){ out.push(()=>cgShow(it.cg,ctx.who,ctx)); }
    else if(it.bg){ if(!HL) out.push(()=>UI.scene(it.bg,it.clear?[]:null,ctx)); }
    else if(it.fn){ out.push(()=>it.fn(ctx)); }
    else if(it.ch){ out.push(()=>choose(it.ch,ctx)); }
  }
  return out;
}

function endTurn(){

function drawFx(g,fx,W,H,t,spec){

    else if(f==='dust'){ BGART.fx(g,'library',0,0,W,H,t); }
    else if(f==='rain'){ g.strokeStyle='rgba(220,235,255,.55)'; g.lineWidth=1.4; for(let i=0;i<90;i++){ const x=((i*97.3+t*160)%(W+80))-40, y=((i*53.7+t*620)%(H+100))-50; g.beginPath(); g.moveTo(x,y); g.lineTo(x-9,y+34); g.stroke(); } g.fillStyle='rgba(60,80,120,.18)'; g.fillRect(0,0,W,H); }
    else if(f==='spot'){ for(const [x,c] of [[.15,'#FF3AA0'],[.5,'#FFE03A'],[.85,'#3AF0FF']]){ const gr=g.createLinearGradient(W*x,0,W*(.5+(x-.5)*.3),H*.9); gr.addColorStop(0,c.replace('#','#')+'66'); gr.addColorStop(1,c+'00'); g.fillStyle=gr; g.beginPath(); g.moveTo(W*x-12,0); g.lineTo(W*x+12,0); g.lineTo(W*(.5+(x-.5)*.3)+120,H*.9); g.lineTo(W*(.5+(x-.5)*.3)-120,H*.9); g.closePath(); g.fill(); } }

  }
}
function drawCG(g,W,H,spec,who,t){
  const bgc=BGART.get(spec.bg);

function drawStage(){

  AU.sfx('up');
  d.querySelector('#gRe').onclick=()=>{ gachaRolls++; const nm_=d.querySelector('#nameIn').value; closeOv(d); showGacha(rollBirth()); const n=document.getElementById('nameIn'); if(n) n.value=nm_; };

}

  else { U.pending=null; }
}
let lastTs=0;
function tick(dt){
  dt=Math.min(dt,.1);
  if(SG.title) layoutTitleChars();
  stageTick(dt); AU.tick();
  if(U.toastT>0){ U.toastT-=dt; if(U.toastT<=0) $('toast').classList.remove('on'); }
  if(U.cont){
    if(U.pos<U.full.length){ U.pos=Math.min(U.full.length,U.pos+U.speed*dt*(U.skip?4:1)); $('msgtext').textContent=U.full.slice(0,Math.floor(U.pos)); if(U.pos>=U.full.length) U.lineT=0; }
    else { $('nx').hidden=false; U.lineT=(U.lineT||0)+dt;
      if(!U.auto){ if(U.skip&&U.seen&&U.lineT>.05) advance(); else if(U.adv&&U.lineT>1.0+U.full.length*.05) advance(); } }
  }
  if(U.auto&&U.pending){ U.pending.wait-=dt; if(U.pending.wait<=0){ const f=U.pending.fn; U.pending=null; f(); } }
  if(U.boardAnim) U.boardAnim(dt);
  drawStage();
}
function frame(ts){ const dt=lastTs?(ts-lastTs)/1000:0; lastTs=ts; tick(dt); requestAnimationFrame(frame); }

  scene(o){ $('cgTag').hidden=true; closeAllOv(); $('title').hidden=true; SG.title=false; SG.cg=null; sgBg(o.bg||'classroom'); SG.chars=o.chars?o.chars.map(c=>({id:c.id,outfit:c.outfit||'winter',expr:c.expr||'normal',a:1})):o.id?[{id:o.id,outfit:o.outfit||'winter',expr:o.expr||'normal',a:1}]:[]; if(o.text){ showTbox(true); $('nameplate').hidden=!o.who; $('nameplate').textContent=o.who||''; $('msgtext').textContent=o.text; $('msgtext').className=o.who?'':'narr'; $('nx').hidden=false; } else showTbox(false); $('cmd').hidden=true; $('choices').hidden=true; },

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
