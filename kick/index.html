<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="強すぎるヒーロー「ワンキックマン」。どんな巨大モンスターも蹴り1発でバラバラ。攻撃されてもノーダメージ。街を守りながら全5面の怪人をたおせ。">
<title>ワンキックマン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#FFF6DC;--ink:#2A1E10;--card:#FFFFFF;--line:#EADBB0;--mute:#8A7A5A;--acc:#F2C230;--red:#D8342A}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;font-weight:800;white-space:nowrap}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#wrap{position:relative}
#cv{display:block;width:100%;aspect-ratio:360/520;border-radius:14px;background:#8CC8F0;touch-action:none}
#pad{display:grid;grid-template-columns:1fr 1fr 1.1fr 1.5fr;gap:8px;margin-top:8px}
#pad button{min-height:64px;border:0;border-radius:16px;font-weight:800;font-size:22px;cursor:pointer;touch-action:none;background:#fff;box-shadow:0 4px 0 #D8C890}
#pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #D8C890;background:#FFF2C0}
#kickBtn{background:radial-gradient(circle at 40% 30%,#FF7A5A,#D8342A)!important;color:#fff;box-shadow:0 5px 0 #8A1A10!important;font-size:20px!important}
#kickBtn.on{box-shadow:0 1px 0 #8A1A10!important}
.ov{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;background:rgba(40,20,0,.5);border-radius:14px;padding:12px;z-index:3;overflow-y:auto;overscroll-behavior:contain}
.card{background:var(--card);border-radius:18px;padding:14px;width:100%;max-width:380px;text-align:center;margin:auto 0;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card h2{margin:0;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:30px;line-height:1.25;color:var(--red);letter-spacing:.04em}
.sub{font-size:13px;color:var(--mute);margin:6px 0 10px;line-height:1.7;white-space:pre-line}
.how{text-align:left;font-size:12.5px;line-height:1.7;background:#FFF8E4;border-radius:12px;padding:8px 12px;margin:0 0 8px}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.stg button{min-height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:800;cursor:pointer;font-size:14px;line-height:1.2}
.stg button small{display:block;font-size:10px}
.stg button:disabled{opacity:.4;cursor:default}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px;background:var(--red);color:#fff;box-shadow:0 4px 0 #8A1A10}
.go.alt{background:#FFF2C8;color:var(--ink);box-shadow:0 4px 0 #D8C890}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.stars{font-size:32px;margin:4px 0}
.help{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>🦶 ワンキックマン</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap">
    <canvas id="cv" width="360" height="520" aria-label="ヒーローとモンスターが戦う街"></canvas>
    <div class="ov" id="titleOv">
      <div class="card">
        <h2>ワンキックマン</h2>
        <p class="sub">強くなりすぎた男。どんな怪人も、蹴り1発。<br>……ただ、当たらなければ意味がない。</p>
        <div class="how">◀ ▶ 走る　⤴ ジャンプ（空中でもう1回）　🦶 キック<br>🦸 怪人の攻撃は<b>ノーダメージ</b>。HPは減らない<br>🏢 でも<b>街</b>はこわされる。街が全部こわれたら負け<br>💥 蹴りが当たれば、どんな巨大怪人も一撃でバラバラ</div>
        <div class="stg" id="stgList"></div>
        <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
    <div class="ov" id="resultOv" hidden>
      <div class="card">
        <h2 id="resTitle"></h2>
        <div class="stars" id="resStars"></div>
        <p class="sub" id="resText"></p>
        <button class="go" id="nextBtn">つぎの怪人へ</button>
        <button class="go alt" id="retryBtn">もう一度</button>
        <button class="go alt" id="menuBtn">面をえらぶ</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
  </div>
  <div id="pad"><button id="lBtn" aria-label="左へ">◀</button><button id="rBtn" aria-label="右へ">▶</button><button id="jBtn" aria-label="ジャンプ">⤴</button><button id="kickBtn">🦶 キック</button></div>
  <p class="help">ボタンで操作。<span class="pc">PC：←→/AD 走る　↑/W/スペース ジャンプ　Z/X/J キック　O オート　M 音</span></p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(rnd()*a.length)], lerp=(a,b,t)=>a+(b-a)*t;
const VW0=360,VH0=520, WW=900, GY=640, GRAV=1900;
const cv=$('cv'), g=cv.getContext('2d');
const fmt=n=>n>=1e12?(n/1e12).toFixed(1)+'兆':n>=1e8?Math.round(n/1e8).toLocaleString()+'億':n>=1e4?Math.round(n/1e4).toLocaleString()+'万':Math.round(n).toLocaleString();

/* ================= stages: ever bigger monsters ================= */
const STAGES=[
  {n:'公園の大ガエル',where:'ゆきのさと公園',boss:'frog',minion:'slime',count:6,zoom:1,hp:8e6,danger:1,sky:['#8CC8F0','#D8F0FF'],ground:'#7AB85A'},
  {n:'港の大ガニ',where:'みなと町の港',boss:'crab',minion:'crabling',count:8,zoom:.85,hp:4.5e7,danger:2,sky:['#7AB8E8','#F0E8C8'],ground:'#C8B890'},
  {n:'岩石ゴーレム',where:'しらかば山のふもと',boss:'golem',minion:'pebble',count:9,zoom:.72,hp:3e8,danger:3,sky:['#E8A870','#F8D8A8'],ground:'#9A8A6A'},
  {n:'暴竜ドラグーン',where:'夕焼けの中央区',boss:'dragon',minion:'bat',count:10,zoom:.6,hp:2e9,danger:4,sky:['#5A3A7A','#F07A4A'],ground:'#6A6A70'},
  {n:'宇宙怪獣 ホシクイ',where:'夜の都心',boss:'eater',minion:'eye',count:12,zoom:.5,hp:9.9e12,danger:5,sky:['#0A0A2A','#3A2A5A'],ground:'#3A3A48'},
];
const MIN={ // little monsters: size, speed, hp, flying, colors
  slime:{w:26,h:22,sp:55,hp:3000,fly:false,c:['#6AD06A','#3A9A3A']},
  crabling:{w:30,h:20,sp:80,hp:12000,fly:false,c:['#E8604A','#A83A2A']},
  pebble:{w:30,h:28,sp:60,hp:5e4,fly:false,c:['#9A9A90','#6A6A62']},
  bat:{w:34,h:22,sp:95,hp:2e5,fly:true,c:['#6A4A8A','#3A2A5A']},
  eye:{w:30,h:30,sp:85,hp:1e6,fly:true,c:['#E8E0F0','#8A3AAA']},
};
const BOSS={
  frog:{w:110,h:90,c:['#5AB04A','#2A7A2A','#E8F0A0']},
  crab:{w:190,h:120,c:['#E8503A','#9A2A1A','#FFD0B0']},
  golem:{w:200,h:260,c:['#8A8A80','#5A5A52','#C8C0A8']},
  dragon:{w:320,h:170,c:['#7A3AAA','#4A1A6A','#F0C040']},
  eater:{w:520,h:440,c:['#3A1A5A','#1A0A2A','#FF4A8A']},
};

const S={scene:'title',si:0,t:0,hero:null,minions:[],boss:null,shots:[],pieces:[],pops:[],bld:[],spawned:0,killed:0,spawnT:0,
  stop:0,flash:0,shake:0,winT:-1,msg:'',msgT:9,keys:{},btn:{},auto:false,manual:false,resT:0,cam:{x:0,y:0},kicks:0,
  best:(()=>{ try{ return JSON.parse(localStorage.getItem('kickBest')||'null')||{stars:[0,0,0,0,0],time:[0,0,0,0,0]}; }catch(e){ return {stars:[0,0,0,0,0],time:[0,0,0,0,0]}; } })()};
function saveBest(){ if(S.auto) return; try{ localStorage.setItem('kickBest',JSON.stringify(S.best)); }catch(e){} }
const st=()=>STAGES[S.si];

function startStage(i){
  S.si=i; const s=st(); S.t=0; S.minions=[]; S.boss=null; S.shots=[]; S.pieces=[]; S.pops=[]; S.spawned=0; S.killed=0; S.spawnT=1; S.stop=0; S.flash=0; S.shake=0; S.winT=-1; S.kicks=0;
  S.hero={x:WW/2,y:GY,vx:0,vy:0,face:1,ground:true,jumps:0,kickT:-1,kickCd:0,run:0,cape:0,bored:0};
  S.bld=[]; let x=40; while(x<WW-60){ const w=70+rnd()*40, h=110+rnd()*(120+i*30); S.bld.push({x,w,h,hp:100,hue:Math.floor(rnd()*4),hit:0}); x+=w+14+rnd()*16; }
  ['titleOv','resultOv'].forEach(id=>$(id).hidden=true);
  S.scene='play'; say(`第${i+1}話　${s.where}`); sfx('start');
}
function say(m){ S.msg=m; S.msgT=0; }
function pop(x,y,txt,col,size){ S.pops.push({x,y,t:0,txt,col:col||'#fff',size:size||14}); }
const city=()=>S.bld.reduce((a,b)=>a+b.hp,0)/S.bld.length;
function hurtBld(b,d,x,y){ if(!b||b.hp<=0) return; b.hp=Math.max(0,b.hp-d); b.hit=.2; if(b.hp<=0){ sfx('crash'); for(let k=0;k<10;k++) S.pieces.push({x:b.x+rnd()*b.w,y:GY-rnd()*b.h*.5,vx:(rnd()-.5)*120,vy:-rnd()*200,r:rnd()*6,vr:(rnd()-.5)*6,s:6+rnd()*8,c:'#8A8070',t:0,life:3}); } }
function nearBld(x){ let best=null,bd=1e9; for(const b of S.bld){ if(b.hp<=0) continue; const d=Math.abs(b.x+b.w/2-x); if(d<bd){ bd=d; best=b; } } return best; }

/* ================= update ================= */
function update(dt){
  S.msgT+=dt;
  for(const p of S.pops) p.t+=dt; S.pops=S.pops.filter(p=>p.t<1.3);
  for(const p of S.pieces){ p.t+=dt; p.vy+=GRAV*.6*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; if(p.y>GY-2){ p.y=GY-2; p.vy*=-.35; p.vx*=.7; p.vr*=.6; } }
  S.pieces=S.pieces.filter(p=>p.t<p.life);
  S.flash=Math.max(0,S.flash-dt*2.5); S.shake=Math.max(0,S.shake-dt*30);
  if(S.scene!=='play'){ if(S.auto&&S.scene!=='play'){ S.resT+=dt; if(S.resT>(S.scene==='title'?.6:3.4)){ S.resT=0; startStage(S.scene==='title'?0:S.lastWin&&S.si<4?S.si+1:S.lastWin?0:S.si); } } return; }
  if(S.stop>0){ S.stop-=dt; return; }               // hit-stop after the big kick
  S.t+=dt;
  if(S.winT>=0){ S.winT+=dt; heroMove(dt,true); if(S.winT>3.2) finish(true); return; }
  if(S.auto) autoTick(dt);
  heroMove(dt,false);
  spawn(dt);
  for(const m of S.minions) minionTick(m,dt);
  if(S.boss) bossTick(S.boss,dt);
  for(const s of S.shots) shotTick(s,dt); S.shots=S.shots.filter(s=>!s.done);
  for(const b of S.bld) b.hit=Math.max(0,b.hit-dt);
  checkKick();
  S.minions=S.minions.filter(m=>!m.dead);
  if(city()<=0) finish(false);
}
function heroMove(dt,idle){
  const h=S.hero; let mx=0;
  if(!idle){ if(S.keys.left||S.btn.l||S.ai&&S.ai.l) mx-=1; if(S.keys.right||S.btn.r||S.ai&&S.ai.r) mx+=1; }
  h.kickCd=Math.max(0,h.kickCd-dt);
  if(h.kickT>=0){ h.kickT+=dt; if(h.kickT<.2){ h.vx=h.face*560; if(!h.ground) h.vy=Math.min(h.vy,60); } if(h.kickT>.32) h.kickT=-1; }
  else { h.vx+=(mx*270-h.vx)*Math.min(1,dt*14); if(mx) h.face=mx; }
  h.vy+=GRAV*dt; h.x+=h.vx*dt; h.y+=h.vy*dt;
  if(h.y>=GY){ h.y=GY; h.vy=0; if(!h.ground){ h.ground=true; h.jumps=0; } } else h.ground=false;
  h.x=clamp(h.x,16,WW-16); h.run+=Math.abs(h.vx)*dt*.08; h.cape+=dt;
}
function jump(){ const h=S.hero; if(S.scene!=='play'||S.winT>=0) return; if(h.ground){ h.vy=-800; h.ground=false; h.jumps=1; sfx('jump'); } else if(h.jumps<2){ h.vy=-760; h.jumps=2; sfx('jump'); S.pops.push({x:h.x,y:h.y,t:0,txt:'',ring:1}); } }
function kick(){ const h=S.hero; if(S.scene!=='play'||S.winT>=0||h.kickT>=0||h.kickCd>0) return; h.kickT=0; h.kickCd=.42; S.kicks++; sfx('whoosh'); }
// the kick hits whatever is in front of the foot
function checkKick(){
  const h=S.hero; if(h.kickT<.03||h.kickT>.24) return;
  const x0=h.face>0?h.x+4:h.x-78, x1=h.face>0?h.x+78:h.x-4, y0=h.y-62, y1=h.y-2;
  const hit=o=>o.x+o.w/2>x0&&o.x-o.w/2<x1&&o.y>y0&&o.y-o.h<y1;
  for(const m of S.minions) if(!m.dead&&hit(m)) killMinion(m);
  const b=S.boss; if(b&&b.alive&&b.vis>.6&&!b.under&&hit(b)) killBoss(b);
}
function shatter(o,cols,n,power){ for(let k=0;k<n;k++){ const a=rnd()*Math.PI*2, sp=power*(.4+rnd()); S.pieces.push({x:o.x+(rnd()-.5)*o.w*.8,y:o.y-o.h*rnd(),vx:Math.cos(a)*sp+S.hero.face*power*.6,vy:Math.sin(a)*sp-power*.5,r:rnd()*6,vr:(rnd()-.5)*14,s:(o.w+o.h)/(7+rnd()*9),c:pick(cols),t:0,life:2.5+rnd()*2}); } }
function killMinion(m){ m.dead=true; S.killed++; shatter(m,MIN[m.kind].c,14,420); pop(m.x,m.y-m.h-6,`-${fmt(MIN[m.kind].hp)}`,'#FFE040',13); sfx('pow'); S.shake=4; }
function killBoss(b){ b.alive=false; S.stop=.32; S.flash=1; S.shake=16; const c=BOSS[b.kind].c; shatter(b,c,90,900); shatter(b,['#FFFFFF','#FFE040'],20,700);
  pop(b.x,b.y-b.h*.7,'ドゴォォォン!!','#FFE040',34); pop(b.x,b.y-b.h*.4,`HP ${fmt(st().hp)} → 0`,'#fff',16);
  for(const m of S.minions) if(!m.dead) killMinion(m); S.shots=[]; S.winT=0; sfx('boom'); say(pick(['……あ、終わった。','……また1発か。','……つまらん。','……晩ごはん、何にしよう。']));
  S.minions=[]; }
/* --- little monsters walk (or fly) to the nearest building and chew on it --- */
function spawn(dt){
  const s=st(); S.spawnT-=dt;
  const alive=S.minions.length;
  if(S.spawned<s.count&&S.spawnT<=0&&alive<5){ S.spawnT=1.3+rnd()*.8; S.spawned++; const k=MIN[s.minion], side=rnd()<.5?-1:1;
    S.minions.push({kind:s.minion,x:side<0?-20:WW+20,y:k.fly?GY-140-rnd()*160:GY,w:k.w,h:k.h,vx:0,vy:0,face:-side,ph:rnd()*6,bite:0,dead:false}); }
  if(!S.boss&&(S.killed>=Math.ceil(s.count*.7)||S.t>32)) bossIn();
}
function minionTick(m,dt){
  const k=MIN[m.kind], b=nearBld(m.x); m.ph+=dt*6; if(!b) return;
  const tx=b.x+b.w/2+(m.x<b.x+b.w/2?-b.w*.3:b.w*.3), dx=tx-m.x;
  if(Math.abs(dx)>8){ m.x+=Math.sign(dx)*k.sp*dt; m.face=Math.sign(dx); }
  else { m.bite+=dt; if(m.bite>.8){ m.bite=0; hurtBld(b,2.2); pop(m.x,m.y-m.h-4,'ガブ','#FFB0A0',11); } }
  if(k.fly){ const ty=GY-Math.min(b.h*.6,160)-20; m.y+=(ty-m.y)*Math.min(1,dt*1.5); m.y+=Math.sin(m.ph)*.6; }
  // they also attack the hero if he is right there… for nothing
  const h=S.hero; if(Math.abs(h.x-m.x)<26&&Math.abs(h.y-m.y)<40&&rnd()<dt*1.2) noDamage(m.x,m.y-m.h);
}
function noDamage(x,y){ const h=S.hero; pop(h.x,h.y-74,'ノーダメージ','#C8E8FF',12); pop(x,y,'ペチ','#fff',11); sfx('tap'); h.bored+=1; }
/* --- the boss --- */
function bossIn(){ const s=st(), k=BOSS[s.boss], side=S.hero.x<WW/2?1:-1;
  const vw=VW0/s.zoom, d=Math.max(vw*.5,k.w*.5+120), bx=clamp(S.hero.x+(S.hero.x+d<WW-k.w/2?d:-d),k.w/2+10,WW-k.w/2-10);
  const b={kind:s.boss,x:bx,y:GY,w:k.w,h:k.h,vx:0,vy:0,face:-side,t:0,cd:2,act:'idle',actT:0,alive:true,vis:1,under:false,ph:0,flee:0};
  if(b.kind==='dragon') b.y=GY-300; if(b.kind==='eater') { b.y=GY-170; b.x=WW/2; }
  S.boss=b; S.shake=10; sfx('roar'); say(`⚠ 怪人出現！「${s.n}」 危険度${'★'.repeat(s.danger)}`); }
function bossTick(b,dt){
  if(!b.alive) return; b.t+=dt; b.ph+=dt; b.cd-=dt; b.flee-=dt; b.actT+=dt;
  const h=S.hero, dxh=h.x-b.x, near=Math.abs(dxh)<b.w/2+90;
  const tb=()=>{ const al=S.bld.filter(q=>q.hp>0); return al.length?pick(al):null; };
  if(b.kind==='frog'){
    if(b.act==='hop'){ b.vy+=GRAV*.8*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.y>=GY){ b.y=GY; b.act='idle'; b.actT=0; S.shake=5; sfx('thud'); } }
    else if(near&&b.flee<=0){ b.act='hop'; b.flee=1.6; b.vy=-760; b.vx=(dxh>0?-1:1)*(240+rnd()*120); if(b.x+b.vx*1.2<80||b.x+b.vx*1.2>WW-80) b.vx*=-1; b.face=Math.sign(b.vx); pop(b.x,b.y-b.h-10,'ゲコッ!','#fff',13); }
    else if(b.cd<=0){ const t=nearBld(b.x); if(t){ b.cd=1.8; b.act='tongue'; b.actT=0; b.tgt=t; b.face=Math.sign(t.x+t.w/2-b.x)||1; } }
    if(b.act==='tongue'&&b.actT>.35){ hurtBld(b.tgt,7); b.act='idle'; if(near) noDamage(b.x+b.face*60,b.y-b.h*.5); }

/* ================= auto: get under the target and kick at the right moment ================= */
function autoTick(){
  const h=S.hero; S.ai={l:false,r:false};
  let tg=null; const b=S.boss;
  if(b&&b.alive&&!b.under&&b.vis>.3) tg=b;
  if(!tg||(S.minions.length&&b&&b.act!=='idle'&&b.kind!=='eater')){ // the most dangerous little monster: the one chewing a building
    let bd=1e9; for(const m of S.minions){ const d=Math.abs(m.x-h.x)+(m.bite>0?-120:0); if(d<bd){ bd=d; tg=m; } } if(!tg&&b&&b.alive) tg=b; }
  if(!tg) return;
  const reachX=tg.w/2+40, dx=tg.x-h.x, adx=Math.abs(dx), bottom=tg.y, top=tg.y-tg.h;
  // stand a little in front of it, facing it
  if(adx>reachX-6){ if(dx>0) S.ai.r=true; else S.ai.l=true; }
  else if(adx<tg.w/2-6&&tg.w<120){ if(dx>0) S.ai.l=true; else S.ai.r=true; }
  const want=Math.sign(dx)||h.face; if(h.face!==want&&adx>8){ if(want>0) S.ai.r=true; else S.ai.l=true; }
  // too high? jump (and jump again near the top of the jump)
  const footReach=h.y-4, headReach=h.y-60;
  if(bottom<h.y-50&&adx<reachX+120){ if(h.ground) jump(); else if(h.jumps<2&&h.vy>-120&&bottom<h.y-20) jump(); }
  // kick when the foot box overlaps
  const inX=adx<tg.w/2+76&&h.face===want, inY=bottom>headReach&&top<footReach;
  if(inX&&inY) kick();
}

function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='sine',v=.07,delay=0,f2){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
