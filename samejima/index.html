/* ===== 時刻 ===== */
function tstr(sec){
  if(G.depth>=50) return '2001/06/15(金) 03:33:33';
  const sc=G.sec||0;
  const m=(G.day-1)*1440+20*60+G.act*80+Math.floor(sc/60);
  const d=new Date(Date.UTC(2001,5,14)+m*60000);
  const p=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+'/'+p(d.getUTCMonth()+1)+'/'+p(d.getUTCDate())+'('+WD[d.getUTCDay()]+') '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(sec==null?sc%60:sec);
}

/* ===== 音 ===== */
let AC=null, master=null, dr=null;
function ac(){
  if(!SV.snd) return null;
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination); }
    if(AC.state==='suspended') AC.resume().catch(()=>{});
  }catch(e){ return null; }
  return AC;
}
function tone(f,d,type,v,t0,f2){
  const a=ac(); if(!a) return;
  const t=a.currentTime+(t0||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.linearRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
}
function noise(d,v,fc,t0){
  const a=ac(); if(!a) return;
  const t=a.currentTime+(t0||0), n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), x=b.getChannelData(0);
  for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc||1800; f.Q.value=1.2;
  const g=a.createGain(); g.gain.value=v||.05;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const sfx={
 type(){ tone(1500+Math.random()*300,.03,'square',.035); tone(900,.025,'square',.025,.045); },
 click(){ tone(700,.05,'square',.04); },
 ok(){ tone(660,.08,'square',.05); tone(990,.12,'square',.05,.08); },
 bad(){ tone(180,.2,'sawtooth',.06,0,120); },
 card(){ tone(880,.07,'triangle',.07); tone(1320,.14,'triangle',.07,.07); },
 day(){ tone(523,.15,'sine',.06); tone(392,.25,'sine',.06,.15); },
 dial(){
  tone(1300,.2,'sine',.05,0); tone(2100,.4,'sine',.05,.25);
  for(let i=0;i<16;i++) tone(500+Math.random()*2200,.07,'square',.025,.75+i*.055);
  noise(.7,.05,1700,.7); noise(.4,.04,2600,1.5);
 },
 end(){ tone(330,.5,'sine',.07); tone(247,.9,'sine',.07,.3); }
};
function droneStart(){
  const a=ac(); if(!a||dr) return;
  const mk=(f,type)=>{ const o=a.createOscillator(); o.type=type; o.frequency.value=f; return o; };
  const o1=mk(55,'sawtooth'), o2=mk(55.3,'sawtooth'), o3=mk(77.8,'sine'), lfo=mk(.18,'sine');
  const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=180;
  const g=a.createGain(); g.gain.value=0; const g3=a.createGain(); g3.gain.value=0;
  const lg=a.createGain(); lg.gain.value=20;
  lfo.connect(lg); lg.connect(fl.frequency);
  o1.connect(fl); o2.connect(fl); fl.connect(g); o3.connect(g3); g.connect(master); g3.connect(master);
  [o1,o2,o3,lfo].forEach(o=>o.start());
  dr={o1,o2,o3,lfo,fl,g,g3,a};
  droneUpdate();
}
function droneUpdate(){
  if(!dr) return;
  const d=G?G.depth:0, t=dr.a.currentTime;
  dr.g.gain.linearRampToValueAtTime(.035+d/100*.05,t+1);
  dr.g3.gain.linearRampToValueAtTime(Math.max(0,(d-30)/70)*.05,t+1);
  dr.o2.frequency.linearRampToValueAtTime(55+.3+d/100*3,t+1);
  dr.fl.frequency.linearRampToValueAtTime(160+d*5,t+1);
  dr.lfo.frequency.linearRampToValueAtTime(.18+d/100*.9,t+1);
}
function droneStop(){
  if(!dr) return;
  const d=dr; dr=null;
  try{ d.g.gain.linearRampToValueAtTime(0,d.a.currentTime+.6); d.g3.gain.linearRampToValueAtTime(0,d.a.currentTime+.6); setTimeout(()=>{ [d.o1,d.o2,d.o3,d.lfo].forEach(o=>{try{o.stop();}catch(e){}}); },800); }catch(e){}
}
function setSnd(on){
  SV.snd=!!on; save();
  const b=$('#sndBtn'); b.setAttribute('aria-pressed',String(SV.snd)); b.textContent=SV.snd?'🔊':'🔇';
  if(!SV.snd) droneStop(); else if(scr==='play') droneStart();
}

/* ===== 掲示板 ===== */
function moji(s,p){
  const MJ='縺繧荳蜷譁蟄逕ｿ鬮ｻ';
  return [...s].map(c=>/[\s>。、…！？ｗ]/.test(c)?c:(rnd()<p?MJ[Math.floor(rnd()*MJ.length)]:c)).join('');
}
function addPost(o){
  G.n++; G.sec+=ri(4,45);
  const p=Object.assign({n:G.n,nm:pick(NAMES),id:mkId(),date:tstr(),text:'',mine:false,hint:false,same:false},o);
  G.posts.push(p); return p;
}
function resHTML(p){
  const nm=p.nm.indexOf('◆')===0?`<b class="nm kote">${esc(p.nm)}</b>`:`<b class="nm">${esc(p.nm)}</b>`;
  const txt=br(p.text).replace(/(&gt;&gt;\d+)/g,'<span class="anc">$1</span>');
  return `<dl class="res${p.mine?' me':''}${p.same?' same':''}"><dt><span class="no">${p.n}</span> ：${nm} ：${esc(p.date)} ID:<span class="id">${esc(p.id)}</span></dt><dd>${txt}</dd></dl>`;
}
function makeReplies(o,myNo){
  const out=[]; const t=G.trust;
  const pool=POOL[o.id]||POOL.flavor;
  let n=ri(2,3)+(t>70?1:0); if(o.rom) n=0;
  for(let i=0;i<n;i++){
    let s=rnd()<.25?pick(POOL.flavor):pick(pool);
    if(rnd()<.45) s='>>'+myNo+' '+s;
    out.push({text:s});
  }
  if(G.ban>=3 && rnd()<.8) out.push({text:'…次はアク禁だぞ。'});
  if(!o.rom && G.hintIdx<HINTS.length && rnd()<o.hint+t/400){
    const h=HINTS[G.hintIdx++]; G.memo.push(h); out.push({text:h,hint:true});
  }
  if(G.depth>=35 && rnd()<.5) out.push({text:pick(SAMEID),same:true});
  return out;
}
function queueReplies(list){
  for(const r of list){
    let tx=r.text;
    if(G.depth>=65) tx=moji(tx,r.hint?(G.depth-60)/600:(G.depth-60)/180);
    Q.push({nm:r.same?'名無しさん＠ななし中。':pick(G.res).nm,id:r.same?G.myId:pick(G.res).id,text:tx,same:!!r.same,hint:!!r.hint});
  }
  qT=0;
}
function flushQ(){
  while(Q.length){ const r=Q.shift(); addPost(r); }
  qT=0; renderView(true); renderMeters(); renderPanel(); checkPending();
}
function revealOne(){
  const r=Q.shift(); if(!r) return;
  addPost(r); sfx.type();
  if(vmode==='thread') renderView(true);
}

/* ===== 行動の共通処理 ===== */
function spend(){ G.act++; G.totalActs++; }
function checkEnd(){
  if(G.pendingEnd) return;
  if(G.firstRead&&G.cycleFound){ G.truthDay=G.day; G.pendingEnd='truth'; return; }
  if(G.ban>=6){ G.pendingEnd='ban'; return; }
  if(G.legend>=6){ G.pendingEnd='teller'; return; }
  if(G.depth>=100){ G.pendingEnd='deep'; return; }
  if(G.trust>=95){ G.pendingEnd='grad'; return; }
}
function afterAction(){
  G.depth=clamp(G.depth,0,100); G.trust=clamp(G.trust,0,100);
  checkEnd();
  if(!G.pendingEnd && G.act>=ACTS){
    G.day++; G.act=0; G.kAsked={}; G.ban=Math.max(0,G.ban-1); G.sec=0;
    if(G.day>DAYS){ G.pendingEnd=G.rom>=3?'rom':'timeup'; }
    else { G.posts.push({day:G.day,n:0}); sfx.day(); }
  }
  if(!G.pendingEnd && G.depth>=80 && !G.disc){ G.disc=true; ovT=auto?.35:2.2; showOv(); sfx.dial(); }
  droneUpdate(); renderAll();
  if(!Q.length) checkPending();
}
function checkPending(){
  if(G&&G.pendingEnd&&!Q.length&&scr==='play'&&ovT<=0){ const e=G.pendingEnd; G.pendingEnd=null; G.ended=e; showEnding(e); }
}
function showOv(){
  const o=$('#ov'); o.hidden=false;
  o.textContent='接続が切れました。\n\nダイヤルアップ接続中…\nピー ヒョロロロ ガーーー\n\n※しばらくお待ちください';
}
function busy(){ return !!(Q.length||ovT>0||G.pendingEnd||G.ended||scr!=='play'); }

/* ---- 書き込み ---- */
function doPost(id){
  if(busy()) return false;
  const o=POSTS.find(p=>p.id===id); if(!o) return false;
  let text=o.text;
  if(o.needCard){
    const ids=Object.keys(G.cards).filter(c=>CARDS[c]);
    if(!ids.length) return false;
    const c=CARDS[pick(ids)];
    text='証言がある。「'+c.claim.replace(/。$/,'')+'」（'+c.who+'）これについて何か知らないか？';
  }
  if(o.rom) text='（半年ROMることにした）';
  const first=!G.thread;
  if(first){ G.thread=true; G.posts.push({sys:'スレッドを立てました：【質問】鮫島事件って何？'}); }
  spend();
  G.trust+=o.tr; G.depth+=o.dp; G.ban+=o.ban; G.legend+=o.lg; if(o.rom) G.rom++;
  const mine=addPost({nm:'名無しさん＠ななし中。',id:G.myId,text:o.rom?'（ROM中）':text,mine:true});
  sfx.click();
  vmode='thread'; pmode='menu';
  queueReplies(makeReplies(o,mine.n));
  if(auto) flushQ0();
  afterAction();
  return true;
}
function flushQ0(){ while(Q.length) addPost(Q.shift()); }

/* ---- 過去ログ ---- */
function logList(){
  const l=LOGS.map((x,i)=>({i,t:x.t,seen:G.logSeen[i]||''}));
  if(G.keys.date&&G.keys.title) l.push({i:FIRST_IDX,t:'伝説の鮫島スレについて語ろう',seen:G.logSeen[FIRST_IDX]||'',fresh:true});
  return l;
}
function doLog(i){
  if(busy()) return false;
  const first=(i===FIRST_IDX);
  if(first&&!(G.keys.date&&G.keys.title)) return false;
  if(!first&&!LOGS[i]) return false;
  spend(); pmode='menu'; vmode='log'; lastGain=null;
  if(first){
    G.logSeen[i]='ok'; G.depth+=5; G.firstRead=true; vdata={title:'伝説の鮫島スレについて語ろう',first:true};
    sfx.ok();
  } else {
    const L=LOGS[i]; vdata={title:L.t,st:L.st,body:L.body||null};
    if(L.st==='ok'){
      G.logSeen[i]='ok'; G.depth+=6; sfx.ok();
      if(L.card&&!G.cards[L.card]){ addCard(L.card); lastGain='証言カード「'+CARDS[L.card].claim+'」を手に入れた'; if(CARDS[L.card].key) G.keys[CARDS[L.card].key]=true; }
      if(L.memo&&G.memo.indexOf(L.memo)<0) G.memo.push(L.memo);
    } else { G.logSeen[i]=L.st; G.depth+=2; sfx.bad(); }
  }
  afterAction(); return true;
}
function addCard(id){ if(G.cards[id]) return; G.cards[id]=true; G.order.push(id); sfx.card(); }

/* ---- コテハン ---- */
function doKote(kid){
  if(busy()) return false;
  const k=KOTE.find(x=>x.id===kid); if(!k) return false;
  if(G.kAsked[kid]) return false;
  spend(); G.kAsked[kid]=true; pmode='menu'; vmode='kote'; lastGain=null;
  const lines=[['you','鮫島事件について、教えてもらえませんか。']];
  const has=!!G.cards[k.card];
  if(has){
    lines.push(['k',pick(['もう話したろ。それ以上は知らん。','…同じことしか言えないぞ。','その話はやめろ、と言ったはずだ。'])]);
    G.depth+=1;
  } else if(kid==='kyomu'){
    if(G.trust<k.thr){
      lines.push(['k',pick(['島？公安？全部ほんとだぜ（大嘘）','実は俺が最初の被害者でな…（作り話）','鮫島は実在する。俺の隣に座ってる。'])]);
      lines.push(['sys','― 冗談ばかりで、本音は聞けなかった（信用が足りない？）']);
      G.depth+=3;
    } else if(G.depth<30){
      lines.push(['k','お前はまだ浅い。もっと探ってから来い。']);
      lines.push(['sys','― 本音を話すには、もっと事件を調べている必要がありそうだ']);
      G.depth+=3;
    } else {
      lines.push(['k','……しょうがねえな。全部ノリだよ。誰も本当のことなんか知らねえ。']);
      lines.push(['k','最初のスレを見りゃ分かる。俺の言葉なんか信じるな、自分の目で見ろ。']);
      gainKote(k); G.depth+=8;
    }
  } else if(G.trust>=k.thr){
    const T={
     shira:['ああ…2001年の夏にさ、とんでもない事件があったんだと。ログ屋から聞いた話だけどな。','…その話はやめろ、って言いたいところだが。お前なら、まあいい。'],
     logya:['公安が絡んで、スレが消された。そう聞いてる。元管理人から聞いた話だがね。','過去ログは2001年6月の頃のなら、まだ読めるのが残ってるよ。'],
     kanri:['事件の舞台は「島」だったらしい。あおいさかなが見たと言っていたよ。','君は礼儀を知っているね。昔の掲示板はそうだった。'],
     aoi:['お、俺は何も知らない…！ただ、しらたまがそう言ってたんだ…。','あれはマジでヤバい、って。そう聞いただけ…']
    }[kid];
    T.forEach(s=>lines.push(['k',s])); gainKote(k); G.depth+=8;
  } else {
    const low=G.trust<k.thr-20;
    lines.push(['k',low?pick(['半年ROMれ。','ググれ。','…誰だお前。','コテに話しかける前に、礼儀を覚えてこい。']):pick(['…その話はやめろ。','今は話す気分じゃない。','もう少し、お前のことを知ってからだ。','おい…ちょっと待て。'])]);
    lines.push(['sys','― 住人の信用がまだ足りないようだ']);
    G.depth+=3;
  }
  vdata={kote:k,lines};
  if(lastGain) sfx.ok(); else sfx.click();
  afterAction(); return true;
}
function gainKote(k){ addCard(k.card); lastGain='証言カード「'+CARDS[k.card].claim+'」（'+CARDS[k.card].who+'）を手に入れた'; }

/* ---- まとめる ---- */
function hasLink(a,b){ return G.links.some(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a)); }
function boardLink(a,b){
  if(a===b||!G.cards[a]||!G.cards[b]) return false;
  const i=G.links.findIndex(l=>(l[0]===a&&l[1]===b)||(l[0]===b&&l[1]===a));
  if(i>=0) G.links.splice(i,1); else G.links.push([a,b]);
  return true;
}
function boardSubmit(){
  if(busy()) return false;
  spend(); G.depth+=4; boardNote=''; lastGain=null;
  const have=CYC.filter(c=>G.cards[c]).length;
  const isEdge=(a,b)=>EDGES.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));
  const wrong=G.links.filter(l=>!isEdge(l[0],l[1])).length;
  const correct=EDGES.filter(e=>hasLink(e[0],e[1])).length;
  if(G.cycleFound){
    boardNote='もう循環はつかんでいる。あとは最初のスレを探すだけだ。'; sfx.click();
  } else if(correct===4&&wrong===0){
    G.cycleFound=true; G.keys.title=true; sfx.ok();
    boardNote='つながった。\nしらたま → ログ屋 → 元管理人 → あおいさかな → しらたま…\n出典をたどると、ぐるっと元の人に戻ってくる。誰も一次情報を持っていない。\n\nこの噂の「いちばん最初」は、きっと名無しの書いたスレそのものだ。\nスレタイは『伝説の鮫島スレについて語ろう』。';
    if(!G.keys.date) boardNote+='\n（でも、いつ立ったスレなのか分からない。日付の手がかりが要る）';
    else boardNote+='\nログ倉庫の検索結果に、新しいスレが出た。';
  } else if(wrong>0){
    G.trust-=4; sfx.bad();
    boardNote='余計な線がある。引くのは「だれの話か」と「その出典の人」の間だけ。\n（まとめ厨乙、と住人に笑われた。信用ちょっとダウン）';
  } else if(have<4){
    sfx.bad(); boardNote='線が途中で切れている…。まだ、だれかの話が足りない。\n（集まっている出典つきの証言：'+have+'/4）';
  } else {
    sfx.bad(); boardNote='まだ、つながっていない出典がある。カードの「出典」の人を探して線で結ぼう。（正しい線：'+correct+'/4）';
  }
  afterAction(); return true;
}
function sleepDay(){
  if(busy()) return false;
  G.totalActs++;
  G.act=ACTS; pmode='menu';
  afterAction(); return true;
}

/* ===== オート ===== */
function autoTarget(){ for(const e of END_ORDER) if(!SV.end[e]) return e; return 'truth'; }
function autoLink(){
  G.links=G.links.filter(l=>EDGES.some(e=>(e[0]===l[0]&&e[1]===l[1])||(e[0]===l[1]&&e[1]===l[0])));
  EDGES.forEach(e=>{ if(!hasLink(e[0],e[1])) boardLink(e[0],e[1]); });
}
function planTruth(){
  const ks=[KOTE[1],KOTE[0],KOTE[2],KOTE[3]];
  const need=ks.filter(k=>!G.cards[k.card]);
  const maxThr=need.reduce((m,k)=>Math.max(m,k.thr),0);
  if(G.trust<maxThr) return doPost('polite');
  for(const k of ks) if(!G.cards[k.card]&&!G.kAsked[k.id]) return doKote(k.id);
  if(!G.keys.date) return doLog(4);
  if(!G.cycleFound){ autoLink(); vmode='board'; return boardSubmit(); }
  return doLog(FIRST_IDX);
}
function autoAct(){
  const t=A.target;
  if(t==='truth') return planTruth();
  if(t==='teller') return doPost('sousaku');
  if(t==='ban') return doPost('aori');
  if(t==='deep') return doPost('tsuikyuu');
  if(t==='grad') return doPost('polite');
  if(t==='rom') return G.rom<3?doPost('rom'):sleepDay();
  return sleepDay();
}
function autoTick(){
  if(scr==='title'){ startRun(); return; }
  if(scr==='ending'){ while(endIdx<endLines.length) addEndLine(true); showResult(); return; }
  if(scr==='result'){ startRun(); return; }
  if(!G||G.ended) return;
  if(Q.length){ flushQ(); return; }
  if(ovT>0){ ovT=0; $('#ov').hidden=true; checkPending(); return; }
  if(busy()) return;
  if(!autoAct()) sleepDay();
}
function setAuto(on){
  auto=!!on;
  const b=$('#autoBtn'); b.setAttribute('aria-pressed',String(auto));
  A.t=0; A.wait=(scr==='result')?1.1:.3;
  if(auto) A.target=autoTarget();
  if(G&&scr==='play') renderMeters(); else $('#autolbl').hidden=true;
}

    if(Q.length){ qT-=dt; if(qT<=0){ revealOne(); qT=.75; if(!Q.length){ renderPanel(); renderMeters(); checkPending(); } } }
    $('#newres').classList.toggle('on',Q.length>0);
    if(Q.length) $('#newres').textContent='▼ 新着レス（のこり'+Q.length+'件・タップでスキップ）';
  }
  if(scr==='ending'){
    endT-=dt;
    while(endT<=0&&endIdx<endLines.length){ addEndLine(); endT+=(endId==='deep'?1.5:1.0); }
    if(endIdx>=endLines.length&&scr==='ending') showResult();
  }
  if(auto){
    A.t+=dt;
    const w=scr==='result'?1.1:.3;
    if(A.t>=w){ A.t=0; autoTick(); }
  }
}
function step(dt){ while(dt>0){ const d=Math.min(dt,.1); sub(d); dt-=d; } }
let last=0;
function frame(t){ const dt=Math.min(.1,Math.max(0,(t-last)/1000)); last=t; step(dt); requestAnimationFrame(frame); }

$('#autoBtn').addEventListener('click',()=>{ setAuto(!auto); });
$('#sndBtn').addEventListener('click',()=>{ setSnd(!SV.snd); if(SV.snd) sfx.click(); });
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='o'||e.key==='O'){ setAuto(!auto); return; }
  if(auto&&!['Tab','Shift','Control','Alt','Meta'].includes(e.key)) setAuto(false);
});
document.addEventListener('pointerdown',e=>{
  if(!auto||!e.isTrusted) return;
  if(e.target.closest('#autoBtn,#sndBtn,#back')) return;
  if(e.target.closest('button,[data-c],[data-a]')) setAuto(false);
},true);
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });

window.__samejima={
  state(){ if(!G) return {scr}; return {scr,day:G.day,act:G.act,depth:G.depth,trust:G.trust,ban:G.ban,legend:G.legend,rom:G.rom,thread:G.thread,cards:Object.keys(G.cards),keys:Object.assign({},G.keys),links:G.links.map(l=>l.slice()),cycleFound:G.cycleFound,firstRead:G.firstRead,kAsked:Object.assign({},G.kAsked),memo:G.memo.slice(),logSeen:Object.assign({},G.logSeen),pendingEnd:G.pendingEnd,ended:G.ended,endId,totalActs:G.totalActs,truthDay:G.truthDay,busy:busy(),auto,target:A.target,vmode,pmode,logs:logList()}; },
  save(){ return JSON.parse(JSON.stringify(SV)); },
  resetSave(){ SV={end:{},bestTruth:0,snd:SV.snd,runs:0}; save(); },
  seed(n){ seed=n>>>0; },
  step, setAuto, setSnd, start:startRun, title:showTitle, flush:flushQ,
  post:doPost, log:doLog, kote:doKote, link:boardLink, submit:boardSubmit, sleep:sleepDay,
  setStat(o){ if(!G) return; Object.assign(G,o); afterAction(); },
  END_ORDER, FIRST_IDX, POSTS:POSTS.map(p=>p.id), KOTE:KOTE.map(k=>({id:k.id,card:k.card})), EDGES,
  cardOf(id){ return CARDS[id]; }
};

setSnd(SV.snd);
showTitle();
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
