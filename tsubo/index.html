</style>

function makeSvg(el,side='f',vb=[0,0,240,440]){

  el.innerHTML='<g class="gf">'+bodyG('f')+'</g><g class="gb" style="display:none">'+bodyG('b')+'</g><g class="mk"></g><g class="fx"></g>';

    setSide(s){ o.side=s; el.querySelector('.gf').style.display=s==='f'?'':'none'; el.querySelector('.gb').style.display=s==='b'?'':'none'; },
    go(vb2,snap){ o.target=vb2.slice(); if(snap){ o.view=vb2.slice(); el.setAttribute('viewBox',o.view.join(' ')); } },
    tick(dt){ let ch=false; const k=Math.min(1,dt*12); for(let i=0;i<4;i++){ const d=o.target[i]-o.view[i]; if(Math.abs(d)>0.02){ o.view[i]+=d*k; ch=true; } else o.view[i]=o.target[i]; } if(ch) el.setAttribute('viewBox',o.view.map(v=>+v.toFixed(2)).join(' ')); },
    clearMarks(){ el.querySelector('.mk').innerHTML=''; },
    mark(x,y,r,col,cls=''){ const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r); c.setAttribute('fill',col); if(cls==='hintring'){ c.setAttribute('fill','none'); c.setAttribute('stroke',col); c.setAttribute('stroke-width','2.5'); } else { c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1.5'); } if(cls) c.setAttribute('class',cls); el.querySelector('.mk').appendChild(c); return c; },
    ring(x,y,col){ const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',8); c.setAttribute('fill','none'); c.setAttribute('stroke',col); c.setAttribute('stroke-width','3'); c.setAttribute('class','ring'); el.querySelector('.fx').appendChild(c); return c; },

  showStory([['👴','師範マサ','マサ新影流は、人をたおす「殺法」と、人をすくう「活法」をあわせもつ 古い流派じゃ。'],['👴','師範マサ','同じ ツボでも、押しかたしだいで 技にも 癒しにも なる。それが 活殺法。'],['👴','師範マサ','おぬしは 殺法ではなく、活法を ひらけ。うら庭の整体院「新影堂」に、きょうも お客さんが 来ておる。'],['👴','師範マサ','まずは どこに どの ツボが あるのか。図で しっかり おぼえるのじゃ。']],()=>showLesson(0,true)); }
function lessonCards(sy){
  let h='<h3>'+sy.em+' '+sy.n+'<small style="font-size:12px;color:#8A4A18">　'+sy.r+'</small></h3><p>'+sy.intro+'</p><div class="over"><svg id="ovF"></svg><svg id="ovB"></svg></div><p style="text-align:center;font-size:11px;margin:0;color:#8A4A18">おもて　　　　　　　　　　　　うしろ</p>';
  sy.ts.forEach((id,i)=>{ const t=TS[id]; h+='<div class="lcard"><svg id="lc_'+sy.id+'_'+id+'"></svg><div><h4><span class="dot" style="background:'+COLS[i%COLS.length]+'"></span>'+t.n+'<small>'+t.r+'</small></h4><p>📍'+t.where+(t.p.length>1?'（左右 2か所）':'')+'</p><p>✨'+t.fx+'</p></div></div>'; });
  return h;
}
function mountLesson(sy){
  sy.ts.forEach((id,i)=>{ SV.seen[id]=1; });
  for(const [sid,side] of [['ovF','f'],['ovB','b']]){ const el=document.getElementById(sid); const o=makeSvg(el,side,[20,0,200,440]); sy.ts.forEach((id,i)=>{ const t=TS[id]; if(t.s===side) t.p.forEach(p=>o.mark(p[0],p[1],8,COLS[i%COLS.length])); }); }
  sy.ts.forEach((id,i)=>{ const t=TS[id], el=document.getElementById('lc_'+sy.id+'_'+id); const o=makeSvg(el,t.s,[t.p[0][0]-40,t.p[0][1]-32,80,64]); o.go([t.p[0][0]-40,t.p[0][1]-32,80,64],true); o.mark(t.p[0][0],t.p[0][1],4.5,COLS[i%COLS.length]); o.mark(t.p[0][0],t.p[0][1],7,COLS[i%COLS.length],'hintring'); });
  save();
}
function showLesson(si,start){
  S.mode='lesson'; S.si=si; const st=STAGES[si]; $('#title').hidden=true;
  let h='<div class="tag">STAGE '+(si+1)+' / 5　レッスン</div><h3>'+st.n+'</h3><div class="master"><div class="face">👴</div><div class="t"><small>師範マサ</small>'+MASTER[si]+'</div></div>';
  const sys=st.sy.map(id=>SY.find(y=>y.id===id));
  sys.forEach(sy=>{ h+=lessonCards(sy); });
  h+='<div class="row"><button class="big" id="bGo">'+(start?'お客さんを むかえる':'もどる')+'</button></div>';
  openOv(h); sys.forEach(mountLesson);
  const go=()=>{ if(start) startStage(si); else { closeOv(); S.mode='play'; } };
  $('#bGo').onclick=()=>{ if(S.auto) return; go(); }; wait(S.auto?1.6:0,go); if(!S.auto) S.after=null;
}
function showZukan(){
  const all=Object.keys(TS); const n=all.filter(id=>SV.seen[id]).length;
  let h='<div class="tag">ZUKAN</div><h3>📖 ツボずかん <small style="font-size:13px">'+n+' / '+all.length+'</small></h3><div class="zk">';
  all.forEach(id=>{ const t=TS[id]; h+=SV.seen[id]?'<div>'+t.n+'<br><small>'+t.r+'・'+t.fx+'</small></div>':'<div class="lock">？？？<br><small>レッスンや 施術で 見つけよう</small></div>'; });
  h+='</div><div class="row"><button class="big" id="bZc">とじる</button></div>'; openOv(h); $('#bZc').onclick=()=>{ if(S.mode==='title') closeOv(); else closeOv(); };
}
function showEnding(){
  S.mode='ending'; const tot=SV.best.reduce((a,c)=>a+(c||0),0);
  openOv('<div class="tag">EPILOGUE</div><div style="font-size:70px;text-align:center;line-height:1.2">🏯</div><h3>免許皆伝</h3><div class="master"><div class="face">👴</div><div class="t"><small>師範マサ</small>殺法も 活法も、ツボを 知らねば 使えぬ。だが おぬしの手は、人を すくう手じゃ。マサ新影流 活殺法、免許皆伝！</div></div><p style="text-align:center;font-size:30px;font-weight:800;color:#C8402A;margin:4px 0">活殺自在</p><p style="text-align:center">ベスト合計 '+tot.toLocaleString('ja-JP')+'点</p><div class="row"><button class="big" id="bAg">もういちど</button><button class="big sub" id="bTi">タイトル</button></div>');
  $('#bAg').onclick=()=>{ if(!S.auto) startNew(); }; $('#bTi').onclick=toTitle; wait(S.auto?3:0,startNew); if(!S.auto) S.after=null;
}
function toTitle(){ S.mode='title'; closeOv(); $('#title').hidden=false; $('#bCont').hidden=SV.unlocked<=1; buildSel(); const b=SV.best.reduce((a,c)=>a+(c||0),0); $('#tbest').textContent=b?'ベスト合計 '+b.toLocaleString('ja-JP')+'点':''; }
function buildSel(){ const s=$('#sel'); if(SV.unlocked<=1){ s.hidden=true; return; } s.hidden=false; s.innerHTML=''; for(let i=0;i<5;i++){ const b=document.createElement('button'); b.textContent=i+1; b.disabled=i>=SV.unlocked; b.onclick=()=>showLesson(i,true); s.appendChild(b); } }
function setAuto(on){ S.auto=on; $('#bAuto').setAttribute('aria-pressed',on?'true':'false'); $('#spd').style.display=on?'block':'none'; if(on){ if(S.mode==='title') startNew(); else if(S.mode!=='play'&&S.after==null&&!ov.hidden){ S.wait=1.0; } } }

/* ================= update ================= */
function update(dt){
  P.tick(dt);
  for(const f of S.fxl) f.t-=dt; S.fxl=S.fxl.filter(f=>{ if(f.t<=0){ f.el.remove(); return false; } return true; });
  if(S.fbT>0){ S.fbT-=dt; if(S.fbT<=0) $('#fb').classList.remove('on'); }
  if(S.hint){ S.hint.t-=dt; if(S.hint.t<=0){ S.hint=null; refreshHint(); } }
  if(S.after&&S.wait>0&&S.auto){ S.wait-=dt; if(S.wait<=0){ const f=S.after; S.after=null; f(); } }
  if(S.mode!=='play'||!S.cust) return;
  const c=S.cust;
  if(c.sayT>0){ c.sayT-=dt; if(c.sayT<=0&&!c.leaving) $('#cSay').textContent='「'+S.queue[S.custI].say+'」'; }
  if(c.leaving>0){ c.leaving-=dt; if(c.leaving<=0){ S.custI++; nextCustomer(); } return; }
  c.pat-=dt; if(Math.floor(c.pat*4)!==c.pq){ c.pq=Math.floor(c.pat*4); $('#pat i').style.width=Math.round(100*Math.max(0,c.pat)/c.max)+'%'; }
  if(c.pat<=0){ patienceOut(); return; }
  if(S.auto) aiStep(dt);
}

/* ================= auto (perfect, fast) ================= */
function aiStep(dt){
  const A=S.A, c=S.cust; A.t-=dt; if(A.t>0) return;
  const rem=c.sy.ts.filter(id=>!c.got.has(id)); if(!rem.length) return;
  // pick the view (region+side) that still holds the most needed points, preferring the current one
  const groups={}; for(const id of rem){ const t=TS[id], k=t.reg+'|'+t.s; (groups[k]=groups[k]||[]).push(id); }
  const cur=S.region+'|'+S.side; let bk=null;
  for(const k in groups){ if(!bk||groups[k].length>groups[bk].length||(groups[k].length===groups[bk].length&&k===cur)) bk=k; }
  const id=groups[bk][0], t=TS[id];
  if(S.region!==t.reg||S.side!==t.s){ selectRegion(t.reg,t.s); A.t=0.14; return; }
  press(t.p[0][0],t.p[0][1],9); A.t=0.15;
}

/* ================= input ================= */
const stg=$('#stage');
$('#body').addEventListener('pointerdown',e=>{
  if(S.mode!=='play') return; e.preventDefault(); AC(); if(S.auto) setAuto(false);
  const q=P.toSvg(e.clientX,e.clientY); if(!q) return; press(q.x,q.y,clamp(26/q.scale,6,14));
});
document.querySelectorAll('#regs button').forEach(b=>b.addEventListener('click',()=>{ if(S.mode!=='play') return; AC(); if(S.auto) setAuto(false); SFX.click(); selectRegion(b.dataset.r); }));
$('#flip').addEventListener('click',()=>{ if(S.mode!=='play') return; if(S.auto) setAuto(false); SFX.click(); flip(); });
$('#bHint').addEventListener('click',()=>{ if(S.auto) setAuto(false); useHint(); });
$('#bBook').addEventListener('click',()=>{ if(S.mode!=='play'||!S.cust) return; if(S.auto) setAuto(false); const sy=S.cust.sy; S.mode='lesson'; let h='<div class="tag">おさらい</div>'+lessonCards(sy)+'<div class="row"><button class="big" id="bBk">もどる</button></div>'; openOv(h); mountLesson(sy); $('#bBk').onclick=()=>{ closeOv(); S.mode='play'; }; });
addEventListener('keydown',e=>{
  const k=e.key; if(e.repeat) return;
  if(k==='o'||k==='O'){ setAuto(!S.auto); return; }
  if(S.mode!=='play') return;
  if(k>='1'&&k<='6'){ if(S.auto) setAuto(false); selectRegion(['head','arm','shoulder','belly','waist','leg'][+k-1]); }
  else if(k==='f'||k==='F'){ if(S.auto) setAuto(false); flip(); }
  else if(k==='h'||k==='H'){ if(S.auto) setAuto(false); useHint(); }
});
$('#bAuto').addEventListener('click',()=>{ AC(); setAuto(!S.auto); });
$('#bSnd').addEventListener('click',()=>{ soundOn=!soundOn; $('#bSnd').setAttribute('aria-pressed',soundOn); $('#bSnd').textContent=soundOn?'🔊':'🔇'; try{ localStorage.setItem('tsubo_snd',soundOn?'1':'0'); }catch(_){} if(soundOn) AC(); });
$('#bSnd').setAttribute('aria-pressed',soundOn); $('#bSnd').textContent=soundOn?'🔊':'🔇';
$('#bNew').addEventListener('click',()=>{ AC(); startNew(); });
$('#bCont').addEventListener('click',()=>{ AC(); showLesson(clamp(SV.unlocked-1,0,4),true); });
$('#bZk').addEventListener('click',()=>{ AC(); showZukan(); });

/* ================= loop & hooks ================= */
function runFor(sec){ let r=sec; while(r>1e-9){ const d=Math.min(1/60,r); update(d); r-=d; } }
let last=0;
function frame(ts){ const dt=Math.min(0.05,(ts-last)/1000||0); last=ts; runFor(dt*(S.auto?1.5:1)); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// title picture
{ const t=makeSvg($('#tsv'),'f',[30,4,180,126]); t.go([30,4,180,126],true); [['seimei',0],['taiyo',3],['jinchu',4],['gokoku',1]].forEach(([id,c])=>{ const tt=TS[id]; tt.p.forEach(p=>{ if(p[1]<140||id==='gokoku'){ t.mark(p[0],p[1],5,COLS[c]); t.mark(p[0],p[1],8,COLS[c],'hintring'); } }); }); }
toTitle(); labels();
window.__tsubo={S,SV,TS,SY,STAGES,P,step:(dt,n=1)=>{ for(let i=0;i<n;i++) runFor(dt); },setAuto,startStage,showLesson,startNew,press,selectRegion,flip,toTitle,
  state:()=>({mode:S.mode,si:S.si,score:S.score,combo:S.combo,maxCombo:S.maxCombo,right:S.right,wrong:S.wrong,cust:S.custI,got:S.cust?S.cust.got.size:0,pat:S.cust?+S.cust.pat.toFixed(1):0,region:S.region,side:S.side,auto:S.auto,res:S.res})};
})();
</script>

<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
