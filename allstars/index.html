<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="ゆきの里のゲームが、ぜんぶひとつに！ 5〜8秒のミニゲームを次々にクリアするオールスター・マラソン。">
<title>ゆきの里オールスターズ</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
html,body{touch-action:manipulation}
:root{--bg:#0F1226;--ink:#F4F1FF;--card:#1C2040;--line:#3A4080;--mute:#9BA3D8;--gold:#FFD44D;--red:#FF5A6E;--green:#4CD98A;--blue:#5AB4FF;--u:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans CJK JP",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
header{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;max-width:760px;margin:0 auto}
header a{color:var(--mute);text-decoration:none;font-weight:800;font-size:14px;padding:8px 6px;white-space:nowrap}
header h1{flex:1;margin:0;font-size:15px;text-align:center;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-weight:800;font-size:13px;padding:6px 10px;cursor:pointer;white-space:nowrap}
header button[aria-pressed=true]{background:var(--gold);color:#241C00;border-color:var(--gold)}
#wrap{display:flex;justify-content:center;align-items:center;height:calc(100dvh - 50px)}
#stage{position:relative;width:min(100vw,calc((100dvh - 50px) * 390 / 560));aspect-ratio:390/560;background:#000;border-radius:10px;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(10*var(--u));padding:calc(14*var(--u));text-align:center;overflow-y:auto}
#ov:empty{display:none}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov.dim{background:rgba(8,10,28,.78)}
.logo{font-size:calc(34*var(--u));font-weight:900;line-height:1.15;color:var(--gold);text-shadow:0 calc(3*var(--u)) 0 #7A4A00,0 0 calc(18*var(--u)) rgba(255,212,77,.5)}
.sub{font-size:calc(13*var(--u));color:var(--mute);line-height:1.5}
.btn{width:100%;max-width:calc(300*var(--u));border:0;border-radius:calc(16*var(--u));padding:calc(12*var(--u)) calc(10*var(--u));font-size:calc(17*var(--u));font-weight:900;color:#fff;background:#4B56C8;box-shadow:0 calc(4*var(--u)) 0 #2A3080;cursor:pointer;font-family:inherit}
.btn small{display:block;font-size:calc(11*var(--u));font-weight:600;opacity:.85;margin-top:calc(2*var(--u))}
.btn.g{background:#E0A020;box-shadow:0 calc(4*var(--u)) 0 #8A5A00;color:#2A1A00}
.btn.p{background:#C14FA0;box-shadow:0 calc(4*var(--u)) 0 #702060}
.btn.s{background:#2A3068;box-shadow:0 calc(3*var(--u)) 0 #161A40;font-size:calc(14*var(--u))}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translateY(calc(2*var(--u)))}
.ttl{font-size:calc(22*var(--u));font-weight:900;color:var(--gold)}
.map{width:100%;max-width:calc(330*var(--u));display:flex;flex-direction:column;gap:calc(6*var(--u))}
.node{display:flex;align-items:center;gap:calc(10*var(--u));text-align:left;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:calc(14*var(--u));padding:calc(7*var(--u)) calc(10*var(--u));font-family:inherit;cursor:pointer}
.node .ic{font-size:calc(26*var(--u));width:calc(34*var(--u));text-align:center}
.node b{display:block;font-size:calc(14*var(--u))}
.node span.d{font-size:calc(10.5*var(--u));color:var(--mute)}
.node.done{border-color:var(--green);background:#16352A}
.node.lock{opacity:.5;cursor:default}
.node.now{border-color:var(--gold);box-shadow:0 0 calc(14*var(--u)) rgba(255,212,77,.5)}
.story{font-size:calc(18*var(--u));font-weight:800;line-height:1.7;max-width:calc(320*var(--u));min-height:calc(160*var(--u));display:flex;align-items:center;justify-content:center;white-space:pre-line;animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.zk{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(6*var(--u));width:100%;max-width:calc(350*var(--u))}
.zk button{border:2px solid var(--line);background:var(--card);border-radius:calc(12*var(--u));padding:calc(6*var(--u)) calc(2*var(--u));color:var(--ink);font-family:inherit;cursor:pointer;font-size:calc(10*var(--u));line-height:1.25;min-height:calc(62*var(--u))}
.zk button i{display:block;font-style:normal;font-size:calc(24*var(--u))}
.zk button.cl{border-color:var(--green);background:#16352A}
.zk button.sil i{filter:grayscale(1) brightness(0);opacity:.55}
.zk button.sil{color:var(--mute)}
.zk button.bs{grid-column:span 2}
.row{display:flex;gap:calc(6*var(--u));align-items:center;justify-content:center;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:calc(4*var(--u)) calc(10*var(--u));font-size:calc(12*var(--u));font-weight:800;cursor:pointer;font-family:inherit}
.chip.on{background:var(--gold);color:#241C00;border-color:var(--gold)}
.big{font-size:calc(44*var(--u));font-weight:900}
</style>
</head>
<body>
<header>
  <a href="../" id="back">← 一覧</a>
  <h1>❄ ゆきの里オールスターズ</h1>
  <button id="autoBtn" aria-pressed="false" title="オートモード（Oキー）">🤖 オート</button>
  <button id="sndBtn" aria-pressed="true" title="音のON/OFF">🔊</button>
</header>
<div id="wrap"><div id="stage"><canvas id="cv" width="780" height="1120"></canvas><div id="ov"></div></div></div>
<script>
(()=>{
'use strict';
/* =====================================================================
 * ゆきの里オールスターズ  ― メニューのゲームが全部ミニゲームになって1つに！
 *
 * 【マイクロゲームの追加方法】  ← 次のフェーズの人はここを読む
 *  1. 「マイクロゲームの登録」ゾーンの末尾（// ==== MG:ここに追加 ==== の上）に MG.push({...}) を足す。
 *       MG.push({
 *         id:'kazumike',          // 元ゲームのフォルダ名（ずかんの「元のゲームであそぶ」が ../<id>/ になる）
 *         zone:'action',          // ZONES の id（dyson/action/skill/puzzle/adv/sim/music/pc）
 *         name:'かずおとみけ',    // 左下に「元ネタ：…」と出る名前
 *         icon:'🐱',              // ずかん用の絵文字
 *         instr:'とべ！',         // 開始時に画面いっぱいに出る一言（動詞＋！、5文字ぐらいまで）
 *         hint:'タップでジャンプ', // 開始時の小さな説明
 *         dur:7,                  // 制限時間（ゲーム内の秒。speed が上がると実時間は短くなる）
 *         timeout:'win',          // 時間切れの結果。'win'＝生き延びたら勝ち／省略＝'lose'（時間内に達成が必要）
 *         lr:true,                // 省略可。true なら ←/→ キーが「左右タップ」にもなる
 *         cur:[195,340],          // 省略可。カーソルの初期位置
 *         boss:true, ...          // ゾーンボス用（ZONES[].boss にその id を書く。エンドレス等には出ない）
 *         make(lv){               // lv=0..3（むずかしさ）。インスタンスを返す
 *           const s={res:null};   // s.res='win'|'lose' を入れたらすぐ終了
 *           s.update=(dt,I)=>{};  // dt=ゲーム秒（speed 倍済み）、I=入力
 *           s.draw=()=>{};        // g（canvas 2D, 論理 390x560）に描く。TOP〜BOT が遊べる範囲
 *           s.auto=I=>{};         // オート：I を書きかえて「完璧に」遊ぶ（update の直前に毎フレーム呼ばれる）
 *           return s; }
 *       });
 *  2. 入力 I は共通：I.x,I.y＝カーソル（指／マウス／矢印キー）、I.down＝押している（指／クリック／スペース）、
 *     I.tap＝このフレームに押した瞬間。auto は I.x,I.y,I.down,I.tap を直接セットすればよい。
 *  3. 描画ヘルパー：em(絵文字,x,y,サイズ) tx(文字,x,y,サイズ,色,align) circ() rect() bar() bgFill(c1,c2)
 *     乱数 rr(a,b) ri(a,b) pick(arr) clamp dist  効果音 sfx('pop'|'hit'|'ok'|'ng'|'tick')
 *  4. zone の MG が1つでもあれば、そのゾーンはマップで自動的に解放対象になる。ボスは MG に boss:true で登録し
 *     ZONES の該当ゾーンの boss に id を書く。ほかは自動（ずかん・エンドレス・大決戦・記録に自動で入る）。
 *  5. 確認：__allstars.playMG('id',lv) / __allstars.list() / テストは auto で lv0 と lv3 を勝たせる。
 * ===================================================================== */

// ---------- 基本ヘルパー ----------
const W=390,H=560,TOP=74,BOT=536;
const cv=document.getElementById('cv'), g=cv.getContext('2d'); g.scale(2,2);
const ov=document.getElementById('ov'), stage=document.getElementById('stage');
const rr=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const FONT='"Hiragino Sans","Yu Gothic","Noto Sans CJK JP",system-ui,sans-serif';
const EMF='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
function em(ch,x,y,s,rot){g.font=s+'px '+EMF;g.textAlign='center';g.textBaseline='middle';if(rot){g.save();g.translate(x,y);g.rotate(rot);g.fillText(ch,0,0);g.restore()}else g.fillText(ch,x,y)}
function tx(s,x,y,size,col,al,stroke){g.font='900 '+size+'px '+FONT;g.textAlign=al||'center';g.textBaseline='middle';if(stroke){g.lineWidth=Math.max(3,size/7);g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function circ(x,y,r,fill,stroke,lw){g.beginPath();g.arc(x,y,Math.max(0,r),0,6.2832);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke()}}
function rect(x,y,w,h,fill,rad,stroke){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,rad||0);else g.rect(x,y,w,h);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=2;g.strokeStyle=stroke;g.stroke()}}
function bar(x,y,w,h,v,col,bg){rect(x,y,w,h,bg||'rgba(0,0,0,.45)',h/2);if(v>0)rect(x,y,Math.max(h,w*clamp(v,0,1)),h,col,h/2)}
function bgFill(c1,c2){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,c1);gr.addColorStop(1,c2||c1);g.fillStyle=gr;g.fillRect(0,0,W,H)}

// ---------- 保存 ----------
const SAVE_KEY='allstars.v1';
const SV={zones:{},endless:0,cleared:{},gaunt:0,seen:false};
try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');for(const k in o)SV[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SV))}catch(e){}}
let sndOn=true; try{sndOn=localStorage.getItem('allstars.snd')!=='0'}catch(e){}

// ---------- 音（WebAudio 合成） ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type,vol,when,slide){if(!sndOn)return;const a=ac();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);gn.gain.setValueAtTime(vol||.06,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
  pop:()=>tone(880,.08,'triangle',.07,0,1500), hit:()=>tone(220,.12,'sawtooth',.06,0,90), tick:()=>tone(1200,.03,'square',.03),
  ok:()=>tone(1000,.1,'triangle',.07,0,1400), ng:()=>tone(200,.18,'square',.06,0,80),
  start:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,i*.07)),
  win:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.13,'triangle',.08,i*.08)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.2,'sawtooth',.06,i*.12)),
  speed:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.09,'square',.05,i*.06)),
  fan:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.14,'triangle',.08,i*.1))
};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}

// ---------- 入力（カーソル＋タップ＋ホールド に共通化） ----------
const HI={x:195,y:340,ptr:false,key:false,latch:false,pend:false,kx:0,ky:0,lrTap:0};
const KEYS={};
function toLogical(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{ac();manual();const [x,y]=toLogical(e);HI.x=x;HI.y=y;HI.ptr=true;HI.latch=true;HI.pend=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(HI.ptr||e.pointerType==='mouse'){const [x,y]=toLogical(e);HI.x=x;HI.y=y}});
const pup=e=>{HI.ptr=false};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')HI.ptr=false});
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='o'||k==='O'){setAuto(!autoOn);e.preventDefault();return}
  if(e.repeat&&(k===' '||k.startsWith('Arrow')))return e.preventDefault();
  ac();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)){manual();e.preventDefault()}
  if(k===' '){HI.key=true;HI.latch=true;HI.pend=true}
  if(k==='ArrowLeft'){HI.kx=-1;HI.lrTap=-1}
  if(k==='ArrowRight'){HI.kx=1;HI.lrTap=1}
  if(k==='ArrowUp')HI.ky=-1;
  if(k==='ArrowDown')HI.ky=1;
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k===' ')HI.key=false;
  if((k==='ArrowLeft'&&HI.kx<0)||(k==='ArrowRight'&&HI.kx>0))HI.kx=0;
  if((k==='ArrowUp'&&HI.ky<0)||(k==='ArrowDown'&&HI.ky>0))HI.ky=0;
});
addEventListener('blur',()=>{HI.ptr=HI.key=false;HI.kx=HI.ky=0});
const AI={x:195,y:340,down:false,tap:false};   // オートが書き込む入力
const II={x:195,y:340,down:false,tap:false};   // ミニゲームに渡す入力

// ---------- 状態 ----------
const MG=[];                       // ← マイクロゲームの登録先
const ZONES=[
  {id:'dyson', name:'マネーダイソン島',   icon:'🌀', boss:'boss_dyson',  intro:['マネーダイソン島。\n吸い取り男・前田大存の縄張りだ。','お金を吸え！ 寿命も吸え！\nでも、本物の吸引対決は一筋縄じゃいかない…！'], clear:'島のダイソンたちは落ち着いた。\n雪の結晶のかけらを1つ手に入れた！'},
  {id:'action',name:'アクション山',       icon:'⛰️', boss:'boss_action', intro:['アクション山。\n一男とみけ、除霊師、ヒーロー…\n荒くれ者がひしめく山だ。','山の主「面白の物」が待っている。\n反射神経で登りきれ！'], clear:'面白の物は笑いながら消えた。\n2つ目のかけらをゲット！'},
  {id:'skill', name:'うでだめし道場',     icon:'🥋', boss:null, intro:['うでだめし道場。\n反射神経と集中力の道場だ。'], clear:'道場を制覇した！'},
  {id:'puzzle',name:'パズル塔',           icon:'🧩', boss:null, intro:['パズル塔。\n頭をひねって登ろう。'], clear:'塔のてっぺんに着いた！'},
  {id:'adv',   name:'推理アドベンチャー館',icon:'🕵️', boss:null, intro:['推理アドベンチャー館。\n名探偵の出番だ。'], clear:'事件はぜんぶ解決した！'},
  {id:'sim',   name:'シミュレーション村', icon:'🏘️', boss:null, intro:['シミュレーション村。\nのんびり…と思いきや？'], clear:'村が大にぎわいになった！'},
  {id:'music', name:'おんがく堂',         icon:'🎵', boss:null, intro:['おんがく堂。\nリズムにのってクリアしよう。'], clear:'最高のライブだった！'},
  {id:'pc',    name:'パソコン洞窟',       icon:'💻', boss:null, intro:['パソコン洞窟。\nいちばん奥にいるのは…？'], clear:'洞窟の奥までたどり着いた！'}
];
const OPENING=[
  '雪がしんしんと降る夜、\nゆきの里に大きな雪の結晶が落ちた。',
  'パリーン！\n結晶がくだけて、ゲームの世界が\nぜんぶ混ざってしまった！',
  '吸い取り男・前田大存は焼き芋ゾーンで迷子。\n一男とみけは、だんじりを曳かされ、\n除霊師・当田茂は野球場で肩ぶつかり…。',
  '元にもどすには、各地のミニゲームを\nクリアして「結晶のかけら」を集めるしかない！\n\nさあ、旅に出よう！'
];
let scene='title';        // title | map | story | zukan | run | end
let autoOn=false, R=null, STORY=null, ENDINFO=null, pracLv=0, T=0;
const mgById=id=>MG.find(m=>m.id===id);
const zoneMGs=z=>MG.filter(m=>m.zone===z.id&&!m.boss);
const zoneHas=z=>zoneMGs(z).length>0;
const zoneDone=z=>!!SV.zones[z.id];
const zoneOpen=(i)=>zoneHas(ZONES[i])&&(i===0||zoneDone(ZONES[i-1])||UNLOCK_ALL);
let UNLOCK_ALL=false;
const finaleOpen=()=>UNLOCK_ALL||(ZONES.filter(zoneHas).length>0&&ZONES.filter(zoneHas).every(zoneDone));
const normalMGs=()=>MG.filter(m=>!m.boss);

// ---------- オート切りかえ ----------
const autoBtn=document.getElementById('autoBtn'), sndBtn=document.getElementById('sndBtn');
function setAuto(v){autoOn=!!v;autoBtn.setAttribute('aria-pressed',autoOn?'true':'false');autoWait=0;if(autoOn)ac()}
function manual(){if(autoOn)setAuto(false)}
autoBtn.addEventListener('click',e=>{setAuto(!autoOn);autoBtn.blur()});
function syncSnd(){sndBtn.textContent=sndOn?'🔊':'🔇';sndBtn.setAttribute('aria-pressed',sndOn?'true':'false')}
sndBtn.addEventListener('click',()=>{sndOn=!sndOn;try{localStorage.setItem('allstars.snd',sndOn?'1':'0')}catch(e){}syncSnd();if(sndOn){ac();sfx('ok')}sndBtn.blur()});
syncSnd();
document.getElementById('back').addEventListener('click',e=>{if(scene==='run'||scene==='story'){/* 戻る前にタイトルへ。もう一度で一覧へ */ if(!backArmed){e.preventDefault();backArmed=true;setTimeout(()=>backArmed=false,2500);toast('もう一度「← 一覧」で一覧にもどります');R=null;goTitle()}}});
let backArmed=false;
function toast(s){const d=document.createElement('div');d.textContent=s;d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;font:700 14px '+FONT+';padding:10px 16px;border-radius:14px;z-index:99999;pointer-events:none';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

// ---------- 画面（DOM オーバーレイ） ----------
function setOv(html,dim){ov.innerHTML=html;ov.className=dim?'dim':'';ov.scrollTop=0}
function goTitle(){
  scene='title';R=null;
  const nCl=Object.keys(SV.cleared).filter(id=>mgById(id)).length;
  setOv(`<div class="logo">❄ ゆきの里<br>オールスターズ ❄</div>
  <div class="sub">ゆきの里のゲームが、ぜんぶひとつに！<br>5〜8秒のミニゲームを次々クリア</div>
  <button class="btn g" data-a="story">ストーリー（すごろくの旅）<small>${ZONES.filter(zoneDone).length}/${ZONES.length} ゾーン クリア</small></button>

// ---------- ラン（ミニゲームの連続プレイ） ----------
function newRun(mode,o){return Object.assign({mode,lives:4,maxLives:4,score:0,clears:0,sp:1,phase:'',t:0,inst:null,cur:null,res:null,speedMsg:0,t0:performance.now(),elapsed:0,rt:0,over:false},o)}
function startEndless(){R=newRun('endless',{last:null});beginNext()}
function startPractice(id){const m=mgById(id);if(!m)return;R=newRun('practice',{fixed:m,lives:99,maxLives:99});beginSpec({mg:m,lv:pracLv,sp:1})}
function startZone(i){
  const z=ZONES[i];if(!zoneHas(z))return;
  const run=()=>{R=newRun('story',{zi:i,list:shuffle(zoneMGs(z).map(m=>m.id)).slice(0,8),i:0,bossDone:!z.boss||!mgById(z.boss)});beginNext()};
  if(!SV.seen&&i===0){showStory(OPENING.concat(z.intro),()=>{SV.seen=true;save();run()})}else showStory(z.intro,run);
}
function startFinale(){
  const ids=shuffle(normalMGs().map(m=>m.id));
  R=newRun('finale',{list:ids,i:0,bossLeft:5,bossN:5});beginNext();
}
function retryRun(){
  if(!R)return goTitle();
  const m=R.mode;
  if(m==='endless')startEndless();else if(m==='story')startZone(R.zi);else if(m==='finale')startFinale();else goTitle();
}
function nextSpec(){
  const r=R;
  if(r.mode==='endless'){
    const pool=normalMGs().filter(m=>m!==r.last);const m=pick(pool.length?pool:normalMGs());r.last=m;
    return {mg:m,lv:Math.min(3,Math.floor(r.clears/8)),sp:r.sp};
  }
  if(r.mode==='story'){
    if(r.i<r.list.length)return {mg:mgById(r.list[r.i]),lv:Math.min(3,Math.floor(r.i*4/r.list.length)),sp:1+.05*r.i};
    if(!r.bossDone)return {mg:mgById(ZONES[r.zi].boss),lv:1+(r.zi>=2?1:0),sp:1,boss:true};
    return null;
  }
  if(r.mode==='finale'){
    if(r.i<r.list.length)return {mg:mgById(r.list[r.i]),lv:2+(r.i%2),sp:Math.min(2.2,1.4+.04*r.i)};
    if(r.bossLeft>0){const m=pick(normalMGs());return {mg:m,lv:3,sp:2.3,boss:true,fb:true}}

  }

}
function beginNext(){const s=nextSpec();if(!s)return endRun('clear');beginSpec(s)}
function beginSpec(s){

  R.inst=s.mg.make(s.lv);

}
function endRun(kind){
  scene='end';R.elapsed=R.rt;

    else{html=`<div class="big">💤</div><div class="ttl">ざんねん… ライフが0</div><div class="sub">スコア ${R.score}</div><button class="btn g" data-a="retry">もういちど ${z.name}</button><button class="btn s" data-a="map">マップにもどる</button>`}

    else html=`<div class="big">💤</div><div class="ttl">大ボスにやぶれた…</div><div class="sub">スコア ${R.score}</div><button class="btn g" data-a="retry">もういちど</button><button class="btn s" data-a="title">タイトルへ</button>`;
  }else{

function afterResult(){
  const r=R,s=r.cur,win=r.res==='win';
  if(r.mode==='practice'){goZukan();return}
  if(win){
    r.clears++;r.score+=Math.round(100*r.sp)+(s.boss?300:0);
    if(r.mode==='endless'){if(r.clears%5===0){r.sp=Math.min(2.4,+(r.sp+.12).toFixed(2));r.speedMsg=1}else r.speedMsg=0;if(r.score>SV.endless)SV.endless=r.score}
  }else{r.lives--;r.speedMsg=0}
  if(r.lives<=0){save();return endRun('over')}
  if(r.mode==='story'){if(r.i<r.list.length)r.i++;else if(win)r.bossDone=true}
  if(r.mode==='finale'){if(r.i<r.list.length)r.i++;else if(win)r.bossLeft--}

function finishMG(res){

  if(res==='win'){SV.cleared[R.cur.mg.id]=true;save();sfx('win')}else sfx('lose');
}

// ---------- 毎フレーム ----------
let autoWait=0;
function runStep(dt){
  const r=R;if(!r||scene!=='run')return;
  r.t+=dt;r.rt+=dt;
  if(r.phase==='intro'){if(r.t>=r.introDur){r.phase='play';r.t=0;r.tm=0;r.hold=false}return}
  if(r.phase==='result'){if(r.t>=r.resDur)afterResult();return}
  // play
  const m=r.cur.mg,inst=r.inst,sp=r.sp;
  const step=1/60;let rest=dt;
  while(rest>1e-6&&r.phase==='play'){
    const d=Math.min(step,rest);rest-=d;
    // 入力をそろえる
    if(autoOn){AI.tap=false;inst.auto(AI);II.x=AI.x;II.y=AI.y;II.down=AI.down;II.tap=AI.tap;}
    else{
      const sp2=320*d;if(HI.kx||HI.ky){HI.x=clamp(HI.x+HI.kx*sp2,0,W);HI.y=clamp(HI.y+HI.ky*sp2,0,H)}
      II.x=HI.x;II.y=HI.y;II.down=HI.ptr||HI.key||HI.latch;II.tap=HI.pend;
      if(HI.lrTap&&m.lr){II.tap=true;II.x=HI.lrTap<0?60:330}
      HI.latch=false;HI.pend=false;HI.lrTap=0;
    }
    const gd=d*sp;r.tm+=gd;
    inst.update(gd,II);
    if(!inst.res&&r.tm>=m.dur)inst.res=m.timeout||'lose';
    if(inst.res){finishMG(inst.res);break}
  }
}
function autoDir(dt){
  autoWait+=dt;
  if(scene==='title'){if(autoWait>.5){const nextZ=ZONES.findIndex((z,i)=>zoneOpen(i)&&!zoneDone(z));if(nextZ>=0)goMap();else startEndless()}}
  else if(scene==='map'){if(autoWait>.25){const i=ZONES.findIndex((z,i)=>zoneOpen(i)&&!zoneDone(z));if(i>=0)startZone(i);else if(finaleOpen()&&!SV.gaunt)startFinale();else startEndless()}}
  else if(scene==='story'){if(autoWait>.25){autoWait=0;storyNext()}}
  else if(scene==='zukan'){if(autoWait>.4)goTitle()}
  else if(scene==='end'){if(autoWait>.7){if(R.mode==='story'&&SV.zones[ZONES[R.zi].id])goMap();else if(R.mode==='finale'&&R.bossLeft<=0)startEndless();else retryRun()}}
}

const snow=Array.from({length:40},()=>({x:rr(0,W),y:rr(0,H),v:rr(15,50),s:rr(1,3)}));

function drawRun(){

  tx(label,W/2,18,12,'#9BA3D8');

    g.fillStyle='rgba(8,10,30,'+(.55*(1-Math.max(0,(u-.8)/.2)))+')';g.fillRect(0,TOP-10,W,H);
    g.save();g.translate(W/2,H/2-10);g.scale(sc,sc);g.globalAlpha=clamp(pop*1.6,0,1)*(1-Math.max(0,(u-.85)/.15));
    const wd=m.instr.length;const fs=clamp(300/wd,40,84);
    tx(m.instr,0,0,fs,'#FFE45C',null,'#5A2A00');
    if(r.cur.boss&&!r.cur.fb)tx('👑 ゾーンボス 👑',0,-fs*.9,22,'#FF8FA0');

    const pop=Math.min(1,r.t/.18);g.save();g.translate(W/2,H/2);g.scale(.5+pop*.5,.5+pop*.5);
    tx(win?'クリア！':'ざんねん…',0,0,win?58:50,win?'#7CFFB0':'#FF8FA0',null,'#001');

const mv=(o,dt,x0,x1,y0,y1)=>{o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<x0||o.x>x1){o.vx*=-1;o.x=clamp(o.x,x0,x1)}if(o.y<y0||o.y>y1){o.vy*=-1;o.y=clamp(o.y,y0,y1)}};
const rv=s=>{const a=rr(0,6.283);return [Math.cos(a)*s,Math.sin(a)*s]};

MG.push({id:'dyson',zone:'dyson',icon:'🌀',name:'マネーダイソン',instr:'吸え！',hint:'おしたままドラッグで お金を吸い取れ！',dur:7,
make(lv){
  const s={res:null},bills=[],pol=[],sp=45+22*lv;
  for(let i=0;i<4+lv;i++){const [vx,vy]=rv(sp);bills.push({x:rr(40,350),y:rr(120,480),vx,vy,got:0,e:pick(['💴','💵','💶','💷'])})}
  for(let i=0;i<Math.max(0,lv-1);i++){const [vx,vy]=rv(75);pol.push({x:rr(40,350),y:rr(300,480),vx,vy})}
  let cx=195,cy=330,dn=false,fx=[];
  s.update=(dt,I)=>{cx=I.x;cy=I.y;dn=I.down;bills.forEach(b=>{if(b.got)return;mv(b,dt,30,360,TOP+30,BOT-30)});pol.forEach(p=>mv(p,dt,30,360,TOP+30,BOT-30));
    if(dn){for(const b of bills)if(!b.got&&dist(b,I)<40){b.got=1;fx.push({x:b.x,y:b.y,t:0});sfx('pop')}for(const p of pol)if(dist(p,I)<28)s.res='lose'}
    fx.forEach(f=>f.t+=dt);if(!s.res&&bills.every(b=>b.got))s.res='win'};
  s.draw=()=>{bgFill('#2B2540','#14101E');
    bills.forEach(b=>{if(!b.got)em(b.e,b.x,b.y,34);});pol.forEach(p=>em('🚔',p.x,p.y,36));
    fx.forEach(f=>{circ(f.x,f.y,10+f.t*120,null,'rgba(255,255,255,'+Math.max(0,.8-f.t*2)+')',3)});
    circ(cx,cy,dn?42:26,dn?'rgba(138,90,224,.35)':'rgba(255,255,255,.1)','#B48CFF',3);em('🌀',cx,cy,dn?44:30);};
  s.auto=I=>{I.down=false;const t=bills.filter(b=>!b.got&&pol.every(p=>dist(p,b)>46))[0];if(t){I.x=t.x;I.y=t.y;I.down=true}};
  return s;}});

MG.push({id:'dyson2',zone:'dyson',icon:'⏳',name:'マネーダイソン2',instr:'ねらえ！',hint:'ゲージが 緑のところで タップ！',dur:7,
make(lv){
  const s={res:null},need=lv>=2?3:2,spd=1.0+.4*lv,w=.2-.03*lv;let u=0,d=1,c=.55,hits=0,flash=0,age=0;
  const newC=()=>{let n;do{n=rr(.15,.85)}while(Math.abs(n-c)<.3);c=n};
  s.update=(dt,I)=>{u+=d*spd*dt;if(u>1){u=1;d=-1}if(u<0){u=0;d=1}flash=Math.max(0,flash-dt);
    if(I.tap){if(Math.abs(u-c)<=w/2){hits++;flash=.3;sfx('ok');newC();if(hits>=need)s.res='win'}else{s.res='lose'}}};
  s.draw=()=>{bgFill('#3A2A18','#1A1008');const ages=['🧑','🧓','👴','👵'];
    em(ages[Math.min(hits,3)],195,230,110);em('⏳',195+Math.sin(T*3)*3,360,0+34);
    for(let i=0;i<need;i++)em(i<hits?'⏳':'⌛',140+i*55,128,30);

  s.draw=()=>{bgFill('#2A5A2A','#103010');
    for(let r=0;r<8;r++)for(let c=0;c<7;c++){rect(X0+c*C+1,Y0+r*C+1,C-2,C-2,pillar(r,c)?'#778':'#3A8A3A',4);}
    fx.forEach(f=>{if(f.t<.35)f.cs.forEach(([r,c])=>rect(X0+c*C+3,Y0+r*C+3,C-6,C-6,'rgba(255,170,40,'+(.9-f.t*2.4)+')',8))});
    bombs.forEach(b=>{if(!b.done){em('💣',X0+b.c*C+C/2,Y0+b.r*C+C/2,40+Math.sin(T*30)*2);tx(b.t.toFixed(1),X0+b.c*C+C/2,Y0+b.r*C+C/2+22,12,'#fff',null,'#000')}});
    es.forEach(e=>{if(!e.dead)em('👾',X0+e.c*C+C/2,Y0+e.r*C+C/2,42)});
    tx('💣 ×'+nb,195,H-52,16,'#fff');};
  s.auto=I=>{I.tap=false;if(nb<=0)return;for(const e of es){if(e.dead)continue;if(bombs.some(b=>!b.done&&b.r===e.r))continue;
    const pc=Math.round(adv(e,FUSE-1/60));const c=clamp(pc,0,6);if(pillar(e.r,c))continue;I.x=X0+c*C+C/2;I.y=Y0+e.r*C+C/2;I.tap=true;return}};
  return s;}});

MG.push({id:'starguard',zone:'action',icon:'🌌',name:'スターガード',instr:'うちおとせ！',hint:'ねらいを敵に合わせて おしっぱなしで撃て！',dur:8,
make(lv){
  const s={res:null},es=[],K=3+lv,A=3.2-.2*lv,st=Array.from({length:50},()=>({x:rr(0,W),y:rr(0,H),z:rr(.3,1)}));let t=0,sp=0,rx=195,ry=320,fire=false;
  for(let i=0;i<K;i++)es.push({t:.3+i*.85,x:rr(80,310),y:rr(150,420),ph:rr(0,6),hp:.32,age:0,on:false,dead:0});
  const pos=e=>({x:e.x+Math.sin(T*1.5+e.ph)*14*e.age/A,y:e.y+Math.cos(T*1.2+e.ph)*10*e.age/A});
  s.update=(dt,I)=>{t+=dt;rx=I.x;ry=I.y;fire=I.down;
    for(const e of es){if(e.dead)continue;if(!e.on&&t>=e.t)e.on=true;if(!e.on)continue;e.age+=dt;
      if(fire){const p=pos(e),sz=.2+.8*e.age/A;if(Math.hypot(p.x-rx,p.y-ry)<18+sz*30){e.hp-=dt;if(e.hp<=0){e.dead=1;sfx('hit')}}}
      if(e.age>=A&&!e.dead){s.res='lose';sfx('hit')}}
    if(!s.res&&es.every(e=>e.dead))s.res='win'};
  s.draw=()=>{bgFill('#050818','#0A1030');g.fillStyle='#fff';st.forEach(p=>{const r=p.z*1.6;g.fillRect(((p.x+(rx-195)*-.05*p.z)%W+W)%W,p.y,r,r)});
    es.forEach(e=>{if(!e.on||e.dead)return;const p=pos(e),sz=.2+.8*e.age/A;em('🛸',p.x,p.y,70*sz);if(fire&&Math.hypot(p.x-rx,p.y-ry)<18+sz*30)circ(p.x,p.y,20+sz*30,null,'#FF5A6E',3)});
    if(fire){g.strokeStyle='rgba(120,255,160,.8)';g.lineWidth=3;g.beginPath();g.moveTo(80,H);g.lineTo(rx,ry);g.moveTo(W-80,H);g.lineTo(rx,ry);g.stroke()}
    g.strokeStyle='#7CFFB0';g.lineWidth=2;g.beginPath();g.arc(rx,ry,22,0,6.28);g.moveTo(rx-34,ry);g.lineTo(rx-10,ry);g.moveTo(rx+10,ry);g.lineTo(rx+34,ry);g.moveTo(rx,ry-34);g.lineTo(rx,ry-10);g.moveTo(rx,ry+10);g.lineTo(rx,ry+34);g.stroke();
    rect(0,H-90,W,70,'rgba(30,40,70,.6)');tx('✈ コクピット',195,H-60,12,'#7CF')};
  s.auto=I=>{I.down=false;const e=es.filter(e=>e.on&&!e.dead).sort((a,b)=>(A-a.age)-(A-b.age))[0];if(e){const p=pos(e);I.x=p.x;I.y=p.y;I.down=true}};
  return s;}});

// ボス：面白の物（かずおとみけ 最終ボス）
MG.push({id:'boss_action',zone:'action',boss:true,icon:'😂',name:'かずおとみけ 面白の物',instr:'面白の物！',hint:'ふってくる玉をよけて、口が開いたらタップで槍！',dur:34,cur:[195,490],
make(lv){
  const s={res:null},LN=8,LW=W/LN,PY=490,drops=[];let t=0,hp=3,php=3,px=195,inv=0,ph='atk',pt=0,waves=0,openT=0,spear=null,fl=0;
  const spawnWave=()=>{const g0=ri(0,LN-2);for(let i=0;i<LN;i++)if(i!==g0&&i!==g0+1)drops.push({x:i*LW+LW/2,y:150,w:waves,g:g0*LW+LW,e:pick(['😂','🤣','💢','🌀'])});waves++};
  s.update=(dt,I)=>{t+=dt;inv=Math.max(0,inv-dt);fl=Math.max(0,fl-dt);px+=clamp(I.x-px,-650*dt,650*dt);px=clamp(px,20,370);pt+=dt;
    if(ph==='atk'){if(pt>=Math.max(.95,1.15-.05*lv)*(waves%2?1:1)){pt=0;if(waves%2===1&&waves>0&&drops.length===0||false){}spawnWave();if(waves%3===0){ph='wait';pt=0}}}
    else if(ph==='wait'&&pt>=1.5){ph='open';pt=0;sfx('tick')}
    else if(ph==='open'&&pt>=1.7){ph='atk';pt=0}
    drops.forEach(d=>{d.y+=235*dt;if(!d.dead&&inv<=0&&Math.abs(d.x-px)<26&&Math.abs(d.y-PY)<28){d.dead=1;php--;inv=1;sfx('hit');if(php<=0)s.res='lose'}});
    for(let i=drops.length-1;i>=0;i--)if(drops[i].y>H+20)drops.splice(i,1);
    if(I.tap&&!spear){spear={x:px,y:PY};}
    if(spear){spear.y-=900*dt;if(ph==='open'&&spear.y<250&&Math.abs(spear.x-195)<110){hp--;fl=.4;sfx('hit');spear=null;ph='atk';pt=-.3;if(hp<=0)s.res='win'}else if(spear&&spear.y<TOP)spear=null}};
  s.draw=()=>{bgFill(ph==='open'?'#4A2A60':'#2A1A40','#0C0618');
    const by=190+Math.sin(T*2)*6;circ(195,by,84,fl?'#fff':'#6A3A9A','#C9A0FF',4);
    tx('面白',195,by-18,40,'#FFE45C',null,'#000');
    if(ph==='open'){rect(150,by+8,90,46,'#200',22);circ(195,by+30,16,'#FFD44D');circ(195,by+30,26+Math.sin(T*30)*3,null,'#FFE45C',3);tx('いま！',195,by+80,22,'#fff',null,'#000')}else{rect(160,by+14,70,12,'#200',6)}
    em('👁️',160,by-52,26);em('👁️',230,by-52,26);
    bar(105,TOP+4,180,9,hp/3,'#C14FA0');
    drops.forEach(d=>{if(!d.dead)em(d.e,d.x,d.y,38)});
    if(spear)em('🔱',spear.x,spear.y,36);
    g.globalAlpha=inv>0&&Math.floor(T*20)%2?.4:1;em('🧑‍🎓',px,PY,48);g.globalAlpha=1;
    for(let i=0;i<3;i++)em(i<php?'❤️':'🖤',W-24-i*26,H-44,20)};
  s.auto=I=>{I.tap=false;
    const live=drops.filter(d=>!d.dead&&d.y<PY+40);
    const ws=[...new Set(live.map(d=>d.w))].sort((a,b)=>a-b);let tgt=null;
    for(const w of ws){const ds=live.filter(d=>d.w===w);const low=Math.max(...ds.map(d=>d.y));if(low<PY-34){tgt=ds[0].g;break}
      if(low>=PY-34&&low<PY+34){tgt=ds[0].g;break}}
    if(tgt!==null)I.x=tgt;else if(ph==='open')I.x=195;
    if(ph==='open'&&!spear&&Math.abs(px-195)<100)I.tap=true;};
  return s;}});

let lastScene='';
const _tick=tick;
tick=function(dt){if(scene!==lastScene){lastScene=scene;autoWait=0}_tick(dt)};
function stepAll(dt,nodraw){let r=dt;while(r>1e-9){const d=Math.min(1/60,r);r-=d;if(scene!==lastScene){lastScene=scene;autoWait=0}if(autoOn)autoDir(d);runStep(d);T+=d}if(!nodraw)render(0)}
window.__allstars={
  runToResult(max=70){let n=0;while(R&&R.phase!=='result'&&n++<max*60){stepAll(1/60,true)}return this.state()},
  state(){return {scene,auto:autoOn,mode:R&&R.mode,phase:R&&R.phase,lives:R&&R.lives,score:R&&R.score,clears:R&&R.clears,sp:R&&R.sp,cur:R&&R.cur&&R.cur.mg.id,lv:R&&R.cur&&R.cur.lv,res:R&&R.res,i:R&&R.i,listLen:R&&R.list&&R.list.length,bossDone:R&&R.bossDone,bossLeft:R&&R.bossLeft,zones:Object.assign({},SV.zones),endless:SV.endless,cleared:Object.keys(SV.cleared).length,over:R&&R.over,t:R&&R.t,tm:R&&R.tm}},
  step:stepAll, setAuto, list(){return MG.map(m=>({id:m.id,zone:m.zone,instr:m.instr,name:m.name,boss:!!m.boss,dur:m.dur}))},
  playMG(id,lv=0,sp=1){const m=mgById(id);if(!m)throw new Error('no mg '+id);R=newRun('practice',{fixed:m,lives:99,maxLives:99});beginSpec({mg:m,lv,sp})},
  startEndless, startZone, startFinale, goMap, goZukan, goTitle,
  unlockAll(v=true){UNLOCK_ALL=v}, reset(){for(const k of ['zones','cleared'])SV[k]={};SV.endless=0;SV.gaunt=0;SV.seen=false;save()},
  inp:HI, MG, ZONES, SV, get R(){return R}, finishPractice(){if(R&&R.mode==='practice'){R=null;goTitle()}}
};

goTitle();
requestAnimationFrame(frame);
})();

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
