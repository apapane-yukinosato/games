<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1〜3さいの子向け。どろんこやあわあわでよごれた絵を、ゆびでこするとピカピカになって、中から車やどうぶつが出てくる。">
<title>こすってピカピカ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--bg:#EEF8FF;--ink:#2A3A4A;--card:#FFFFFF;--line:#C8E0F2;--mute:#7A90A8;--blue:#3A9AE0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:800;color:#2A7AC0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
#app{max-width:none;height:100vh;height:100dvh;display:flex;flex-direction:column;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));padding-top:calc(6px + env(safe-area-inset-top,0px))}
#wrap{position:relative;flex:1;min-height:0;margin-top:4px}
#cv{display:block;width:100%;height:100%;border-radius:18px;touch-action:none}
#bar{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px;justify-content:center}
#bar .sc{flex:1;max-width:64px;aspect-ratio:auto;min-height:0;height:52px;background:rgba(255,255,255,.82);backdrop-filter:blur(2px)}
#bar .sc.endless{max-width:72px;font-size:12px;font-weight:800;flex-direction:column;line-height:1.1}
#bar .sc.endless.on{background:#FFE27A;border-color:#E0A820}
.note,.back2{display:none!important}
.sc{min-height:56px;border:3px solid var(--line);border-radius:18px;background:var(--card);font-size:13px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;line-height:1.2}
.sc b{font-size:24px}
.sc.on{border-color:var(--blue);box-shadow:0 0 0 3px #CDE8FF}
.note{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 0}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:4px}
@media (pointer:coarse){.keys{display:none}}
.back2{display:block;text-align:center;margin-top:8px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>こすってピカピカ</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap"><canvas id="cv" width="360" height="480" aria-label="ゆびでこすってきれいにする画面"></canvas><div id="bar"></div></div>
  <p class="note" id="note"></p>
  <p class="keys">ドラッグでこする　1〜4 よごれをえらぶ　O オート　E ずっと　M 音</p>
  <a class="back2" href="../">← ゲーム一覧にもどる</a>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(rnd()*a.length)];
const W=360, BRUSH=34; let H=480;   // H grows to the phone's height so the dirt fills the whole screen
const cv=$('cv'), SG=cv.getContext('2d');

/* ================= full-screen stage =================
   The scene is drawn on a fixed 360x480 stage and shown as large as possible;
   the stage's edge rows/columns are stretched to fill the rest of the screen,
   so the sky and the ground reach the edges of any phone. */
const stage=document.createElement('canvas'); stage.width=720; stage.height=960;
const FIT={s:1,dx:0,dy:0};
function fitCanvas(){ const r=cv.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1); const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr)); if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } }
// the edges are copied once per scene (not every frame) so things flying past the border do not smear
const edge=document.createElement('canvas'); const eg=edge.getContext('2d'); let edgeKey=null, edgeWait=0;
function present(key,bgSrc){ if(key!==edgeKey){ edgeKey=key; edgeWait=2; } if(edgeWait>0&&--edgeWait===0){ edge.width=stage.width; edge.height=stage.height; eg.drawImage(stage,0,0); }
  const src=bgSrc||(edgeWait>0?stage:edge), sg=SG, SW=stage.width, SH=stage.height, cw=cv.width, ch=cv.height, s=Math.min(cw/SW,ch/SH), dw=SW*s, dh=SH*s, dx=(cw-dw)/2, dy=(ch-dh)/2; FIT.s=s; FIT.dx=dx; FIT.dy=dy;
  sg.imageSmoothingEnabled=true;
  if(dy>0){ sg.drawImage(src,0,0,SW,2,0,0,cw,dy+2); sg.drawImage(src,0,SH-2,SW,2,0,dy+dh-2,cw,ch-dy-dh+2); }
  if(dx>0){ sg.drawImage(src,0,0,2,SH,0,dy,dx+2,dh); sg.drawImage(src,SW-2,0,2,SH,dx+dw-2,dy,cw-dx-dw+2,dh); }
  sg.drawImage(stage,dx,dy,dw,dh); }
function toStage(e){ const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*cv.width, py=(e.clientY-r.top)/r.height*cv.height;
  return [clamp((px-FIT.dx)/FIT.s/2,0,W),clamp((py-FIT.dy)/FIT.s/2,0,H)]; }
function layoutH(){ const r=cv.getBoundingClientRect(); const nh=Math.max(480,Math.round(360*r.height/Math.max(1,r.width))); if(nh!==H||stage.height!==nh*2){ H=nh; stage.height=H*2; try{ dirt.height=H; if(pikaReady) newPicture(S.di); }catch(e){} } }
let pikaReady=false;
addEventListener('resize',()=>{ fitCanvas(); layoutH(); }); fitCanvas();
const g=stage.getContext('2d');
// the dirt lives on its own canvas; rubbing erases it
const dirt=document.createElement('canvas'); dirt.width=W; dirt.height=H; layoutH(); dirt.height=H; const d=dirt.getContext('2d',{willReadFrequently:true});

/* ================= data ================= */
const THINGS=[
  {e:'🚗',n:'くるま'},{e:'🚒',n:'しょうぼうしゃ'},{e:'🚃',n:'でんしゃ'},{e:'🚜',n:'トラクター'},{e:'✈️',n:'ひこうき'},{e:'🚀',n:'ロケット'},
  {e:'🐶',n:'いぬ'},{e:'🐘',n:'ぞう'},{e:'🦁',n:'ライオン'},{e:'🐧',n:'ペンギン'},{e:'🦖',n:'きょうりゅう'},{e:'🐳',n:'くじら'},
  {e:'🍎',n:'りんご'},{e:'🍰',n:'ケーキ'},{e:'🍙',n:'おにぎり'},{e:'🍓',n:'いちご'},{e:'🏠',n:'おうち'},{e:'🌻',n:'ひまわり'},{e:'⚽',n:'ボール'},{e:'🌈',n:'にじ'},
];
const DIRTS=[
  {id:'mud',ic:'🟫',n:'どろんこ',say:'どろんこ、ごしごし！'},
  {id:'foam',ic:'🫧',n:'あわあわ',say:'あわあわ、ごしごし！'},
  {id:'fog',ic:'🌫️',n:'くもり',say:'くもりガラス、きゅっきゅっ！'},
  {id:'snow',ic:'❄️',n:'ゆき',say:'ゆきを、どけよう！'},
];
const S={endless:(()=>{ try{ return localStorage.getItem('pikaEndless')==='1'; }catch(e){ return false; } })(),di:0,thing:null,bg:'#FFF',parts:[],clean:0,doneT:0,t:0,auto:false,manual:false,autoPath:null,hand:null,last:null,down:false,scrubT:0,checkT:0,
  best:(()=>{ try{ return JSON.parse(localStorage.getItem('pikaBest')||'null')||{done:0,seen:{}}; }catch(e){ return {done:0,seen:{}}; } })()};
function saveBest(){ if(S.auto) return; try{ localStorage.setItem('pikaBest',JSON.stringify(S.best)); }catch(e){} }
const dt0=()=>DIRTS[S.di];

function newPicture(di){
  if(di!=null) S.di=(di+DIRTS.length)%DIRTS.length;
  S.thing=pick(THINGS.filter(t=>t!==S.thing)); S.bg=pick(['#FFF4C8','#D8F2FF','#FFE0EC','#E0F8D8','#EDE0FF']);
  S.clean=0; S.doneT=0; S.parts=[]; S.autoPath=null; paintDirt(); paintTable(); renderBar(); speak(dt0().say);
}
const bgc=document.createElement('canvas'); bgc.width=720; bgc.height=960;
function paintTable(){ bgc.width=720; bgc.height=H*2; const x=bgc.getContext('2d'); x.fillStyle=S.bg; x.fillRect(0,0,720,H*2); }
function paintDirt(){
  const id=dt0().id; d.globalCompositeOperation='source-over'; d.clearRect(0,0,W,H);
  if(id==='mud'){ d.fillStyle='#8A5A32'; d.fillRect(0,0,W,H); for(let k=0;k<70;k++){ d.fillStyle=pick(['#6A4220','#9A6A3A','#7A4A28','#A87A48']); d.beginPath(); d.ellipse(rnd()*W,rnd()*H,10+rnd()*40,8+rnd()*30,rnd()*3,0,7); d.fill(); }
    for(let k=0;k<20;k++){ d.fillStyle='rgba(60,30,10,.5)'; d.beginPath(); d.arc(rnd()*W,rnd()*H,3+rnd()*6,0,7); d.fill(); } }
  else if(id==='foam'){ d.fillStyle='#F4FAFF'; d.fillRect(0,0,W,H); for(let k=0;k<160;k++){ const x=rnd()*W,y=rnd()*H,r=8+rnd()*26; const gr=d.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r); gr.addColorStop(0,'#FFFFFF'); gr.addColorStop(.8,'#E4F2FF'); gr.addColorStop(1,'#C8E0F8'); d.fillStyle=gr; d.beginPath(); d.arc(x,y,r,0,7); d.fill(); } }
  else if(id==='fog'){ d.fillStyle='#C8D4E0'; d.fillRect(0,0,W,H); for(let k=0;k<40;k++){ d.fillStyle='rgba(255,255,255,.25)'; d.beginPath(); d.ellipse(rnd()*W,rnd()*H,40+rnd()*60,20+rnd()*30,0,0,7); d.fill(); }
    d.fillStyle='rgba(150,170,190,.5)'; for(let k=0;k<30;k++){ const x=rnd()*W; d.fillRect(x,rnd()*H,2,10+rnd()*30); } }
  else { d.fillStyle='#FFFFFF'; d.fillRect(0,0,W,H); for(let k=0;k<90;k++){ d.fillStyle=pick(['#F0F8FF','#E4F0FA','#FFFFFF']); d.beginPath(); d.arc(rnd()*W,rnd()*H,14+rnd()*30,0,7); d.fill(); } d.fillStyle='rgba(180,210,240,.6)'; for(let k=0;k<60;k++){ d.beginPath(); d.arc(rnd()*W,rnd()*H,2,0,7); d.fill(); } }
  d.globalCompositeOperation='destination-out';
}

/* ================= rubbing ================= */
function rub(x0,y0,x1,y1){
  if(S.doneT>0) return; const dist=Math.hypot(x1-x0,y1-y0), n=Math.max(1,Math.ceil(dist/8));
  for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n; const gr=d.createRadialGradient(x,y,BRUSH*.4,x,y,BRUSH); gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)'); d.fillStyle=gr; d.beginPath(); d.arc(x,y,BRUSH,0,7); d.fill(); }
  // bubbles and sparkles fly off the finger
  if(rnd()<.5){ const id=dt0().id; S.parts.push({k:id==='mud'?'drop':id==='snow'?'flake':'bub',x:x1,y:y1,vx:(rnd()-.5)*120,vy:-40-rnd()*80,t:0,r:3+rnd()*5}); }
  S.scrubT-=1; if(S.scrubT<=0){ S.scrubT=6; scrub(); }
}
function measure(){ // share of dirt removed, sampled on a grid
  const img=d.getImageData(0,0,W,H).data; let tot=0,clean=0;
  for(let y=8;y<H;y+=16) for(let x=8;x<W;x+=16){ tot++; if(img[(y*W+x)*4+3]<60) clean++; }
  return clean/tot;
}
function finish(){ S.doneT=3.2; d.clearRect(0,0,W,H); S.best.done++; S.best.seen[S.thing.e]=1; saveBest();
  for(let k=0;k<40;k++){ const a=rnd()*Math.PI*2, s=80+rnd()*160; S.parts.push({k:'star',x:W/2,y:H/2-20,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0}); }
  sfx('shine'); speak(`ピカピカ！ ${S.thing.n}！`); renderBar(); }

/* ================= update ================= */
function update(dt){
  S.t+=dt;
  S.checkT-=dt; if(S.checkT<=0&&S.doneT<=0){ S.checkT=.25; S.clean=measure(); if(S.clean>=.86) finish(); }
  for(const p of S.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.k==='drop'||p.k==='flake') p.vy+=300*dt; if(p.k==='bub') p.vy-=20*dt; }
  S.parts=S.parts.filter(p=>p.t<(p.k==='star'?1.4:1));
  if(S.doneT>0){ S.doneT-=dt; if(S.doneT<=0) newPicture(S.endless?S.di:(S.best.done%3===0?S.di+1:S.di)); }
  if(S.auto) autoTick(dt);
}
// auto: a finger sweeps back and forth over the dirt, row by row
function autoTick(dt){
  if(S.doneT>0){ S.hand=null; return; }
  if(!S.autoPath){ const pts=[]; for(let y=40;y<H;y+=44){ const row=(y/44|0)%2; pts.push(row?[W-20,y]:[20,y],row?[20,y]:[W-20,y]); } S.autoPath={pts,i:0,x:pts[0][0],y:pts[0][1]}; }
  const P=S.autoPath, tgt=P.pts[P.i]; if(!tgt){ S.autoPath=null; return; }
  const dx=tgt[0]-P.x, dy=tgt[1]-P.y, dist=Math.hypot(dx,dy), sp=520*dt;
  const nx=dist<=sp?tgt[0]:P.x+dx/dist*sp, ny=dist<=sp?tgt[1]:P.y+dy/dist*sp+Math.sin(S.t*20)*3;
  rub(P.x,P.y,nx,ny); P.x=nx; P.y=ny; if(dist<=sp) P.i++; S.hand={x:nx,y:ny};
}

/* ================= drawing ================= */
function emoji(e,x,y,s){ g.font=`${s}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(e,x,y); g.textBaseline='alphabetic'; }
function draw(){
  g.setTransform(2,0,0,2,0,0);
  g.fillStyle=S.bg; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.5)'; for(let k=0;k<8;k++){ g.beginPath(); g.arc((k*97)%W,(k*61)%H,30,0,7); g.fill(); }
  const pop=S.doneT>0?1+Math.sin(Math.min(1,(3.2-S.doneT)*2)*Math.PI)*.12:1;
  g.save(); g.translate(W/2,H/2-20); g.scale(pop,pop); emoji(S.thing.e,0,0,200); g.restore();
  g.drawImage(dirt,0,0);
  for(const p of S.parts){ g.globalAlpha=Math.max(0,1-p.t/(p.k==='star'?1.4:1));
    if(p.k==='bub'){ g.strokeStyle='rgba(120,180,240,.9)'; g.lineWidth=1.5; g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); g.stroke(); }
    else if(p.k==='drop'){ g.fillStyle='#7A4A28'; g.beginPath(); g.arc(p.x,p.y,p.r*.7,0,7); g.fill(); }
    else if(p.k==='flake'){ g.fillStyle='#FFFFFF'; g.strokeStyle='#B8D0E8'; g.beginPath(); g.arc(p.x,p.y,p.r*.8,0,7); g.fill(); g.stroke(); }
    else { g.fillStyle=pick(['#FFD23A','#FFFFFF','#9AD8FF']); g.save(); g.translate(p.x,p.y); g.rotate(p.t*5); g.beginPath(); for(let i=0;i<10;i++){ const r=i%2?3:9, an=i/10*Math.PI*2; g.lineTo(Math.cos(an)*r,Math.sin(an)*r); } g.fill(); g.restore(); } }
  g.globalAlpha=1;
  // progress bar made of a bubble that fills up
  const k=S.doneT>0?1:clamp(S.clean/.86,0,1);
  g.fillStyle='rgba(255,255,255,.85)'; g.beginPath(); g.roundRect?g.roundRect(60,14,240,26,13):g.rect(60,14,240,26); g.fill();
  g.fillStyle='#5AC0FF'; g.beginPath(); g.roundRect?g.roundRect(64,18,232*k,18,9):g.rect(64,18,232*k,18); g.fill();
  emoji('✨',60+240*k,27,22);
  if(S.doneT>0){ g.fillStyle='#FFFFFF'; g.strokeStyle='#2A7AC0'; g.lineWidth=8; g.font='800 38px "M PLUS Rounded 1c",sans-serif'; g.textAlign='center'; g.strokeText('ピカピカ！',W/2,H-150); g.fillStyle='#FF6A8A'; g.fillText('ピカピカ！',W/2,H-150);
    g.font='800 24px "M PLUS Rounded 1c",sans-serif'; g.lineWidth=6; g.strokeText(S.thing.n,W/2,H-110); g.fillStyle='#2A7AC0'; g.fillText(S.thing.n,W/2,H-110); }
  if(S.hand){ emoji('👆',S.hand.x+10,S.hand.y+26,34); }
  if(S.auto){ g.fillStyle='rgba(0,0,0,.5)'; g.font='800 11px sans-serif'; g.textAlign='left'; g.fillText('🤖 AUTO',8,H-8); }
}

/* ================= UI ================= */
// endless mode: keep playing the same game instead of moving on after a clear
function toggleEndless(){ S.endless=!S.endless; try{ localStorage.setItem('pikaEndless',S.endless?'1':'0'); }catch(e){} speak(S.endless?'ずっと おなじ よごれ':'じゅんばんに あそぼう'); renderBar(); }
function renderBar(){
  $('bar').innerHTML=DIRTS.map((x,i)=>`<button class="sc${i===S.di?' on':''}" data-i="${i}"><b>${x.ic}</b>${x.n}</button>`).join('')+`<button class="sc endless${S.endless?' on':''}" id="endlessBtn" aria-pressed="${!!S.endless}" title="Eキー">🔁<br>ずっと</button>`;
  $('endlessBtn').onclick=()=>{ ac(); user(); toggleEndless(); };
  $('bar').querySelectorAll('.sc[data-i]').forEach(b=>b.onclick=()=>{ ac(); user(); newPicture(+b.dataset.i); });
  $('note').textContent=`ピカピカにした数 ${S.best.done}　｜　見つけた絵 ${Object.keys(S.best.seen).length}/${THINGS.length}`;
}
function pos(e){ return toStage(e); }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); user(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} S.down=true; const [x,y]=pos(e); S.last=[x,y]; rub(x,y,x,y); });
cv.addEventListener('pointermove',e=>{ if(!S.down) return; e.preventDefault(); const [x,y]=pos(e); rub(S.last[0],S.last[1],x,y); S.last=[x,y]; });
const up=()=>{ S.down=false; S.last=null; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function setAuto(v){ S.auto=!!v; $('autoBtn').setAttribute('aria-pressed',S.auto); S.autoPath=null; S.hand=null; }
function user(){ if(S.auto) setAuto(false); }
$('autoBtn').onclick=()=>{ ac(); setAuto(!S.auto); };
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!S.auto); return; } if(k==='e'){ ac(); user(); toggleEndless(); return; } if(k==='m'){ ac(); setMute(!muted); return; }
  if(k>='1'&&k<='4'){ ac(); user(); newPicture(+k-1); } });

/* ================= sound ================= */
let AC=null, muted=false, lastScrub=0; try{ muted=localStorage.getItem('pikaMute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,dur,type='sine',v=.07,delay=0,f2){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+dur+.02); }
function scrub(){ if(muted||!AC) return; const now=AC.currentTime; if(now-lastScrub<.07) return; lastScrub=now;
  // a short burst of filtered noise sounds like scrubbing
  const len=Math.floor(AC.sampleRate*.07), buf=AC.createBuffer(1,len,AC.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource(), f=AC.createBiquadFilter(), gn=AC.createGain(); src.buffer=buf; f.type='bandpass'; f.frequency.value=dt0().id==='fog'?2600:1400+Math.random()*600; gn.gain.value=.12; src.connect(f).connect(gn).connect(AC.destination); src.start();
  if(Math.random()<.25) tone(1800+Math.random()*1200,.06,'sine',.025); }
function sfx(k){ if(k==='shine'){ [784,988,1175,1568,1976].forEach((q,i)=>tone(q,.16,'triangle',.06,i*.07)); tone(2637,.5,'sine',.03,.4); } }
function speak(t){ if(muted) return; try{ const sy=window.speechSynthesis; if(!sy) return; sy.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=1; u.pitch=1.5; sy.speak(u); }catch(e){} }
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{ localStorage.setItem('pikaMute',m?'1':'0'); }catch(e){} if(m) try{ speechSynthesis.cancel(); }catch(e){} }

setMute(muted); newPicture(0); pikaReady=true;
let last=performance.now();

requestAnimationFrame(loop);

window.__pika={ get S(){ return S; }, setAuto, manual(v=true){ S.manual=v; }, step(dt=1/60){ update(dt); }, seed(v){ seed=(Math.abs(v|0)%2147483646)+1; }, rub, newPicture, measure, DIRTS };

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
