<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="サックス奏者ジョンが10年でトップへ！ 町でフレーズを集め、マネーダイソンと売り買いし、コード進行に合わせて毎月のセッションで勝ち上がるパワプロ式ジャズ育成RPG。">
<title>ジョン・ザ・サックス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
html,body{touch-action:manipulation}
:root{--bg:#0F0B1C;--ink:#F6EEDC;--card:#1C1633;--card2:#261E45;--line:#42356A;--mute:#A99BC4;--gold:#F2C23A;--blue:#4FA3FF;--red:#E8504A;--green:#46C07A;--pink:#FF6FA0;--white:#EDE6F5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));position:relative}
#top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-family:"Dela Gothic One",sans-serif;color:var(--gold);letter-spacing:.04em;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#status{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 9px;font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#date{font-weight:800;font-size:14px}
#venue{margin-left:auto;font-size:11px;color:var(--gold);font-weight:800;text-align:right}
#mood{font-weight:800}
.bar{flex:1;min-width:70px;height:9px;border-radius:6px;background:#2C2350;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#4FD0A0,#F2C23A,#E8504A);background-size:100px 100%}
#money{font-weight:800;color:var(--gold)}
#abil{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.ab{background:#241C42;border-radius:8px;padding:3px 4px;text-align:center;line-height:1.15}
.ab small{display:block;font-size:10px;color:var(--mute)}
.rk{font-family:"Dela Gothic One",sans-serif;font-size:16px;margin-right:2px}
#pts{display:flex;gap:6px;margin-top:6px;align-items:center;font-weight:800;font-size:12px;flex-wrap:wrap}
#pts span{white-space:nowrap}
#tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#tools .mini{flex:1;text-align:center;padding:5px 4px}
#scene{display:block;width:100%;aspect-ratio:360/150;border-radius:14px;margin-top:6px;background:#1C1633}
#msg{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px 8px;margin-top:6px;min-height:78px;font-size:14px;line-height:1.6;white-space:pre-line;cursor:pointer}
#msg b{display:inline-block;background:var(--gold);color:#1C1633;border-radius:8px;padding:0 8px;font-size:12px;margin-bottom:2px}
#msg .nx{position:absolute;right:10px;bottom:4px;font-size:12px;color:var(--gold);font-weight:800;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.act{position:relative;min-height:54px;border-radius:12px;background:var(--card2);box-shadow:0 3px 0 #0A0714;border:1px solid var(--line);text-align:left;padding:6px 8px;cursor:pointer;font-weight:800;font-size:14px}
.act small{display:block;font-size:10px;color:var(--mute);font-weight:500}
.act.gold{grid-column:1/3;background:linear-gradient(135deg,#4A2C7A,#2A1850);border-color:var(--gold)}
.act:disabled{opacity:.45;cursor:default}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0A0714}
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(8,5,16,.78);padding:56px 10px 12px;z-index:5;overflow:auto}
.ov.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:480px;max-height:calc(100vh - 70px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h2{margin:0 0 6px;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:20px;color:var(--gold);text-align:center}
.sub{font-size:12px;color:var(--mute);text-align:center;margin:0 0 8px;white-space:pre-line;line-height:1.6}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:9px 12px;margin-top:6px;cursor:pointer;font-weight:800;font-size:14px}
.opt small{display:block;font-weight:500;font-size:11px;color:var(--mute);line-height:1.5}
.opt:disabled{opacity:.45;cursor:default}
.opt.sel{border-color:var(--gold)}
.go{display:block;width:100%;min-height:46px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;background:var(--gold);color:#1C1633;box-shadow:0 4px 0 #8A6A16}
.go.alt{background:#352A5C;color:var(--ink);box-shadow:0 4px 0 #1C1633}
.go:disabled{opacity:.45;box-shadow:none}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none;text-align:center}
.upr{display:grid;grid-template-columns:1fr auto;gap:4px 6px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0;font-size:13px}
.upr small{display:block;font-size:10px;color:var(--mute);line-height:1.4}
.upr button{border:0;border-radius:8px;background:var(--gold);color:#1C1633;font-weight:800;padding:6px 10px;cursor:pointer;font-size:12px;min-width:64px}
.upr button:disabled{background:#3A3158;color:#8A7FA8;cursor:default}
.sec{font-family:"Dela Gothic One",sans-serif;font-size:13px;color:var(--gold);margin:12px 0 2px}
.chip{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:#352A5C;color:var(--ink);margin:1px 2px 0 0}
.chip.b{background:#1E4F8A}.chip.r{background:#8A2A2A}.chip.g{background:#7A5A10;color:#FFE9A8}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px;font-weight:800;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#1C1633;border-color:var(--gold)}
.dyl{background:#2A1A4A;border:1px solid #6A3AC8;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.6;margin-bottom:6px}
.dyl b{color:#D8B8FF}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;background:var(--card2);border-radius:10px;padding:7px 9px;margin-top:5px;font-size:13px}
.pr b{font-size:13px}.pr small{color:var(--mute);font-size:10px}
.pr .btns{display:flex;gap:4px;grid-row:1/3;grid-column:2}
.pr button{border:0;border-radius:8px;background:var(--gold);color:#1C1633;font-weight:800;padding:6px 8px;cursor:pointer;font-size:12px}
.pr button.pl{background:#352A5C;color:var(--ink)}
.pr button:disabled{background:#3A3158;color:#8A7FA8;cursor:default}
.pr.lock{opacity:.5}
.th{background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:12.5px;line-height:1.7}
.th b{font-size:14px;color:var(--gold)}
.th.lock{opacity:.45}
#title .big{font-family:"Dela Gothic One",sans-serif;font-size:36px;color:var(--gold);text-align:center;line-height:1.15;margin:6px 0;text-shadow:3px 3px 0 #4A2C7A}
.story{font-size:14px;line-height:1.8;white-space:pre-line;margin:8px 0}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}
@media (pointer:coarse){.keys{display:none}}
/* ---- セッション ---- */
#sessOv{padding:0;align-items:stretch;background:var(--bg)}
#sess{width:100%;max-width:520px;margin:0 auto;padding:6px 8px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;overflow:auto}
#sHead{display:flex;align-items:center;gap:6px;font-size:12px}
#sHead b{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:var(--gold);font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sHead span{color:var(--mute);font-size:11px;white-space:nowrap}
#chart{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bc{position:relative;background:var(--card);border:2px solid var(--line);border-radius:9px;padding:2px 4px 3px;min-height:48px;line-height:1.15;overflow:hidden}
.bc .n{font-size:9px;color:var(--mute)}
.bc .c{font-size:13px;font-weight:800;white-space:nowrap}
.bc .c.two{font-size:11px}
.bc .f{font-size:9px;color:var(--mute);white-space:nowrap}
.bc .p{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc.J{border-top-color:var(--gold)}
.bc.R{border-top-color:var(--blue)}
.bc.cur{box-shadow:0 0 0 2px var(--gold),0 0 10px var(--gold)}
.bc.play{background:#3A2C6A}
.bc.gold{border-color:var(--gold);background:linear-gradient(180deg,#4A3A10,#241C10)}
.bc.white{border-color:var(--white)}
.bc.red{border-color:var(--red);background:#3A1414}
.bc.cont{opacity:.9}
.bc .pt{position:absolute;right:3px;top:1px;font-size:10px;font-weight:800;color:var(--gold)}
#sCv{display:block;width:100%;aspect-ratio:360/110;border-radius:12px;background:#1C1633}
#heatW{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800}
#heatW .bar{height:11px}
#heatI{background:linear-gradient(90deg,#4FA3FF,#FF6FA0,#F2C23A)!important;background-size:auto!important;transition:width .3s}
#sMsg{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 9px;font-size:12.5px;line-height:1.55;min-height:58px;white-space:pre-line}
#hand{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.hc{position:relative;min-height:96px;border-radius:10px;border:2px solid var(--line);background:var(--card2);padding:4px 3px 3px;text-align:center;cursor:pointer;font-size:10px;line-height:1.25;display:flex;flex-direction:column;justify-content:space-between}
.hc b{font-size:11px;display:block;line-height:1.25}
.hc .pw{font-size:10px;color:var(--gold);font-weight:800}
.hc .g{display:inline-block;border-radius:6px;padding:0 5px;font-size:10px;font-weight:800}
.hc.gold{border-color:var(--gold)}.hc.gold .g{background:var(--gold);color:#1C1633}
.hc.white{border-color:var(--white)}.hc.white .g{background:var(--white);color:#1C1633}
.hc.red{border-color:var(--red)}.hc.red .g{background:var(--red);color:#fff}
.hc.nofit{opacity:.35}
.hc .tg{font-size:9px;color:var(--mute)}
.hc.empty{opacity:.2;cursor:default}
#sBtns{display:flex;gap:6px}
#sBtns .go{margin-top:0;min-height:44px;font-size:14px;flex:1}
@media (min-width:900px){#sess{max-width:760px}#chart{grid-template-columns:repeat(8,1fr)}}
.res h3{margin:8px 0 2px;font-size:13px;color:var(--gold)}
.res p{margin:3px 0;font-size:13px;line-height:1.6}
.big2{font-family:"Dela Gothic One",sans-serif;font-size:34px;text-align:center;margin:4px 0}
.big2.win{color:var(--gold)}.big2.lose{color:var(--mute)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;align-items:center;text-align:center;font-size:12px;margin:6px 0}
.cmp b{font-size:20px;font-family:"Dela Gothic One",sans-serif;font-weight:400}
#cardCv,#endCv{width:100%;max-width:300px;display:block;margin:6px auto;border-radius:12px}
.hist{display:flex;gap:6px;overflow:auto;padding:4px 0}
.hist button{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:800;cursor:pointer;text-align:left}
.hist button.on{border-color:var(--gold)}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);

/* ===== 01_theory.js ===== */
/* ================= 音楽理論・フレーズ ================= */
let seed=(Date.now()%2147483646)+1;
const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const setSeed=v=>{ seed=(Math.abs(v|0)%2147483646)+1; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(rnd()*a.length)];
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const PCN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const QDISP={maj7:'maj7',m7:'m7',m7b5:'m7♭5','7':'7','7b':'7',m6:'m6','7alt':'7alt',dim7:'dim7'};
const QFN={maj7:'Ⅰ',m7:'ⅱ','7':'Ⅴ','7b':'Ⅰ7',m7b5:'ⅱø','7alt':'Ⅴalt',m6:'Ⅰm',dim7:'dim'};
function parseChord(s,b){
  const m=/^([A-G])([b#]?)(maj7|m7b5|m7|m6|7alt|7b|7|dim7)$/.exec(s);
  if(!m) throw new Error('bad chord '+s);
  const r=(PCN[m[1]]+(m[2]==='b'?-1:m[2]==='#'?1:0)+12)%12;
  return {r,q:m[3],b:b||4,n:m[1]+(m[2]==='b'?'♭':m[2]==='#'?'♯':'')};
}
const chordName=c=>c.n+QDISP[c.q];
function parseForm(str){
  return str.trim().split(/\s+/).map(bar=>{ const p=bar.split('/'); return p.map(x=>parseChord(x,4/p.length)); });
}
const barKey=bar=>bar.map(c=>c.q).join('/');
const barSig=bar=>bar.map(c=>c.r+c.q).join('/');

/* コードごとの音の分類（ルートからの半音数） */
const QT={
  'maj7':{ct:[0,4,7,11],ten:[2,6,9],alt:[],blue:[],avoid:[5],sc:[]},
  'm7':{ct:[0,3,7,10],ten:[2,5,9],alt:[],blue:[],avoid:[8],sc:[]},
  '7':{ct:[0,4,7,10],ten:[2,9],alt:[1,3,6,8],blue:[],avoid:[5],sc:[]},
  '7b':{ct:[0,4,7,10],ten:[2,9],alt:[],blue:[3,5,6],avoid:[],sc:[1,8]},
  '7alt':{ct:[0,4,10],ten:[],alt:[1,3,6,8],blue:[],avoid:[5],sc:[2,7,9]},
  'm7b5':{ct:[0,3,6,10],ten:[2,5,8],alt:[],blue:[],avoid:[1],sc:[]},
  'm6':{ct:[0,3,7,9],ten:[2,5,11],alt:[],blue:[],avoid:[8],sc:[10]},
  'dim7':{ct:[0,3,6,9],ten:[],alt:[],blue:[],avoid:[],sc:[1,4,7,10]},
};
const THIRD={maj7:4,m7:3,'7':4,'7b':4,'7alt':4,m7b5:3,m6:3,dim7:3};
const SEVENTH={maj7:11,m7:10,'7':10,'7b':10,'7alt':10,m7b5:10,m6:9,dim7:9};
function cls(q,iv){
  const t=QT[q];
  if(t.ct.includes(iv)) return 'ct';
  if(t.ten.includes(iv)) return 'ten';

function normBars(chords,n){
  const one=c=>{ if(typeof c==='string') c=parseChord(c); return Array.isArray(c)?c:[Object.assign({b:4},c)]; };
  if(Array.isArray(chords)&&chords.length&&Array.isArray(chords[0])) return chords.map(one);

    const pc=((anchor+n.s)%12+12)%12, iv=((pc-seg.r)%12+12)%12;
    let c=cls(seg.q,iv);

    let s=c==='blue'?(blues?[.92,.9,.88][lvl]:[.7,.6,.5][lvl]):NS[c][lvl];
    // 経過音・アプローチ：次の音がコードトーンへ解決するなら許す
    const nx=N[i+1];

      const nb=bars[Math.min(bars.length-1,Math.floor(nx.b/4+1e-6))], ns=segAt(nb,nx.b%4);
      const npc=((anchor+nx.s)%12+12)%12;

  if(H>=.7&&cards>TH_TEN&&ten>0){ bonus+=Math.min(.09,.03*ten); tags.push('tension'); }
  // ガイドトーンの解決
  const last=N[N.length-1];
  if(last&&o.next&&cards>TH_GUIDE){
    const lb=bars[bars.length-1], lseg=segAt(lb,Math.min(3.99,last.b%4)), nxc=firstNext(o.next);
    const lpc=((anchor+last.s)%12+12)%12, liv=((lpc-lseg.r)%12+12)%12;
    const t3=(nxc.r+THIRD[nxc.q])%12, t7=(nxc.r+SEVENTH[nxc.q])%12;
    const near=Math.min(cdist(lpc,t3),cdist(lpc,t7));

      const isGuide=(liv===THIRD[lseg.q]||liv===SEVENTH[lseg.q]);

    }

function walkChoices(G){
  const ids=shuffle(SPOTS.map(s=>s.id));
  const need=G.fl.scoutNeed;
  let three=ids.slice(0,3);
  // 見つけたいフレーズがあるスポットが入りやすいように
  return three.map(id=>SPOTS.find(s=>s.id===id));
}
function scoutRival(G,lv){
  const c=RIVAL_BY_RANK(G.rank).filter(k=>(G.scout[k]||0)<2);
  if(!c.length) return null;
  const k=pick(c); G.scout[k]=Math.min(2,(G.scout[k]||0)+(lv||1));
  return k;
}
function doWalk(G,spotId){
  const sp=SPOTS.find(s=>s.id===spotId), out={lines:[sp.ic+' '+sp.n,sp.intro]};
  G.fat+=4;
  const r=rnd();
  const cand=sp.pool.map(id=>PBY[id]).filter(p=>p&&!G.phr.includes(p.id)&&unlocked(G,p));
  let done=false;
  if(r<.5&&cand.length){
    const p=pick(cand); gainPhrase(G,p.id); out.got=p.id; done=true;
    out.lines.push(sp.got); out.lines.push('🎵 フレーズ「'+p.name+'」を手に入れた！');
  } else if(r<.62||(sp.scout&&r<.8)){
    const k=scoutRival(G,1);
    if(k){ const R=RIVALS[k]; out.lines.push(pick(sp.other)); out.lines.push('🔎 ライバル「'+R.n+'」の情報：'+R.sig+'。'+((G.scout[k]||0)>=2?'（弱点の曲もわかった！）':'')); out.scout=k; done=true; }
  }
  if(!done){
    if(r>.9&&G.mot<5){ G.mot++; out.lines.push(pick(sp.other)); out.lines.push('気分がすっきりした。やる気アップ！'); }
    else { out.lines.push(pick(sp.other)); }
    if(sp.money&&rnd()<.5){ G.money+=sp.money; out.lines.push('💴 '+sp.money+'円ひろった（もらった）！'); }
  }
  out.lines.push(addExp(G,sp.exp,.9+.1*G.mot));
  return out;
}
/* ---- 能力アップ ---- */
function canUp(G,k){ const c=abCost(G.st[k]), a=AB[k]; return G.st[k]<100&&G.exp[a.main]>=c.m&&G.exp[a.sub]>=c.s; }
function doUp(G,k){ if(!canUp(G,k)) return false; const c=abCost(G.st[k]), a=AB[k]; G.exp[a.main]-=c.m; G.exp[a.sub]-=c.s; G.st[k]+=1; return true; }
function canSpc(G,id){ const s=SPC[id]; if(G.spc.includes(id)) return false; if(s.cond&&!s.cond(G)) return false; for(const k in s.cost) if(G.exp[k]<s.cost[k]) return false; return true; }
function spcAvail(G,id){ const s=SPC[id]; if(s.col==='r') return G.spc.includes(id); return !G.spc.includes(id)&&(!s.cond||s.cond(G)); }
function doSpc(G,id){
  const s=SPC[id];
  if(s.col==='r'){ if(!G.spc.includes(id)) return false; for(const k in s.cost) if(G.exp[k]<s.cost[k]) return false; for(const k in s.cost) G.exp[k]-=s.cost[k]; G.spc=G.spc.filter(x=>x!==id); return true; }
  if(!canSpc(G,id)) return false; for(const k in s.cost) G.exp[k]-=s.cost[k]; G.spc.push(id); return true;
}
/* ---- ダイソンの店 ---- */
function refreshStock(G){
  const c=PHR.filter(p=>unlocked(G,p)&&!G.phr.includes(p.id)&&p.tier<=maxTier(G)&&!(p.rare&&G.rank<2));
  const base=shuffle(c).slice(0,7).map(p=>p.id);
  const pc=PHR.filter(p=>unlocked(G,p)&&!G.phr.includes(p.id)&&!base.includes(p.id)&&p.pw>=40+G.rank*5);
  G.prem=shuffle(pc).slice(0,3).map(p=>p.id);
  G.stock=base.concat(G.prem);
}
const priceG=(G,p)=>Math.round(priceOf(p)*(G.prem&&G.prem.includes(p.id)?1.5:1));
function shopBuy(G,id){
  const p=PBY[id]; if(!p) return {ok:false};
  if(!unlocked(G,p)) return {ok:false,line:DY.lock};
  if(G.phr.includes(id)) return {ok:false};
  const pr=priceG(G,p); if(G.money<pr) return {ok:false,line:DY.poor};
  G.money-=pr; G.phr.push(id); G.stock=G.stock.filter(x=>x!==id); if(G.prem) G.prem=G.prem.filter(x=>x!==id);
  return {ok:true,line:pick(DY.buy),price:pr};
}

function rollEvent(G){
  if(rnd()>.55) return null;
  const c=EVENTS.filter(e=>e.id!==G.lastEv&&e.cond(G));
  if(!c.length) return null;
  const tot=c.reduce((a,e)=>a+e.w,0); let r=rnd()*tot, e=c[0];
  for(const x of c){ r-=x.w; if(r<=0){ e=x; break; } }
  G.lastEv=e.id;
  return e;
}

  for(const k in G.fresh){ G.fresh[k]*=.7; if(G.fresh[k]<.1) delete G.fresh[k]; }
  if(G.tbuff>0) G.tbuff--;
  if(G.reed>0) G.reed--;
  if(G.inj>0&&G.month%2===1) G.inj--;
  if(G.fat>70&&rnd()<.5) G.mot=Math.max(1,G.mot-1);
  else if(G.fat<20&&G.mot<3&&rnd()<.5) G.mot++;
  if(G.love>=1&&G.mot<4&&rnd()<.2) G.mot++;
  refreshStock(G);
  G.doneSess=false;
  clampSt(G);
}

}

/* ================= セッション（バトル） ================= */
const STY={kenta:'bop',gon:'blues',misaki:'bal',toru:'fast',riko:'mode',jiro:'blues',maria:'bop',dan:'mode',victor:'bal',kai:'bop',sakura:'bal',lion:'fast',nora:'bop',robin:'blues',king:'cc'};
const JCACHE=new Map();
function judgeCtx(G,ph,bars,next,prevLast,cards,theory,blues){
  const key=ph.id+'|'+bars.map(barSig).join('>')+'|'+(next?barSig(next):'')+'|'+cards+'|'+(theory|0)+'|'+(blues?1:0)+'|'+(prevLast==null?'':prevLast);
  let r=JCACHE.get(key);
  if(!r){ r=judge(ph,bars,{next,cards,theory,blues,prevLast}); JCACHE.set(key,r); if(JCACHE.size>60000) JCACHE.clear(); }
  return r;
}
const curBlock=S=>S.blocks[S.bi];

function newSession(G,tuneId,rid,o){
  o=o||{}; const tune=TUNES[tuneId], R=RIVALS[rid];
  const all=tune._bars||(tune._bars=parseForm(tune.form));
  const st=tune.sess[0], len=tune.sess[1], bars=[];
  for(let i=0;i<len;i++) bars.push(all[(st+i)%all.length]);
  const bs=tune.fmt==='solo'?8:4, blocks=[]; let who='J';
  for(let i=0;i<len;i+=bs){ blocks.push({who,from:i,to:Math.min(len,i+bs)}); who=who==='J'?'R':'J'; }
  const S={G,tuneId,tune,rid,R,boss:!!o.boss,bars,len,blocks,bi:-1,pl:new Array(len).fill(null),placed:[],cur:0,hand:[],
    redraw:2+Math.floor(G.st.ear/40),use:{},useR:{},heat:Math.round(G.st.fame/3)+10,P:eff(G),cond:condMul(G),
    jTotal:blocks.filter(b=>b.who==='J').reduce((a,b)=>a+b.to-b.from,0),jDone:0,lastPw:-1,maxPw:0,
    jPts:0,jBars:0,rPts:0,rBars:0,rform:1+(rnd()-.5)*.08,
    tags:{gold:0,white:0,red:0,guide:0,tension:0,avoid:0,squeak:0,repeat:0,quote:0,climax:0,link:0},
    phase:'idle',done:false,res:null,lastBlock:null,jUsed:[]};
  return S;
}
function nextBlock(S){
  S.bi++;
  if(S.bi>=S.blocks.length){ S.phase='done'; return finishSession(S); }
  const bl=curBlock(S); S.cur=bl.from; S.placed=[];
  if(bl.who==='J'){ S.hand=[]; S.lastPw=-1; dealHand(S); S.phase='fill'; }
  else { rivalBlock(S); S.phase='rplay'; }
  return null;
}
/* ---- 判定（小節の位置つき） ---- */
function prevLastAt(S,i){
  const bl=curBlock(S); if(i<=bl.from) return null;
  let p=S.pl[i-1]; if(!p) return null; if(p.cont!==undefined) p=S.pl[p.cont];
  return p&&p.who==='J'?p.lastPc:null;
}
function judgeAtS(S,ph,i){
  const bl=curBlock(S); if(i+ph.bars>bl.to) return null;
  const bars=S.bars.slice(i,i+ph.bars), next=S.bars[(i+ph.bars)%S.len], G=S.G;
  return judgeCtx(G,ph,bars,next,prevLastAt(S,i),G.th,G.st.theory,hasSpec(G,'blues'));
}
/* ---- 手札 ---- */
function dealHand(S){
  const G=S.G, bl=curBlock(S);
  if(bl.who!=='J') return;
  let hand=S.hand.filter(id=>S.cur<bl.to&&judgeAtS(S,PBY[id],S.cur));
  const usedN=id=>(S.use[id]||0)+S.placed.filter(p=>p.ph.id===id).length;
  const pool=()=>shuffle(G.phr.filter(id=>!hand.includes(id)&&S.cur<bl.to&&judgeAtS(S,PBY[id],S.cur))).sort((a,b)=>usedN(b)-usedN(a));
  const isGold=id=>judgeAtS(S,PBY[id],S.cur).grade==='gold';
  let nGold=hand.filter(isGold).length;
  const golds=pool().filter(isGold);
  while(nGold<2&&golds.length){
    if(hand.length>=5){ const k=hand.findIndex(id=>!isGold(id)); if(k<0) break; hand.splice(k,1); }
    hand.push(golds.pop()); nGold++;
  }
  const rest=pool();
  while(hand.length<5&&rest.length) hand.push(rest.pop());
  S.hand=hand;
}
function placeCard(S,idx){
  if(S.phase!=='fill') return {ok:false};
  const id=S.hand[idx]; if(!id) return {ok:false};
  const ph=PBY[id], j=judgeAtS(S,ph,S.cur);
  if(!j) return {ok:false,reason:'span'};
  const last=ph.n[ph.n.length-1], anc=S.bars[S.cur][0].r;
  const pl={ph,i:S.cur,span:ph.bars,j,who:'J',grade:j.grade,lastPc:((anc+last.s)%12+12)%12};
  S.pl[S.cur]=pl; if(ph.bars===2) S.pl[S.cur+1]={cont:S.cur};
  S.placed.push(pl); S.cur+=ph.bars; S.hand.splice(idx,1);
  dealHand(S);
  return {ok:true,pl};
}
function undoCard(S){
  if(S.phase!=='fill'||!S.placed.length) return false;
  const pl=S.placed.pop(); S.cur=pl.i; S.pl[pl.i]=null; if(pl.span===2) S.pl[pl.i+1]=null;
  if(!S.hand.includes(pl.ph.id)) S.hand.unshift(pl.ph.id);
  if(S.hand.length>5){ const k=S.hand.findIndex((id,ix)=>ix>0&&judgeAtS(S,PBY[id],S.cur)&&judgeAtS(S,PBY[id],S.cur).grade!=='gold'); S.hand.splice(k<0?S.hand.length-1:k,1); }
  dealHand(S); return true;
}
function redrawHand(S){ if(S.phase!=='fill'||S.redraw<=0) return false; S.redraw--; S.hand=[]; dealHand(S); return true; }
const blockFull=S=>S.cur>=curBlock(S).to;

/* ---- 得点 ---- */
function scoreJ(S,pl,dry,cx){
  cx=cx||S;
  const G=S.G,P=S.P,ph=pl.ph,j=pl.j;
  const H=Math.min(1.15,j.score+(1-Math.min(1,j.score))*P.ear/300);
  const dif=ph.dif-((hasSpec(G,'fast')&&ph.tags.includes('fast'))?20:0);
  const ex=clamp((P.tech+25)/(dif+25),.45,1);
  let m=(.85+.3*P.tone/100)*(.88+.24*P.rhythm/100)*(.92+.16*P.expr/100)*ex*S.cond;
  const n=cx.use[ph.id]||0, dv=[1,.86,.7,.55,.45][Math.min(4,n)], fam=1-Math.min(.3,(G.fresh[ph.id]||0)*.05);
  m*=dv*fam;
  let bld=1; if(cx.lastPw>=0) bld=ph.pw>=cx.lastPw+2?1.05:ph.pw>=cx.lastPw-2?1:.96;
  m*=bld;
  const climax=(cx.jDone+ph.bars>=S.jTotal&&ph.pw>=cx.maxPw&&cx.jDone>0);
  if(climax) m*=1.1;
  if(!hasSpec(G,'circ')) m*=1-(cx.jDone/S.jTotal)*Math.max(0,(55-P.stam)/110);
  const kind=S.tune.kind;
  if(kind==='bal'&&hasSpec(G,'sub')) m*=1.15;
  if(kind==='blues'&&hasSpec(G,'blues')) m*=1.12;
  if(kind==='cc'&&hasSpec(G,'cc')) m*=1.12;
  if(ph.tags.includes('quote')&&hasSpec(G,'quote')) m*=1.12;
  if(G.rank>=3&&hasSpec(G,'nerv')) m*=.9;
  let squeak=false;
  if(!dry&&hasSpec(G,'reed')&&rnd()<(G.reed>0?.03:.09)){ m*=.7; squeak=true; }
  const base=60*Math.pow(Math.max(0,H),1.4)*(.5+.5*ph.pw/100);
  return {per:base*m,pts:base*m*ph.bars,squeak,dv:n,climax,bld};
}
function confirmJ(S){
  if(S.phase!=='fill'||!blockFull(S)) return null;
  const G=S.G, out=[];
  for(const pl of S.placed){
    const r=scoreJ(S,pl,false), ph=pl.ph, j=pl.j;
    pl.pts=r.pts; pl.r=r;
    S.jPts+=r.pts; S.jBars+=ph.bars; S.jDone+=ph.bars;
    let h=pl.grade==='gold'?6+((j.tags.includes('guide')||j.tags.includes('tension'))?2:0):pl.grade==='white'?2:-6;
    if(h>0) h*=.7+.6*S.P.expr/100;
    if(r.dv>=2) h-=3;
    if(ph.tags.includes('quote')&&hasSpec(G,'quote')) h+=8, S.tags.quote++;
    if(ph.tags.includes('hi')&&hasSpec(G,'hi')) h+=8;
    S.heat=clamp(S.heat+h,0,100);
    S.use[ph.id]=(S.use[ph.id]||0)+1; if(S.use[ph.id]>=3) S.tags.repeat++;
    S.lastPw=ph.pw; S.maxPw=Math.max(S.maxPw,ph.pw);
    S.tags[pl.grade]+=ph.bars;
    if(j.tags.includes('guide')) S.tags.guide++;
    if(j.tags.includes('link')) S.tags.link++;
    if(j.tags.includes('tension')) S.tags.tension++;
    if(j.tags.includes('avoid')) S.tags.avoid++;
    if(r.squeak) S.tags.squeak++;
    if(r.climax) S.tags.climax++;
    G.fresh[ph.id]=(G.fresh[ph.id]||0)+1;
    out.push(pl);
  }
  S.lastBlock=out; S.phase='jplay';
  return out;
}
/* ---- ライバル ---- */
function rivalBlock(S){
  const R=S.R, bl=curBlock(S), sk=R.sk*KN.rs[R.rank]*KN.rivalScale, G=S.G;
  const rth=clamp(Math.floor(1+sk/9),1,11), kind=S.tune.kind;
  const aff=R.like.includes(kind)?1.07:R.weak.includes(kind)?.88:1;
  const sty=STY[S.rid], out=[];
  let i=bl.from;
  while(i<bl.to){

function fnFits(S,ph,i){
  const bl=curBlock(S); if(i+ph.bars>bl.to) return false;

function pendCtx(S){
  const use=Object.assign({},S.use); let lastPw=S.lastPw, jDone=S.jDone, maxPw=S.maxPw;
  for(const p of S.placed){ use[p.ph.id]=(use[p.ph.id]||0)+1; lastPw=p.ph.pw; jDone+=p.span; maxPw=Math.max(maxPw,p.ph.pw); }

      const v=r.per*ph.bars*(1+(j.grade==='gold'?.04:j.grade==='red'?-.1:0));
      if(!best||v>best.v) best={v,ix,grade:j.grade};
    });
    if(best&&(best.grade==='gold'||S.redraw<=0||tries>0)) return placeCard(S,best.ix).ok;
    if(!redrawHand(S)) { if(best) return placeCard(S,best.ix).ok; return false; }

function runSession(S,placer){

        let g3=0; while(!blockFull(S)&&g3++<10){ const ix=S.hand.findIndex(id=>judgeAtS(S,PBY[id],S.cur)); if(ix<0){ redrawHand(S)||dealHand(S); if(S.hand.findIndex(id=>judgeAtS(S,PBY[id],S.cur))<0) break; continue; } placeCard(S,ix); }

/* --- 文脈（曲の小節）と、フレーズの価値 --- */
const CTXC={};
function tuneContexts(tid){
  if(CTXC[tid]) return CTXC[tid];
  const t=TUNES[tid], all=t._bars||(t._bars=parseForm(t.form)), st=t.sess[0], len=t.sess[1], bars=[];
  for(let i=0;i<len;i++) bars.push(all[(st+i)%all.length]);
  const m=new Map();
  for(let i=0;i<len;i++){
    const b1=[bars[i]], nx=bars[(i+1)%len];
    const k1='1|'+barSig(bars[i])+'|'+barSig(nx); if(!m.has(k1)) m.set(k1,{bars:b1,next:nx,w:0}); m.get(k1).w++;
    if(i+1<len){ const nx2=bars[(i+2)%len], k2='2|'+barSig(bars[i])+'>'+barSig(bars[i+1])+'|'+barSig(nx2); if(!m.has(k2)) m.set(k2,{bars:[bars[i],bars[i+1]],next:nx2,w:0}); m.get(k2).w++; }
  }
  return CTXC[tid]=Array.from(m.values());
}
function poolContexts(G){
  const ids=RANK_TUNES[G.rank].slice(); const b=BOSS_TUNE[G.rank]; ids.push(b,b);
  if(G.rank<5) for(const t of RANK_TUNES[G.rank+1]) if(!ids.includes(t)) ids.push(t);
  const m=new Map();
  for(const tid of ids){ const k=TUNES[tid].kind; for(const c of tuneContexts(tid)){ const key=c.bars.map(barSig).join('>')+'|'+barSig(c.next); if(!m.has(key)) m.set(key,{bars:c.bars,next:c.next,w:0}); m.get(key).w+=c.w; } }
  return Array.from(m.values());
}
function goldMatrix(G,ctx,list){
  return list.map(ph=>ctx.map(c=>{ if(c.bars.length!==ph.bars) return 0; const j=judgeCtx(G,ph,c.bars,c.next,null,G.th,G.st.theory,hasSpec(G,'blues')); return j.grade==='gold'?ph.pw:j.grade==='white'?ph.pw*.35:0; }));
}
function deckVal(mat,idx,ctx,set){
  let tot=0;
  for(let c=0;c<ctx.length;c++){
    let a=0,b=0,d=0; // top3
    for(const p of set){ const v=mat[p][c]; if(v>a){ d=b; b=a; a=v; } else if(v>b){ d=b; b=v; } else if(v>d){ d=v; } }
    tot+=ctx[c].w*(a+b*.6+d*.4);
  }
  return tot;
}
function autoShop(G,log){
  const ctx=poolContexts(G), list=PHR.filter(p=>unlocked(G,p)), idx={}; list.forEach((p,i)=>idx[p.id]=i);
  const mat=goldMatrix(G,ctx,list);
  let guard=0;
  while(guard++<8){
    const owned=G.phr.filter(id=>idx[id]!==undefined).map(id=>idx[id]);
    const base=deckVal(mat,idx,ctx,owned);
    let best=null;
    for(const id of G.stock){
      if(idx[id]===undefined) continue; const p=PBY[id], price=priceG(G,p);
      const gain=deckVal(mat,idx,ctx,owned.concat(idx[id]))-base;
      // 資金が足りないときは、価値の低いフレーズを売って作る
      let money=G.money, sells=[];
      if(money<price){
        const losses=owned.map(o=>({o,loss:base-deckVal(mat,idx,ctx,owned.filter(x=>x!==o)),id:list[o].id})).sort((a,b)=>a.loss-b.loss);
        let lsum=0;
        for(const l of losses){ if(G.phr.length-sells.length<=6) break; sells.push(l); lsum+=l.loss; money+=sellOf(PBY[l.id]); if(money>=price) break; }
        if(money<price||lsum>gain*.5) continue;
        const net=gain-lsum; if(net<=0) continue;
        if(!best||net>best.net) best={id,net,sells,price};
      } else {
        if(gain<=0) continue;
        const score=gain/(1+price/600);
        if(!best||score>best.net) best={id,net:score,sells:[],price};
      }
    }
    if(!best) break;
    if(best.net<(AUTO.minGain||40)) break;
    for(const s of best.sells){ shopSell(G,s.id); if(log) log.push('sell '+s.id); }
    const r=shopBuy(G,best.id); if(!r.ok) break; if(log) log.push('buy '+best.id);
  }
  // 楽器
  const gl=gearList(G);
  for(const it of gl){
    const need=it.id==='reed'?(G.reed<=0&&G.rank>=2&&G.money>=it.price+150):(G.money>=it.price+250);
    if(need){ gearBuy(G,it.id); if(log) log.push('gear '+it.id); }
  }
}

/* --- 1か月を通しで進める（シミュレーション用） --- */
function runMonth(G,pol,tr){
  monthStart(G);
  const e=rollEvent(G);
  if(e){ const b=evStart(G,e); if(b.ch){ const i=pol.evChoice(G,b); evChoose(G,b,i); } }
  pol.shop(G); pol.upgrade(G);
  const a=pol.act(G); const r=perform(G,a);
  if(tr) tr.push({m:G.month,a:a.k+(a.arg?':'+a.arg:''),fat:Math.round(G.fat),th:G.th,money:G.money});
  pol.shop(G); pol.upgrade(G);
  const su=sessionSetup(G);
  const tune=pol.join(G,su);
  if(tune){
    const S=newSession(G,tune,su.rid,{boss:su.boss}); runSession(S,pol.placer); applySession(G,S); G.lastRival=su.rid;
    if(tr) tr[tr.length-1].s=(S.res.win?'W':'L')+(su.boss?'B':'')+' '+tune+' '+su.rid+' '+S.res.aJ.toFixed(0)+'/'+S.res.aR.toFixed(0);

function simRun(policy,opt){
  opt=opt||{}; const pol=(policy==='bot'||policy==='human')?BOT_POL:AUTO_POL;

  const G=newGame(), tr=opt.trace?[]:null;
  while(!G.cleared&&!G.ended) runMonth(G,pol,tr);
  const r={cleared:G.cleared,months:G.cleared?G.clearMonth:MONTHS,rank:G.rank,ovr:ovr(G),wins:G.ses.win,sessions:G.ses.n,th:G.th,phr:G.phr.length,money:G.money,fame:Math.round(G.st.fame)};

}

function ac(){
  if(!AC){

      master=AC.createGain(); master.gain.value=.85; master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v||.05,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);

  else if(k==='unlock') { [523,659,784,1046,1319].forEach((f,i)=>tone(f,.16,'triangle',.06,i*.08)); }

function noiseHit(t,dur,freq,q,vol,type,dest){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=type||'highpass'; f.frequency.value=freq; f.Q.value=q||.7;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t,Math.random()*.5); s.stop(t+dur+.02);
}
function saxNote(t,midi,dur,vel,inst,dest){
  const off=inst==='trumpet'||inst==='soprano'?12:0, f=mtof(midi+off);
  const cut={tenor:1500,alto:2300,soprano:2800,trumpet:3600}[inst]||1500;
  const o=AC.createOscillator(), o2=AC.createOscillator(), fl=AC.createBiquadFilter(), g=AC.createGain();
  o.type='sawtooth'; o2.type=inst==='trumpet'?'square':'triangle';
  o.frequency.setValueAtTime(f*Math.pow(2,-35/1200),t); o.frequency.exponentialRampToValueAtTime(f,t+.045);
  const f2=f*(inst==='tenor'?.5:1); o2.frequency.setValueAtTime(f2*Math.pow(2,-35/1200),t); o2.frequency.exponentialRampToValueAtTime(f2,t+.045);
  fl.type='lowpass'; fl.frequency.setValueAtTime(cut*.5,t); fl.frequency.linearRampToValueAtTime(cut*(.7+vel*.6),t+.06); fl.Q.value=2.2;

    const lfo=AC.createOscillator(), lg=AC.createGain(); lfo.frequency.value=5.4; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(f*.012,t+dur*.8);
    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency); lfo.start(t); lfo.stop(t+dur+.05);
  }
  o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(dest);
  o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
  noiseHit(t,.05,2400,1.2,.05*vel,'bandpass',dest); // ブレス
}
function bassNote(t,midi,dur,dest){
  const o=AC.createOscillator(), g=AC.createGain(), fl=AC.createBiquadFilter();
  o.type='triangle'; o.frequency.value=mtof(midi); fl.type='lowpass'; fl.frequency.value=700;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);

}
function compNote(t,midi,dur,dest){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='triangle'; o.frequency.value=mtof(midi);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+.008); g.gain.exponentialRampToValueAtTime(.0005,t+dur);

/* ---- 譜面 → 音のイベント ---- */
const rootMidi=r=>55+(((r-55)%12)+12)%12;
const COMP={maj7:[4,11,14],m7:[3,10,14],'7':[4,10,14],'7b':[4,10,14],'7alt':[4,10,13],m7b5:[3,6,10],m6:[3,9,14],dim7:[3,6,9]};
function swingT(b,sw){ const fl=Math.floor(b+1e-6), f=b-fl; if(f<1e-6) return fl; return fl+(f<.5?f*(sw/.5):sw+(f-.5)*((1-sw)/.5)); }
/* S: セッション / blk: ブロック / sold: 'J' or 'R' / 戻り値: イベント配列と全長（秒） */
function blockEvents(bars,pls,from,to,bpm,speed,inst,soloPls){
  const bd=60/bpm/speed, ev=[], sw=.64;
  const nb=to-from;
  for(let k=0;k<nb;k++){
    const bar=bars[from+k], nxt=bars[Math.min(bars.length-1,from+k+1)], t0=k*4;
    const segAt0=b=>{ let t=0; for(const c of bar){ t+=c.b; if(b<t-1e-6) return c; } return bar[bar.length-1]; };
    for(let j=0;j<4;j++){
      const c=segAt0(j), first=(j===0||segAt0(j-1)!==c);
      const root=28+(((c.r-28)%12)+12)%12;
      let m=root;
      if(first) m=root;
      else if(j===3){ const nr=28+(((nxt[0].r-28)%12)+12)%12; m=nr+(((k+from)%2)?1:-1); }
      else if(j%2===1) m=root+(c.q==='maj7'||c.q==='7'||c.q==='7b'||c.q==='7alt'?4:3);
      else m=root+(c.q==='m7b5'||c.q==='dim7'?6:7);
      ev.push({k:'bass',t:swingT(t0+j,sw),m,d:.9});
    }
    // ライド：チン・チーン・チカ・チーン…
    for(const b of [0,1,1.5,2,3,3.5]) ev.push({k:'ride',t:swingT(t0+b,sw),v:b%1?.55:1});
    ev.push({k:'hat',t:t0+1},{k:'hat',t:t0+3});
    // ピアノのコンピング
    const comps=[0,k%2?2.5:1.5];
    for(const b of comps){ const c=segAt0(Math.floor(b)); const rm=48+(((c.r-48)%12)+12)%12; for(const iv of COMP[c.q]) ev.push({k:'comp',t:swingT(t0+b,sw),m:rm+iv,d:.45}); }
  }
  // ソロ
  for(const pl of soloPls){
    if(!pl||!pl.ph) continue;
    const anc=bars[pl.i][0].r, rt=rootMidi(anc);
    for(const n of pl.ph.n){
      const b0=(pl.i-from)*4+n.b, b1=b0+n.d;
      const ts=swingT(b0,sw), te=swingT(b1,sw);
      ev.push({k:'sax',t:ts,m:rt+n.s,d:Math.max(.08,(te-ts)*.92),v:pl.grade==='red'?.8:1,inst});
    }
  }
  return {ev,bd,total:nb*4};
}
let musicBus=null;
function stopMusic(){
  if(musicBus&&AC){ try{ const b=musicBus; b.gain.cancelScheduledValues(AC.currentTime); b.gain.setValueAtTime(b.gain.value,AC.currentTime); b.gain.linearRampToValueAtTime(0,AC.currentTime+.05); setTimeout(()=>{ try{ b.disconnect(); }catch(e){} },200); }catch(e){} }

}
function playEvents(R){
  if(muted||!ac()) return;
  stopMusic();
  const bus=AC.createGain(); bus.gain.value=1; bus.connect(master); musicBus=bus;
  const t0=AC.currentTime+.06, bd=R.bd;
  for(const e of R.ev){
    const t=t0+e.t*bd;
    if(e.k==='sax') saxNote(t,e.m,e.d*bd,e.v,e.inst||'tenor',bus);
    else if(e.k==='bass') bassNote(t,e.m,e.d*bd,bus);
    else if(e.k==='ride') noiseHit(t,.14,7000,.8,.05*e.v,'highpass',bus);
    else if(e.k==='hat') noiseHit(t,.06,3500,.8,.06,'highpass',bus);

const DEMO={maj7:'Cmaj7',m7:'Dm7','7':'G7','7b':'F7b','7alt':'G7alt',m7b5:'Em7b5',m6:'Dm6',dim7:'Edim7','m7/7':'Dm7/G7','maj7/7':'Bbmaj7/G7','7b/7':'F7b/C7','m7>7':'Dm7 G7','7>maj7':'G7 Cmaj7','m7b5>7alt':'Em7b5 A7alt'};

/* セッション画面 */
function drawSess(g,t,dt,S,soloist,heat){
  const W=360,H=110; g.clearRect(0,0,W,H);
  const G=S.G, rank=G.rank;
  drawBg(g,W,H,rank,t,'sess');
  // スポットライト
  const px=soloist==='R'?270:90;
  g.fillStyle='rgba(255,240,180,.16)'; g.beginPath(); g.moveTo(px-6,0); g.lineTo(px-40,H); g.lineTo(px+40,H); g.lineTo(px+6,0); g.closePath(); g.fill();
  const playing=ST.play!=null;
  drawSaxist(g,90,H-4,{t,playing:playing&&soloist==='J',col:'#3A4A8A',hat:'beret',s:.8});
  const R=S.R;
  drawSaxist(g,270,H-4,{t:t+1,playing:playing&&soloist==='R',col:R.col,hair:R.hair,inst:R.inst==='soprano'?'alto':R.inst,flip:true,s:.8,hat:R.boss?'beret':null,hatCol:'#222',glasses:R.n!=='ミサキ'&&R.n!=='リコ'});
  // 観客のシルエット（熱気で増える）
  const n=Math.round(4+heat/100*18);
  for(let i=0;i<n;i++){
    const cx=(i+.5)*(W/n), jump=heat>50?Math.abs(Math.sin(t*5+i))*Math.min(6,heat/15):0;
    g.fillStyle=`hsl(${260+i*7},35%,${10+Math.min(heat,100)/10}%)`;
    g.beginPath(); g.arc(cx,H-4-jump,6,0,7); g.fill(); g.fillRect(cx-6,H-4-jump,12,6);
  }
  if(playing&&Math.random()<.25) addNotes(soloist==='R'?250:110,H-46,1);
  drawNotes(g,dt);
}

function sessionPrompt(){
  const G=ST.G, su=sessionSetup(G); ST.suCache=su;
  const R=RIVALS[su.rid], boss=su.boss;
  const opts=su.tunes.map(t=>{
    const T=TUNES[t], hint=[];
    if(knowsWeak(G,su.rid)&&R.weak.includes(T.kind)) hint.push('💡'+R.n+'の苦手な曲！');
    if(R.like.includes(T.kind)&&(G.scout[su.rid]||0)>=1) hint.push('⚠'+R.n+'の得意な曲');
    return {t:'🎵 '+T.n+'（'+T.key+'）',s:TUNE_KIND_N[T.kind]+'　'+T.bpm+'BPM　'+(T.fmt==='solo'?'ソロ':'トレード')+'　'+hint.join(' ')};
  });
  const sub=VENUES[G.rank].kind+'「'+VENUE_SHORT[G.rank]+'」\n相手：'+R.n+'（'+R.sty+'）'+((G.scout[su.rid]||0)>=1?'\n🔎 '+R.sig:'')+(boss?'\n🔥 昇格戦！ 勝てば '+(G.rank>=5?'クリア！':'ランクアップ！'):'')+'\n疲労が高いと演奏がにぶる。';
  opts.push({t:'今月はセッションに出ない',s:'疲労をためない'});
  choose(boss?'🔥 昇格戦':'🎤 今月のセッション',sub,opts,i=>{
    if(i>=su.tunes.length) return monthFinish();
    startSession(su.tunes[i],su);
  },{auto:()=>{ const t=AUTO_POL.join(G,su); pickChoice(t?su.tunes.indexOf(t):su.tunes.length); }});

function sNext(){

function setSMsg(t){ $('sMsg').textContent=t; }

/* ---- セッション画面の描画 ---- */
const GJ={gold:'金',white:'白',red:'赤'};
function chordHtml(bar){
  if(bar.length===1) return `<div class="c">${esc(chordName(bar[0]))}</div>`;
  return `<div class="c two">${bar.map(c=>esc(chordName(c))).join(' ')}</div>`;
}
function renderChart(){
  const S=ST.S; if(!S) return;
  let h='';
  const play=ST.play;
  for(let i=0;i<S.len;i++){
    const bl=S.blocks.find(b=>i>=b.from&&i<b.to), p=S.pl[i];
    let cls='bc '+bl.who;
    const blkNow=S.bi>=0?curBlock(S):null;
    if(ST.sphase==='fill'&&blkNow&&blkNow.who==='J'&&i===S.cur&&S.cur<blkNow.to) cls+=' cur';
    if(play&&i>=play.from&&i<play.to&&Math.floor(play.t/play.bd/4)+play.from===i) cls+=' play';
    let ph='';
    if(p&&p.cont!==undefined){ cls+=' cont '+S.pl[p.cont].grade; ph='<div class="p">↳つづき</div>'; }
    else if(p&&p.ph){ const shown=(bl.who==='R')||(i<S.cur&&bl.who==='J')||ST.sphase!=='fill'||(blkNow&&bl.from!==blkNow.from); cls+=' '+p.grade; ph=`<div class="p">${esc(p.ph.name)}</div>`+(p.pts!=null&&p.pts>0&&S.bi>=0&&revealed(S,i)?`<span class="pt">${Math.round(p.pts)}</span>`:''); }
    const k=S.bars[i];
    h+=`<div class="${cls}" data-i="${i}"><div class="n">${i+1}</div>${chordHtml(k)}<div class="f">${k.map(c=>QFN[c.q]).join(' ')}</div>${ph}</div>`;
  }
  $('chart').innerHTML=h;
}
function revealed(S,i){
  // 演奏が終わった（または演奏中でいま過ぎた）小節だけ得点を見せる
  const bl=S.blocks.find(b=>i>=b.from&&i<b.to), bi=S.blocks.indexOf(bl);
  if(bi<S.bi) return true;
  if(bi>S.bi) return false;
  if(ST.play&&ST.play.blk===bi) return Math.floor(ST.play.t/ST.play.bd/4)+ST.play.from>i||ST.play.done;
  return ST.sphase==='between'||ST.sphase==='rdone';
}
function renderHand(){
  const S=ST.S; if(!S) return;
  const fill=ST.sphase==='fill';
  let h='';
  for(let i=0;i<5;i++){
    const id=S.hand[i];
    if(!id||!fill){ h+=`<div class="hc empty"></div>`; continue; }
    const ph=PBY[id], j=judgeAtS(S,ph,S.cur);
    if(!j){ h+=`<div class="hc nofit" data-i="${i}"><b>${esc(ph.name)}</b><span class="pw">強${ph.pw} 難${ph.dif}</span><span class="tg">${ph.bars}小節（入らない）</span></div>`; continue; }
    const tags=[]; if(ph.bars===2) tags.push('2小節'); for(const t of ph.tags){ const m={quote:'引用',blues:'ブルース',bop:'バップ',fast:'速い',hi:'高音',alt:'オルタード',mode:'モード',guide:'ガイド',bal:'バラード',cc:'CC',minor:'マイナー',long:'ロング'}[t]; if(m) tags.push(m); }
    h+=`<div class="hc ${j.grade}" data-i="${i}"><b>${esc(ph.name)}</b><span class="pw">強${ph.pw} 難${ph.dif}</span><span><span class="g">${GJ[j.grade]}</span></span><span class="tg">${esc(tags.slice(0,2).join('・'))}</span></div>`;
  }
  $('hand').innerHTML=h;
  $('undoBtn').disabled=!fill||!S.placed.length;
  $('redrawBtn').disabled=!fill||S.redraw<=0; $('redrawBtn').textContent='🔄 チェンジ('+S.redraw+')';
  $('playBtn').disabled=!(fill&&blockFull(S));
}
function renderSess(){
  const S=ST.S; if(!S) return;
  $('sTune').textContent=S.tune.n+'（'+S.tune.key+'）';
  $('sInfo').textContent=S.tune.bpm+'BPM　'+(S.tune.fmt==='solo'?'ソロ':'トレード')+'　vs '+S.R.n;
  renderChart(); renderHand();
  $('heatI').style.width=S.heat+'%'; $('heatV').textContent=Math.round(S.heat);
}
function judgeText(pl,bar){
  const j=pl.j, ph=pl.ph, t=[];
  if(j.tags.includes('guide')) t.push('ガイドトーンが次のコードへ解決！');
  if(j.tags.includes('link')) t.push('ガイドトーンの連結！');
  if(j.tags.includes('tension')) t.push('テンションがおしゃれ！');
  if(j.tags.includes('avoid')) t.push('アボイドノートが拍の頭に……');
  if(j.tags.includes('approach')) t.push('半音のアプローチ音');
  const ch=bar.map(c=>chordName(c)).join(' → ');
  const u=ST.S.use[ph.id]||0;
  if(u>=1) t.push('同じフレーズ('+(u+1)+'回め)：観客が慣れてきた');
  return '「'+ph.name+'」→ '+ch+'：'+GJ[pl.grade]+'（'+Math.round(j.score*100)+'点）\n'+(t.join(' ')||(pl.grade==='gold'?'コードにぴったり！':pl.grade==='white'?'悪くないけど、もっと合うフレーズがありそう。':'コードに合っていない。取り消して選びなおそう。'));
}
function playCard(i){
  const S=ST.S; if(!S||ST.sphase!=='fill') return false;
  const bar=S.bars.slice(S.cur,S.cur+(PBY[S.hand[i]]||{bars:1}).bars).flat();
  const r=placeCard(S,i);
  if(!r.ok){ sfx('bad'); if(r.reason==='span') setSMsg('そのフレーズは2小節。残りが1小節だと置けないよ。'); return false; }
  sfx(r.pl.grade==='gold'?'gold':r.pl.grade==='white'?'good':'bad');
  setSMsg(judgeText(r.pl,bar));
  if(!ST.auto||true) previewShort(r.pl);
  renderSess();
  return true;
}
function previewShort(pl){ /* 置いた瞬間に、その小節の音を少しだけ鳴らす */
  if(muted||!ac()||ST.auto) return;
  const S=ST.S, R=blockEvents(S.bars,null,pl.i,pl.i+pl.span,S.tune.bpm,1.3,'tenor',[pl]); playEvents(R);
}
function undo(){ const S=ST.S; if(S&&ST.sphase==='fill'&&undoCard(S)){ sfx('click'); setSMsg('とりけした。'); renderSess(); } }
function redraw(){ const S=ST.S; if(S&&ST.sphase==='fill'&&redrawHand(S)){ sfx('card'); setSMsg('手札をチェンジした。'); renderSess(); } }
function startPlayJ(){

function startPlay(bl,pls,who){
  const S=ST.S, speed=ST.auto?(who==='R'?10:7):1;
  const R=blockEvents(S.bars,null,bl.from,bl.to,S.tune.bpm,speed,who==='R'?S.R.inst:'tenor',pls);

function playDone(){
  const S=ST.S, p=ST.play; p.done=true;
  ST.sphase=p.who==='J'?'between':'rdone'; ST.sT=0;
  if(p.who==='J'){
    const g=p.pls.filter(x=>x.grade==='gold').length;
    const sq=p.pls.some(x=>x.r&&x.r.squeak);
    setSMsg('ジョンのソロ終了！　合計 '+Math.round(p.pls.reduce((a,x)=>a+x.pts,0))+'点　熱気 '+Math.round(S.heat)+(sq?'\n🎷 ピーッ！ リードミス……':''));
    if(sq) sfx('squeak');
  } else {
    const g=p.pls.filter(x=>x.grade==='gold').length;
    setSMsg(S.R.n+'のソロ終了。　合計 '+Math.round(p.pls.reduce((a,x)=>a+x.pts,0))+'点');
  }

}

$('deckClose').addEventListener('click',()=>{ hideOv('deckOv'); stopMusic(); ST.mode='menu'; });

/* ---- ダイソンの店 ---- */
function openShop(){
  ST.mode='shop'; ST.fx='shop'; ST.shopLine=DY.greet; ST.shopTab='buy'; ac(); renderShop(); showOv('shopOv'); sfx('click');
}
function renderShop(){
  const G=ST.G; let list='';
  if(ST.shopTab==='buy'){
    const st=G.stock.map(id=>PBY[id]).sort((a,b)=>a.pw-b.pw);
    list=st.length?st.map(p=>{ const pr=priceG(G,p), prem=G.prem&&G.prem.includes(p.id); return phraseRow(p,G,`<button class="pl" data-pv="${p.id}">▶</button><button data-buy="${p.id}" ${G.money<pr?'disabled':''}>${prem?'★':''}¥${pr}</button>`,false); }).join(''):'<p class="sub">品ぞろえは売り切れだ。来月また来たまえ。</p>';
    const locked=PHR.filter(p=>!unlocked(G,p)&&p.tier<=maxTier(G)).length;
    if(locked) list+=`<p class="sub">（理論カードが足りなくて、まだ扱えないフレーズが ${locked} 種類ある）</p>`;
  } else if(ST.shopTab==='sell'){
    list=G.phr.map(id=>PBY[id]).sort((a,b)=>a.pw-b.pw).map(p=>phraseRow(p,G,`<button class="pl" data-pv="${p.id}">▶</button><button data-sell="${p.id}" ${G.phr.length<=4?'disabled':''}>吸わせる ¥${sellOf(p)}</button>`,false)).join('');
  } else {
    list=gearList(G).map(it=>`<div class="pr"><div><b>${esc(it.n)}</b><br><small>${esc(it.d)}</small></div><div class="btns"><button data-gear="${it.id}" ${G.money<it.price?'disabled':''}>¥${it.price}</button></div></div>`).join('')+
      `<p class="sub">いまの楽器：${esc(SAX[G.gear.sax].n)} / ${esc(MPS[G.gear.mp].n)}${G.reed>0?'（リード：あと'+G.reed+'か月）':''}</p>`;
  }
  $('shopBody').innerHTML=`<div class="dyl"><b>ダイソン</b><br>${esc(ST.shopLine)}</div><div class="tabs"><button class="${ST.shopTab==='buy'?'on':''}" data-tab="buy">買う（与える）</button><button class="${ST.shopTab==='sell'?'on':''}" data-tab="sell">売る（吸わせる）</button><button class="${ST.shopTab==='gear'?'on':''}" data-tab="gear">楽器</button></div><div style="text-align:right;font-weight:800;color:var(--gold)">所持金 💴 ${G.money}</div>${list}`;
  renderStatus();
}
$('shopBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return; const G=ST.G;
  if(b.dataset.tab){ ST.shopTab=b.dataset.tab; sfx('click'); if(ST.shopTab==='gear') ST.shopLine=DY.gear; }
  else if(b.dataset.pv){ ac(); previewPhrase(PBY[b.dataset.pv]); return; }
  else if(b.dataset.buy){ const r=shopBuy(G,b.dataset.buy); ST.shopLine=r.line||ST.shopLine; sfx(r.ok?'buy':'bad'); }
  else if(b.dataset.sell){ const r=shopSell(G,b.dataset.sell); ST.shopLine=r.line||ST.shopLine; sfx(r.ok?'suck':'bad'); if(r.ok) setTimeout(()=>sfx('buy'),250); }
  else if(b.dataset.gear){ const r=gearBuy(G,b.dataset.gear); ST.shopLine=r.line||ST.shopLine; sfx(r.ok?'buy':'bad'); }
  renderShop();
});
$('shopClose').addEventListener('click',()=>{ hideOv('shopOv'); stopMusic(); ST.mode='menu'; ST.fx='idle'; renderStatus(); });

/* ---- あそびかた ---- */
const HOW=`毎月、行動を1つ選ぶ（1行動＝1か月）。月末のセッションに出て、ライバルに勝とう。10年（120か月）以内に、NYの伝説「キング・ブロウ」を倒せばクリア！

■ 行動
・練習：経験点（筋力・技術・理論・感性）がたまる。疲れる。
・理論の勉強：理論カードが解放され、使えるフレーズが増える。
・町を歩く：スポットでフレーズやライバルの情報を手に入れる。
・バイト：お金。ダイソンの店でフレーズを買うのに使う。
・師匠に習う：お金がかかるが効果が大きい。
・休む：疲労回復。やる気アップ。
・ダイソンの店：フレーズの売り買い（行動を使わない）。

■ セッション
曲のコード進行（譜面）に、手札のフレーズを置いて演奏する。合うかどうかは、本物の音楽理論で判定！
・金：コードにぴったり　白：まあまあ　赤：合わない
・拍の頭（1・3拍目）にコードトーン（1・3・5・7）だと高評価
・テンション（9・11・13）はおしゃれ、アボイドノートは減点
・コードが変わる所で3度か7度に半音で解決すると大ボーナス
・同じフレーズのくり返しは観客が慣れて減点
・後半ほど強いフレーズを置くと盛り上がる

ランクごとの勝ち数に達すると昇格戦。🤖 オート（Oキー）にすると、プロの動きで最後まで見られるよ。`;
$('howBtn').addEventListener('click',()=>{ sfx('click'); choose('あそびかた',HOW,[{t:'とじる'}],()=>{ showOv('titleOv'); ST.mode='title'; },{left:true}); hideOv('titleOv'); });

/* ---- セッションのクリックとボタン ---- */
$('hand').addEventListener('click',e=>{ const c=e.target.closest('.hc'); if(c&&c.dataset.i!==undefined&&ST.mode==='sess') { ac(); playCard(+c.dataset.i); } });
$('undoBtn').addEventListener('click',()=>{ if(ST.mode==='sess') undo(); });
$('redrawBtn').addEventListener('click',()=>{ if(ST.mode==='sess') redraw(); });
$('playBtn').addEventListener('click',()=>{ if(ST.mode==='sess'){ ac(); sfx('click'); startPlayJ(); } });
$('msg').addEventListener('click',()=>{ if(ST.mode==='msg') nextLine(); });
$('startBtn').addEventListener('click',()=>{ sfx('click'); startNew(); });
$('contBtn').addEventListener('click',startCont);
$('autoStartBtn').addEventListener('click',()=>{ setAuto(true); });
$('autoBtn').addEventListener('click',()=>setAuto(!ST.auto));
$('muteBtn').addEventListener('click',()=>setMute(!muted));

/* ---- オートの頭脳（月の行動） ---- */
function autoMenu(){
  const G=ST.G;
  const log=[]; autoShop(G,log); autoUpgrade(G);
  const buys=log.filter(x=>x.startsWith('buy')).map(x=>PBY[x.slice(4)].name), sells=log.filter(x=>x.startsWith('sell')).map(x=>PBY[x.slice(5)].name);
  renderStatus();
  const go=()=>{
    const a=autoAct(G);
    if(a.k==='walk'){ const sp=bestSpot(G,walkChoices(G)); a.arg=sp.id; }
    runAction(a);
  };
  if(buys.length||sells.length){
    ST.fx='shop'; sfx('buy');
    say([['ダイソン',(sells.length?'「'+sells.join('」「')+'」を吸わせてもらったよ。':'')+(buys.length?'「'+buys.join('」「')+'」をあげよう。':'')]],go);
  } else go();
}
function sessAuto(dt){
  const S=ST.S; ST.sT+=dt;
  if(ST.sphase==='fill'){
    if(ST.sT>.1){
      ST.sT=0;
      if(!blockFull(S)){ if(!autoPlace(S)){ /* 置けないとき */ redrawHand(S); dealHand(S); } const pl=S.placed[S.placed.length-1]; if(pl){ setSMsg(judgeText(pl,S.bars.slice(pl.i,pl.i+pl.span).flat())); } renderSess(); }
      else startPlayJ();
    }
  } else if(ST.sphase==='rintro'){ if(ST.sT>.1){ startPlayR(); } }
  else if(ST.sphase==='between'||ST.sphase==='rdone'){ if(ST.sT>.2){ afterBlock(); } }
}

/* ---- 更新 ---- */
let lastSetBar=-1;
function update(dt){
  ST.t+=dt; ST.mt+=dt;
  // 手動のセッション進行
  if(ST.mode==='sess'){
    if(ST.play&&!ST.play.done){
      ST.play.t+=dt;
      const bi=Math.floor(ST.play.t/ST.play.bd/4);
      if(bi!==ST.play.last){ ST.play.last=bi; renderChart(); }
      if(ST.play.t>=ST.play.dur) playDone();
    } else if(ST.auto){ sessAuto(dt); }
    else if(ST.sphase==='rintro'){ ST.sT+=dt; if(ST.sT>1.1) startPlayR(); }
    else if(ST.sphase==='between'||ST.sphase==='rdone'){ ST.sT+=dt; if(ST.sT>1.8) afterBlock(); }
  }
  if(!ST.auto) return;
  ST.at+=dt;
  switch(ST.mode){
    case 'msg': { const l=ST.q[ST.qi]; const need=.12+Math.min(.3,(l?l[1].length:0)*.004); if(ST.mt>=need) nextLine(); break; }
    case 'menu': if(ST.at>.1){ ST.at=0; autoMenu(); } break;
    case 'choose': if(ST.at>.15){ ST.at=0; if(ST.ch&&ST.ch.auto) ST.ch.auto(); else pickChoice(0); } break;
    case 'end': if(ST.at>.7){ ST.at=0; if(ST.endCb){ const c=ST.endCb; ST.endCb=null; c(); } } break;
    case 'title': if(ST.at>.5){ ST.at=0; startNew(); } break;
    default: if(ST.mode!=='sess'&&ST.mode!=='wait'&&ST.at>.5){ ST.at=0; autoRecover(); }
  }
}
function autoRecover(){
  // 手動用の画面が開いたままオートになったときは、閉じてメニューに戻る
  for(const id of ['upOv','thOv','deckOv','shopOv','cardOv']){ if(!$(id).hidden){ $(id).hidden=true; ST.mode='menu'; } }
  if(ST.mode==='shop'||ST.mode==='up'||ST.mode==='theory'||ST.mode==='deck'||ST.mode==='card') ST.mode='menu';
}

/* ---- キー入力 ---- */
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k==='o'||k==='O'){ setAuto(!ST.auto); return; }
  if(k==='m'||k==='M'){ setMute(!muted); return; }
  if(ST.auto&&e.isTrusted) setAuto(false);
  if(k==='Enter'||k===' '){
    if(ST.mode==='msg'){ e.preventDefault(); nextLine(); return; }
    if(ST.mode==='sess'){ e.preventDefault(); if(ST.sphase==='fill') startPlayJ(); return; }
    if(ST.mode==='end'&&ST.endCb){ e.preventDefault(); const c=ST.endCb; ST.endCb=null; c(); return; }
  }
  if(ST.mode==='menu'){
    if(k>='1'&&k<='7') { const ids=['practice','study','walk','job','master','rest','shop']; const b=document.querySelector(`.act[data-a="${ids[+k-1]}"]`); if(b&&!b.disabled) menuAct(ids[+k-1]); }
    else if(k==='u'||k==='U') openUp(); else if(k==='d'||k==='D') openDeck(); else if(k==='t'||k==='T') openTheory(); else if(k==='s'||k==='S') openShop();
  } else if(ST.mode==='choose'){ if(k>='1'&&k<='9') pickChoice(+k-1); else if(k==='Escape'&&ST.ch&&ST.ch.cancel) $('chCancel').click(); }
  else if(ST.mode==='sess'){
    if(k>='1'&&k<='5'){ ac(); playCard(+k-1); } else if(k==='z'||k==='Z') undo(); else if(k==='r'||k==='R') redraw();
  } else if(k==='Escape'){ for(const id of ['upOv','thOv','deckOv','shopOv','cardOv']) if(!$(id).hidden) $(id.replace('Ov','Close')==='shopClose'?'shopClose':id.replace('Ov','Close')).click(); }
});
// 人が触ったらオートを止める
addEventListener('pointerdown',e=>{
  if(!ST.auto||!e.isTrusted) return;
  if(e.target.closest&&e.target.closest('#autoBtn,#autoStartBtn,#muteBtn')) return;
  if(ST.mode==='title') return;
  setAuto(false);
},true);

/* ---- メインループ ---- */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  update(dt); draw(dt);
  requestAnimationFrame(frame);
}
function draw(dt){
  const sc=$('scene').getContext('2d');
  if($('sessOv').hidden) drawMain(sc,ST.t,dt,ST.fx,ST.G);
  else if(ST.S){ const bl=ST.S.bi>=0?curBlock(ST.S):null; drawSess(ST.S.cv||(ST.S.cv=$('sCv').getContext('2d')),ST.t,dt,ST.S,ST.play?ST.play.who:(bl?bl.who:'J'),ST.S.heat); }
}

/* ---- テストフック ---- */
function toChord(c){ return typeof c==='string'?parseChord(c):c; }
function hookJudge(phrase,chord,opts){
  let ph=phrase;
  if(typeof phrase==='string') ph=PBY[phrase];
  else if(Array.isArray(phrase)){ // [[半音,拍,長さ],...]
    const n=phrase.map(a=>({s:a[0],b:a[1],d:a[2]})); const end=Math.max(...n.map(x=>x.b+x.d)); ph={id:'custom',n,bars:end>4?2:1};
  }
  let ch=chord;
  if(typeof chord==='string') ch=chord.includes(' ')?chord.split(/\s+/).map(s=>[parseChord(s)]):parseChord(chord);
  const o=Object.assign({},opts||{}); if(typeof o.next==='string') o.next=parseChord(o.next);
  return judge(ph,ch,o);
}
function hookAct(name){
  const G=ST.G; if(!G) return false;
  if(ST.mode==='msg'){ nextLine(); return true; }
  const [k,arg]=name.split(':');
  if(k==='pick'){ if(ST.mode==='choose'){ pickChoice(+arg); return true; } return false; }
  if(ST.mode!=='menu') return false;
  if(k==='practice') { runAction({k:'practice',arg:arg||'long'}); return true; }
  if(k==='study'||k==='rest'||k==='master'){ if(k==='master'&&G.money<masterCost(G)) return false; runAction({k}); return true; }
  if(k==='walk'){ const sp=arg?SPOTS.find(s=>s.id===arg):bestSpot(G,walkChoices(G)); runAction({k:'walk',arg:sp.id}); return true; }
  if(k==='job'){ runAction({k:'job',arg:arg||jobList(G)[0].id}); return true; }
  if(k==='shop'){ openShop(); return true; }
  if(k==='up'){ openUp(); return true; }
  if(k==='theory'){ openTheory(); return true; }
  if(k==='deck'){ openDeck(); return true; }
  if(k==='card'){ openCards(); return true; }
  return false;
}
const J={
  get G(){ return ST.G; }, get S(){ return ST.S; }, get mode(){ return ST.mode; }, get phase(){ return ST.sphase; },
  get month(){ return ST.G?ST.G.month:0; }, get year(){ return ST.G?year(ST.G):0; }, get rank(){ return ST.G?ST.G.rank:0; },
  get stats(){ return ST.G?Object.assign({},ST.G.st):null; }, get exp(){ return ST.G?Object.assign({},ST.G.exp):null; },
  get fatigue(){ return ST.G?ST.G.fat:0; }, get motivation(){ return ST.G?ST.G.mot:0; }, get money(){ return ST.G?ST.G.money:0; },
  get hand(){ return ST.S&&ST.mode==='sess'?ST.S.hand.slice():[]; }, get phrases(){ return ST.G?ST.G.phr.slice():[]; },
  get auto(){ return ST.auto; },
  step(dt){ update(dt==null?1/60:dt); },
  act:hookAct,
  playCard(i){ return playCard(i); },
  play(){ startPlayJ(); },
  setAuto(b){ setAuto(b); },
  start(){ startNew(); }, cont(){ startCont(); }, title(){ titleScreen(); },
  next(){ if(ST.mode==='msg') nextLine(); },
  judge:hookJudge,
  simRun(policy,opt){ const keep=ST.G; const r=simRun(policy||'auto',opt); delete r.G; return r; },
  PHRASES:PHR, TUNES, RIVALS, KN,
  setSeed,
  skip(){ let n=0; while(ST.mode==='msg'&&n++<200) nextLine(); },
};
window.__jazz=J;

/* ---- 起動 ---- */
setMute(muted); setAutoUi(); titleScreen();
requestAnimationFrame(frame);
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
