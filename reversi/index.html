<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="白黒ひっくり返す、あのボードゲーム。CPU対戦（よわい〜鬼）とふたり対戦、待ったあり。勝負を分けた一手がわかる解析グラフつき。">
<title>リバーシ</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="data:,">
<style>
html,body{touch-action:manipulation}
:root{--bg:#07150f;--bg2:#0f2a1d;--pan:#17402b;--pan2:#1f5a3b;--ink:#effaf2;--mute:#9fc7ae;--gold:#ffd36b;--red:#ff6b6b;--cyan:#7fe8ff;--win:#6dffb1;--lose:#ff7b8f;--bs:min(calc(100vw - 20px),calc(100dvh - 310px),540px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#1d5a3a 0%,var(--bg2) 40%,var(--bg) 100%);padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;align-items:center;gap:6px;padding:6px 10px;flex:none}
#top a{color:var(--ink);text-decoration:none;font-weight:800;font-size:13px;white-space:nowrap;padding:6px 4px}
#top h1{flex:1;margin:0;text-align:center;font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.15em}
.mini{font-size:13px;font-weight:800;padding:7px 10px;border-radius:999px;background:var(--pan);color:var(--ink);white-space:nowrap}
.mini[aria-pressed=true]{background:var(--gold);color:#143020}
#sndBtn[aria-pressed=false]{opacity:.6}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
/* title */
#title{align-items:center;text-align:center;overflow-y:auto}
.hero{display:grid;grid-template-columns:repeat(2,38px);gap:3px;margin:6px auto 2px;perspective:300px}
.hero i{width:38px;height:38px;border-radius:50%;display:block;box-shadow:0 3px 5px rgba(0,0,0,.5)}
.hero i.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%,#000)}
.hero i.w{background:radial-gradient(circle at 35% 30%,#fff,#e6e6e6 60%,#b5b5b5)}
.hero i.f{animation:heroflip 3s ease-in-out infinite}
@keyframes heroflip{0%,40%{transform:rotateY(0)}60%,100%{transform:rotateY(180deg)}}
#title h2{margin:2px 0 0;font-size:28px;line-height:1.2;color:var(--gold);text-shadow:0 0 18px #2fd17a;letter-spacing:.12em}
#title h2 small{display:block;font-size:12px;color:var(--cyan);letter-spacing:.3em;margin-bottom:2px}
#title .lead{margin:4px 0 8px;font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;width:100%;margin:5px 0}
.row>button{flex:1;padding:10px 6px;border-radius:12px;background:var(--pan);font-weight:800;border:2px solid transparent;font-size:14px}
.row>button[aria-pressed=true]{border-color:var(--gold);background:var(--pan2)}
.row>button small{display:block;font-weight:600;font-size:11px;color:var(--mute)}
.lvs>button{padding:9px 2px}
.lvdesc{min-height:20px;font-size:12px;color:var(--mute);margin:0 0 4px}
.big{width:100%;padding:14px;border-radius:16px;background:linear-gradient(180deg,#ffe28a,#ffb73b);color:#3a2000;font-size:19px;font-weight:900;box-shadow:0 4px 0 #b57400;margin-top:6px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b57400}
.bests{width:100%;margin-top:10px;font-size:12px;color:var(--mute);background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px;text-align:left}
.bests table{width:100%;border-collapse:collapse}
.bests td,.bests th{padding:2px 4px;text-align:center;font-weight:700}
.bests th{color:var(--cyan);font-size:11px}.bests td:first-child{text-align:left;color:var(--ink)}
.keys{margin:8px 0 0;font-size:11px;color:var(--mute)}
/* play */
#play{gap:6px;align-items:center}
#play.fin{--bs:min(calc(100vw - 20px),calc(100dvh - 440px),540px)}
#play.fin #msg{display:none}
#score{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;width:var(--bs);flex:none}
.side{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid transparent;transition:.2s;min-width:0}
.side.w{flex-direction:row-reverse}
.side .dot{width:24px;height:24px;border-radius:50%;flex:none}
.side.b .dot{background:radial-gradient(circle at 35% 30%,#666,#111 60%,#000);box-shadow:0 0 0 1px #888}
.side.w .dot{background:radial-gradient(circle at 35% 30%,#fff,#e6e6e6 60%,#b5b5b5)}
.side .nm{font-size:11px;color:var(--mute);font-weight:700;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.w .nm{text-align:right}
.side b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;min-width:1.4em;text-align:center}
.side.on{border-color:var(--gold);background:rgba(255,211,107,.15);box-shadow:0 0 14px rgba(255,211,107,.35)}
#mid{text-align:center;font-size:11px;color:var(--mute);font-weight:700;line-height:1.3;min-width:46px}
#mid b{display:block;font-size:16px;color:var(--ink)}
#boardWrap{position:relative;width:var(--bs);height:var(--bs);flex:none}
#board{width:100%;height:100%;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);gap:2px;padding:6px;border-radius:14px;background:#0a4a28;box-shadow:0 8px 24px rgba(0,0,0,.55),inset 0 0 0 2px #0e6b3a}
.cell{position:relative;background:#1c8f4f;border-radius:3px;perspective:240px;cursor:pointer}
.cell.h:after{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;margin:-13%;border-radius:50%;background:rgba(255,255,255,.4);animation:hint 1.6s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.35);opacity:.6}}
.cell.cur{outline:3px solid var(--gold);outline-offset:-3px;z-index:2}
.cell.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.cell.crit:before{content:"";position:absolute;inset:-1px;border:3px solid var(--red);border-radius:5px;z-index:3;animation:crit 1s ease-in-out infinite;pointer-events:none}
@keyframes crit{50%{box-shadow:0 0 12px 3px var(--red)}}
.st{position:absolute;inset:9%;transform-style:preserve-3d;display:none}
.st[data-c]{display:block}
.st[data-c=w]{transform:rotateY(180deg)}
.fb,.fw{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fb{background:radial-gradient(circle at 35% 30%,#6a6a6a,#1a1a1a 55%,#000);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.fw{background:radial-gradient(circle at 35% 30%,#fff,#ececec 55%,#b9b9b9);box-shadow:0 2px 3px rgba(0,0,0,.5);transform:rotateY(180deg)}
.cell.lm .st:after{content:"";position:absolute;left:50%;top:50%;width:18%;height:18%;margin:-9%;border-radius:50%;background:var(--red);z-index:2;transform:translateZ(1px)}
@keyframes toW{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(1.22)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes toB{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(90deg) scale(1.22)}100%{transform:rotateY(0) scale(1)}}
@keyframes pop{0%{transform:scale(1.9);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 22px;border-radius:14px;background:rgba(10,20,15,.88);border:2px solid var(--gold);color:var(--gold);font-size:22px;font-weight:900;letter-spacing:.1em;pointer-events:none;white-space:nowrap;z-index:5}
#pro{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.72);color:var(--cyan);font-size:13px;font-weight:800;white-space:nowrap;pointer-events:none;z-index:4;border:1px solid rgba(127,232,255,.5)}
#msg{width:var(--bs);min-height:22px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);flex:none}
#msg.think{color:var(--cyan)}
#msg.think:after{content:"";display:inline-block;width:1.6em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:var(--bs);flex:none}
#ctl button{padding:9px 2px;border-radius:12px;background:var(--pan);font-size:12px;font-weight:800;white-space:nowrap}
#ctl button[aria-pressed=true]{background:var(--gold);color:#143020}
#ctl button:disabled{opacity:.35;cursor:default}
#ctl button.warn{background:var(--lose);color:#2b0010}
/* result */
#res{width:var(--bs);flex:1 1 auto;min-height:0;overflow-y:auto;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px;text-align:center}
#res h3{margin:0;font-size:26px;font-weight:900;letter-spacing:.06em}
#res h3.win{color:var(--win)}#res h3.lose{color:var(--lose)}#res h3.draw{color:var(--gold)}
#res .fin{font-size:15px;font-weight:800;margin:2px 0}
#res .rec{font-size:12px;color:var(--mute);margin:2px 0 4px}
#res svg{width:100%;height:auto;display:block;background:rgba(0,0,0,.2);border-radius:10px}
#crit{font-size:13px;font-weight:800;color:var(--gold);margin:4px 0}
.gtt{font-size:11px;color:var(--mute);text-align:left;margin:4px 0 0}
.rb{display:flex;gap:8px;margin-top:8px}
.rb button,.rb a{flex:1;padding:11px 6px;border-radius:12px;background:var(--pan2);font-weight:800;font-size:14px;color:var(--ink);text-decoration:none;text-align:center}
.rb .go{background:linear-gradient(180deg,#ffe28a,#ffb73b);color:#3a2000}
@media (prefers-reduced-motion:reduce){.cell.h:after,.hero i.f{animation:none}}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <a href="../" id="back">← 一覧</a>
  <h1>リバーシ</h1>
  <button id="autoBtn" class="mini" aria-pressed="false" title="Oキーでも切りかえ">🤖 オート</button>
  <button id="sndBtn" class="mini" aria-pressed="true" aria-label="音">🔊</button>
 </header>

 <main id="title" class="scr">
  <div class="hero" aria-hidden="true"><i class="b"></i><i class="w f"></i><i class="w f"></i><i class="b"></i></div>
  <h2><small>REVERSI</small>リバーシ</h2>
  <p class="lead">白黒ひっくり返す、あのボードゲーム。<br>角をとれば、きっと勝てる。</p>
  <div class="row" id="modeRow">
   <button data-mode="cpu" aria-pressed="true">CPU対戦<small>ひとりであそぶ</small></button>
   <button data-mode="two" aria-pressed="false">ふたりで<small>1台で交代</small></button>
  </div>
  <div id="cpuOpt" style="width:100%">
   <div class="row" id="colRow">
    <button data-col="1" aria-pressed="true">● 黒<small>先手</small></button>
    <button data-col="2" aria-pressed="false">○ 白<small>後手</small></button>
   </div>
   <div class="row lvs" id="lvRow">
    <button data-lv="0" aria-pressed="false">よわい</button>
    <button data-lv="1" aria-pressed="true">ふつう</button>
    <button data-lv="2" aria-pressed="false">つよい</button>
    <button data-lv="3" aria-pressed="false">鬼</button>
   </div>
   <p class="lvdesc" id="lvDesc"></p>
  </div>
  <button class="big" id="startBtn">はじめる</button>
  <div class="bests" id="bests"></div>
  <p class="keys">PC：矢印キー＋Enter／スペースで置く　U 待った　H ヒント　O オート</p>
 </main>

 <main id="play" class="scr" hidden>
  <div id="score">
   <div class="side b" id="sB"><i class="dot"></i><span class="nm" id="nmB">黒</span><b id="nB">2</b></div>
   <div id="mid"><span id="midT">手数</span><b id="midN">0</b></div>
   <div class="side w" id="sW"><i class="dot"></i><span class="nm" id="nmW">白</span><b id="nW">2</b></div>
  </div>
  <div id="boardWrap">
   <div id="board" role="grid" aria-label="リバーシの盤面"></div>
   <div id="toast" hidden></div>
   <div id="pro" hidden></div>
  </div>
  <div id="msg" role="status"></div>
  <div id="ctl">
   <button id="undoBtn">待った</button>
   <button id="hintBtn" aria-pressed="true">ヒント</button>
   <button id="resBtn">投了</button>
   <button id="restBtn">最初から</button>
   <button id="titleBtn">タイトル</button>
  </div>
  <section id="res" hidden>
   <h3 id="resT">あなたの勝ち！</h3>
   <div class="fin" id="resFin"></div>
   <div class="rec" id="resRec"></div>
   <div id="graph"></div>
   <div id="crit"></div>
   <div class="rb"><button class="go" id="againBtn">もう一回</button><a href="../">← ゲーム一覧にもどる</a></div>
  </section>
 </main>
</div>
<script>
(()=>{
'use strict';
/* ================= エンジン（ワーカーにもそのまま渡す） ================= */
//ENGINE-START
function engineFactory(){
'use strict';
const DIRS=new Int8Array([-11,-10,-9,-1,1,9,10,11]);
const SQ=new Uint8Array(64);{let n=0;for(let y=0;y<8;y++)for(let x=0;x<8;x++)SQ[n++]=11+y*10+x;}
const T8=[100,-25,10,5,5,10,-25,100,-25,-50,-2,-2,-2,-2,-50,-25,10,-2,3,1,1,3,-2,10,5,-2,1,0,0,1,-2,5,
          5,-2,1,0,0,1,-2,5,10,-2,3,1,1,3,-2,10,-25,-50,-2,-2,-2,-2,-50,-25,100,-25,10,5,5,10,-25,100];
const PT=new Int16Array(100);for(let s=0;s<64;s++)PT[SQ[s]]=T8[s];
const ORDER=Uint8Array.from(Array.from(SQ).sort((a,b)=>PT[b]-PT[a]));
const CORNERS=[11,18,81,88];
const CADJ=[[12,21,22],[17,28,27],[71,82,72],[78,87,77]];
const CED=[[1,10],[-1,10],[1,-10],[-1,-10]];
const ST=new Uint8Array(4096);
const MV=[],KS=[];for(let i=0;i<90;i++){MV.push(new Uint8Array(32));KS.push(new Int16Array(32));}
const INF=1e9;
const now=()=>typeof performance!=='undefined'?performance.now():Date.now();
let nodes=0,deadline=0,abort=false,PURE=false,NOISE=0;

function init(){const b=new Int8Array(100).fill(3);for(let s=0;s<64;s++)b[SQ[s]]=0;b[44]=2;b[55]=2;b[45]=1;b[54]=1;return b;}
function doMove(b,i,me,sp){const opp=3-me,s0=sp;
 for(let k=0;k<8;k++){const d=DIRS[k];let j=i+d;if(b[j]!==opp)continue;let e=j;do{e+=d}while(b[e]===opp);
  if(b[e]===me){for(let m=j;m!==e;m+=d){b[m]=me;ST[sp++]=m;}}}
 if(sp===s0)return -1;b[i]=me;return sp;}
function undo(b,i,me,s0,s1){const o=3-me;for(let q=s0;q<s1;q++)b[ST[q]]=o;b[i]=0;}
function gen(b,me,out){const opp=3-me;let n=0;
 for(let s=0;s<64;s++){const i=ORDER[s];if(b[i]!==0)continue;
  for(let k=0;k<8;k++){const d=DIRS[k];let j=i+d;if(b[j]!==opp)continue;do{j+=d}while(b[j]===opp);if(b[j]===me){out[n++]=i;break;}}}
 return n;}
function mob(b,me){const opp=3-me;let n=0;
 for(let s=0;s<64;s++){const i=SQ[s];if(b[i]!==0)continue;
  for(let k=0;k<8;k++){const d=DIRS[k];let j=i+d;if(b[j]!==opp)continue;do{j+=d}while(b[j]===opp);if(b[j]===me){n++;break;}}}
 return n;}
function count(b){let a=0,w=0;for(let s=0;s<64;s++){const v=b[SQ[s]];if(v===1)a++;else if(v===2)w++;}return [a,w];}
function evaluate(b,me){
 const opp=3-me;let pos=0,mc=0,oc=0,fm=0,fo=0,emp=0;
 for(let s=0;s<64;s++){const i=SQ[s],v=b[i];if(v===0){emp++;continue;}
  let fr=0;if(!PURE){for(let k=0;k<8;k++)if(b[i+DIRS[k]]===0){fr=1;break;}}
  if(v===me){pos+=PT[i];mc++;fm+=fr;}else{pos-=PT[i];oc++;fo+=fr;}}
 let cm=0,co=0,stm=0,sto=0;
 for(let c=0;c<4;c++){const q=CORNERS[c],v=b[q];if(v===0)continue;
  const sg=v===me?1:-1;if(sg>0)cm++;else co++;
  const adj=CADJ[c];for(let a=0;a<3;a++){const w=b[adj[a]];if(w!==0)pos+=(w===me?1:-1)*(4-PT[adj[a]]);}
  if(!PURE){for(let e=0;e<2;e++){const d=CED[c][e];let j=q+d,n=0;while(b[j]===v){n++;j+=d;}if(sg>0)stm+=n;else sto+=n;}}}
 const t=emp/60;let sc=pos;
 if(PURE){sc+=(mc-oc)*(1-t)*(1-t)*4;}
 else{
  sc+=(mob(b,me)-mob(b,opp))*(7+11*t);
  sc+=(cm-co)*30;sc+=(stm-sto)*9;sc-=(fm-fo)*(2+5*t);
  sc+=(mc-oc)*(1-t)*(1-t)*7;}
 if(NOISE)sc+=(Math.random()-.5)*NOISE;
 return sc;}
function finalScore(b,me){const c=count(b);let d=me===1?c[0]-c[1]:c[1]-c[0];const e=64-c[0]-c[1];
 if(d>0)d+=e;else if(d<0)d-=e;return d>0?2000+d*20:d<0?-2000+d*20:0;}
function orderMoves(b,me,mv,n,ks,sp){const opp=3-me;
 for(let q=0;q<n;q++){const i=mv[q];const s2=doMove(b,i,me,sp);ks[q]=mob(b,opp)*10-PT[i];undo(b,i,me,sp,s2);}
 for(let a=1;a<n;a++){const m=mv[a],k=ks[a];let j=a-1;while(j>=0&&ks[j]>k){mv[j+1]=mv[j];ks[j+1]=ks[j];j--;}mv[j+1]=m;ks[j+1]=k;}}
function nega(b,me,depth,alpha,beta,passed,ply,sp){
 if((++nodes&2047)===0&&now()>deadline)abort=true;
 if(abort)return 0;
 if(depth<=0)return evaluate(b,me);
 const opp=3-me,mv=MV[ply];const n=gen(b,me,mv);
 if(n===0){if(passed)return finalScore(b,me);return -nega(b,opp,depth,-beta,-alpha,true,ply+1,sp);}
 if(depth>=3&&n>1)orderMoves(b,me,mv,n,KS[ply],sp);
 let best=-INF;
 for(let q=0;q<n;q++){const i=mv[q];const s2=doMove(b,i,me,sp);
  const v=-nega(b,opp,depth-1,-beta,-alpha,false,ply+1,s2);undo(b,i,me,sp,s2);
  if(abort)return 0;
  if(v>best){best=v;if(v>alpha){alpha=v;if(alpha>=beta)break;}}}
 return best;}
function solve(b,me,alpha,beta,passed,emp,ply,sp,mc,oc){
 if((++nodes&4095)===0&&now()>deadline)abort=true;
 if(abort)return 0;
 if(emp===0)return mc-oc;
 const opp=3-me;let best=-65,any=false;
 if(emp>6){const mv=MV[ply];const n=gen(b,me,mv);
  if(n>1)orderMoves(b,me,mv,n,KS[ply],sp);
  for(let q=0;q<n;q++){any=true;const i=mv[q];const s2=doMove(b,i,me,sp),f=s2-sp;
   const v=-solve(b,opp,-beta,-alpha,false,emp-1,ply+1,s2,oc-f,mc+f+1);undo(b,i,me,sp,s2);
   if(abort)return 0;
   if(v>best){best=v;if(v>alpha){alpha=v;if(alpha>=beta)break;}}}
 }else{
  for(let s=0;s<64;s++){const i=ORDER[s];if(b[i]!==0)continue;
   const s2=doMove(b,i,me,sp);if(s2<0)continue;any=true;const f=s2-sp;
   const v=-solve(b,opp,-beta,-alpha,false,emp-1,ply+1,s2,oc-f,mc+f+1);undo(b,i,me,sp,s2);
   if(abort)return 0;
   if(v>best){best=v;if(v>alpha){alpha=v;if(alpha>=beta)break;}}}}
 if(!any){if(passed){const d=mc-oc;return d>0?d+emp:d<0?d-emp:0;}
  return -solve(b,opp,-beta,-alpha,true,emp,ply+1,sp,oc,mc);}
 return best;}
const LV=[{},
 {maxDepth:3,timeMs:1e5,pure:1,exact:0,exactExtra:0,noise:16},
 {maxDepth:6,timeMs:300,exact:10,exactExtra:300,noise:2},

  if(tok!==G.tok||!vals)return;

 const X=k=>6+k*(W-12)/n, Y=v=>H/2-Math.max(-m,Math.min(m,v))/m*(H/2-8);
 let d='';P.forEach((v,k)=>{d+=(k?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1);});
 const area=d+'L'+X(P.length-1).toFixed(1)+' '+(H/2)+'L'+X(0).toFixed(1)+' '+(H/2)+'Z';
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="評価グラフ"><line x1="0" x2="'+W+'" y1="'+H/2+'" y2="'+H/2+'" stroke="#9fc7ae" stroke-dasharray="3 3" opacity=".6"/>'
  +'<path d="'+area+'" fill="rgba(109,255,177,.15)"/><path d="'+d+'" fill="none" stroke="#6dffb1" stroke-width="2.2" stroke-linejoin="round"/>';
 if(bk>=0&&G.crit>=0)s+='<circle cx="'+X(bk+1).toFixed(1)+'" cy="'+Y(P[bk+1]).toFixed(1)+'" r="5.5" fill="#ff6b6b" stroke="#fff" stroke-width="1.5"/>';
 s+='<text x="6" y="12" fill="#9fc7ae" font-size="9" font-weight="700">'+(G.mode==='cpu'?'あなた':'黒')+'が有利 ↑</text><text x="6" y="'+(H-4)+'" fill="#9fc7ae" font-size="9" font-weight="700">↓ 相手が有利</text></svg>';
 $('#graph').innerHTML=s+'<div class="gtt">評価の推移（CPUの読み）。赤丸が勝負を分けた一手</div>';}

/* ================= タイトル ================= */
function renderTitle(){
 $$('#modeRow button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===G.mode));
 $$('#colRow button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.col===G.human));
 $$('#lvRow button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lv===G.level));
 $('#cpuOpt').hidden=G.mode!=='cpu';
 $('#lvDesc').textContent=LVD[G.level];
 let h='<table><tr><th></th><th>勝</th><th>敗</th><th>分</th><th>最大差</th></tr>';
 SV.rec.forEach((r,k)=>{h+='<tr><td>'+LVN[k]+'</td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+r.d+'</td><td>'+(r.bd||'-')+'</td></tr>';});
 h+='</table><div style="margin-top:4px">連勝 いま '+SV.streak+'／最高 '+SV.bestStreak+'</div>';
 $('#bests').innerHTML=h;}
function startGame(){SV.mode=G.mode;SV.human=G.human;SV.level=G.level;save();newGame();}
$('#modeRow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.mode=b.dataset.mode;renderTitle();});
$('#colRow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.human=+b.dataset.col;renderTitle();});
$('#lvRow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.level=+b.dataset.lv;renderTitle();});
$('#startBtn').addEventListener('click',()=>{ac();startGame();});

/* ================= 操作 ================= */
boardEl.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;ac();G.kb=false;onCell(+c.dataset.i);});
$('#undoBtn').addEventListener('click',undo);
$('#hintBtn').addEventListener('click',toggleHint);
$('#resBtn').addEventListener('click',resign);
$('#restBtn').addEventListener('click',restart);
$('#titleBtn').addEventListener('click',toTitle);
$('#againBtn').addEventListener('click',()=>{ac();newGame();});
function toggleHint(){SV.hint=!SV.hint;save();$('#hintBtn').setAttribute('aria-pressed',SV.hint);paint(null);}
function setSnd(){$('#sndBtn').setAttribute('aria-pressed',SV.snd);$('#sndBtn').textContent=SV.snd?'🔊':'🔇';}
$('#sndBtn').addEventListener('click',()=>{SV.snd=!SV.snd;save();setSnd();if(SV.snd)tone(660,.08,'triangle',.2);});
function setAuto(on){
 on=!!on;if(G.auto===on)return;
 G.auto=on;$('#autoBtn').setAttribute('aria-pressed',on);
 G.tok++;G.thinking=false;
 if(on){ac();
  if(G.phase==='title')startGame();
  else if(G.phase==='play'){timers=[];startTurn();}
  else if(G.phase==='result'){const tok=G.tok;later(1500,()=>{if(tok===G.tok&&G.auto&&G.phase==='result')nextAuto();});}
 }else{$('#pro').hidden=true;
  if(G.phase==='play'){timers=[];startTurn();}
  if(G.phase==='result'){}
 }
 if(G.phase==='play')paint(null);
}
$('#autoBtn').addEventListener('click',()=>setAuto(!G.auto));
document.addEventListener('pointerdown',e=>{if(G.auto&&!e.target.closest('#autoBtn'))setAuto(false);},true);
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='o'||k==='O'){setAuto(!G.auto);return;}
 if(['Shift','Tab','Control','Alt','Meta'].indexOf(k)<0&&G.auto)setAuto(false);
 if(G.phase==='play'&&!G.over){
  const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-8,ArrowDown:8}[k];
  if(mv){e.preventDefault();G.kb=true;if(G.cur<0)G.cur=27;
   let x=G.cur&7,y=G.cur>>3;if(k==='ArrowLeft')x=Math.max(0,x-1);if(k==='ArrowRight')x=Math.min(7,x+1);if(k==='ArrowUp')y=Math.max(0,y-1);if(k==='ArrowDown')y=Math.min(7,y+1);
   G.cur=y*8+x;paint(null);return;}
  if(k==='Enter'||k===' '){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();G.kb=true;if(G.cur<0)G.cur=27;ac();onCell(G.cur);paint(null);return;}
  if(k==='u'||k==='U'){undo();return;}
 }
 if(k==='h'||k==='H'){if(G.phase==='play')toggleHint();return;}
 if(G.phase==='result'&&(k==='Enter'||k===' ')){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();newGame();}
});

/* ================= フレーム ================= */
let lastT=0;
function frame(t){const dt=Math.min(100,t-lastT);lastT=t;advance(dt);requestAnimationFrame(frame);}

/* ================= テスト用フック ================= */
function boardArr(){const a=[];for(let y=0;y<8;y++){const r=[];for(let x=0;x<8;x++)r.push(G.b[idxM(y*8+x)]);a.push(r);}return a;}
function playout(lb,lw,o){o=o||{};const b=E.init();let turn=1,ply=0;const times=[];
 const rnd=o.rand||0;
 for(;;){const mv=E.moves(b,turn);
  if(!mv.length){if(!E.moves(b,3-turn).length)break;turn=3-turn;continue;}
  let m;
  if(ply<rnd)m=mv[Math.floor(Math.random()*mv.length)];
  else{const t=performance.now();const r=E.search(b,turn,turn===1?lb:lw,o.over);times.push(performance.now()-t);m=r.move;}
  E.apply(b,m,turn);turn=3-turn;ply++;}
 const c=E.count(b);const e=64-c[0]-c[1];let d=c[0]-c[1];if(d>0)d+=e;else if(d<0)d-=e;
 return {diff:d,black:c[0],white:c[1],plies:ply,times};}
window.__reversi={
 state(){const c=E.count(G.b);return {phase:G.phase,mode:G.mode,level:G.level,human:G.human,auto:G.auto,turn:G.turn,over:G.over,board:boardArr(),
  counts:{b:c[0],w:c[1]},legal:G.over?[]:E.moves(G.b,G.turn).map(i=>{const k=idx64(i);return [k&7,k>>3];}),moves:G.hist.length,
  thinking:G.thinking,undone:G.undone,result:G.result,ana:G.ana?{bk:G.ana.bk,bd:G.ana.bd,n:G.ana.P.length}:null,hint:SV.hint};},
 place(x,y){return onCell(y*8+x);},
 setAuto,setLevel(n){G.level=n;renderTitle();},setMode(m,human,level){G.mode=m;if(human)G.human=human;if(level!==undefined)G.level=level;renderTitle();},
 start(){startGame();},title(){toTitle();},undo,resign(){resign();resign();},
 step(dt){stepTime(dt);},sync(v){SYNC=!!v;},
 playout,engine:E,best(){return JSON.parse(JSON.stringify(SV));},reset(){SV.rec=[0,1,2,3].map(()=>({w:0,l:0,d:0,bd:0}));SV.streak=0;SV.bestStreak=0;save();renderTitle();},
 hasWorker(){return !!worker;},
 setBoard(arr,turn){for(let y=0;y<8;y++)for(let x=0;x<8;x++)G.b[idxM(y*8+x)]=arr[y][x];G.turn=turn;for(let k=0;k<64;k++)shown[k]=-1;paint(null);},
 finishNow(){finish(null);}
};

/* ================= 初期化 ================= */
setSnd();$('#hintBtn').setAttribute('aria-pressed',SV.hint);renderTitle();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
