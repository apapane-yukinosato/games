<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1〜3さいの子向け。たべものをゆびでどうぶつの口へはこぶと「もぐもぐ」。タップだけでもOK。">
<title>もぐもぐ ごはん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--bg:#FFF8E8;--ink:#4A3A2A;--card:#FFFFFF;--line:#F2DCB0;--mute:#A08A70;--pink:#FF8A5A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:800;color:#E0703A}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));padding-top:calc(6px + env(safe-area-inset-top,0px))}
#wrap{position:relative;flex:1;min-height:0;margin-top:4px}
#cv{display:block;width:100%;height:100%;border-radius:18px;touch-action:none}
#bar{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px;justify-content:center}
.sc{flex:1;max-width:64px;height:52px;border:3px solid var(--line);border-radius:18px;background:rgba(255,255,255,.85);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.sc.on{border-color:var(--pink);box-shadow:0 0 0 3px #FFE0CC}
.sc i{position:absolute;right:2px;top:-2px;font-size:12px;font-style:normal}
.sc.endless{max-width:72px;font-size:12px;font-weight:800;flex-direction:column;line-height:1.1}
.sc.endless.on{background:#FFE27A;border-color:#E0A820}
.keys{font-size:11px;color:var(--mute);text-align:center;margin:4px 0 0}
@media (pointer:coarse){.keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>もぐもぐ ごはん</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap"><canvas id="cv" width="360" height="480" aria-label="たべものをどうぶつの口へはこぶ画面"></canvas><div id="bar"></div></div>
  <p class="keys">ドラッグで口へはこぶ（タップでもOK）　1〜6 どうぶつ　E ずっと　O オート　M 音</p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(rnd()*a.length)];
const W=360,H=480;
const cv=$('cv'), SG=cv.getContext('2d');
/* ================= full-screen stage (same as the other kids' games) ================= */
const stage=document.createElement('canvas'); stage.width=720; stage.height=960;
const FIT={s:1,dx:0,dy:0};
function fitCanvas(){ const r=cv.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1); const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr)); if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } }
const edge=document.createElement('canvas'); const eg=edge.getContext('2d'); let edgeKey=null, edgeWait=0;
function present(key){ if(key!==edgeKey){ edgeKey=key; edgeWait=2; } if(edgeWait>0&&--edgeWait===0){ edge.width=stage.width; edge.height=stage.height; eg.drawImage(stage,0,0); }
  const src=edgeWait>0?stage:edge, sg=SG, SW=stage.width, SH=stage.height, cw=cv.width, ch=cv.height, s=Math.min(cw/SW,ch/SH), dw=SW*s, dh=SH*s, dx=(cw-dw)/2, dy=(ch-dh)/2; FIT.s=s; FIT.dx=dx; FIT.dy=dy;
  if(dy>0){ sg.drawImage(src,0,0,SW,2,0,0,cw,dy+2); sg.drawImage(src,0,SH-2,SW,2,0,dy+dh-2,cw,ch-dy-dh+2); }
  if(dx>0){ sg.drawImage(src,0,0,2,SH,0,dy,dx+2,dh); sg.drawImage(src,SW-2,0,2,SH,dx+dw-2,dy,cw-dx-dw+2,dh); }
  sg.drawImage(stage,dx,dy,dw,dh); }
function toStage(e){ const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*cv.width, py=(e.clientY-r.top)/r.height*cv.height;
  return [clamp((px-FIT.dx)/FIT.s/2,0,W),clamp((py-FIT.dy)/FIT.s/2,0,H)]; }
addEventListener('resize',fitCanvas); fitCanvas();
const g=stage.getContext('2d');

/* ================= data ================= */
// each animal has favorite foods (a big "だいすき！") but eats anything
const ANIMALS=[
  {e:'🐰',n:'うさぎさん',fav:['🥕','🥬'],bg:['#D8F0C8','#F4FFE8'],cry:[[900,.08,1300],[900,.08,1300]]},
  {e:'🐵',n:'おさるさん',fav:['🍌','🍑'],bg:['#CDEBC0','#EAF8DC'],cry:[[800,.1,1400],[900,.15,1600]]},
  {e:'🐶',n:'わんちゃん',fav:['🍖','🦴'],bg:['#FFE8C8','#FFF6E8'],cry:[[600,.12],[600,.12]]},
  {e:'🐼',n:'ぱんださん',fav:['🎋','🍎'],bg:['#E0F2E0','#F6FFF2'],cry:[[350,.2,450]]},
  {e:'🐱',n:'ねこちゃん',fav:['🐟','🥛'],bg:['#FFE4EC','#FFF4F8'],cry:[[700,.35,500]]},
  {e:'🐻',n:'くまさん',fav:['🍯','🍓'],bg:['#F2E0C8','#FFF4E4'],cry:[[220,.3,180]]},
];
const ALL_FOOD=['🥕','🍌','🍖','🍎','🐟','🍯','🍓','🍙','🍪','🍇','🍑','🥬','🧀','🍰','🥛','🍞','🌽','🍉'];
const MOUTH={x:180,y:205,r:46}, GOAL=6;
const S={endless:(()=>{ try{ return localStorage.getItem('moguEndless')==='1'; }catch(e){ return false; } })(),
  ai:0,foods:[],parts:[],fed:0,chew:0,say:null,clearT:0,t:0,auto:false,manual:false,autoT:0,drag:null,hand:null,blink:0,
  best:(()=>{ try{ return JSON.parse(localStorage.getItem('moguBest')||'null')||{fed:0,clears:{}}; }catch(e){ return {fed:0,clears:{}}; } })()};
function saveBest(){ if(S.auto) return; try{ localStorage.setItem('moguBest',JSON.stringify(S.best)); }catch(e){} }
const an=()=>ANIMALS[S.ai];
const SLOTS=[[60,410],[140,420],[220,420],[300,410]];

function startAnimal(i){ S.ai=(i+ANIMALS.length)%ANIMALS.length; S.fed=0; S.chew=0; S.say=null; S.clearT=0; S.parts=[]; S.drag=null; S.foods=[];
  for(let k=0;k<4;k++) refill(k); renderBar(); speak(`${an().n}、おなかすいたな。あーん`); sfx('start'); }
function refill(k){ const a=an(); const e=rnd()<.45?pick(a.fav):pick(ALL_FOOD.filter(f=>!a.fav.includes(f)));
  S.foods[k]={e,slot:k,x:SLOTS[k][0],y:SLOTS[k][1],hx:SLOTS[k][0],hy:SLOTS[k][1],st:'come',sc:0,t:0,fly:null}; }

/* ================= eating ================= */
function eat(f){ const a=an(), fav=a.fav.includes(f.e); f.st='gone'; S.chew=1.2; S.fed++; S.best.fed++;
  S.say={t:0,txt:fav?'だいすき！':pick(['おいしい！','もぐもぐ','ぱくっ！'])};
  for(let k=0;k<(fav?14:6);k++){ const ang=rnd()*Math.PI*2, sp=60+rnd()*120; S.parts.push({k:fav?'heart':'crumb',x:MOUTH.x,y:MOUTH.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-60,t:0}); }
  sfx('munch'); cry(a); speak(fav?'だいすき！':'もぐもぐ、おいしい');
  const k=f.slot; S.foods[k]=null; S.refillT=S.refillT||[]; S.refillT[k]=.7;
  if(S.fed>=GOAL&&S.clearT<=0){ S.clearT=3.4; S.best.clears[a.e]=1; saveBest(); renderBar(); } }
function inMouth(x,y){ return Math.hypot(x-MOUTH.x,y-MOUTH.y)<MOUTH.r+26; }
function foodAt(x,y){ let b=null,bd=50; for(const f of S.foods){ if(!f||f.st!=='rest') continue; const d=Math.hypot(f.x-x,f.y-y); if(d<bd){ bd=d; b=f; } } return b; }

/* ================= input ================= */
function down(x,y){ ac(); S.parts.push({k:'ring',x,y,t:0}); if(S.clearT>0) return;
  const f=foodAt(x,y); if(f){ S.drag={f,ox:f.x-x,oy:f.y-y,sx:x,sy:y,moved:0}; f.st='drag'; sfx('pick'); return; }
  if(Math.hypot(x-180,y-180)<110){ S.boing=.6; cry(an()); speak(pick(['あーん','おなかすいた'])); } }
function move(x,y){ const D=S.drag; if(!D) return; D.f.x=x+D.ox; D.f.y=y+D.oy; D.moved=Math.max(D.moved,Math.hypot(x-D.sx,y-D.sy)); }
function up(x,y){ const D=S.drag; if(!D) return; S.drag=null; const f=D.f;
  if(inMouth(f.x,f.y)) return eat(f);
  if(D.moved<12){ f.st='fly'; f.fly={x0:f.x,y0:f.y,t:0}; return; }   // a tap sends the food flying into the mouth
  f.st='back'; sfx('boing'); }

/* ================= update ================= */
function update(dt){
  S.t+=dt; S.blink-=dt; if(S.blink<-3.2) S.blink=.15; if(S.boing>0) S.boing-=dt; if(S.chew>0) S.chew-=dt;
  if(S.say){ S.say.t+=dt; if(S.say.t>1.4) S.say=null; }
  if(S.refillT) S.refillT.forEach((v,k)=>{ if(v>0){ S.refillT[k]-=dt; if(S.refillT[k]<=0&&S.clearT<=0) refill(k); } });
  for(const f of S.foods){ if(!f) continue;
    if(f.st==='come'){ f.sc=Math.min(1,f.sc+dt*4); if(f.sc>=1) f.st='rest'; }   // food pops up on its plate
    else if(f.st==='back'){ f.x+=(f.hx-f.x)*dt*8; f.y+=(f.hy-f.y)*dt*8; if(Math.hypot(f.x-f.hx,f.y-f.hy)<1){ f.x=f.hx; f.y=f.hy; f.st='rest'; } }
    else if(f.st==='fly'){ const F=f.fly; F.t+=dt*1.8; const k=Math.min(1,F.t); f.x=F.x0+(MOUTH.x-F.x0)*k; f.y=F.y0+(MOUTH.y-F.y0)*k-Math.sin(k*Math.PI)*90; if(k>=1) eat(f); } }
  for(const p of S.parts){ p.t+=dt; if(p.vx!=null){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.k==='heart'?-20:300)*dt; } if(p.k==='conf') p.rot+=dt*5; }
  S.parts=S.parts.filter(p=>p.t<(p.k==='conf'?4:p.k==='ring'?.5:1.2));
  if(S.clearT>0){ const was=S.clearT; S.clearT-=dt; if(was>2.6&&S.clearT<=2.6){ speak('おなかいっぱい！ ごちそうさま'); sfx('yay'); confetti(); } if(S.clearT<=0){ S.clearT=0; startAnimal(S.endless?S.ai:S.ai+1); } }
  if(S.auto) autoTick(dt);
}
// auto: picks a food (favorites first) and carries it to the mouth like a finger would
function autoTick(dt){
  if(S.clearT>0){ S.hand=null; return; }
  if(S.autoCarry){ const C=S.autoCarry; C.t+=dt*1.4; const k=Math.min(1,C.t); const x=C.x0+(MOUTH.x-C.x0)*k, y=C.y0+(MOUTH.y-C.y0)*k-Math.sin(k*Math.PI)*40; move(x,y); S.hand={x,y}; if(k>=1){ up(x,y); S.autoCarry=null; S.autoT=.8; } return; }
  S.autoT-=dt; if(S.autoT>0) return;
  const rest=S.foods.filter(f=>f&&f.st==='rest'); if(!rest.length) return;
  const f=rest.find(q=>an().fav.includes(q.e))||pick(rest); down(f.x,f.y); S.autoCarry={x0:f.x,y0:f.y,t:0}; S.hand={x:f.x,y:f.y};
}

/* ================= particles ================= */
function confetti(){ for(let k=0;k<70;k++) S.parts.push({k:'conf',x:rnd()*W,y:-20-rnd()*200,vx:(rnd()-.5)*40,vy:80+rnd()*80,t:0,rot:rnd()*6,col:pick(['#FF5A6A','#FFD23A','#6AD0FF','#7AF07A','#B07AF0','#FF9A3A'])}); }

/* ================= drawing ================= */
function emoji(e,x,y,s){ g.font=`${s}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(e,x,y); g.textBaseline='alphabetic'; }
function draw(){
  g.setTransform(2,0,0,2,0,0);
  const a=an(), gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,a.bg[0]); gr.addColorStop(1,a.bg[1]); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // table cloth
  g.fillStyle='#F28A6A'; g.fillRect(0,360,W,120); g.fillStyle='rgba(255,255,255,.55)'; for(let x=0;x<W;x+=30) for(let y=360;y<H;y+=30) if(((x+y)/30)%2===0) g.fillRect(x,y,30,30);
  g.fillStyle='#E06A4A'; g.fillRect(0,356,W,6);
  // the animal: a big head with its own face, then a mouth that opens wide
  const chew=S.chew>0, full=S.clearT>0, bob=Math.sin(S.t*2)*4+(S.boing>0?Math.sin(S.boing*20)*6:0), sc=chew?1+Math.sin(S.t*24)*.04:1;
  g.save(); g.translate(180,170+bob); g.scale(sc,sc); emoji(a.e,0,0,230); g.restore();
  // the open mouth (a big target for little fingers)
  const mo=full?.15:chew?.25+Math.abs(Math.sin(S.t*14))*.35:1;
  g.fillStyle='#8A2A3A'; g.beginPath(); g.ellipse(MOUTH.x,MOUTH.y+bob,34,30*mo+2,0,0,7); g.fill();
  if(mo>.5){ g.fillStyle='#FF8AA0'; g.beginPath(); g.ellipse(MOUTH.x,MOUTH.y+bob+12*mo,20,10*mo,0,0,7); g.fill(); }
  if(!chew&&!full){ g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=3; g.setLineDash([6,6]); g.beginPath(); g.arc(MOUTH.x,MOUTH.y+bob,MOUTH.r+6+Math.sin(S.t*4)*3,0,7); g.stroke(); g.setLineDash([]); }
  if(chew||full){ g.fillStyle='rgba(255,120,150,.45)'; g.beginPath(); g.ellipse(120,200+bob,20,13,0,0,7); g.ellipse(240,200+bob,20,13,0,0,7); g.fill(); }
  // speech
  const txt=S.say?S.say.txt:full?'おなかいっぱい！':(S.t%4<2?'あーん':null);
  if(txt){ g.font='800 22px "M PLUS Rounded 1c",sans-serif'; const w=g.measureText(txt).width+30; g.fillStyle='#fff'; g.strokeStyle='#E0703A'; g.lineWidth=3; g.beginPath(); g.roundRect?g.roundRect(180-w/2,22,w,40,20):g.rect(180-w/2,22,w,40); g.fill(); g.stroke(); g.fillStyle='#E0433D'; g.textAlign='center'; g.fillText(txt,180,50); }
  // tummy meter: little food icons that have been eaten
  for(let k=0;k<GOAL;k++){ g.globalAlpha=k<S.fed?1:.25; emoji(k<S.fed?'😋':'🍽️',180-(GOAL-1)*16+k*32,330,22); } g.globalAlpha=1;
  // plates and food
  for(const [x,y] of SLOTS){ g.fillStyle='#FFFFFF'; g.beginPath(); g.ellipse(x,y+22,34,10,0,0,7); g.fill(); g.strokeStyle='#E8D8C8'; g.lineWidth=2; g.stroke(); }
  for(const f of S.foods){ if(!f||f.st==='gone') continue; const big=f.st==='drag'?1.25:f.st==='come'?Math.sin(f.sc*Math.PI*.5)*(1+.25*Math.sin(f.sc*Math.PI)):1; emoji(f.e,f.x,f.y,54*big); }
  for(const p of S.parts){ const al=Math.max(0,1-p.t/(p.k==='conf'?4:p.k==='ring'?.5:1.2)); g.globalAlpha=al;
    if(p.k==='ring'){ g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=4; g.beginPath(); g.arc(p.x,p.y,10+p.t*80,0,7); g.stroke(); }
    else if(p.k==='heart') emoji('💗',p.x,p.y,20);
    else if(p.k==='crumb'){ g.fillStyle='#E8B060'; g.beginPath(); g.arc(p.x,p.y,4,0,7); g.fill(); }
    else if(p.k==='conf'){ g.fillStyle=p.col; g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillRect(-5,-3,10,6); g.restore(); } }
  g.globalAlpha=1;
  if(S.clearT>0&&S.clearT<2.6){ const k=Math.min(1,(2.6-S.clearT)*3); g.save(); g.translate(W/2,290); g.scale(.5+k*.5,.5+k*.5); g.fillStyle='#FF5A7A'; g.font='800 34px "M PLUS Rounded 1c",sans-serif'; g.textAlign='center'; g.lineWidth=8; g.strokeStyle='#FFF'; g.strokeText('ごちそうさま！',0,0); g.fillText('ごちそうさま！',0,0); g.restore(); }
  if(S.hand) emoji('👆',S.hand.x+10,S.hand.y+26,34);
  if(S.auto){ g.fillStyle='rgba(60,40,20,.6)'; g.font='800 11px sans-serif'; g.textAlign='left'; g.fillText('🤖 AUTO',8,352); }
}

/* ================= UI ================= */
function toggleEndless(){ S.endless=!S.endless; try{ localStorage.setItem('moguEndless',S.endless?'1':'0'); }catch(e){} speak(S.endless?'ずっと おなじ どうぶつ':'じゅんばんに あそぼう'); renderBar(); }
function renderBar(){
  $('bar').innerHTML=ANIMALS.map((x,i)=>`<button class="sc${i===S.ai?' on':''}" data-i="${i}" aria-label="${x.n}">${x.e}${S.best.clears[x.e]?'<i>⭐</i>':''}</button>`).join('')+`<button class="sc endless${S.endless?' on':''}" id="endlessBtn" aria-pressed="${!!S.endless}" title="Eキー">🔁<br>ずっと</button>`;
  $('endlessBtn').onclick=()=>{ ac(); user(); toggleEndless(); };
  $('bar').querySelectorAll('.sc[data-i]').forEach(b=>b.onclick=()=>{ ac(); user(); startAnimal(+b.dataset.i); });
}
function setAuto(v){ S.auto=!!v; $('autoBtn').setAttribute('aria-pressed',S.auto); S.autoT=.6; S.hand=null; if(!S.auto&&S.autoCarry){ S.autoCarry=null; if(S.drag){ S.drag.f.st='back'; S.drag=null; } } }
function user(){ if(S.auto) setAuto(false); }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); user(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} const [x,y]=toStage(e); down(x,y); });
cv.addEventListener('pointermove',e=>{ if(!S.drag) return; const [x,y]=toStage(e); move(x,y); });
cv.addEventListener('pointerup',e=>{ const [x,y]=toStage(e); up(x,y); });
cv.addEventListener('pointercancel',()=>{ if(S.drag){ S.drag.f.st='back'; S.drag=null; } });
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('autoBtn').onclick=()=>{ ac(); setAuto(!S.auto); };
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!S.auto); return; } if(k==='e'){ ac(); user(); toggleEndless(); return; } if(k==='m'){ ac(); setMute(!muted); return; }
  if(k>='1'&&k<='6'){ ac(); user(); startAnimal(+k-1); return; }
  if(k===' '||k==='enter'){ e.preventDefault(); ac(); user(); const f=S.foods.find(q=>q&&q.st==='rest'); if(f){ down(f.x,f.y); up(f.x,f.y); } } });

/* ================= sound ================= */
let AC=null, muted=false; try{ muted=localStorage.getItem('moguMute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='sine',v=.07,delay=0,f2){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function cry(a){ let t=.15; for(const [f,d,f2] of a.cry){ tone(f,d,'triangle',.07,t,f2); t+=d+.05; } }
function sfx(k){
  if(k==='pick') tone(700,.08,'sine',.06,0,1000);
  else if(k==='boing') tone(300,.25,'sine',.07,0,600);
  else if(k==='munch') for(let i=0;i<4;i++) tone(180+Math.random()*60,.06,'square',.05,i*.14);
  else if(k==='yay') [523,659,784,1046,784,1046].forEach((q,i)=>tone(q,.18,'square',.05,i*.12));
  else if(k==='start') [392,523,659].forEach((q,i)=>tone(q,.12,'triangle',.06,i*.1));
}
function speak(t){ if(muted) return; try{ const sy=window.speechSynthesis; if(!sy) return; sy.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=1; u.pitch=1.5; sy.speak(u); }catch(e){} }
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{ localStorage.setItem('moguMute',m?'1':'0'); }catch(e){} if(m) try{ speechSynthesis.cancel(); }catch(e){} }

setMute(muted); startAnimal(0);
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!S.manual) update(dt); draw(); present(S.ai); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

window.__mogu={ get S(){ return S; }, setAuto, manual(v=true){ S.manual=v; }, step(dt=1/60){ update(dt); }, seed(v){ seed=(Math.abs(v|0)%2147483646)+1; }, down, move, up, startAnimal, ANIMALS };
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
