<html lang="ja">

<meta charset="utf-8">

<meta name="description" content="日本一ブラックな会社「漆黒商事」を、ATBバトルで浄化するRPG。総務部・情報システム部・営業部・役員フロアをホワイト化して、宇宙の法則を書きかえる社長をたおせ。">
<title>浄化！ブラック企業</title>
<style>
:root{--bg:#05060f;--ink:#e8ecff;--mute:#8890b8;--line:#2a3060}
*{box-sizing:border-box;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{max-width:720px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
#top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex:none}
#top a{color:var(--mute);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}
#top h1{flex:1;margin:0;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
#top h1 b{color:#ffd84a}
.mini{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#121633;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.mini[aria-pressed=true]{background:#ffd84a;border-color:#ffd84a;color:#1a1400}
#scr{flex:none;display:flex;justify-content:center}
#cv{display:block;border-radius:6px;touch-action:none;box-shadow:0 0 0 2px #1b2050}
#pad{flex:1;min-height:150px;display:flex;align-items:center;justify-content:space-between;padding:6px 6px}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px}
.dp{border:0;border-radius:12px;background:#1d2250;color:#c8d0ff;font-size:20px;box-shadow:0 3px 0 #090b1e;cursor:pointer;padding:0}
.dp.on{background:#343c84;transform:translateY(2px);box-shadow:0 1px 0 #090b1e}
#ab{display:flex;gap:14px;align-items:center}
.ab{width:72px;height:72px;border-radius:50%;border:0;font-size:15px;font-weight:800;color:#fff;box-shadow:0 4px 0 #090b1e;cursor:pointer;line-height:1.1;padding:0}
.ab small{font-size:10px;font-weight:700;opacity:.85}
.ab.on{transform:translateY(3px);box-shadow:0 1px 0 #090b1e}
#bA{background:#d84a4a;margin-top:-30px}
#bB{background:#3a4ad0;margin-top:30px}
#endBar{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}
#endBar .mini{font-size:13px;padding:10px 16px}
.keys{flex:none;font-size:10px;color:var(--mute);text-align:center}
@media (pointer:coarse){.keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>浄化！<b>ブラック企業</b></h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="sndBtn">音 ON</button>
  </div>
  <div id="scr"><canvas id="cv" width="768" height="672" aria-label="ゲーム画面"></canvas></div>
  <div id="pad">
    <div id="dpad"><span></span><button class="dp" data-d="1" aria-label="上">▲</button><span></span><button class="dp" data-d="2" aria-label="左">◀</button><span></span><button class="dp" data-d="3" aria-label="右">▶</button><span></span><button class="dp" data-d="0" aria-label="下">▼</button><span></span></div>
    <div id="ab"><button class="ab" id="bB">B<br><small>メニュー</small></button><button class="ab" id="bA">A<br><small>けってい</small></button></div>
  </div>
  <div id="endBar" hidden><a class="mini" href="../">← ゲーム一覧にもどる</a><button class="mini" id="endTitle">タイトルへ</button></div>
  <div class="keys">←↑↓→ 移動　Z・Enter けってい　X・Esc メニュー／もどる　O オート　M 音</div>

function baseStat(id,lv){ const c=CH[id]; return c.st.map((b,i)=>Math.round(b+c.gr[i]*(lv-1))); }

  const r={hp,mp,atk,def,spd}; for(const k of ['p','b','s']){ const e=m.eq[k]; if(e){ const q=EQ[e].st; for(const s in q) r[s]+=q[s]; } } return r; }
function nextExp(lv){ return Math.round(8*Math.pow(lv,1.7)+6); }
function newMember(id,lv){ const m={id,lv,exp:0,eq:{p:null,b:null,s:null}}; const s=mStats(m); m.hp=s.hp; m.mp=s.mp; return m; }

function nightWindow(x,y,w,h,pur,t){ const gr=g.createLinearGradient(0,y,0,y+h); if(pur){ gr.addColorStop(0,'#ff9a5a'); gr.addColorStop(1,'#ffd88a'); } else { gr.addColorStop(0,'#05081c'); gr.addColorStop(1,'#1a1438'); }

function drawTile(m,P,ch,x,y,X,Y,t){

  if(ch==='#'||ch==='W'||ch==='Q'||ch==='E'){
    if(!frontFace&&ch==='#'){ g.fillStyle=P.top; g.fillRect(X,Y,TS,TS); g.fillStyle='rgba(255,255,255,.04)'; g.fillRect(X,Y,TS,1); return; }
    g.fillStyle=P.wall; g.fillRect(X,Y,TS,TS); g.fillStyle=P.wall2; g.fillRect(X,Y+TS-3,TS,3); g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(X,Y,TS,1.5);

    if(ch==='Q'){ g.fillStyle='#f4f4f0'; g.fillRect(X+2,Y+3,TS-4,TS-8); g.strokeStyle=P.pur?'#2a8a3a':'#c82a2a'; g.lineWidth=1; g.beginPath(); g.moveTo(X+4,Y+(P.pur?10:5)); g.lineTo(X+8,Y+7); g.lineTo(X+12,Y+(P.pur?5:10)); g.stroke(); }
    if(ch==='E'){ g.fillStyle='#8a929e'; g.fillRect(X+1,Y+2,TS-2,TS-4); g.fillStyle='#b8c0cc'; g.fillRect(X+2,Y+3,TS/2-2.5,TS-6); g.fillRect(X+TS/2+.5,Y+3,TS/2-2.5,TS-6); g.fillStyle=P.pur?'#7af07a':'#ff7a3a'; g.fillRect(X+TS/2-1,Y+.5,2,1.5); }
    return; }
  // floor

  if(ch===','){ g.strokeStyle='rgba(255,230,160,.25)'; g.lineWidth=.6; g.strokeRect(X+1.5,Y+1.5,TS-3,TS-3); }
  else { const h=hsh(x,y,3); g.fillStyle='rgba(0,0,0,.1)'; g.fillRect(X+(h%12)+1,Y+((h>>4)%12)+1,1.2,1.2); g.fillRect(X+((h>>8)%13)+1,Y+((h>>12)%13)+1,1,1); }

function drawObj(m,P,ch,x,y,X,Y,t){

function openWin(w){ w.tl=w.title?wrap(w.title,w.w-16,9.5).length:0; w.cur=w.cur||0; if(w.items[w.cur]&&w.items[w.cur].dis){ const f=w.items.findIndex(it=>!it.dis); if(f>=0) w.cur=f; } w.top=0; w.rowH=w.rowH||13; w.cols=w.cols||1; w.at=T; UI.push(w); fixCur(w,1); snd('cur'); return w; }
function closeWin(w){ const i=UI.indexOf(w||UI[UI.length-1]); if(i>=0) UI.splice(i,1); }
function closeAllWins(){ UI.length=0; }
function topWin(){ return UI[UI.length-1]; }
function visRows(w){ return Math.max(1,Math.floor((w.h-8)/w.rowH)); }
function fixCur(w,dirn){ const n=w.items.length; if(!n) return; w.cur=clamp(w.cur,0,n-1); const per=visRows(w)*w.cols; if(w.cur<w.top) w.top=w.cur-(w.cur%w.cols); if(w.cur>=w.top+per) w.top=w.cur-per+w.cols-(w.cur%w.cols); w.top=Math.max(0,w.top); }
function winMove(w,d){ const n=w.items.length; if(!n) return; let c=w.cur;
  if(d===0) c+=w.cols; else if(d===1) c-=w.cols; else if(d===2) c-=1; else if(d===3) c+=1;
  if(w.cols===1&&(d===2||d===3)){ if(w.onLR){ w.onLR(d===2?-1:1); return; } return; }
  if(c<0||c>=n) c=(c+n*4)%n; w.cur=c; fixCur(w); snd('cur'); if(w.onMove) w.onMove(w.items[w.cur],w.cur); }
function winPick(w){ const it=w.items[w.cur]; if(!it) return; if(it.dis){ snd('ng'); return; } snd('ok'); w.onPick&&w.onPick(it,w.cur); }
function winCancel(w){ if(w.noCancel) return; snd('back'); if(w.onCancel) w.onCancel(); else closeWin(w); }
function drawWin(w){
  win(w.x,w.y,w.w,w.h);
  let y0=w.y+4; if(w.title){ wrap(w.title,w.w-16,9.5).forEach((l,i)=>txt(l,w.x+8,w.y+13+i*12,'#ffe07a',9.5)); y0+=12*w.tl; }
  const per=visRows({h:w.h-12*w.tl,rowH:w.rowH})*w.cols, colW=(w.w-12)/w.cols;
  for(let k=0;k<per;k++){ const i=w.top+k, it=w.items[i]; if(!it) break; const cx=w.x+6+(k%w.cols)*colW, cy=y0+Math.floor(k/w.cols)*w.rowH+w.rowH-2.5;
    txt(it.t,cx+14,cy,it.dis?'#7a80a8':(it.col||'#fff'),it.px||10); if(it.r!=null) txt(String(it.r),cx+colW-6,cy,it.dis?'#7a80a8':'#fff',9.5,'right');
    if(i===w.cur&&w===topWin()&&!w.noCursor) hand(cx+12,cy-3.5,T); else if(i===w.cur&&!w.noCursor){ g.globalAlpha=.5; hand(cx+12,cy-3.5,0); g.globalAlpha=1; } }
  if(w.top>0){ g.fillStyle='#fff'; g.beginPath(); g.moveTo(w.x+w.w-10,y0+1); g.lineTo(w.x+w.w-6,y0+5); g.lineTo(w.x+w.w-14,y0+5); g.fill(); }
  if(w.top+per<w.items.length){ g.fillStyle='#fff'; g.beginPath(); g.moveTo(w.x+w.w-10,w.y+w.h-3); g.lineTo(w.x+w.w-6,w.y+w.h-7); g.lineTo(w.x+w.w-14,w.y+w.h-7); g.fill(); }
  if(w.onDraw) w.onDraw(w);
}
function winHit(w,x,y){ if(x<w.x||x>w.x+w.w||y<w.y||y>w.y+w.h) return -2; const y0=w.y+4+12*(w.tl||0); const colW=(w.w-12)/w.cols; const k=Math.floor((y-y0)/w.rowH)*w.cols+clamp(Math.floor((x-w.x-6)/colW),0,w.cols-1); const i=w.top+k; return i>=0&&i<w.items.length?i:-1; }
function choose(opts,o={}){ return new Promise(res=>{ const n=opts.length; let w=Math.max(70,...opts.map(t=>String(t.t||t).length*10.5+30)); if(o.title){ font(9.5); w=Math.max(w,Math.min(W-12,g.measureText(o.title).width+20)); } const tl=o.title?wrap(o.title,w-16,9.5).length:0, h=n*13+10+tl*12;
  openWin({x:o.x!=null?Math.min(o.x,W-w-4):W-w-6,y:o.y!=null?o.y:Math.max(4,146-h),w,h,title:o.title,items:opts.map(t=>typeof t==='string'?{t}:t),cur:o.cur||0,noCancel:!o.cancel,
    onPick:(it,i)=>{ closeWin(); res(i); }, onCancel:()=>{ closeWin(); res(-1); }, autoPick:o.autoPick}); }); }

const P={x:11,y:2,dir:0,mv:null,path:[],held:-1,anim:0};
let encCD=0;
function curMap(){ return MAPS[S.map]; }
function walkable(m,x,y){ const c=tileAt(m,x,y); if(BLOCK.includes(c)) return false; if(npcAt(m,x,y)) return false; return true; }
function placeAt(k,x,y,dir=0){ S.map=k; S.x=P.x=x; S.y=P.y=y; S.dir=P.dir=dir; P.mv=null; P.path=[]; }
function tryMove(d){ const m=curMap(), nx=P.x+[0,0,-1,1][d], ny=P.y+[1,-1,0,0][d]; P.dir=S.dir=d; if(!walkable(m,nx,ny)) return false; P.mv={fx:P.x,fy:P.y,t:0}; P.x=S.x=nx; P.y=S.y=ny; return true; }
function fieldUpdate(dt){
  const m=curMap();
  if(P.mv){ P.mv.t+=dt*6.5; P.anim+=dt; if(P.mv.t>=1){ P.mv=null; onStep(); } return; }
  if(ev||D||UI.length||mode!=='field') return;
  if(P.path.length){ const [nx,ny]=P.path.shift(); const d=nx>P.x?3:nx<P.x?2:ny>P.y?0:1; if(!tryMove(d)){ P.path=[]; } return; }
  if(P.held>=0){ tryMove(P.held); }
}
function onStep(){
  const m=curMap(); if(ev) return;
  if(m.fi!=null&&m.fi<4&&tileAt(m,P.x,P.y)!=='S'){ const [sx,sy]=m.start; if(Math.abs(P.x-sx)+Math.abs(P.y-sy)>2){ S.steps++; const purMul=S.pur[m.fi]?2.2:1;
      if(S.steps>=S.encN*purMul){ S.steps=0; S.encN=ri(14,26); P.path=[]; runEvent(()=>randomBattle(m.fi)); return; } } }
  if(P.path.length===0&&P.tapAct){ const a=P.tapAct; P.tapAct=null; const tx=P.x+[0,0,-1,1][a.dir], ty=P.y+[1,-1,0,0][a.dir]; P.dir=S.dir=a.dir; if(tx===a.x&&ty===a.y) interact(); }
}
function runEvent(fn){ if(ev) return; ev=true; P.held=-1; Promise.resolve().then(fn).catch(e=>{ console.error(e); }).finally(()=>{ ev=false; }); }
function facing(){ return [P.x+[0,0,-1,1][P.dir], P.y+[1,-1,0,0][P.dir]]; }
function interact(){ if(ev||P.mv) return; const m=curMap(); let [fx,fy]=facing(); let n=npcAt(m,fx,fy); const c=tileAt(m,fx,fy);
  if(!n&&(c==='K'||c==='G')){ const bx=fx+[0,0,-1,1][P.dir], by=fy+[1,-1,0,0][P.dir]; n=npcAt(m,bx,by); }
  if(n){ n.dir=[1,0,3,2][P.dir]; runEvent(()=>talkNPC(n)); return; }
  if(c==='E'){ runEvent(elevator); return; }
  if(c==='X'){ runEvent(()=>openChest(m,fx,fy)); return; }
  if(tileAt(m,P.x,P.y)==='S'){ runEvent(savePoint); return; }
}
function bfs(m,sx,sy,goal){ const key=(x,y)=>y*m.w+x, prev=new Map([[key(sx,sy),null]]), q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift(); if(goal(x,y)){ const path=[]; let k=key(x,y); while(prev.get(k)!=null){ path.unshift([k%m.w,Math.floor(k/m.w)]); k=prev.get(k); } return path; }
    for(let d=0;d<4;d++){ const nx=x+[0,0,-1,1][d], ny=y+[1,-1,0,0][d]; const k=key(nx,ny); if(prev.has(k)||!walkable(m,nx,ny)) continue; prev.set(k,key(x,y)); q.push([nx,ny]); } }
  return null; }
// walk next to (tx,ty) and face it
function pathToAdj(tx,ty){ const m=curMap(); const goals=[]; for(let d=0;d<4;d++){ const ax=tx-[0,0,-1,1][d], ay=ty-[1,-1,0,0][d]; goals.push({x:ax,y:ay,dir:d}); }
  let bestP=null,bd=0; for(const gl of goals){ if(gl.x===P.x&&gl.y===P.y) return {path:[],dir:gl.dir}; if(!walkable(m,gl.x,gl.y)) continue; const p=bfs(m,P.x,P.y,(x,y)=>x===gl.x&&y===gl.y); if(p&&(!bestP||p.length<bestP.length)){ bestP=p; bd=gl.dir; } }
  return bestP?{path:bestP,dir:bd}:null; }
function fieldTap(x,y){ const m=curMap(), cam=camera(); const tx=Math.floor((x+cam.x)/TS), ty=Math.floor((y+cam.y)/TS); if(tx<0||ty<0||tx>=m.w||ty>=m.h) return;
  if(tx===P.x&&ty===P.y){ interact(); return; }
  const c=tileAt(m,tx,ty); let target=npcAt(m,tx,ty)||'EXKG'.includes(c)?{x:tx,y:ty}:null;
  if(c==='K'||c==='G'){ for(let d=0;d<4;d++){ const n=npcAt(m,tx+[0,0,-1,1][d],ty+[1,-1,0,0][d]); if(n){ target={x:tx,y:ty}; break; } } }
  if(target){ const r=pathToAdj(target.x,target.y); if(!r) return; if(!r.path.length){ P.dir=S.dir=r.dir; interact(); return; } P.path=r.path; P.tapAct={x:target.x,y:target.y,dir:r.dir}; return; }
  if(!walkable(m,tx,ty)) return; const p=bfs(m,P.x,P.y,(xx,yy)=>xx===tx&&yy===ty); if(p){ P.path=p; P.tapAct=null; } }
function camera(){ const m=curMap(); let px=P.x*TS, py=P.y*TS; if(P.mv){ px=lerp(P.mv.fx*TS,P.x*TS,P.mv.t); py=lerp(P.mv.fy*TS,P.y*TS,P.mv.t); }
  const mw=m.w*TS, mh=m.h*TS; let cx=px+8-W/2, cy=py+8-H/2; cx=mw<=W?(mw-W)/2:clamp(cx,0,mw-W); cy=mh<=H?(mh-H)/2:clamp(cy,0,mh-H); return {x:Math.round(cx),y:Math.round(cy),px,py}; }
function drawField(){
  const m=curMap(), P2=palOf(m), cam=camera();
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  const x0=Math.max(0,Math.floor(cam.x/TS)), y0=Math.max(0,Math.floor(cam.y/TS)), x1=Math.min(m.w-1,Math.ceil((cam.x+W)/TS)), y1=Math.min(m.h-1,Math.ceil((cam.y+H)/TS));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) drawTile(m,P2,m.rows[y][x],x,y,x*TS-cam.x,y*TS-cam.y,T);
  const ppl=npcsOf(m).map(n=>({y:n.y,draw:()=>drawPerson(n.x*TS-cam.x+8,n.y*TS-cam.y+15,n.look,{dir:n.dir,dark:n.kind==='boss'||(!P2.pur&&m.fi!=null&&!n.kind),s:n.kind==='boss'?1.05:1})}));
  ppl.push({y:P.y,draw:()=>{ const step=P.mv?(Math.floor(P.anim*8)%2?1:2):0; drawPerson(cam.px-cam.x+8,cam.py-cam.y+15,CH.hero.look,{dir:P.dir,step}); }});
  for(let y=y0;y<=y1;y++){ for(let x=x0;x<=x1;x++){ const c=m.rows[y][x]; if('DdPCRKTOVGX'.includes(c)) drawObj(m,P2,c,x,y,x*TS-cam.x,y*TS-cam.y,T); }
    for(const p of ppl) if(p.y===y) p.draw(); }
  // boss aura
  for(const n of npcsOf(m)) if(n.kind==='boss'){ const X=n.x*TS-cam.x+8, Y=n.y*TS-cam.y+4; for(let i=0;i<5;i++){ const a=T*2+i*1.3; g.fillStyle=`rgba(120,40,160,${.35+.2*Math.sin(T*3+i)})`; circ(X+Math.cos(a)*9,Y-6+Math.sin(a*1.3)*8-((T*10+i*4)%10),1.6); } }
  if(!P2.pur){ g.fillStyle='rgba(30,0,50,.16)'; g.fillRect(0,0,W,H); }
}

function useItemField(k,id){ const d=IT[k], m=S.members[id], s=mStats(m); if(!S.items[k]) return false;

  else if(d.ty==='mp'){ if(m.hp<=0||m.mp>=s.mp){ snd('ng'); return false; } m.mp=Math.min(s.mp,m.mp+d.v); }
  else if(d.ty==='revive'){ if(m.hp>0){ snd('ng'); return false; } m.hp=Math.round(s.hp*d.v); }
  else if(d.ty==='healall'){ for(const x of S.party){ const mm=S.members[x]; if(mm.hp>0) mm.hp=Math.min(mStats(mm).hp,mm.hp+d.v); } }

  S.items[k]--; if(!S.items[k]) delete S.items[k]; snd('heal'); return true; }

/* ================= final battle & ending ================= */
const K_PRE=[['黒岩','よくぞここまで来た、定時 帰。'],['黒岩','だが、この会社の黒は、わしが作った宇宙そのものだ。'],['帰','あんたの椅子を、もらいに来た。'],['黒岩','ならば教えてやろう。働くとは、命を燃やすことだ！']];
function splitGroups(){ const ids=memberIds().filter(id=>id!=='hero').sort((a,b)=>S.members[b].lv-S.members[a].lv); const n=ids.length+1; const ng=n<=4?1:n<=8?2:3;
  const gs=Array.from({length:ng},()=>[]); gs[ng-1].push('hero');
  // every group gets a healer first (ましろ stays with 帰), then the rest are dealt out in turn
  const healer=id=>skillsOf(S.members[id]).some(k=>SK[k].ef==='heal'||SK[k].ef==='revive');
  const hs=ids.filter(healer).sort((a,b)=>(b==='mashiro')-(a==='mashiro')); for(let k=ng-1;k>=0&&hs.length;k--){ const h=hs.shift(); gs[k].push(h); ids.splice(ids.indexOf(h),1); }
  for(const id of ids){ let best=-1; for(let k=ng-1;k>=0;k--){ if(gs[k].length<4&&(best<0||gs[k].length<gs[best].length)) best=k; } if(best<0) break; gs[best].push(id); }
  return gs; }
async function finalEvent(){
  await say(K_PRE);
  const gs=splitGroups(); let gi=0;
  const alive=ids=>ids.some(id=>S.members[id].hp>0);
  if(gs.length>1){ await choose(['この編成で いどむ'],{title:'最終決戦の編成（'+gs.map((g2,i)=>`${i+1}班:${g2.map(id=>CH[id].n).join('・')}`).join(' ／ ')+'）',x:4,y:60,autoPick:0}); }
  const nextGroup=()=>{ for(let k=1;k<=gs.length;k++){ const j=(gi+k)%gs.length; if(j!==gi&&alive(gs[j])){ gi=j; return gs[j]; } } return null; };
  const phase=async(n,list,bg)=>{ const want=Math.min(n-1,gs.length-1); gi=alive(gs[want])?want:gs.findIndex(alive); if(gi<0) return 'lose';
    return startBattle(list,{final:n,party:gs[gi],nextGroup,bg,fi:4}); };
  let r=await phase(1,[{id:'k1',lv:FINAL_LV[0],boss:true}],'office'); if(r!=='win'){ await gameOver(); return; }

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
