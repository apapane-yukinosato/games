<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="日本一ブラックな会社「漆黒商事」を、ディアブロ風のアクションRPGで浄化する。暗いオフィスを探索し、ブラック社員をホワイト化して戦利品を集め、宇宙の法則を書きかえる社長をたおせ。">
<title>浄化！ブラック企業</title>
<style>
html,body{touch-action:manipulation}
:root{--bg:#070504;--ink:#efe4cc;--mute:#9a8a6a;--line:#4a3a22;--gold:#d8b25a}
*{box-sizing:border-box;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{max-width:760px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
#top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex:none}
#top a{color:var(--mute);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}
#top h1{flex:1;margin:0;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
#top h1 b{color:#e0483a}
.mini{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#1a120a;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.mini[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1400}
#scr{flex:none;display:flex;justify-content:center}
#cv{display:block;border-radius:4px;touch-action:none;box-shadow:0 0 0 2px #3a2a14}
#pad{flex:1;min-height:170px;display:flex;align-items:stretch;justify-content:space-between;gap:8px;padding:8px 2px 0}
#stick{position:relative;flex:1;border-radius:18px;background:radial-gradient(circle at 50% 50%,rgba(120,90,50,.16),rgba(0,0,0,0) 70%);touch-action:none;cursor:pointer;min-width:120px}
#sbase{position:absolute;width:108px;height:108px;margin:-54px 0 0 -54px;left:50%;top:50%;border-radius:50%;background:rgba(70,50,28,.55);border:2px solid rgba(216,178,90,.35);transition:opacity .2s;opacity:.55;pointer-events:none}
#stick.on #sbase{opacity:1;transition:none}
#sknob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c8a060,#6a4a20);box-shadow:0 3px 0 #000;pointer-events:none}
#shint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:#7a6a4a;pointer-events:none}
#btns{flex:none;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:46px 66px 46px;gap:6px;align-content:center}
.bt{border:0;border-radius:12px;background:#2a1e10;color:#efe4cc;font-size:11px;font-weight:800;box-shadow:0 3px 0 #000;cursor:pointer;padding:0;line-height:1.15;border:1px solid #5a4422}
.bt.on{transform:translateY(2px);box-shadow:0 1px 0 #000}
.bt small{display:block;font-size:9px;font-weight:700;color:#c8b088}
#bAtk{grid-column:1/4;border-radius:33px;background:radial-gradient(circle at 45% 35%,#d8483a,#7a1a12);font-size:16px}
#bQ,#bE{background:#1e2448;border-color:#3a4a8a}
#bHP{background:#4a1410;border-color:#8a2a1a}#bMP{background:#10204a;border-color:#2a4a8a}
#bQ.ready,#bE.ready{box-shadow:0 0 0 2px #ffd860,0 3px 0 #000}
#endBar{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}
#endBar .mini{font-size:13px;padding:10px 16px}
.keys{flex:none;font-size:10px;color:var(--mute);text-align:center;margin-top:4px}
@media (pointer:coarse){.keys{display:none}}
</style>

<div id="app">

    <a href="../">← 一覧</a>
    <h1>浄化！<b>ブラック企業</b></h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="sndBtn">音 ON</button>

    <div id="btns">

    </div>
  </div>
  <div id="endBar" hidden><a class="mini" href="../">← ゲーム一覧にもどる</a><button class="mini" id="endTitle">タイトルへ</button></div>

function grey(c){ const p=parseInt(c.slice(1),16); const v=Math.round(((p>>16)&255)*.3+((p>>8)&255)*.59+(p&255)*.11); const q=Math.round(lerp(v,150,.4)); return '#'+((1<<24)|(q<<16)|(q<<8)|q).toString(16).slice(1); }
function drawPerson(x,y,lk,o={}){
  const dir=o.dir||0, s=o.s||1, pose=o.pose||'stand', st=o.step||0, dark=!!o.dark;
  const C=c=>!c?c:o.grey?grey(c):dark?mix(c,'#0a0010',.42):o.flash?mix(c,'#ffffff',.6):c;
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(0,0,6,2,0,0,7); g.fill();
  if(pose==='down'){ g.translate(-2,-2); g.rotate(dir===3?Math.PI/2:-Math.PI/2); g.translate(8,4); }
  if(dir===3){ g.scale(-1,1); }
  const side=dir===2||dir===3, back=dir===1;

  let bob=0; if(pose==='win') bob=-Math.abs(Math.sin((o.t||0)*8))*3; if(pose==='hurt') g.translate(2,0);
  g.translate(0,bob);

  const ap=pose==='atk'&&o.ap!=null?o.ap:null; let sw=0;
  if(ap!=null){ const e=k=>k*k*(3-2*k); let lean;
    if(ap<.45){ const k=e(ap/.45); sw=.3+3.1*k; lean=.12*k; }
    else if(ap<.7){ const k=e((ap-.45)/.25); sw=3.4-2.7*k; lean=.12-.32*k; }
    else { const k=e((ap-.7)/.3); sw=.7-.3*k; lean=-.2+.2*k; }
    if(side) g.rotate(lean); else g.translate(0,ap>=.45&&ap<.8?1.2:0); }
  const swingArm=(px,py,a,wpn)=>{ g.save(); g.translate(px,py); g.rotate(a); g.fillStyle=suit; g.fillRect(-1.3,0,2.6,8.2); g.fillStyle=skin; circ(0,8.4,1.6);
    if(wpn){ g.strokeStyle=wpn.c; g.fillStyle=wpn.c; if(wpn.box){ g.fillRect(-2.6,8,5.2,4.2); } else { g.lineWidth=wpn.w||1.5; g.lineCap='round'; g.beginPath(); g.moveTo(0,7.5); g.lineTo(0,8+wpn.len); g.stroke(); } }
    g.restore(); };
  const ls=st===1?1:st===2?-1:0;
  // legs
  g.fillStyle='#161616';
  if(lk.f){ g.fillStyle=skin; if(side){ g.fillRect(-2+ls,-7,2,6.5); g.fillRect(.2-ls,-7,2,6.5); } else { g.fillRect(-3,-7+Math.max(0,ls),2,6.5); g.fillRect(1,-7+Math.max(0,-ls),2,6.5); }
    g.fillStyle='#1a1a1a'; g.fillRect(side?-2.5+ls:-3.5,-1.5,3,1.6); g.fillRect(side?0-ls:.5,-1.5,3,1.6);
    g.fillStyle=pants; g.beginPath(); g.moveTo(-4.5,-12); g.lineTo(4.5,-12); g.lineTo(5.5,-6); g.lineTo(-5.5,-6); g.closePath(); g.fill(); }
  else { g.fillStyle=pants; if(side){ g.fillRect(-3+ls,-8,3,7); g.fillRect(0-ls,-8,3,7); } else { g.fillRect(-4,-8+Math.max(0,ls),3.4,7); g.fillRect(.6,-8+Math.max(0,-ls),3.4,7); }
    g.fillStyle='#141414'; if(side){ g.fillRect(-4+ls,-1.6,4,1.8); g.fillRect(-1-ls,-1.6,4,1.8); } else { g.fillRect(-4.5,-1.6,4,1.8); g.fillRect(.5,-1.6,4,1.8); } }
  // torso
  g.fillStyle=suit; rr(side?-4:-5.2,-16,side?8:10.4,9.5,2); g.fill();
  if(!back){ g.fillStyle=C(lk.shirt); g.beginPath(); if(side){ g.moveTo(-4,-16); g.lineTo(-1,-16); g.lineTo(-3.5,-12.5); } else { g.moveTo(-2.2,-16); g.lineTo(2.2,-16); g.lineTo(0,-12); } g.closePath(); g.fill();
    if(lk.tie){ g.fillStyle=C(lk.tie); if(side) g.fillRect(-3.8,-15,1.4,5); else { g.fillRect(-.8,-15.5,1.6,5.5); } } }
  if(lk.acc.includes('apron')&&!back){ g.fillStyle=C('#ffffff'); g.fillRect(side?-4:-4,-12,side?6:8,8); }
  // arms
  const arm=(ax,ay,w,h)=>{ g.fillStyle=suit; g.fillRect(ax,ay,w,h); };
  if(side){
    if(ap!=null){ swingArm(-.2,-14.6,sw,o.wpn); }
    else if(pose==='atk'){ arm(-10,-14,8,2.6); g.fillStyle=skin; circ(-10.5,-12.7,1.5); }

    if(lk.acc.includes('club')){ g.strokeStyle=C('#c8c8c8'); g.lineWidth=.8; g.beginPath(); g.moveTo(hx,hy); g.lineTo(hx+(side?-3:3),hy+8); g.stroke(); }
    if(lk.acc.includes('armcover')){ g.fillStyle=C('#2a2a38'); if(side) g.fillRect(-1.5,-12,2.8,3); else { g.fillRect(-7.4,-11,2.4,3); g.fillRect(5,-11,2.4,3); } }
  }
  // head
  g.fillStyle=skin; if(side) { rr(-5,-26,10,10.5,4); g.fill(); g.fillRect(-6,-21,1.4,1.6); } else { rr(-5.5,-26,11,10.5,4); g.fill(); }
  // hair
  g.fillStyle=hc; const hs=lk.hair;
  if(back){ if(hs==='bald'){ g.fillStyle=skin; rr(-5.5,-26,11,10.5,4); g.fill(); g.fillStyle=hc; g.fillRect(-6,-21,2,4); g.fillRect(4,-21,2,4); } else { rr(-6,-27.2,12,(hs==='long'?15:hs==='bob'?11:hs==='bun'?10:10.5),4); g.fill(); if(hs==='bun') circ(0,-27.5,2.8); } }
  else if(side){
    if(hs==='bald'){ g.fillRect(1.5,-21,3.6,3.5); }
    else { rr(-5.6,-27.4,11.2,hs==='buzz'?3.4:5,3); g.fill(); g.fillRect(.5,-24,5,hs==='long'?13:hs==='bob'?9:hs==='buzz'?3:6);
      if(hs==='messy'){ g.beginPath(); g.moveTo(-5,-26); g.lineTo(-7,-28); g.lineTo(-2,-27); g.lineTo(0,-30); g.lineTo(2,-27); g.lineTo(5,-29); g.lineTo(5,-25); g.fill(); }
      if(hs==='bun') circ(4,-27,2.8); if(hs==='side'){ g.fillRect(-5.6,-25,4,1.6); } }
  } else {
    if(hs==='bald'){ g.fillRect(-6,-22,1.6,3.5); g.fillRect(4.4,-22,1.6,3.5); }
    else if(hs==='buzz'){ rr(-5.8,-27,11.6,3.4,2.5); g.fill(); }
    else { rr(-6,-27.4,12,hs==='bowl'?7:5,3); g.fill();
      if(hs==='long'){ g.fillRect(-6.4,-24,2.4,11); g.fillRect(4,-24,2.4,11); }
      else if(hs==='bob'){ g.fillRect(-6.4,-24,2.4,7.5); g.fillRect(4,-24,2.4,7.5); }
      else { g.fillRect(-6,-24,1.5,4); g.fillRect(4.5,-24,1.5,4); }
      if(hs==='side'){ g.beginPath(); g.moveTo(-6,-23); g.lineTo(2,-23.5); g.lineTo(-6,-21); g.fill(); }
      if(hs==='messy'){ g.beginPath(); g.moveTo(-6,-26); g.lineTo(-7.5,-29); g.lineTo(-3,-27); g.lineTo(0,-30.5); g.lineTo(3,-27); g.lineTo(7,-29); g.lineTo(6,-25); g.fill(); }
      if(hs==='slick'){ g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(-3,-26.6,5,.8); }
      if(hs==='bun'){ g.fillStyle=hc; circ(0,-28,2.8); } }
  }

    const ex=side?[-3.2]:[-2.8,1.6], ey=-20.5;
    if(dark){ g.fillStyle='#ff2a3a'; for(const e of ex){ g.beginPath(); g.moveTo(e-.4,ey-.6); g.lineTo(e+1.8,ey+.4); g.lineTo(e-.4,ey+1.2); g.fill(); } }
    else if(pose==='down'||o.grey){ g.strokeStyle='#2a1a1a'; g.lineWidth=.7; for(const e of ex){ g.beginPath(); g.moveTo(e-.2,ey+.6); g.lineTo(e+1.6,ey+.6); g.stroke(); } }
    else { g.fillStyle='#1a1414'; for(const e of ex) g.fillRect(e,ey-.8,1.3,2.1); }

    if(lk.acc.includes('shades')){ g.fillStyle='#111'; for(const e of ex) g.fillRect(e-1,ey-1.4,3.3,2.4); if(!side) g.fillRect(-1,ey-.8,2.6,.6); }

    if(lk.acc.includes('headset')){ g.strokeStyle=C('#222'); g.lineWidth=.8; g.beginPath(); g.arc(0,-22,6.2,Math.PI,0); g.stroke(); g.fillStyle=C('#222'); g.fillRect(side?-1:-6.6,-22,1.8,3); g.fillRect(side?-4:-6,-18,3,.8); }
    if(lk.acc.includes('cap')){ g.fillStyle=C('#e8e8e8'); rr(-6,-28,12,4,2); g.fill(); g.fillRect(side?-9:-5,-24.6,side?6:10,1.2); }
  } else if(lk.acc.includes('hachimaki')){ g.fillStyle=C('#e8e8e8'); g.fillRect(-5.8,-24.4,11.6,1.8); g.fillRect(-1,-23,1.4,4); }

/* ================= state & stats ================= */
let S=null, LVL=null; const LEVELS={};
const SAVE_KEY='blackDiaSave_v1', BEST_KEY='blackDiaBest_v1';
let auto=false;
function newState(){
  S={lvl:0,x:10,y:3,clvl:1,exp:0,pts:0,base:{str:25,mag:15,dex:20,vit:25},hp:1,mp:1,gold:120,inv:Array(32).fill(null),eq:{w:null,o:null,h:null,b:null,r:null,r2:null,a:null},
    belt:{drink:4,coffee:2,teishoku:0},scroll:1,spells:['gijiroku','yukyu'],q:'gijiroku',e:'yukyu',pur:[false,false,false,false],key:false,way:{1:true},portal:null,
    seeds:Array.from({length:10},()=>Math.floor(rnd()*1e9)),cleared:false,playT:0,deaths:0,fails:{},intro:false,bonus:false,clears:0,maxLvl:1,kills:0};
  S.eq.w=makeItem('pen',1,'n'); S.eq.b=makeItem('shirt',1,'n');
  const st=stats(); S.hp=st.hp; S.mp=st.mp; for(const k in LEVELS) delete LEVELS[k]; return S; }
function itemProps(it){ const p={...(it.p||{})}; if(it.ac) p.ac=(p.ac||0)+it.ac; return p; }
function stats(){ const t={str:S.base.str,mag:S.base.mag,dex:S.base.dex,vit:S.base.vit,hp:0,mp:0,ac:0,dmgp:0,aspd:0,leech:0};
  for(const k in S.eq){ const it=S.eq[k]; if(!it) continue; const p=itemProps(it); for(const q in p) t[q]=(t[q]||0)+p[q]; }
  const w=S.eq.w, wd=w?w.dmg:[1,2];
  return {str:t.str,mag:t.mag,dex:t.dex,vit:t.vit,hp:Math.round(18+t.vit*2+S.clvl*3+t.hp),mp:Math.round(6+t.mag+S.clvl*1.5+t.mp),ac:Math.round(t.ac+t.dex/5),
    dmin:Math.round(wd[0]*(1+t.str/50+t.dmgp/100)+S.clvl*.5),dmax:Math.round(wd[1]*(1+t.str/50+t.dmgp/100)+S.clvl*.5),hit:Math.round(50+t.dex*.5+S.clvl*1.5),aspd:t.aspd,leech:t.leech}; }
function nextExp(l){ return Math.round(14*Math.pow(l,1.95)); }
function spellPow(k){ const s=stats(); const m=1+s.mag/40; const c=S.clvl;
  return {gijiroku:(5+c*1.1)*m,kaizen:(7+c*1.3)*m,hatarakikata:(6+c*1.15)*m,yukyu:(12+c*3)*m,roudou:(10+c)*m,kumiai:(20+c*6)*m}[k]||0; }
function saveGame(){ if(auto) return true; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); return true; }catch(e){ return false; } }
function loadGame(){ try{ const t=localStorage.getItem(SAVE_KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
let best=(()=>{ try{ return JSON.parse(localStorage.getItem(BEST_KEY)||'null')||{clears:0,time:0,lvl:0}; }catch(e){ return {clears:0,time:0,lvl:0}; } })();
function saveBest(){ if(auto) return; try{ localStorage.setItem(BEST_KEY,JSON.stringify(best)); }catch(e){} }

/* ================= items ================= */
function makeItem(bk,ilvl,q){ const b=IB[bk]; const it={b:bk,q:q||'n',id:true,p:{},ilvl};
  if(b.dmg) it.dmg=[...b.dmg]; if(b.ac) it.ac=b.ac+(q==='n'?ri(0,1):ri(0,2));
  if(b.mo&&it.q==='n') it.q='m';
  if(it.q==='m'){ it.id=false; const k=clamp(ilvl/20,0,1); const roll=a=>Math.max(1,Math.round(lerp(a.v[0],a.v[1],k)*(.6+rnd()*.4)));
    const both=chance(.45), usePre=both||chance(.5), useSuf=both||!usePre;
    if(usePre){ let a=pick(PRE); if(a.k==='dmgp'&&!b.dmg) a=PRE[1]; if(a.k==='aspd'&&!b.dmg) a=PRE[2]; it.pre=a.n; it.p[a.k]=roll(a); }
    if(useSuf){ const a=pick(SUF); it.suf=a.n; it.p[a.k]=(it.p[a.k]||0)+roll(a); } }
  return it; }
function makeUnique(boss){ const u=UNIQ_IT[boss]; const it=makeItem(u.b,20,'n'); it.q='u'; it.id=false; it.p={...u.p}; it.un=u.n; if(it.dmg) it.dmg=[14,30]; return it; }
function itemName(it){ const b=IB[it.b]; if(!it.id) return b.n+(it.q==='u'?'（未鑑定・？）':'（未鑑定）'); if(it.q==='u') return it.un; if(it.q==='m') return (it.pre||'')+b.n+(it.suf?`〈${it.suf}〉`:''); return b.n; }
function itemCol(it){ return it.q==='u'?'#d8b25a':it.q==='m'?'#7aa8ff':'#e8e0d0'; }
function itemDesc(it){ const b=IB[it.b], out=[]; if(it.dmg) out.push(`ダメージ ${it.dmg[0]}-${it.dmg[1]}`); if(it.ac) out.push(`防御 ${it.ac}`);
  if(it.id) for(const k in it.p) out.push(`${STN[k]}+${it.p[k]}`); else if(it.q!=='n') out.push('鑑定すると 効果がわかる'); out.push(`必要Lv ${b.lv}`); return out.join('　'); }
function itemValue(it){ const b=IB[it.b]; let v=b.price; if(it.q==='m') v*=1.6+Object.keys(it.p).length*.6; if(it.q==='u') v*=6; return Math.round(v); }
function itemScore(it){ if(!it) return 0; const p=it.id?it.p:{}; let s=0; if(it.dmg) s+=(it.dmg[0]+it.dmg[1])*2.2; if(it.ac) s+=it.ac*2;
  s+=(p.str||0)*1.6+(p.dex||0)*1.1+(p.vit||0)*2+(p.mag||0)*1.2+(p.hp||0)*.9+(p.mp||0)*.4+(p.ac||0)*2+(p.dmgp||0)*.6*(it.dmg?(it.dmg[0]+it.dmg[1])/8:1.5)+(p.aspd||0)*.7+(p.leech||0)*3;
  if(!it.id&&it.q!=='n') s+=8; return s; }
function slotOf(it){ return IB[it.b].sl; }
function invAdd(it){ const i=S.inv.indexOf(null); if(i<0) return false; S.inv[i]=it; return true; }
function rollDrop(ilvl,bonus=0){ const r=rnd(); if(r<.38-bonus*.2) return null;
  if(r<.62) return {pot:pick(['drink','drink','drink','coffee','coffee','scroll'])};
  const cands=Object.keys(IB).filter(k=>IB[k].lv<=ilvl+1); const bk=pick(cands.filter(k=>IB[k].lv>=ilvl-8).length?cands.filter(k=>IB[k].lv>=ilvl-8):cands);
  return {it:makeItem(bk,ilvl,chance(.2+bonus)?'m':'n')}; }

/* ================= level generation ================= */
const C_VOID=0,C_FLOOR=1,C_WALL=2,C_UP=3,C_DOWN=4,C_DECO=5,C_BOX=6,C_BOXO=7;
function blocked(c){ return c!==C_FLOOR; }
function mkLevel(i,N){ return {i,N,c:new Uint8Array(N*N),d:new Uint8Array(N*N),ex:new Uint8Array(N*N),mons:[],items:[],projs:[],fx:[],texts:[],allies:[],up:null,down:null,spawn:null}; }
function idx(L,x,y){ return y*L.N+x; }
function cellAt(L,x,y){ x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=L.N||y>=L.N) return C_VOID; return L.c[y*L.N+x]; }
function floodCount(L,sx,sy){ const N=L.N, seen=new Uint8Array(N*N); const q=[sy*N+sx]; seen[q[0]]=1; let n=0;
  while(q.length){ const k=q.pop(); n++; const x=k%N, y=(k-x)/N; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=N||ny>=N) continue; const j=ny*N+nx; if(!seen[j]&&L.c[j]===C_FLOOR){ seen[j]=1; q.push(j); } } } return n; }
function genLevel(i){
  if(LEVELS[i]) return LEVELS[i];
  const info=LV[i]; let L;
  if(info.town) L=genTown(); else if(info.final) L=genArena(); else L=genDungeon(i);

function genDungeon(i){

  const total=floodCount(L,r0.cx,r0.y);

  let removed=0;
  for(const r of rooms){ if(r===r0||r.w<6||r.h<6) continue; const dk=decoSet[ri2(0,decoSet.length-1)];
    for(let y=r.y+1;y<r.y+r.h-1;y+=2) for(let x=r.x+1;x<r.x+r.w-1;x++){ if((x-r.x)%3===0) continue; if(R()<.75&&tryBlock(x,y,C_DECO,dk)) removed++; } }

function heroDir(){ let sx=inp.sx, sy=inp.sy; if(law&&law.id==='joushi'){ sx=-sx; sy=-sy; } if(P.st.sontaku){ sx=-sx; sy=-sy; } const m=Math.hypot(sx,sy); if(m<.25) return null;

function avoidMons(x,y){ for(const m of LVL.mons){ if(m.pur||m.part&&m.t==='k2b') continue; if(Math.hypot(m.x-x,m.y-y)<(m.boss?.8:.5)&&Math.hypot(m.x-x,m.y-y)<Math.hypot(m.x-P.x,m.y-P.y)) return true; } return false; }
function heroUpdate(dt){
  if(P.dead) return; const L=LVL; P.anim+=dt;

      else if(A.k==='cast') applySpell(A.sp,A.aim); }
    if(A.t>=A.dur){ P.act=null; if(P.qspell){ const q=P.qspell; P.qspell=null; castSpell(q.k,q.aim); } } P.moving=false; return; }
  const dirv=heroDir(); const sp=heroSpeed()*dt;

    else { const fdv=pathStep(m); if(fdv){ const bx=P.x, by=P.y; P.moving=moveEnt(L,P,fdv[0]*sp,fdv[1]*sp,.28); P.dir=scrDir(fdv[0],fdv[1]); if(Math.hypot(P.x-bx,P.y-by)<sp*.2){ P.blk=(P.blk||0)+dt; if(P.blk>1){ m.unreach=T+6; P.target=null; P.blk=0; } } else P.blk=0; } else { m.unreach=T+6; P.target=null; } } }
  else if(P.path.length){ const [tx,ty]=P.path[0]; const dx=tx-P.x, dy=ty-P.y, d=Math.hypot(dx,dy); if(d<.12){ P.path.shift(); } else { const mv=moveEnt(L,P,dx/d*Math.min(sp,d),dy/d*Math.min(sp,d),.28); P.moving=true; P.dir=scrDir(dx,dy); if(!mv){ P.stuck=(P.stuck||0)+dt; if(P.stuck>.4){ P.path=[]; P.stuck=0; } } else P.stuck=0; }
    if(!P.path.length&&P.onArrive){ const f=P.onArrive; P.onArrive=null; f(); } }
  else { P.target=null; P.moving=false; }
  if(P.target&&P.target.pur) P.target=null;

  // portal

  if(L.portal&&L.portal.cool&&Math.hypot(L.portal.x-P.x,L.portal.y-P.y)>1.2) L.portal.cool=false;
  // explore
  const r=Math.ceil(heroLight()), N=L.N; for(let y=Math.floor(P.y)-r;y<=P.y+r;y++) for(let x=Math.floor(P.x)-r;x<=P.x+r;x++){ if(x<0||y<0||x>=N||y>=N) continue; if((x-P.x)**2+(y-P.y)**2<r*r) L.ex[y*N+x]=1; }
}
function pathStep(m){ const L=LVL; if(walkLine(L,P,m)){ const dx=m.x-P.x, dy=m.y-P.y, d=Math.hypot(dx,dy)||1; return [dx/d,dy/d]; }
  const p=gridPath(L,P.x,P.y,m.x,m.y,true); if(!p||!p.length) return null; const [tx,ty]=p[0]; const dx=tx-P.x, dy=ty-P.y, d=Math.hypot(dx,dy)||1; return [dx/d,dy/d]; }
function gridPath(L,sx,sy,tx,ty,adj){ const N=L.N; const s=Math.floor(sy)*N+Math.floor(sx), t=Math.floor(ty)*N+Math.floor(tx); if(s===t) return [];
  const prev=new Int32Array(N*N).fill(-2); prev[s]=-1; const q=[s]; let found=-1;
  for(let h=0;h<q.length&&h<4000;h++){ const k=q[h]; if(k===t){ found=k; break; } const x=k%N, y=(k-x)/N;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=N||ny>=N) continue; const j=ny*N+nx; if(prev[j]!==-2) continue; if(L.c[j]!==C_FLOOR&&!(adj&&j===t)) continue; prev[j]=k; q.push(j); } }
  if(found<0) return null; const out=[]; let k=found; while(prev[k]>=0){ out.unshift([k%N+.5,Math.floor(k/N)+.5]); k=prev[k]; } if(adj&&L.c[found]!==C_FLOOR) out.pop(); return out; }
function pickUp(o){ if(o.gold){ S.gold+=o.gold; popText(P.x,P.y-.3,`+${o.gold}円`,'#ffd84a'); snd('coin'); return true; }
  if(o.pot){ if(o.pot==='scroll'){ S.scroll++; } else { if((S.belt[o.pot]||0)>=12) return false; S.belt[o.pot]=(S.belt[o.pot]||0)+1; } popText(P.x,P.y-.3,POT[o.pot].n,'#c8ffb0'); snd('coin'); return true; }
  if(o.it){ if(!invAdd(o.it)){ if(!o.warned){ o.warned=true; msg('持ちものが いっぱいだ'); } return false; } msg(`${itemName(o.it)}を 手に入れた`,itemCol(o.it)); snd('item'); return true; } return true; }
function interactables(){ const L=LVL, out=[]; if(L.npcs) for(const n of L.npcs) if(npcVisible(n)) out.push({k:'npc',n,x:n.x,y:n.y,reach:n.reach});
  for(const e of [L.up&&{k:'up',x:L.up.x+.5,y:L.up.y+.5},L.down&&{k:'down',x:L.down.x+.5,y:L.down.y+.5}]) if(e) out.push(e);
  const N=L.N, r=2; for(let y=Math.floor(P.y)-r;y<=P.y+r;y++) for(let x=Math.floor(P.x)-r;x<=P.x+r;x++){ if(cellAt(L,x,y)===C_BOX) out.push({k:'box',x:x+.5,y:y+.5,cx:x,cy:y}); }

function nearInteract(maxD=1.5){ let b=null,bd=1; for(const o of interactables()){ const d=Math.hypot(o.x-P.x,o.y-P.y)/Math.max(maxD,o.reach||0); if(d<bd){ bd=d; b=o; } } return b; }

function goTalk(n,then){ if(!n.front) return goNear(n.x,n.y,then); const ok=()=>Math.hypot(n.x-P.x,n.y-P.y)<n.reach; if(ok()){ then(); return true; }

<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
