<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="まったくモテない男子が中3から高校卒業までをすごす、パワプロ式の育成恋愛シミュレーション。勉強しないと男子校行き！">
<title>女゛ぁ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#FFF4F6;--ink:#3A2430;--card:#FFFFFF;--line:#F2C8D4;--mute:#9A7A88;--pink:#FF5A8A;--pink2:#FFD0DE;--blue:#4A8AE0;--gold:#E8A820;--green:#3AB070}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));position:relative}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:18px;font-family:"Dela Gothic One",sans-serif;color:var(--pink);letter-spacing:.06em}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
#status{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 9px;font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#date{font-weight:800;font-size:14px}
#mood{font-weight:800}
.hpbar{flex:1;min-width:90px;height:10px;border-radius:6px;background:#F4E4EA;overflow:hidden;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FF8AA8,#FF5A8A)}
#abil{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.ab{background:#FFF6F8;border-radius:8px;padding:3px 4px;text-align:center;line-height:1.15}
.ab small{display:block;font-size:10px;color:var(--mute)}
.rk{font-family:"Dela Gothic One",sans-serif;font-size:16px;margin-right:2px}
#pts{display:flex;gap:6px;margin-top:6px;align-items:center;font-weight:800;font-size:12px;flex-wrap:wrap}
#pts span{white-space:nowrap}
#upBtn,#girlsBtn{margin-left:auto}
#girlsBtn{margin-left:0}
#scene{display:block;width:100%;aspect-ratio:360/190;border-radius:14px;margin-top:6px;background:#F8E0E8}
#msg{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px 8px;margin-top:6px;min-height:78px;font-size:14px;line-height:1.6;white-space:pre-line;cursor:pointer}
#msg b{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;margin-bottom:2px}
#msg .nx{position:absolute;right:10px;bottom:4px;font-size:12px;color:var(--pink);font-weight:800;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.act{position:relative;min-height:54px;border:0;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);border:1px solid var(--line);text-align:left;padding:6px 8px;cursor:pointer;font-weight:800;font-size:14px;line-height:1.2}
.act small{display:block;font-size:10px;color:var(--mute);font-weight:500}
.act small.risk{color:#E0433D;font-weight:800}
.act:disabled{opacity:.45;cursor:default}
.act .tags{position:absolute;right:6px;top:6px;display:flex;gap:2px}
.tg{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.tg.sp{box-shadow:0 0 0 2px var(--pink),0 0 8px var(--pink)}
.ov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(60,20,40,.45);padding:60px 12px 12px;z-index:5}
.card{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:calc(100vh - 80px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.card h2{margin:0 0 6px;font-family:"Dela Gothic One",sans-serif;font-size:20px;color:var(--pink);text-align:center}
.sub{font-size:12px;color:var(--mute);text-align:center;margin:0 0 8px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#FFF8FA;padding:9px 12px;margin-top:6px;cursor:pointer;font-weight:800;font-size:14px}
.opt small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.opt:disabled{opacity:.45;cursor:default}
.go{display:block;width:100%;min-height:46px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #C8306A}
.go.alt{background:#F4E4EA;color:var(--ink);box-shadow:0 4px 0 #E0C0CC}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none;text-align:center}
.upr{display:grid;grid-template-columns:1fr auto auto;gap:4px 6px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0;font-size:13px}
.upr small{display:block;font-size:10px;color:var(--mute)}
.upr button{border:0;border-radius:8px;background:var(--pink);color:#fff;font-weight:800;padding:6px 9px;cursor:pointer;font-size:12px}
.upr button:disabled{background:#E8D8DE;color:#A898A0;cursor:default}
.gl{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0;font-size:12px}
.gl canvas{width:48px;height:48px;border-radius:10px;background:#FFE8EE}
.meter{height:8px;border-radius:5px;background:#F4E4EA;overflow:hidden;margin-top:3px}.meter i{display:block;height:100%;background:var(--pink)}
#title .big{font-family:"Dela Gothic One",sans-serif;font-size:56px;color:var(--pink);text-align:center;line-height:1.1;margin:6px 0;text-shadow:3px 3px 0 #FFD0DE}
#nameIn{width:100%;font-size:18px;padding:10px;border-radius:10px;border:2px solid var(--pink);background:#FFF8FA;text-align:center}
.story{font-size:14px;line-height:1.8;white-space:pre-line;margin:8px 0}
.shout{font-family:"Dela Gothic One",sans-serif;font-size:44px;color:#E0433D;text-align:center;animation:sh .12s infinite;margin:10px 0}
@keyframes sh{0%{transform:translate(1px,0)}50%{transform:translate(-2px,1px)}100%{transform:translate(1px,-1px)}}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}
@media (pointer:coarse){.keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>女゛ぁ！</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>

    <div class="row"><span id="date">中3 4月 前半</span><span id="mood">😐 普通</span><span style="font-size:11px">体力</span><div class="hpbar"><i id="hpI"></i></div></div>
    <div id="abil"></div>
    <div id="pts"></div>
  </div>
  <canvas id="scene" width="360" height="190"></canvas>
  <div id="msg"></div>
  <div id="acts"></div>
  <p class="keys">数字キー 1〜8：行動　Enter / スペース：つぎへ　U：能力アップ　G：女の子　O：オート　M：音</p>

  <div class="ov" id="titleOv">
    <div class="card" id="title">
      <div class="big">女゛ぁ！</div>
      <p class="sub">まったくモテない男子の、中3の1年と高校の3年間。
勉強しないと男子校、もっとしないと不良高校。
声をかけても、最初は無視される。</p>
      <label class="sub" for="nameIn" style="display:block">主人公の名前</label>
      <input id="nameIn" maxlength="10" placeholder="前田ダイソン">
      <button class="go" id="startBtn">入学…じゃなくて、中3スタート</button>
      <button class="go" id="contBtn" hidden></button>
      <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
      <p class="sub" id="bestTxt" style="margin-top:8px"></p>
      <a class="back" href="../">← ゲーム一覧にもどる</a>
    </div>
  </div>
  <div class="ov" id="chooseOv" hidden><div class="card"><h2 id="chTitle"></h2><p class="sub" id="chSub"></p><div id="chOpts"></div><button class="go alt" id="chCancel">やめる</button></div></div>
  <div class="ov" id="upOv" hidden><div class="card"><h2>能力アップ</h2><p class="sub" id="upPts"></p><div id="upList"></div><button class="go" id="upClose">とじる</button></div></div>
  <div class="ov" id="girlsOv" hidden><div class="card"><h2>女の子</h2><p class="sub">好感度　他人 → 知り合い → 友だち → 気になる → 好き</p><div id="girlsList"></div><button class="go" id="girlsClose">とじる</button></div></div>
  <div class="ov" id="endOv" hidden><div class="card"><h2 id="endTitle"></h2><div id="endShout" class="shout" hidden></div><canvas id="endCv" width="320" height="170" style="width:100%;border-radius:12px;background:#FFE8EE"></canvas><div class="story" id="endText"></div><button class="go" id="endBtn">タイトルへ</button><a class="back" href="../">← ゲーム一覧にもどる</a></div></div>
</div>

const cv=$('scene'), g=cv.getContext('2d');
function petals(x,w,h,n){ for(let i=0;i<n;i++){ const px=(i*73.3)%w, py=(i*41.7+S.time*20*(1+i%3))%h; x.fillStyle=i%2?'#FFB8CC':'#FFD8E4'; x.beginPath(); x.ellipse(px,py,3,2,i,0,7); x.fill(); } }
function drawGirl(x,id,cx,by,s,face){
  const h=H[id]; x.save(); x.translate(cx,by); x.scale(s,s);
  // back hair
  x.fillStyle=h.col;
  if(h.hair==='long'){ x.beginPath(); x.roundRect?x.roundRect(-36,-118,72,100,26):x.rect(-36,-118,72,100); x.fill(); }
  if(h.hair==='wave'){ for(let i=-1;i<=1;i+=2){ x.beginPath(); x.ellipse(i*30,-62,16,46,i*.1,0,7); x.fill(); } }
  if(h.hair==='pony'){ x.beginPath(); x.ellipse(30,-104,12,30,.6,0,7); x.fill(); }
  if(h.hair==='twin'){ for(let i=-1;i<=1;i+=2){ x.beginPath(); x.ellipse(i*40,-80,11,28,i*-.3,0,7); x.fill(); } }
  // body (uniform)
  x.fillStyle='#2A3A6A'; x.beginPath(); x.moveTo(-40,0); x.quadraticCurveTo(-36,-36,0,-38); x.quadraticCurveTo(36,-36,40,0); x.fill();
  x.fillStyle='#fff'; x.beginPath(); x.moveTo(-14,-37); x.lineTo(0,-20); x.lineTo(14,-37); x.fill();
  x.fillStyle=h.ribbon||'#E0433D'; x.beginPath(); x.moveTo(0,-24); x.lineTo(-9,-30); x.lineTo(-9,-18); x.fill(); x.beginPath(); x.moveTo(0,-24); x.lineTo(9,-30); x.lineTo(9,-18); x.fill();
  // face
  x.fillStyle=h.skin; x.beginPath(); x.ellipse(0,-74,27,31,0,0,7); x.fill();
  // eyes
  const ey=-72; x.fillStyle='#2A1A2A';
  if(face==='a'){ x.lineWidth=2.5; x.strokeStyle='#2A1A2A'; x.beginPath(); x.moveTo(-15,ey); x.lineTo(-6,ey+1); x.moveTo(6,ey+1); x.lineTo(15,ey); x.stroke(); }
  else if(face==='l'){ x.lineWidth=2.5; x.strokeStyle='#2A1A2A'; x.beginPath(); x.arc(-10,ey+2,5,Math.PI*1.1,Math.PI*1.9); x.stroke(); x.beginPath(); x.arc(10,ey+2,5,Math.PI*1.1,Math.PI*1.9); x.stroke(); }
  else { for(const ex of [-10,10]){ x.beginPath(); x.ellipse(ex,ey,4.2,6,0,0,7); x.fill(); x.fillStyle='#fff'; x.beginPath(); x.arc(ex+1.5,ey-2.5,1.6,0,7); x.fill(); x.fillStyle='#2A1A2A'; } }
  if(face==='l'||face==='h'){ x.fillStyle='rgba(255,110,140,.45)'; x.beginPath(); x.ellipse(-16,-62,6,3.5,0,0,7); x.ellipse(16,-62,6,3.5,0,0,7); x.fill(); }
  // mouth
  x.strokeStyle='#A0405A'; x.lineWidth=2; x.beginPath();
  if(face==='a'){ x.moveTo(-5,-56); x.lineTo(5,-57); } else if(face==='h'||face==='l'){ x.arc(0,-59,5,.2,Math.PI-.2); } else { x.moveTo(-4,-56); x.quadraticCurveTo(0,-54,4,-56); }
  x.stroke();
  if(h.glasses){ x.strokeStyle='#4A4A5A'; x.lineWidth=1.8; x.strokeRect(-18,ey-6,15,11); x.strokeRect(3,ey-6,15,11); x.beginPath(); x.moveTo(-3,ey-1); x.lineTo(3,ey-1); x.stroke(); }
  // bangs
  x.fillStyle=h.col; x.beginPath(); x.ellipse(0,-96,30,16,0,Math.PI,0); x.fill();
  if(h.hair==='bob'){ x.beginPath(); x.ellipse(-24,-78,9,22,.15,0,7); x.ellipse(24,-78,9,22,-.15,0,7); x.fill(); }
  else { x.beginPath(); x.moveTo(-28,-96); x.quadraticCurveTo(-30,-74,-24,-62); x.lineTo(-20,-90); x.fill(); x.beginPath(); x.moveTo(28,-96); x.quadraticCurveTo(30,-74,24,-62); x.lineTo(20,-90); x.fill(); }
  x.beginPath(); x.moveTo(-22,-98); x.lineTo(-14,-84); x.lineTo(-6,-98); x.lineTo(2,-84); x.lineTo(10,-98); x.lineTo(18,-86); x.lineTo(24,-98); x.fill();
  if(h.hair==='twin'||h.hair==='pony'){ x.fillStyle='#FF6A8A'; x.beginPath(); x.arc(h.hair==='pony'?22:-26,-98,4,0,7); x.fill(); if(h.hair==='twin'){ x.beginPath(); x.arc(26,-98,4,0,7); x.fill(); } }
  if(h.ribbon){ x.fillStyle=h.ribbon; x.beginPath(); x.ellipse(-16,-104,8,4,-.5,0,7); x.ellipse(-4,-106,8,4,.5,0,7); x.fill(); }
  x.restore();
}
function drawBoy(x,cx,by,s,col,me){
  x.save(); x.translate(cx,by); x.scale(s,s);
  // school uniform (gakuran): rounded shoulders, sleeves, stand collar and buttons
  const light=col==='#F4F4F4';
  x.fillStyle='#F2D2B4'; x.fillRect(-4.5,-35,9,6);                                             // neck
  x.fillStyle=col; x.beginPath(); x.moveTo(-6,-31); x.quadraticCurveTo(-15,-31,-19,-23); x.lineTo(-17,6); x.lineTo(17,6); x.lineTo(19,-23); x.quadraticCurveTo(15,-31,6,-31); x.closePath(); x.fill();
  for(const sd of [-1,1]){ x.fillStyle=col; x.beginPath(); x.moveTo(sd*18,-25); x.quadraticCurveTo(sd*25,-18,sd*24,-1); x.lineTo(sd*18.5,-1); x.lineTo(sd*16.5,-19); x.closePath(); x.fill();
    x.strokeStyle=light?'rgba(0,0,0,.18)':'rgba(255,255,255,.12)'; x.lineWidth=1; x.beginPath(); x.moveTo(sd*16.5,-19); x.lineTo(sd*18.5,-1); x.stroke();
    x.fillStyle='#F2D2B4'; x.beginPath(); x.arc(sd*21.3,1.5,3.4,0,7); x.fill(); }
  x.fillStyle=light?'#D8D8DC':'#14141C'; x.beginPath(); x.roundRect?x.roundRect(-6.5,-33,13,5,2):x.rect(-6.5,-33,13,5); x.fill();   // stand collar
  x.fillStyle=light?'#2A3A6A':'#E8C050'; for(const by2 of [-24,-16,-8,0]){ x.beginPath(); x.arc(0,by2,1.6,0,7); x.fill(); }
  x.fillStyle='#F2D2B4'; x.beginPath(); x.arc(0,-44,15,0,7); x.fill();
  x.fillStyle='#1A1A1A'; x.beginPath(); x.ellipse(0,-54,15,8,0,Math.PI,0); x.fill();
  x.fillStyle='#1A1A1A'; x.fillRect(-7,-46,3,3); x.fillRect(4,-46,3,3);
  x.strokeStyle='#8A4A4A'; x.lineWidth=1.5; x.beginPath(); x.arc(0,-36,4,Math.PI+.4,-.4); x.stroke();
  if(me){ x.fillStyle='#fff'; x.font='800 10px sans-serif'; x.textAlign='center'; x.fillText('ぼく',0,-64); }
  x.restore();
}
function drawScene(){
  g.setTransform(1,0,0,1,0,0);
  const m=S.cur||{};
  const hs=S.phase==='hs', bg=g.createLinearGradient(0,0,0,190);
  bg.addColorStop(0,hs?'#FFE0EA':'#E0EEFF'); bg.addColorStop(1,hs?'#FFF4F6':'#F6FAFF'); g.fillStyle=bg; g.fillRect(0,0,360,190);
  // classroom window + blackboard
  g.fillStyle='#3A6A4A'; g.fillRect(20,20,150,70); g.strokeStyle='#8A6A4A'; g.lineWidth=4; g.strokeRect(20,20,150,70);
  g.fillStyle='rgba(255,255,255,.75)'; g.font='800 13px "M PLUS Rounded 1c",sans-serif'; g.textAlign='left'; g.fillText(S.mode==='title'?'':dateStr(),30,44);
  if(S.phase==='jh'&&S.want){ g.font='800 10px sans-serif'; g.fillText('志望：'+SCHOOLS[S.want].n,30,62); }
  if(hs){ g.font='800 10px sans-serif'; g.fillText(SCHOOLS[S.school].n,30,62); }
  g.fillStyle='#BFE0FF'; g.fillRect(220,14,120,90); g.strokeStyle='#fff'; g.lineWidth=5; g.strokeRect(220,14,120,90); g.beginPath(); g.moveTo(280,14); g.lineTo(280,104); g.stroke();
  petals(g,360,190,hs?10:4);
  g.fillStyle='rgba(160,120,90,.25)'; g.fillRect(0,150,360,40);
  if(S.phase==='birth'){ g.fillStyle='#EAF6F0'; g.fillRect(0,0,360,190); g.fillStyle='#FFFFFF'; g.fillRect(0,130,360,60);
    g.fillStyle='#BFE0FF'; g.fillRect(230,16,110,80); g.strokeStyle='#fff'; g.lineWidth=5; g.strokeRect(230,16,110,80);
    g.fillStyle='#7AC0A0'; g.font='800 13px "M PLUS Rounded 1c",sans-serif'; g.textAlign='left'; g.fillText('🏥 '+(S.birthday||''),20,30);
    const bx=180, byy=118+Math.sin(S.time*3)*1.5;
    g.fillStyle='#FFF6E0'; g.beginPath(); g.ellipse(bx,byy+10,46,30,0,0,7); g.fill(); g.strokeStyle='#F2D8A8'; g.lineWidth=2; g.stroke();
    g.fillStyle='#F8DCC8'; g.beginPath(); g.arc(bx,byy-12,24,0,7); g.fill();
    g.strokeStyle='#5A3A3A'; g.lineWidth=2; g.beginPath(); g.arc(bx-9,byy-12,4,.2,Math.PI-.2); g.stroke(); g.beginPath(); g.arc(bx+9,byy-12,4,.2,Math.PI-.2); g.stroke();
    g.fillStyle='rgba(255,120,140,.4)'; g.beginPath(); g.ellipse(bx-15,byy-4,5,3,0,0,7); g.ellipse(bx+15,byy-4,5,3,0,0,7); g.fill();
    g.fillStyle='#C86A6A'; g.beginPath(); g.ellipse(bx,byy-1,4,3,0,0,7); g.fill();
    g.strokeStyle='#5A3A3A'; g.lineWidth=1.5; g.beginPath(); g.moveTo(bx-2,byy-36); g.quadraticCurveTo(bx+6,byy-44,bx+3,byy-34); g.stroke();
    if(S.mode==='choose'){ g.font='34px sans-serif'; g.textAlign='center'; g.fillText('🎰',70,120); g.fillText('✨',290,130); }
    return; }
  if(m.g){ drawGirl(g,m.g,250,200,1.35,m.face||'n'); drawBoy(g,70,186,1.1,'#2A2A3A',true); }
  else if(m.who==='gonta'){ drawBoy(g,250,190,1.5,GONTA.col,false); g.fillStyle='#fff'; g.font='800 12px sans-serif'; g.textAlign='center'; g.fillText('ゴンタ',250,92); drawBoy(g,70,186,1.1,'#2A2A3A',true); }
  else drawBoy(g,180,186,1.2,'#2A2A3A',true);
}

/* ================= auto: study first, then win one girl ================= */
function autoTarget(){
  if(S.phase==='jh') return 'rin';
  if(S.school==='danshi') return null;
  const cands=avail().filter(id=>girl(id).met||H[id].from===S.school);
  cands.sort((a,b)=>(girl(b).like+(H[b].like==='gaku'?10:0))-(girl(a).like+(H[a].like==='gaku'?10:0)));
  return cands[0]||null;
}
function autoSpend(){
  const tg=autoTarget(), need=tg?H[tg]:null;
  for(const id of (S.phase==='jh'?['agari','benkyo','honban','hayane']:S.school==='danshi'?['agari','hayane','honban','benkyo']:['hayane','kiki','ichizu','fashion'])) learn(id);
  let guard=0;
  while(guard++<200){
    const want=[];
    if(S.phase==='jh') want.push(['gaku',90]);
    if(need) want.push([need.like,need.need+8]);
    if(S.phase==='hs'&&S.school==='danshi') want.push([S.path==='base'?'undo':'gaku',100]);
    want.push(['mitame',60],['talk',55],['gaku',80],['undo',60],['mitame',90],['talk',85]);
    let did=false; for(const [k,lim] of want){ if(S.ab[k]<lim&&raise(k,1)){ did=true; break; } }
    if(!did) break; }
}
function autoAct(){
  autoSpend();
  const tg=autoTarget(), sr=sickRate();
  if(S.hp<38||sr>12) return doAction('rest');
  if(S.mood<=1) return doAction('play');
  const short=S.phase==='jh'&&S.ab.gaku<SCHOOLS.seiryo.line+8;
  if(S.phase==='hs'&&S.school==='danshi'){ if(!S.path) S.path=rnd()<.5?'base':'study'; return doAction(S.path==='study'?(S.hp>=60?'juku':'study'):'sport'); }
  if(tg){ const g=girl(tg);
    if(S.phase==='hs'){ const b=avail().find(id=>girl(id).bomb); if(b===tg) return doAction('talk',tg); }
    for(const a in S.tags) if(S.tags[a].includes(tg)&&a!=='play'||S.tags[a].includes(tg)&&!short) return doAction(a);
    if(!short&&g.like>=30&&S.t-S.lastDate>=3) return doAction('date',tg);
    if(!short&&g.like<60&&rnd()<.5) return doAction('talk',tg); }
  if(short) return doAction(S.hp>=60?'juku':'study');
  const lk=tg?H[tg].like:'mitame', map={gaku:'study',undo:'sport',mitame:'style',talk:'play'};
  if(tg&&S.ab[lk]<H[tg].need+8) return doAction(map[lk]);
  if(tg&&girl(tg).like<80) return doAction('talk',tg);
  return doAction(pick(['style','play','study']));
}
function autoChoose(){
  const k=S.chKind;
  if(k==='gacha'){ const R=S.gachaRes; return pickOpt(R.tot<70&&S.rolls<3?1:0); }
  if(k==='school'){ const sc=S.ab.gaku+examBonus(); return pickOpt(judge(sc,SCHOOLS.seiryo.line)<='B'?0:1); }
  if(k==='date'){ const h=H[S.dateGirl]; const i=S.chOpts.findIndex(o=>h&&o.val===h.fav); return pickOpt(i>=0?i:0); }
  return pickOpt(0);
}
function tick(dt){
  S.time=(S.time||0)+dt;
  if(!S.auto) return;
  S.autoT+=dt;
  if(S.mode==='title'){ if(S.autoT>.6){ S.autoT=0; newGame($('nameIn').value.trim()||'前田ダイソン'); } return; }
  if(S.mode==='end'){ if(S.autoT>4){ S.autoT=0; toTitle(); } return; }
  if(S.autoT<.55) return; S.autoT=0;
  if(S.mode==='msg') return showNext();
  if(S.mode==='choose') return autoChoose();
  if(S.mode==='turn') return autoAct();
}

/* ================= input ================= */
function setAuto(v){ S.auto=!!v; $('autoBtn').setAttribute('aria-pressed',S.auto); S.autoT=0; }
function user(){ if(S.auto) setAuto(false); }
function toTitle(){ ['chooseOv','upOv','girlsOv','endOv'].forEach(i=>$(i).hidden=true); S.mode='title'; $('titleOv').hidden=false;
  const sv=loadSave(); $('contBtn').hidden=!sv; if(sv){ const keep={phase:S.phase,t:S.t}; S.phase=sv.phase; S.t=sv.t; $('contBtn').textContent=`▶ つづきから（${sv.name}・${dateStr()}）`; S.phase=keep.phase; S.t=keep.t; }
  const n=Object.keys(S.best.seen).length; $('bestTxt').textContent=`📖 見たエンディング ${n}/${ENDS.length}　｜　プレイ ${S.best.plays}回`; render(); drawScene(); }
$('msg').onclick=()=>{ ac(); if(S.mode==='msg'){ user(); showNext(); } };
$('contBtn').onclick=()=>{ ac(); user(); resume(); };
$('startBtn').onclick=()=>{ ac(); user(); newGame($('nameIn').value.trim()||'前田ダイソン'); };
$('autoStartBtn').onclick=()=>{ ac(); setAuto(true); newGame($('nameIn').value.trim()||'前田ダイソン'); };
$('autoBtn').onclick=()=>{ ac(); setAuto(!S.auto); };
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };
$('chCancel').onclick=()=>{ ac(); user(); cancelChoose(); };
$('upClose').onclick=()=>{ ac(); $('upOv').hidden=true; };
$('girlsClose').onclick=()=>{ ac(); $('girlsOv').hidden=true; };
$('endBtn').onclick=()=>{ ac(); user(); toTitle(); };
addEventListener('keydown',e=>{
  if(document.activeElement===$('nameIn')){ if(e.key==='Enter') $('startBtn').click(); return; }
  const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!S.auto); return; }
  if(k==='m'){ ac(); setMute(!muted); return; }
  if(k==='u'){ ac(); user(); if($('upOv').hidden) openUp(); else $('upOv').hidden=true; return; }
  if(k==='g'){ ac(); user(); if($('girlsOv').hidden) openGirls(); else $('girlsOv').hidden=true; return; }
  if(k==='escape'){ $('upOv').hidden=true; $('girlsOv').hidden=true; if(S.mode==='choose'&&!$('chCancel').hidden) cancelChoose(); return; }
  if(k==='enter'||k===' '){ e.preventDefault(); ac(); if(S.mode==='msg'){ user(); showNext(); } else if(S.mode==='end') $('endBtn').click(); return; }
  if(/^[1-9]$/.test(k)){ ac(); user(); if(S.mode==='choose'){ pickOpt(+k-1); return; } const a=ACT[+k-1]; if(a&&S.mode==='turn') doAction(a.id); }
});

/* ================= sound ================= */
let AC=null, muted=false; try{ muted=localStorage.getItem('onnaMute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='sine',v=.06,delay=0,f2){ if(muted||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function sfx(k){
  if(k==='tap') tone(880,.06,'triangle',.05);
  else if(k==='good'){ tone(784,.1,'triangle',.06); tone(1046,.14,'triangle',.06,.08); }
  else if(k==='bad') tone(330,.3,'sawtooth',.05,0,180);
  else if(k==='up') tone(988,.1,'square',.04,0,1480);
  else if(k==='boom'){ tone(90,.6,'sawtooth',.1,0,40); }
  else if(k==='clear') [523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.07,i*.12));
}
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{ localStorage.setItem('onnaMute',m?'1':'0'); }catch(e){} }

setMute(muted); toTitle();
let last=performance.now();
function loop(now){ const dt=Math.min(.1,(now-last)/1000); last=now; if(!S.manual) tick(dt); if(S.mode==='title'||S.mode==='end') drawScene(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

window.__onna={ get S(){ return S; }, setAuto, manual(v=true){ S.manual=v; }, step(dt=1/60){ tick(dt); }, seed(v){ seed=(Math.abs(v|0)%2147483646)+1; },
  newGame, doAction, showNext, pickOpt, raise, learn, openUp, openGirls, toTitle, charm, H, SCHOOLS };
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
