<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="同じものを重ねて進化！ 焼き芋から伝説の天芋の冠まで。イモ姫のお店を大きくしよう。">
<title>イモ姫のマージ焼き芋屋</title>
<style>
html,body{touch-action:manipulation}
:root{ --bg:#ffeed4; --ink:#4a2a3a; --mute:#8a6a70; --card:#fffaf0; --pink:#e0507a; --purple:#8a3b7a; --gold:#ffcf5a; --orange:#e8703a; --orange2:#b8481a; --green:#3f9a3f; color-scheme:light; }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(#ffd9a8,#ffeed4);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;max-width:460px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px;position:relative}
#top{display:flex;align-items:center;gap:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:999px;min-width:36px;min-height:36px;padding:0 10px;background:var(--card);color:var(--ink);box-shadow:0 2px 0 #d9b98a;cursor:pointer;position:relative}
.mini[aria-pressed=true]{background:#6A55F0;color:#fff;box-shadow:0 2px 0 #3d2fb0}
.mini:focus-visible,.go:focus-visible,.dl:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.dot{position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:#ff3b5c;border:2px solid #fff}
#hud{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:800}
.chip{background:var(--card);border-radius:12px;padding:4px 8px;box-shadow:0 2px 0 #e3c9a0;white-space:nowrap;font-variant-numeric:tabular-nums}
#lvBox{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
#xpBar{flex:1;height:8px;border-radius:99px;background:#e8d2b0;overflow:hidden;min-width:20px}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#ff8ab4,#ffb347);transition:width .25s}
#scene{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 3px 0 #d9b98a;background:#bfe6ff;flex:none}
#sc{display:block;width:100%}
#bubble{position:absolute;left:6px;top:4px;max-width:66%;background:rgba(255,255,255,.93);border-radius:12px;padding:4px 8px;font-size:11.5px;font-weight:800;line-height:1.35;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.12);opacity:0;transition:opacity .25s;pointer-events:none}
#bubble.on{opacity:1}
#bubble b{color:var(--pink)}
#orders{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:none}
.ord{background:var(--card);border-radius:12px;padding:4px 4px 5px;box-shadow:0 2px 0 #e3c9a0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;position:relative;overflow:hidden}
.ord .who{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--mute)}
.ord .who i{font-style:normal;font-size:13px;margin-right:2px}
.ord .want{display:flex;gap:2px;justify-content:center;min-height:34px}
.ord .want .w{position:relative;width:34px;height:34px;border-radius:8px;background:#f6e4c4}
.ord .want .w canvas{width:34px;height:34px;display:block}
.ord .want .w.no canvas{opacity:.45;filter:grayscale(.6)}
.ord .want .w.ok{background:#c8f0b8}
.ord .want .w.ok::after{content:"✓";position:absolute;right:-1px;bottom:-2px;font-size:11px;font-weight:800;color:#fff;background:var(--green);border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center}
.ord .rw{font-size:10.5px;font-weight:800;color:var(--orange2);white-space:nowrap}
.dl{font:inherit;font-weight:800;font-size:13px;width:100%;min-height:36px;border:0;border-radius:10px;background:#d8c8b0;color:#fff;box-shadow:0 2px 0 #b8a890;cursor:pointer}
.dl.ready{background:var(--orange);box-shadow:0 2px 0 var(--orange2);animation:glow .8s ease-in-out infinite alternate}
.dl:disabled{cursor:default}
@keyframes glow{from{filter:brightness(1);box-shadow:0 2px 0 var(--orange2),0 0 0 rgba(255,200,60,0)}to{filter:brightness(1.12);box-shadow:0 2px 0 var(--orange2),0 0 14px rgba(255,200,60,.95)}}
.ord.flash{animation:flash .5s}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.07);background:#fff3a0}100%{transform:scale(1)}}
#bwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#bd{display:block;touch-action:none;border-radius:12px;box-shadow:0 3px 0 #c9a672;background:#e9cfa0}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:3;background:rgba(60,30,50,.88);color:#fff;font-size:13px;font-weight:800;padding:6px 14px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#bot{display:flex;gap:6px;align-items:stretch;flex:none}
#trash{flex:none;width:96px;min-height:44px;border-radius:12px;background:#e8d2b0;border:2px dashed #b89a6a;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800;color:var(--mute);transition:background .15s,transform .15s}
#trash.hot{background:#ffc8c0;border-color:#e0403a;color:#a02018;transform:scale(1.06)}
#cap{flex:1;min-width:0;display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--mute);line-height:1.35}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;background:rgba(60,30,50,.5);overflow:auto;z-index:20}
.card{background:var(--card);border-radius:18px;padding:16px 14px;width:100%;max-width:400px;margin:auto;text-align:center;box-shadow:0 6px 0 #d9b98a;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch}
.card h2{margin:0 0 6px;font-size:21px;font-weight:800}
.card p{margin:6px 0;font-size:13px;line-height:1.6;color:var(--mute)}
.go{font:inherit;font-weight:800;font-size:16px;width:100%;min-height:48px;border:0;border-radius:14px;cursor:pointer;margin-top:8px;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange2)}
.go.sub{background:#fff;color:var(--ink);box-shadow:0 3px 0 #d9b98a}
.go:active{transform:translateY(3px)}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.tabs{display:flex;gap:4px;margin:6px 0}
.tab{flex:1;font:inherit;font-size:11px;white-space:nowrap;padding:0 2px;font-weight:800;min-height:38px;border:0;border-radius:10px;background:#f1e0c0;color:var(--ink);cursor:pointer}
.tab[aria-pressed=true]{background:var(--purple);color:#fff}
.dexg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.dx{background:#f6e4c4;border-radius:10px;padding:3px 1px 2px;font-size:9px;font-weight:800;line-height:1.2}
.dx canvas{width:100%;aspect-ratio:1;display:block}
.dx.no{color:#a8909a}
.dx.top{background:#ffe8a0}
.rn{text-align:left;font-size:13px;font-weight:800}
.rn .st{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:10px;background:#f6e4c4;margin:4px 0}
.rn .st.done{background:#c8f0b8}
.rn .st span{flex:1}
.rn .st button{font:inherit;font-size:12px;font-weight:800;min-height:36px;padding:0 10px;border:0;border-radius:9px;background:var(--orange);color:#fff;box-shadow:0 2px 0 var(--orange2);cursor:pointer}
.rn .st button:disabled{background:#cdbba0;box-shadow:none;cursor:default}
.rn h3{margin:10px 0 2px;font-size:14px;color:var(--purple)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}
#title{z-index:40;background:linear-gradient(#ffc890,#ffeed4 70%)}
#tcv{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.big{font-size:30px;font-weight:800;color:var(--orange2);margin:2px 0}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:8px 0;text-align:left}
.rows b{text-align:right}
@media (max-height:700px){#scene{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>🍠 イモ姫のマージ焼き芋屋</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="オート（Oキー）">🤖 オート</button>
    <button class="mini" id="sndBtn" aria-label="音">🔊</button>
    <button class="mini" id="dexBtn" aria-label="図鑑">📖</button>
    <button class="mini" id="renoBtn" aria-label="お店の改装">🛠<i class="dot" id="renoDot" hidden></i></button>
  </div>
  <div id="hud">
    <div class="chip" id="coinC">🪙 0</div>
    <div class="chip" id="lvBox"><span id="lvT">Lv1</span><div id="xpBar"><div id="xpFill"></div></div></div>
    <div class="chip" id="enC">⚡ 100/100</div>
  </div>
  <div id="scene"><canvas id="sc"></canvas><div id="bubble"></div></div>
  <div id="orders"></div>
  <div id="bwrap"><canvas id="bd"></canvas><div id="toast"></div></div>
  <div id="bot"><div id="trash">🗑 うる</div><div id="cap">畑をタップ！ 同じものをドラッグで重ねると進化するよ</div></div>
</div>
<canvas id="fx"></canvas>
<div class="ov" id="modal" hidden></div>
<div class="ov" id="title">
  <div class="card">
    <canvas id="tcv" width="600" height="340"></canvas>
    <h2>イモ姫の<br>マージ焼き芋屋</h2>
    <p>畑をタップして、同じものをドラッグで重ねると進化！<br>お客さんの注文をそろえて、お店を大きくしよう。</p>
    <button class="go" id="startBtn">▶ はじめる</button>
    <button class="go sub" id="autoStart">🤖 オートで見る</button>
    <button class="go sub" id="resetBtn" hidden>はじめからにする</button>
    <a class="back" href="../">← ゲーム一覧にもどる</a>
  </div>
</div>
<script>
(()=>{
'use strict';
/* ================= データ ================= */
const COLS=7, ROWS=9, N=COLS*ROWS;
const SAVE_KEY='merge_save_v1', BEST_KEY='merge_best_v1', SND_KEY='merge_snd';
const CH=[
 {id:'imo',n:'芋',icon:'🍠',col:'#ffb347',names:['種芋','芋の苗','小さなサツマイモ','サツマイモ','焼き芋','大学芋','スイートポテト','芋ようかん','芋けんぴタワー','天芋の冠']},
 {id:'kuri',n:'栗',icon:'🌰',col:'#c98a4b',names:['いが','栗','焼き栗','甘栗','栗きんとん','モンブラン','栗の大樹','黄金モンブラン']},
 {id:'kama',n:'かまど',icon:'🔥',col:'#ff7a3a',names:['小枝','たきぎ','炭','七輪','石焼き窯','黄金の窯','かまど神さま','天の大竈']},
 {id:'cha',n:'お茶',icon:'🍵',col:'#7ccf6a',names:['茶葉','緑茶','抹茶','茶せん','茶碗','茶室','茶園','天の茶会']}
];
const GENN=[['芋畑','よい芋畑','大きな芋畑','天の芋畑'],['栗の木','よい栗の木','大きな栗の木','天の栗の木'],['薪小屋','よい薪小屋','大きな薪小屋','天の薪小屋'],['茶の木','よい茶の木','大きな茶の木','天の茶の木']];
const UNLOCK=[1,2,3,4];
const GEN_DIST=[[[0,80],[1,20]],[[0,55],[1,35],[2,10]],[[0,30],[1,40],[2,25],[3,5]],[[0,15],[1,30],[2,35],[3,15],[4,5]]];
const maxT=c=>c<4?CH[c].names.length-1:3;
const nameOf=(c,t)=>c<4?CH[c].names[t]:GENN[c-4][t];
const colOf=c=>CH[c<4?c:c-4].col;
const val=t=>Math.round(5*Math.pow(1.7,t));
const xpNeed=L=>Math.round(30+30*L+7*L*L);
const rowsOpen=L=>L>=7?9:L>=5?8:L>=3?7:6;
const lockLv=r=>r>=8?7:r>=7?5:3;
const WHO=[
 {n:'イモ姫',e:'🍠',l:['{w}、いっしょに食べよ！','{w}！ ひとくちだけ…って言ったけど全部食べるわ！'],t:['おいしい〜！ ありがとう！','もぐもぐ…しあわせ…']},
 {n:'ゲンさん',e:'👴',l:['{w}をくれんかのう。','{w}じゃ。たのむぞ。'],t:['ほっほっ、助かるわい。','うむ、ええ出来じゃ。']},
 {n:'マネーダイソン',e:'🌀',l:['{w}も吸い込ませてもらおうか…','{w}だ。代金は、吸う。'],t:['ズズズ…うまい。','代金？ …置いておく。']},
 {n:'コーギー',e:'🐶',l:['ワン！ {w}ほしい！','{w}！ おしり振っちゃう！'],t:['ワンワン！ ありがとう！','しっぽ、ぶんぶん！']},
 {n:'MCライム侍',e:'🍋',l:['Yo！ {w}で切れ味ましましだぜ','拙者、{w}を所望でござる'],t:['ライムだけに、スッキリ！','Yeah！ 恩に着る！']},
 {n:'前田ダイソン',e:'🤵',l:['{w}…婚活の差し入れに…','{w}を…ひとつ…（ぼそっ）'],t:['…ありがとう。縁がつながる気がする。','女゛ぁ！ …じゃなくて、ありがとう']},
 {n:'ジョン',e:'🎷',l:['{w}は、ジャズの味さ。','Hey、{w}を頼むよ'],t:['Nice…いい音がするぜ。','ありがとう、一曲吹いてくよ']},
 {n:'ハナ',e:'👧',l:['{w}、おねえちゃんのお店で買いたいな','{w}をください！'],t:['わーい！ ありがとう！','おいしそう！']},
 {n:'ソウタ',e:'👦',l:['{w}って、ある？','{w}がほしいんだ'],t:['やったあ！','ありがとう、イモ姫さん！']},
 {n:'ハチベエ',e:'🧳',l:['{w}を仕入れたいのじゃが','旅のおともに{w}じゃ'],t:['毎度あり…は、こっちのセリフじゃな。','これは売れるぞ！']}
];
const RENO=[
 {n:'小さな店',lv:2,steps:[['のれんをかける',150],['かまどを置く',300],['看板を出す',500]]},
 {n:'茶屋',lv:4,steps:[['縁側をつくる',900],['茶釜をすえる',1400],['提灯をつるす',2000]]},
 {n:'老舗',lv:7,steps:[['瓦の屋根をのせる',3500],['蔵を建てる',5000],['のれんに金の糸',7000]]},
 {n:'天上の芋御殿',lv:10,steps:[['雲の石段をかける',11000],['金の天守をのせる',16000],['天芋の冠をかざる',24000]]}
];
const STAGE_N=['屋台','小さな店','茶屋','老舗','天上の芋御殿'];

/* ================= 絵（canvas・100x100 座標） ================= */
let g;
const TAU=Math.PI*2;
function fl(f,s,lw){ if(f){g.fillStyle=f;g.fill();} if(s){g.strokeStyle=s;g.lineWidth=lw||2;g.lineJoin='round';g.stroke();} }
function el(x,y,rx,ry,f,s,lw,rot){ g.beginPath(); g.ellipse(x,y,rx,ry,rot||0,0,TAU); fl(f,s,lw); }
function rr(x,y,w,h,r,f,s,lw){ g.beginPath(); g.roundRect(x,y,w,h,r); fl(f,s,lw); }
function pg(p,f,s,lw){ g.beginPath(); g.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]); g.closePath(); fl(f,s,lw); }
function ln(x1,y1,x2,y2,c,w){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.strokeStyle=c; g.lineWidth=w||2; g.lineCap='round'; g.stroke(); }
function qc(x1,y1,cx,cy,x2,y2,c,w){ g.beginPath(); g.moveTo(x1,y1); g.quadraticCurveTo(cx,cy,x2,y2); g.strokeStyle=c; g.lineWidth=w||2; g.lineCap='round'; g.stroke(); }
function glow(x,y,r,c){ const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,c); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
function leaf(x,y,s,rot,c){ g.save(); g.translate(x,y); g.rotate(rot); el(0,0,s,s*.55,c,'rgba(0,60,0,.35)',1.5); ln(-s,0,s,0,'rgba(255,255,255,.35)',1); g.restore(); }
function star(x,y,r,c){ g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, d=i%2?r*.45:r; g.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d); } g.closePath(); fl(c); }
function steam(x,y){ qc(x,y,x-6,y-8,x,y-16,'rgba(255,255,255,.85)',3); qc(x+8,y+2,x+14,y-8,x+8,y-18,'rgba(255,255,255,.7)',3); }
function dome(cx,cy,r,f,s,lw){ g.beginPath(); g.arc(cx,cy,r,Math.PI,0); g.closePath(); fl(f,s,lw); }
const ART=[[],[],[],[]];
/* 芋 */
ART[0][0]=()=>{ el(50,62,26,17,'#9a5568','#5e2f40',2.5,-.25); el(41,57,8,3.5,'rgba(255,220,230,.5)',0,0,-.4); ln(60,48,64,34,'#4a9a3a',3.5); leaf(68,31,8,-.6,'#6cc24a'); leaf(57,38,6,.7,'#59b13c'); };
ART[0][1]=()=>{ el(50,80,30,10,'#7a5233'); el(50,76,24,7,'#946540'); ln(50,76,50,44,'#3f9a3f',4); ln(50,60,34,46,'#3f9a3f',3); ln(50,57,67,44,'#3f9a3f',3); leaf(50,36,11,-1.57,'#5cc04a'); leaf(31,42,9,-.7,'#6cd056'); leaf(69,40,9,.7,'#6cd056'); };
ART[0][2]=()=>{ el(50,60,30,17,'#b04a7c','#6d2a4a',2.5,-.25); el(38,54,10,4,'rgba(255,255,255,.35)',0,0,-.3); ln(78,66,88,70,'#6d2a4a',2); ln(22,52,14,46,'#6d2a4a',2); ln(58,46,60,40,'#3f9a3f',3); leaf(63,37,7,-.5,'#5cc04a'); };
ART[0][3]=()=>{ el(50,60,40,21,'#b8467f','#6d2a4a',3,-.2); el(34,53,13,4.5,'rgba(255,255,255,.35)',0,0,-.25); for(const [a,b] of [[30,62],[50,68],[68,56]]) ln(a,b,a+8,b+2,'rgba(80,20,50,.4)',2); ln(66,42,68,34,'#3f9a3f',3); leaf(72,32,9,-.5,'#5cc04a'); leaf(60,31,8,.6,'#6cd056'); };
ART[0][4]=()=>{ steam(38,34); steam(58,30); el(50,66,40,19,'#6a3248','#3d1a2a',3,-.15); el(50,60,32,12,'#ffcf4a','#e8a020',2,-.15); el(44,56,16,4,'#fff3b0',0,0,-.15); el(60,63,6,2,'#fff3b0',0,0,-.15); };

    const s=newState(); s.board=o.b.map(v=>v<0?null:{c:v>>4,t:v&15}); s.coins=o.coins|0; s.xp=o.xp|0; s.level=Math.max(1,o.level|0); if(Array.isArray(o.dex)&&o.dex.length===8) s.dex=o.dex;
    s.energy=clamp(o.energy|0,0,EMAX); s.eBase=o.eBase||Date.now(); s.off=o.off||0; s.orders=Array.isArray(o.orders)?o.orders:[]; s.reno=clamp(o.reno|0,0,12); s.stats=Object.assign(s.stats,o.stats||{}); s.pending=o.pending||[]; s.seq=o.seq|0;
    if(s.board.length!==N) return null;

  }catch(e){ return null; }
}
function loadBest(){ try{ const o=JSON.parse(ls(BEST_KEY)||'null'); if(o) best={level:o.level|0||1,tier:o.tier|0}; }catch(e){} }
function saveBest(){ let ch=false; if(S.level>best.level){ best.level=S.level; ch=true; } if(S.stats.maxTier>best.tier){ best.tier=S.stats.maxTier; ch=true; } if(ch) ls(BEST_KEY,JSON.stringify(best)); }

/* ----- 元気 ----- */
function updEnergy(){
  const n=now();
  if(S.energy>=EMAX){ S.energy=EMAX; S.eBase=n; return; }
  const k=Math.floor((n-S.eBase)/MSG_E);
  if(k>0){ S.energy=Math.min(EMAX,S.energy+k); S.eBase+=k*MSG_E; if(S.energy>=EMAX) S.eBase=n; }
}
function useEnergy(){ updEnergy(); if(S.energy<=0) return false; if(S.energy>=EMAX) S.eBase=now(); S.energy--; return true; }
function addTime(sec){ S.off+=sec*1000; updEnergy(); save(); }

/* ----- 盤面ユーティリティ ----- */
const isOpen=i=>Math.floor(i/COLS)<rowsOpen(S.level);
const sameKey=(a,b)=>a&&b&&a.c===b.c&&a.t===b.t;
const canMerge=(a,b)=>sameKey(a,b)&&a.t<maxT(a.c);
function emptyCells(){ const r=[]; for(let i=0;i<N;i++) if(!S.board[i]&&isOpen(i)) r.push(i); return r; }
function nearestEmpty(from){
  const fr=Math.floor(from/COLS), fc=from%COLS; let bd=1e9, c=[];
  for(let i=0;i<N;i++){ if(S.board[i]||!isOpen(i)) continue; const d=Math.abs(Math.floor(i/COLS)-fr)+Math.abs(i%COLS-fc); if(d<bd){ bd=d; c=[i]; } else if(d===bd) c.push(i); }
  return c.length?c[rnd(c.length)]:-1;
}
function cxy(i){ return [i%COLS, Math.floor(i/COLS)]; }

/* ----- 表示の仕込み（演出） ----- */
function tween(it,fx,fy,d,s0){ it.tw={fx,fy,t0:AT,d:d||.2,s0:s0==null?1:s0}; }
function pop(it){ it.pop=AT; }
function ringAt(i,col,big){ const [x,y]=cxy(i); FX.rings.push({x:x+.5,y:y+.5,t0:AT,col,big:big||1}); }
function burst(i,col,n,spd){ const [x,y]=cxy(i); for(let k=0;k<n;k++){ const a=Math.random()*TAU, v=(.8+Math.random())*(spd||3.2); FX.parts.push({x:x+.5,y:y+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,t0:AT,life:.5+Math.random()*.5,col:Math.random()<.35?'#fff':col,s:.05+Math.random()*.07}); } if(FX.parts.length>400) FX.parts.splice(0,FX.parts.length-400); }
function floatTxt(i,txt,col,dy){ const [x,y]=cxy(i); FX.txts.push({x:x+.5,y:y+.3+(dy||0),t0:AT,txt,col:col||'#fff'}); }

/* ----- サウンド ----- */
let AC=null;
function actx(){ if(!snd) return null; try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); }catch(e){ AC=null; } return AC; }
function tone(f,d,type,vol,when,slide){
  const a=actx(); if(!a) return; try{
    const t=a.currentTime+(when||0), o=a.createOscillator(), gn=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(vol||.15,t+.01); gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const PENT=[0,2,4,7,9];
const noteF=t=>261.63*Math.pow(2,(PENT[t%5]+12*Math.floor(t/5))/12);
function sfx(k,t){
  if(!snd) return;
  if(k==='merge'){ const f=noteF(t||0); tone(f*.6,.09,'sine',.2,0,f); tone(f,.18,'triangle',.16,.04); tone(f*2,.14,'sine',.08,.06); if(t>=3) tone(f*3,.2,'sine',.07,.1); if(t>=5){ tone(f*1.5,.2,'triangle',.08,.12); tone(f*2,.3,'sine',.1,.18); tone(f*3,.3,'sine',.08,.24); } if(t>=8){ for(let i=0;i<5;i++) tone(f*Math.pow(2,i/5+1),.25,'sine',.07,.1+i*.06); } }
  else if(k==='spawn') tone(360,.08,'sine',.12,0,520);
  else if(k==='move') tone(300,.05,'sine',.07,0,380);
  else if(k==='swap'){ tone(330,.06,'triangle',.08); tone(440,.06,'triangle',.08,.05); }
  else if(k==='coin'){ tone(880,.08,'square',.06); tone(1320,.14,'square',.06,.07); }
  else if(k==='deliver'){ [523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.13,i*.07)); tone(1568,.3,'sine',.08,.28); }
  else if(k==='level'){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.09)); }
  else if(k==='legend'){ [523,659,784,1047,1319,1568,2093].forEach((f,i)=>{ tone(f,.5,'triangle',.14,i*.1); tone(f/2,.5,'sine',.1,i*.1); }); }
  else if(k==='full') tone(160,.2,'sawtooth',.08,0,110);
  else if(k==='no') tone(200,.12,'square',.06,0,150);
  else if(k==='reno'){ [392,523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.08)); }
  else if(k==='tap') tone(520,.04,'sine',.06);
}

/* ----- 吹き出し・トースト ----- */
let bubT=0, toastT=0;
function say(who,txt){ const b=$('#bubble'); b.innerHTML='<b>'+who+'</b> '+txt; b.classList.add('on'); bubT=AT+4.2; }
function toast(txt){ const t=$('#toast'); t.textContent=txt; t.classList.add('on'); toastT=AT+1.6; }
function cap(txt){ $('#cap').textContent=txt; }

/* ----- 生産 ----- */
function pickTier(lv){ const d=GEN_DIST[lv], tot=d.reduce((a,b)=>a+b[1],0); let r=Math.random()*tot; for(const [t,w] of d){ r-=w; if(r<=0) return t; } return 0; }
function tapGen(i){
  const it=S.board[i]; if(!it||it.c<4||!isOpen(i)) return false;
  updEnergy();
  const to=nearestEmpty(i);
  if(to<0){ toast('満杯！ いらないものはゴミ箱へ'); say('イモ姫','満杯よ！ いらないものはゴミ箱で売ってね'); sfx('full'); return false; }
  if(S.energy<=0){ toast('元気がないよ…あとで'); say('イモ姫','元気がなくなっちゃった。2分にひとつ回復するわ'); sfx('no'); return false; }
  useEnergy();
  const k=it.c-4, t=pickTier(it.t);
  const ni={c:k,t}; S.board[to]=ni; const [fx,fy]=cxy(i); tween(ni,fx,fy,.28,.4); pop(it);
  S.stats.spawns++; markDex(k,t,to); sfx('spawn'); burst(to,colOf(k),4,2); lastAct=AT; sel=-1;
  save(); return true;
}
function give(c,t){
  const e=emptyCells();
  if(!e.length){ S.pending.push([c,t]); return -1; }
  const i=e[rnd(e.length)]; const ni={c,t}; S.board[i]=ni; tween(ni,3,-1.5,.5,.3); pop(ni); ringAt(i,'#ffd84a'); burst(i,'#ffd84a',8,3); markDex(c,t,i,true); return i;
}
function flushPending(){ while(S.pending.length&&emptyCells().length){ const [c,t]=S.pending.shift(); give(c,t); } }

/* ----- 図鑑 ----- */
let legendShown=false;
function markDex(c,t,i,quiet){
  if(S.dex[c][t]) return;
  S.dex[c][t]=1;
  if(c<4){
    S.stats.maxTier=Math.max(S.stats.maxTier,t+1);
    if(t>=2){ const bonus=4*(t+1); S.coins+=bonus; if(!quiet) floatTxt(i,'図鑑 +'+bonus,'#ffe66a',.55); toast('図鑑：'+nameOf(c,t)+'！'); }
    if(c===0&&t===9){ legendEvent(i); }

/* ----- 合体・移動・売却 ----- */
function drag(a,b,fast){
  if(!S||a<0||a>=N||!S.board[a]||!isOpen(a)) return 'none';
  if(b===-1||b==='trash') return sell(a);
  if(b<0||b>=N||b===a||!isOpen(b)) return 'none';
  const A=S.board[a], B=S.board[b]; lastAct=AT; sel=-1;
  const d=fast?.12:.2;
  if(!B){ S.board[b]=A; S.board[a]=null; const [fx,fy]=cxy(a); tween(A,dropFx!=null?dropFx:fx,dropFy!=null?dropFy:fy,d); sfx('move'); save(); return 'move'; }
  if(canMerge(A,B)){
    const ni={c:B.c,t:B.t+1}; S.board[b]=ni; S.board[a]=null; S.stats.merges++;
    const [fx,fy]=cxy(a); tween(ni,fx,fy,d*.8,1); ni.pop=AT+d*.8-.0; ni.mergeAt=AT+d*.8;
    effectsMerge(b,ni,d*.8);
    markDex(ni.c,ni.t,b);
    if(ni.c<4) saveBest();
    save(); return 'merge';
  }
  S.board[a]=B; S.board[b]=A; const [ax,ay]=cxy(a), [bx,by]=cxy(b);
  tween(A,dropFx!=null?dropFx:ax,dropFy!=null?dropFy:ay,d); tween(B,bx,by,d); sfx('swap'); save(); return 'swap';
}
let dropFx=null, dropFy=null;
function effectsMerge(i,it,delay){
  const t=it.t, col=colOf(it.c);
  const later=()=>{
    ringAt(i,col,1+Math.min(t,9)*.12); if(t>=3) ringAt(i,'#fff',1.4+t*.1); if(t>=6) ringAt(i,'#ffe66a',2);
    burst(i,col,10+t*4,3+t*.35); sfx('merge',it.c>=4?3+t*2:t);
    if(t>=4&&it.c<4) floatTxt(i,nameOf(it.c,t),'#fff'); if(it.c>=4) floatTxt(i,'畑 Lv'+(t+1)+'！','#ffe66a');
  };
  FX.later=FX.later||[]; FX.later.push({at:AT+(delay||0),f:later});
  it.pop=AT+(delay||0);
}
function sell(a){
  const it=S.board[a]; if(!it||it.c>=4) { toast('畑は売れないよ'); sfx('no'); return 'none'; }
  const p=Math.floor(val(it.t)*.35)+1; S.board[a]=null; S.coins+=p; S.stats.sold++;
  ringAt(a,'#ffd84a'); floatTxt(a,'+'+p+'🪙','#ffe66a'); sfx('coin'); lastAct=AT; sel=-1; save(); return 'sell';
}

/* ----- 注文 ----- */
const unlockedChains=()=>[0,1,2,3].filter(c=>S.level>=UNLOCK[c]);
function makeOrder(){
  const lv=S.level, ch=unlockedChains();
  let n=1; if(Math.random()<(lv>=2?.55:.3)) n=2; if(lv>=5&&Math.random()<.35) n=3;
  const want=[];
  for(let k=0;k<n;k++){
    const bag=[]; ch.forEach(c=>{ for(let q=0;q<(c===0?3:2);q++) bag.push(c); });
    const c=bag[rnd(bag.length)];
    const cap=Math.min(maxT(c)-1, 1+Math.ceil((lv-UNLOCK[c]+1)*.7));
    const t=Math.max(1,cap-2)+rnd(cap-Math.max(1,cap-2)+1);
    want.push({c,t});
  }
  want.sort((a,b)=>a.c-b.c||a.t-b.t);
  const who=rnd(WHO.length);
  const stage=Math.floor(S.reno/3);
  const sum=want.reduce((a,w)=>a+val(w.t),0);
  const coins=Math.round(sum*1.25*(1+.15*stage));
  const xp=Math.round(want.reduce((a,w)=>a+3+2.2*w.t,0));
  return {who,want,coins,xp,line:rnd(2),id:++S.seq};
}
function fillOrders(){ while(S.orders.length<3) S.orders.push(null); for(let i=0;i<3;i++) if(!S.orders[i]) S.orders[i]=makeOrder(); }
function orderCells(o){
  const used=new Set(), res=[];
  for(const w of o.want){ let f=-1; for(let i=0;i<N;i++){ const it=S.board[i]; if(it&&it.c===w.c&&it.t===w.t&&!used.has(i)&&isOpen(i)){ f=i; break; } } if(f<0) return null; used.add(f); res.push(f); }
  return res;
}
const canDeliver=i=>!!(S.orders[i]&&orderCells(S.orders[i]));
const wantText=o=>o.want.map(w=>nameOf(w.c,w.t)).join(' と ')+' がほしい';
function deliver(i){
  const o=S.orders[i]; if(!o) return false; const cells=orderCells(o); if(!cells){ sfx('no'); return false; }
  cells.forEach(ci=>{ ringAt(ci,'#8aff8a'); burst(ci,'#ffe66a',6,2.5); S.board[ci]=null; });
  S.coins+=o.coins; S.xp+=o.xp; S.stats.orders++; lastAct=AT; sel=-1;
  const W=WHO[o.who]; say(W.n,W.t[o.line]+' <b>+'+o.coins+'🪙</b>'); sfx('deliver'); toast('+'+o.coins+'🪙  +'+o.xp+'xp');
  S.orders[i]=makeOrder(); flashOrder=i; flashT=AT;
  if(S.stats.orders%6===0){ const ch=unlockedChains(); const k=ch[rnd(ch.length)]; give(4+k,0); toast('おまけ！ '+GENN[k][0]+'をもらった'); }
  levelCheck(); saveBest(); save(); renderOrders(); return true;
}
let flashOrder=-1, flashT=0;
function levelCheck(){
  while(S.xp>=xpNeed(S.level)){
    S.xp-=xpNeed(S.level); S.level++;
    const ups=[]; const L=S.level;
    if(L===2){ give(5,0); give(5,0); ups.push('🌰 栗系が解放！ 栗の木を2つプレゼント'); }
    if(L===3){ give(6,0); give(6,0); ups.push('🔥 かまど系が解放！ 薪小屋を2つプレゼント'); }
    if(L===4){ give(7,0); give(7,0); ups.push('🍵 お茶系が解放！ 茶の木を2つプレゼント'); }
    if(L>=5&&L%3===2){ give(4,0); ups.push('🌱 新しい芋畑をプレゼント'); }
    if(L===3||L===5||L===7) ups.push('📐 盤面がひろがった！（'+rowsOpen(L)+'行）');
    const r=RENO.find(x=>x.lv===L); if(r) ups.push('🛠 「'+r.n+'」への改装ができるように！');
    if(!ups.length) ups.push('お客さんの注文が、すこし豪華になるよ');
    sfx('level'); saveBest();
    showModal('level','<h2>店レベル '+L+'！</h2><div class="big">🎉</div>'+ups.map(u=>'<p>'+u+'</p>').join('')+'<button class="go" data-close>やったー！</button>');
    say('イモ姫','お店のレベルが上がったわ！');
    fireworks(.6);
  }
}

function renderOrders(){
  const box=$('#orders'); box.innerHTML='';

    const d=document.createElement('div'); d.className='ord'+(flashOrder===i&&AT-flashT<.6?' flash':''); d.dataset.i=i;

    let w='<div class="want">'; const tmp=Object.assign({},have);
    o.want.forEach(x=>{ const k=x.c*16+x.t, ok=tmp[k]>0; if(ok) tmp[k]--; w+='<div class="w '+(ok?'ok':'no')+'"><canvas width="68" height="68" data-sp="'+x.c+','+x.t+',1"></canvas></div>'; });

}
bd.addEventListener('pointerdown',e=>{
  if(!started||modalKind) return; const p=ptr(e);
  if(p.i<0||!S.board[p.i]||!isOpen(p.i)) return;
  DR={from:p.i,sx:e.clientX,sy:e.clientY,px:p.x,py:p.y,moved:false,id:e.pointerId};
  try{ bd.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});
bd.addEventListener('pointermove',e=>{
  if(!DR||e.pointerId!==DR.id) return; const p=ptr(e); DR.px=p.x; DR.py=p.y;
  if(!DR.moved&&Math.hypot(e.clientX-DR.sx,e.clientY-DR.sy)>8) DR.moved=true;
  if(DR.moved){ const tr=$('#trash').getBoundingClientRect(); hoverTrash=e.clientX>=tr.left-8&&e.clientX<=tr.right+8&&e.clientY>=tr.top-10&&e.clientY<=tr.bottom+10; hoverCell=hoverTrash?-1:(p.i>=0&&isOpen(p.i)?p.i:-1); }
  e.preventDefault();
});
function endPtr(e,cancel){
  if(!DR||e.pointerId!==DR.id) return; const d=DR; DR=null;
  if(cancel) return;
  if(!d.moved){ const it=S.board[d.from]; if(!it) return; lastAct=AT; if(it.c>=4) tapGen(d.from); else { sel=sel===d.from?-1:d.from; cap(infoText(it)); sfx('tap'); } return; }
  const to=hoverTrash?-1:hoverCell;
  if(to===-1&&!hoverTrash) return;
  if(to===d.from) return;
  dropFx=d.px-.5; dropFy=d.py-.95; drag(d.from,to,false); dropFx=dropFy=null;
  const it=S.board[to]; if(it) cap(infoText(it));
}
bd.addEventListener('pointerup',e=>endPtr(e,false));
bd.addEventListener('pointercancel',e=>endPtr(e,true));

  if(b){ if(canDeliver(i)) deliver(i); else { sfx('no'); const W=WHO[o.who]; say(W.n,W.l[o.line].replace('{w}',o.want.map(w=>nameOf(w.c,w.t)).join(' と '))); } }
  else { const W=WHO[o.who]; say(W.n,W.l[o.line].replace('{w}',o.want.map(w=>nameOf(w.c,w.t)).join(' と '))); }
});

$('#resetBtn').addEventListener('click',()=>{ if(!resetArm){ resetArm=1; $('#resetBtn').textContent='ほんとうに消す？（もう一度おす）'; return; } try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetGame(); });
$('#sndBtn').addEventListener('click',()=>{ snd=!snd; ls(SND_KEY,snd?'1':'0'); $('#sndBtn').textContent=snd?'🔊':'🔇'; if(snd) sfx('tap'); });

function setAuto(b){
  auto=!!b; const ab=$('#autoBtn'); ab.setAttribute('aria-pressed',auto?'true':'false'); autoCd=0;
  if(auto){ if(modalKind==='dex'||modalKind==='reno') closeModal(); if(!started) startGame(); }
}

/* ================= オート（TAS 風） ================= */
function wantedTotals(){ const m={}; S.orders.forEach(o=>o&&o.want.forEach(w=>{ const k=w.c*16+w.t; m[k]=(m[k]||0)+1; })); return m; }
function missingWants(){
  const cnt={}; S.board.forEach(it=>{ if(it){ const k=it.c*16+it.t; cnt[k]=(cnt[k]||0)+1; } });
  const miss=[]; S.orders.forEach(o=>o&&o.want.forEach(w=>{ const k=w.c*16+w.t; if(cnt[k]>0) cnt[k]--; else miss.push(w); })); return miss;
}
function bestMerge(force){
  const groups={}; S.board.forEach((it,i)=>{ if(it&&isOpen(i)&&it.t<maxT(it.c)){ const k=it.c*16+it.t; (groups[k]=groups[k]||[]).push(i); } });
  const wt=wantedTotals(), miss=missingWants(), mk=new Set(miss.map(w=>w.c*16+w.t)), e=emptyCells().length;
  let best=null, bs=-1e9;
  for(const k in groups){
    const idx=groups[k]; if(idx.length<2) continue; const c=S.board[idx[0]].c, t=S.board[idx[0]].t;
    const avail=c>=4?idx.length:idx.length-(wt[k]||0); if(avail<2&&!force) continue;
    let sc=10+t*1.5;
    if(c<4){ if(mk.has(c*16+t+1)) sc+=100; else { let bd=0; for(const m of miss) if(m.c===c&&m.t>t+1) bd=Math.max(bd,60/(m.t-t)); sc+=bd; } } else sc+=70;
    if(c===0) sc+=t*2.5;
    if(e<=5) sc+=15;
    if(sc>bs){ bs=sc; best=[idx[0],idx[1]]; }
  }
  return best;
}
function chainDeficit(){
  const def=[0,0,0,0], maxNeed=[-1,-1,-1,-1], miss=missingWants();
  miss.forEach(m=>{ def[m.c]+=Math.pow(2,m.t); maxNeed[m.c]=Math.max(maxNeed[m.c],m.t); });
  const wt=wantedTotals(), cnt={};
  S.board.forEach(it=>{ if(it&&it.c<4){ const k=it.c*16+it.t; cnt[k]=(cnt[k]||0)+1; } });
  for(const k in cnt){ const c=k>>4, t=k&15; if(t>=maxNeed[c]) continue; const free=cnt[k]-Math.min(cnt[k],wt[k]||0); def[c]-=free*Math.pow(2,t); }
  return def;
}
function autoPickGen(){
  const gens=[]; S.board.forEach((it,i)=>{ if(it&&it.c>=4&&isOpen(i)) gens.push(i); }); if(!gens.length) return -1;
  const def=chainDeficit(); let best=-1, bs=-1e9;
  gens.forEach(i=>{ const it=S.board[i], k=it.c-4; const sc=(def[k]>0?100+def[k]:0)+it.t*3+(k===0?20:0); if(sc>bs){ bs=sc; best=i; } });
  return best;
}
function autoSellOne(){
  const wt=wantedTotals(); let best=-1, bs=1e9;
  S.board.forEach((it,i)=>{ if(!it||it.c>=4||!isOpen(i)) return; const sc=val(it.t)+((wt[it.c*16+it.t]||0)>0?1000:0); if(sc<bs){ bs=sc; best=i; } });
  if(best>=0) drag(best,-1,true);
}
function autoThink(){
  fillOrders();
  for(let i=0;i<3;i++) if(canDeliver(i)){ deliver(i); autoCd=.3; return; }
  if(renoAvail()){ buyReno(); autoCd=.3; return; }
  const m=bestMerge(false);
  if(m){ drag(m[0],m[1],true); autoCd=.15; return; }
  if(emptyCells().length<=6){ const wt0=wantedTotals(); for(let i=0;i<N;i++){ const it=S.board[i]; if(it&&it.c<4&&it.t===maxT(it.c)&&!wt0[it.c*16+it.t]&&isOpen(i)){ drag(i,-1,true); autoCd=.15; return; } } }
  updEnergy();
  const gi=autoPickGen();
  if(gi>=0&&emptyCells().length>0){
    if(S.energy>0){ tapGen(gi); autoCd=.12; return; }
    if(autoTurbo){ addTime(120); autoCd=.04; return; }
    autoCd=.5; return;
  }
  const f=bestMerge(true); if(f){ drag(f[0],f[1],true); autoCd=.15; return; }
  if(emptyCells().length===0){ autoSellOne(); autoCd=.2; return; }
  autoCd=.4;
}

/* ================= 進行 ================= */
function step(dt,ext){
  if(!S) return; dt=Math.max(0,dt);
  if(ext) S.off+=dt*1000;
  AT+=dt; updEnergy();
  if(FX.later&&FX.later.length){ for(let k=FX.later.length-1;k>=0;k--){ const l=FX.later[k]; if(AT>=l.at){ FX.later.splice(k,1); l.f(); } } }
  if(bubT&&AT>bubT){ $('#bubble').classList.remove('on'); bubT=0; }
  if(toastT&&AT>toastT){ $('#toast').classList.remove('on'); toastT=0; }
  if(S.pending.length) flushPending();
  if(modalKind){ modalAge+=dt; if(auto&&modalAge>(modalKind==='legend'?2.4:.9)) closeModal(); }
  if(auto&&started&&!modalKind){ autoCd-=dt; if(autoCd<=0) autoThink(); }
  else if(!auto&&started&&!modalKind&&!DR){
    if(AT-lastAct>7){ const m=bestMerge(true); hintPair=m; } else hintPair=null;
  }
  if(FX.parts.length>600) FX.parts.length=600;
}
function startGame(){
  if(started) return; started=true; $('#title').hidden=true; lastAct=AT;
  const e0=S.energy; updEnergy(); if(S.energy>e0+1) setTimeout(()=>toast('元気が'+(S.energy-e0)+'かいふくしたよ'),300);
  say('イモ姫','いらっしゃいませ！ 畑をタップして、同じものを重ねてね');
}
function resetGame(){
  S=newState(); fillOrders(); started=false; resetArm=0; sel=-1; FX.parts.length=FX.rings.length=FX.txts.length=0; FX.later=[]; hintPair=null;
  $('#resetBtn').hidden=true; $('#startBtn').textContent='▶ はじめる'; $('#resetBtn').textContent='はじめからにする'; sigO=''; save(); startGame();
}
function boot(){
  snd=ls(SND_KEY)!=='0'; $('#sndBtn').textContent=snd?'🔊':'🔇'; loadBest();
  const loaded=load(); S=loaded||newState(); fillOrders();
  S.orders.forEach(o=>{ if(!o.want||!o.want.length) Object.assign(o,makeOrder()); });
  if(loaded){ $('#startBtn').textContent='▶ つづきから'; $('#resetBtn').hidden=false; }
  updEnergy(); resize(); drawTitle(); save();
}

/* ================= テスト用フック ================= */
window.__merge={
  get board(){ return S.board.map(x=>x?{c:x.c,t:x.t,name:nameOf(x.c,x.t)}:null); },
  get energy(){ updEnergy(); return S.energy; },
  get coins(){ return S.coins; },
  get level(){ return S.level; },
  get xp(){ return S.xp; },
  get orders(){ return S.orders.map((o,i)=>({who:WHO[o.who].n,want:o.want.map(w=>({c:w.c,t:w.t,name:nameOf(w.c,w.t)})),coins:o.coins,xp:o.xp,ready:canDeliver(i)})); },
  get dex(){ return S.dex.map(a=>a.slice()); },
  get stats(){ return Object.assign({},S.stats,{reno:S.reno,stage:stageOf()}); },
  get best(){ return Object.assign({},best); },
  get auto(){ return auto; },
  get started(){ return started; },
  get modal(){ return modalKind; },
  get empty(){ return emptyCells().length; },
  step:(dt)=>step(dt,true),
  tapGen:(i)=>tapGen(i),
  drag:(a,b)=>drag(a,b,true),
  deliver:(i)=>deliver(i),
  setAuto:(b)=>setAuto(b),
  addTime:(s)=>addTime(s),
  start:()=>startGame(),
  closeModal:()=>closeModal(),
  buyReno:()=>buyReno(),
  setAutoTurbo:(b)=>{ autoTurbo=!!b; },
  bestMerge:(f)=>bestMerge(!!f),
  setMute:(b)=>{ snd=!b; },
  freeze:(b)=>{ frozen=!!b; },
  // 撮影・検証用
  cheat:(o)=>{ if(o.coins!=null) S.coins=o.coins; if(o.level!=null){ S.level=o.level; } if(o.xp!=null) S.xp=o.xp; if(o.energy!=null){ S.energy=o.energy; S.eBase=now(); } if(o.reno!=null) S.reno=o.reno; levelCheck(); save(); },
  put:(i,c,t)=>{ S.board[i]=c==null?null:{c,t}; if(c!=null) S.dex[c][t]=1; save(); },
  clear:()=>{ S.board.fill(null); save(); },
  giveGen:(c,t)=>give(c,t),
  newOrders:()=>{ S.orders=[]; fillOrders(); sigO=''; },
  setOrder:(i,want)=>{ const o=makeOrder(); o.want=want; o.coins=want.reduce((a,w)=>a+Math.round(val(w.t)*1.25),0); S.orders[i]=o; sigO=''; },
  reset:()=>{ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} resetGame(); },
  openDex:()=>showModal('dex',dexHtml()), openReno:()=>showModal('reno',renoHtml()),
  setSel:(i)=>{ sel=i; },
  render:()=>render(),
  get cell(){ return cell; }
};

let lastTs=performance.now(), frozen=false;
function loop(ts){ const dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts; if(S&&!document.hidden){ if(!frozen) step(dt,false); render(); } requestAnimationFrame(loop); }
addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(bwrap);
boot();
requestAnimationFrame(loop);
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
