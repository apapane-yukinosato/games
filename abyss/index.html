<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="ディアブロ風の地下迷宮アクションRPG。ちいさな勇者（ねこ・うさぎ・ひよこ）でぽかぽか村から地下16階へ。パソコンの横長画面向け。">
<title>もふアビス</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<style>
:root{--u:1;--ink:#F6EEDC;--gold:#F4C95D;--gold2:#B8862B;--panel:#241A33;--panel2:#33264A;--line:#8C6A3A;--red:#FF6B7A;--blue:#6FA8FF;--green:#7BE0A0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0714;color:var(--ink);overscroll-behavior:none;touch-action:none}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","IPAPGothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default;background:#0B0714}
#hdr{position:fixed;left:.4rem;top:.4rem;z-index:30;display:flex;gap:.35rem;align-items:center;font-size:.72rem;opacity:.85}
#hdr:hover{opacity:1}
#hdr a,#hdr button{font-size:.72rem;font-weight:800;line-height:1;color:#F6EEDC;text-decoration:none;background:rgba(36,26,51,.78);border:1px solid #6B5530;border-radius:99px;padding:.32rem .6rem;cursor:pointer;white-space:nowrap}
#hdr button[aria-pressed=true]{background:var(--gold);color:#2A1B00;border-color:#fff}
#hdr a:hover,#hdr button:hover{background:#4A3768}
#hdr button[aria-pressed=true]:hover{background:#FFE08A}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#land{position:fixed;left:50%;top:2.8rem;transform:translateX(-50%);z-index:40;background:rgba(255,230,160,.96);color:#3A2308;font-weight:800;font-size:.85rem;padding:.5rem .9rem;border-radius:.8rem;text-align:center;max-width:92vw;pointer-events:none;box-shadow:0 .2rem .8rem rgba(0,0,0,.5)}
.panel{position:fixed;z-index:20;background:linear-gradient(180deg,#2E2342,#1E152D);border:.18rem solid var(--line);border-radius:.6rem;box-shadow:0 .4rem 1.4rem rgba(0,0,0,.65),inset 0 0 0 .12rem #14101D;padding:.6rem;font-size:.82rem}
.panel h3{margin:0 0 .4rem;font-size:1rem;color:var(--gold);text-align:center;letter-spacing:.08em}
.panel .x{position:absolute;right:.35rem;top:.3rem;width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--line);background:#14101D;cursor:pointer;line-height:1;font-weight:800;padding:0}
.btn{font:inherit;font-weight:800;font-size:.85rem;border:.12rem solid #5C4420;border-radius:.5rem;padding:.4rem .8rem;background:linear-gradient(180deg,#F8D77A,#D6A33B);color:#2A1B00;cursor:pointer;box-shadow:0 .15rem 0 #7A5712}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(.1rem);box-shadow:0 .05rem 0 #7A5712}
.btn.alt{background:linear-gradient(180deg,#6A5A8C,#4A3C68);color:#F6EEDC;border-color:#2A2040;box-shadow:0 .15rem 0 #1E1530}
.btn:disabled{filter:grayscale(.9) brightness(.6);cursor:default}
/* inventory */
#inv{right:.5rem;top:2.6rem;width:21.4rem}
#invEq{position:relative;height:17.2rem;margin:.2rem auto .4rem;width:19.2rem;background:radial-gradient(circle at 50% 45%,#3A2C52,#1E162D);border-radius:.4rem;border:1px solid #4A3768}
.slot{position:absolute;border:1px solid #6B5530;background:rgba(10,6,16,.55);border-radius:.25rem}
.slot em{position:absolute;left:0;right:0;bottom:.05rem;text-align:center;font-style:normal;font-size:.6rem;color:#8A7AA8;pointer-events:none}
.slot.ok{box-shadow:0 0 0 .13rem #7BE0A0 inset}.slot.ng{box-shadow:0 0 0 .13rem #FF6B7A inset}
#invGrid{position:relative;width:19.2rem;height:7.7rem;margin:0 auto;background:rgba(10,6,16,.55);border:1px solid #4A3768;border-radius:.3rem;display:grid;grid-template-columns:repeat(10,1.92rem);grid-template-rows:repeat(4,1.92rem)}
#invGrid i{border:1px solid rgba(140,106,58,.28)}
.it{position:absolute;cursor:pointer}
.it canvas{display:block;width:100%;height:100%}
.it.sel{filter:brightness(1.3)}
#invGold{margin-top:.45rem;text-align:center;font-weight:800;color:var(--gold)}
/* char sheet */
#chr{left:.5rem;top:2.6rem;width:19.5rem}
#chr .row{display:flex;justify-content:space-between;align-items:center;padding:.12rem .2rem;border-bottom:1px solid rgba(140,106,58,.25)}
#chr .row b{color:var(--gold)}
#chr .stat{display:flex;align-items:center;gap:.3rem;padding:.14rem .2rem}
#chr .stat span:first-child{width:4.2rem}
#chr .stat b{width:2.4rem;text-align:right}
#chr .stat small{color:#9C8CB8;width:3.6rem}
#chr .plus{width:1.4rem;height:1.4rem;padding:0;border-radius:.3rem;border:1px solid #fff;background:#3FB36B;font-weight:800;cursor:pointer;color:#fff;line-height:1}
#chr .pts{color:#7BE0A0;font-weight:800;text-align:center;margin:.2rem 0}
.bad{color:#FF8C9A}.good{color:#7BE0A0}
/* spells */
#spl{left:50%;bottom:7.2rem;transform:translateX(-50%);width:27rem}
#spl .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.sp{border:1px solid #6B5530;border-radius:.4rem;background:#1A1226;padding:.3rem;text-align:center;cursor:pointer;font-size:.7rem;position:relative}
.sp:hover{background:#3A2C52}
.sp.cur{box-shadow:0 0 0 .14rem var(--gold)}
.sp.lock{opacity:.4;cursor:default}
.sp canvas{width:2.6rem;height:2.6rem;display:block;margin:0 auto .1rem}
.sp kbd{position:absolute;right:.2rem;top:.1rem;font-size:.62rem;color:var(--gold);font-family:inherit;font-weight:800}
/* shop / dialog */
#shop{left:.5rem;top:2.6rem;width:42rem;max-height:calc(100vh - 9rem);display:flex;flex-direction:column}
#shopBody{overflow:auto;display:flex;flex-wrap:wrap;gap:.4rem;align-content:flex-start;padding:.2rem;min-height:12rem}
.sitem{display:flex;align-items:center;gap:.5rem;width:calc(50% - .2rem);border:1px solid #4A3768;border-radius:.4rem;background:rgba(10,6,16,.5);padding:.25rem .4rem;cursor:pointer;min-height:3.2rem}
.sitem:hover{background:#3A2C52;border-color:var(--gold)}
.sitem.no{opacity:.5}
.sitem .ic{flex:none;display:flex;align-items:center;justify-content:center;width:3.6rem;height:4.8rem}
.sitem .nm{font-weight:800;font-size:.78rem}
.sitem .pr{color:var(--gold);font-size:.74rem}
.tabs{display:flex;gap:.4rem;margin:.2rem 0 .3rem;flex-wrap:wrap}
#dlg{left:50%;bottom:7.4rem;transform:translateX(-50%);width:38rem;display:flex;gap:.8rem;align-items:flex-start}
#dlg canvas{flex:none;width:6rem;height:6rem;border-radius:.5rem;background:#3A2C52;border:1px solid var(--line)}
#dlg .tx{flex:1}
#dlg .nm{font-weight:800;color:var(--gold);margin-bottom:.2rem}
#dlg p{margin:.2rem 0 .5rem;line-height:1.65;font-size:.88rem}
#dlg .opts{display:flex;gap:.4rem;flex-wrap:wrap}
#tip{position:fixed;z-index:60;pointer-events:none;max-width:17rem;background:rgba(14,9,22,.96);border:1px solid var(--gold2);border-radius:.4rem;padding:.4rem .55rem;font-size:.76rem;line-height:1.5;box-shadow:0 .2rem .8rem rgba(0,0,0,.7)}
#tip b.t{display:block;font-size:.88rem}
#tip .q0{color:#F6EEDC}#tip .q1{color:#8FB4FF}#tip .q2{color:#FFD25A}#tip .qx{color:#C8C0D8}
#tip .mod{color:#8FB4FF}#tip .req{color:#C8C0D8}#tip .sell{color:var(--gold)}
#cur{position:fixed;z-index:55;pointer-events:none;opacity:.92}
#cur canvas{display:block;width:100%;height:100%}
#msgs{position:fixed;left:50%;transform:translateX(-50%);bottom:8.6rem;z-index:12;text-align:center;pointer-events:none;width:44rem;max-width:96vw}
#msgs div{font-size:.9rem;font-weight:800;color:#FFF3C8;text-shadow:0 0 .2rem #000,0 .08rem 0 #000;margin-top:.15rem;transition:opacity .5s}
#msgs div.bad{color:#FF9AA6}#msgs div.good{color:#9AF0B8}#msgs div.say{color:#FFD1F0;font-size:1.05rem}
.scr{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(120% 90% at 50% 40%,rgba(54,34,86,.72),rgba(8,4,14,.94))}
.scr.top{justify-content:flex-start;padding-top:5vh;background:linear-gradient(180deg,rgba(28,14,48,.88) 0%,rgba(28,14,48,.55) 45%,rgba(28,14,48,.05) 100%)}
.scr h1{margin:0;font-size:3.2rem;letter-spacing:.12em;color:#FFE9A8;text-shadow:0 .2rem 0 #8A5A18,0 0 1.4rem #FF9AD0;line-height:1.15;text-align:center}
.scr h2{margin:.2rem 0 .4rem;font-size:1.3rem;color:#FFC8E8;text-align:center}
.scr p{margin:.3rem 0;max-width:42rem;text-align:center;line-height:1.7}
.scr .row{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
.cls{width:13rem;border:.15rem solid var(--line);border-radius:.8rem;background:rgba(30,20,48,.9);padding:.6rem;text-align:center;cursor:pointer}
.cls:hover{border-color:var(--gold);background:rgba(70,48,100,.95);transform:translateY(-.2rem)}
.cls canvas{width:9rem;height:9rem}
.cls b{display:block;color:var(--gold);font-size:1.05rem}
.cls small{display:block;color:#C8BCE0;line-height:1.5;font-size:.74rem;margin-top:.2rem}
.big{font:inherit;font-weight:800;font-size:1.1rem;padding:.7rem 1.6rem;min-width:13rem}
#menu{left:50%;top:50%;transform:translate(-50%,-50%);width:18rem;display:flex;flex-direction:column;gap:.5rem;text-align:center}
.help{font-size:.78rem;color:#C8BCE0;line-height:1.7}
.help kbd{background:#14101D;border:1px solid var(--line);border-radius:.25rem;padding:0 .3rem;color:var(--gold);font-family:inherit;font-weight:800}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hdr">
  <a href="../">← 一覧</a>
  <button id="bSnd" title="おと">🔊</button>
  <button id="bAuto" aria-pressed="false" title="Oキー">🤖 オート</button>
  <button id="bFs" title="Fキー">⛶ 全画面</button>
</div>
<div id="land" hidden>パソコンの横長画面であそんでね（スマホは横向きに）</div>
<div id="msgs"></div>
<div class="panel" id="inv" hidden></div>
<div class="panel" id="chr" hidden></div>
<div class="panel" id="spl" hidden></div>
<div class="panel" id="shop" hidden></div>
<div class="panel" id="dlg" hidden></div>
<div class="panel" id="menu" hidden></div>
<div id="cur" hidden></div>
<div id="tip" hidden></div>
<div class="scr top" id="scrTitle" hidden></div>
<div class="scr" id="scrClass" hidden></div>
<div class="scr" id="scrDead" hidden></div>
<div class="scr" id="scrEnd" hidden></div>
<script>
'use strict';
(()=>{
/* ===================================================================
   もふアビス  ―ちいさな勇者と地下迷宮―   (Diablo-like cute dungeon crawler)
   Sections: 1 core/audio  2 data  3 mapgen  4 hero/items  5 combat/ai
             6 render  7 ui  8 input  9 auto  10 main/hooks
   =================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG=mulberry(1);               // gameplay rng (deterministic, seeded per new game)
const rnd=()=>RNG();
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const rf=(a,b)=>a+RNG()*(b-a);
const pick=a=>a[Math.floor(RNG()*a.length)];
const chance=p=>RNG()<p;
const FX=Math.random;               // cosmetic only
const fr=(a,b)=>a+FX()*(b-a);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ---------- audio (WebAudio synthesis) ---------- */
let AX=null, MG=null, sndOn=lsGet('abyss.snd')!=='0', lastSfx={};
function ac(){
  if(!AX){ try{ AX=new (window.AudioContext||window.webkitAudioContext)(); MG=AX.createGain(); MG.gain.value=.55; MG.connect(AX.destination);}catch(e){ AX=null; } }
  if(AX&&AX.state==='suspended'){ try{AX.resume();}catch(e){} }
  return AX;
}
function tone(f,d,type,vol,slide,delay,dest){
  if(!sndOn) return; const a=ac(); if(!a) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+Math.min(.02,d/3)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(dest||MG); o.start(t); o.stop(t+d+.03);
}
let NB=null;
function noise(d,vol,fc,q,delay){
  if(!sndOn) return; const a=ac(); if(!a) return;
  if(!NB){ NB=a.createBuffer(1,a.sampleRate,a.sampleRate); const ch=NB.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
  const t=a.currentTime+(delay||0), s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=NB; s.loop=true; f.type='bandpass'; f.frequency.value=fc||1200; f.Q.value=q||1;
  g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t); s.stop(t+d+.03);
}
const SFX={
  swing:()=>noise(.12,.12,1800,.8),
  hit:()=>{noise(.1,.22,700,.9); tone(180,.1,'square',.1,.5);},
  shoot:()=>{tone(700,.12,'triangle',.1,.4); noise(.06,.08,2600,1);},
  fire:()=>{noise(.25,.18,900,.7); tone(300,.25,'sawtooth',.07,2);},
  zap:()=>{tone(1400,.18,'sawtooth',.09,.3); noise(.14,.12,3200,1.5);},
  boom:()=>{noise(.5,.3,300,.6); tone(90,.4,'sine',.25,.4);},
  heal:()=>{tone(660,.14,'sine',.12); tone(880,.14,'sine',.12,0,.09); tone(1320,.2,'sine',.1,0,.18);},
  coin:()=>{tone(1320,.07,'square',.07); tone(1760,.12,'square',.07,0,.06);},
  pick:()=>{tone(520,.07,'triangle',.12); tone(780,.09,'triangle',.12,0,.05);},
  click:()=>tone(900,.04,'square',.05),
  potion:()=>{tone(300,.1,'sine',.15,2); tone(450,.12,'sine',.12,1.5,.08);},
  lvl:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.14,0,i*.09));},
  die:()=>{tone(400,.35,'triangle',.14,.3); noise(.2,.1,500,1);},
  hurt:()=>{tone(220,.14,'sawtooth',.12,.5);},
  door:()=>{noise(.3,.12,300,2); tone(120,.25,'sine',.1,1.4);},
  roar:()=>{tone(110,.7,'sawtooth',.18,.6); noise(.6,.2,250,.8);},
  cast:()=>{tone(500,.2,'sine',.1,2.2);},
  stone:()=>{tone(900,.25,'triangle',.1,.4); noise(.15,.1,2200,1);},
  tp:()=>{tone(300,.5,'sine',.14,3); tone(450,.5,'sine',.1,3,.05);},
  err:()=>tone(160,.12,'square',.08),
  buy:()=>{tone(880,.06,'square',.07); tone(1175,.1,'square',.07,0,.05);},
  win:()=>{[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'triangle',.15,0,i*.14));}
};
function sfx(n){ if(!sndOn) return; const t=performance.now(); if(lastSfx[n]&&t-lastSfx[n]<45) return; lastSfx[n]=t; try{SFX[n]&&SFX[n]();}catch(e){} }
/* simple procedural BGM: slow arpeggios per theme */
const BGM={theme:'',step:0,timer:0,gain:null,on:false};
const SCALES={town:[0,2,4,7,9,12,14,16],cath:[0,3,5,7,10,12,15,17],cata:[0,2,3,7,8,12,14,15],cave:[0,2,5,7,9,12,14,17],hell:[0,1,4,5,7,8,11,12],boss:[0,1,3,6,7,8,12,13]};
const BASEF={town:261.6,cath:196,cata:174.6,cave:185,hell:130.8,boss:123.5};
function bgmTick(){
  if(!sndOn||!BGM.theme||!AX) return;
  const th=BGM.theme, sc=SCALES[th], bf=BASEF[th], t=BGM.step++;
  const speed=th==='town'?1:th==='boss'?1:1;
  const pat=[0,2,4,2,5,3,6,4]; const idx=pat[t%8]+((t>>3)%4===2?1:0);
  const n=sc[idx%sc.length], f=bf*Math.pow(2,n/12);
  const dest=BGM.gain;
  tone(f,th==='town'?.5:.9,th==='town'?'triangle':'sine',th==='boss'?.07:.05,0,0,dest);
  if(t%8===0) tone(bf/2,3.2,'sine',.06,0,0,dest);
  if(th==='town'&&t%4===2) tone(f*2,.25,'square',.012,0,0,dest);
  if(th==='boss'||th==='hell'){ if(t%4===0) noise(.18,.04,200,1); }
}
function bgmSet(th){
  if(BGM.theme===th) return; BGM.theme=th;
  if(!BGM.timer){ BGM.timer=setInterval(bgmTick,420); }
  const a=ac(); if(a&&!BGM.gain){ BGM.gain=a.createGain(); BGM.gain.gain.value=.8; BGM.gain.connect(MG); }
}
function setSound(on){ sndOn=on; lsSet('abyss.snd',on?'1':'0'); $('#bSnd').textContent=on?'🔊':'🔇'; if(on) ac(); }

/* ---------- misc helpers ---------- */
function shuffle(a,r){ for(let i=a.length-1;i>0;i--){ const j=Math.floor((r||RNG)()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0'); }
/* =================== 2. DATA =================== */
const CLASSES={
  warrior:{id:'warrior',name:'ねこ騎士 ミケ',job:'戦士',base:{str:30,mag:10,dex:20,vit:25},cap:{str:250,mag:50,dex:60,vit:100},lifeV:2,lifeL:2,lifeB:18,manaV:1,manaL:1,skill:'repair',
    desc:'つよくてタフな ねこの騎士。けんとたてで まえに出てたたかう。<br>とくぎ：しゅうり'},
  rogue:{id:'rogue',name:'うさぎ弓使い ピョン',job:'ローグ',base:{str:20,mag:15,dex:30,vit:20},cap:{str:55,mag:70,dex:250,vit:80},lifeV:1.5,lifeL:2,lifeB:13,manaV:1.5,manaL:1,skill:'disarm',
    desc:'すばしこい うさぎの弓つかい。とおくから ねらいうち。<br>とくぎ：わなかいじょ'},
  sorc:{id:'sorc',name:'ひよこ魔法使い ピヨ',job:'ソーサラー',base:{str:15,mag:35,dex:15,vit:20},cap:{str:45,mag:250,dex:85,vit:80},lifeV:1,lifeL:1,lifeB:9,manaV:2,manaL:2,skill:'recharge',
    desc:'まほうが とくいな ひよこ。ファイアボルトで ぽかぽか。<br>とくぎ：つえのじゅうてん'}
};
const SPELLS={
  firebolt:{n:'ファイアボルト',c:'#FF8A3C',mana:6,req:15,dl:1,price:1000,desc:'ほのおの たまを とばす'},
  heal:{n:'ヒール',c:'#FF7FA8',mana:5,req:17,dl:1,price:1000,desc:'じぶんの いのちを かいふく'},
  lightning:{n:'ライトニング',c:'#FFE76A',mana:10,req:20,dl:3,price:1500,desc:'いなずまの ビームで つらぬく'},
  townportal:{n:'タウンポータル',c:'#7FD0FF',mana:35,req:20,dl:3,price:2000,desc:'むらへの ポータルを ひらく'},
  stone:{n:'ストーンカース',c:'#C8A0FF',mana:12,req:25,dl:4,price:1800,desc:'てきを あめ細工に かためる'},

/* ---------- caves ---------- */
function genCaveLevel(d,seed){
  for(let attempt=0;attempt<12;attempt++){
    const W=60,H=60; const r=mkR(seed+attempt*977); const lv=newLevel(d,W,H);

    for(let it=0;it<5;it++){ const ng=new Uint8Array(W*H); for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ let c=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) c+=g[(y+j)*W+x+i]; ng[y*W+x]=(c>=5||(it<2&&c<=1))?1:0; } for(let x=0;x<W;x++){ng[x]=1;ng[(H-1)*W+x]=1;} for(let y=0;y<H;y++){ng[y*W]=1;ng[y*W+W-1]=1;} g=ng; }
    for(let i=0;i<W*H;i++) lv.t[i]=g[i]?T_ROCK:T_FLOOR;
    // largest region

    const f=bfsField(lv,bestStart%W,(bestStart/W)|0,0); for(let i=0;i<W*H;i++) if(lv.t[i]===T_FLOOR&&f[i]<0) lv.t[i]=T_ROCK;

    // pseudo rooms for populating: sample open areas
    lv.rooms=[]; for(let q=0;q<14;q++){ const x=r.i(4,W-5), y=r.i(4,H-5); if(lv.t[y*W+x]===T_FLOOR) lv.rooms.push({x:x-2,y:y-2,w:5,h:5,cave:true}); }

/* ---------- town ---------- */
function genTown(maxD){

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ lv.t[y*W+x]=(x<2||y<2||x>W-3||y>H-3)?T_ROCK:T_FLOOR; lv.sty[y*W+x]=(lv.t[y*W+x]===T_ROCK)?1:0; }
  const house=(x0,y0,x1,y1,id)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ lv.t[y*W+x]=T_ROCK; lv.sty[y*W+x]=2; } lv.deco.push({k:'house',x0,y0,x1,y1,id}); };
  house(8,6,14,10,'smith'); house(22,6,27,10,'witch'); house(4,15,9,19,'healer'); house(26,16,31,20,'tavern');
  // fountain
  for(const [x,y] of [[17,15],[18,15],[17,16],[18,16]]){ lv.t[y*W+x]=T_ROCK; lv.sty[y*W+x]=4; }
  // trees: border clumps
  const r=mkR(777);
  for(let i=0;i<60;i++){ const x=r.i(2,W-3), y=r.i(2,H-3); if(lv.t[y*W+x]!==T_FLOOR) continue;
    if(y>12&&y<32&&x>10&&x<26) continue; if(y>28) continue; if(Math.hypot(x-18,y-19)<6) continue;
    // keep NPC fronts clear
    if(Math.abs(x-11)<3&&y>10&&y<14) continue; if(Math.abs(x-24)<3&&y>10&&y<14) continue; if(Math.abs(x-6)<3&&y>19&&y<24) continue; if(Math.abs(x-28)<3&&y>20&&y<25) continue; if(x>14&&x<22&&y<14&&y>2&&y!==5) continue;
    lv.t[y*W+x]=T_ROCK; lv.sty[y*W+x]=1; }
  // stairs
  const stairs=[[18,33,1],[13,33,5],[23,33,9],[28,33,13]];
  for(const [x,y,to] of stairs){ if(to>1&&maxD<to) continue; lv.t[y*W+x]=T_DOWN; lv.downs.push({x,y,to}); }
  lv.down={x:18,y:33}; lv.up=null; lv.spawn={x:18.5,y:30.5};
  lv.npcs=[
    {id:'griswold',n:'かじやのクマ親方',x:11.5,y:12.2,kind:'bear',role:'smith'},
    {id:'adria',n:'まじょのフクロウおばば',x:24.5,y:12.2,kind:'owl',role:'witch'},
    {id:'pepin',n:'くすりやのヒツジ先生',x:6.5,y:21.2,kind:'sheep',role:'healer'},
    {id:'cain',n:'ものしりカメじい',x:19.8,y:19.2,kind:'turtle',role:'sage'},
    {id:'kid',n:'リスのコロ',x:28.5,y:22.5,kind:'squirrel',role:'kid'}
  ];
  lv.tpos={x:21.5,y:29.5};
  finishLevel(lv); lv.exp.fill(1); return lv;
}
/* ---------- level factory ---------- */
function genLevel(d,seed,maxD){
  const s=seed*1000+d*131;
  let lv;
  if(d===0) lv=genTown(maxD||0);
  else if(themeOf(d).id==='cave') lv=genCaveLevel(d,s);
  else lv=genRoomsLevel(d,s);
  if(d>0){ finishLevel(lv); lv.cr=mkR(s+5); }
  return lv;
}

function walkToward(tx,ty,dt,replanEvery){

  if(!h.path||!h.path.length||h.replan<=0){ h.path=planPath(tx,ty); h.replan=replanEvery||.4; if(!h.path) return false; }
  followPath(dt); return true;
}
function heroDist(x,y){ return Math.hypot(H.x-x,H.y-y); }
function updateHero(dt){
  const h=H, lv=G.lv, d=h.d;
  h.potCd=Math.max(0,h.potCd-dt); h.hurt=Math.max(0,h.hurt-dt); h.anim+=dt*(h.moving?11:3);
  if(h.fxPot){ h.fxPot.t-=dt; if(h.fxPot.t<=0) h.fxPot=null; }
  if(h.dead) return;
  h.life=Math.min(d.maxLife,h.life+d.regenL*dt*(G.dlvl===0?4:1)); h.mana=Math.min(d.maxMana,h.mana+d.regenM*dt*(G.dlvl===0?4:1));
  h.moving=false;
  openDoorsNear(h,1.4);
  // auto pickup gold
  for(let i=lv.items.length-1;i>=0;i--){ const g=lv.items[i]; if(g.it.t==='gold'&&Math.hypot(g.x-h.x,g.y-h.y)<1.1){ h.gold+=g.it.amt; lv.items.splice(i,1); sfx('coin'); lv.texts.push({x:h.x,y:h.y,z:50,txt:'+'+g.it.amt+'G',col:'#FFE06A',t:0,life:1}); } }
  if(h.act){ advanceAct(dt); return; }
  const o=h.order; if(!o){ return; }
  switch(o.type){
    case 'move': {
      if(!h.path||!h.path.length){ h.order=null; break; }
      followPath(dt); if(!h.path||!h.path.length) h.order=null; break; }
    case 'attack': {
      const m=o.mon; if(m.dead||m.hp<=0){ h.order=null; break; }
      const dd=Math.hypot(m.x-h.x,m.y-h.y); const reach=d.ranged?9.5:1.2+m.r;
      if(dd<=reach&&(!d.ranged||rayClear(lv,h.x,h.y,m.x,m.y))){ h.face=Math.atan2(m.y-h.y,m.x-h.x); startAttack(m.x,m.y,m); }
      else if(!walkToward(m.x,m.y,dt,.3)){ o.fail=(o.fail||0)+1; if(o.fail>10){ m.ignoreT=G.time+20; h.order=null; } }
      break; }
    case 'attackPos': { startAttack(o.x,o.y,null); h.order=null; break; }
    case 'pickup': {
      const g=o.it; if(!lv.items.includes(g)){ h.order=null; break; }
      if(heroDist(g.x,g.y)<1.15){ pickupGround(g); h.order=null; } else walkToward(g.x,g.y,dt,.4); break; }
    case 'talk': { const n=o.npc; if(heroDist(n.x,n.y)<2.0){ h.face=Math.atan2(n.y-h.y,n.x-h.x); h.order=null; openNpc(n); } else walkToward(n.x,n.y+.8,dt,.4); break; }
    case 'obj': {
      const ob=o.o; if(ob.open&&ob.k!=='portal'){ h.order=null; break; }
      if(heroDist(ob.x,ob.y)<1.3){ h.order=null; h.face=Math.atan2(ob.y-h.y,ob.x-h.x); interactObj(ob); } else walkToward(ob.x,ob.y,dt,.4); break; }
    case 'stairs': {
      const s=o.s; if(heroDist(s.x+.5,s.y+.5)<.95){ h.order=null; useStairs(s); } else walkToward(s.x+.5,s.y+.5,dt,.4); break; }
  }
}
function useStairs(s){
  const d=G.dlvl;
  if(d===0){ const to=s.to; sfx('door'); if(to===1) enterLevel(1,'down'); else enterLevel(to,'shortcut'); return; }
  if(s.kind==='up'){ sfx('door'); if(d===1) enterLevel(0,'new'); else enterLevel(d-1,'up'); }
  else { if(d>=16){ say('ここが さいかそう…','say'); return; } sfx('door'); enterLevel(d+1,'down'); }
}
function stairAt(tx,ty){
  const lv=G.lv; if(G.dlvl===0){ return lv.downs.find(s=>s.x===tx&&s.y===ty)||null; }
  if(lv.down&&lv.down.x===tx&&lv.down.y===ty) return {x:tx,y:ty,kind:'down'}; if(lv.up&&lv.up.x===tx&&lv.up.y===ty) return {x:tx,y:ty,kind:'up'}; return null;
}
function pickupGround(g){
  const lv=G.lv; if(g.it.t==='gold'){ H.gold+=g.it.amt; lv.items.splice(lv.items.indexOf(g),1); sfx('coin'); return true; }
  if(addItem(H,g.it)){ lv.items.splice(lv.items.indexOf(g),1); sfx('pick'); refreshPanels(); return true; }
  say('もちものが いっぱいだよ','bad'); sfx('err'); g.skipT=G.time+40; return false;
}
/* ---------- attack acts ---------- */
function startAttack(tx,ty,mon){
  const h=H, d=h.d; if(h.act) return;
  h.face=Math.atan2(ty-h.y,tx-h.x);
  h.act={k:d.ranged?'shoot':'melee',t:0,dur:d.swing,fired:false,tx,ty,mon};
  h.path=null; sfx(d.ranged?'shoot':'swing');
}
function advanceAct(dt){
  const h=H, a=h.act; a.t+=dt; h.moving=false;
  if(!a.fired&&a.t>=a.dur*.45){ a.fired=true; resolveAct(a); }
  if(a.t>=a.dur) h.act=null;
}
function resolveAct(a){
  const h=H, d=h.d, lv=G.lv;
  if(a.k==='melee'){
    let m=a.mon; if(!m||m.dead){ // closest monster in front
      let bd=1.7; m=null; for(const q of lv.mons){ if(q.dead) continue; const dd=Math.hypot(q.x-h.x,q.y-h.y); if(dd<bd&&Math.abs(angDiff(Math.atan2(q.y-h.y,q.x-h.x),h.face))<1.2){bd=dd;m=q;} } }
    if(m&&!m.dead&&Math.hypot(m.x-h.x,m.y-h.y)<1.5+m.r){ meleeHit(m); }
    else { // objects (barrels/chests)
      for(const o of lv.objs){ if(o.k==='barrel'&&!o.open&&Math.hypot(o.x-h.x,o.y-h.y)<1.6&&Math.abs(angDiff(Math.atan2(o.y-h.y,o.x-h.x),h.face))<1.2){ breakBarrel(o); break; } }
    }
  } else if(a.k==='shoot'){
    const dx=a.tx-h.x, dy=a.ty-h.y, dd=Math.hypot(dx,dy)||1; const dmg=weaponRoll();
    lv.proj.push({k:'arrow',own:'h',x:h.x,y:h.y,vx:dx/dd*17,vy:dy/dd*17,life:.75,dmg,roll:true,rad:.3,col:'#FFF3C0',dt:'p'});
    wearWeapon();
  } else if(a.k==='cast'){ doSpell(a); }
}
function angDiff(a,b){ let d=a-b; while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU; return d; }
function weaponRoll(){ const d=H.d; return (ri(d.wmin,d.wmax)*d.mult+d.flat); }
function wearWeapon(){ const w=H.eq.lhand; if(w&&w.maxdur>0&&chance(.07)){ w.dur--; if(w.dur<=0){ say(dispName(w)+'が こわれた！','bad'); derive(H); } } }
function wearArmor(){ if(!chance(.1)) return; const arr=['head','chest','rhand'].map(s=>H.eq[s]).filter(x=>x&&x.maxdur>0&&x.dur>0); if(!arr.length) return; const it=pick(arr); it.dur--; if(it.dur<=0){ say(dispName(it)+'が こわれた！','bad'); derive(H); } }
function meleeHit(m){
  const d=H.d; const chanceHit=clamp(d.toHit-m.ac,8,95);
  if(rnd()*100>chanceHit){ G.lv.texts.push({x:m.x,y:m.y,z:40,txt:'ミス',col:'#CCC',t:0,life:.7}); sfx('swing'); return; }
  const dmg=weaponRoll(); hurtMon(m,dmg,{dt:'p',hero:true,leech:true}); wearWeapon();
}
function hurtMon(m,dmg,o){
  if(m.dead) return; o=o||{}; dmg=Math.max(1,Math.round(dmg)); const lv=G.lv;
  m.hp-=dmg; m.hitT=.2; lv.texts.push({x:m.x,y:m.y,z:44,txt:String(dmg),col:o.dt==='f'?'#FFB066':o.dt==='l'?'#FFF27A':'#FFFFFF',t:0,life:.8});
  if(!m.alert) alertMon(m); if(m.st==='statue'){ m.st='idle'; m.wake=.8; }

function alertMon(m){
  if(m.alert) return; m.alert=true; if(m.st==='statue'){ m.st='idle'; m.wake=.8; }
  const lv=G.lv;
  if(m.pack) for(const q of lv.mons){ if(q!==m&&!q.dead&&q.pack===m.pack&&!q.alert&&Math.hypot(q.x-m.x,q.y-m.y)<16){ q.alert=true; if(q.st==='statue'){ q.st='idle'; q.wake=.8; } } }
  if(m.boss){ sfx('roar'); say(m.n+'：「'+(BOSSES[m.key].intro)+'」','say'); banner(m.n,''); bgmSet('boss'); G.shake=.4; }
}
function killMon(m,o){
  if(m.dead) return; m.dead=true; m.deadT=0; m.hp=0; const lv=G.lv; sfx('die');
  const viaHero=!o||o.hero!==false; G.kills++; H.kills++;
  const xp=m.xp*clamp(1+(m.lvl-H.level)*.1,.12,2.2)*BAL.xpMul; if(viaHero) gainXP(xp);

  dropLoot(m);

}
function scatterPos(x,y){ for(let i=0;i<10;i++){ const a=rnd()*TAU, r=rf(.2,1.0); const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; if(walkable(G.lv,Math.floor(px),Math.floor(py))) return [px,py]; } return [x,y]; }
function dropLoot(m){
  const lv=G.lv, d=G.dlvl; const il=d+Math.floor(m.lvl/3);
  const place=(it)=>{ const [px,py]=scatterPos(m.x,m.y); lv.items.push({x:px,y:py,it,t:0}); };
  if(m.boss){
    const bu=BOSS_UNIQUES[m.key]; if(bu){ const it=baseItem(bu.b); makeUnique(it,bu); place(it); }
    place(genGear(il+3,{magic:true,noUnique:true})); place(mkPotion('fullheal')); place(mkPotion('fullmana')); place({t:'gold',amt:Math.round(rf(300,500)*(1+d*.4)*BAL.goldMul)});

  if(m.unique){ place(genGear(il+2,{magic:true,noUnique:false,uniq:.06})); }
  if(rnd()<.5||m.unique){ place({t:'gold',amt:Math.max(2,Math.round(ri(8,30)*(1+d*.65)*mul*BAL.goldMul))}); }
}
function questDone(m){
  const k=m.key; G.quests[k]='dead'; bgmSet(themeOf(G.dlvl).bgm);
  const msg={butcher:'ブッチャーくんを たおした！',king:'ほね王さまを たおした！',lazarus:'ラザルスくんを たおした！',diablo:'まおう ディアボンを たおした！！'}[k]; say(msg,'good'); banner(msg,'');

/* ---------- effects ---------- */
function spark(x,y,z,n,col,shape){ const lv=G.lv; if(!lv||lv.fx.length>420) return; for(let i=0;i<n;i++){ const a=FX()*TAU, s=fr(.8,3.2); lv.fx.push({k:'sp',x,y,z:z||20,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:fr(20,80),t:0,life:fr(.35,.8),col,sh:shape||(FX()<.4?'star':'dot'),sz:fr(2,4.5)}); } }
function ringFx(x,y,r1,col,life){ G.lv.fx.push({k:'ring',x,y,r:0,r1,t:0,life:life||.5,col}); }
function levelFx(){ const lv=G.lv; if(!lv) return; spark(H.x,H.y,10,30,'#FFE26A','star'); ringFx(H.x,H.y,3,'#FFE26A',.8); for(let i=0;i<10;i++) lv.fx.push({k:'sp',x:H.x+fr(-.5,.5),y:H.y+fr(-.5,.5),z:10,vx:0,vy:0,vz:fr(40,100),t:0,life:1.1,col:'#FF9AC8',sh:'heart',sz:fr(4,6)}); }
/* ---------- hero damage ---------- */
function dmgHero(dmg,dt,src){
  if(H.dead||G.god) return; const d=H.d;
  if(dt==='f'||dt==='l'||dt==='m') dmg*=(1-d.res/100);
  dmg=Math.max(1,Math.round(dmg));
  if(H.manaShield&&H.mana>0){ const lvl=spellLevel(H,'manashield')||1; const ab=Math.min(.9,.5+lvl*.03); const take=dmg*ab; const use=Math.min(H.mana,take); H.mana-=use; dmg=Math.max(0,Math.round(dmg-use)); if(H.mana<=0.5){ H.manaShield=false; say('マナシールドが きれた！','bad'); } }
  G.lastSrc=src&&src.key?src.key:(typeof src==='string'?src:dt); H.life-=dmg; H.hurt=.25; G.stats.dmgTaken+=dmg; G.lv.texts.push({x:H.x,y:H.y,z:56,txt:String(dmg),col:'#FF7A8A',t:0,life:.8}); sfx('hurt'); G.shake=Math.max(G.shake,.12);

}
function monHitHero(m,mult){
  const d=H.d; const ch=clamp(30+m.hit+m.lvl*2-d.ac,12,95);

  if(d.block>0&&rnd()*100<d.block){ G.lv.texts.push({x:H.x,y:H.y,z:50,txt:'ガード！',col:'#9AD0FF',t:0,life:.7}); sfx('click'); return; }

function heroDie(){

function respawn(){

/* ---------- spells ---------- */
function canCast(id){ const c=spellCost(H,id); return H.mana>=c; }
function castSpell(id,tx,ty,viaStaff){
  const h=H; if(h.dead||h.act) return false;
  if(h.dead) return false;
  const known=h.spells[id]||id===CLASSES[h.cls].skill||viaStaff; if(!known) return false;
  if(G.dlvl===0&&!['repair','recharge','heal'].includes(id)&&id!=='disarm'){ say('むらの なかでは まほうは つかえないよ','bad'); return false; }

  else { cost=spellCost(h,id); if(h.mana<cost){ if(!h.noManaMsg) say('マナが たりない','bad'); sfx('err'); return false; } }
  if(id==='repair'||id==='disarm'||id==='recharge'||id==='townportal'||id==='manashield'){ // instant skills
    if(!viaStaff) h.mana-=cost; doSimple(id); return true; }
  h.face=Math.atan2(ty-h.y,tx-h.x);
  h.act={k:'cast',t:0,dur:h.d.castT,fired:false,tx,ty,sp:id,cost,viaStaff:!!viaStaff};
  if(!viaStaff) h.mana-=cost; else { staffSpell(h).cur--; }

function doSimple(id){
  const h=H;

    let n=0; for(const s of SLOTS){ const it=h.eq[s]; if(it&&it.maxdur>0&&it.dur<it.maxdur){ const miss=it.maxdur-it.dur; it.dur=Math.min(it.maxdur,it.dur+Math.ceil(miss*.35)+1); it.maxdur=Math.max(3,it.maxdur-1); n++; } }

  } else if(id==='disarm'){
    let n=0; for(const o of G.lv.objs){ if(o.k==='chest'&&o.trap&&!o.open&&Math.hypot(o.x-h.x,o.y-h.y)<9){ o.trap=false; o.rev=true; n++; } }
    sfx('click'); say(n?'わなを '+n+'こ かいじょした！':'ちかくに わなは なさそう'); 
  } else if(id==='recharge'){
    const w=h.eq.lhand; if(w&&w.ch){ if(h.mana>=0){ w.ch.max=Math.max(4,w.ch.max-1); w.ch.cur=w.ch.max; sfx('heal'); say('つえを じゅうてんした！','good'); spark(h.x,h.y,40,16,'#FFD27F','star'); } }
    else say('じゅうてんできる つえが ない','bad');
  }
}
function spellDmg(id,L,M){
  switch(id){
    case 'firebolt': return ri(3+L,9+2*L)+M*.28;
    case 'lightning': return ri(3+L,8+2*L)+M*.22;
    case 'chain': return ri(5+L,12+2*L)+M*.26;
    case 'fireball': return ri(6+2*L,14+3*L)+M*.36;
    case 'nova': return ri(5+L,12+2*L)+M*.3;
    case 'firewall': return ri(2+Math.floor(L/2),5+L)+M*.07;
    case 'guardian': return ri(5+L,10+2*L)+M*.2;
  } return 1;
}
function doSpell(a){

      const dmg0=spellDmg(id,L,M); for(const m of lv.mons){ if(m.dead) continue; const pr=(m.x-h.x)*ux+(m.y-h.y)*uy; if(pr<0||pr>t+.5) continue; const pd=Math.abs((m.x-h.x)*uy-(m.y-h.y)*ux); if(pd<m.r+.35) hurtMon(m,spellDmg(id,L,M),{dt:'l',hero:true}); }

function update(dt){
  if(G.scene==='title'||G.scene==='class'||!H) return;
  if(G.scene==='end'){ if(G.auto){ G.endWait=(G.endWait||0)+dt; if(G.endWait>5){ hideAll(); newGame('sorc'); } } return; }
  if(G.scene==='dead'){ G.deadT+=dt; updateFx(dt); if(G.auto&&G.deadT>1.6) respawn(); return; }
  const lv=G.lv;
  G.time+=dt; G.frame++;

  updateHero(dt);

  if(H.visTile!==tile){ H.visTile=tile; computeVis(lv,H.x,H.y,Math.round(H.d.lightR)); }

  const b=lv.boss; const needBoss=b&&!b.dead&&(h.level>=bossReq(b.key)||d===16);
  if(needBoss){ return {t:'mon',m:b}; }
  // XP gating: hunt
  const gate=needLv(d+1); if(d<16&&h.level<gate||d===16){
    let bm=null,bd=1e9; for(const m of lv.mons){ if(m.dead||m.isBoss&&!needBoss||inAvoid(m.x,m.y)||m.skipHunt>G.time) continue; const c=pd(m.x,m.y); const cc=c-(m.unique?6:0)-(m.xp>50?3:0); if(cc<bd){ bd=cc; bm=m; } }
    if(bm&&bd<200) return {t:'mon',m:bm};
  }
  return {t:'stairs'};
}
function aiTravel(dt){
  const lv=G.lv, h=H, d=G.dlvl; AI.dbg='travel';
  if(h.order&&AI.t-AI.goalT<.6) return;
  const g=aiPickGoal(); AI.goalT=AI.t;
  if(g.t==='item'){ if(!h.order||h.order.type!=='pickup'||h.order.it!==g.g) orderPickup(g.g); }
  else if(g.t==='obj'){ if(!h.order||h.order.type!=='obj'||h.order.o!==g.o) orderObj(g.o); }
  else if(g.t==='mon'){ const m=g.m; if(!h.order||h.order.type!=='move'||Math.hypot(h.order.x-m.x,h.order.y-m.y)>2.5){ orderMove(m.x,m.y); if(!h.order) { m.ignoreT=G.time+30; m.skipHunt=G.time+30; } } }
  else { const s=lv.down; if(s){ if(!h.order||h.order.type!=='stairs') orderStairs({x:s.x,y:s.y,kind:'down'}); } else if(lv.boss&&!lv.boss.dead){ orderMove(lv.boss.x,lv.boss.y); } }
}
/* ---------- town ---------- */
function planTown(){
  const h=H; const gold=h.gold; const w=wantPots();
  const needHeal=h.life<h.d.maxLife*.8;
  const rew=questReward();
  const sells=h.inv.some(it=>isJunk(it)); const dmg=damagedWorst()<.85;
  const wantAdria=potUnits(MANAK)<w.mana||tpCount()<3&&gold>=100||(gold>1500&&AI.t-(AI.lastAdria||-999)>260);
  const wantGris=sells||dmg||(gold>1500&&AI.t-(AI.lastGris||-999)>260);
  const wantPepin=needHeal||potUnits(HEALK)<w.heal;
  const seq=[]; if(rew) seq.push('cain'); if(wantAdria) seq.push('adria'); if(wantGris) seq.push('griswold'); if(wantPepin) seq.push('pepin');
  AI.town={steps:seq,i:0,t:0};
}
function isJunk(it){
  if(['potion','scroll'].includes(it.t)) return false;
  if(it.t==='book'){ const S=SPELLS[it.k]; return !worthBook(it.k)||(H.spells[it.k]||0)>=10; }
  if(upgradeGain(it)>3) return false; return true;
}
function aiSellJunk(){ let n=0; for(const it of [...H.inv]){ if(isJunk(it)){ H.gold+=itemSellValue(it); removeFromInv(H,it); n++; } } if(n) sfx('coin'); return n; }
function buyBest(arr,priceFn,reserve){
  // buy the most beneficial affordable upgrade; returns true if bought
  let best=null,bg=4;
  for(const it of arr){ const pr=priceFn(it); if(pr>H.gold-reserve) continue; const g=upgradeGain(it); const val=g/(1+pr/1500); if(g>bg&&val>0&&(!best||g>best.g)){ best={it,g,pr}; } }
  if(!best) return false; const it=best.it; if(!addToInv(H,it)) return false; H.gold-=best.pr; const i=arr.indexOf(it); if(i>=0) arr.splice(i,1); sfx('buy'); return true;
}
function wantPots(){ return H.cls==='sorc'?{heal:3.5,mana:9}:H.cls==='rogue'?{heal:6,mana:3}:{heal:8,mana:3}; }
function buyPotions(inf,kindsH,kindsM){
  const w=wantPots(); let n=0;
  const buyUnits=(base,full,kinds,target)=>{ let guard=0; while(potUnits(kinds)<target&&guard++<14){ const rich=H.gold>2200; const c=(rich&&inf.find(x=>x.k===full))||inf.find(x=>x.k===base)||inf.find(x=>x.k===full); if(!c) break; const price=itemBuyValue(c); if(H.gold<price+(tpCount()<2?120:20)) break; const cp=Object.assign({},c,{u:uid(),m:{}}); if(!addItem(H,cp)) break; H.gold-=price; n++; } };
  if(kindsH.length) buyUnits('heal','fullheal',HEALK,w.heal); if(kindsM.length) buyUnits('mana','fullmana',MANAK,w.mana); if(n) sfx('buy'); return n;
}
function doAutoShop(id){
  const stk=ensureStock(); let did=0;
  if(id==='griswold'){ AI.lastGris=AI.t; openShop('griswold','smith'); did+=aiSellJunk();
    const rep=[...SLOTS.map(x=>H.eq[x]),...H.inv].filter(x=>x&&x.maxdur>0&&x.dur<x.maxdur*.9); for(const it of rep){ const c=repairCost(it); if(H.gold>=c+150){ H.gold-=c; doRepair(it); did++; } }
    let guard=0; const res=200; while(guard++<4&&(buyBest(stk.smith,itemBuyValue,res)||buyBest(stk.smithP,it=>Math.round(itemBuyValue(it)*1.25),res))){ did++; autoEquipOne(); }
    SHOP.tab=did?'smith':'smith';
  } else if(id==='adria'){ AI.lastAdria=AI.t; openShop('adria','witch'); const inf=SHOP.inf;
    // TP scrolls first
    const tp=inf.find(x=>x.k==='tp'); let want=Math.max(0,(G.maxD>=10?4:G.maxD>=3?3:G.maxD>=1?2:1)-tpCount()); while(want>0&&H.gold>=itemBuyValue(tp)+30){ if(!addToInv(H,Object.assign({},tp,{u:uid()}))) break; H.gold-=itemBuyValue(tp); want--; did++; }
    did+=buyPotions(inf,['heal'],['mana','fullmana']);
    // books
    for(let g=0;g<4;g++){ const books=stk.witch.filter(it=>it.t==='book'&&H.d.rawMag>=SPELLS[it.k].req&&worthBook(it.k)&&(H.spells[it.k]||0)<8).sort((a,b)=>bookPrio(a.k)-bookPrio(b.k)); const b=books.find(it=>itemBuyValue(it)<=H.gold-160); if(!b) break; if(!addToInv(H,b)) break; H.gold-=itemBuyValue(b); stk.witch.splice(stk.witch.indexOf(b),1); did++; autoBooks(); }
    let gg=0; while(gg++<3&&buyBest(stk.witch.filter(it=>it.t!=='book'),itemBuyValue,160)){ did++; autoEquipOne(); }
  } else if(id==='pepin'){ H.life=H.d.maxLife; openShop('pepin','healer'); const inf=SHOP.inf; const hk=inf.filter(x=>['heal','fullheal','rejuv','fullrejuv'].includes(x.k)).map(x=>x.k); did+=buyPotions(inf,hk.filter(k=>k!=='rejuv'&&k!=='fullrejuv'),['mana']); sfx('heal'); spark(H.x,H.y,30,14,'#FF8AB8','heart'); did++; }
  else if(id==='cain'){ const rw=questReward(); if(rw){ claimReward(rw); did++; } openShop('cain','identify'); }
  refreshPanels(); return did;
}
function bookPrio(k){ const o=['firebolt','stone','lightning','manashield','heal','fireball','chain','teleport','guardian','firewall','nova','townportal']; const i=o.indexOf(k); return i<0?99:i+(H.spells[k]||0)*3; }
function townThink(dt){
  const lv=G.lv, h=H; if(!AI.town) planTown(); const T=AI.town; T.t+=dt;
  if(AI.shopOpen){ AI.shopOpen-=dt; if(AI.shopOpen<=0){ AI.shopOpen=0; closeShop(); closeDialog(); G.panels.inv=false; refreshPanels(); } return; }
  if(aiMaintain()) return;
  const id=T.steps[T.i]; 
  if(!id||T.t>70){ return leaveTown(); }
  const n=lv.npcs.find(x=>x.id===id); if(!n){ T.i++; return; }
  const dd=heroDist(n.x,n.y);
  if(dd<2.6){ h.order=null; h.path=null; h.face=Math.atan2(n.y-h.y,n.x-h.x); doAutoShop(id); AI.shopOpen=.5; G.autoWait=0; T.i++; sfx('click'); return; }
  if(!h.order||h.order.type!=='move'||AI.t-AI.goalT>1){ orderMove(n.x,n.y+1.2); AI.goalT=AI.t; }
}
function leaveTown(){
  const lv=G.lv, h=H; const p=lv.objs.find(o=>o.k==='portal');
  if(p&&AI.trip){ if(!h.order||h.order.type!=='obj') orderObj(p); return; }
  if(p&&!AI.trip&&false) return;
  // stairs: deepest shortcut not beyond the level we want
  let safe=1; for(let d=1;d<=16;d++) if(needLv(d)<=h.level+1) safe=d; let best=lv.downs[0]; const want=Math.min(AI.resume||G.maxD,Math.max(1,safe)); for(const s of lv.downs) if(s.to<=want&&s.to>(best?best.to:0)) best=s;
  if(!best) best=lv.downs[0];
  if(!h.order||h.order.type!=='stairs') orderStairs(best);
}
/* ---------- main ---------- */
function dungeonThink(dt){
  const lv=G.lv, h=H, d=G.dlvl;
  if(AI.lastLv!==d){ AI.lastLv=d; AI.lvEnter=G.time; AI.trip=null; AI.town=null; AI.kiteTo=null; }
  if(AI.trip==='toPortal'){ if(aiDodgeHazard()) return; }
  if(aiDodgeHazard()) return; if(aiDodgeProj()) return;
  const thr=aiThreats();
  const close=thr.filter(m=>m.alert&&m.dist<3);
  if(aiEscape(close)) return;
  if(aiHealing(close.length)) return;
  if(AI.trip==='toPortal'&&!close.length){ if(aiGoPortal()) return; }
  if(thr.length&&aiFight(thr)) return;
  if(h.cls==='sorc'&&!thr.some(m=>m.alert)&&h.mana<h.d.maxMana*.3&&potUnits(MANAK)<.5&&AI.trip!=='toPortal'&&AI.restT<35){ AI.restT=(AI.restT||0)+dt; AI.dbg='rest'; h.order=null; if(aiMaintain()) return; return; } else if(h.mana>h.d.maxMana*.5) AI.restT=0;
  if(!thr.some(m=>m.alert&&m.dist<8)){ if(aiMaintain()) return; if(aiTripCheck()) return; }
  if(AI.trip==='toPortal'){ if(aiGoPortal()) return; }
  // watchdog: nothing happening
  if(h.order){ const mv=Math.hypot(h.x-AI.sx,h.y-AI.sy); if(mv<.05) AI.stuckT+=dt; else AI.stuckT=0; } else AI.stuckT=0; AI.sx=h.x; AI.sy=h.y;
  if(AI.stuckT>1.2){ AI.stuckT=0; h.order=null; h.path=null; const w=nearestWalkable(lv,h.x+rf(-2,2),h.y+rf(-2,2),0); orderMove(w[0],w[1]); }
  aiTravel(dt);
}
function autoThink(dt){
  const h=H; AI.t+=dt; AI.dt=dt;
  if(G.deaths!==AI.lastDeaths){ if(AI.lastDeaths!==undefined&&G.deaths>AI.lastDeaths) AI.dsl=(AI.dsl||0)+(G.deaths-AI.lastDeaths); AI.lastDeaths=G.deaths; }
  if(h.level!==AI.lastLevel){ AI.lastLevel=h.level; AI.dsl=0; }
  if(AI.flash>0){ AI.flash-=dt; if(AI.flash<=0&&AI.flashP){ G.panels[AI.flashP]=false; AI.flashP=null; refreshPanels(); } }
  if(h.dead||G.scene!=='play') return;
  { const sig=G.dlvl+':'+G.kills+':'+h.level+':'+Math.round(h.gold/25)+':'+h.inv.length+':'+G.deaths; if(sig!==AI.progSig){ AI.progSig=sig; AI.progT=G.time; AI.force=0; } else { const idle=G.time-AI.progT; if(idle>50&&!AI.force){ AI.force=G.time+90; for(const m of G.lv.mons) if(!m.dead&&Math.hypot(m.x-h.x,m.y-h.y)>6) m.ignoreT=G.time+90; h.order=null; }
      if(idle>140&&G.dlvl>0&&!AI.hardKick){ AI.hardKick=1; const lv=G.lv; const t=lv.down||lv.up; const w=nearestWalkable(lv,t.x+.5,t.y+.5,1); h.x=w[0]; h.y=w[1]; h.visTile=-1; AI.progT=G.time; AI.kicks=(AI.kicks||0)+1; } if(idle<50) AI.hardKick=0; } }
  if(G.autoWait>0) return;
  if(G.dlvl===0){ if(AI.lastLv!==0){ AI.lastLv=0; AI.town=null; if(!AI.trip) AI.resume=G.maxD; AI.lastTrip=G.time; AI.nextTripGold=Math.max(700,h.gold*0+900+G.maxD*250); G.autoWait=.2; } if(h.act) return; return townThink(dt); }
  if(h.act) return;
  dungeonThink(dt);
}
/* =================== 10. MAIN / HOOKS =================== */
function newGame(cid,seed){
  hideAll(); if(seed===undefined) seed=(Date.now()%90000)+1; startSession(seed); H=newHero(cid); G.hero=H; derive(H); H.life=H.d.maxLife; H.mana=H.d.maxMana;
  G.scene='play'; camInit=false; G.autoFresh=false; autoReset(); enterLevel(0,'new'); G.mouse.down=false;
  say('ぽかぽか村に ようこそ！ まずは みんなに あいさつしてみよう','say'); if(!G.test) saveGame(); refreshPanels();
}
function continueGame(){
  hideAll(); if(!loadGame()){ showClassSelect(); return; } G.scene='play'; camInit=false; autoReset(); enterLevel(0,'new'); say('おかえりなさい、'+H.name+'！','say'); refreshPanels();
}
let lastTs=0, paused=false;
function frame(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0); lastTs=ts;
  if(!paused){
    const speed=(G.auto&&G.scene==='play')?1.5:1; let rem=dt*speed; while(rem>1e-6){ const s=Math.min(rem,1/30); update(s); rem-=s; }
    if(H&&G.scene!=='title'&&G.scene!=='class') updateHover();
    if(H&&G.panels.shop) {}
  }
  try{ renderFrame(ts/1000); }catch(err){ if(!frame.err){ frame.err=1; console.error(err); } }

function stateSummary(){
  const h=H; const eq={}; if(h) for(const s of SLOTS) if(h.eq[s]) eq[s]=dispName(h.eq[s]);
  let alive=0; if(G.lv) for(const m of G.lv.mons) if(!m.dead) alive++;
  return {scene:G.scene,dlvl:G.dlvl,maxD:G.maxD,monstersAlive:alive,bossesKilled:Object.keys(G.quests).filter(k=>G.quests[k]==='dead'),time:+G.time.toFixed(1),cleared:G.cleared,deaths:G.deaths,deathLog:G.deathLog||[],kills:G.kills,auto:G.auto,
    hero:h?{class:h.cls,level:h.level,xp:Math.round(h.xp),life:Math.round(h.life),maxLife:h.d.maxLife,mana:Math.round(h.mana),maxMana:h.d.maxMana,gold:h.gold,pts:h.pts,stats:{str:h.d.str,mag:h.d.mag,dex:h.d.dex,vit:h.d.vit},ac:h.d.ac,spells:Object.assign({},h.spells),belt:h.belt.filter(Boolean).length,inv:h.inv.length,equipped:eq,x:+h.x.toFixed(1),y:+h.y.toFixed(1)}:null};
}
window.__abyss={
  G,BAL,
  get H(){ return H; },
  getState:stateSummary,
  step(dt,n){ dt=dt||1/30; n=n||1; G.test=true; for(let i=0;i<n;i++){ update(dt); if(G.scene==='dead'&&!G.auto){ /* wait */ } } },
  setAuto, newGame(cid,seed){ G.test=true; newGame(cid||'sorc',seed||1); }, warp(d){ if(d>G.maxD) G.maxD=d; enterLevel(d,d===0?'new':'down'); },
  godMode(b){ G.god=!!b; }, pause(b){ paused=!!b; }, render(){ renderFrame(performance.now()/1000); },
  setBal(o){ Object.assign(BAL,o); }, setLevel(n){ while(H.level<n){ H.xp=XP_NEXT(H.level); gainXP(0); } derive(H); H.life=H.d.maxLife; H.mana=H.d.maxMana; },
  giveGold(n){ H.gold+=n; }, giveItem(it){ addItem(H,it); refreshPanels(); },
  mk:{potion:mkPotion,scroll:mkScroll,book:mkBook,gear:genGear,base:baseItem},
  openPanel(n,v){ togglePanel(n,v!==false); }, openNpcById(id){ const n=G.lv.npcs.find(x=>x.id===id); if(n) openNpc(n); }, openShop, closeAllPanels,
  teleportHero(x,y){ H.x=x; H.y=y; H.visTile=-1; }, castAt(id,x,y){ return castSpell(id,x,y); },
  spawn(key,x,y,o){ const m=mkMon(key,x,y,o); G.lv.mons.push(m); return m; },
  killAll(){ for(const m of G.lv.mons) if(!m.dead) killMon(m,{hero:false}); },
  dump(){ const lv=G.lv; return {mons:lv.mons.filter(m=>!m.dead).map(m=>({k:m.key,x:+m.x.toFixed(1),y:+m.y.toFixed(1),hp:m.hp,al:m.alert,boss:m.boss})),down:lv.down,up:lv.up}; },
  fresh(d){ const lv=genLevel(d,G.seed,G.maxD); G.levels[d]=lv; if(d>G.maxD) G.maxD=d; enterLevel(d,'down'); },
  int:{w2sx,w2sy,nearestWalkable,aiPickGoal,aiThreats,aiHealing,aiMaintain,aiTripCheck,planPath,astar,orderMove,monGo,monAI,canStand,moveMon,computeFlow,bfsField,walkable,stand},
  autoDebug:()=>typeof AI!=='undefined'?AI:null,
  derive:()=>derive(H), showEnding, showTitle, toTitle, camera(x,y){ CX=x; CY=y; camInit=true; }
};
document.querySelectorAll('#hdr button').forEach(b=>b.addEventListener('click',()=>b.blur()));

})();

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
