<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="妖怪道中記ふうの横スクロールアクション。旅の小僧が、化物だらけの街道を、数珠玉でたおしながら地獄の門まで旅をする。">
<title>化物旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#160F24;--ink:#F3E9D2;--card:#2A1E40;--line:#4C3A72;--mute:#B2A2D2;--gold:#FFC74D;--red:#FF5A4D;--green:#7ED58B;--blue:#7DB8FF}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2A1B00}
#hud{display:grid;grid-template-columns:1.5fr 1.2fr 1fr 1fr;gap:5px;margin-bottom:6px;text-align:center}
#hud div{background:var(--card);border-radius:10px;padding:3px 2px;font-size:10.5px;color:var(--mute);font-weight:800}
#hud b{display:block;font-family:"Dela Gothic One",sans-serif;font-size:15px;color:var(--ink);font-weight:400;line-height:1.35;white-space:nowrap}
#hud #hp b{color:var(--red);letter-spacing:1px}
#wrap{position:relative}
#wrap.tall{min-height:500px}
#cv{display:block;width:100%;aspect-ratio:520/300;border-radius:16px;background:#2a1a4a;touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,20,.74);border-radius:16px;padding:10px;z-index:3}
.card{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:100%;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.card h2{margin:0;text-align:center;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:26px;line-height:1.35;font-weight:400}
.card h2 span{color:var(--gold)}
.story{font-size:13px;line-height:1.85;margin:8px 0}
.sub{text-align:center;font-size:12px;color:var(--mute);margin:6px 0;line-height:1.7}
.go{display:block;width:100%;min-height:46px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;background:var(--gold);color:#2A1B00;box-shadow:0 4px 0 #A97A12}
.go.alt{background:#4C3A72;color:var(--ink);box-shadow:0 4px 0 #35274F}
.go:disabled{opacity:.4;cursor:default}
.item{display:flex;align-items:center;gap:8px;width:100%;border:2px solid var(--line);border-radius:12px;background:#38294F;padding:7px 10px;margin-top:6px;cursor:pointer;text-align:left}
.item:disabled{opacity:.4;cursor:default}
.item b{display:block;font-size:14px}.item small{display:block;font-size:11px;color:var(--mute)}
.item .pr{margin-left:auto;color:var(--gold);font-weight:800;white-space:nowrap}
.back{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.big{font-family:"Dela Gothic One",sans-serif;font-size:22px;text-align:center;line-height:1.4;margin:6px 0;color:var(--gold)}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin:8px 0}
.rows b{text-align:right}
.note{font-size:11.5px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
#ctl{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
#ctl .grp{display:flex;gap:8px}
#ctl button{width:78px;height:92px;border:0;border-radius:20px;font-weight:800;font-size:15px;cursor:pointer;background:#4C3A72;color:var(--ink);box-shadow:0 5px 0 #35274F;touch-action:none;line-height:1.4}
#ctl button.dn,#ctl button:active{transform:translateY(3px);box-shadow:0 2px 0 #35274F}
#ctl #fireBtn{background:var(--gold);color:#2A1B00;box-shadow:0 5px 0 #A97A12}
#ctl #jumpBtn{background:#7DB8FF;color:#08203F;box-shadow:0 5px 0 #3C6FB5}
#ctl #fireBtn.dn,#ctl #fireBtn:active{box-shadow:0 2px 0 #A97A12}
#ctl #jumpBtn.dn,#ctl #jumpBtn:active{box-shadow:0 2px 0 #3C6FB5}
.help{font-size:11.5px;color:var(--mute);text-align:center;margin:10px 0 0;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>化物旅行</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="hud">
    <div>めん<b id="hs">一</b></div>
    <div id="hp">たましい<b id="hh">♥♥♥♥♥</b></div>
    <div>銭<b id="hm">0</b></div>
    <div>スコア<b id="hsc">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="cv" width="520" height="300" aria-label="化物旅行のゲーム画面"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div id="ctl">
    <div class="grp"><button id="lBtn" type="button">◀</button><button id="rBtn" type="button">▶</button></div>
    <div class="grp"><button id="jumpBtn" type="button">ジャンプ</button><button id="fireBtn" type="button">数珠玉</button></div>
  </div>
  <p class="help"><span class="pc">← → か A D でうごく ／ スペース か ↑ でジャンプ ／ X か J で数珠玉 ／ O でオート<br></span>化物をたおして銭をあつめ、面のおわりの茶屋で力をつけよう。</p>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const W=520,H=300,GY=250,HSPD=115,JV=410,GR=1150,ARENA_LEN=0;
const cv=$('cv'),cx=cv.getContext('2d');
const ls={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};

/* ---------- データ ---------- */
const STAGES=[
 {name:'ふもとの かいどう',num:'一',L:1800,gap:[110,190],w:{kara:6,hito:4},sky:['#2A1A4A','#E0709A'],far:'#43306B',mid:'#2A1D48',kind:0},
 {name:'たけやぶの みち',num:'二',L:2100,gap:[95,170],w:{kara:4,hito:4,roku:3},sky:['#10243A','#3E9E8E'],far:'#1F4E55',mid:'#143A3C',kind:1},
 {name:'きりの ぬまち',num:'三',L:2300,gap:[85,155],w:{kara:3,hito:4,roku:3,neko:3},sky:['#1A2440','#8DA6C8'],far:'#3A4E78',mid:'#27385E',kind:2},
 {name:'ゆうれいの はか',num:'四',L:2500,gap:[75,140],w:{kara:3,hito:4,roku:3,neko:4},sky:['#120C24','#5A3A7A'],far:'#2A1D4A',mid:'#1B1233',kind:3},
 {name:'じごくの もん',num:'五',L:2700,gap:[65,125],w:{kara:3,hito:4,roku:4,neko:4},sky:['#3A0A12','#FF7A3A'],far:'#6A1A22',mid:'#4A0F18',kind:4}
];
const BOSSES=[
 {name:'おおからかさ',w:64,h:78,hp:16,move:'hop',atk:['aim','aim','fan3'],iv:2.0,col:'#B53B6E'},
 {name:'ろくろ首の大将',w:54,h:96,hp:20,move:'still',atk:['neck','aim','neck','fan3'],iv:2.1,col:'#E8A0B8'},
 {name:'おおなまず',w:104,h:56,hp:24,move:'hop',atk:['fan3','rain','fan3'],iv:1.9,col:'#4A5A6E'},
 {name:'がしゃどくろ',w:76,h:130,hp:28,move:'walk',atk:['rain','aim','rain','fan3'],iv:1.8,col:'#E8E2CE'},
 {name:'えんま大王',w:92,h:104,hp:38,move:'hover',atk:['fan5','rain','neck','aim'],iv:1.6,col:'#D9382E'}
];
const SHOP=[
 {id:'dango',n:'だんご',d:'たましい +2',p:30},
 {id:'juzu',n:'数珠（じゅず）',d:'数珠玉が つよくなる（さいだい3）',p:60},
 {id:'ofuda',n:'おふだ',d:'1かい まもってくれる（さいだい2）',p:40},
 {id:'soul',n:'ふくだま',d:'たましいの うつわ +1（さいだい8）',p:80}
];
const END_RANK=s=>s>=45000?'S':s>=30000?'A':s>=15000?'B':'C';

/* ---------- 音 ---------- */
let ctx=null,master=null,nbuf=null,muted=ls.get('kaibutsu_mute')==='1',silent=false,bgmT=0,bgmN=0;
function ensureAudio(){
  if(!ctx){
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=muted?0:0.75; master.connect(ctx.destination);
      nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ctx=null}
  }
  if(ctx&&ctx.state==='suspended') ctx.resume();
}
function tone(f,d,type,vol,when,f2){
  if(!ctx||silent) return; const w=ctx.currentTime+(when||0),o=ctx.createOscillator(),g=ctx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,w); if(f2) o.frequency.exponentialRampToValueAtTime(f2,w+d);
  g.gain.setValueAtTime(0.0001,w); g.gain.linearRampToValueAtTime(vol||0.1,w+0.005); g.gain.exponentialRampToValueAtTime(0.0001,w+d); o.connect(g); g.connect(master); o.start(w); o.stop(w+d+0.05);
}
function nz(d,freq,vol,when,type){
  if(!ctx||silent) return; const w=ctx.currentTime+(when||0),s=ctx.createBufferSource(); s.buffer=nbuf; const f=ctx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq; const g=ctx.createGain();
  g.gain.setValueAtTime(vol,w); g.gain.exponentialRampToValueAtTime(0.0001,w+d); s.connect(f); f.connect(g); g.connect(master); s.start(w,Math.random()*0.5); s.stop(w+d+0.05);
}
const NOTE=m=>440*Math.pow(2,(m-69)/12);
function sfx(k){
  switch(k){
    case 'shot': tone(880,0.07,'square',0.035,0,1400); break;
    case 'jump': tone(280,0.14,'triangle',0.09,0,560); break;
    case 'kill': nz(0.18,1800,0.22); tone(330,0.15,'square',0.06,0,110); break;
    case 'coin': tone(NOTE(88),0.06,'square',0.04); tone(NOTE(95),0.12,'square',0.04,0.05); break;
    case 'hurt': nz(0.3,900,0.3); tone(200,0.3,'sawtooth',0.12,0,60); break;
    case 'shield': tone(NOTE(84),0.2,'triangle',0.12); break;
    case 'bhit': tone(170,0.05,'square',0.05); break;
    case 'bdie': nz(1.0,1200,0.4); tone(120,1.0,'sawtooth',0.15,0,30); break;
    case 'boss': tone(70,0.8,'sawtooth',0.16,0,45); nz(0.6,500,0.25); break;
    case 'clear': [72,76,79,84].forEach((m,i)=>tone(NOTE(m),0.35,'triangle',0.12,i*0.13)); break;
    case 'buy': tone(NOTE(79),0.1,'triangle',0.12); tone(NOTE(86),0.18,'triangle',0.12,0.08); break;
    case 'over': [57,53,50,45].forEach((m,i)=>tone(NOTE(m),0.5,'sawtooth',0.1,i*0.25)); break;
  }
}
// 都節（みやこぶし）音階：E F A B C
const SC=[0,1,5,7,8];
const MEL=[0,2,1,0,3,2,1,-1, 0,1,2,4,3,2,1,0];
function bgm(){
  if(!ctx||silent||G.mode==='title'||G.mode==='over') return;
  const now=ctx.currentTime; if(bgmT<now) bgmT=now+0.05;
  const boss=G.arena,beat=(boss?0.2:0.26)-G.stage*0.01;
  while(bgmT<now+0.25){
    const n=bgmN++,deg=MEL[n%16],o=(deg<0?-5:Math.floor(deg/5)*12),m=52+G.stage*0+SC[((deg%5)+5)%5]+(deg<0?-12+12:0)+o+(boss?-2:0);
    if(n%2===0||boss) tone(NOTE(m+12),beat*1.6,'triangle',boss?0.07:0.055,bgmT-now);
    if(n%8===0) tone(NOTE(m-24),beat*7,'sine',0.09,bgmT-now);
    if(n%4===0) { tone(95,0.18,'sine',0.14,bgmT-now,45); }
    if(n%4===2&&boss) nz(0.05,5000,0.06,bgmT-now,'highpass');
    bgmT+=beat;
  }
}

/* ---------- 状態 ---------- */
let G=null;
const FX=[],BANNER={t:0,txt:''};
const hearts=(h,m)=>'♥'.repeat(Math.max(0,h))+'♡'.repeat(Math.max(0,m-h));
function newGame(stage){
  G={t:0,mode:'play',stage:0,seed:12345+(Math.random()*1e6|0),camX:0,lock:false,arena:false,arenaX:0,
    hero:{x:60,y:GY,vy:0,air:false,inv:0,fire:0,hp:5,max:5,anim:0,moving:false},
    wlv:1,shield:0,money:0,score:0,en:[],sh:[],eb:[],coins:[],spawns:[],si:0,boss:null,clearT:0,ev:[],sim:false,kills:0,over:0};
  if(stage) { G.wlv=Math.min(3,1+(stage>>1)); G.hero.max=5+(stage>>1); G.hero.hp=G.hero.max; G.money=0; }
  beginStage(stage);
}
function rnd(g){ g.seed=(g.seed+0x6D2B79F5)|0; let t=g.seed; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }
function beginStage(i){
  const s=STAGES[i]; G.stage=i; G.camX=0; G.lock=false; G.arena=false; G.arenaX=s.L; G.en=[];G.sh=[];G.eb=[];G.coins=[];G.boss=null;G.clearT=0;G.mode='play';
  G.hero.x=60; G.hero.y=GY; G.hero.vy=0; G.hero.air=false; G.hero.inv=1;
  const tot=Object.values(s.w).reduce((a,b)=>a+b,0); G.spawns=[]; G.si=0;
  for(let x=380;x<s.L-120;){
    let r=rnd(G)*tot,t='kara'; for(const k in s.w){ if(r<s.w[k]){t=k;break;} r-=s.w[k]; }
    G.spawns.push({x,t}); x+=s.gap[0]+rnd(G)*(s.gap[1]-s.gap[0]);
  }
  BANNER.t=2.2; BANNER.txt='第'+s.num+'面　'+s.name; bgmT=0;
}
const ev=(g,k,x,y)=>{ if(!g.sim) g.ev.push({k,x,y}); };
const R=e=>[e.x-e.w/2,e.y-e.h,e.w,e.h];
const ov=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
const hbox=h=>[h.x-8,h.y-30,16,30];
function hurt(g,n){
  const h=g.hero; if(h.inv>0||g.mode!=='play') return;
  if(g.shield>0){ g.shield--; h.inv=1.2; ev(g,'shield',h.x,h.y-20); return; }
  h.hp-=n; h.inv=1.5; h.vy=-230; h.air=true; ev(g,'hurt',h.x,h.y-20);
  if(h.hp<=0){ h.hp=0; g.mode='over'; g.over=0; ev(g,'over'); }
}
function dropCoins(g,x,y,n){ for(let i=0;i<n;i++) g.coins.push({x:x+(i-n/2)*8,y:y-10,vy:-160-rnd(g)*80,vx:(i-n/2)*18,v:5}); }
function addEnemy(g,sp){
  const x=sp.x,t=sp.t;
  if(t==='kara') g.en.push({t,x,y:GY,w:26,h:38,hp:1,vx:-55,vy:0,tm:rnd(g)*1.2,val:100});
  else if(t==='hito'){ const by=GY-50-rnd(g)*70; g.en.push({t,x,y:by,w:22,h:26,hp:1,vx:-70,vy:0,base:by,tm:rnd(g)*6,val:120}); }
  else if(t==='roku') g.en.push({t,x,y:GY,w:26,h:58,hp:2,vx:0,vy:0,tm:1+rnd(g),val:200});
  else g.en.push({t:'neko',x,y:GY,w:34,h:24,hp:2,vx:-90,vy:0,tm:rnd(g),val:220});
}
function spawnBoss(g){
  const b=BOSSES[g.stage]; g.boss={k:g.stage,x:g.camX+W+60,y:GY,w:b.w,h:b.h,hp:b.hp,max:b.hp,vx:0,vy:0,tm:1.6,ai:0,flash:0,neck:0,neckT:0,hov:0,in:true};
  BANNER.t=2.4; BANNER.txt='ボス　'+b.name; ev(g,'boss');
}
function shoot(g){
  const h=g.hero,y=h.y-20,add=(dy,vy)=>g.sh.push({x:h.x+10,y:y+dy,vx:330,vy,life:1.1});
  if(g.wlv===1) add(0,0); else if(g.wlv===2){ add(-6,0); add(6,0); } else { add(0,0); add(-4,-70); add(4,70); }
  h.fire=g.wlv===3?0.2:0.22; ev(g,'shot');
}
function bossAtk(g,b,k){
  const h=g.hero,cxp=b.x-b.w/2,cyp=b.y-b.h*0.55;
  const aim=(spd,da)=>{ const dx=h.x-cxp,dy=(h.y-18)-cyp,a=Math.atan2(dy,dx)+(da||0); g.eb.push({x:cxp,y:cyp,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:6}); };
  if(k==='aim') aim(150);
  else if(k==='fan3'){ aim(135,-0.35); aim(135,0); aim(135,0.35); }
  else if(k==='fan5'){ for(let i=-2;i<=2;i++) aim(130,i*0.3); }
  else if(k==='rain'){ for(let i=0;i<5;i++) g.eb.push({x:g.camX+60+rnd(g)*(W-90),y:-10-i*22,vx:0,vy:150,r:7,bone:true}); }
  else if(k==='neck'){ b.neck=1; b.neckT=0; }
}
function tick(g,dt,inp){
  g.t+=dt; const h=g.hero,st=STAGES[g.stage];
  if(h.inv>0) h.inv-=dt;
  if(g.mode==='over'){ g.over+=dt; return; }
  // しゅじんこう
  const dir=(inp.r?1:0)-(inp.l?1:0); h.x+=dir*HSPD*dt; h.moving=dir!==0; if(h.moving||h.air) h.anim+=dt;
  if(inp.j&&!h.air){ h.vy=-JV; h.air=true; ev(g,'jump'); }
  h.vy+=GR*dt; h.y+=h.vy*dt; if(h.y>=GY){ h.y=GY; h.vy=0; h.air=false; }
  if(!g.lock&&h.x>g.camX+230){ g.camX=Math.min(h.x-230,g.arenaX-20); }
  if(!g.lock&&g.camX>=g.arenaX-20){ g.lock=true; if(g.mode==='play'){ g.arena=true; spawnBoss(g); } }
  h.x=Math.max(g.camX+12,Math.min(g.camX+W-16,h.x));
  h.fire-=dt; if(inp.f&&h.fire<=0&&g.mode==='play') shoot(g);
  // 玉
  for(const s of g.sh){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; }
  // てき
  if(g.mode==='play'){
    while(!g.arena&&g.si<g.spawns.length&&g.spawns[g.si].x<g.camX+W+30){ addEnemy(g,g.spawns[g.si]); g.si++; }
    for(const e of g.en){
      e.tm-=dt;
      if(e.t==='kara'){ e.x+=e.vx*dt; e.vy+=GR*0.8*dt; e.y+=e.vy*dt; if(e.y>=GY){ e.y=GY; e.vy=0; if(e.tm<=0){ e.vy=-300; e.tm=0.9; } } }
      else if(e.t==='hito'){ e.x+=e.vx*dt; e.y=e.base+Math.sin(g.t*3+e.base)*24; }
      else if(e.t==='roku'){ if(e.tm<=0&&e.x<g.camX+W-10){ e.tm=2.3; g.eb.push({x:e.x-10,y:GY-46,vx:-165,vy:0,r:9,head:true,ox:e.x-10}); } }
      else { e.x+=e.vx*dt; e.vy+=GR*0.8*dt; e.y+=e.vy*dt; if(e.y>=GY){ e.y=GY; e.vy=0; if(e.tm<=0){ e.vy=-330; e.tm=1.3; e.vx=-150; } else e.vx=-100; } }
      if(ov(R(e),hbox(h))) hurt(g,1);
    }
    // ボス
    const b=g.boss;
    if(b){
      b.flash=Math.max(0,b.flash-dt);
      const bm=BOSSES[b.k],minX=g.camX+250,maxX=g.camX+W-24+b.w/2-30;
      if(b.in){ b.x-=140*dt; if(b.x<=g.camX+W-50) b.in=false; }
      else{
        b.tm-=dt;
        if(bm.move==='hop'){ b.vy+=GR*0.9*dt; b.y+=b.vy*dt; b.x+=b.vx*dt; if(b.y>=GY){ b.y=GY; b.vy=0; b.vx=0; if(b.hopT===undefined||b.hopT<=0){ b.vy=-420; b.vx=(h.x<b.x-170?-95:60); b.hopT=1.3; } else b.hopT-=dt; } b.x=Math.max(minX,Math.min(maxX,b.x)); }
        else if(bm.move==='walk'){ b.x+=(h.x<b.x-150?-24:0)*dt; b.x=Math.max(minX,b.x); }
        else if(bm.move==='hover'){ b.hov+=dt; b.y=GY-22-40*(0.5+0.5*Math.sin(b.hov*1.3)); b.x=g.camX+W-60+Math.sin(b.hov*0.7)*26; }
        else b.x=g.camX+W-40;
        if(b.tm<=0){ const k=bm.atk[b.ai%bm.atk.length]; b.ai++; b.tm=bm.iv; bossAtk(g,b,k); }
        if(b.neck){ b.neckT+=dt; if(b.neckT>1.1){ b.neck=0; } }
      }
      if(ov(R(b),hbox(h))) hurt(g,1);
      if(b.neck&&b.neckT>0.6){ const nr=[b.x-b.w/2-330,GY-30,330,14]; if(ov(nr,hbox(h))) hurt(g,1); }
    }

    g.eb=g.eb.filter(e=>!e.dead&&e.x>g.camX-40&&e.x<g.camX+W+60&&e.y<H+20);
    // 玉あたり
    for(const s of g.sh){
      if(s.dead) continue; const sb=[s.x-5,s.y-5,10,10];
      for(const e of g.en){ if(e.hp>0&&ov(sb,R(e))){ e.hp--; s.dead=true; if(e.hp<=0){ g.score+=e.val; g.kills++; dropCoins(g,e.x,e.y-e.h/2,e.t==='kara'||e.t==='hito'?1:2); ev(g,'kill',e.x,e.y-e.h/2); } else ev(g,'bhit',e.x,e.y-e.h/2); break; } }
      if(!s.dead&&b&&!b.in&&ov(sb,R(b))){ s.dead=true; b.hp--; b.flash=0.08; g.score+=15; ev(g,'bhit',s.x,s.y);
        if(b.hp<=0){ g.score+=3000+b.max*50; dropCoins(g,b.x,b.y-b.h/2,14); ev(g,'bdie',b.x,b.y-b.h/2); g.boss=null; g.eb=[]; g.en=[]; g.mode='clear'; g.clearT=2.4; g.bossDead={x:b.x,y:b.y,w:b.w,h:b.h,k:b.k}; } }
    }

  }else if(g.mode==='clear'){
    g.clearT-=dt; if(g.clearT<=0){ g.mode=g.stage>=STAGES.length-1?'end':'shop'; ev(g,'clear'); }
  }

    if(Math.abs(c.x-h.x)<18&&Math.abs(c.y-(h.y-14))<24){ c.got=true; g.money+=c.v; g.score+=c.v; ev(g,'coin',c.x,c.y); } }
  g.coins=g.coins.filter(c=>!c.got&&c.x>g.camX-30);
}

/* ---------- オート（先読みシミュレーションで、完璧によけて、全部あてる） ---------- */
const bot={age:99,inp:{l:false,r:true,j:false,f:true}};
function simScore(g0,d1,d2,jt){
  const g=structuredClone(g0); g.sim=true; g.ev=[];
  const hp0=g.hero.hp+g.shield*1.0,sc0=g.score,x0=g.hero.x,m0=g.money,b0=g.boss?g.boss.hp:0;
  let jumped=0;
  for(let i=0;i<21;i++){
    const t=i/30,inp={l:false,r:false,j:false,f:true},d=t<0.3?d1:d2;
    if(d>0) inp.r=true; else if(d<0) inp.l=true;
    if(jt>=0&&!jumped&&t>=jt){ inp.j=true; jumped=1; }
    tick(g,1/30,inp);
    if(g.mode==='over') return -1e6;
  }
  let s=-1000*((hp0)-(g.hero.hp+g.shield))+ (g.score-sc0)*0.02 + (g.money-m0)*0.5-(jumped?1.5:0);
  if(g.boss&&!g.boss.in) s-=Math.abs(g.hero.x-(g.boss.x-190))*0.1; else s+=(g.hero.x-x0)*0.15;
  if(b0&&g.boss) s+=(b0-g.boss.hp)*4;
  if(g.mode==='clear') s+=500;
  return s;
}
function botInput(dt){
  bot.age+=dt;
  if(bot.age>=0.1){
    bot.age=0; let best=-1e9,bp=null;
    for(const d1 of [1,0,-1]) for(const d2 of [1,0,-1]) for(const jt of [-1,0,0.1,0.2,0.3,0.45]){
      const s=simScore(G,d1,d2,jt)+(d1===1?0.3:0); if(s>best){ best=s; bp={d1,jt}; }
    }
    bot.inp={l:bp.d1<0,r:bp.d1>0,j:bp.jt===0,f:true};
  }else bot.inp={l:bot.inp.l,r:bot.inp.r,j:false,f:true};
  return bot.inp;
}

/* ---------- 画面 ---------- */
let auto=false,keys={l:false,r:false,f:false},jumpReq=false,autoT=0;

function buy(id){
  const s=SHOP.find(x=>x.id===id),h=G.hero; if(!s||G.money<s.p) return false;

  else if(id==='ofuda'){ if(G.shield>=2) return false; G.shield++; }
  else if(id==='soul'){ if(h.max>=8) return false; h.max++; h.hp=Math.min(h.max,h.hp+1); }

}

}

let lastMode='';
function update(dt){
  if(G.mode==='play'||G.mode==='clear'||G.mode==='over'){
    const inp=auto?botInput(dt):{l:keys.l,r:keys.r,f:keys.f,j:jumpReq}; jumpReq=false;
    tick(G,dt,inp);
    for(const e of G.ev){ sfx(e.k); fxFor(e); } G.ev.length=0;
  }
  if(G.mode!==lastMode){ lastMode=G.mode; autoT=0;
    if(G.mode==='shop') showShop(); else if(G.mode==='over') showOver(); else if(G.mode==='end') showEnd(); }
  autoT+=dt;
  if(auto){
    if(G.mode==='shop'&&autoT>0.25){ autoT=0; const h=G.hero; let done=false;
      for(const id of ['juzu','dango','ofuda','soul']){ if(id==='dango'&&h.hp>h.max-2) continue; if(buy(id)){ done=true; break; } }
      if(done) showShop(); else { G.stage++; beginStage(G.stage); $('ov').hidden=true; $('wrap').classList.remove('tall'); lastMode='play'; } }
    else if(G.mode==='over'&&autoT>1.6){ beginStage(G.stage); G.hero.hp=G.hero.max; G.score=Math.max(0,G.score-500); $('ov').hidden=true; $('wrap').classList.remove('tall'); lastMode='play'; }
    else if(G.mode==='end'&&autoT>3){ startRun(0); lastMode='play'; }
  }
  if(BANNER.t>0) BANNER.t-=dt;
  for(const f of FX){ f.life-=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=300*dt; } for(let i=FX.length-1;i>=0;i--) if(FX[i].life<=0) FX.splice(i,1);

}
function fxFor(e){

  for(let i=0;i<n;i++){ const a=Math.random()*6.28,v=40+Math.random()*(e.k==='bdie'?240:130); FX.push({x:e.x||0,y:e.y||0,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,life:0.4+Math.random()*0.4,col:e.k==='coin'?'#FFC74D':e.k==='hurt'?'#FF5A4D':['#FFF','#FFD27A','#C98BFF'][i%3]}); }
}

    if(b.neck){ const k=b.neckT; c.fillStyle=k<0.6?'rgba(255,80,80,.35)':'#F5CFA6'; c.fillRect(-w/2-330,-30,330,14); if(k>=0.6){ c.beginPath(); c.arc(-w/2-330,-23,12,0,7); c.fill(); } } }
  else if(b.k===2){ c.fillStyle=bm.col; c.beginPath(); c.ellipse(0,-h/2,w/2,h/2,0,0,7); c.fill(); c.fillStyle='#6A7A8E'; c.beginPath(); c.ellipse(0,-h*0.25,w*0.42,h*0.22,0,0,7); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(-w*0.28,-h*0.65,8,0,7); c.fill(); c.fillStyle='#111'; c.beginPath(); c.arc(-w*0.3,-h*0.65,4,0,7); c.fill();
    c.strokeStyle='#222'; c.lineWidth=3; c.beginPath(); c.moveTo(-w*0.45,-h*0.35); c.quadraticCurveTo(-w*0.75,-h*0.2+Math.sin(t*5)*8,-w*0.7,-h*0.05); c.moveTo(-w*0.45,-h*0.3); c.quadraticCurveTo(-w*0.7,-h*0.45,-w*0.78,-h*0.55+Math.sin(t*5)*8); c.stroke(); c.fillStyle='#FF6B8A'; c.fillRect(-w*0.45,-h*0.38,18,6); }
  else if(b.k===3){ c.fillStyle=bm.col; c.fillRect(-w*0.3,-h*0.7,w*0.6,h*0.45); c.fillStyle='#2A2420'; for(let i=0;i<3;i++) c.fillRect(-w*0.25,-h*0.62+i*10,w*0.5,3); c.beginPath(); c.arc(0,-h*0.86,22,0,7); c.fillStyle=bm.col; c.fill(); c.fillStyle='#111'; c.beginPath(); c.arc(-8,-h*0.88,6,0,7); c.arc(8,-h*0.88,6,0,7); c.fill(); c.fillRect(-9,-h*0.76,18,4);
    c.fillStyle=bm.col; c.fillRect(-w*0.28,-h*0.25,10,h*0.25); c.fillRect(w*0.18,-h*0.25,10,h*0.25); c.fillRect(-w*0.5,-h*0.66,w*0.22,8); c.fillRect(w*0.28,-h*0.66,w*0.22,8); c.fillStyle='#FF6B3A'; c.fillRect(-4,-h*0.9,2,4); }
  else { c.fillStyle='#8A1A14'; c.fillRect(-w*0.42,-h*0.55,w*0.84,h*0.55); c.fillStyle=bm.col; c.beginPath(); c.arc(0,-h*0.72,32,0,7); c.fill(); c.fillStyle='#222'; c.fillRect(-26,-h*0.98,52,12); c.fillRect(-34,-h*0.86,68,5); c.fillStyle='#FFD25A'; c.fillRect(-4,-h*1.02,8,6);
    c.fillStyle='#fff'; c.beginPath(); c.arc(-12,-h*0.74,7,0,7); c.arc(12,-h*0.74,7,0,7); c.fill(); c.fillStyle='#111'; c.beginPath(); c.arc(-11,-h*0.73,3,0,7); c.arc(13,-h*0.73,3,0,7); c.fill(); c.fillRect(-16,-h*0.84,12,3); c.fillRect(4,-h*0.84,12,3);

    if(b.neck){ const k=b.neckT; c.fillStyle=k<0.6?'rgba(255,80,80,.35)':'#FF6A3A'; c.fillRect(-w/2-330,GY-30-b.y,330,14); } }

}
function draw(){
  const c=cx,st=STAGES[G.stage]||STAGES[0],t=G.t||0,camX=G.camX||0;
  bg(c,st,camX,t);
  for(const e of G.en||[]) drawEnemy(c,e,t);
  const b=G.boss; if(b) drawBoss(c,b,t);
  if(G.bossDead&&G.mode==='clear'){ const d=G.bossDead; c.globalAlpha=Math.max(0,G.clearT/2.4); c.fillStyle='#fff'; c.beginPath(); c.ellipse(d.x-camX,d.y-d.h/2,d.w*0.6*(2.4-G.clearT)/2.4+10,d.h*0.5,0,0,7); c.fill(); c.globalAlpha=1; }
  for(const e of G.eb||[]){ const x=e.x-camX;
    if(e.head){ c.strokeStyle='#F5CFA6'; c.lineWidth=7; c.beginPath(); c.moveTo(e.ox-camX,GY-46); c.lineTo(x,e.y); c.stroke(); c.fillStyle='#F5CFA6'; c.beginPath(); c.arc(x,e.y,10,0,7); c.fill(); c.fillStyle='#222'; c.fillRect(x-6,e.y-3,3,3); c.fillRect(x+1,e.y-3,3,3); c.fillStyle='#C23'; c.fillRect(x-3,e.y+3,7,2); }
    else if(e.bone){ c.fillStyle='#EEE6CE'; c.save(); c.translate(x,e.y); c.rotate(t*8); c.fillRect(-9,-2.5,18,5); c.beginPath(); c.arc(-9,0,4,0,7); c.arc(9,0,4,0,7); c.fill(); c.restore(); }
    else { c.fillStyle='rgba(255,100,40,.3)'; c.beginPath(); c.arc(x,e.y,e.r+4,0,7); c.fill(); c.fillStyle='#FF7A3A'; c.beginPath(); c.arc(x,e.y,e.r,0,7); c.fill(); c.fillStyle='#FFE09A'; c.beginPath(); c.arc(x,e.y,e.r*0.5,0,7); c.fill(); } }
  for(const co of G.coins||[]){ c.fillStyle='#FFC74D'; c.beginPath(); c.arc(co.x-camX,co.y,5,0,7); c.fill(); c.fillStyle='#8A5A00'; c.fillRect(co.x-camX-1.5,co.y-1.5,3,3); }
  for(const s of G.sh||[]){ c.fillStyle='#F6EFD8'; c.beginPath(); c.arc(s.x-camX,s.y,4.5,0,7); c.fill(); c.strokeStyle='#8A5A2A'; c.lineWidth=1.5; c.stroke(); }
  if(G.hero&&G.mode!=='title'&&G.mode!=='over') drawHero(c,G.hero,t); else if(G.hero&&G.mode==='over'){ c.save(); c.globalAlpha=0.6; drawHero(c,G.hero,0); c.restore(); }
  if(G.shield>0&&G.hero){ c.strokeStyle='rgba(160,230,255,.8)'; c.lineWidth=2; c.beginPath(); c.arc(G.hero.x-camX,G.hero.y-24,24,0,7); c.stroke(); }
  for(const f of FX){ c.globalAlpha=Math.max(0,f.life*2); c.fillStyle=f.col; c.fillRect(f.x-camX-1.5,f.y-1.5,3,3); } c.globalAlpha=1;
  // ボスのたいりょく
  if(b&&!b.in){ const bw=200,bx=(W-bw)/2; c.fillStyle='rgba(0,0,0,.55)'; c.fillRect(bx-2,10,bw+4,12); c.fillStyle='#E04A3A'; c.fillRect(bx,12,bw*b.hp/b.max,8); c.font='800 11px "M PLUS Rounded 1c",sans-serif'; c.textAlign='center'; c.fillStyle='#fff'; c.fillText(BOSSES[b.k].name,W/2,36); }
  if(BANNER.t>0&&G.mode!=='title'){ c.globalAlpha=Math.min(1,BANNER.t*2); c.textAlign='center'; c.font='26px "Dela Gothic One",sans-serif'; c.lineWidth=6; c.strokeStyle='rgba(20,8,30,.85)'; c.fillStyle='#FFE9A8'; c.strokeText(BANNER.txt,W/2,110); c.fillText(BANNER.txt,W/2,110); c.globalAlpha=1; }
  if(auto&&G.mode!=='title'){ c.font='800 12px "M PLUS Rounded 1c",sans-serif'; c.textAlign='right'; c.fillStyle='rgba(255,255,255,.85)'; c.fillText('🤖 オート',W-10,H-8); }
}
let hs='';
function hud(){
  const h=G.hero,k=[G.stage,h&&h.hp,h&&h.max,G.shield,G.money,G.score,G.wlv].join('|'); if(k===hs) return; hs=k;
  $('hs').textContent=STAGES[G.stage].num; $('hh').textContent=hearts(h.hp,h.max)+(G.shield?'🛡'.repeat(G.shield):''); $('hm').textContent=G.money; $('hsc').textContent=G.score;
}
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); draw(); hud(); }

/* ---------- 入力 ---------- */
function userAct(){ if(auto) setAuto(false); }
function hold(btn,on,off){
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio(); userAct(); btn.classList.add('dn'); try{btn.setPointerCapture(e.pointerId)}catch(_){} on(); });
  for(const ev of ['pointerup','pointercancel','lostpointercapture']) btn.addEventListener(ev,()=>{ btn.classList.remove('dn'); off(); });
}
hold($('lBtn'),()=>{keys.l=true},()=>{keys.l=false}); hold($('rBtn'),()=>{keys.r=true},()=>{keys.r=false});
hold($('fireBtn'),()=>{keys.f=true},()=>{keys.f=false}); hold($('jumpBtn'),()=>{jumpReq=true},()=>{});
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',x:'f',j:'f'};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='o'){ if(!e.repeat){ ensureAudio(); setAuto(!auto); } return; }
  if(G.mode!=='play'&&G.mode!=='clear') return;
  if(KM[k]){ e.preventDefault(); userAct(); ensureAudio(); keys[KM[k]]=true; }
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='z'){ e.preventDefault(); if(!e.repeat){ userAct(); ensureAudio(); jumpReq=true; } }
});
addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; if(KM[k]) keys[KM[k]]=false; });
addEventListener('blur',()=>{ keys.l=keys.r=keys.f=false; });
$('ov').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'),b=e.target.closest('[data-buy]');
  if(b){ userAct(); if(buy(b.dataset.buy)) showShop(); return; }
  if(!a) return; userAct();
  if(a.dataset.act==='start'){ startRun(0); lastMode='play'; }
  else if(a.dataset.act==='next'){ G.stage++; beginStage(G.stage); $('ov').hidden=true; $('wrap').classList.remove('tall'); lastMode='play'; ensureAudio(); }
  else if(a.dataset.act==='retry'){ const s=G.stage; beginStage(s); G.hero.hp=G.hero.max; $('ov').hidden=true; $('wrap').classList.remove('tall'); lastMode='play'; }
});
$('autoBtn').addEventListener('click',()=>{ ensureAudio(); setAuto(!auto); });
$('muteBtn').addEventListener('click',()=>{ muted=!muted; ls.set('kaibutsu_mute',muted?'1':'0'); applyMute(); });
function applyMute(){ $('muteBtn').textContent=muted?'音 OFF':'音 ON'; if(master) master.gain.value=muted?0:0.75; }

/* ---------- テスト用フック ---------- */
window.__kaibutsu={
  state:()=>({mode:G.mode,stage:G.stage,x:G.hero.x,camX:G.camX,hp:G.hero.hp,max:G.hero.max,money:G.money,score:G.score,wlv:G.wlv,shield:G.shield,kills:G.kills,boss:G.boss&&G.boss.hp,auto}),
  step(dt){ let r=dt; while(r>1e-9){ const d=Math.min(r,1/60); update(d); r-=d; } },
  setAuto, start:(s)=>{ startRun(s||0); lastMode='play'; }, setSilent:v=>{silent=!!v}, god:v=>{ G.hero.inv=v?1e9:0; },
  G:()=>G
};
applyMute(); showTitle(); lastMode=G.mode; requestAnimationFrame(loop);
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
<script>
// ダブルタップ・ピンチでズームしない（iPhone Safari 対策）
(()=>{
  let lt=0;
  document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lt<350&&!(e.target.closest&&e.target.closest('a'))) e.preventDefault(); lt=n; },{passive:false});
  for(const ev of ['gesturestart','gesturechange','gestureend']) document.addEventListener(ev,e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault());
})();
</script>
