<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="異世界に転生したダイソンが、倒した敵のステータスを吸い、仲間に与えて強敵を倒すタクティクスRPG">
<title>マネーダイソン3 異世界転生編</title>
<style>
html,body{touch-action:manipulation}
:root{
  --bg:#17122A; --bg2:#231B3E; --paper:#EFE3C2; --paper2:#E2D2A8; --ink:#3A2A1A; --line:#8A6A3A; --mute:#7A6A50;
  --gold:#F2C23A; --blue:#5A9AE8; --red:#E85A4A; --green:#4AB06A; --purple:#8A5AE0;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#2E2450 0%,var(--bg) 65%);color:#fff;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;padding:6px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px;min-height:100%}
#top{display:flex;align-items:center;gap:8px;position:relative;z-index:25}
#top a{color:#CFC2E8;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:999px;padding:6px 10px;background:var(--bg2);color:#fff;cursor:pointer}
.mini[aria-pressed=true]{background:#E0A83A;color:#2A2440}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hud{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:#E8DCFF}
#hud #goal{color:var(--gold);text-align:right}
#order{display:flex;gap:3px;overflow:hidden;height:24px;align-items:center}
#order span{flex:none;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:#2C2450;color:#fff;white-space:nowrap}
#order span.p{background:#2A4A8A} #order span.e{background:#7A2A3A} #order span.now{outline:2px solid var(--gold)}
#order b{font-size:10px;color:#BFB0E0;margin-right:2px;white-space:nowrap;flex:none}
#wrap{position:relative;border-radius:12px;overflow:hidden;background:#0E0A1E;box-shadow:inset 0 0 0 2px #3A2E60}
#cv{display:block;width:100%;aspect-ratio:360/360;max-height:56vh;touch-action:none}
#bRot{position:absolute;right:6px;top:6px;font:inherit;font-size:16px;font-weight:800;border:0;border-radius:10px;width:36px;height:32px;background:rgba(20,14,40,.75);color:#fff;cursor:pointer}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(20,14,40,.85);color:#FFE7A0;font-size:13px;font-weight:800;padding:5px 12px;border-radius:10px;width:max-content;max-width:94%;text-align:center;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .25s}
.panel{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:10px;box-shadow:0 2px 0 #5A4220}
#info{min-height:62px;padding:5px 9px;font-size:12px;line-height:1.45}
#info .nm{font-size:14px;font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
#info .nm small{white-space:nowrap}
#info .nm small{font-weight:800;font-size:11px;color:var(--mute)}
.hpb{display:inline-block;width:90px;height:7px;border-radius:9px;background:#C8B890;vertical-align:middle;overflow:hidden}
.hpb i{display:block;height:100%;background:var(--green)}
#info .st{color:#5A4A30;font-variant-numeric:tabular-nums}
#info .pv{font-weight:800;color:#A02A1A}
.cap{display:inline-block;width:70px;height:7px;border-radius:9px;background:#C8B890;vertical-align:middle;overflow:hidden;margin-left:2px}
.cap i{display:block;height:100%;background:var(--purple)}
.cap.over i{background:var(--red)}
body.scene #info,body.scene #ctrl,body.scene #tank,body.scene #order,body.scene #hud,body.scene #zoom,body.scene #bRot{visibility:hidden}
#ctrl{display:grid;grid-template-columns:1fr 136px;gap:8px;align-items:start}
#cmd{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;min-height:136px;align-content:start}
#pad{position:relative;width:136px;height:136px}
#pad button{position:absolute;width:56px;height:56px;border-radius:14px;font:inherit;font-size:22px;font-weight:800;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #5A4220;touch-action:manipulation}
#pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #5A4220}
#pad .ul{left:0;top:0} #pad .ur{right:0;top:0} #pad .dl{left:0;bottom:0} #pad .dr{right:0;bottom:0}
#pad .ok{left:38px;top:38px;width:60px;height:60px;border-radius:50%;background:var(--gold);font-size:15px;z-index:1}
#zoom{position:absolute;right:6px;top:44px;display:flex;flex-direction:column;gap:4px}
#zoom button{font:inherit;font-size:18px;font-weight:800;border:0;border-radius:10px;width:36px;height:32px;background:rgba(20,14,40,.75);color:#fff;cursor:pointer}
#cmd button,.pbtn{font:inherit;font-size:14px;font-weight:800;border:2px solid var(--line);border-radius:10px;padding:9px 4px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #5A4220}
#cmd button:disabled,.pbtn:disabled{opacity:.4;cursor:default}
#cmd button.go{background:var(--gold)}
#cmd button.forb{background:#3A1A5A;color:#F0D0FF;border-color:#8A4AC8}
#cmd button.forb:disabled{opacity:.35}
#cmd button.wide{grid-column:span 2}
#cmd .msg{grid-column:span 2;font-size:13px;font-weight:800;color:#E8DCFF;text-align:center;padding:6px}
#tank,.tankrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;font-weight:800;min-height:22px}
#tank .lb,.tankrow .lb{color:#CDB8FF}
#tank span.c,.tankrow span.c{background:#2C2450;border:1px solid #5A4A90;border-radius:7px;padding:2px 6px}
/* dialog */
#dlg{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(540px,calc(100vw - 20px));z-index:30;padding:10px 14px 12px;cursor:pointer}
#dlg .who{font-size:12px;font-weight:800;color:#7A3A1A;margin-bottom:2px}
#dlg .txt{font-size:16px;font-weight:800;line-height:1.55;min-height:50px}
#dlg .nx{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--mute);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* modal list */
#pop{position:fixed;inset:0;z-index:25;background:rgba(10,6,24,.55);display:flex;align-items:flex-end;justify-content:center;padding:10px}
#pop .box{width:min(540px,100%);max-height:80vh;overflow:auto;padding:10px 12px 12px}
#pop h3{margin:0 0 6px;font-size:15px}
#pop p{margin:2px 0 6px;font-size:12px;color:#5A4A30}
#pop .row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed #BFA878;font-size:13px;font-weight:800}
#pop .row small{display:block;font-weight:400;font-size:11px;color:#6A5A40}
#pop .acts{display:flex;gap:6px;margin-top:10px}
#pop .acts button{flex:1}
.pbtn.sm{font-size:13px;padding:6px 10px}
.pbtn.go{background:var(--gold)}
/* camp, title, end screens */
.full{position:fixed;inset:0;z-index:20;overflow:auto;background:radial-gradient(120% 70% at 50% 0%,#2E2450 0%,var(--bg) 70%)}
.full .in{max-width:560px;margin:0 auto;padding:46px 12px 30px}
#camp h2{margin:4px 0 8px;font-size:18px;text-align:center}
.card{padding:8px 10px;margin-bottom:8px}
.card h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.card .sts{display:grid;grid-template-columns:repeat(4,1fr);gap:3px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.card .gv{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.card .gv button{font:inherit;font-size:12px;font-weight:800;border:2px solid var(--line);border-radius:8px;padding:5px 7px;background:#FFF6DA;color:var(--ink);cursor:pointer}
.card .gv button:disabled{opacity:.4}
#title{text-align:center}
#title h2{font-size:30px;margin:8px 0 0;line-height:1.15;background:linear-gradient(180deg,#FFF3C0,#F2C23A);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{font-size:16px;font-weight:800;color:#CDB8FF;margin:2px 0 6px}
#title p{font-size:13px;color:#DCD0F2;margin:4px 0;line-height:1.6}
#title canvas{width:100%;max-width:360px;aspect-ratio:360/200;display:block;margin:6px auto}
#title .btns{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:12px auto 0}
.big{width:100%;font:inherit;font-size:16px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--gold);color:var(--ink);cursor:pointer;text-decoration:none;display:block;text-align:center}
.big.sub{background:var(--paper)}
#title small{display:block;margin-top:12px;font-size:11px;color:#A898C8}
#endsc{text-align:center}
#endsc h2{font-size:24px;margin:20px 0 6px}
#endsc p{color:#DCD0F2;font-size:14px;line-height:1.7}
</style>

  <small id="tbest"></small>
</div></div>
<div id="endsc" class="full" hidden><div class="in"></div></div>

const movEff=u=>Math.max(1,u.mov-(u.st.omori?1:0));

/* ================= ranges ================= */
function moveRange(u){ const info=new Map(), k0=u.x+','+u.y; info.set(k0,{d:0,prev:null}); const q=[[u.x,u.y,0]], mv=movEff(u);
  while(q.length){ const [x,y,d]=q.shift(); if(d>=mv) continue;

      info.set(k,{d:d+1,prev:[x,y]}); q.push([nx,ny,d+1]); } }
  const reach=new Set(); for(const k of info.keys()){ const [x,y]=k.split(',').map(Number); const o=unitAt(x,y); if(!o||o===u) reach.add(k); }
  return {reach,info}; }

const skRng=(u,k)=>{ const s=SK[k]; return k==='attack'?u.rng:s.rng; };
const skMin=(u,k)=>{ const s=SK[k]; if(k==='attack') return u.minr||1; if(s.k==='heal'||s.k==='self') return 0; return s.minr||1; };
function targetTiles(u,k,fx,fy){ fx=fx==null?u.x:fx; fy=fy==null?u.y:fy; const r=skRng(u,k), mn=skMin(u,k), out=[];
  if(SK[k].k==='self') return [[fx,fy]];

    if(r===1&&d===1&&!u.fly&&Math.abs(hAt(x,y)-hAt(fx,fy))>3&&SK[k].k==='phys') continue; out.push([x,y]); }
  return out; }

  if(s.line){ const d=dirTo(fx,fy,tx,ty), out=[]; for(let i=1;i<=s.line;i++){ const x=fx+DIRS[d][0]*i, y=fy+DIRS[d][1]*i; if(inMap(x,y)) out.push([x,y]); } return out; }
  const a=s.aoe||0, out=[]; for(let dy=-a;dy<=a;dy++) for(let dx=-a;dx<=a;dx++){ if(Math.abs(dx)+Math.abs(dy)>a) continue; const x=tx+dx, y=ty+dy; if(inMap(x,y)) out.push([x,y]); } return out; }

/* ================= combat math ================= */
function relSide(ax,ay,t){ const [fx,fy]=DIRS[t.dir], vx=ax-t.x, vy=ay-t.y, dot=fx*vx+fy*vy, cr=Math.abs(fx*vy-fy*vx); if(dot>0&&dot>=cr) return 'front'; if(dot<0&&-dot>=cr) return 'back'; return 'side'; }
function calc(u,k,t,fx,fy){ const s=SK[k]; fx=fx==null?u.x:fx; fy=fy==null?u.y:fy; const side=relSide(fx,fy,t), dh=hAt(fx,fy)-hAt(t.x,t.y), hm=1+clamp(dh,-3,3)*.07, pw=s.pw||1;
  if(s.k==='phys'){ const a=atkEff(u); let d=(a*1.7-t.def*.85)*pw; d=Math.max(d,a*.3*pw); d*=hm*(side==='back'?1.35:side==='side'?1.15:1); let hit=(side==='back'?100:side==='side'?92:84)+(s.acc||0)+clamp((u.spd-t.spd)*1.5,-8,8); if(t.st.sleep) hit=100; return {v:Math.max(1,Math.round(d)),hit:clamp(Math.round(hit),10,100),side}; }
  if(s.k==='mag'){ let d=u.mag*1.25*pw-t.def*.35; d=Math.max(d,u.mag*.35*pw); return {v:Math.max(1,Math.round(d)),hit:95,side}; }
  if(s.k==='heal') return {v:Math.round(u.mag*pw+8),hit:100,side};
  if(s.k==='steal') return {v:0,hit:side==='back'?95:75,side};
  if(s.k==='absorb') return {v:Math.max(1,Math.round(u.mag*1.1-t.def*.3)),hit:100,side};
  return {v:0,hit:100,side}; }

  out.spd=t.spd>3?Math.min(t.spd-3,Math.max(1,Math.round(t.spd*.15*suc))):0;

/* ================= turn engine ================= */
async function nextUnit(){ for(let guard=0;guard<4000;guard++){
    for(const u of B.units) if(u.chg&&live(u)) u.chg.v+=SK[u.chg.sk].ct;
    const rd=B.units.filter(u=>u.chg&&live(u)&&u.chg.v>=100).sort((a,b)=>b.chg.v-a.chg.v);
    for(const u of rd){ const c=u.chg; if(!c||!live(u)) continue; u.chg=null; B.active=u; B.focus={x:c.tx,y:c.ty}; await resolveSkill(u,c.sk,c.tx,c.ty); B.active=null; if(checkEnd()) return null; }
    for(const u of B.units) if(!u.out) u.ct+=u.ko?8:spdEff(u);
    const r=B.units.filter(u=>!u.out&&u.ct>=100).sort((a,b)=>b.ct-a.ct)[0];
    if(r){ if(r.ko){ r.ct=0; r.ko--; if(r.ko<=0) await expire(r); if(checkEnd()) return null; continue; } return r; } }
  return null; }
async function expire(u){ u.out=true; if(u.side==='e'){ B.crystals.push({x:u.x,y:u.y,side:'e',n:u.n,yld:yieldOf(u)}); pop(u.x,u.y,'光の玉になった','#FFE070',10); }

  return false; }
async function doTurn(u){ B.active=u; B.focus={x:u.x,y:u.y}; B.cursor=null; B.turnNo=(B.turnNo||0)+1; u.moved=false; u.acted=false; renderOrder(); showInfo(u);

/* ================= AI ================= */
function threat(u,x,y){ let n=0; for(const f of foes(u)){ const d=Math.abs(f.x-x)+Math.abs(f.y-y); if(d<=movEff(f)+Math.max(1,f.rng||1)) n+=atkEff(f)+f.mag*.5; } return n; }
function evalAction(u,k,tx,ty,fx,fy){ const s=SK[k]; let v=0; const ox=u.x, oy=u.y; u.x=fx; u.y=fy;
  try{
    if(s.k==='self'){ return u.hp<u.mhp*.5?u.mhp*s.pw*.8:-1; }
    for(const [x,y] of affected(u,k,tx,ty,fx,fy)){ const t=unitAt(x,y); if(!t||t.ko||(t===u)) continue; const foe=u.st.berserk||t.side!==u.side;
      if(s.k==='heal'){ if(!foe){ const c=calc(u,k,t,fx,fy); v+=Math.min(c.v,t.mhp-t.hp)*(t.hp<t.mhp*.6?1.4:.6); } continue; }
      if(s.k==='steal'){ if(foe) v+=u.side==='e'?Math.min(P.money,40)*.3+4:Math.min(t.money,60)*.25; continue; }
      const c=calc(u,k,t,fx,fy); const dm=Math.min(c.v,t.hp)*c.hit/100;
      if(foe){ v+=dm+(c.v>=t.hp?30*c.hit/100:0)+(t.key==='dyson'?2:0)+(t.boss?6:0)+(t.chg?8:0); if(s.k==='absorb'&&t.key==='dyson'){ let n=0; for(const kk of GKEYS) n+=P.tank[kk]*(kk==='mhp'?.2:1); v+=n*2; } }
      else v-=dm*1.6+(c.v>=t.hp?40:0); }
    if(s.ct) v*=.82; return v; }
  finally{ u.x=ox; u.y=oy; } }
function usable(u){ const l=['attack',...u.sk.filter(k=>!(u.cd[k]>0))]; return u.key==='dyson'?[]:l; }
function plan(u){ const {reach}=u.moved?{reach:new Set([u.x+','+u.y])}:moveRange(u); let best=null;
  const tiles=[...reach].map(k=>k.split(',').map(Number));
  const fs=foes(u), near=(x,y)=>fs.reduce((m,f)=>Math.min(m,Math.abs(f.x-x)+Math.abs(f.y-y)),99);
  const ranged=u.rng>1||u.sk.some(k=>SK[k].k==='mag'&&SK[k].rng>2)||u.key==='mimi';
  for(const [x,y] of tiles){ const th=threat(u,x,y), dn=near(x,y);
    const posV=-th*(u.side==='p'?.25:.05)+(tAt(x,y)===3?-12:0)-(ranged&&dn<=1?8:0);
    if(!u.acted) for(const k of usable(u)){ const tg=targetTiles(u,k,x,y);
      for(const [tx,ty] of tg){ const s=SK[k]; if(!s.aoe&&!s.line&&s.k!=='self'&&!unitAt(tx,ty)) continue; if(s.aoe&&!B.units.some(o=>live(o)&&Math.abs(o.x-tx)+Math.abs(o.y-ty)<=s.aoe)) continue;
        const v=evalAction(u,k,tx,ty,x,y); if(v<=0) continue; const sc=v+posV; if(!best||sc>best.sc) best={sc,x,y,k,tx,ty}; } } }
  if(best) return best;
  // nobody to hit: walk toward the closest foe (or keep a safe distance as a caster)
  let mv=null; for(const [x,y] of tiles){ const dn=near(x,y); const want=ranged?3:1; const sc=-Math.abs(dn-want)*3-threat(u,x,y)*(u.side==='p'?.15:0)-(tAt(x,y)===3?12:0); if(!mv||sc>mv.sc) mv={sc,x,y}; }
  return mv?{x:mv.x,y:mv.y}:null; }
function faceBest(u){ const fs=foes(u); if(!fs.length) return; let b=null,bd=99; for(const f of fs){ const d=Math.abs(f.x-u.x)+Math.abs(f.y-u.y); if(d<bd){ bd=d; b=f; } } if(b) u.dir=dirTo(u.x,u.y,b.x,b.y); }
async function aiTurn(u){ await wait(fast()?20:350);
  if(u.key==='dyson'&&!u.st.berserk){ await dysonAI(u); faceBest(u); return; }
  if(u.side==='p'&&!u.st.berserk&&await allyItem(u)){ faceBest(u); return; }
  const p=plan(u); if(!p){ faceBest(u); return; }
  if(!u.moved&&(p.x!==u.x||p.y!==u.y)) await moveUnit(u,p.x,p.y);
  if(p.k&&!u.acted){ B.aoe=new Set(affected(u,p.k,p.tx,p.ty).map(a=>a.join(','))); B.cursor={x:p.tx,y:p.ty}; B.focus={x:(u.x+p.tx)/2,y:(u.y+p.ty)/2}; if(!fast()) await wait(320); B.aoe=null; B.cursor=null; await useSkill(u,p.k,p.tx,p.ty); }
  if(!u.chg) faceBest(u); }
async function allyItem(u){ const down=B.units.filter(o=>o.side==='p'&&!o.out&&o.ko&&o!==u).sort((a,b)=>(b.key==='dyson')-(a.key==='dyson'));
  for(const a of down){ if(!P.items.phoenix) break; const {reach}=moveRange(u); const spot=[...reach].map(k=>k.split(',').map(Number)).filter(([x,y])=>Math.abs(a.x-x)+Math.abs(a.y-y)<=1).sort((p,q)=>threat(u,p[0],p[1])-threat(u,q[0],q[1]))[0];
    if(!spot) continue; if(spot[0]!==u.x||spot[1]!==u.y) await moveUnit(u,spot[0],spot[1]); await useItem(u,'phoenix',a); return true; }
  return false; }
/* Dyson: grab crystals, hand power to friends, suck from enemies, stay safe */
const GPRI={gald:['spd','atk','def','mhp','mov','jmp','mag'],mimi:['spd','mag','mhp','def','mov','jmp','atk']};
const PHYS_SK=['bash','bite','hug','knife','shield','dive','aim','steal'];
function planGifts(ref,key,inBattle){ const out=[]; const T2=JSON.parse(JSON.stringify(P.tank)); let used=ref.given;
  const want=s=>key==='gald'?PHYS_SK.includes(s):!PHYS_SK.includes(s);
  for(const s of T2.skills) if(want(s)&&ref.sk.length+out.filter(o=>!(o in GSTEP)).length<5&&used+SKCOST<=ref.cap){ out.push(s); used+=SKCOST; }
  for(let loop=0;loop<200;loop++){ let any=false; for(const k of GPRI[key]){ const c=GCOST[k]; if(T2[k]>=GSTEP[k]&&used+c<=ref.cap){ if(k==='mov'&&ref.mov>=6) continue; if(k==='jmp'&&ref.jmp>=4) continue; T2[k]-=GSTEP[k]; used+=c; out.push(k); any=true; } } if(!any) break; }
  return out; }
function tankPts(){ let n=0; for(const k of GKEYS) n+=Math.floor(P.tank[k]/GSTEP[k])*GCOST[k]; return n+P.tank.skills.length*SKCOST; }
async function dysonAI(u){ const {reach}=moveRange(u); const tiles=[...reach].map(k=>k.split(',').map(Number)); const fs=foes(u);
  const allies=B.units.filter(o=>o.side==='p'&&o!==u&&!o.out);
  const near=(x,y)=>fs.reduce((m,f)=>Math.min(m,Math.abs(f.x-x)+Math.abs(f.y-y)),99);
  // 0) 禁忌
  if(!u.acted&&canForbid(u)&&u.hp>u.mhp*.4){ const en=B.units.filter(o=>o.side==='e'&&live(o)); const cnt=en.length, boss=en.some(o=>o.boss);
    if(cnt>=3||(boss&&cnt>=2)){ const alive=allies.filter(a=>!a.ko).length; if(alive>=2||cnt>=4){ await forbidden(u); return; } } }
  // 1) crystal
  const cr=B.crystals.filter(c=>reach.has(c.x+','+c.y)).sort((a,b)=>threat(u,a.x,a.y)-threat(u,b.x,b.y))[0];
  if(cr&&!u.moved&&threat(u,cr.x,cr.y)<u.hp*.9){ await moveUnit(u,cr.x,cr.y); }
  // 2) revive / potion
  if(!u.acted){ for(const a of allies){ const need=a.ko&&P.items.phoenix>0?'phoenix':(!a.ko&&a.hp<a.mhp*.35&&P.items.potion>0?'potion':null); if(!need) continue;
      const spot=u.moved?(Math.abs(a.x-u.x)+Math.abs(a.y-u.y)<=1?[u.x,u.y]:null):tiles.filter(([x,y])=>Math.abs(a.x-x)+Math.abs(a.y-y)<=1).sort((p,q)=>threat(u,p[0],p[1])-threat(u,q[0],q[1]))[0];
      if(spot){ if(!u.moved) await moveUnit(u,spot[0],spot[1]); await useItem(u,need,a); break; } } }
  // 3) give
  if(!u.acted&&tankPts()>=3){ const cand=allies.filter(a=>!a.ko&&planGifts(a.ref,a.key,true).length);
    for(const a of cand){ const spot=u.moved?(Math.abs(a.x-u.x)+Math.abs(a.y-u.y)<=2?[u.x,u.y]:null):tiles.filter(([x,y])=>Math.abs(a.x-x)+Math.abs(a.y-y)<=2).sort((p,q)=>threat(u,p[0],p[1])-threat(u,q[0],q[1]))[0];
      if(!spot) continue; if(!u.moved) await moveUnit(u,spot[0],spot[1]);
      const list=planGifts(a.ref,a.key,true); fx('beam',u.x,u.y,'#FFE070',700,a.x,a.y); snd('give'); for(const k of list) giveTo(a,k,true); pop(a.x,a.y,'力をもらった！','#FFE070',11); u.acted=true; renderTank(); await wait(fast()?40:700); break; } }
  // 3b) push bad stuff onto the boss
  if(!u.acted&&(P.tank.omori||P.tank.nemuke)){ const bs=fs.filter(f=>f.side==='e'&&(f.boss||f.atk>20)).sort((a,b)=>b.mhp-a.mhp);
    for(const t of bs){ const k=P.tank.nemuke&&!t.st.sleep?'nemuke':P.tank.omori&&!t.st.omori?'omori':null; if(!k) continue; const ok=([x,y])=>Math.abs(t.x-x)+Math.abs(t.y-y)<=2;
      const spot=u.moved?(ok([u.x,u.y])?[u.x,u.y]:null):tiles.filter(ok).sort((p,q)=>threat(u,p[0],p[1])-threat(u,q[0],q[1]))[0]; if(!spot) continue;
      if(!u.moved) await moveUnit(u,spot[0],spot[1]); u.acted=true; fx('beam',u.x,u.y,'#9AD0FF',600,t.x,t.y); snd('give'); await wait(fast()?30:500); giveBad(t,k); break; } }
  // 4) suck
  if(!u.acted){ let best=null; const pool=u.moved?[[u.x,u.y]]:tiles;
    for(const [x,y] of pool) for(const t of fs){ if(t.side!=='e'||Math.abs(t.x-x)+Math.abs(t.y-y)!==1||Math.abs(hAt(x,y)-hAt(t.x,t.y))>3) continue;
      const th=threat(u,x,y); if(th>u.hp*.8) continue; const ox=u.x, oy=u.y; u.x=x; u.y=y; const c=calc(u,'attack',t); u.x=ox; u.y=oy;
      const sp=suckPlan(u,t), sc=sp.hp*1.2+(sp.hp>=t.hp?25:0)+(t.boss?20:0)+t.money*.1-th*.4+(c.side==='back'?4:0); if(!best||sc>best.sc) best={sc,x,y,t}; }
    if(best){ if(!u.moved&&(best.x!==u.x||best.y!==u.y)) await moveUnit(u,best.x,best.y); await doSuck(u,best.t); } }
  // 5) stay safe near friends
  if(!u.moved){ let b=null; for(const [x,y] of tiles){ const al=allies.filter(a=>!a.out).reduce((m,a)=>Math.min(m,Math.abs(a.x-x)+Math.abs(a.y-y)),9); const sc=-threat(u,x,y)*.6-Math.abs(al-1.5)*4+Math.min(near(x,y),4)*2-(tAt(x,y)===3?20:0); if(!b||sc>b.sc) b={sc,x,y}; }
    if(b&&(b.x!==u.x||b.y!==u.y)) await moveUnit(u,b.x,b.y); } }

    c.querySelector('button').onclick=()=>{ humanTouch(); snd('tap'); settle(null); };

function padMove(dir){ if(!B||!B.map) return; const [vdx,vdy]=PADV[dir]; let wd=null; for(const [dx,dy] of DIRS){ const [a,b]=view(0,0), [c2,d2]=view(dx,dy); if(c2-a===vdx&&d2-b===vdy) wd=[dx,dy]; }
  if(B.facingU&&waiting&&waiting.kind==='menu'){ B.facingU.dir=DIRS.findIndex(d=>d[0]===wd[0]&&d[1]===wd[1]); snd('step'); return; }
  const cur=B.cursor||(B.active?{x:B.active.x,y:B.active.y}:{x:0,y:0}); let nx=cur.x+wd[0], ny=cur.y+wd[1];
  while(inMap(nx,ny)&&tAt(nx,ny)===4){ nx+=wd[0]; ny+=wd[1]; } if(!inMap(nx,ny)){ snd('miss'); return; }

async function tip(k){ if(!B||B.tips[k]) return; B.tips[k]=1; await story(STORY.tips[k]); }
async function tutorial(u){ if(B.ch===0&&u.key==='dyson'){ if(!u.moved&&!u.acted){ const near=foes(u).some(f=>Math.abs(f.x-u.x)+Math.abs(f.y-u.y)<=movEff(u)+1); await tip(near?'move':'far'); if(near) B.tips.far=1; }
    else if(u.moved&&!u.acted&&foes(u).some(f=>Math.abs(f.x-u.x)+Math.abs(f.y-u.y)===1)) await tip('act'); }
  if(B.ch===1&&!u.moved&&!u.acted) await tip(u.key==='dyson'?'give':u.key==='gald'?'back':'magic'); }
async function playerTurn(u){ const start={x:u.x,y:u.y,dir:u.dir}; u.noUndo=false;
  for(;;){ if(B.over) return; showInfo(u); await tutorial(u); if(S.auto){ await aiTurn(u); return; }
    const items=[{k:'move',t:'移動',dis:u.moved},{k:'act',t:'行動',dis:u.acted},{k:'wait',t:'待機',cls:'go'}];
    if(u.moved&&!u.acted&&!u.noUndo) items.push({k:'undo',t:'移動をやめる'});
    const c=await menu(items,`${u.n} のターン`);
    if(c==='__auto'){ await aiTurn(u); return; }
    if(c==='move'){ const {reach}=moveRange(u); const t=await pickTile(reach,'rgba(90,150,255,.5)','移動先をえらぶ',null,{x:u.x,y:u.y});
      if(t==='__auto'){ await aiTurn(u); return; } if(t){ const had=B.crystals.length; await moveUnit(u,t.x,t.y); if(B.crystals.length!==had) u.noUndo=true; } }
    else if(c==='undo'){ u.x=start.x; u.y=start.y; u.dir=start.dir; u.moved=false; }
    else if(c==='act'){ const r=await actMenu(u); if(r==='__auto'){ await aiTurn(u); return; } }
    else if(c==='wait') break;
    if(u.moved&&u.acted) break; }
  if(!u.chg&&!B.over) await chooseFacing(u); }
async function chooseFacing(u){ B.facingU=u; B.cursor=null; B.focus={x:u.x,y:u.y}; try{ return await chooseFacing2(u); } finally{ B.facingU=null; } }
async function chooseFacing2(u){ const arrows=[]; for(let d=0;d<4;d++){ const [sx,sy]=scrDir(d); arrows.push({d,a:sx>0?(sy>0?'↘':'↗'):(sy>0?'↙':'↖')}); }
  const order=['↖','↗','↙','↘']; arrows.sort((p,q)=>order.indexOf(p.a)-order.indexOf(q.a));
  const c=await menu([...arrows.map(o=>({k:'d'+o.d,t:o.a})),{k:'keep',t:'このまま',cls:'go'}].slice(0,5).concat([{k:'auto',t:'敵のほうを向く'}]),'向きをえらぶ（十字キーで向けて「決定」）');
  if(c==='__auto'||c==='auto') faceBest(u); else if(c&&c[0]==='d') u.dir=+c.slice(1); }

    if(!set.size){ toast(k==='phoenix'?'となりに倒れた仲間がいない':'となりに仲間がいない'); return; }

  const s=SK[c], tg=targetTiles(u,c); const set=new Set(tg.map(a=>a.join(',')));
  const t=await pickTile(set,s.k==='heal'?'rgba(120,230,150,.45)':'rgba(255,110,90,.45)',`${s.n}：対象をタップ${s.ct?'（詠唱あり）':''}`,p=>{ B.aoe=new Set(affected(u,c,p.x,p.y).map(a=>a.join(','))); showInfo(unitAt(p.x,p.y)||u,previewText(u,c,p.x,p.y)); });

    const next=()=>{ if(dlgState&&dlgState.n<dlgState.s.length){ dlgState.n=dlgState.s.length; d.querySelector('.txt').textContent=dlgState.s; return; } i++; snd('tap'); if(i>=lines.length){ d.hidden=true; dlgState=null; S.sceneOn=false; document.body.classList.remove('scene'); res(); } else show(); };

function autoGive(key){ const r=P.units[key]; for(const k of planGifts(r,key,false)) giveTo(r,k,false); }
function autoCamp(){ const A=P.units; while(P.items.phoenix<2&&P.money>=150){ P.money-=150; P.items.phoenix++; } while(P.items.potion<4&&P.money>=40){ P.money-=40; P.items.potion++; }
  for(let i=0;i<4&&P.money>=SEED_P+100;i++){ const k=A.gald.cap<=A.mimi.cap?'gald':'mimi'; P.money-=SEED_P; A[k].cap+=6; }
  for(let r=0;r<20;r++){ const lg=planGifts(A.gald,'gald',false), lm=planGifts(A.mimi,'mimi',false); let any=false;
    for(let i=0;i<Math.max(lg.length,lm.length);i++){ if(lg[i]&&giveTo(A.gald,lg[i],false)) any=true; if(lm[i]&&giveTo(A.mimi,lm[i],false)) any=true; } if(!any) break; } }

let AC=null;
function tone(f,d,type,vol,slide,delay){ if(!S.snd||fast()) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+(delay||0), o=AC.createOscillator(), gg=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d); gg.gain.setValueAtTime(vol||.06,t); gg.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gg); gg.connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(_){} }
function sceneSnd(sc){ if(sc==='berserk') snd('bad'); else if(sc==='seal') snd('suck'); else if(sc==='give') snd('give'); else if(sc==='subspace'||sc==='epilogue') snd('absorb'); }
function snd(k){ switch(k){
  case 'tap': tone(700,.05,'triangle',.04); break; case 'ok': tone(880,.08,'triangle',.05); break; case 'step': tone(200,.03,'square',.015); break;
  case 'swing': tone(500,.1,'sawtooth',.03,150); break; case 'hit': tone(160,.12,'square',.05,70); break; case 'miss': tone(400,.08,'sine',.03,600); break;
  case 'suck': tone(900,.5,'sine',.05,200); tone(600,.5,'triangle',.03,150); break; case 'give': [523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.05,null,i*.06)); break;
  case 'absorb': [784,988,1175,1568].forEach((f,i)=>tone(f,.2,'sine',.05,null,i*.07)); break; case 'heal': tone(660,.25,'sine',.05,990); break;
  case 'charge': tone(300,.3,'sine',.04,600); break; case 'ko': tone(300,.4,'square',.04,80); break; case 'bad': tone(120,.4,'sawtooth',.05,60); break; case 'buy': tone(1200,.08,'square',.03); break;
  case 'win': [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.06,null,i*.13)); break; case 'lose': [392,330,262,196].forEach((f,i)=>tone(f,.35,'triangle',.05,null,i*.2)); break; } }
function setSnd(b){ S.snd=b; $('#bSnd').setAttribute('aria-pressed',b); $('#bSnd').textContent=b?'🔊':'🔇'; try{localStorage.setItem('dy3Snd',b?'1':'0');}catch(_){} }

async function battle(ch){
  B={ch,map:buildMap(ch),units:[],crystals:[],fx:[],pops:[],hl:null,aoe:null,cursor:null,over:null,active:null,banner:null};
  B.tips={}; (CH[ch].solo?['dyson']:['dyson','gald','mimi']).forEach((key,i)=>{ const [x,y]=CH[ch].pl[i]; const p=freeNear(x,y); B.units.push(mkAlly(key,p.x,p.y)); });
  for(const [t,x,y] of CH[ch].en){ const p=freeNear(x,y); B.units.push(mkEnemy(t,p.x,p.y)); }
  const cx=B.units.filter(u=>u.side==='e').reduce((s,u)=>s+u.x,0)/B.units.filter(u=>u.side==='e').length, cy=B.units.filter(u=>u.side==='e').reduce((s,u)=>s+u.y,0)/B.units.filter(u=>u.side==='e').length;
  for(const u of B.units){ u.dir=u.side==='p'?dirTo(u.x,u.y,cx,cy):dirTo(u.x,u.y,2,8); u.ct=ri(0,30)+(u.side==='p'?20:0); }
  S.rot=0; B.focus=null; fit(); camSnap(); $('#chap').textContent=`第${ch+1}章 ${CH[ch].t}`; $('#goal').textContent='目的：'+CH[ch].goal; renderTank(); renderOrder(); showInfo(null,'<div class="st">マスをタップすると、そこにいるキャラの情報が見られる。⟳でマップを回せる。</div>'); $('#cmd').innerHTML='';
  await banner(`第${ch+1}章　${CH[ch].t}`,null,1500);
  while(!B.over){ const u=await nextUnit(); if(!u||B.over) break; await doTurn(u); P.turns++; }
  $('#cmd').innerHTML='';
  if(B.over==='win'){ snd('win'); await banner('勝利！','#FFE070',1500);
    const ys=[...B.crystals.map(c=>c.yld),...B.units.filter(e=>e.side==='e'&&e.ko&&!e.out).map(yieldOf)], sum={};
    const before=JSON.stringify(P.tank); for(const y of ys) addTank(y); const now=P.tank, was=JSON.parse(before);
    for(const k of GKEYS) if(now[k]>was[k]) sum[k]=now[k]-was[k];
    const parts=Object.keys(sum).map(k=>`${STN[k]}+${sum[k]}`).concat(now.skills.filter(s=>!was.skills.includes(s)).map(s=>'技「'+SK[s].n+'」'));
    renderTank(); if(ys.length) await story([['','戦いのあと、ダイソンは残った光の玉を すべて吸い取った。'],['',parts.length?'吸いだめ：'+parts.join('　'):'（たいしたものは なかった）']]); }
  else { snd('lose'); await banner(B.units.find(u=>u.key==='dyson').out?'ダイソンが たおれた…':'全滅…','#FF8A7A',1600); }
  return B.over; }
let gen=0;
async function runGame(cont){ const my=++gen; S.phase='game'; $('#title').hidden=true; $('#endsc').hidden=true;
  if(!cont){ P=newP(); seedRun(); await story(STORY.pro); }
  while(P.ch<CH.length){ if(my!==gen) return; const ch=P.ch;
    await story(STORY['c'+(ch+1)]);
    const snap=JSON.stringify(P); let res;
    for(;;){ res=await battle(ch); if(my!==gen) return; if(res==='win') break;
      const c=S.auto?'retry':await menu([{k:'retry',t:'もう一度 戦う',cls:'go wide'}],'負けてしまった…（この章のはじめから）'); P=JSON.parse(snap); P.retries=(P.retries||0)+1; }
    if(ch===5) await story(STORY.c6e);
    P.ch++; const D=P.units.dyson; D.mhp+=12; D.def+=1; if(P.ch%2===0) D.spd+=1; P.units.gald.cap+=24; P.units.mimi.cap+=24;
    saveP();
    if(P.ch<CH.length&&!CH[ch].solo){ await camp(); saveP(); } }
  autoGive('gald'); autoGive('mimi'); await story(STORY.end); if(my!==gen) return; ending(); }

/* ================= auto / loop ================= */
function setAuto(v){ S.auto=!!v; $('#bAuto').setAttribute('aria-pressed',S.auto); if(S.auto&&waiting) settle('__auto'); if(S.auto&&S.phase==='title') S.titleT=0; }
function humanTouch(){ if(S.auto) setAuto(false); }
function tick(dt){ T+=dt/1000; camStep(dt); S.sceneT=(S.sceneT||0)+dt;
  for(const tm of timers.slice()){ tm.t-=dt; if(tm.t<=0){ timers.splice(timers.indexOf(tm),1); tm.r(); } }
  if(B){ for(const f of B.fx) f.t+=dt; B.fx=B.fx.filter(f=>f.t<f.d); for(const p of B.pops) p.t+=dt; B.pops=B.pops.filter(p=>p.t<p.d); if(B.banner) B.banner.t+=dt; }
  dlgTick(dt);
  if(S.auto){ if(waiting){ if(waiting.kind==='camp'){ S.campT=(S.campT||0)+dt; if(S.campT>(fast()?50:2200)){ S.campT=0; settle('__auto'); } } else settle('__auto'); }
    if(S.phase==='title'){ S.titleT=(S.titleT||0)+dt; if(S.titleT>1200){ S.titleT=-1e9; runGame(false); } }
    if(S.phase==='ending'){ S.endT=(S.endT||0)+dt; if(S.endT>6000){ toTitle(); } } } }
let last=0;
function frame(ts){ const dt=last?Math.min(100,ts-last):0; last=ts; tick(dt); if(S.phase==='title') drawTitle(); else render(); requestAnimationFrame(frame); }

addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='o'){ setAuto(!S.auto); return; } if(k==='r'&&B){ S.rot=(S.rot+1)%4; return; }
  const AK={arrowup:'ur',arrowright:'dr',arrowdown:'dl',arrowleft:'ul'}; if(AK[k]&&B&&S.phase==='game'){ e.preventDefault(); humanTouch(); padMove(AK[k]); return; }
  if(k==='+'||k===';'){ setZoom(1); return; } if(k==='-'){ setZoom(-1); return; }
  if((k==='enter'||k==='z')&&!dlgState&&waiting&&(waiting.kind==='pick'||waiting.kind==='menu')){ e.preventDefault(); humanTouch(); padOk(); return; }
  if((k===' '||k==='enter')&&dlgState){ e.preventDefault(); humanTouch(); dlgState.next(); return; }

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
