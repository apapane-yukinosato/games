<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="アガベ・塊根植物・多肉を育てて品評会に出す、おしゃれな植物育成ゲーム。水やり・肥料・形づくり、仕入れはガチャ。オートモードつき。">
<title>草育て ―アガベ・塊根・多肉―</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<style>
:root{--bg:#0e0d13;--panel:#1a1824;--panel2:#252233;--ink:#efecf7;--mut:#a29eb6;--line:#38344d;--pink:#ff7ad9;--vio:#a98bff;--grn:#6fd08c;--gold:#ffc83d;--red:#ff6b6b;--blue:#6cc4ff;--wood:#b98a5a;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#2a1740 0%,var(--bg) 62%);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;gap:8px;padding:6px 12px;height:44px;flex:none}
#top a{color:#d6c8ff;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#f3e9ff;letter-spacing:.04em}
.mini{font-size:12px;font-weight:800;border:0;border-radius:999px;padding:6px 10px;background:#302a46;color:#fff;white-space:nowrap}
.mini[aria-pressed=true]{background:linear-gradient(90deg,#ff7ad9,#a98bff);color:#1a0d24}
#hud{flex:none;margin:0 12px;padding:8px 12px;border-radius:14px;background:linear-gradient(180deg,#242034,#1a1824);border:1px solid var(--line);display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;font-size:13px;font-weight:800}
#hud .r2{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
#hMoney{color:var(--gold)}
#hTk{color:var(--pink)}
#hAp b{color:var(--grn);font-size:14px}
.chip{border:1px solid var(--line);background:#2a2640;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;color:var(--ink)}
.chip[aria-pressed=true]{background:#2d4a3c;border-color:#5fb480;color:#bff0d2}
#hShow{margin-left:auto}
#hShow.now{color:#1a0d24;background:var(--gold);padding:2px 9px;border-radius:999px;animation:pls 1s ease-in-out infinite alternate}
@keyframes pls{from{filter:brightness(1)}to{filter:brightness(1.3)}}
#evt{flex:none;margin:6px 12px 0;padding:6px 12px;border-radius:12px;background:#3a2a1a;border:1px solid #8a6a30;color:#ffe2a8;font-size:12.5px;font-weight:800}
#evt.bad{background:#40212a;border-color:#a04558;color:#ffc9d2}
#evt.good{background:#1f3a2c;border-color:#4a9a70;color:#c3f3d6}
#stage{flex:1;min-height:0;position:relative;margin-top:8px}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 12px 14px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{position:relative;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#15131d;text-align:left;display:block;transition:transform .12s,box-shadow .2s}
.pc:active{transform:scale(.97)}
.pc canvas{width:100%;display:block;aspect-ratio:1/1.08}
.pc .nm{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000a 60%);font-size:11.5px;font-weight:800;text-align:center;text-shadow:0 1px 2px #000;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:9px 6px 7px;pointer-events:none}
.pc .rb{position:absolute;left:5px;top:5px;font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;color:#14101c}
.pc .ic{position:absolute;right:4px;top:4px;font-size:13px;line-height:1.1;text-align:right;text-shadow:0 1px 2px #000;pointer-events:none}
.pc .hb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0006}
.pc .hb u{display:block;height:100%;background:linear-gradient(90deg,#4fd08a,#a6f08c)}
.pc.empty{border:1.5px dashed #46405e;background:transparent;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1.08;color:#6f6a88;font-size:12px;font-weight:800}
.pc.fl-w{box-shadow:0 0 0 2px #6cc4ff,0 0 22px #6cc4ff88}
.pc.fl-f{box-shadow:0 0 0 2px #6fd08c,0 0 22px #6fd08c88}
.pc.fl-s{box-shadow:0 0 0 2px #fff,0 0 22px #ffffffaa}
.pc.fl-i{box-shadow:0 0 0 2px #ffc83d,0 0 22px #ffc83d88}
.sechd{margin:14px 2px 6px;font-size:13px;font-weight:800;color:var(--mut)}
#boxList{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#boxList .pc canvas{aspect-ratio:1/1}
.tip{margin:12px 2px 0;font-size:12px;color:var(--mut);line-height:1.6}
#nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.7fr;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#0e0d1300,#0e0d13 30%)}
#nav button{border:1px solid var(--line);background:#252233;border-radius:14px;padding:7px 2px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;color:var(--ink)}
#nav button span{font-size:19px}
#nav button.on{background:#3a3158;border-color:var(--vio)}
#nav button.hot{animation:pls 1s ease-in-out infinite alternate;border-color:var(--gold)}
#nav #bNext{background:linear-gradient(180deg,#ff8ae0,#a98bff);color:#1a0d24;border:0;font-size:13px;box-shadow:0 3px 0 #5a3d90}
#nav #bNext:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3d90}
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,5,10,.78);display:flex;align-items:center;justify-content:center;padding:10px}
.sheet{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;box-shadow:0 12px 40px #000a}
.sheet h3{margin:0 0 6px;font-size:17px}
.x{position:absolute;right:10px;top:10px;border:0;background:#302a46;border-radius:999px;width:32px;height:32px;font-size:15px;font-weight:900}
.dh{display:flex;align-items:center;gap:8px;padding-right:38px;flex-wrap:wrap}
.dh .rb2{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;color:#14101c}
.dh b{font-size:17px}
.dh small{color:var(--mut);font-weight:700;font-size:12px}
.dbig{border-radius:14px;overflow:hidden;margin:8px 0;border:1px solid var(--line)}
.dbig canvas{display:block;width:100%;aspect-ratio:300/200}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.chips span{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#2d2942;border:1px solid var(--line)}
.chips span.w{background:#40212a;border-color:#a04558;color:#ffc9d2}
.chips span.g{background:#1f3a2c;border-color:#4a9a70;color:#c3f3d6}
.advice{font-size:13px;font-weight:800;padding:8px 10px;border-radius:12px;background:#2a2640;margin:4px 0 8px;color:#f0e6ff}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-bottom:10px}
.bar{font-size:11.5px;font-weight:800;color:var(--mut)}
.bar div{height:8px;background:#0007;border-radius:5px;overflow:hidden;margin-top:2px;position:relative}
.bar i{display:block;height:100%;border-radius:5px}
.bar em{font-style:normal;float:right;color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.act{border:1px solid var(--line);background:#272339;border-radius:12px;padding:7px 3px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.act span{font-size:18px}
.act small{font-size:10px;color:var(--mut);font-weight:700}
.act:disabled{opacity:.38;cursor:default}
.act:not(:disabled):active{transform:scale(.96);background:#35304d}
.act.wide{grid-column:span 3;flex-direction:row;justify-content:center;gap:8px}
.sheet.det{touch-action:pan-y}
.dbw{position:relative}.dbw .dbig{margin:8px 0}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:52px;border:0;border-radius:12px;background:#14101ccc;color:#fff;font-size:30px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.nav.pv{left:6px}.nav.nx{right:6px}.nav:active{background:#3a3158}
.dpos{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:#14101ccc;color:#fff;font-size:11px;font-weight:900;padding:2px 10px;border-radius:999px}
.dbar{position:sticky;bottom:-14px;margin:10px -14px -14px;padding:9px 14px;background:#211d33;border-top:1px solid var(--line);border-radius:0 0 18px 18px;display:flex;align-items:center;gap:10px;z-index:3;font-size:13px;font-weight:800}
.dbar .dap b{color:var(--grn);font-size:17px}.dbar.zero .dap b{color:#ff8a8a}
.dap{display:inline-block}.dap.bump{animation:apbump .4s ease-out}
.dbar .ddt{margin-left:auto;color:var(--mut);font-size:12px}
.dbar .dwarn{flex-basis:100%;color:#ff8a8a;font-size:11px}.dbar.zero{flex-wrap:wrap;gap:2px 10px}
.act.noap small{color:#ff9a9a;font-size:9px}
@keyframes apbump{0%{transform:scale(1)}30%{transform:scale(1.45);color:#ffd36b}100%{transform:scale(1)}}
@keyframes inR{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
.sheet.in-r{animation:inR .22s ease-out}.sheet.in-l{animation:inL .22s ease-out}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pick button{border:1px solid var(--line);background:#2d2942;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800}
.pick button.cur{background:#3a3158;border-color:var(--vio)}
.pick button:disabled{opacity:.35}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.card2 h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.card2 p{margin:2px 0 8px;font-size:12.5px;color:var(--mut);line-height:1.55}
.btn{border:0;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:900;background:linear-gradient(180deg,#ff8ae0,#a98bff);color:#1a0d24;box-shadow:0 3px 0 #5a3d90}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3d90}
.btn.alt{background:#34304a;color:var(--ink);box-shadow:0 3px 0 #1c1a2a}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#ffb02e);box-shadow:0 3px 0 #8a5a08}
.btn:disabled{opacity:.4;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:120px}
.rate{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px;font-weight:800;margin:6px 0}
.rate .rb{font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;color:#14101c;text-align:center}
.rate div{height:6px;background:#0007;border-radius:4px;overflow:hidden}
.rate i{display:block;height:100%}
.pity{font-size:12px;font-weight:800;color:var(--mut);margin:4px 0 8px}
.pity div{height:8px;background:#0007;border-radius:5px;overflow:hidden;margin-top:3px}
.pity i{display:block;height:100%;background:linear-gradient(90deg,#ffc83d,#ff7ad9)}
.shopg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.si{border:1px solid var(--line);background:#252233;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);line-height:1.4}
.si b{font-size:13.5px;color:var(--ink)}
.si .pr{color:var(--gold);font-weight:900;font-size:13px}
.si .btn{padding:7px;font-size:12.5px;margin-top:4px}
.trend{display:flex;gap:6px;font-size:12px;font-weight:800;margin:4px 0 10px;flex-wrap:wrap}
.trend span{padding:3px 9px;border-radius:999px;background:#2d2942}
.trend .up{background:#1f3a2c;color:#bff0d2}.trend .dn{background:#40212a;color:#ffc9d2}
.ladder{display:flex;gap:4px;align-items:center;font-size:11.5px;font-weight:800;margin:6px 0 10px;flex-wrap:wrap}
.ladder span{padding:4px 10px;border-radius:999px;background:#2d2942;color:var(--mut)}
.ladder span.cur{background:linear-gradient(90deg,#ffc83d,#ff7ad9);color:#1a0d24}
.ladder span.done{background:#1f3a2c;color:#bff0d2}
.elig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.elig .pc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px #ffc83d66}
.elig .sc{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:15px;font-weight:900;color:var(--gold);text-shadow:0 1px 3px #000}
/* reveal */
#cf{z-index:95}
#rev{background:radial-gradient(70% 60% at 50% 40%,#2a1a4a 0%,#06050a 80%);flex-direction:column;gap:10px;overflow:auto}
.crate{font-size:110px;line-height:1;filter:drop-shadow(0 8px 20px #000a)}
.crate.shake{animation:shk .12s linear infinite}
@keyframes shk{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,2px) rotate(-4deg)}50%{transform:translate(4px,-2px) rotate(3deg)}75%{transform:translate(-3px,3px) rotate(-3deg)}100%{transform:translate(0,0) rotate(0)}}
.burst{position:fixed;left:50%;top:42%;width:2px;height:2px;border-radius:50%;pointer-events:none;animation:bst 1s ease-out forwards}
@keyframes bst{from{box-shadow:0 0 0 0 var(--c),0 0 0 0 var(--c);opacity:1}to{box-shadow:0 0 0 min(80vw,520px) transparent,0 0 120px 160px var(--c);opacity:0}}
.rays{position:fixed;left:50%;top:42%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;background:conic-gradient(from 0deg,var(--c) 0 6%,transparent 6% 12%,var(--c) 12% 18%,transparent 18% 24%,var(--c) 24% 30%,transparent 30% 36%,var(--c) 36% 42%,transparent 42% 48%,var(--c) 48% 54%,transparent 54% 60%,var(--c) 60% 66%,transparent 66% 72%,var(--c) 72% 78%,transparent 78% 84%,var(--c) 84% 90%,transparent 90% 96%,var(--c) 96% 100%);opacity:.22;animation:spn 8s linear infinite;mask-image:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spn{to{transform:rotate(360deg)}}
.rvcard{width:min(300px,86vw);border-radius:20px;padding:12px;background:linear-gradient(180deg,#27223a,#16131f);border:3px solid var(--c);box-shadow:0 0 40px var(--c),0 0 90px -10px var(--c);text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;position:relative}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.rvcard canvas{width:100%;border-radius:12px;display:block}
.rvcard .big{font-size:26px;font-weight:900;letter-spacing:.06em;color:var(--c);text-shadow:0 0 14px var(--c)}
.rvcard .st{color:var(--gold);font-size:18px;letter-spacing:3px}
.rvcard .nm{font-size:17px;font-weight:900;margin:2px 0}
.rvcard .sub{font-size:12px;color:var(--mut);font-weight:700}
.rvcard.r-UR{border-color:transparent;background:linear-gradient(#1b1626,#1b1626) padding-box,conic-gradient(from var(--a,0deg),#ff5f5f,#ffc83d,#6fd08c,#6cc4ff,#a98bff,#ff5fc8,#ff5f5f) border-box;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both,rb 2s linear infinite}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes rb{to{--a:360deg}}
.mini10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(560px,96vw)}
.mc{border-radius:12px;border:2px solid var(--c);background:#1b1726;overflow:hidden;position:relative;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.mc canvas{width:100%;display:block;aspect-ratio:1/1.05}
.mc .rb{position:absolute;left:3px;top:3px;font-size:9px;font-weight:900;padding:0 5px;border-radius:999px;color:#14101c;background:var(--c)}
.mc.hi{box-shadow:0 0 18px var(--c)}
.mc b{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;text-shadow:0 1px 2px #000}
.revbtns{display:flex;gap:8px;margin-top:6px}
.skip{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:3}
.jcard{width:min(420px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:3px 0;animation:pop .35s both;font-size:13px}
.jcard b{font-size:14px}.jcard .sc{float:right;font-size:18px;font-weight:900;color:var(--gold)}
.jcard small{display:block;color:var(--mut);margin-top:2px;line-height:1.5}
.rkl{width:min(420px,94vw)}
.rk{display:flex;justify-content:space-between;padding:6px 12px;margin:3px 0;border-radius:10px;background:var(--panel2);font-weight:800;font-size:14px;animation:pop .35s both}
.rk.you{background:linear-gradient(90deg,#4a3a10,#5a2a48);border:1px solid var(--gold)}
.rk.first{box-shadow:0 0 22px #ffc83d88}
.brk{width:min(420px,94vw);display:grid;gap:4px;margin:4px 0}
.brk .bar{font-size:12px}
.title2{font-size:20px;font-weight:900;text-align:center;color:#f3e9ff}
.sub2{font-size:13px;color:var(--mut);text-align:center;font-weight:700}
/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:98;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#toasts div{max-width:92vw;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:800;background:#241f38ee;border:1px solid var(--line);color:var(--ink);animation:tin .25s both}
#toasts div.ok{border-color:#4a9a70;color:#c3f3d6}
#toasts div.bad{border-color:#a04558;color:#ffc9d2}
#toasts div.warn{border-color:#a8832e;color:#ffe2a8}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#ticker{position:fixed;left:50%;transform:translateX(-50%);top:calc(48px + env(safe-area-inset-top,0px));z-index:60;font-size:12px;font-weight:900;padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,#ff7ad9,#a98bff);color:#1a0d24;pointer-events:none;white-space:nowrap}
/* title */
.full{position:fixed;inset:0;z-index:80;overflow:auto;background:radial-gradient(120% 70% at 50% 0%,#3a1a5c 0%,var(--bg) 70%)}
.full .in{max-width:480px;margin:0 auto;padding:44px 16px 30px;text-align:center}
.full h2{margin:4px 0 0;font-size:56px;line-height:1.1;letter-spacing:.06em;font-weight:900;background:linear-gradient(180deg,#fff,#ffb4ee 45%,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #a35cff88)}
.full .sub{font-size:14px;font-weight:800;color:#ffc9f0;letter-spacing:.2em;margin:2px 0 4px}
.full canvas{width:100%;max-width:440px;border-radius:14px;display:block;margin:10px auto;border:1px solid var(--line)}
.rules{max-width:420px;margin:8px auto;text-align:left;font-size:12.5px;line-height:1.7;background:#ffffff0f;border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:#e3dcf3}
.rules b{color:var(--gold)}
.btns{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:12px auto 0}
.btns .btn{width:100%;font-size:16px;padding:13px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:360px;margin:10px auto;font-size:12px}
.recs div{background:#ffffff10;border-radius:10px;padding:6px 8px;color:var(--mut);font-weight:700}
.recs b{display:block;color:var(--gold);font-size:15px}

 p.age++;if(p.ampCd>0)p.ampCd--;
 if(p.bare>0){
  const okT=T>=18&&T<=34;let risk=p.hatsu?(okT?0:.06):(okT?.12:.25);if(!p.koshi)risk+=.25;
  if(rnd(G)<risk){p.dead=true;msgs.push(['bad',sp.s+'が発根できずに腐った…']);return;}
  if(p.koshi)p.bare-=p.hatsu?1.5:1;
  if(p.bare<=0){p.bare=0;p.root=45;p.m=30;p.hatsu=false;msgs.push(['ok',sp.s+'が発根した！']);}
  p.koshi=false;return;
 }
 let dmg=0,rootD=0;const dry=dryRate(G,p,E);
 if(E.rain)p.m=Math.min(100,p.m+60);
 const m0=p.m,m2=Math.max(0,m0-dry);
 const wetBad=dorm?m0>25:m2>50;p.soggy=wetBad?p.soggy+1:0;
 if(wetBad){rootD+=4+3*p.soggy;if(!dorm)p.stretch+=3;if(p.soggy>=3)dmg+=4;if(p.soggy===1)msgs.push(['warn',sp.s+'の土が湿りすぎ…根が傷んでいる']);}
 const thirst=!dorm&&m0<dry*.5;if(thirst){dmg+=4+(m0<=0?4:0);if(m0<=0)msgs.push(['warn',sp.s+'がしおれている！']);}
 p.m=m2;p.wilt=thirst;
 if(T<sp.minT){const d=sp.minT-T;dmg+=6+d*4;rootD+=d*1.5;msgs.push(['bad',sp.s+'が寒さで傷んだ']);}
 if(T>sp.maxT){const d=T-sp.maxT;dmg+=d*3+3;msgs.push(['bad',sp.s+'が暑さで焼けた']);}
 if(p.nutri>85){dmg+=8;rootD+=6;p.stretch+=8;p.nutri*=.8;msgs.push(['warn',sp.s+'が肥料焼け']);}
 if(p.pest){dmg+=4;p.shape=Math.max(0,p.shape-2);}
 else if(T>16&&p.guard<=0){let pr=.035;if(ev==='pest')pr=.3;if(E.wind)pr*=.5;if(p.sand)pr*=.7;if(G.plants.some(q=>q.pest&&!q.inBox))pr+=.04;if(rnd(G)<pr){p.pest=true;msgs.push(['warn',sp.s+'にカイガラムシ！']);}}
 if(p.guard>0)p.guard--;
 const sr=p.size/100;
 if(!dorm){
  const nutF=.85+.75*Math.min(p.nutri,70)/70;
  const gain=BASEG*g*(.75+.5*p.pg)*nutF*(.3+.7*p.health/100)*(.4+.6*p.root/100)*(thirst?.6:1)*(wetBad?.7:1)*(1-p.size/108)*(1+.1*(E.l-.8));
  p.size=Math.min(100,p.size+gain);p.nutri=Math.max(0,p.nutri-9);
  p.stretch+=(1-E.l)*9+(p.nutri>65?4:0)-(E.wind?2:0);
  if(E.l>=.85&&!wetBad&&p.nutri<=60)p.stretch-=1.5;
  if(sp.pr&&p.size>=35){p.pupP+=.2*sp.pr*g*sr;if(p.pupP>=1&&p.pups<3){p.pups++;p.pupP-=1;msgs.push(['ok',sp.s+'から子株が出た']);}}
 }
 p.stretch=clamp(p.stretch,0,100);
 const maxF=40+60*p.pg;let ft=clamp(100-p.stretch*.9-(1-E.l)*38+(E.wind?7:0),0,maxF);
 p.form+=(ft-p.form)*(dorm?.06:.3);
 let cf=.6+.4*E.l;
 if(sp.g==='succ'){const c=T<5?.85:T<9?1.0:T<18?1.18:T<26?.95:T<30?.75:.6;cf*=c;}
 const tgt=Math.min(100,Math.pow(p.gt,1.4)*100*(.45+.55*Math.pow(sr,.8))*(.6+.4*p.form/100)*cf*(.7+.3*p.health/100));
 p.trait+=(tgt-p.trait)*(dorm?.04:.2);
 p.shape=Math.max(0,p.shape-(dorm?.3:1.2));
 if(dmg>0)p.health=Math.max(0,p.health-dmg);else p.health=Math.min(100,p.health+4);
 if(rootD>0)p.root-=rootD;else p.root=Math.min(100,p.root+3);
 if(p.health<=0||p.root<=0){p.dead=true;msgs.push(['bad',sp.s+'が枯れてしまった…']);}
}
function rollEvent(G){
 const wy=wyOf(G.week),s=season(G.week);let e=null;const r=rnd(G);
 const rainP=(wy>=13&&wy<=17)?.32:(s===0||s===2)?.12:.05;
 if(s===1&&wy>=19&&r<.16)e={k:'heat',t:'猛暑',d:'屋外は焼けやすい。屋内かLED棚へ'};
 else if(r<rainP)e={k:'rain',t:'長雨',d:'屋外は水浸し。屋外の株は避難させよう'};
 else if(s===3&&r<.18)e={k:'cold',t:'寒波',d:'屋外は凍える。温室やLED棚へ'};
 else if(s!==3&&r>.93)e={k:'pest',t:'虫の大発生',d:'カイガラムシに注意。殺虫剤で予防'};
 else if(r>.955&&r<=.99)e={k:'fair',t:'即売会',d:'今週は売値が25%アップ'};
 G.event=e;
}
function showWeek(G){return SHOW0+SHOWI*G.showIdx;}
function showCat(G){return CATS[G.showIdx%4];}
function showAvail(G){return G.week===showWeek(G)&&!G.showDone;}
function nextWeek(G){
 const msgs=[];
 for(const p of G.plants){if(p.inBox)continue;weekPlant(G,p,msgs);}
 for(const p of G.plants.filter(q=>q.dead))msgs.push(['bad','『'+SP[p.sp].s+'』をなくした']);
 G.plants=G.plants.filter(p=>!p.dead);
 if(G.week===showWeek(G)&&!G.showDone){msgs.push(['warn','品評会は不参加になった']);G.showIdx++;}
 G.showDone=false;
 G.week++;G.ap=apMax(G);
 if(G.week%6===0)rollTrend(G);
 rollEvent(G);
 if(G.event&&G.event.k==='pest')msgs.push(['warn','虫の大発生の予報！']);
 if(!G.plants.length&&G.money<1500&&G.tk<1){const p=mkPlant(G,0,{size:12});p.place='led';G.plants.push(p);msgs.push(['ok','ホームセンターで苗を1つ見つけた']);}
 G.aiDone={};
 if(G.week%4===3){G.money+=3000;msgs.push(['ok','お給料日！ ¥3,000']);}
 G.hist.push([G.week,G.money,G.plants.length]);if(G.hist.length>600)G.hist.shift();
 G.log=msgs.map(m=>({t:m[0],s:m[1]}));
 return msgs;
}

/* ---------- actions ---------- */
const OK=(msg)=>({ok:true,msg}),NG=(msg)=>({ok:false,msg});
function useAp(G,n){if(G.ap<n)return false;G.ap-=n;return true;}
function waterPreview(G,p,amt){const E=placeEnv(G,p.place,G.week);const dry=dryRate(G,p,E);const m1=Math.min(100,p.m+(amt==='big'?70:30));return{m1,m2:Math.max(0,m1-dry),dry};}
const A={
 water(G,p,amt){if(p.bare)return NG('発根中は腰水で管理しよう');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;p.m=Math.min(100,p.m+(amt==='big'?70:30));return OK(amt==='big'?'たっぷり水やり':'少し水やり');},
 fert(G,p,k){if(p.bare)return NG('発根中は肥料なし');if(!(G.inv[k]>0))return NG('肥料がない');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;G.inv[k]--;p.nutri=Math.min(100,p.nutri+(k==='fert1'?40:25));return OK('肥料をあげた');},
 shape(G,p){
  if(p.bare)return NG('発根中は触らない');if(G.ap<1)return NG('手入れポイントが足りない');const sp=SP[p.sp];const E=placeEnv(G,p.place,G.week),g=gFactor(sp.ty,E.T);G.ap--;
  if(sp.g==='agave'){p.shape=Math.min(100,p.shape+35);return OK('下葉取りで形がととのった');}
  if(sp.g==='caudex'){if(g>=.7){p.shape=Math.min(100,p.shape+40);return OK('剪定で枝ぶりがよくなった');}p.health=Math.max(1,p.health-10);p.shape=Math.min(100,p.shape+10);return OK('時期がわるく、株がストレスを受けた');}
  if(p.stretch>=25&&p.size>=40){p.stretch=15;p.size*=.75;p.form=Math.min(100,p.form+10);p.shape=Math.min(100,p.shape+20);p.pups=Math.min(3,p.pups+1);return OK('胴切りで締まった！子株もとれる');}
  p.shape=Math.min(100,p.shape+30);return OK('葉の整理で形がととのった');
 },
 canProp(p){const sp=SP[p.sp];return sp.pr>0&&p.pups>=1&&!p.bare;},
 propagate(G,p){
  if(!A.canProp(p))return NG('まだ子株がない');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;p.pups--;p.health=Math.max(1,p.health-2);
  const sp=SP[p.sp];const q=mkPlant(G,p.sp,{size:R(G,5,8)});q.pg=clamp(p.pg-.03+rnd(G)*.06,.1,1);q.gt=clamp(p.gt-.03+rnd(G)*.06,.1,1);q.trait=Math.pow(q.gt,1.4)*30;
  if(shelfPlants(G).length>=slotsMax(G))q.inBox=true;else q.place='led';
  G.plants.push(q);return{ok:true,msg:(sp.g==='succ'&&(sp.dr==='rosette'||sp.dr==='haworthia')?'葉挿し':'子株')+'をとった',plant:q};
 },
 repot(G,p,pt){
  if(pt===p.pt)return NG('同じ鉢だよ');if(pt!=='plain'&&!(G.pots[pt]>0))return NG('その鉢がない');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;
  if(pt!=='plain')G.pots[pt]--;if(p.pt!=='plain')G.pots[p.pt]++;p.pt=pt;
  if(isDorm(G,p)){p.health=Math.max(1,p.health-5);}else p.root=Math.min(100,p.root+15);
  return OK(POTS[pt].n+'に植え替えた');
 },
 sand(G,p){if(p.sand)return NG('もう敷いてある');if(!(G.inv.sand>0))return NG('化粧砂がない');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;G.inv.sand--;p.sand=true;return OK('化粧砂を敷いた');},
 move(G,p,pl){if(p.place===pl)return NG('もうそこにある');if(pl==='gh'&&!G.up.gh)return NG('温室がまだない');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;p.place=pl;return OK(PLACES[pl].n+'へ移動');},
 vital(G,p){if(!(G.inv.vital>0))return NG('活力剤がない');G.inv.vital--;p.health=Math.min(100,p.health+30);p.root=Math.min(100,p.root+10);return OK('活力剤で元気になった');},
 rootAgent(G,p){if(!p.bare)return NG('発根中の株だけ');if(p.hatsu)return NG('もう使った');if(!(G.inv.root>0))return NG('発根剤がない');G.inv.root--;p.hatsu=true;return OK('発根剤をぬった');},
 koshi(G,p){if(!p.bare)return NG('発根中の株だけ');if(p.koshi)return NG('今週はもう腰水した');if(G.ap<1)return NG('手入れポイントが足りない');G.ap--;p.koshi=true;return OK('腰水で発根管理');},
 pest(G,p){if(!(G.inv.pest>0))return NG('殺虫剤がない');G.inv.pest--;p.pest=false;p.guard=8;return OK('殺虫剤をまいた');},
 amp(G,p,k){
  if(p.bare)return NG('発根してから');if(!(G.inv[k]>0))return NG('アンプルがない');if(p.ampCd>0)return NG('この株はまだ効果が続いている');G.inv[k]--;p.ampCd=3;const wk=k==='amp'?3:10;
  for(let i=0;i<wk;i++)p.size=Math.min(100,p.size+BASEG*1.8*(.75+.5*p.pg)*(.3+.7*p.health/100)*(1-p.size/108));
  p.form=Math.min(100,p.form+3);p.trait+=(Math.min(100,Math.pow(p.gt,1.4)*100*(.45+.55*Math.pow(p.size/100,.8)))*.7-p.trait)*.5;
  return OK(wk+'週ぶん成長した！');
 },
 drink(G){if(!(G.inv.drink>0))return NG('ドリンクがない');G.inv.drink--;G.ap+=3;return OK('手入れ+3');},
 sell(G,p){const v=price(G,p);G.money+=v;G.stats.sold+=v;G.plants=G.plants.filter(q=>q!==p);return{ok:true,msg:SP[p.sp].s+'を売った',v};},
 unbox(G,p){if(!p.inBox)return NG('');if(shelfPlants(G).length>=slotsMax(G))return NG('棚がいっぱい');p.inBox=false;return OK('棚に並べた');},
 buyItem(G,k){const it=ITEMS[k];if(!it||!it.price)return NG('買えない');if(G.money<it.price)return NG('お金が足りない');G.money-=it.price;G.stats.spent+=it.price;G.inv[k]++;return OK(it.n+'を買った');},
 buyPot(G,k){const c=POTS[k].price;if(!c)return NG('');if(G.money<c)return NG('お金が足りない');G.money-=c;G.stats.spent+=c;G.pots[k]++;return OK(POTS[k].n+'を買った');},
 upCost(G,k){const u=UPS[k];return G.up[k]>=u.max?null:u.cost[G.up[k]];},
 buyUp(G,k){const c=A.upCost(G,k);if(c==null)return NG('これ以上ない');if(G.money<c)return NG('お金が足りない');G.money-=c;G.stats.spent+=c;G.up[k]++;if(k==='ap')G.ap++;return OK(UPS[k].n+'を買った');}
};

/* ---------- gacha ---------- */
function rollRar(G,rate,minIdx){
 let w=rate.slice();if(minIdx)for(let i=0;i<minIdx;i++)w[i]=0;
 const tot=w.reduce((a,b)=>a+b,0);let r=rnd(G)*tot;for(let i=0;i<5;i++){r-=w[i];if(r<0)return i;}return 4;
}
function gachaOne(G,m,forceSR){
 const M=MACH[m];let ri;G.pity[m]++;
 let pityHit=false;if(G.pity[m]>=PITY){ri=rollRar(G,M.rate,3);pityHit=true;}else{ri=rollRar(G,M.rate,0);if(forceSR&&ri<2)ri=rollRar(G,M.rate,2);}
 if(ri>=3)G.pity[m]=0;
 const rar=RARS[ri];const list=SP.map((s,i)=>i).filter(i=>SP[i].r===rar);const spi=pick(G,list);
 const isRoot=m==='root';
 const p=mkPlant(G,spi,{bonus:isRoot?.06:0,size:isRoot?R(G,20,40):(ri>=2?R(G,8,14):R(G,5,10))});
 if(isRoot){p.bare=4+Math.floor(rnd(G)*3);p.root=0;p.health=72;p.form=40;p.trait=Math.pow(p.gt,1.4)*50;}
 p.new=true;p.fromM=m;p.pityHit=pityHit;
 if(shelfPlants(G).length>=slotsMax(G))p.inBox=true;
 G.plants.push(p);G.stats.pulls++;G.stats['m_'+m]=(G.stats['m_'+m]||0)+1;return p;
}
function gachaCost(G,m,n,pay){const M=MACH[m];return pay==='tk'?M.tk*n:Math.round(M.price*n*(n>=10?.9:1));}
function gacha(G,m,n,pay){
 n=n||1;pay=pay||'yen';const c=gachaCost(G,m,n,pay);
 if(pay==='tk'){if(G.tk<c)return null;G.tk-=c;}else{if(G.money<c)return null;G.money-=c;G.stats.spent+=c;}
 const out=[];for(let i=0;i<n;i++)out.push(gachaOne(G,m,n>=10&&i===n-1&&!out.some(p=>RARS.indexOf(SP[p.sp].r)>=2)));
 return out;
}

/* ---------- shows ---------- */
function potBeauty(p){const pt=POTS[p.pt];return Math.min(100,pt.b+(pt.c[SP[p.sp].g]||0)+(p.sand?12:0));}
function catScores(p){return{form:.6*p.form+.4*p.shape,trait:p.trait,health:clamp(p.health*.75+(100-p.stretch)*.25-(p.pest?20:0),0,100),pot:potBeauty(p),size:p.size};}
function seasonBonus(G,p){
 const sp=SP[p.sp],E=placeEnv(G,p.place,G.week,null),g=gFactor(sp.ty,E.T);let b=g>=1?4:g>=.6?2:g>=.2?0:-5;
 const wy=wyOf(G.week);if(sp.g==='succ'&&wy>=26&&wy<=45)b+=2;return b;
}
function playerScore(G,p){
 const c=catScores(p);let tot=0;const js=JUDGES.map(j=>{let s=0;for(const k in j.w)s+=c[k]*j.w[k];tot+=s;return s;});
 return{c,js,total:tot/3+seasonBonus(G,p)};
}
function eligible(G){const cat=showCat(G);return G.plants.filter(p=>!p.inBox&&!p.bare&&(cat==='all'||SP[p.sp].g===cat));}
function rivalBase(G){return TIERS[G.tier].base+Math.min(3,Math.floor(G.week/52)*.5)+(G.cleared?8:0)+(showCat(G)==='all'?2:0);}
const JCM=[
 {good:{form:'この締まり、見事じゃ',trait:'特徴の出方が実によい',health:'根も葉も申し分なしじゃ',pot:'鉢との取り合わせが粋じゃのう',size:'堂々たる貫禄じゃ'},bad:{form:'まだ形が甘いのう',trait:'もう少し個性がほしいところ',health:'顔色がすぐれんな',pot:'鉢選びは修業が足りん',size:'もっと時間をかけて育てなされ'}},
 {good:{form:'フォルムがキマってる！',trait:'このキャラ、マジで推せる',health:'コンディションばっちり',pot:'鉢もセンスいいね',size:'このボリュームは映える！'},bad:{form:'シルエットがちょっと惜しい',trait:'個性がもう一押しほしい',health:'元気ないかも？',pot:'鉢がふつうすぎるかな',size:'まだ小ぶりだね'}},
 {good:{form:'ぎゅっと締まっていて可愛い',trait:'特徴がやさしく出ていて素敵',health:'葉つやがとても綺麗です',pot:'鉢とのバランスがすてき',size:'のびのび育っていますね'},bad:{form:'形が少しゆるんでいます',trait:'もう少し特徴が出るといいな',health:'ちょっと疲れて見えます',pot:'鉢をかえるともっと映えそう',size:'これからの成長に期待です'}}
];
function judgeComment(j,c,ji){
 const ks=Object.keys(j.w);let best=ks[0],worst=ks[0];
 for(const k of ks){if(c[k]*j.w[k]>c[best]*j.w[best])best=k;if(j.w[k]>=.15&&c[k]<c[worst]*1.0||j.w[worst]<.15)worst=k;}
 for(const k of ks)if(j.w[k]>=.15&&c[k]<c[worst])worst=k;
 const M=JCM[ji];return M.good[best]+'。'+(c[worst]<62?M.bad[worst]+'。':'');
}
function resolveShow(G,pid,commit){
 const p=G.plants.find(q=>q.id===pid);if(!p)return null;
 const saved=G.rs;const ps=playerScore(G,p);const base=rivalBase(G);
 const names=RIVALS.slice();const rv=[];
 for(let i=0;i<5;i++){const k=Math.floor(rnd(G)*names.length);const n=names.splice(k,1)[0];const s=base+(rnd(G)+rnd(G)+rnd(G)-1.5)*10;rv.push({n,s});}
 if(G.tier===2)rv.push({n:BOSS,s:base+4+(rnd(G)+rnd(G)-1)*7});
 const you={n:'あなた',s:ps.total,you:true};
 const all=rv.concat([you]).sort((a,b)=>b.s-a.s);const rank=all.indexOf(you)+1;
 const res={pid,rank,total:ps.total,c:ps.c,judges:JUDGES.map((j,i)=>({n:j.n,t:j.t,s:ps.js[i],cm:judgeComment(JUDGES[i],ps.c,i)})),field:all,tier:G.tier,cat:showCat(G),bonus:seasonBonus(G,p),sp:p.sp};
 if(!commit){G.rs=saved;return res;}
 const T=TIERS[G.tier];let money=0,tk=0,item=null;
 if(rank===1){money=T.money;tk=T.tk;G.trophies++;const pool=G.tier===0?['vital','amp']:G.tier===1?['amp','amp2','pot:conc']:['amp2','pot:artist','amp2'];item=pick(G,pool);}
 else if(rank===2){money=T.money/2;tk=1;}else if(rank===3){money=T.money/4;}else money=T.money/10;
 G.money+=money;G.tk+=tk;res.money=money;res.tk=tk;res.item=item;
 if(item){if(item.startsWith('pot:'))G.pots[item.slice(4)]++;else G.inv[item]++;}
 if(rank<=2&&G.tier<2){G.tier++;res.up=true;}
 if(G.tier===2&&res.tier===2&&rank===1&&!G.cleared){G.cleared=true;G.clearWeek=G.week;res.clear=true;}
 G.bestRank=Math.min(G.bestRank,rank);G.bestScore=Math.max(G.bestScore,ps.total);G.stats.shows++;if(rank===1)G.stats.wins++;
 G.showDone=true;G.showIdx++;G.lastShow=res;return res;
}
function previewBest(G,p){
 // try every owned pot x sand; returns best config by (rank, total)
 let best=null;const pots=['plain'].concat(Object.keys(G.pots).filter(k=>G.pots[k]>0||k===p.pt));
 for(const pt of new Set(pots.concat([p.pt])))for(const sand of (p.sand?[true]:G.inv.sand>0?[false,true]:[false])){
  const o1=p.pt,o2=p.sand;p.pt=pt;p.sand=sand;const r=resolveShow(G,p.id,false);p.pt=o1;p.sand=o2;
  if(!best||r.rank<best.r.rank||(r.rank===best.r.rank&&r.total>best.r.total))best={pt,sand,r};
 }
 return best;
}
/* ================= auto (TAS-like gardener) ================= */
const RVAL={N:1,R:2.5,SR:6,SSR:14,UR:30};
function aiValue(G,p){return RVAL[SP[p.sp].r]*(.4+p.pg)*(.35+p.size/100);}
function aiKeepSet(G){
 const S=slotsMax(G),all=G.plants.slice();const val=new Map();

 mergeMsgs(S.auto?msgs.filter(m=>m[0]==='bad'||m[0]==='ok'):msgs).slice(0,2).forEach(m=>toast(m[1],m[0]));
 renderAll();save();
}
function userNext(){
 if(S.revOpen||S.scene!=='game')return;
 const go=()=>doNextWeek();
 if(showAvail(G)&&eligible(G).length)confirmBox('今週は品評会！<br>出品しないで次の週へ進む？','進む',go);else go();
}
function snap(){const m=new Map();for(const p of G.plants)m.set(p.id,[p.m,p.nutri,p.shape,p.size,p.pt,p.place,p.sand,p.pest,p.health,p.bare,p.koshi,p.hatsu,p.stretch,p.ampCd].join());return m;}
function setAuto(on){
 on=!!on;S.auto=on;$('#bAuto').setAttribute('aria-pressed',on?'true':'false');$('#bSpd').hidden=!on;$('#ticker').hidden=!on;
 if(on){if(S.scene==='title')startNew();else if(S.scene==='clear')S.clearT=Math.min(S.clearT,3);S.autoT=.2;}
}
function autoTick(dt){
 if(S.scene==='title'||!G)return;
 if(S.scene==='clear'){S.clearT-=dt;if(S.clearT<=0)startNew();return;}
 if(S.revOpen)return;
 if(S.detail!=null){closeDetail();}
 S.autoT-=dt;if(S.autoT>0)return;
 const before=snap();const label=aiAct(G);
 if(label){
  S.autoT=.05;$('#ticker').textContent='🤖 '+label;
  if(/水/.test(label))sfx('water');else if(/肥/.test(label))sfx('fert');else if(/形|胴|子株/.test(label))sfx('snip');else if(/殺虫|予防/.test(label))sfx('spray');else if(/鉢/.test(label))sfx('pot');else if(/買う/.test(label))sfx('coin');else sfx('tap');
  if(G.aiGot&&G.aiGot.length){const l=G.aiGot;G.aiGot=[];renderAll();gachaReveal(l,null);return;}
  if(G.aiResult){const r=G.aiResult;G.aiResult=null;const p=plantOf(r.pid);resolveRecord(r);renderAll();showReveal(r,p||{pt:'plain'});return;}
  renderAll();const after=snap();
  for(const[id,v]of after)if(before.get(id)!==v)flash(id,/水/.test(label)?'fl-w':/肥/.test(label)?'fl-f':/形|胴|子株/.test(label)?'fl-s':'fl-i');
  return;
 }
 S.autoT=.15;doNextWeek();
}
function resolveRecord(r){G.lastShow=r;recordShow(r);}
function runFor(dt){
 if(!S.timers.length&&!S.auto)return;
 for(const t of S.timers)t.t-=dt;const due=S.timers.filter(t=>t.t<=0);if(due.length){S.timers=S.timers.filter(t=>t.t>0);due.forEach(t=>t.fn());}
 if(S.auto)autoTick(dt);
}

 })();
 $('#vGacha').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(b&&!b.disabled){ac();doGacha(b.dataset.g,+b.dataset.n,b.dataset.p);}});

 $('#rev').addEventListener('click',e=>{

 document.addEventListener('keydown',e=>{
  if(e.key==='o'||e.key==='O'){ac();setAuto(!S.auto);return;}

function frame(ts){const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;runFor(dt*(S.auto?S.spd:1));requestAnimationFrame(frame);}
/* ---------- test hooks ---------- */
function planted(p){const sp=SP[p.sp];return{id:p.id,name:sp.s,rar:sp.r,grp:sp.g,size:+p.size.toFixed(1),health:+p.health.toFixed(0),form:+p.form.toFixed(0),trait:+p.trait.toFixed(0),shape:+p.shape.toFixed(0),stretch:+p.stretch.toFixed(0),root:+p.root.toFixed(0),m:+p.m.toFixed(0),nutri:+p.nutri.toFixed(0),pg:+p.pg.toFixed(2),place:p.place,pot:p.pt,bare:p.bare,inBox:p.inBox,pest:p.pest};}
function getState(){return{scene:S.scene,week:G.week,year:Math.floor(G.week/52)+1,season:SEAS[season(G.week)],money:G.money,tickets:G.tk,ap:G.ap,apMax:apMax(G),tier:G.tier,tierName:TIERS[G.tier].n,trophies:G.trophies,rank:G.bestRank,bestScore:+G.bestScore.toFixed(1),cleared:G.cleared,clearWeek:G.clearWeek,showIn:showWeek(G)-G.week,showAvail:showAvail(G),cat:showCat(G),event:G.event&&G.event.k,pity:Object.assign({},G.pity),auto:S.auto,view:S.view,revOpen:S.revOpen,slots:slotsMax(G),stats:Object.assign({},G.stats),plants:G.plants.map(planted)};}
function gachaStats(m,n,seed){
 const g=newG(seed||99);const c={N:0,R:0,SR:0,SSR:0,UR:0};let natural=0,pityN=0,gap=0,maxGap=0,all={N:0,R:0,SR:0,SSR:0,UR:0};
 for(let i=0;i<n;i++){const p=gachaOne(g,m,false);g.plants=[];const r=SP[p.sp].r;all[r]++;gap++;if(RARS.indexOf(r)>=3){maxGap=Math.max(maxGap,gap);gap=0;}
  if(p.pityHit)pityN++;else{natural++;c[r]++;}}
 const rate={},rateAll={};for(const r of RARS){rate[r]=+(c[r]/natural*100).toFixed(2);rateAll[r]=+(all[r]/n*100).toFixed(2);}
 return{pulls:n,naturalPulls:natural,pityPulls:pityN,naturalRate:rate,displayed:MACH[m].rate,overallRateIncludingPity:rateAll,maxGapBetweenSSRplus:maxGap};
}
function tenPullCheck(m,reps,seed){const g=newG(seed||7);let bad=0;for(let i=0;i<reps;i++){const out=[];for(let k=0;k<10;k++)out.push(gachaOne(g,m,k===9&&!out.some(p=>RARS.indexOf(SP[p.sp].r)>=2)));g.plants=[];if(!out.some(p=>RARS.indexOf(SP[p.sp].r)>=2))bad++;}return{reps,withoutSRplus:bad};}
window.__tana={
 getState,step:(dt,n)=>{n=n||1;for(let i=0;i<n;i++)runFor(dt);return getState();},

  if(o.plant!==undefined){const p=mkPlant(G,o.plant,{size:o.size||40});if(o.pg!==undefined){p.pg=o.pg;p.gt=o.gt!==undefined?o.gt:o.pg;}if(o.stretch!==undefined)p.stretch=o.stretch;if(o.form!==undefined)p.form=o.form;if(o.trait!==undefined)p.trait=o.trait;if(o.health!==undefined)p.health=o.health;if(o.shape!==undefined)p.shape=o.shape;if(o.place)p.place=o.place;if(o.pt)p.pt=o.pt;if(o.sand)p.sand=true;if(o.bare)p.bare=o.bare;if(o.pest)p.pest=true;if(shelfPlants(G).length>=slotsMax(G)&&!o.force)p.inBox=true;G.plants.push(p);}
  if(o.up)G.up[o.up]=(G.up[o.up]||0)+1;if(o.week!==undefined)G.week=o.week;renderAll();return getState();},

  [SP.slice(0,12).map((s,i)=>i),SP.slice(12).map((s,i)=>i+12)].forEach((pg,pi)=>{const oy=pi*(h*4+16);pg.forEach((spi,ci)=>rows.forEach((r,ri)=>{const p=mkPlant({rs:spi*13+5,nid:spi+1},spi,{});p.id=spi*10+ri+1;p.size=r[0];p.stretch=r[1];p.form=r[1]?35:85;p.trait=Math.min(90,70*(.4+r[0]/160));p.health=95;p.shape=70;p.pt=['plain','black','conc','artist'][(ci+ri)%4];p.sand=(ci+ri)%3===0;g.save();g.translate(ci*w,oy+16+ri*h);g.beginPath();g.rect(0,0,w,h);g.clip();drawCardBg(g,w,h);drawPlant(g,p,0,2,w,h-8,{});g.restore();}));pg.forEach((spi,ci)=>{g.fillStyle='#fff';g.fillText(SP[spi].s,ci*w+3,oy+12);});});return cv.toDataURL('image/png');},
 G:()=>G,S

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
