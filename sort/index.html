<body>

        </div></div>

      <div class="row"><div class="lab"><span>はやさ</span><b id="spVal"></b></div><input type="range" id="spRange" min="0" max="10" step="1" value="6" aria-label="はやさ"></div>

</div>

<script>
(()=>{
'use strict';
/* ====================== ソートの機械（操作列ジェネレータ） ====================== */
function rngOf(seed){let s=(seed>>>0)||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
class M{
  constructor(al,init,seed,shift){
    this.al=al;this.n=init.length;this.a=Int32Array.from(init);this.s=shift||0;
    this.cmp=0;this.swp=0;this.wr=0;this.steps=0;this.done=false;this.finStep=Infinity;
    this.hk=new Uint8Array(this.n);this.fn=new Uint8Array(this.n);
    this.sn=new Int32Array(16);this.sc=0;this.sw=-1;this.op='';this.rng=rngOf((seed||1)*31+7);
    let mx=1;for(const v of this.a)if(v>mx)mx=v;this.vmax=mx;
    this.gen=al.fn(this);
  }
  mk(i,k){if(this.nomark)return;if(i>=0&&i<this.n){if(this.hk[i]<k)this.hk[i]=k;this.sn[this.sc++&15]=this.a[i];}}
  fin(i){if(i>=0&&i<this.n)this.fn[i]=1;}
  finRange(lo,hi){for(let i=lo;i<hi;i++)this.fn[i]=1;}
  *lt(i,j){const a=this.a,s=this.s,r=(a[i]>>s)<(a[j]>>s);this.cmp++;this.op='c';this.mk(i,1);this.mk(j,1);yield;return r;}
  *ltv(x,y,i,j){const s=this.s,r=(x>>s)<(y>>s);this.cmp++;this.op='c';this.mk(i,1);this.mk(j,1);yield;return r;}
  *swap(i,j){if(i===j)return;const a=this.a,t=a[i];a[i]=a[j];a[j]=t;this.swp++;this.op='s';this.mk(i,2);this.mk(j,2);yield;}
  *set(i,v){this.a[i]=v;this.wr++;this.op='w';this.mk(i,2);yield;}
  *rd(i){this.mk(i,1);yield;}
  *tick(){yield;}
  advance(k){
    while(k>0&&!this.done){
      const r=this.gen.next();
      if(r.done){this.done=true;this.finStep=this.steps;this.fn.fill(1);this.sw=0;break;}
      this.steps++;k--;
    }
  }
}
/* ---- 共通部品 ---- */
function* insRange(m,lo,hi){const a=m.a;for(let i=lo+1;i<hi;i++){const key=a[i];let j=i;while(j>lo&&(yield* m.ltv(key,a[j-1],j-1,-1))){yield* m.set(j,a[j-1]);j--;}if(j!==i)yield* m.set(j,key);}}
function* mergeRange(m,lo,mid,hi){
  const a=m.a,L=a.slice(lo,mid),R=a.slice(mid,hi);let i=0,j=0,k=lo;
  while(i<L.length&&j<R.length){if(yield* m.ltv(R[j],L[i],mid+j,lo+i))yield* m.set(k++,R[j++]);else yield* m.set(k++,L[i++]);}
  while(i<L.length)yield* m.set(k++,L[i++]);
  while(j<R.length)yield* m.set(k++,R[j++]);
}
function* sift(m,b,i,size){for(;;){const l=2*i+1;if(l>=size)return;let c=l;if(l+1<size&&(yield* m.lt(b+l,b+l+1)))c=l+1;if(yield* m.lt(b+i,b+c)){yield* m.swap(b+i,b+c);i=c;}else return;}}
function* heapRange(m,b,size){for(let i=(size>>1)-1;i>=0;i--)yield* sift(m,b,i,size);for(let e=size-1;e>0;e--){yield* m.swap(b,b+e);m.fin(b+e);yield* sift(m,b,0,e);}}
function* partL(m,lo,hi){const a=m.a,mid=(lo+hi)>>1;if(mid!==hi)yield* m.swap(mid,hi);const p=a[hi];let i=lo;for(let j=lo;j<hi;j++){if(yield* m.ltv(a[j],p,j,hi)){if(i!==j)yield* m.swap(i,j);i++;}}if(i!==hi)yield* m.swap(i,hi);return i;}
function* qsL(m,lo,hi){if(lo>=hi){if(lo===hi)m.fin(lo);return;}const p=yield* partL(m,lo,hi);m.fin(p);yield* qsL(m,lo,p-1);yield* qsL(m,p+1,hi);}
function* qsH(m,lo,hi){
  if(lo>=hi){if(lo===hi)m.fin(lo);return;}
  const a=m.a,p=a[(lo+hi)>>1];let i=lo-1,j=hi+1;
  for(;;){
    do{i++;}while(yield* m.ltv(a[i],p,i,-1));
    do{j--;}while(yield* m.ltv(p,a[j],j,-1));
    if(i>=j)break;
    yield* m.swap(i,j);
  }
  yield* qsH(m,lo,j);yield* qsH(m,j+1,hi);
}
function* introRec(m,lo,hi,d){
  while(hi-lo+1>16){
    if(d===0){yield* heapRange(m,lo,hi-lo+1);return;}
    d--;const p=yield* partL(m,lo,hi);m.fin(p);yield* introRec(m,lo,p-1,d);lo=p+1;
  }
  yield* insRange(m,lo,hi+1);
}
function* flip(m,k){for(let i=0,j=k;i<j;i++,j--)yield* m.swap(i,j);}
function* stooge(m,i,j){if(yield* m.lt(j,i))yield* m.swap(i,j);if(j-i+1>2){const t=Math.floor((j-i+1)/3);yield* stooge(m,i,j-t);yield* stooge(m,i+t,j);yield* stooge(m,i,j-t);}}
function* bce(m,i,j,dir){const g=dir?(yield* m.lt(j,i)):(yield* m.lt(i,j));if(g)yield* m.swap(i,j);}
function* bmerge(m,lo,n,dir){if(n>1){let k=1;while(k<n)k<<=1;k>>=1;for(let i=lo;i<lo+n-k;i++)yield* bce(m,i,i+k,dir);yield* bmerge(m,lo,k,dir);yield* bmerge(m,lo+k,n-k,dir);}}
function* bsort(m,lo,n,dir){if(n>1){const k=n>>1;yield* bsort(m,lo,k,!dir);yield* bsort(m,lo+k,n-k,dir);yield* bmerge(m,lo,n,dir);}}
function* msort(m,lo,hi){if(hi-lo<2)return;const mid=(lo+hi)>>1;yield* msort(m,lo,mid);yield* msort(m,mid,hi);yield* mergeRange(m,lo,mid,hi);}

/* ====================== アルゴリズム一覧 ====================== */
const ALGS=[];
const def=o=>ALGS.push(o);
def({id:'bubble',name:'バブルソート',cap:512,auto:64,avg:'O(n²)',worst:'O(n²)',stable:true,mem:'O(1)',
 desc:'となりどうしを比べて、大きいほうを右へ送るのをくり返します。大きい数が泡のように右はしへ浮かんでいくので「バブル」。かんたんですが、とても遅いです。',
 fn:function*(m){const n=m.n;for(let e=n;e>1;e--){let sw=false;for(let i=1;i<e;i++){if(yield* m.lt(i,i-1)){yield* m.swap(i,i-1);sw=true;}}m.fin(e-1);if(!sw){m.finRange(0,e);break;}}}});
def({id:'cocktail',name:'カクテルシェーカーソート',cap:512,auto:64,avg:'O(n²)',worst:'O(n²)',stable:true,mem:'O(1)',
 desc:'バブルソートを右向き、左向きと交互にくり返します。シェーカーをふるように往復するので、小さい数も左へ早く届きます。',
 fn:function*(m){let lo=0,hi=m.n-1,sw=true;while(sw&&lo<hi){sw=false;for(let i=lo;i<hi;i++)if(yield* m.lt(i+1,i)){yield* m.swap(i,i+1);sw=true;}m.fin(hi);hi--;if(!sw)break;sw=false;for(let i=hi;i>lo;i--)if(yield* m.lt(i,i-1)){yield* m.swap(i,i-1);sw=true;}m.fin(lo);lo++;}}});
def({id:'selection',name:'選択ソート',cap:512,auto:64,avg:'O(n²)',worst:'O(n²)',stable:false,mem:'O(1)',
 desc:'残りの中から一番小さい数をさがして、左はしの数と入れかえます。交換の回数はとても少ないですが、さがすのに毎回ぜんぶ見るので比較は多いです。',
 fn:function*(m){const n=m.n;for(let i=0;i<n-1;i++){let mi=i;for(let j=i+1;j<n;j++)if(yield* m.lt(j,mi))mi=j;if(mi!==i)yield* m.swap(i,mi);m.fin(i);}}});
def({id:'insertion',name:'挿入ソート',cap:512,auto:96,avg:'O(n²)',worst:'O(n²)',stable:true,mem:'O(1)',
 desc:'トランプを手札にならべるように、1枚ずつ取って、すでに並んだ部分のちょうどよい場所に差しこみます。ほとんど整列ずみのデータではとても速いです。',
 fn:function*(m){yield* insRange(m,0,m.n);}});
def({id:'binsert',name:'二分挿入ソート',cap:512,auto:96,avg:'O(n²)',worst:'O(n²)',stable:true,mem:'O(1)',
 desc:'挿入ソートの「場所さがし」を二分探索にしたものです。比較の回数は減りますが、ずらす作業（書き込み）の数は変わりません。',
 fn:function*(m){const a=m.a,n=m.n;for(let i=1;i<n;i++){const key=a[i];let lo=0,hi=i;while(lo<hi){const mid=(lo+hi)>>1;if(yield* m.ltv(key,a[mid],mid,-1))hi=mid;else lo=mid+1;}for(let j=i;j>lo;j--)yield* m.set(j,a[j-1]);if(lo!==i)yield* m.set(lo,key);}}});
def({id:'shell',name:'シェルソート',cap:1024,auto:256,avg:'O(n^1.3) くらい',worst:'O(n²)',stable:false,mem:'O(1)',
 desc:'はなれた場所どうしで挿入ソートをして、少しずつ間かくをせばめていきます。大づかみに整えてから仕上げるので、挿入ソートよりずっと速くなります。',
 fn:function*(m){const a=m.a,n=m.n;for(const g of [701,301,132,57,23,10,4,1]){if(g>=n)continue;for(let i=g;i<n;i++){const key=a[i];let j=i;while(j>=g&&(yield* m.ltv(key,a[j-g],j-g,-1))){yield* m.set(j,a[j-g]);j-=g;}if(j!==i)yield* m.set(j,key);}}}});
def({id:'comb',name:'コムソート',cap:1024,auto:256,avg:'O(n²/2ᵖ)',worst:'O(n²)',stable:false,mem:'O(1)',
 desc:'バブルソートを、はなれた場所どうしの比べあいから始めて、間かくを1.3分の1ずつちぢめます。「くし」でとかすように整うので、コムソートです。',
 fn:function*(m){const n=m.n;let gap=n,done=false;while(!done){gap=Math.floor(gap/1.3);if(gap<=1){gap=1;done=true;}for(let i=0;i+gap<n;i++)if(yield* m.lt(i+gap,i)){yield* m.swap(i,i+gap);done=false;}}}});
def({id:'gnome',name:'ノームソート',cap:512,auto:48,avg:'O(n²)',worst:'O(n²)',stable:true,mem:'O(1)',
 desc:'庭の小人（ノーム）が植木ばちを並べる方法です。となりと順番がちがったら入れかえて一歩もどり、正しければ一歩すすむだけ。',
 fn:function*(m){const n=m.n;let i=0;while(i<n){if(i===0||!(yield* m.lt(i,i-1)))i++;else{yield* m.swap(i,i-1);i--;}}}});

                if a[j] < pivot:
                    a[i], a[j] = a[j], a[i]
                    i += 1

cycle:`def cycle_sort(a):
    n = len(a)
    for start in range(n - 1):
        item = a[start]
        pos = start + sum(1 for i in range(start + 1, n) if a[i] < item)
        if pos == start:                 # もう正しい場所
            continue
        while item == a[pos]:
            pos += 1
        a[pos], item = item, a[pos]
        while pos != start:              # 輪をぐるっと回す
            pos = start + sum(1 for i in range(start + 1, n) if a[i] < item)
            while item == a[pos]:
                pos += 1
            a[pos], item = item, a[pos]
    return a`,
pancake:`def pancake_sort(a):
    def flip(k):                         # 先頭k+1枚をひっくり返す
        a[:k + 1] = a[:k + 1][::-1]
    for size in range(len(a), 1, -1):
        m = a.index(max(a[:size]))       # 一番大きい場所
        if m != size - 1:
            flip(m)                      # 上へ
            flip(size - 1)               # 底へ
    return a`,
stooge:`def stooge_sort(a, i=0, j=None):
    if j is None:
        j = len(a) - 1
    if j < 0:
        return a
    if a[i] > a[j]:
        a[i], a[j] = a[j], a[i]
    if j - i + 1 > 2:
        t = (j - i + 1) // 3
        stooge_sort(a, i, j - t)         # 前の2/3
        stooge_sort(a, i + t, j)         # 後ろの2/3
        stooge_sort(a, i, j - t)         # もう一度前の2/3
    return a`,

def bogo_sort(a):
    # 小さい配列だけ！ 大きいと終わりません
    while any(a[i] > a[i + 1] for i in range(len(a) - 1)):
        random.shuffle(a)                # でたらめに混ぜる
    return a`,
sleep:`def sleep_sort(a):
    # ネタ: 本物は「値に比例して眠ってから出力」するだけ。
    # time.sleep を使うと本当に待つので、ここでは
    # 「起きる順番」を時刻ごとの表で再現しています。
    wake = {}
    for v in a:
        wake.setdefault(v, []).append(v)  # 眠る時間 = 値
    out = []
    for t in sorted(wake):               # 時間がたつ順に
        out += wake[t]                   # 目をさました順に並ぶ
    a[:] = out
    return a`

  let allSwept=views.length>0;
  views.forEach(m=>{
    if(m.done&&m.sw<m.n+1){m.sw+=m.n*dt/0.9+0.01;if(S.snd&&AC&&m.ui===views[0].ui&&Math.floor(m.sw)%2===0)blip(Math.min(1,m.sw/m.n));}
    if(!(m.done&&m.sw>=m.n+1))allSwept=false;
    draw(m);
  });
  views.forEach(updCode);updStats();updPlay();
  if(S.auto&&allSwept){S.autoWait+=dt;if(S.autoWait>1.0){autoNext();}}
  requestAnimationFrame(frame);
}

/* ---- オート ---- */
const AUTO_INITS=['random','random','nearly','reversed','few','mountain'];
function autoNext(){
  S.autoWait=0;const al=ALGS[S.autoIdx%ALGS.length];
  S.compare=false;S.alg=al.id;
  S.nIdx=SIZES.reduce((b,x,i)=>x<=al.auto?i:b,0);
  S.init=AUTO_INITS[S.autoRound%AUTO_INITS.length];
  S.mode=MODES[S.autoRound%MODES.length];
  S.seed=S.autoRound+11;
  S.autoIdx++;S.autoRound++;
  const n=Math.min(al.auto,al.cap);
  const dry=runSync(al.id,n,S.seed,{init:S.init});
  const dur=al.id==='sleep'?7:9;
  S.rate=Math.max(3,Math.min(60000,dry.steps/dur));
  let sp=0;for(let i=0;i<SPEEDS.length;i++)if(SPEEDS[i]<=S.rate)sp=i;S.spd=sp;
  rebuild(true);
  $('note').textContent='🤖 オート再生中：'+(((S.autoIdx-1)%ALGS.length)+1)+' / '+ALGS.length+'　'+INIT_LABEL[S.init];
}
function setAuto(on){
  on=!!on;if(on===S.auto)return;S.auto=on;
  if(on){S.autoWait=0;S.autoIdx=Math.max(0,ALGS.findIndex(a=>a.id===S.alg));S.autoIdx=S.autoIdx<0?0:S.autoIdx;autoNext();}
  else{S.spd=Math.max(0,Math.min(10,S.spd));S.rate=SPEEDS[S.spd];buildNote();}
  syncUI();
}
function buildNote(){const cap=maxCap();$('note').textContent=(cap<SIZES[S.nIdx]?'このアルゴリズムは重いので最大'+cap+'こに制限しています。':'')+(views.length>1?'同じ並びで同時スタート。早く終わった順に順位がつきます。':'');}
function human(){if(S.auto){S.rate=SPEEDS[S.spd];setAuto(false);}}

/* ---- イベント ---- */
ALGS.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name+(a.tag?'（ネタ）':'');$('algSel').appendChild(o);});
(function(){const box=$('slots');for(let i=0;i<4;i++){const s=document.createElement('select');s.setAttribute('aria-label','くらべる'+(i+1));
  if(i>=2){const o=document.createElement('option');o.value='';o.textContent='— なし —';s.appendChild(o);}
  ALGS.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.name;s.appendChild(o);});
  s.addEventListener('change',()=>{human();S.slots[i]=s.value;if(algsInView().length<2){S.slots[i]=i===0?'quick':'merge';}rebuild(true);});box.appendChild(s);}})();
$('algSel').addEventListener('change',e=>{human();S.alg=e.target.value;S.slots[0]=S.alg;rebuild(true);});
$('cmpBtn').addEventListener('click',()=>{human();S.compare=!S.compare;if(S.compare){S.slots[0]=S.alg;const ids=S.slots.filter(Boolean);['quick','merge','bubble','heap'].forEach(x=>{if(S.slots.filter(Boolean).length<3&&!S.slots.includes(x)){const k=S.slots.findIndex((v,i)=>i>0&&!v);if(k>0)S.slots[k]=x;}});}rebuild(true);});
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{human();S.mode=b.dataset.m;syncUI();}));
document.querySelectorAll('#initSeg button').forEach(b=>b.addEventListener('click',()=>{human();S.init=b.dataset.i;rebuild(true);}));
$('nRange').addEventListener('input',e=>{human();S.nIdx=+e.target.value;rebuild(true);});
$('spRange').addEventListener('input',e=>{human();S.spd=+e.target.value;S.rate=SPEEDS[S.spd];syncUI();});
$('playBtn').addEventListener('click',()=>{human();audio();if(views.every(v=>v.done)){rebuild(true);}else S.playing=!S.playing;syncUI();});
$('stepBtn').addEventListener('click',()=>{human();audio();S.playing=false;if(views.every(v=>v.done))rebuild(false);runSteps(1);syncUI();});
$('resetBtn').addEventListener('click',()=>{human();rebuild(true);});
$('newBtn').addEventListener('click',()=>{human();S.seed++;rebuild(true);});
$('autoBtn').addEventListener('click',()=>{audio();setAuto(!S.auto);});
$('sndBtn').addEventListener('click',()=>{human();S.snd=!S.snd;try{localStorage.setItem('sort.snd',S.snd?'1':'0');}catch(_){}if(S.snd)audio();syncUI();});
addEventListener('pointerdown',()=>{if(S.snd)audio();},{passive:true});
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target&&e.target.tagName;
  if(e.key==='o'||e.key==='O'){if(t==='SELECT')return;audio();setAuto(!S.auto);e.preventDefault();return;}
  if(e.key==='Tab'||e.key==='Shift')return;
  if(t==='SELECT'||t==='INPUT')return;
  if(e.key===' '){e.preventDefault();$('playBtn').click();}
  else if(e.key==='ArrowRight'){e.preventDefault();$('stepBtn').click();}
});

/* ---- テストフック ---- */
window.__sort={
  list:()=>ALGS.map(a=>({id:a.id,name:a.name,cap:a.cap,stable:a.stable})),
  run:(name,n,seed,opts)=>runSync(name,n,seed,opts),
  state:()=>{const m=views[0];return{alg:S.alg,algs:views.map(v=>v.al.id),a:Array.from(m.a),n:m.n,cmp:m.cmp,swp:m.swp,wr:m.wr,steps:m.steps,done:m.done,allDone:views.every(v=>v.done),
    auto:S.auto,compare:S.compare,mode:S.mode,init:S.init,playing:S.playing,rate:S.rate,snd:S.snd,views:views.map(v=>({alg:v.al.id,steps:v.steps,done:v.done,finStep:v.finStep}))};},
  setAuto:b=>{setAuto(b);return S.auto;},
  step:k=>{runSteps(Math.max(1,k|0));views.forEach(draw);updStats();return window.__sort.state();},
  setSpeed:l=>{S.spd=Math.max(0,Math.min(10,l|0));S.rate=SPEEDS[S.spd];syncUI();},
  select:(id,n,init)=>{S.compare=false;S.alg=id;S.slots[0]=id;if(n){S.nIdx=SIZES.reduce((b,x,i)=>x<=n?i:b,0);}if(init)S.init=init;rebuild(true);},
  setMode:m=>{S.mode=m;syncUI();},
  compare:ids=>{S.compare=true;S.slots=ids.concat(['','','','']).slice(0,4);S.alg=ids[0];rebuild(true);},
  pause:()=>{S.playing=false;syncUI();}
};
rebuild(true);S.rate=SPEEDS[S.spd];syncUI();
requestAnimationFrame(frame);
})();
</script>
<!-- zoom guard: ピンチ・ダブルタップでズームしない -->
<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
