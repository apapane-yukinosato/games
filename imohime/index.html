<style>
html,body{touch-action:manipulation}
:root{ --bg:#2b1d33; --ink:#fff6e8; --mute:#c9b3c9; --card:#42304a; --card2:#53395c; --gold:#ffcf5a; --pink:#ff8ab4; --green:#69c978; --red:#ee5a48; --imo:#9a4a8a; color-scheme:dark; }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;max-width:1280px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px;position:relative}
#top{display:flex;align-items:center;gap:6px}

#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.mini[aria-pressed=true]{background:#d4458a;color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#stage{position:relative;flex:0 0 46%;min-height:0;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 #130b18;background:#1a1220}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:6px;right:6px;top:5px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}

#tabs{position:absolute;left:6px;bottom:6px;display:flex;gap:4px}

#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#info{background:var(--card);border-radius:12px;padding:6px 8px;font-size:12px;line-height:1.45}
#info .row{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
#info .row.sp{justify-content:space-between}
#info b{color:var(--gold)}
.g{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.g i{display:inline-block;width:34px;height:7px;border-radius:4px;background:#2a1b30;overflow:hidden;vertical-align:middle}
.g i u{display:block;height:100%;background:var(--green);text-decoration:none}
.g.bad i u{background:var(--red)}
.ap{letter-spacing:1px;color:var(--gold);font-size:14px}
#tasks{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start;grid-auto-rows:max-content;padding:1px;-webkit-overflow-scrolling:touch}
.tk{display:block;height:auto;font:inherit;text-align:left;border:0;border-radius:11px;padding:6px 8px;background:var(--card2);color:var(--ink);box-shadow:0 3px 0 #1d1224;cursor:pointer;min-height:48px}
.tk b{display:flex;justify-content:space-between;gap:4px;font-size:13px}
.tk b em{font-style:normal;color:var(--gold);font-size:11px;white-space:nowrap}
.tk small{display:block;font-size:10.5px;color:var(--mute);line-height:1.3;margin-top:1px}
.tk:disabled{opacity:.45;box-shadow:none;cursor:default}
.tk.hot{outline:2px solid var(--pink)}
#bar{display:flex;gap:6px}
.big{flex:1;font:inherit;font-size:14px;font-weight:800;border:0;border-radius:13px;padding:10px 6px;min-height:46px;background:#d4458a;color:#fff;box-shadow:0 3px 0 #6d1d46;cursor:pointer}
.big.alt{background:#5b4066;box-shadow:0 3px 0 #1d1224}
.big.gold{background:var(--gold);color:#3a2300;box-shadow:0 3px 0 #8a5a00}
.big:disabled{opacity:.5}
body[data-mode=action] #panel,body[data-mode=title] #panel,body[data-mode=title] #hud,body[data-mode=title] #tabs{display:none}
body[data-mode=action] #stage,body[data-mode=title] #stage{flex:1}
body[data-mode=action] #tabs,body[data-mode=action] #hud{display:none}
#tc{position:absolute;inset:0;pointer-events:none;display:none}
body[data-mode=action] #tc{display:block}
@media (hover:hover) and (pointer:fine){ #tc{opacity:.35} }
#tc button{position:absolute;pointer-events:auto;border:0;border-radius:50%;font:inherit;font-weight:800;color:#fff;background:rgba(40,20,50,.55);border:2px solid rgba(255,255,255,.4);touch-action:none;-webkit-user-select:none;width:58px;height:58px;font-size:12px;padding:0}
#tc button.on{background:rgba(255,140,190,.75)}
#bL{left:8px;bottom:14px;width:64px!important;height:64px!important;font-size:26px!important}
#bR{left:80px;bottom:14px;width:64px!important;height:64px!important;font-size:26px!important}
#bJ{right:78px;bottom:12px}
#bA{right:8px;bottom:42px;width:64px!important;height:64px!important;font-size:14px!important;background:rgba(214,70,110,.65)!important}
#bW{right:8px;bottom:112px;background:rgba(80,160,90,.65)!important}
#bX{right:8px;top:8px;width:auto!important;height:auto!important;border-radius:999px!important;padding:5px 10px!important;font-size:11px!important;pointer-events:auto}
#dlg{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(24,12,30,.92);border:2px solid var(--pink);border-radius:14px;padding:8px 12px 10px;font-size:14px;line-height:1.55;cursor:pointer;z-index:5;min-height:64px}
#dlg .nm{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:2px}
#dlg .nx{position:absolute;right:10px;bottom:4px;color:var(--pink);font-size:12px}
#modal{position:absolute;inset:0;background:rgba(14,6,20,.78);z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}
#modal .box{background:var(--card);border-radius:16px;padding:14px;max-width:560px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 6px 0 #130b18;-webkit-overflow-scrolling:touch}
#modal h2{margin:0 0 6px;font-size:18px;color:var(--gold)}
#modal p{margin:4px 0;font-size:13.5px;line-height:1.55}
#modal .src{font-size:11px;color:var(--mute)}
#modal .opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
#modal .opts.row{flex-direction:row;flex-wrap:wrap}
#modal .opts.row .tk{flex:1 1 30%}
#modal table{width:100%;border-collapse:collapse;font-size:13px}
#modal td,#modal th{padding:3px 4px;border-bottom:1px solid #5d4668;text-align:left}
#modal td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bk{padding:6px 8px;border-radius:9px;background:var(--card2);margin:5px 0}
.bk.lock{opacity:.5}
.bk h3{margin:0 0 2px;font-size:13px;color:var(--gold)}
.bk p{margin:0;font-size:12px}
input[type=range]{width:100%;accent-color:#ff8ab4}
.sl{margin:8px 0;font-size:13px}
.sl b{color:var(--gold)}
#title{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:linear-gradient(#3b2150,#6b2f5a 55%,#c0605a);border-radius:14px}
#title h2{margin:0;font-size:34px;letter-spacing:2px;text-shadow:0 3px 0 #2a1030,0 0 16px #ff8ab4}
#title p{margin:0;font-size:13px;color:#ffe6f0;max-width:420px;line-height:1.6}
#title canvas{width:min(280px,70%);height:auto;max-height:36%}
#title .btns{display:flex;flex-direction:column;gap:8px;width:min(280px,90%)}
#title .best{font-size:11.5px;color:#ffd9e8}
@media (min-width:900px){
  #main{flex-direction:row}
  body[data-mode=morning] #stage,body[data-mode=night] #stage{flex:1 1 60%}
  body[data-mode=morning] #panel,body[data-mode=night] #panel{flex:0 0 400px}
  #top h1{font-size:17px}
}

<body data-mode="title">
<div id="app">
  <div id="top">

<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const tz=(T,lo,hi,w)=>clamp(1-Math.max(lo-T,T-hi,0)/w,0,1);   // trapezoid score
const fx=(v,n=0)=>(+v).toFixed(n);
const pct=v=>Math.round(clamp(v,0,1)*100);
function R(G){ let a=(G.rs=(G.rs+0x6D2B79F5)|0); let t=Math.imul(a^a>>>15,1|a); t=(t+Math.imul(t^t>>>7,61|t))^t; return ((t^t>>>14)>>>0)/4294967296; }
function mkRng(seed){ let a=seed|0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^a>>>15,1|a); t=(t+Math.imul(t^t>>>7,61|t))^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(_){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
};

/* ---------- audio ---------- */
let AC=null, muted=store.get('imohime.mute',false);
function unlock(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='square',vol=.06,slide=0,delay=0){
  if(muted||!AC||W_sim) return;
  try{ const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(_){}
}
function noise(d,vol=.05,hp=800,delay=0){
  if(muted||!AC||W_sim) return;
  try{ const t=AC.currentTime+delay, n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), c=b.getChannelData(0);
    for(let i=0;i<n;i++) c[i]=(Math.random()*2-1)*(1-i/n);
    const s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    s.buffer=b; g.gain.value=vol; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
  }catch(_){}
}
let W_sim=false;
const SFX={
  ok(){ tone(660,.08,'triangle',.07); tone(990,.1,'triangle',.06,0,.07); },
  tap(){ tone(520,.05,'triangle',.05); },
  dig(){ noise(.12,.06,300); tone(110,.1,'sine',.08,-40); },
  water(){ noise(.3,.04,2000); },
  hit(){ noise(.08,.07,600); tone(180,.08,'square',.06,-80); },
  slash(){ noise(.07,.04,2500); },
  hurt(){ tone(220,.2,'sawtooth',.08,-140); },
  whip(){ tone(900,.1,'sawtooth',.04,-500); },
  zip(){ tone(400,.18,'triangle',.05,600); },
  jump(){ tone(300,.12,'square',.04,260); },
  coin(){ tone(1200,.06,'square',.04); tone(1600,.1,'square',.04,0,.05); },
  kill(){ tone(300,.12,'square',.06,-200); noise(.1,.05,1200); },
  boss(){ tone(80,.5,'sawtooth',.1,-30); noise(.4,.08,200); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.08,0,i*.12)); },
  bad(){ tone(200,.25,'sawtooth',.07,-100); }
};
const sfx=n=>{ try{ SFX[n]&&SFX[n](); }catch(_){} };

/* ---------- data ---------- */
const MONTH=['','','','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const PART=['上旬','中旬','下旬'];
const junName=j=>MONTH[3+Math.floor(j/3)]+PART[j%3];
const VAR=[
 {id:'azuma',n:'紅あずま',d:'ホクホク。作りやすい',y:1.00,b0:26,b1:31,rp:.8,ts:.8,nem:1.0,heat:0,root:.05,sand:0,col:'#a8343c'},
 {id:'haruka',n:'紅はるか',d:'熟成で甘くなる。収穫直後は粉質',y:1.00,b0:19,b1:38,rp:1.0,ts:1.0,nem:.8,heat:0,root:0,sand:0,col:'#b24a58'},
 {id:'silk',n:'シルクスイート',d:'なめらか。肥料に敏感',y:.95,b0:24,b1:34,rp:.9,ts:1.15,nem:.9,heat:0,root:0,sand:0,col:'#c1807e'},
 {id:'annou',n:'安納芋',d:'ねっとり高糖度。暑さを好む',y:.85,b0:29,b1:42,rp:.9,ts:.9,nem:.8,heat:1,root:-.02,sand:0,col:'#d9a75a'},
 {id:'naruto',n:'鳴門金時',d:'砂地向き。水はけがよいと◎',y:1.0,b0:24,b1:33,rp:.9,ts:1.0,nem:.7,heat:0,root:0,sand:1,col:'#d4623a'}
];
const VAR_UNLOCK=[[0],[1,2],[3,4]];     // 年のはじめに商人から解放
const METH={
 h:{n:'水平植え',d:'浅い位置(2〜3cm)に5節ほどを水平に。イモの数が多く形がそろう。乾燥しやすく活着しにくい。',root:.80,cnt:1.25,size:.92,shape:.13,dr:1.0},
 o:{n:'斜め植え',d:'中くらいの性質。バランスがよい。',root:.88,cnt:1.0,size:1.0,shape:.05,dr:.6},
 b:{n:'船底植え',d:'水平植えと斜め植えの中間。',root:.85,cnt:1.1,size:.96,shape:.09,dr:.8},
 v:{n:'垂直植え',d:'イモの数は少ないが大きくなる。乾燥に強い。',root:.90,cnt:.8,size:1.15,shape:-.03,dr:.2}
};
const STAGES=[
 {id:1,n:'竹林',sub:'ヨトウの子鬼・コガネ甲鬼',col:'#5aa86a'},
 {id:2,n:'湿地',sub:'センチュウ蛇・黒斑の怨霊',col:'#4f8a8c'},
 {id:3,n:'洞窟',sub:'天井の芋づるでぶら下がれ',col:'#6a5a8a'},
 {id:4,n:'火山の斜面',sub:'狸の芋泥棒・溶岩',col:'#c8603a'},
 {id:5,n:'霜の峰',sub:'ボス：霜枯れの大妖・クサレガミ',col:'#8ab6e8'}
];
const BOOK=[
 {id:'story',t:'島のならい',x:'ヒノモト芋島では、芋を育てて食べる者が強くなる。畑でできた芋の量・糖度・品質が、そのままイモ姫の力になる。',s:'ゲームの説明',open:1},
 {id:'onsen',t:'種いもの温湯処理',x:'黒斑病の対策。種いもは47〜48℃の湯に40分、苗は同じ温度で15分つける。高すぎると種いもが傷み、低すぎると効果がない。',s:'愛知県 防除資料'},
 {id:'fuse',t:'伏せ込み（育苗）',x:'3月に温床へ種いもを伏せる。伏せ込み直後から芽が出るまでの床温は28〜33℃。萌芽後は昼25〜30℃、夜15℃くらい。',s:'鹿児島県 資料'},
 {id:'bedcold',t:'床温が低いと',x:'床温が低いと種いもが腐りやすい。温度は毎旬、わら・米ぬかの追加（発酵熱）、換気、ビニールの開け閉めで管理する。',s:'鹿児島県 資料'},
 {id:'cut',t:'採苗',x:'5月ごろ、伸びたつるを切って苗にする。苗の質（節の数・太さ）が、活着と収量に影響する。',s:'各県の栽培資料より（要約）'},
 {id:'plow',t:'畑づくり：耕す・堆肥',x:'深く耕すと土の通気がよくなる。堆肥を入れると土がふかふかになる。',s:'各県の栽培資料より（要約）'},
 {id:'tsuru',t:'つるぼけ',x:'つるばかり茂ってイモが太らない状態。原因は、窒素肥料の多すぎ、土の水分の多すぎ、土の通気の悪さ。',s:'旭川市 資料'},
 {id:'kali',t:'カリ肥料',x:'カリはイモの肥大を助ける。窒素は控えめに、カリは多めに。木や草を燃やした灰にもカリが含まれる。',s:'各県の栽培資料より（要約）'},
 {id:'ridge',t:'畝立て',x:'畝幅の目安は90〜100cm、株間は35〜40cm。高い畝は水はけがよく、地温も上がりやすい。',s:'ヤンマー 資料'},
 {id:'mulch',t:'マルチと植え付け適期',x:'平均気温が20℃前後になったころが植え付けの適期。マルチで地温を上げてから植える。雑草も抑えられる。',s:'ヤンマー 資料'},
 {id:'plant',t:'植え方の4種類',x:'水平植え：浅い位置（2〜3cm）に5節ほどを水平に植える。イモの数が多く形がそろうが、乾燥しやすく活着しにくい。／ 斜め植え：中くらい。／ 船底植え：水平と斜めの中間。／ 垂直植え：イモの数は少ないが大きくなる。乾燥に強い。',s:'佐賀県 資料'},

/* ---------- weather ---------- */
const CLIM=[10.5,15.5,19.5,22.8,27,28.3,24.5,18.5,12.5,7.5];
function climT(i){ const x=(i+.5)/3-.5, k=Math.floor(x); const a=CLIM[clamp(k,0,8)], b=CLIM[clamp(k+1,1,9)]; return a+(b-a)*(x-clamp(k,0,8)); }
const RAIN=[60,80,90,120,150,130,100,50,45,50,70,95,75,50,55,60,60,70,95,100,80,60,50,45,40,40,35,35,35,30];
function genWeather(G){
  const r=mkRng(G.seed*7919+G.year*104729), out=[];
  const droughtYear=r()<.55, ff=[25,26,26,27][Math.floor(r()*4)];
  const typh=new Set(); if(r()<.9) typh.add(16+Math.floor(r()*6)); if(r()<.3) typh.add(18+Math.floor(r()*4));
  const warm=(r()-.5)*1.6;
  for(let i=0;i<30;i++){
    let temp=climT(i)+warm+(r()-.5)*2.6, rain=RAIN[i]*(.45+r()*1.2), dr=false, ty=false;
    if(droughtYear&&i>=14&&i<=19){ rain*=.2; temp+=1.5; dr=true; }
    if(typh.has(i)){ ty=true; rain+=130+r()*60; }
    const fr=i>=ff;
    if(fr) temp=Math.min(temp,6.5);
    const sun=clamp(1.05-rain/170+(r()-.5)*.2,.08,1);
    let lb=ty?'台風':fr?'霜':dr?'干ばつ':rain>=120?'大雨・長雨':rain>=75?'雨がち':rain<30?'好天つづき':sun>.55?'晴れがち':'くもり';
    if(i>=9&&i<=14&&rain>=90&&!ty) lb='梅雨';
    out.push({temp,rain,sun,typhoon:ty,frost:fr,drought:dr,label:lb});
  }
  const rr=mkRng(G.seed*31+G.year*977);
  out.forEach((w,i)=>{
    const wrong=rr()<.22; const fr=wrong?w.rain*(rr()<.5?.45:1.7):w.rain;
    w.fc={temp:w.temp+(rr()-.5)*1.2,rain:fr,label:(w.typhoon&&rr()<.85)?'台風':w.frost?'霜':fr>=120?'大雨・長雨':fr>=75?'雨がち':fr<30?'好天つづき':w.sun>.55?'晴れがち':'くもり'};
  });
  G.ff=ff;
  return out;
}

/* ---------- 温床 ---------- */
function bedTemp(w,o){
  return w.temp+(o.vinyl==='closed'?6+5*w.sun:1)+o.heat*.9-(o.vent?5:0)-(w.rain>90?1:0);
}
function updateBed(w){
  const b=G.bed; if(!b.on||b.cut){ if(b.on) b.heat*=.72; return; }
  const T=bedTemp(w,b); b.T=T;
  if(b.sprout<1){
    const s=(T>=28&&T<=33)?.55:((T>=25&&T<28)||(T>33&&T<=35))?.36:(T>=20&&T<25)?.15:T>35?.05:.03;
    b.sprout=Math.min(1,b.sprout+s*(1-b.dmgT*.7));
    if(T<20) b.rot+=(20-T)*.012*(1+b.dis*1.2);
    if(T>35) b.rot+=(T-35)*.03;
    b.rot+=b.dis*.012+b.dmgT*.05;
  }else{
    b.sLen=Math.min(1.4,b.sLen+.28*tz(T,25,30,8));
    b.sThick=clamp(b.sThick+((T>=24&&T<=30&&w.sun>.3)?.12:T>32?-.1:0)+(b.vent?.04:0),0,1);
    if(T>32) b.leggy=Math.min(1,b.leggy+.12);
    if(T<18) b.rot+=(18-T)*.004;
    b.rot+=b.dis*.004;
  }
  b.rot=clamp(b.rot,0,1);
  b.heat*=.72; b.vent=false;
}
/* ---------- 土 ---------- */
function updateSoil(w){
  const f=G.f, live=f.planted>=0&&!f.harvested, canopy=live?clamp(f.vine*.8,0,1):0;
  f.soilT+=(w.temp+(f.mulch?2.5:0)+f.ridgeH*1.0-(canopy>.5?1.5:0)-f.soilT)*.6;
  const et=(.013*w.temp+.06)*(.75+.5*w.sun)*(f.mulch?.7:1)*(.7+.7*canopy);
  f.moist+=w.rain/210-et;
  if(f.moist>.85) f.moist=.85+(f.moist-.85)*(1-clamp(.25+.5*f.ridgeH+.3*f.aer,0,.9));
  f.moist=clamp(f.moist,.04,1);
  f.weed=Math.min(1,f.weed+.11*tz(w.temp,18,30,14)*(.5+f.moist)*(f.mulch?.35:1)*(1-.5*canopy)*(f.planted<0&&G.jun<3?.3:1));
  const tg=.25+.4*f.depth+.25*f.comp+.1*f.ridgeH;
  f.aer=clamp(f.aer+(tg-f.aer)*.08-Math.max(0,w.rain-90)/1800,.05,1);
  f.N=Math.max(0,f.N*.99-Math.max(0,w.rain-100)/3000-(live?.008*f.vine:0));
  f.K=Math.max(0,f.K-(live?.004*f.vine:0));
  f.comp=Math.max(0,f.comp-.004);
  f.watered=false;
}
/* ---------- 作物 ---------- */
function tsuruOf(){
  const f=G.f, v=VAR[f.variety];
  return clamp((1.4*(f.N-.5)+.8*(f.moist-.72)+.8*(.45-f.aer)+.3*Math.max(0,f.vine-1.2)-.25*(f.K-.4))*v.ts,0,1);
}
function updateCrop(w){
  const f=G.f; if(f.planted<0||f.harvested) return;
  const v=VAR[f.variety], M=METH[f.method], age=G.jun-f.planted, P=PL(f);
  f.sumT+=w.temp; f.nT++;
  // 活着
  if(age<=1){
    if(w.sun>.65&&f.moist<.42&&!f.watered) f.stand-=.09*M.dr*(.5+w.sun);
    if(f.soilT<15) f.stand-=.05;
    f.stand=clamp(f.stand,.15,1);
  }
  // 虫・病気
  updatePests(w,age);
  // つる
  const nutr=.55+1.1*f.N, wf=f.moist<.25?.5:f.moist>.92?.8:1;
  f.vine=Math.min(1.9,f.vine+.27*tz(w.temp,23,31,10)*nutr*wf*f.stand*(age>=9?.45:1));
  if(age>=11||w.temp<15){ f.yellow=Math.min(1,f.yellow+.11+(w.temp<16?.08:0)); }
  if(f.yellow>.3) f.vine=Math.max(0,f.vine-f.yellow*.03);
  f.nodeRoot=clamp(f.nodeRoot+(f.vine>.5?.07+(f.moist>.6?.04:0):0),0,1);
  f.tsuru=tsuruOf();
  // 台風
  if(w.typhoon){ const g=f.typhGuard>0; f.vine*=g?.92:.68; f.leaf=Math.max(.05,f.leaf-(g?.04:.2)); f.crack+=g?0:.02; G.rep.push(g?'台風が来たが、備えのおかげで被害は小さかった':'台風でつるが吹きちぎられた！'); }
  // 乾燥
  if(f.moist<.2&&w.sun>.6){ f.leaf=Math.max(.05,f.leaf-.08); f.vine*=.96; }
  // 霜
  if(w.frost){ f.yellow=1; f.leaf=Math.min(f.leaf,.25); f.frostHit=Math.min(1,f.frostHit+(.55-.4*f.frostWard)); G.rep.push('霜がおりて、つるが黒く枯れた'); }
  // 割れ
  if(age>15) f.crack=Math.min(1,f.crack+.06*(age-15));
  if(age>=8&&f.moist>.8) f.crack=Math.min(1,f.crack+.02);
  // イモの数（着生）
  if(age>=1&&age<=3){
    const cf=tz(f.soilT,21,29,8)*(.6+.8*f.aer)*(1-.5*Math.max(0,f.N-.5))*(.8+.4*Math.min(1,f.P+.2));
    f.tN+=1.1*cf*M.cnt*(1+(f.depth-.5)*.2);
  }
  // 肥大
  if(age>=3){
    const LA=Math.min(1.3,f.vine)*f.leaf*(1-f.yellow*.8);
    const share=clamp(.85-1.0*f.tsuru-.2*Math.max(0,f.vine-1.2)-.3*f.nodeRoot,.08,.9);
    const kf=.7+.6*Math.min(1,f.K+.1), pf=.9+.2*Math.min(1,f.P);
    const wfac=f.moist<.3?.5+f.moist:f.moist>.9?.7:1;
    const tf=tz(f.soilT,v.heat?24:20,v.heat?32:30,10)*(v.heat&&w.temp<22?.7:1);
    const wc=Math.max(0,f.weed-.25)*(age<8?1:.6);
    const sp=(f.spacing<=32?.97:f.spacing>=44?.95:1)*(f.ridgeW<90?.95:f.ridgeW>105?.96:1);
    const sand=v.sand?(f.aer>.65?1.08:.96):1;
    const kus=1-.55*f.kus, nem=1-.12*f.nem*v.nem;
    f.tW+=P*f.stand*.135*tf*Math.min(1,LA)*(share/.8)*kf*pf*wfac*(1-.55*wc)*kus*nem*v.y*sp*sand*(f.avail);
  }
  f.typhGuard=Math.max(0,f.typhGuard-1);
}
function updatePests(w,age){
  const f=G.f, j=G.jun;
  // ハスモンヨトウ
  const lay=(j>=13&&j<=21&&w.temp>=22)?f.yBase*.9*(.5+.5*Math.min(1.4,w.temp/26)):0;
  const e0=f.egg,y0=f.young,b0=f.big;
  f.big=b0*.55+y0*.7; f.young=y0*.18+e0*.9; f.egg=e0*.08+lay;
  const loss=.35*f.young+.9*f.big+.05*f.egg;
  if(f.young>.06&&!f.seen.y){ f.seen.y=1; G.rep.push('白っぽい葉が目立つ…ハスモンヨトウの若い幼虫だ'); }
  f.leaf=clamp(f.leaf-loss+(loss<.01?.015:0),.05,1);
  // コガネ幼虫・ハリガネ・線虫
  if(w.temp>20) f.grub=Math.min(1,f.grub+.012*(1+f.comp*.5));
  let d=0; if(age>=5) d+=f.grub*.04;
  if(age>=3) d+=f.nem*.02*VAR[f.variety].nem;
  f.dmg=clamp(f.dmg+d,0,1);
  // 黒斑病・基腐病
  f.bs=clamp(f.bs+.003+(f.moist>.88?.012:0)+d*.4+f.bsSoil*.005,0,1);
  if(j>=10&&j<=24&&(w.rain>100||w.typhoon)){ const add=f.kusRisk*clamp(w.rain/200,.2,1)*.45; if(add>.01){ f.kus=clamp(f.kus+add,0,1); if(!f.seen.k){ f.seen.k=1; G.rep.push('株がしおれはじめた…基腐病かもしれない'); } } }
  if(f.kus>0) { f.leaf=Math.max(.05,f.leaf-f.kus*.04); f.kus=clamp(f.kus+(w.rain>80?.03*f.kus:0),0,1); }
}
/* ---------- 貯蔵 ---------- */
function brixOf(st,f){
  const v=VAR[f.variety], c=f.crop;
  const rc=clamp(st.ripe*v.rp,0,1), curve=rc*rc*(3-2*rc);
  let b=lerp(v.b0,v.b1,curve)*(.88+.12*c.mature)+2.2*(Math.min(1,f.K)-.4)-4*c.tsuru-3*c.frostHit-3*st.sprout+.6*st.cureQ;
  if(v.heat&&f.nT) b-=Math.max(0,24-f.sumT/f.nT)*.5;
  return clamp(b,8,48);
}
function updateStorage(w){
  const st=G.st; if(!st||st.kg<=0) return; const f=G.f, c=f.crop;
  if(st.curing){
    const q=clamp(1-Math.abs(st.cT-33)/6,0,1)*clamp(1-Math.abs(st.cH-92.5)/12,0,1);
    st.cureQ=q; st.curing=false; st.cured=true;
    if(st.cT>38) st.rot+=.06;
    st.T=st.cT; st.H=st.cH; st.T+=(w.temp+5-st.T)*.7; st.H+=(72-st.H)*.5; return;
  }
  st.T+=(w.temp+5-st.T)*.28; st.H+=(72-st.H)*.2; st.H=clamp(st.H,40,100);
  const T=st.T,H=st.H;
  let r=.004+(T<12.5?(12.5-T)*.025:0)+(T>17?(T-17)*.012:0)+(H<85?(85-H)*.0006:0)+(H>97?(H-97)*.004:0)
    +c.bs*.02+f.kus*.04+c.dmg*.03+c.frostHit*.04+(st.sorted?0:.02)+(c.crack*.03);
  r*=1-.6*st.cureQ;
  st.rot=clamp(st.rot+r*(1-st.rot),0,1);
  if(T>=17.5) st.sprout=Math.min(1,st.sprout+.18+(T-17.5)*.12);
  if(H<80) st.skin=Math.min(1,st.skin+(80-H)/110);
  st.ripe=Math.min(1.2,st.ripe+(1/6)*clamp(1-Math.abs(T-14.5)/12,.2,1));
  st.age++;
}

function advance(){
  const w=G.weather[G.jun];
  G.rep=[]; G.rep.push('天気は'+w.label+'（'+fx(w.temp,1)+'℃・雨'+Math.round(w.rain)+'mm）');
  updateSoil(w); updateBed(w); updateCrop(w); updateStorage(w);
  const f=G.f;
  if(f.harvested&&G.st){ const s=G.st; if(s.rot>.15&&!f.seen.rot){ f.seen.rot=1; G.rep.push('貯蔵庫から、いやな匂いがする…'); } if(s.sprout>.2&&!f.seen.spr){ f.seen.spr=1; G.rep.push('貯蔵庫の芋から芽が出ている！'); } }
  // 年内の出来事
  G.jun++; G.ap=6; G.exploredThisJun=false;
  if(G.jun<30&&G.view!=='cellar'&&G.st&&G.f.harvested) G.view='cellar';
  return G.rep;
}

function doHarvest(){
  const f=G.f, w=G.weather[G.jun], v=VAR[f.variety], M=METH[f.method], P=PL(f), age=ageNow();
  const N=P*f.stand*f.tN, avg=f.tW/Math.max(1,N)*1000;
  const mature=clamp((age-9)/3,0,1);
  const harvDmg=Math.max(0,f.moist-.55)*.25+(w.rain>90?.04:0);
  const dmgT=clamp(f.dmg+harvDmg,0,1);
  const sizeScore=1-clamp(Math.abs(avg-260)/260,0,1);
  const sp=f.spacing<=32?0:f.spacing>=44?.03:.06;
  const sand=v.sand&&f.aer>.65?.06:0;
  const A=clamp(.5+M.shape+sp+sand+.25*sizeScore-.9*dmgT-.45*f.bs-.2*f.tsuru-.8*f.crack-.5*f.frostHit-.15*f.nem*v.nem,.05,.95);
  const theft=clamp(f.tanuki*.5,0,.25);
  const kg=f.tW*(1-theft);
  f.harvested=true; f.harvJun=G.jun;
  f.crop={kg,A,dmg:dmgT,bs:f.bs,avg,n:N,mature,tsuru:f.tsuru,frostHit:f.frostHit,crack:f.crack,age,theft};
  G.st={kg,rot:0,T:w.temp+5,H:72,cureQ:0,sprout:0,skin:0,ripe:0,curing:false,cured:false,sorted:false,clean:clamp(1-dmgT*.9-f.bs*.3-f.crack*.2,.4,1),age:0};
  G.view='cellar';
  return '収穫！ '+fx(kg,0)+'kg（平均'+Math.round(avg)+'g）'+(theft>.03?' 狸に少し盗まれた…':'');
}
function taskCost(id,o){ return TASKS[id].cost(G,o); }

function doTask(id,o){
  const T=TASKS[id]; if(!T) return {ok:false,msg:'そんな作業はない'};
  if(!T.show()) return {ok:false,msg:'いまはできない'};
  const why=T.can?T.can(o):null; if(why) return {ok:false,msg:why};
  const c=T.cost(G,o); if(G.ap<c) return {ok:false,msg:'行動ポイントが足りない'};
  const msg=T.run(o)||''; G.ap-=c; unb(T.book); G.lastMsg=msg; return {ok:true,msg};
}
function nextJun(){ const rep=advance(); if(G.jun>=30) return {rep,end:true}; return {rep}; }
function onKill(type){
  const f=G.f; if(!f) return; G.kills[type]=(G.kills[type]||0)+1;
  if(type==='yotou'){ f.egg*=.96; f.young*=.96; f.yBase=Math.max(.03,f.yBase-.012); }
  else if(type==='kogane') f.grub=Math.max(0,f.grub-.03);
  else if(type==='snake') f.nem=Math.max(0,f.nem-.035);
  else if(type==='ghost'){ f.kusRisk=Math.max(0,f.kusRisk-.03); f.kus=Math.max(0,f.kus-.02); f.bs=Math.max(0,f.bs-.01); f.bsSoil=Math.max(0,f.bsSoil-.01); }
  else if(type==='tanuki') f.tanuki=Math.max(0,f.tanuki-.05);
  else if(type==='frost') f.frostWard=Math.min(1,f.frostWard+.12);
}

function yearResult(){
  const f=G.f, st=G.st, c=f.crop;
  if(!c||!st) return {kg:0,A:0,brix:0,kept:0,score:0,rank:'D',none:true,varName:'-'};
  const kept=st.kg*(1-st.rot);
  const brix=brixOf(st,f);
  const A=clamp(c.A-st.skin*.25-st.rot*.3-st.sprout*.12,.02,.95);
  const yS=clamp(c.kg/380,0,1.2), bS=clamp((brix-22)/16,0,1.2);
  const score=Math.min(100,Math.round(100*(.35*Math.min(1,yS)+.3*A/.9+.35*Math.min(1,bS)))); 
  const rank=score>=88?'S':score>=72?'A':score>=55?'B':score>=38?'C':'D';
  return {kg:c.kg,A,brix,kept:kept*(1-.25*st.sprout),score,rank,rot:st.rot,sprout:st.sprout,skin:st.skin,ripe:st.ripe,tsuru:c.tsuru,frostHit:c.frostHit,avg:c.avg,age:c.age,varName:VAR[f.variety].n,theft:c.theft,harvJun:f.harvJun,cureQ:st.cureQ,eaten:G.eaten};
}

  const dHP=Math.round(clamp(r.kg/10,0,42)), dATK=Math.max(0,Math.round((r.brix-20)/6)), dDEF=Math.round(r.A*14);
  s.hp+=dHP; s.atk+=dATK; s.def+=dDEF; s.range=100+22*nv;

}

    kusRisk:clamp((f.residue?.1:.55)+f.kus*.3,.05,.9),bsSoil:clamp(f.bsSoil*.6+f.bs*.4+(f.residue?0:.1),.03,.8),yBase:clamp(f.yBase*.5+.06+(f.big+f.young)*.4,.06,.5),tanuki:f.tanuki*.8+.08};

function bedPlan(P){
  const b=G.bed, w=G.weather[G.jun]; const pre=b.sprout<1; const lo=pre?28.6:25.6, hi=pre?32.4:29.6, tg=pre?30.5:27.6;
  let best=null;
  for(const vinyl of ['closed','open']) for(let adds=0;adds<=2;adds++) for(const vent of [false,true]){
    const T=bedTemp(w,{vinyl,heat:Math.min(16,b.heat+7*adds),vent});
    const cost=(vinyl!==b.vinyl?1:0)+adds+(vent?1:0);
    const ok=T>=lo&&T<=hi; const sc=(ok?0:100+Math.abs(T-tg)*10)+cost*3+Math.abs(T-tg)*(ok?.4:0);
    if(!best||sc<best.sc) best={sc,vinyl,adds,vent,T};
  }
  return best;
}
function pickVariety(P){
  if(P.variety!=null) return P.variety;
  if(P.mode!=='auto'||G.unlocked.length<2) return G.unlocked[0];
  let best=null;
  for(const v of G.unlocked){
    const save=G; G=JSON.parse(JSON.stringify(save)); const wasSim=true;
    try{ runYear(Object.assign({},P,{variety:v,noPick:true}),G.jun); const r=yearResult(); const sc=r.score+r.brix*.5;
      if(!best||sc>best.sc) best={sc,v}; }catch(e){}
    G=save;
  }
  return best?best.v:G.unlocked[0];
}
let doTaskHook=null;
function farmPolicy(P){
  const f=G.f,b=G.bed,j=G.jun,w=G.weather[j],mode=P.mode||'auto';
  const T=(id,o)=>{ const t=TASKS[id]; if(t&&t.show()&&G.ap>=t.cost(G,o)&&!(t.can&&t.can(o))){ (doTaskHook||doTask)(id,o); return true; } return false; };
  const age=ageNow(), nxt=wA(j+1), ff=G.ff;
  if(mode==='none'){
    if(j===0) T('fusekomi',{variety:P.variety!=null?P.variety:G.unlocked[0]});
    if(b.on&&!b.cut&&b.sprout>=1&&j>=6) T('cut');
    if(j>=8&&!G.seed2) T('buy');
    if(j>=8&&pre()&&G.seed2){ T('ridge',{h:'low',sp:38}); T('plant',{m:'o'}); }
    if(live()&&age>=P.hAge) T('harvest');
    return;
  }
  // --- 育苗 ---
  if(b.on&&!b.cut&&j<=8){ const pl=bedPlan(P); if(pl.vinyl!==b.vinyl) T('vinyl'); for(let i=0;i<pl.adds;i++) T('heat'); if(pl.vent) T('vent'); }
  if(!b.on&&j<=1){ T('onsen',{q:1,dmg:0}); const v=P.variety!=null?P.variety:(P.noPick?G.unlocked[0]:pickVariety(P)); T('fusekomi',{variety:v}); const pl=bedPlan(P); if(pl.vinyl!==b.vinyl) T('vinyl'); for(let i=0;i<pl.adds;i++) T('heat'); if(pl.vent) T('vent'); }
  if(b.on&&!b.cut&&b.sprout>=1&&((j>=6&&b.sLen>=.8)||(j>=7&&b.sLen>=.45)||j>=8)) T('cut');
  if(G.seed2&&!G.seed2.treated) T('onsenS',{q:1,dmg:0});
  // --- 畑づくり ---
  if(pre()&&j>=3){
    if(f.depth<.9) T('plowD');
    if(f.comp<.4) T('compost');
    const kt=mode==='nitro'?.3:.62; let guard=0;
    while(f.K<kt&&guard++<4){ if(G.mats.ash>0&&T('ash')) continue; if(!T('fertK')) break; }
    if(mode==='nitro'){ guard=0; while(f.N<.88&&guard++<4) if(!T('fertN')) break; }
    if(!f.rotated&&(G.year>1||f.nem>.15)) T('rotate');
    if(f.grub>.14) T('drug');

function updPr(dt){

  A.pk=A.pk.filter(k=>!k.got);

}

function willFall(p){
  if(p.wh&&(p.wh.st==='hang'||p.wh.st==='zip')) return false;
  if(p.on) return false;
  for(const s of near(p.x-4,p.x+4)){ if(s[1]>=p.y-4&&p.x>=s[0]&&p.x<=s[0]+s[2]) return false; }
  if(LV.hazAt) return true; return true;
}
function aiEval(fn,H){
  const real=A; const c=structuredClone(real); c.sim=true; A=c; let sc=0;
  try{
    const dtf=1/60;
    for(let k=0;k<H;k++){ updWorld(fn(k),dtf); if(A.done) break; }
    { const fin=I(0,1,0,0,0,0); let ex=0; while(!A.done&&!A.p.on&&!(A.p.wh&&(A.p.wh.st==='hang'||A.p.wh.st==='zip'))&&ex++<60) updWorld(fin,dtf); }
    const p=A.p, rp=real.p;
    const boss=A.en.find(e=>e.type==='boss'&&!e.dead);
    sc+=(p.x-rp.x)*(real.arenaOn?0:.7);
    sc+=(A.dmgDealt-real.dmgDealt)*5;
    sc+=(Object.values(A.kills).reduce((a,b)=>a+b,0)-Object.values(real.kills).reduce((a,b)=>a+b,0))*28;
    sc-=(rp.hp-p.hp)*70;
    if(A.fell>real.fell) sc-=2500;
    if(A.dead) sc-=20000;
    if(A.win) sc+=6000;
    if(!A.done&&willFall(p)) sc-=1800;
    if(real.arenaOn&&boss){ const d=Math.abs(p.x-boss.x); sc-=boss.vuln?d*.5:Math.abs(d-90)*.12; if(boss.vuln&&p.on) sc+=2; if(boss.st==='icicle') for(const m of A.mk) if(Math.abs(m.x-p.x)<20) sc-=40; }
    // 体力が高いうちは、前の敵を待たずに進む
    if(!real.arenaOn&&p.x-rp.x<2) sc-=3;
  }catch(e){ sc=-1e9; }
  A=real; return sc;
}
function aiInput(){
  if(A.t<.05){ AI.bx=0; AI.bt=0; AI.len=8; }
  if(A.p.x>AI.bx+8){ AI.bx=A.p.x; AI.bt=A.t; }
  if(!A.arenaOn&&A.t-AI.bt>7&&AI.k>=AI.len){ const c=CANDS[Math.floor(rA()*16)]; AI.plan=c[1]; AI.name='unstick:'+c[0]; AI.k=0; AI.len=10; }
  if(!A.arenaOn&&A.t-AI.bt>45&&!A.done){ A.done=true; A.win=false; A.quit=true; }
  if(AI.k>=AI.len||!AI.plan){
    AI.len=8;
    let best=-1e12, bn=null;
    for(const [name,fn] of CANDS){ const s=aiEval(fn,40)+(name==='run'?1:0); if(s>best){ best=s; bn=[name,fn]; } }
    AI.plan=bn[1]; AI.name=bn[0]; AI.k=0;
  }
  return AI.plan(AI.k++);
}

function stepMini(dt){

  if(m.temp>49.6) m.hot+=d; if(m.temp<45.6) m.cold+=d;
  const c=$('#mgc'); if(c){ const g=c.getContext('2d'); g.clearRect(0,0,300,150);
    const y=v=>130-(clamp(v,38,56)-38)/18*110;
    g.fillStyle='rgba(105,201,120,.35)'; g.fillRect(40,y(48.4),220,y(46.6)-y(48.4)); g.fillStyle='rgba(105,201,120,.7)'; g.fillRect(40,y(48),220,y(47)-y(48));
    g.strokeStyle='#8a7090'; g.strokeRect(40,20,220,110);
    g.fillStyle='#ee5a48'; g.fillRect(138,y(m.temp),24,130-y(m.temp)); g.beginPath(); g.arc(150,138,14,0,7); g.fill();
    g.fillStyle='#fff'; g.font='bold 13px sans-serif'; g.textAlign='center'; g.fillText(fx(m.temp,1)+'℃',150,14); g.font='11px sans-serif'; g.textAlign='left'; g.fillText('48℃',4,y(48)+4); g.fillText('47℃',4,y(47)+4);
    g.fillStyle='#ffd0a0'; if(m.heat>0){ for(let i=0;i<5;i++) g.fillRect(100+i*20,138+Math.sin(T*20+i)*2,6,6); }
    if(m.heat<0){ g.fillStyle='#9ad8ff'; for(let i=0;i<5;i++) g.fillRect(100+i*20,20+(T*80+i*15)%60,3,8); }
    const te=$('#mgT'); if(te) te.textContent=Math.min(m.dur,Math.round(m.t)); }
  if(m.t>=m.dur) finishMini();
}
function finishMini(){

  modal('<h2>🌙 夜：ご飯</h2><p>芋料理を食べて、明日のぶんの力をつけよう（芋 0.5kg）。<br>貯蔵 '+fx(foodKg,0)+'kg</p><div class="opts">'+Object.entries(BUFFS).map(([k,b])=>'<button class="tk" data-k="'+k+'"><b>'+b.n+'</b><small>'+b.txt+'</small></button>').join('')+'</div><button class="big alt" id="mNo" style="width:100%">食べない</button>',
    {'.tk':(e,el)=>{ closeModal(); afterMeal(el.dataset.k); },'#mNo':()=>{ closeModal(); afterMeal(null); }});
}
function afterMeal(k){
  if(k){ if(G.st&&G.st.kg>1){ G.st.kg-=.5; } else G.pantry-=.5; G.eaten+=.5; G.buff=Object.assign({k},BUFFS[k]); sfx('coin'); }
  const prevJ=G.jun, rep=nextJun().rep;
  if(G.jun>=30){ yearEndFlow(); return; }
  store.set('imohime.save',G);
  refresh();
  const hint=genHint();
  modal('<h2>🌙 '+G.year+'年目 '+junName(prevJ)+'のまとめ</h2>'+rep.map(r=>'<p>・'+r+'</p>').join('')+'<div class="bk"><h3>ゲンさんのひと言</h3><p>「'+hint+'」</p></div>'+okBtn('次の旬へ'),{'#mOk':()=>{ closeModal(); morningStart(); }});
}
function morningStart(){
  const key=G.year+':'+G.jun;
  const sc=SCENES[key];
  if(G.view==='cellar'&&!(G.f.harvested)) G.view='field';
  if(G.jun===0&&G.year>1){ const nm=VAR_UNLOCK[Math.min(G.year-1,2)].map(i=>VAR[i].n).join('と'); toast('商人から '+nm+' の種いもが届いた！',2600); }
  if(sc&&!G.seen) G.seen={}; if(sc&&!(G.seen||{})[key]){ G.seen=G.seen||{}; G.seen[key]=1; say(sc,()=>refresh()); }
  refresh();
}
/* ---- 年末 ---- */
function yearData(){
  const r=yearResult(); const g=applyGrowth(r);
  G.lastResult=r; G.hist.push(Object.assign({year:G.year},r));
  best.kg=Math.max(best.kg||0,Math.round(r.kg)); best.brix=Math.max(best.brix||0,+(r.brix||0).toFixed(1)); store.set('imohime.best',best);
  return {r,g};
}
function yearEndFlow(){
  const {r,g}=yearData();
  const rows=[['品種',r.varName],['収穫量',fx(r.kg,0)+' kg　→ 体力 +'+g.dHP],['焼き芋の糖度',fx(r.brix,1)+' Brix　→ 攻撃 +'+g.dATK],['A品率',pct(r.A)+' %　→ 防御 +'+g.dDEF+'%'],['品種の数',G.unlocked.length+'種　→ 芋づる射程 '+g.range],['貯蔵ロス（腐り）',pct(r.rot||0)+' %'],['評価',r.rank+'（'+r.score+'点）']];
  let cm=r.none?'今年は収穫できなかった…。来年こそ！':r.rank==='S'||r.rank==='A'?'見事な出来じゃ！ 島じゅうが焼き芋のにおいじゃぞ。':r.rank==='B'?'まずまずじゃ。来年はもっと甘くできるぞ。':'苦労したのう…。『芋の書』を読みなおして、来年こそじゃ。';
  if(!r.none){ if(r.frostHit>.3) cm='霜にあたってしもうた…収穫は霜の前にな。'; else if(r.tsuru>.2) cm='つるぼけ気味じゃった。窒素を控えめにしてみい。'; else if(r.sprout>.3) cm='貯蔵庫で芽が出とる。温度が高すぎたんじゃ。'; else if((r.skin||0)>.3) cm='皮が黒ずんどる。湿度は90%以上を保つんじゃ。'; }
  sfx('fanfare');
  setMode('morning'); G.view='cellar'; refresh();
  modal('<h2>🎍 '+G.year+'年目の結果発表</h2><table>'+rows.map(a=>'<tr><td>'+a[0]+'</td><td>'+a[1]+'</td></tr>').join('')+'</table><div class="bk"><h3>ゲンさん</h3><p>「'+cm+'」</p></div><p>イモ姫の力：体力 '+G.stats.hp+'／攻撃 '+G.stats.atk+'／防御 '+G.stats.def+'%／射程 '+G.stats.range+'</p>'+okBtn(G.year<3?'来年へ':'最後の戦いへ')+backLink,{'#mOk':()=>{
    closeModal();
    if(G.year<3){ endYearCarry(); G.pantry+=8; newYear(true); G.view='bed'; store.set('imohime.save',G); setMode('morning'); morningStart(); }
    else { G.pantry+=4; say([['ゲンさん','3年目の冬じゃ。霜の峰に、道がひらいた。'],['イモ姫','行ってくる。みんなの芋を、守るために！']],()=>{ if(G.cleared[3]||true) startAction(5); }); }
  }});
}
function doEnding(){
  G.ending=true; LASTRUN={playT:G.playT,hits:G.hits,deaths:G.deaths,hist:G.hist.map(h=>({year:h.year,varName:h.varName,kg:h.kg,brix:h.brix,A:h.A,rank:h.rank,score:h.score,rot:h.rot})),stats:Object.assign({},G.stats),actTime:G.stat.actTime,log:G.stat.log,cleared:G.cleared.slice(),kills:Object.assign({},G.kills)}; const juns=(G.year-1)*30+Math.min(30,G.jun); best.clears=(best.clears||0)+1; best.juns=best.juns?Math.min(best.juns,juns):juns; store.set('imohime.best',best);
  store.set('imohime.save',null);
  setMode('morning'); elTasks.innerHTML=''; elBar.innerHTML=''; G.view='field';
  say(ENDING,()=>{
    const hs=G.hist.map(h=>'<tr><td>'+h.year+'年目 '+h.varName+'</td><td>'+fx(h.kg,0)+'kg / '+fx(h.brix,1)+'Brix / '+h.rank+'</td></tr>').join('');
    modal('<h2>🍠 ENDING　イモ姫は島で暮らす</h2><table>'+hs+'<tr><td>クリアまでの旬</td><td>'+juns+'旬</td></tr><tr><td>被弾（全ステージ）</td><td>'+G.hits+'回</td></tr><tr><td>ベスト収量</td><td>'+(best.kg||0)+' kg</td></tr><tr><td>ベスト糖度</td><td>'+fx(best.brix||0,1)+' Brix</td></tr><tr><td>最短クリア</td><td>'+best.juns+'旬</td></tr></table><p>ごちそうさま！ 遊んでくれてありがとう。</p>'+okBtn('タイトルへ')+backLink,{'#mOk':()=>{ closeModal(); toTitle(); }});
    if(auto) AU.t=3.2;
  });
}
/* ---- タイトル・セーブ ---- */
function toTitle(){
  G=null; setMode('title'); $('#title').hidden=false; elDlg.hidden=true; closeModal();
  const sv=store.get('imohime.save',null); $('#bCont').hidden=!(sv&&sv.v===1);
  $('#bestTxt').textContent=(best.kg||best.clears)?'ベスト：収量 '+(best.kg||0)+'kg／糖度 '+fx(best.brix||0,1)+' Brix'+(best.juns?'／最短クリア '+best.juns+'旬':''):'';
}
function startNew(){
  unlock(); $('#title').hidden=true; newGame(); setMode('morning'); G.view='bed'; refresh();
  if(auto) { morningStart(); } else say(PROLOGUE,()=>{ morningStart(); });
}
function continueGame(){
  unlock(); const sv=store.get('imohime.save',null); if(!sv) return;
  G=sv; $('#title').hidden=true; setMode('morning'); refresh(); if(G.jun>=30){ yearEndFlow(); return; } morningStart();
}
$('#bStart').onclick=startNew; $('#bCont').onclick=continueGame; $('#bHow').onclick=()=>{ unlock(); openHow(); };
/* ---- オート ---- */
const AU={t:0};
const autoBtn=$('#autoBtn');
function setAuto(b){ auto=!!b; autoBtn.setAttribute('aria-pressed',auto?'true':'false'); autoBtn.textContent=auto?'🤖 オート中':'🤖 オート'; AU.t=.3; if(auto){ unlock(); } }
autoBtn.onclick=()=>{ unlock(); setAuto(!auto); };
function exploreWant(){
  const f=G.f, j=G.jun, y=G.year, c=G.cleared;
  if(y===1){ if(!c[0]&&j>=9) return 1; if(c[0]&&!c[1]&&j>=12) return 2; }
  if(y===2){ if(!c[2]&&j>=7) return 3; if(c[2]&&!c[3]&&j>=11) return 4; }
  if(c[0]&&j>=12&&j<=20&&(f.egg+f.young+f.big)>.05&&G.exploredFor!==G.year+':'+j) return 1;
  return 0;
}
function pickMeal(explore){ const a=G.year; return explore?'yaki':(G.year>1?'dai':'hoshi'); }
function autoTick(dt){
  AU.t-=dt; if(AU.t>0) return;
  if(mode==='title'){ if(!$('#title').hidden){ startNew(); AU.t=.3; } return; }
  if(D){ nextLine(); AU.t=.14; return; }
  if(mode==='action') return;
  if(modalOpen()){ const ok=$('#mOk'); if(ok){ ok.click(); AU.t=.35; return; } const mn=elModal.querySelector('.tk[data-k]'); if(mn){ mn.click(); AU.t=.2; return; } elModal.querySelector('.tk:not([disabled])')?.click(); AU.t=.3; return; }
  if(!G||G.ending) return;
  if(MG) return;
  // 畑仕事
  if(!G.autoDone||G.autoDone!==G.year+':'+G.jun){
    G.autoDone=G.year+':'+G.jun;
    const msgs=[]; const orig=doTask;
    const P=Object.assign({},POLICIES.auto);
    // 方針を実行しつつ、メッセージをためて順に出す
    const wrap=(id,o)=>{ const r=orig(id,o); if(r.ok) msgs.push(r.msg); return r; };
    doTaskHook=wrap; farmPolicy(P); doTaskHook=null;
    G.view=G.f.harvested?'cellar':(G.f.planted>=0?'field':(G.bed.on&&!G.bed.cut?'bed':'field'));
    AU.q=msgs; AU.t=.05; refresh(); return;
  }
  if(AU.q&&AU.q.length){ const m=AU.q.shift(); toast(m,900); sfx('ok'); AU.t=.16; return; }
  const w=exploreWant();
  if(w&&!G.exploredThisJun){ G.exploredThisJun=true; G.exploredFor=G.year+':'+G.jun; startAction(w); AU.t=.2; return; }
  if(G.jun>=30) return;
  // 夜
  const explore=false; const k=(G.st&&G.st.kg>1)||G.pantry>=.5?pickMeal(w):null;
  afterMeal(k); AU.t=.3;
}

/* ================= 入力・ループ・フック ================= */
const keyMap={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',' ':'j',j:'a',J:'a',k:'w',K:'w'};
function readKeys(){ return {l:!!K.l,r:!!K.r,u:!!K.u,j:!!K.j,a:!!K.a,w:!!K.w}; }
addEventListener('keydown',e=>{
  if(e.repeat&&(e.key==='o'||e.key==='O')) return;
  if(e.key==='o'||e.key==='O'){ unlock(); setAuto(!auto); e.preventDefault(); return; }
  if(auto&&e.isTrusted&&mode!=='title'&&(keyMap[e.key]||e.key==='Enter')){ setAuto(false); }
  if(D&&(e.key===' '||e.key==='Enter'||e.key==='z'||e.key==='Z')){ unlock(); nextLine(); e.preventDefault(); return; }
  if(modalOpen()&&e.key==='Enter'){ const ok=$('#mOk'); if(ok){ ok.click(); e.preventDefault(); } return; }
  const k=keyMap[e.key]; if(k&&mode==='action'){ K[k]=1; unlock(); e.preventDefault(); }
});
addEventListener('keyup',e=>{ const k=keyMap[e.key]; if(k) K[k]=0; });
addEventListener('blur',()=>{ for(const k in K) K[k]=0; });
addEventListener('pointerdown',e=>{ if(auto&&e.isTrusted&&mode!=='title'&&e.target.closest&&!e.target.closest('#top')&&e.target.closest('#app')) setAuto(false); },true);
function bindBtn(id,key){
  const el=$(id); let lp=0;
  const on=e=>{ e.preventDefault(); unlock(); K[key]=1; el.classList.add('on'); if(key==='w'){ lp=setTimeout(()=>{ if(K.w) K.u=1; },280); } };
  const off=()=>{ K[key]=0; el.classList.remove('on'); if(key==='w'){ clearTimeout(lp); K.u=0; } };
  el.addEventListener('pointerdown',on); ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('#bL','l'); bindBtn('#bR','r'); bindBtn('#bJ','j'); bindBtn('#bA','a'); bindBtn('#bW','w');
$('#bX').addEventListener('click',()=>{ if(mode==='action'&&A&&!A.done){ A.done=true; A.win=false; A.quit=true; } });
const muteBtn=$('#muteBtn'); const paintMute=()=>{ muteBtn.textContent=muted?'音 OFF':'音 ON'; muteBtn.setAttribute('aria-pressed',muted?'false':'true'); };
muteBtn.onclick=()=>{ unlock(); muted=!muted; store.set('imohime.mute',muted); paintMute(); if(!muted) sfx('ok'); }; paintMute();

function stepAction(dt){
  if(!A) return; acc+=dt; let n=0;
  while(acc>=1/60&&n<8){ acc-=1/60; n++;
    if(!A.done){ const inp=auto?aiInput():readKeys(); updWorld(inp,1/60); } }
  FX.forEach(f=>{ f.t+=dt; f.life-=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=200*dt; }); FX=FX.filter(f=>f.life>0);
  TXT.forEach(t=>{ t.t+=dt; t.life-=dt; }); TXT=TXT.filter(t=>t.life>0);
  if(A.done&&endT>=0){ endT+=dt; if(endT>(auto?.4:1.1)){ endT=-999; finishAction(); } }
}
function tick(dt){
  T+=dt; if(G&&mode!=='title') G.playT=(G.playT||0)+dt;
  if(auto) autoTick(dt);
  if(mode==='action') stepAction(dt);
  if(MG) stepMini(dt);
  if(D&&auto===false) {}
}
function draw(){
  const c=cx; c.setTransform(1,0,0,1,0,0); c.fillStyle='#1a1220'; c.fillRect(0,0,CW,CH);
  if(mode==='action'&&A&&LV){ const portrait=CW<CH*.9; viewW=portrait?300:AW; const s=portrait?CW/300:Math.min(CW/AW,CH/AH); const vh=CH/s, oy=portrait?(vh-AH)*.5:(vh-AH)/2, ox=(CW-viewW*s)/2/s; c.setTransform(s,0,0,s,ox*s,0); drawAction(c,T,viewW,vh,Math.max(0,oy)); }
  else if(mode==='title'){ drawTitleArt(); }
  else if(G&&G.weather){ const LW=400,LH=320, s=Math.min(CW/LW,CH/LH); c.setTransform(s,0,0,s,(CW-LW*s)/2,(CH-LH*s)/2); c.save(); c.beginPath(); c.rect(0,0,LW,LH); c.clip(); (G.view==='bed'?drawBed:G.view==='cellar'?drawCellar:drawField)(c,T); c.restore(); }
}
let lastTs=0;
function frame(ts){ const dt=Math.min(.05,(ts-lastTs)/1000||0); lastTs=ts; tick(dt); draw(); requestAnimationFrame(frame); }
/* ---- テスト用フック ---- */
window.__imohime={
  get year(){ return G?G.year:0; }, get jun(){ return G?G.jun:0; }, get mode(){ return mode; }, get field(){ return G&&G.f; }, get bed(){ return G&&G.bed; }, get storage(){ return G&&G.st; },
  get stats(){ return G&&G.stats; }, get weather(){ return G&&G.weather[Math.min(29,G.jun)]; }, get G(){ return G; }, get A(){ return A; }, get auto(){ return auto; }, get ap(){ return G&&G.ap; },
  get modalOpen(){ return modalOpen(); }, get dialog(){ return !!D; },
  step(dt){ const n=Math.max(1,Math.round(dt*60)); for(let i=0;i<n;i++) tick(1/60); draw(); },
  doTask(id,o){ const r=doTask(id,o); refresh(); return r; },
  nextJun(){ const r=nextJun(); if(G.jun>=30){ const {r:yr}=yearData(); if(G.year<3){ endYearCarry(); newYear(true); } else G.jun=30; refresh(); return {rep:r.rep,year:yr}; } refresh(); return {rep:r.rep}; },
  setAuto, newGame(seed){ $('#title').hidden=true; newGame(seed); setMode('morning'); refresh(); return G; }, startAction, setView(v){ G.view=v; refresh(); },
  yearEnd:yearEndFlow, ending:doEnding, closeModal, skipDialog(){ while(D) nextLine(); }, openBook, openExplore, openHow, chooseRidge, chooseMethod, chooseVariety, chooseCond, openMini,
  simYear(p,o){ const w=window.__imohime; return simYear(p,o); }, policies:POLICIES,
  mkWorld, updWorld, aiInput, yearResult, finishAction, goNight, toTitle, setStats(s){ Object.assign(G.stats,s); }, setJun(j){ G.jun=j; refresh(); },
  get lastRun(){ return LASTRUN; }, best, farmPolicy, TASKS, advance
};
setAuto(false);
toTitle();
requestAnimationFrame(frame);
})();
</script>
<!-- zoom guard: ピンチ・ダブルタップでズームしない -->
<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
