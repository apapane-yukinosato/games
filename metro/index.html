<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="MCライム侍が地方から首都へ！ 街でリリックを集めて、ジャッジのロウをかいくぐるラップバトルRPG。">
<title>メトロポリス アポカリプス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
html,body{touch-action:manipulation}
:root{--bg:#120d1f;--ink:#f3ecff;--card:#201734;--card2:#2b2046;--line:#46346e;--mute:#a899c8;--gold:#ffcf3d;--pink:#ff4f93;--cyan:#3dd6ff;--green:#46d68a;--red:#ee4a4a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;padding:6px 8px 8px;padding-top:calc(6px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px}
#top{display:flex;align-items:center;gap:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:13px;font-family:"Dela Gothic One",sans-serif;color:var(--gold);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
#stage{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 3px 0 #05030c;flex:none}
#cv{display:block;width:100%;height:auto;aspect-ratio:390/196}
#fxBanner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:"Dela Gothic One",sans-serif;font-size:40px;color:var(--gold);text-shadow:0 3px 0 #7a1a3a,0 0 14px #ff4f93;opacity:0;white-space:nowrap}
#fxBanner.show{animation:ban 1.1s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.25) rotate(2deg)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#info{font-size:11.5px;font-weight:800;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 10px;padding:0 4px;min-height:16px}
#info b{color:var(--ink)}
#panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card h2{margin:0 0 4px;font-family:"Dela Gothic One",sans-serif;font-size:19px;color:var(--gold);line-height:1.3;font-weight:400}
.card p{margin:4px 0;font-size:12.5px;line-height:1.6;color:var(--mute)}
.btn{display:block;width:100%;min-height:46px;border:0;border-radius:13px;font-weight:800;font-size:15px;cursor:pointer;margin-top:7px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #9a1f55;padding:6px 10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a1f55}
.btn.alt{background:#4a3a86;box-shadow:0 4px 0 #2a2050}
.btn.gold{background:var(--gold);color:#2a1a40;box-shadow:0 4px 0 #8a6a16}
.btn.cy{background:var(--cyan);color:#102038;box-shadow:0 4px 0 #1a7a9a}
.btn.sm{min-height:38px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.row{display:flex;gap:7px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.spot{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;font-weight:800;font-size:13px;line-height:1.3;min-height:58px}
.spot i{display:block;font-style:normal;font-size:22px}
.spot:active{background:#3a2c62}
.spot.hot{outline:2px solid var(--gold)}
.who{display:inline-block;font-weight:800;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--pink);color:#fff;margin-bottom:4px}
.say{font-size:14.5px;line-height:1.75;white-space:pre-line;min-height:84px}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none;text-align:center}
.ly{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;line-height:1.5;position:relative}
.ly .t{font-weight:800;font-size:13px;line-height:1.5}
.ly .m{display:flex;flex-wrap:wrap;gap:3px 5px;margin-top:3px;align-items:center}
.tag{font-size:10.5px;font-weight:800;border-radius:99px;padding:0 7px;background:#3a2c62;color:#d8c8ff;white-space:nowrap}
.tag.atk{background:#7a2a4a;color:#ffd0e0}.tag.cat{background:#24506a;color:#c8f0ff}.tag.rh{background:#4a3a1a;color:#ffe090}.tag.lure{background:#2a5a3a;color:#b8ffd0}.tag.wk{background:#8a1a1a;color:#fff}.tag.bad{background:#a82020;color:#fff}
.ly.sel{outline:2px solid var(--gold);background:#3a2c62}
.ly.weak{border-color:#c04040}
.ly.bad{outline:2px solid var(--red)}
.ly .px{position:absolute;right:8px;top:6px;font-weight:800;color:var(--gold);font-size:12.5px}
.tabs{display:flex;gap:6px;margin-bottom:7px}.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-weight:800;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#2a1a40;border-color:var(--gold)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 7px}
.hb small{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--mute)}
.hb .tr{height:10px;border-radius:6px;background:#0a0614;overflow:hidden;margin-top:2px}
.hb .tr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#46d68a,#c8f060);transition:width .5s}
.hb.o .tr i{background:linear-gradient(90deg,#ff4f93,#ffa060)}
.laws{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;align-items:center;min-height:26px}
.law{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:#222;border:2px solid #fff;color:#fff}
.law.ban{background:#7a1a1a;border-color:#ff8a8a}.law.rec{background:#1a5a3a;border-color:#8affb8}.law.rhy{background:#6a1a6a;border-color:#ff9aff}
.cards{display:inline-flex;gap:3px;font-size:11px;font-weight:800;margin-left:auto}
.cd{display:inline-block;width:12px;height:16px;border-radius:2px;background:#33264f;border:1px solid #6a5a9a}.cd.y{background:#ffd23d}.cd.r{background:#ee3a3a}
.bub{background:#fff;color:#241638;border-radius:14px;padding:8px 11px;min-height:66px;font-size:15.5px;font-weight:800;line-height:1.55;position:relative;margin-bottom:6px}
.bub .nm{font-size:11px;color:#8a5aa8;display:block;margin-bottom:1px}
.bub .tg{position:absolute;right:8px;top:6px;font-size:11px;background:#ffe090;color:#5a3a00;border-radius:99px;padding:0 8px}
.bub .c{display:inline-block;opacity:0}
.bub .c.on{opacity:1;animation:pop .36s ease-out}
.bub .c.st{animation:none}
@keyframes pop{0%{transform:translateY(-10px) scale(1.3)}60%{transform:translateY(2px)}100%{transform:none}}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hc{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:5px 6px 5px;text-align:left;cursor:pointer;min-height:84px;font-size:11px;line-height:1.35;position:relative;display:flex;flex-direction:column;gap:2px}
.hc .t{font-weight:800;font-size:11.5px;flex:1}
.hc:active{background:#3a2c62}
.hc.bad{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.hc.weak{border-color:#ff6a6a;background:#3a1a2a}
.hc.hit{outline:2px solid var(--gold)}
.hc .mm{display:flex;flex-wrap:wrap;gap:2px}
.hc .tag{font-size:9.5px;padding:0 5px}
.hc:disabled{opacity:.5}
.modal{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(10,5,20,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
#panelWrap{position:relative;flex:1;min-height:0;display:flex}
#panelWrap #panel{flex:1}
.big{font-size:30px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:8px 0;text-align:left}.rows b{text-align:right}
.note{font-size:11.5px;color:var(--mute);line-height:1.6}
.dyl{background:#2a1a4a;border:2px solid #8a5ae0;border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.6;margin-bottom:7px;min-height:58px}
.jgauge{height:34px;border-radius:10px;background:#0a0614;border:2px solid var(--line);position:relative;overflow:hidden;margin:10px 0}
.jgauge .z{position:absolute;top:0;bottom:0;left:40%;width:20%;background:rgba(70,214,138,.35)}
.jgauge .z2{position:absolute;top:0;bottom:0;left:47%;width:6%;background:rgba(255,207,61,.6)}
.jgauge .mk{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
@media (min-width:700px){#app{padding-top:10px}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>メトロポリス アポカリプス</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="390" height="196" aria-label="場面の絵"></canvas>
    <div id="fxBanner"></div>
  </div>
  <div id="info"></div>
  <div id="panelWrap"><div id="panel"></div></div>
</div>
<script>
(()=>{
'use strict';
// ============================================================ DATA
const CAT={d:'ディス',b:'自慢',l:'地元',s:'社会派',r:'恋愛',w:'言葉遊び'};
const TGN={'金':'金','田':'田舎','年':'年齢','見':'見た目','仕':'仕事','家':'家族','流':'流行'};
const LY={}, LIST=[];
function ly(id,t,atk,cat,rh,tags,lure,src,ch){
  const o={id,t,atk,cat,rh:rh||'',tags:(tags||'').split('').filter(Boolean).map(c=>TGN[c]),lure:!!lure,src,ch};
  LY[id]=o; LIST.push(o); return id;
}
// starters
const STARTERS=[
 ly('s1','俺は侍 ライムの侍 斬られる前に 斬って捨てるぜ',16,'b','','',0,'start',0),
 ly('s2','緊張してても 足がふるえても 俺のライムは 止まらない',14,'b','あい','',0,'start',0),
 ly('s3','生まれた町を 背中に背負って 今日も俺は 歌う',14,'l','あう','田',0,'start',0),
 ly('s4','財布は軽く 心は重く それでも夢は 高い',12,'s','あい','金',0,'start',0),
 ly('s5','上司の小言は 右から左 俺のビートに ついてこい',16,'s','おい','仕',0,'start',0),
 ly('s6','お前の韻は 聞き飽きたぜ 踏めるもんなら 踏んでみな',12,'d','','',1,'start',0),
 ly('s7','親の顔が見たいぜ お前の親の 顔',18,'d','あお','家',0,'start',0),
 ly('s8','最近流行りの 曲は知らねえ 俺は昔から この路線',12,'w','','流',0,'start',0),
 ly('s9','年を取ったな 昔の俺なら もっとキレてた',14,'w','','年',0,'start',0)
];
// weakness cards (opponent specific, always hit)
const WK={};
function wk(id,opp,note,t,atk,rh){ WK[id]=ly(id,t,atk,'d',rh||'','',0,'weak',0); LY[id].weak=opp; LY[id].note=note; }
// ---- events
const SPOTS=[
 [['商店街','🏪'],['駅前','🚉'],['田んぼ道','🌾'],['公民館','🏛'],['スナック','🍸'],['神社','⛩'],['団地','🏢']],
 [['港','⚓'],['繁華街','🌃'],['市役所前','🏤'],['ショッピングモール','🛍'],['屋台村','🍢'],['大学','🎓'],['高架下','🚇']],
 [['スクランブル交差点','🚦'],['国会前','🏛'],['タワマン','🏙'],['地下鉄','🚇'],['ネットカフェ','💻'],['ロッポンギ通り','🍸'],['路地裏のレコード屋','💿']]
];
const EV=[[],[],[]];
const L=(id,t,atk,cat,rh,tags,lure,ch)=>({k:'L',id:ly(id,t,atk,cat,rh,tags,lure,'find',ch)});
const W=id=>({k:'W',id}), M=n=>({k:'M',amt:n}), N=()=>({k:'N'});
function sp(ch,list){ EV[ch].push(list.map(a=>({s:a[0],sc:a[1],t:a[2],r:a[3]}))); }

// ===== 第1章 ねぎま町
sp(0,[
 ['0',['🐟','📣','🧑‍🍳'],'魚屋のおやじが、朝から声を張り上げている。\n「安いよ安いよ！ 今日だけ毎日この値段だ！」',L('e01','安いよ安いよ 叩き売り 俺のライムは 値崩れしない',22,'b','あい','金',0,0)],
 ['1',['🏪','🪧','🤔'],'シャッターに「閉店セール」の看板。……十年前から出ているらしい。\n「嘘も続ければ商売になるのさ」と店主は笑った。',L('e02','閉店セール 十年目 嘘も続けりゃ 商売になる',26,'w','あう','仕',0,0)],
 ['2',['🏮','👵','🤫'],'八百屋のおばちゃんが、店じまいをしながら噂話を始めた。\n「ここだけの話ね、稲穂ちゃん……ほんとは都会育ちなのよ」',W('w1a')],
 ['x',['🗳','🖍','😆'],'選挙ポスターに、ヒゲの落書き。\nよく見ると、ポスターの裏にも何か書いてある。',L('e03','ヒゲを描かれた ポスターの顔 口約束なら 誰でも言える',25,'s','えう','',0,0)]
]);
sp(0,[
 ['0',['🚉','📢','👨‍💼'],'駅前で街頭演説。「この町を変えます！」\n……去年もまったく同じ声を聞いた気がする。',L('e04','この町を変えるという 声は今年も聞いた 変わらねえのは お前の顔',30,'s','あお','仕',0,0)],
 ['1',['🚃','⏰','😴'],'昼の駅は、一時間に一本の電車を待つ人だけ。\nベンチの老人がつぶやく。「待つ間に、人生が過ぎたよ」',L('e05','一時間に一本の電車 待つ間に書ける 一本の曲',20,'l','おう','田',0,0)],
 ['2',['🚏','🌙','📻'],'ベンチのラジオから深夜番組。\n「ねぎま町のみなさん、今夜も眠れない？」',L('e06','ラジオが流す 深夜の悩み 俺のライムが 答えを歌う',24,'w','あう','流',0,0)],
 ['x',['🎙','🚐','😵'],'ウグイス嬢が叫ぶ選挙カー。同じ名前を17回連呼している。',L('e07','名前ばかり連呼する選挙カー 中身を聞かせろ 連呼じゃ届かねえ',28,'s','','仕',0,0)]
]);
sp(0,[
 ['0',['🌾','🐸','🧑‍🌾'],'朝のあぜ道。カエルの大合唱を、農家のおじさんが指揮している。',L('e08','カエルの合唱 朝のライブ 客はゼロでも 声は枯らさない',18,'l','あい','田',0,0)],
 ['1',['🌤','🧢','🗣'],'かかしに話しかけている男がいる。\n「稲穂のやつ、ステージ衣装は農協の景品なんだよなぁ」',W('w1b')],
 ['2',['🌌','✨','🐛'],'夜の田んぼ。街灯がないから、星がやたらと近い。',L('e09','街灯ゼロ 星がスポットライト 田んぼのステージ 俺の登場',34,'b','おう','田',0,0)],
 ['x',['🚜','🌽','👴'],'軽トラの荷台で居眠りする爺さん。「トウモロコシ持ってけ」と、売れ残りの代金を握らされた。',M(90)]
]);
sp(0,[
 ['0',['🏛','🧓','🎤'],'朝の公民館。カラオケ教室のおばあちゃんたちが発声練習中。',L('e10','ばあちゃんの腹式呼吸 八十歳 声量で負けたら 恥ずかしい',30,'d','あい','年',0,0)],
 ['1',['🧒','🧒','💢'],'集会室で子どもたちが悪口合戦。\n「おまえんちの母ちゃん出べそ！」「お前んち貧乏ー！」',L('e11','出べそ貧乏と はやし立てても 事実を言えば 突き刺さる',22,'d','あう','家',0,0)],
 ['2',['🗣','🪑','😤'],'町内会の寄り合い。話題は「ヤング長老」のことで持ち切りだ。\n「あの人ね、ヒゲ、取れるのよ。実は十九歳なのよ」',W('w2a')],
 ['x',['🪧','📌','🧐'],'掲示板の貼り紙に「ゴミは分別」「夜は静かに」。守っている人を見たことがない。',L('e12','ゴミは分別と書く貼り紙 守る人ゼロ 貼り紙だけが 町を見張る',27,'s','あう','',0,0)]
]);
sp(0,[
 ['0',['🍸','🧹','🥱'],'朝のスナックは掃除中。ママが言う。\n「昨夜の客の説教、メモしてあるよ。手間賃くれたらあげる」……逆に駄賃をもらった。',M(120)],
 ['1',['🎤','🍢','👩'],'昼のスナック。ママが演歌を練習中。',L('e13','こぶしを回して 三十年 苦労の数だけ 声が出る',32,'s','えう','年',0,0)],
 ['2',['🍺','🥴','🗣'],'酔っ払いが説教を始めた。\n「いいか若造、人生はビールの泡だ！ 消える前に飲め！」',L('e14','人生はビールの泡 消える前に飲め 説教は長いが 名言ではある',28,'w','あう','年',0,0)],
 ['x',['🍶','🎤','🦆'],'隣の席の居酒屋トーク。「DJ軽トラ？ あいつ、軽トラの免許持ってないらしいぜ」',W('w3a')]
]);
sp(0,[
 ['0',['⛩','🧹','👴'],'朝の神社で、神主が落ち葉を掃いている。\n「神頼みもいいが、最後は自分の喉じゃぞ」',L('e15','神頼みはするが 最後に頼れるのは この喉と この気迫',26,'b','','',0,0)],
 ['1',['🔮','🧙','🎴'],'境内の占い師。「あなた、近々大きな戦いがある……みんなに言ってるけど」',L('e16','占いなんか 当たるも八卦 俺の未来は 俺が描く',25,'b','あう','',0,0)],
 ['2',['🌙','🦊','🪔'],'夜の神社。狐の面をつけた子どもが耳打ちしてきた。\n「DJ軽トラのビート、全部ばあちゃんの民謡だよ」',W('w3b')],
 ['x',['🎴','🎴','🙄'],'おみくじは「大凶」。結ぶ場所はもう満杯だった。',N()]
]);
sp(0,[

  let got=null; if(j.ly && !owned(j.ly) && rnd()<0.45){ G.lib[j.ly]=1; got=j.ly; }
  return {pay,got,j};
}
// ------------------------------------------------------------ shop
const priceOf=l=>l.atk*10, sellOf=l=>Math.floor(l.atk*5);
function shopStock(){ const out=[]; for(let c=0;c<=G.ch;c++) SHOP[c].forEach(id=>{ if(!owned(id)) out.push(LY[id]); }); return out; }
function canBuy(l){ return G.money>=priceOf(l) && !owned(l.id); }
function buyL(id){ const l=LY[id]; if(!canBuy(l)) return false; G.money-=priceOf(l); G.lib[id]=1; return true; }
function canSell(l){ return l.weak===undefined && owned(l.id) && lyricsOwned(G).length>SELLMIN; }
function sellL(id){ const l=LY[id]; if(!canSell(l)) return false; G.money+=sellOf(l); delete G.lib[id]; G.deck=G.deck.filter(x=>x!==id); return true; }
// ------------------------------------------------------------ deck
function autoDeckFor(g,oi){
  const o=oi==null?null:OPP[oi];
  const pool=Object.keys(g.lib).map(k=>LY[k]).filter(l=>l.weak===undefined);
  const sc=l=>{
    let s=l.atk; if(o){ s+=6*l.tags.filter(t=>o.tags.includes(t)).length; }
    if(l.rh) s+=3; return s;
  };
  pool.sort((a,b)=>sc(b)-sc(a));
  const out=[], cc={};
  pool.filter(l=>l.lure).slice(0,3).forEach(l=>{ out.push(l.id); cc[l.cat]=(cc[l.cat]||0)+1; });
  // keep a few cards that stay legal under "ATK40以上禁止" and "韻踏み禁止"
  pool.filter(l=>!l.lure&&l.atk<40&&!l.rh).slice(0,3).forEach(l=>{ if(!out.includes(l.id)){ out.push(l.id); cc[l.cat]=(cc[l.cat]||0)+1; } });
  for(const l of pool){ if(out.length>=DECKMAX) break; if(out.includes(l.id)) continue; if((cc[l.cat]||0)>=5) continue; out.push(l.id); cc[l.cat]=(cc[l.cat]||0)+1; }
  for(const l of pool){ if(out.length>=DECKMAX) break; if(!out.includes(l.id)) out.push(l.id); }
  return out;
}
// ------------------------------------------------------------ laws
const lawLabel=L=>L.t==='ban'?`${CAT[L.cat]}禁止`:L.t==='rec'?`${CAT[L.cat]}推奨`:L.t==='atk'?`ATK${L.v}以上禁止`:L.t==='rep'?'同じカテゴリ連続禁止':'韻踏み禁止';
const lawKind=L=>L.t==='rec'?'rec':L.t==='rhy'?'rhy':'ban';
function genLaws(bt){
  const ch=bt.ch;
  const n=rnd()<(bt.o.boss?0.75:[0.12,0.25,0.4][ch])?2:1;
  const wts=[['ban',4],['rec',3],['atk',ch===0?1:2],['rep',0.5+ch],['rhy',[1.3,2.2,3][ch]]];
  const laws=[]; const used={};
  for(let k=0;k<n;k++){
    const av=wts.filter(w=>!used[w[0]]); const tot=av.reduce((a,w)=>a+w[1],0); let r=rnd()*tot, t=av[0][0];
    for(const w of av){ r-=w[1]; if(r<=0){ t=w[0]; break; } }
    used[t]=1;
    const cats=Object.keys(CAT);
    if(t==='ban'||t==='rec'){
      let cat=pick(cats); const other=laws.find(l=>l.t==='ban'||l.t==='rec');
      while(other&&other.cat===cat) cat=pick(cats);
      laws.push({t,cat});
    } else if(t==='atk') laws.push({t,v:40});
    else laws.push({t});
  }
  return laws;
}
// ------------------------------------------------------------ battle core
function mkOppCard(v,i){ return {id:'o'+i,t:v[0],atk:v[1],cat:v[2],rh:v[3],tags:[v[4]],lure:false,opp:true}; }
function newBattle(oi){

  const bt={oi,o,ch:o.ch,hp:{p:CHAPT[o.ch].hp,o:o.hpp},max:{p:CHAPT[o.ch].hp,o:o.hpp},y:{p:0,o:0},round:0,laws:[],first:'p',seq:0,prev:null,lastCat:{p:null,o:null},
    pDeck:shuffle(G.deck.filter(id=>LY[id]&&owned(id)).map(id=>LY[id])),pDisc:[],pHand:[],oDeck:shuffle(o.v.map(mkOppCard)),oDisc:[],oHand:[],phase:'start',winner:null,why:'',cheer:0,verses:0};

}
function drawP(bt){ if(!bt.pDeck.length){ bt.pDeck=shuffle(bt.pDisc); bt.pDisc=[]; } if(!bt.pDeck.length) return false; bt.pHand.push(bt.pDeck.pop()); return true; }
function drawO(bt){ if(!bt.oDeck.length){ bt.oDeck=shuffle(bt.oDisc); bt.oDisc=[]; } if(!bt.oDeck.length) return false; bt.oHand.push(bt.oDeck.pop()); return true; }

function btSetFirst(bt,side){ bt.first=side; bt.phase='turn'; }
const btSide=bt=>bt.seq%2===0?bt.first:(bt.first==='p'?'o':'p');
function lawViol(bt,side,c,forceRh){
  const v=[];
  for(const L of bt.laws){
    if(L.t==='ban'&&c.cat===L.cat) v.push(L);
    else if(L.t==='atk'&&c.atk>=L.v) v.push(L);
    else if(L.t==='rep'&&bt.lastCat[side]===c.cat) v.push(L);
    else if(L.t==='rhy'&&(c.rh||forceRh)) v.push(L);
  }

}
function calc(bt,side,c){
  const prev=bt.prev, lead=!prev, isW=side==='p'&&c.weak===bt.oi;
  let hit=false;
  if(isW) hit=true; else if(!lead && c.tags.some(t=>prev.card.tags.includes(t))) hit=true;
  let m=c.atk*0.5;
  if(hit) m*=HITM; if(lead&&!isW) m*=LEADM;
  const rh=!!(c.rh && prev && prev.rh && c.rh===prev.rh); if(rh) m*=RHYM;
  if(isW) m*=WEAKM;

function btApply(bt,side,c,forceRh){
  const oth=side==='p'?'o':'p';

  const cr=calc(bt,side,c);
  const res={side,card:c,viol:viol.length?viol:null,dmg:0,hit:cr.hit,rh:cr.rh,weak:cr.weak,rec:cr.rec,lead:cr.lead,flag:null,self:0,over:null,forced:!!forceRh,oldPrev:bt.prev};
  if(viol.length){
    bt.y[side]++; res.self=YELP; bt.hp[side]=Math.max(0,bt.hp[side]-YELP); res.flag=bt.y[side]>=2?'red':'yellow';
    if(res.flag==='red') res.over=oth;
  } else { res.dmg=cr.dmg; bt.hp[oth]=Math.max(0,bt.hp[oth]-cr.dmg); }
  if(!res.over){ if(bt.hp.p<=0) res.over='o'; else if(bt.hp.o<=0) res.over='p'; }
  bt.lastCat[side]=c.cat; bt.prev={side,card:c,rh:forceRh?'*':c.rh}; bt.seq++; bt.verses++;
  bt.cheer=Math.min(1,bt.cheer+res.dmg/70+(res.hit&&!res.viol?0.25:0));

  TEL.verses++;

  else if(res.viol){ if(res.flag==='yellow') TEL.oppYellow++; else TEL.oppRed++; }
  if(res.over){ bt.winner=res.over; bt.phase='over'; bt.why=res.flag==='red'?'red':'hp'; }
  else if(bt.seq>=4){
    if(bt.round>=3){ const rp=bt.hp.p/bt.max.p, ro=bt.hp.o/bt.max.o; bt.winner=rp>=ro?'p':'o'; bt.why='judge'; bt.phase='over'; res.over=bt.winner; res.judged=true; }
    else bt.phase='roundEnd';
  }

}
function btPlayP(bt,idx){
  const nl=bt.pHand.filter(x=>!lawViol(bt,'p',x,false).length).length;
  const c=bt.pHand.splice(idx,1)[0];
  const res=btApply(bt,'p',c,false);
  if(res.viol&&TEL.vlog.length<300) TEL.vlog.push({nl,laws:bt.laws.map(lawLabel),card:c.t,cat:c.cat,round:bt.round,seq:bt.seq});
  if(c.weak===undefined) bt.pDisc.push(c);
  if(bt.phase!=='over') drawP(bt);
  return res;
}
// if no card in hand obeys the laws, the judge makes the player redraw (never forces a violation)
function btEnsureLegal(bt){
  const legal=()=>bt.pHand.some(c=>!lawViol(bt,'p',c,false).length);
  if(legal()) return false;
  for(let k=0;k<8;k++){
    const keep=bt.pHand.filter(c=>c.weak!==undefined); const out=bt.pHand.filter(c=>c.weak===undefined);
    bt.pDisc.push(...out); bt.pHand=keep;
    while(bt.pHand.length<HAND && drawP(bt));
    if(legal()) return true;
  }
  return true;
}
function oppPick(bt){
  const o=bt.o, pool=bt.oHand, prev=bt.prev;
  const rhy=bt.laws.find(L=>L.t==='rhy');
  const val=c=>calc(bt,'o',c).dmg+rnd()*0.01;
  const best=(arr)=>arr.reduce((a,c)=>(!a||val(c)>val(a))?c:a,null);
  let c=null, forced=false;
  if(rhy){
    let p; if(!prev) p=o.add; else if(prev.side==='p'&&prev.card.lure) p=Math.min(0.95,o.add*1.5); else p=o.add*0.35;
    if(rnd()<p){
      forced=true;
      const ok=pool.filter(x=>!bt.laws.some(L=>L.t!=='rhy'&&lawViol({laws:[L],lastCat:bt.lastCat},'o',x,false).length));
      c=best(ok.length?ok:pool);
    }
  }
  if(!c){
    let pv=o.sl;
    const h=o.hab.split(':');
    const hl=bt.laws.find(L=>(h[0]==='ban'&&L.t==='ban'&&L.cat===h[1])||(h[0]==='atk'&&L.t==='atk')||(h[0]==='rep'&&L.t==='rep'));
    if(hl) pv=0.5;
    if(rnd()<pv) c=best(pool);
    else { const legal=pool.filter(x=>!lawViol(bt,'o',x,false).length); c=best(legal.length?legal:pool); }
  }
  return {c,forced};
}
function btPlayO(bt){
  const {c,forced}=oppPick(bt);
  const i=bt.oHand.indexOf(c); bt.oHand.splice(i,1); bt.oDisc.push(c);
  const res=btApply(bt,'o',c,forced);
  if(bt.phase!=='over') drawO(bt);
  return res;
}
function btEnd(bt){ // record result in G/TEL
  TEL.matches++; TEL.byOpp[bt.oi].m++;
  if(bt.winner==='p'){ TEL.wins++; TEL.byOpp[bt.oi].w++; }
}
// ------------------------------------------------------------ AI policies
function oppBestReply(bt,c){
  const sv=bt.prev; bt.prev={side:'p',card:c,rh:c.rh};
  let m=0; for(const oc of bt.oHand){ const d=calc(bt,'o',oc).dmg; if(d>m) m=d; }
  bt.prev=sv; return m;
}
function tasFirst(bt){ return 'o'; }
function tasPick(bt){
  const hand=bt.pHand; const rhy=bt.laws.some(L=>L.t==='rhy');
  let best=-1e9, bi=0, anyLegal=hand.some(c=>!lawViol(bt,'p',c,false).length);
  hand.forEach((c,i)=>{
    const v=lawViol(bt,'p',c,false);
    if(anyLegal&&v.length) return;
    const cr=calc(bt,'p',c);
    let s=cr.dmg;
    if(bt.seq<3) s-=0.9*oppBestReply(bt,c);
    if(!cr.hit&&!cr.weak) s-=0.12*c.atk;
    if(rhy&&c.lure&&bt.seq<3) s+=22+55*bt.o.add;
    if(!anyLegal) s-=100*v.length;
    if(s>best){ best=s; bi=i; }
  });
  return bi;
}
function humanFirst(bt){ return rnd()<0.5?'p':'o'; }
function humanPick(bt){
  const hand=bt.pHand; const legal=hand.map((c,i)=>i).filter(i=>!lawViol(bt,'p',hand[i],false).length);
  return legal.length?pick(legal):Math.floor(rnd()*hand.length);
}
function runBattle(bt,fFirst,fPick){
  while(bt.phase!=='over'){
    btStartRound(bt); btSetFirst(bt,fFirst(bt));
    while(bt.phase==='turn'){
      if(btSide(bt)==='p') btEnsureLegal(bt);
      const res=btSide(bt)==='p'?btPlayP(bt,fPick(bt)):btPlayO(bt);
      void res;
    }
    if(bt.phase==='roundEnd') bt.phase='next';
  }
  btEnd(bt); return bt;
}
// ------------------------------------------------------------ headless playthrough helpers (used by tests)
function autoShopping(){
  // sell weakest while buying stronger
  let changed=true, guard=0;
  while(changed&&guard++<40){
    changed=false;
    const stock=shopStock().sort((a,b)=>b.atk-a.atk);
    for(const l of stock){
      if(canBuy(l)){ const mine=lyricsOwned(G); if(l.atk> Math.min(...mine.map(m=>m.atk))+4 || mine.length<DECKMAX){ buyL(l.id); changed=true; break; } }
      else {
        // try selling the weakest to afford
        const mine=lyricsOwned(G).filter(m=>canSell(m)&&m.atk<l.atk-8).sort((a,b)=>a.atk-b.atk);
        let m=G.money, k=0; while(k<mine.length&&m<priceOf(l)){ m+=sellOf(mine[k]); k++; }
        if(m>=priceOf(l)&&k>0&&k<=2){ for(let q=0;q<k;q++) sellL(mine[q].id); buyL(l.id); changed=true; break; }
      }
    }
  }
}
function humanShopping(){
  const stock=shopStock().sort((a,b)=>b.atk-a.atk);
  for(const l of stock) if(canBuy(l)) buyL(l.id);
}
function simChapter(mode){ // run one chapter exploration (mode 'human'|'tas'), returns after day>5
  G.day=1; G.slot=0;
  if(mode==='human'){
    for(let i=0;i<15;i++){
      const r=rnd();
      if(r<0.7) doExplore(Math.floor(rnd()*7)); else doJob(Math.floor(rnd()*3),jobMult(rnd()));
      advance();
    }
    humanShopping();
  }
  G.day=5; G.slot=0; // not used further
}
function exploreTAS(){
  G.day=1; G.slot=0;
  while(true){
    let bs=-1,bv=-1;
    for(let s=0;s<7;s++){ const v=evValue(evFor(G.ch,s,G.day,G.slot)); if(v>bv){bv=v;bs=s;} }
    if(bv>=[28,32,40][G.ch]) doExplore(bs); else doJob(2,1.5);
    if(G.slot===2&&G.day===4) { /* shop before last day handled by UI/auto */ }
    if(advance()) break;
  }
}
function simRun(mode,maxCh){
  G=newG(); let firstTry=[null,null,null], matchRes=[];
  for(let ch=0;ch<=maxCh;ch++){
    G.ch=ch; G.fight=0;
    let attempts=0;
    // exploration
    if(mode==='human'){ simChapter('human'); } else { exploreTAS(); autoShopping(); }
    G.day=5; takeSnap();
    while(attempts<8){
      attempts++;
      let ok=true;
      for(let f=0;f<3;f++){
        const oi=ch*3+f;
        if(mode==='tas'){ G.deck=autoDeckFor(G,oi); } else G.deck=autoDeckFor(G,oi);
        const bt=newBattle(oi); runBattle(bt,mode==='tas'?tasFirst:humanFirst,mode==='tas'?tasPick:humanPick);
        matchRes.push([oi,bt.winner==='p',bt.why,attempts]);
        if(bt.winner!=='p'){ ok=false; break; }
      }
      if(firstTry[ch]===null) firstTry[ch]=ok;
      if(ok) break;
      restoreSnap();
      if(mode==='human'){ for(let i=0;i<3;i++){ const r=rnd(); if(r<0.7) doExplore(Math.floor(rnd()*7)); else doJob(Math.floor(rnd()*3),jobMult(rnd())); } humanShopping(); }
      else { /* tas */ autoShopping(); }
      takeSnap();
    }
    if(!matchRes.length||matchRes[matchRes.length-1][1]===false&&attempts>=8) break;
  }
  return {firstTry,matchRes};
}

function ac(){

      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

}
function tone(f,t0,dur,type,vol,f2){

// beat (90 BPM boom-bap)
let beatOn=false, beatTimer=0, nextStep=0, stepNo=0;
const BPM=90, STEP=60/BPM/4;
const BASS=[55,0,0,55,0,0,65.4,0, 0,0,73.4,0, 55,0,49,0];
function beatStep(n,t){
  const s=n%16, bar=Math.floor(n/16)%4;
  if(s===0||s===7||(s===10&&bar%2===1)||(s===14&&bar===3)){ tone(130,t,.2,'sine',.55,42); }
  if(s===4||s===12){ noise(t,.14,.28,1200); tone(190,t,.1,'triangle',.2,120); }
  if(s%2===0) noise(t,.04,.07+(s%4===0?.03:0),7000);
  if(s===15&&bar%2===0) noise(t,.03,.06,7000);
  const b=BASS[s]; if(b) tone(b*(bar>=2?1.122:1),t,STEP*2.2,'triangle',.4);
  if(s===8&&bar%2===0){ [220,262,330].forEach(f=>tone(f,t,STEP*3,'sine',.07)); }
}
function beatTick(){
  if(!beatOn||!AC) return;
  while(nextStep<AC.currentTime+0.18){ beatStep(stepNo,nextStep); stepNo++; nextStep+=STEP; }
}
function beat(on){
  if(on===beatOn) return; beatOn=on;
  if(on){ if(!ac()) return; nextStep=AC.currentTime+0.05; stepNo=0; clearInterval(beatTimer); beatTimer=setInterval(beatTick,40); }
  else clearInterval(beatTimer);
}

function shopPlanNext(){
  const stock=shopStock().sort((a,b)=>b.atk-a.atk);
  const mine=lyricsOwned(G);
  const minAtk=Math.min(...mine.map(m=>m.atk));
  for(const l of stock){
    if(l.lure&&mine.filter(m=>m.lure).length>=3) continue;
    if(!(l.atk>minAtk+4||mine.length<DECKMAX)) continue;
    if(canBuy(l)) return {op:'buy',id:l.id};
    const sellable=mine.filter(m=>canSell(m)&&m.atk<l.atk-8).sort((a,b)=>a.atk-b.atk);
    let m=G.money,k=0; while(k<sellable.length&&m<priceOf(l)){ m+=sellable[k].atk*5|0; k++; }
    if(m>=priceOf(l)&&k>0&&k<=2) return {op:'sell',id:sellable[0].id};
  }
  return null;
}

function tick(dt){
  T+=dt;
  V.shake=Math.max(0,V.shake-dt*2.4); V.whistle=Math.max(0,V.whistle-dt); V.rap=Math.max(0,V.rap-dt); V.hop=Math.max(0,V.hop-dt*1.3); V.hurt=Math.max(0,V.hurt-dt);
  if(bt&&scr==='battle'){ bt.cheer=Math.max(0,bt.cheer-dt*0.1); V.cheer+=(bt.cheer-V.cheer)*Math.min(1,dt*4); }
  else V.cheer=Math.max(0,V.cheer-dt*.5);
  for(let i=0;i<Q.length;i++) Q[i].t-=dt;
  if(Q.length){ const due=Q.filter(q=>q.t<=0); if(due.length){ Q=Q.filter(q=>q.t>0); due.forEach(q=>{ if(q.s===scr) q.fn(); }); } }
  if(scr==='battle') tickReveal(dt);
  if(scr==='job'&&sd.phase==='play'){
    if(sd.pause>0) sd.pause-=dt;
    else {
      const prev=jobPos(); sd.ph+=dt*sd.spd*(auto?1.5:1); const cur=jobPos();
      if(auto&&((prev-0.5)*(cur-0.5)<=0)){ sd.ph=Math.round(sd.ph/Math.PI)*Math.PI; jobStop(0.5); }
    }
    const mk=$('mk'); if(mk) mk.style.left=(jobPos()*100)+'%';
  }
  if(scr==='result') sd.t+=dt;
  updateFX(dt);
  autoCool-=dt;
  if(auto&&autoCool<=0&&!busy()){ const gp=autoAct(); autoCool=gp||0.12; }
}

  get muted(){ return muted; },

  setAuto, setMute, seed, rnd, simRun, newG, autoDeckFor, tasPick, tasFirst, humanPick, humanFirst, newBattle, runBattle, lawViol, calc,
  setG(g){ G=g; }, dbg, pendingLaws:null
};
})();
</script>
<!-- zoom guard: ピンチ・ダブルタップでズームしない -->
<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
