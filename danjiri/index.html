<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="岸和田のだんじり祭がモチーフ。連打で曳いて、やりまわし（角の直角ターン）に命をかける。倒れたら向こう3年出場停止。パーツを付け替えて派手に目立て。10年でめざせ伝説の若頭。">
<title>俺の地元最高</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<style>
html,body{touch-action:manipulation}
:root{--ind:#141a3a;--ind2:#26346a;--paper:#f4e9cf;--ver:#d4361f;--gold:#f0c33c;--grn:#35d07f;--red:#ff4a4a;--mute:#b9bedb;--line:rgba(255,255,255,.22);--card:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{color:#fff;background:linear-gradient(170deg,var(--ind),var(--ind2)) fixed;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;max-width:1100px;height:100%;margin:0 auto;padding:calc(4px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px}
#top{display:flex;align-items:center;gap:6px;flex:none}
#top a{color:var(--mute);text-decoration:none;font-size:13px;white-space:nowrap;padding:8px 2px}
#top h1{flex:1;margin:0;text-align:center;font-size:17px;letter-spacing:.08em;white-space:nowrap;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.mini{font-size:12px;border:2px solid var(--line);border-radius:999px;padding:4px 10px;min-height:34px;background:var(--card);white-space:nowrap;font-weight:700}
#autoBtn[aria-pressed=true]{background:#e8503f;border-color:#ffb3a8}
#sndBtn[aria-pressed=false]{background:#555;color:#ccc}
#info{display:flex;gap:5px;flex:none}
#info span{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:800;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info b{color:var(--gold)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#stage{position:relative;flex:none;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#101830}
#cv{display:block;width:100%;aspect-ratio:13/10;touch-action:none}
#toast{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 #7a1608,0 0 14px rgba(0,0,0,.7);pointer-events:none;opacity:0;letter-spacing:.06em}
#toast.on{animation:tp 1.1s ease-out}
@keyframes tp{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:12px;padding:2px 0 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
h2{margin:2px 0 4px;font-size:18px;color:var(--gold);text-align:center;letter-spacing:.05em}
.sub{margin:0 0 6px;text-align:center;font-size:12px;color:var(--mute)}
.big{display:block;width:100%;min-height:50px;border-radius:15px;background:linear-gradient(180deg,#ffd34d,#ff9f2e);color:#3a1d00;font-size:18px;font-weight:900;box-shadow:0 4px 0 #a85d00;text-align:center;text-decoration:none;line-height:50px;margin:6px 0;padding:0 8px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a85d00}
.big[disabled]{filter:grayscale(1) brightness(.7);pointer-events:none}
.alt{display:block;width:100%;min-height:42px;border-radius:13px;background:rgba(255,255,255,.13);border:2px solid var(--line);font-weight:800;text-align:center;text-decoration:none;color:inherit;line-height:38px;margin:5px 0}
.alt[disabled]{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{display:block;width:100%;text-align:left;border-radius:13px;background:var(--card);border:2px solid var(--line);padding:8px 10px;margin:5px 0;min-height:48px}
.card:active{background:rgba(255,255,255,.18)}
.card[disabled]{opacity:.45;pointer-events:none}
.card b{font-size:15px}
.card small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.card.sel{border-color:var(--gold);background:rgba(240,195,60,.16)}
.card .tag{float:right;font-size:11px;font-weight:900;background:var(--ver);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px}
.card .tag.g{background:#1d8a55}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px}
.tab{border-radius:10px;border:2px solid var(--line);background:var(--card);padding:3px 2px;font-size:12px;font-weight:800;text-align:center;min-height:42px;line-height:1.2;overflow:hidden}
.tab small{display:block;font-size:10px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{border-color:var(--gold);background:rgba(240,195,60,.22)}
.cmp{display:grid;grid-template-columns:50px 1fr 76px;gap:6px;align-items:center;font-size:12px;font-weight:800;margin:2px 0}
.cmp span{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
.cb{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
.cb i{position:absolute;top:0;bottom:0;display:block}
.cb .base{left:0;background:#7d8fd6}
.cb .up{background:var(--grn)}
.cb .dn{background:var(--red)}
.cb .ov{background:var(--red);opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chips em{font-style:normal;font-size:11px;font-weight:800;background:rgba(0,0,0,.35);border-radius:6px;padding:0 5px}
.chips em.p{color:#7dffb4}.chips em.m{color:#ff9a9a}
.sticky{position:sticky;bottom:0;background:#18204a;padding-top:4px;border-top:1px solid var(--line)}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-bottom:5px}
.g{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--mute)}
.g label{width:32px;flex:none}
.bar{position:relative;flex:1;height:15px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grn)}
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:2}
.bar em{position:absolute;inset:0;text-align:center;font-style:normal;font-size:10px;line-height:13px;color:#fff;text-shadow:0 1px 2px #000;z-index:3}
.pad{display:flex;gap:7px;height:calc(100% - 66px);min-height:110px}
.pb{flex:1;border-radius:22px;border:3px solid #ffd9a8;background:linear-gradient(180deg,#ff9a3a,#d6430c);box-shadow:0 7px 0 #7a2a00,0 10px 22px rgba(0,0,0,.4);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;line-height:1.15}
.pb small{font-size:11px;font-weight:700;opacity:.92}
.pb.jmp,.pb.tur{font-size:17px;white-space:nowrap}
.pb.pull{flex:2.1;font-size:28px}
.pb.tur{background:linear-gradient(180deg,#5aa8ff,#2058c8);border-color:#cfe4ff;box-shadow:0 7px 0 #0f2f78,0 10px 22px rgba(0,0,0,.4)}
.pb.jmp{background:linear-gradient(180deg,#f4d04a,#c98a0a);border-color:#fff1b0;box-shadow:0 7px 0 #6d4a00,0 10px 22px rgba(0,0,0,.4)}
.pb.dn,.pb:active{transform:translateY(5px);box-shadow:0 2px 0 #333}
.pb:focus-visible{outline:3px solid #fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:3px 5px;text-align:left;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(240,195,60,.22);color:#fff3b0;font-weight:900}
.note{font-size:12px;color:var(--mute);margin:4px 2px}
.ban{background:#6a1010;border:2px solid #ff8a8a;border-radius:12px;padding:8px 10px;margin:4px 0;font-weight:800;font-size:13px}
.log{font-size:12px;line-height:1.5;margin:2px 0}
.log div{border-bottom:1px dashed var(--line);padding:2px 0}
.log .bad{color:#ff9a9a}.log .good{color:#ffe27a}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px;background:rgba(0,0,0,.3)}
.hint{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
@media (min-width:900px){#app{max-width:1240px}#main{flex-direction:row}#stage{flex:1.5;align-self:flex-start}#panel{flex:1}#top h1{font-size:20px}.pad{height:300px;flex:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a href="../">← 一覧</a>
    <h1>俺の地元最高</h1>
    <button id="autoBtn" class="mini" aria-pressed="false" title="オート（Oキー）">🤖 オート</button>
    <button id="sndBtn" class="mini" aria-pressed="true" aria-label="音">🔊</button>
  </header>
  <div id="info"></div>
  <div id="main">
    <div id="stage"><canvas id="cv" width="780" height="600" aria-label="だんじり"></canvas><div id="toast"></div></div>
    <div id="panel"></div>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function crng(C){C.rs=(C.rs+0x6D2B79F5)>>>0;let t=C.rs;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
function normal(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2831853*r());}
const yen=n=>'¥'+Math.round(n).toLocaleString('en-US');
const KMH=2.4;
let SIMDT=1/30,STEADY_V=8.8;

/* ================= data ================= */
const SLOTS=[['roof','大屋根','🏯'],['sroof','小屋根','⛩️'],['carve','彫物','🐉'],['wheel','車輪','🛞'],['rope','綱','🪢'],['lever','梃子','🪵'],['music','鳴物','🥁'],['lantern','提灯','🏮']];
const PARTS={};
function defParts(slot,list){PARTS[slot]=list.map((a,i)=>({slot,id:slot+i,tier:i,n:a[0],p:a[1],y:a[2],spd:a[3],turn:a[4],dur:a[5],wt:a[6],fl:a[7],note:a[8]}));}
defParts('roof',[
 ['杉板の素屋根',0,1,0,0,3,6,2,'ありあわせの板ぶき。素朴で、ふつうに丈夫。'],
 ['そり屋根（軽）',500,1,1,2,2,4,3,'反りを深くした軽い屋根。重心が低くて曲がりやすい。'],
 ['檜皮ぶき重厚屋根',1800,3,-1,-1,6,10,7,'どっしり黒瓦。壊れにくく、見栄えも立派。ただし重い。'],
 ['金鯱の大屋根',4200,6,0,0,4,8,10,'金の鯱をいただく大屋根。町の誇りや。']]);
defParts('sroof',[
 ['素の小屋根',0,1,0,0,1,3,1,'飾りなしのシンプルな小屋根。'],
 ['唐破風の小屋根',400,1,0,1,1,3,4,'真ん中に唐破風（からはふ）。ぐっと格が上がる。'],
 ['二重唐破風',1500,4,0,0,2,5,7,'唐破風が二重。正面から見るとめっちゃ映える。'],
 ['千鳥破風・金',3500,7,0,0,2,6,9,'金ぴかの破風を重ねた最高級の小屋根。']]);
defParts('carve',[
 ['素木のまま',0,1,0,0,1,2,0,'彫物なし。木の香りだけ。'],
 ['波に龍の彫物',600,1,0,0,1,4,4,'腰回りに波と龍。金で縁どりした彫物。'],
 ['源平合戦の彫物',2200,3,0,0,2,7,8,'武者が駆ける大彫物。町の自慢になる。'],
 ['金箔総彫り',5000,6,0,0,1,9,12,'全面に金箔。ひと目で「あの町や」とわかる。']]);
defParts('wheel',[
 ['樫のコマ',0,1,2,2,2,6,0,'ふつうの樫の木。'],
 ['軽量欅のコマ',700,1,3,3,1,4,0,'軽くて回る欅。速いけど少し割れやすい。'],
 ['鉄輪巻きの堅牢コマ',1600,3,2,1,6,9,0,'鉄の輪を巻いた頑丈なコマ。重いけど壊れへん。'],
 ['匠のコマ',4500,6,4,5,4,6,1,'名人が削った真円のコマ。速くて曲がる。']]);
defParts('rope',[
 ['麻綱',0,1,2,0,1,2,0,'ふつうの麻の綱。'],
 ['太綱（綿入り）',500,1,4,0,2,4,0,'太くて曳きやすい綱。'],
 ['絹まぜの引き綱',1800,4,6,0,2,3,3,'しなやかで力が逃げへん。'],
 ['紅白の大綱',3800,7,8,0,3,4,6,'紅白の大綱。曳き手の気合いが違う。']]);
defParts('lever',[
 ['並の梃子',0,1,0,2,0,3,0,'ふつうの梃子棒。'],
 ['長梃子',600,1,-1,5,0,5,0,'長くてよう曲がる。少し取りまわしが重い。'],
 ['鋼芯梃子',2000,4,0,7,2,5,0,'鋼の芯入り。やりまわしが決まる。'],
 ['名工の梃子',4600,7,0,10,3,4,1,'名工の逸品。思いどおりに曲がる。']]);
defParts('music',[
 ['小太鼓と鉦',0,1,0,0,0,1,2,'最低限のお囃子。'],
 ['大太鼓',500,1,1,0,0,3,4,'腹に響く大太鼓。曳き手の足が軽なる。'],
 ['鉦・笛そろえ',1600,3,2,0,0,3,7,'太鼓・鉦・笛がそろった本格囃子。'],
 ['名人囃子連',3500,6,3,0,0,4,10,'名人ぞろいの囃子連。町中が沸く。']]);
defParts('lantern',[
 ['紙提灯',0,1,0,0,0,1,1,'ふつうの紙提灯。'],
 ['家紋入り提灯',300,1,0,0,0,2,3,'町の家紋入り。夜に映える。'],
 ['百灯の提灯',1400,3,0,0,0,3,6,'ずらっと並ぶ百の灯り。本宮で効く。'],
 ['千灯の大提灯',3200,6,0,0,0,5,10,'千の灯が夜を焦がす。']]);
const BYID={};for(const k in PARTS)PARTS[k].forEach(p=>BYID[p.id]=p);
const BASE={dur:4,wt:10};
const COURSES={
 yoi:{id:'yoi',name:'宵宮',sub:'夕暮れの曳行',L:336,night:.35,corners:[{at:96,s:.7,d:1},{at:200,s:.85,d:-1},{at:296,s:1,d:1}],fights:[152]},
 hon:{id:'hon',name:'本宮',sub:'灯入れ曳行',L:450,night:1,corners:[{at:88,s:.75,d:1},{at:184,s:.9,d:-1},{at:280,s:.85,d:1},{at:376,s:1,d:-1}],fights:[136,328]}
};
const RIVALS=['鯱ヶ丘町','白波町','天狗橋町','紅葉坂町','龍尾町','大楠町'];
const RV0=7.3,RV1=.2,RSP=[1,.6,.2,-.2,-.6,-1];
function rivalTimes(cid,year){const co=COURSES[cid];return RIVALS.map((n,i)=>({n,t:co.L/(RV0+RV1*(year-1)+RSP[i])+3.5*co.fights.length}));}
function rankOf(cid,year,time){let r=1;for(const q of rivalTimes(cid,year))if(q.t<time)r++;return r;}

/* ================= stats ================= */
function sumsOf(eq){const s={spd:0,turn:0,dur:BASE.dur,wt:BASE.wt,fl:0,lan:0};for(const [k] of SLOTS){const p=BYID[eq[k]];s.spd+=p.spd;s.turn+=p.turn;s.dur+=p.dur;s.wt+=p.wt;s.fl+=p.fl;if(k==='lantern')s.lan=p.fl;}return s;}
function capOf(C){return 24+C.members*1.5+C.train*2;}
function deriveS(C,s){const cap=capOf(C),over=Math.max(0,s.wt-cap),wm=Math.max(.55,1-.022*over);
 return {spd:s.spd,turn:s.turn,dur:s.dur,wt:s.wt,fl:s.fl,lan:s.lan,cap,over,wm,vmax:(8+s.spd*.45)*wm*(1+C.train*.004),vsafe:(5.5+s.turn*.35)*Math.max(.7,1-.008*over),limit:1+s.dur*.012,
  tauA:1.6/(1+s.spd*.02+C.train*.02),tauD:2.2+s.wt*.03,fpow:.85+cap*.004+s.wt*.004,dmg:.3*24/(24+s.dur)};}
function derive(C,eq){return deriveS(C,sumsOf(eq));}
function flEff(st,night){return st.fl-st.lan+st.lan*(.6+1.6*night);}

/* ================= race engine ================= */
function mkRace(cid,C,eq,seed){
 const co=COURSES[cid],st=derive(C,eq),rng=mulberry(seed>>>0);
 return {cid,co,st,year:C.year,rng,t:0,pos:0,v:0,tapR:0,tapS:0,taps:0,stam:1,tired:false,phase:'run',ci:0,fi:0,cor:null,fight:null,
  yaw:0,roll:0,tiltV:0,flash:0,flE:flEff(st,co.night),crowd:20,hp:C.hp,pen:0,fW:0,fL:0,god:0,great:0,ok:0,slow:0,perf:0,good:0,whiff:0,
  nb:{t:.9,hit:false},pbT:-9,pbHit:true,jumpT:-1,crashT:0,done:false,result:null,ev:[],tta:9,lastGrade:'',intro:0,pol:null,fightAt:-1};
}
function beatOK(R){if(R.phase!=='run')return false;const cn=R.co.corners[R.ci];if(cn){const tta=(cn.at-R.pos)/Math.max(R.v,.5);if(tta<2.4&&tta>-.3)return false;}
 const fp=R.co.fights[R.fi];if(fp!==undefined&&fp-R.pos<14)return false;return true;}
function addFlash(R,p){R.flash+=p*(1+R.flE*.02);}
function pull(R){if(R.done||R.phase==='crash')return;R.tapR+=2;R.taps++;if(R.phase==='fight'){R.fight.g=Math.min(1,R.fight.g+.03*R.st.fpow);R.ev.push('push');}else R.ev.push('tap');}
function jump(R){if(R.done||R.phase==='crash')return false;if(R.jumpT>=0&&R.jumpT<.22)return false;R.jumpT=0;R.ev.push('jump');
 if(!beatOK(R))return false;
 const d=Math.abs(R.t-R.nb.t),dp=Math.abs(R.t-R.pbT),usePrev=dp<d,dd=Math.min(d,dp);
 if(usePrev?R.pbHit:R.nb.hit){R.whiff++;R.crowd=Math.max(0,R.crowd-3);return false;}
 if(dd<=.15){ if(usePrev)R.pbHit=true;else R.nb.hit=true;
  if(dd<=.07){R.perf++;addFlash(R,9);R.crowd=Math.min(100,R.crowd+10);R.ev.push('perf');R.lastPose='perf';return 'perf';}
  R.good++;addFlash(R,4);R.crowd=Math.min(100,R.crowd+5);R.ev.push('good');R.lastPose='good';return 'good';}
 R.whiff++;R.crowd=Math.max(0,R.crowd-3);R.ev.push('whiff');return false;}
function turn(R){if(R.done||R.phase!=='run')return false;const cn=R.co.corners[R.ci];if(!cn)return false;
 const tta=(cn.at-R.pos)/Math.max(R.v,.5);if(tta>2.2)return false;doTurn(R,tta-.30);return true;}
function doTurn(R,e){const cn=R.co.corners[R.ci],st=R.st;const vs=st.vsafe*(1.15-.3*cn.s);const ex=Math.max(0,R.v/vs-1);
 const tilt=.25+ex*2.4+Math.min(1,Math.abs(e)/.45)*.6;
 R.cor={cn,e,tilt,vIn:R.v,u:0,dur:1.5,crash:tilt>=st.limit,vs,ex};R.phase='corner';R.ev.push('turn');}
function crashNow(R){R.phase='crash';R.crashT=0;R.ev.push('crash');R.rollSign=R.cor?R.cor.cn.d:1;R.roll=Math.max(Math.abs(R.roll),.35);}
function raceStep(R,dt){
 if(R.done)return;
 R.t+=dt;const st=R.st,co=R.co;
 R.tapR*=Math.exp(-dt/.5);R.tapS+=(R.tapR-R.tapS)*(1-Math.exp(-dt/.3));
 if(R.phase!=='crash')R.crowd=Math.max(0,R.crowd-dt*(R.crowd>15?1.4:0));
 if(R.jumpT>=0){R.jumpT+=dt;if(R.jumpT>.55)R.jumpT=-1;}
 if(R.phase==='crash'){R.crashT+=dt;R.v*=Math.exp(-dt*2.6);R.pos+=R.v*dt;R.roll=Math.min(1.55,R.roll+dt*(1.4+R.crashT*2));if(R.crashT>3.2){R.done=true;R.result=finishData(R);}return;}
 // beats
 if(R.t>=R.nb.t+.2){if(beatOK(R)&&!R.nb.hit){R.crowd=Math.max(0,R.crowd-1);R.ev.push('beatmiss');}
  R.pbT=R.nb.t;R.pbHit=R.nb.hit;const iv=.95-.3*clamp(R.v/st.vmax,0,1);R.nb={t:R.nb.t+iv,hit:false,iv};if(R.nb.t<R.t)R.nb.t=R.t+.2;}
 if(R.phase==='fight'){fightStep(R,dt);return;}
 // pull / speed
 const q=Math.min(1,R.tapS/7);
 if(R.tapR>8.5)R.stam-=(R.tapR-8.5)*.04*dt;else R.stam=Math.min(1,R.stam+.07*dt);
 if(R.stam<=0){R.stam=0;R.tired=true;}else if(R.tired&&R.stam>.3)R.tired=false;
 const eff=q*(R.tired?.6:1)*(R.hp<=0?.6:1);
 const vt=st.vmax*eff,tau=vt>R.v?st.tauA:st.tauD;
 R.v+=(vt-R.v)*(1-Math.exp(-dt/tau));R.pos+=R.v*dt;
 R.flash+=R.flE*R.crowd*.012*dt;
 R.crowd=Math.min(100,R.crowd+(R.v/st.vmax)*2.2*dt);
 if(R.phase==='run'){
  const cn=co.corners[R.ci];
  if(cn){R.tta=(cn.at-R.pos)/Math.max(R.v,.5);if(R.tta<-.5){doTurn(R,.6);}}
  const fp=co.fights[R.fi];
  if(R.phase==='run'&&fp!==undefined&&R.pos>=fp){R.phase='fight';R.fight={g:.5,t:0,ph:R.rng()*6,rival:RIVALS[(R.fi*2+R.year)%6]};R.v=0;R.ev.push('fightStart');return;}
 } else if(R.phase==='corner'){
  const c=R.cor;c.u+=dt/c.dur;const u=clamp(c.u,0,1),h=Math.sin(Math.PI*u);

 }

}
function finishCorner(R){const c=R.cor,st=R.st,lim=st.limit,ae=Math.abs(c.e);let g;
 if(ae<=.08&&c.tilt>=lim*.72)g='god';else if(ae<=.18&&c.tilt>=lim*.5)g='great';else g=c.ex<.05?'slow':'ok';
 const pts={god:220,great:100,ok:45,slow:15}[g],cr={god:30,great:18,ok:8,slow:2}[g];
 R[g]++;addFlash(R,pts);R.crowd=Math.min(100,R.crowd+cr);R.lastGrade=g;R.lastTilt=c.tilt;
 R.v*=1-.10*c.cn.s-.05*(c.tilt/lim);if(c.tilt>.85*lim)R.hp=Math.max(0,R.hp-.05);
 R.ev.push('grade_'+g);R.ci++;R.phase='run';R.cor=null;R.yaw=0;R.roll=0;R.tiltV=0;}
function fightStep(R,dt){const f=R.fight;f.t+=dt;R.v=0;
 const surge=(Math.sin(f.t*2.3+f.ph)+1)/2,push=(.18+.02*R.year)*(.7+.9*surge);f.push=push;
 f.g=Math.max(0,f.g-push*dt);
 if(f.g>=1||f.g<=0||f.t>10){const win=f.g>.5;
  if(win){R.fW++;addFlash(R,120);R.crowd=Math.min(100,R.crowd+25);R.ev.push('fightWin');}
  else{R.fL++;R.pen+=2.5;R.hp=Math.max(0,R.hp-R.st.dmg);R.crowd=Math.max(0,R.crowd-8);R.ev.push('fightLose');}
  f.win=win;f.end=true;R.lastFight=f;R.fight=null;R.fi++;R.phase='run';R.v=0;}}
function finishData(R){const crash=R.phase==='crash';return {crash,time:crash?null:R.t+R.pen,flash:Math.round(R.flash),fW:R.fW,fL:R.fL,god:R.god,great:R.great,ok:R.ok,slow:R.slow,perf:R.perf,good:R.good,whiff:R.whiff,hp:R.hp,taps:R.taps};}

/* ================= policies (auto / careful / rush / random) ================= */
function coastV(R,dist,rate,tr0){let v=R.v,x=0,tr=tr0===undefined?R.tapR:tr0,ts=Math.max(R.tapS,Math.min(tr,R.tapS+(tr-R.tapR)));const st=R.st,k=Math.exp(-.05/.5),k2=Math.exp(-.05/.3);for(let i=0;i<400&&x<dist;i++){tr=rate+(tr-rate)*k;ts=tr+(ts-tr)*k2;const vt=st.vmax*Math.min(1,ts/7);v+=(vt-v)*(1-Math.exp(-.05/(vt>v?st.tauA:st.tauD)));x+=v*.05;}return v;}
function mkPol(name,seed){return {name,rng:mulberry((seed^0x9e3779b9)>>>0),acc:0,rT:0,rate:5,ci:-1,coast:false,hold:false};}
function cornerSpeed(st,cn,tilt){const vs=st.vsafe*(1.15-.3*cn.s);return Math.min(st.vmax,vs*(1+(tilt-.25)/2.4));}
function polStep(R,dt){
 const P=R.pol,st=R.st,rng=P.rng,nm=P.name;
 if(R.done||R.phase==='crash')return;
 const tapAt=r=>{P.acc+=r*dt;while(P.acc>=1){P.acc-=1;pull(R);}};
 if(R.phase==='fight'){tapAt(nm==='auto'?22:nm==='random'?3+rng()*6:nm==='careful'?7:(nm==='human'||nm==='steady')?7.5:8.5);return;}
 if(beatOK(R)){
  if(nm==='auto'){if(!R.nb.hit&&R.t>=R.nb.t-dt*.5)jump(R);}
  else if(nm==='random'){if(rng()<dt*1.2)jump(R);}
  else{if(P.jnB!==R.nb.t){P.jnB=R.nb.t;P.jn=normal(rng)*(nm==='rush'?.09:(nm==='human'||nm==='steady')?.07:.06);P.jdone=false;}
   if(!P.jdone&&R.t>=R.nb.t+P.jn){P.jdone=true;jump(R);}}
 }
 const cn=R.co.corners[R.ci];
 let rate=nm==='auto'?7.8:nm==='careful'?6.8:(nm==='human'||nm==='steady')?7.2:nm==='rush'?8.5:0;
 if(nm==='random'){if(R.t>=P.rT){P.rT=R.t+.7+rng();P.rate=rng()*9;}rate=P.rate;}
 if(R.phase==='run'&&cn){
  const tta=(cn.at-R.pos)/Math.max(R.v,.5);
  if(P.ci!==R.ci){P.ci=R.ci;P.coast=false;P.hold=false;P.eN=normal(rng)*.12;P.eR=-.5+rng()*2.1;P.skip=rng()<.2;}
  if(nm==='auto'||nm==='careful'||nm==='human'||nm==='steady'){
   const vc=nm==='steady'?Math.min(st.vmax,STEADY_V):cornerSpeed(st,cn,nm==='auto'?st.limit-.07:nm==='human'?.8:.55);
   const d=Math.max(0,cn.at-R.pos-.30*vc);
   if(!P.coast&&!P.hold&&vc<st.vmax&&d<260){if(coastV(R,d,0,Math.max(R.tapR,rate*1.16))>vc)P.coast=true;}
   if(P.coast&&R.v<=vc){P.coast=false;P.hold=true;}
   if(P.coast)rate=0;else if(P.hold)rate=vc*.97/st.vmax*7;
   if(nm==='auto'){if(tta<=.30+dt*.5)turn(R);}else if(nm==='human'||nm==='steady'){if(tta<=.30+P.eN*.7)turn(R);}else if(tta<=.24)turn(R);
  }else if(nm==='rush'){if(tta<=.30+P.eN)turn(R);}
  else{if(!P.skip&&tta<=.30+P.eR)turn(R);}
 }
 tapAt(rate);
}
function runRace(R,dt,vary){dt=dt||1/30;let g=0;while(!R.done&&g++<80000){const h=vary?.004+Math.random()*.03:dt;polStep(R,h);raceStep(R,h);R.ev.length=0;}return R.result;}

/* ================= career ================= */
const MERCH=[{id:'happi',n:'法被',e:'👘',base:340,note:'町の法被を売る。単価が高い。'},{id:'tenugui',n:'手ぬぐい',e:'🧣',base:220,note:'柄入り手ぬぐい。手ごろでよう売れる。'},{id:'tako',n:'たこ焼き屋台',e:'🐙',base:270,note:'ソースの香りで客を呼ぶ。町の評判もちょっと上がる。'}];
const DON=[{id:'machi',n:'町内会をまわる',e:'🏘️',base:300,note:'いつもの町内。かならず少しは包んでくれる。',p:C=>1},
 {id:'shop',n:'商店街のお店',e:'🏪',base:460,note:'店先でお願い。たまに断られる。',p:C=>.85},
 {id:'corp',n:'地元企業に頭を下げる',e:'🏢',base:900,note:'大口。評判がええほど通りやすい。ダメなら気持ちだけ。',p:C=>clamp(.25+C.rep/120,.25,.9)}];
function newCareer(seed){const own={},eq={};for(const [k] of SLOTS){own[k]=[k+'0'];eq[k]=k+'0';}
 return {rs:(seed>>>0)||1,year:1,days:8,phase:'prep',funds:800,rep:20,members:12,train:0,own,eq,hp:1,lastFlash:0,banLeft:0,banned:false,banCount:0,bannedYears:0,streak:0,maxStreak:0,score:0,god:0,log:[],yr:{yoi:null,hon:null,crash:false},pop:0,raced:0,rankSum:0,flashTot:0,sum:null,done:false};}
function startYear(C){C.days=8;C.banned=C.banLeft>0;C.yr={yoi:null,hon:null,crash:false};C.pop=Math.floor(crng(C)*3);C.phase='prep';C.sum=null;}
const yearMul=C=>1+.06*(C.year-1);
function merchYen(C,i,taps){return Math.round(MERCH[i].base*(C.pop===i?1.5:1)*(.6+.8*Math.min(1,taps/36))*yearMul(C)*(.85+C.rep/250));}
function doMerch(C,i,taps){const y=merchYen(C,i,taps);C.funds+=y;if(i===2)C.rep=Math.min(100,C.rep+1);C.days--;return y;}
function donMul(C){return(.7+C.rep/200)*(1+Math.min(.25,C.lastFlash/8000))*yearMul(C);}
function donEV(C,i){const d=DON[i],p=d.p(C);return p*d.base*donMul(C)+(1-p)*150;}
function doDonate(C,i){const d=DON[i],p=d.p(C),ok=crng(C)<p;const y=Math.round(ok?d.base*donMul(C):150);C.funds+=y;C.days--;return{y,ok};}
function practiceGain(taps){return .5+Math.min(1,taps/30);}
function doPractice(C,taps){const g=practiceGain(taps);C.train+=g;C.days--;return g;}
function prepAuto(C){
 if(C.train<Math.min(14,1.2*C.year)&&C.days>2)return{k:'prac'};
 let bm=0,bv=-1;for(let i=0;i<3;i++){const v=MERCH[i].base*(C.pop===i?1.5:1)+(i===2?40:0);if(v>bv){bv=v;bm=i;}}
 const mv=merchYen(C,bm,99);let bd=0,dv=-1;for(let i=0;i<3;i++){const v=donEV(C,i);if(v>dv){dv=v;bd=i;}}
 return mv>=dv?{k:'merch',i:bm}:{k:'don',i:bd};}
function owns(C,id){return C.own[BYID[id].slot].includes(id);}
function buyEquip(C,id){const p=BYID[id];if(p.y>C.year)return'locked';if(!owns(C,id)){if(C.funds<p.p)return'nofunds';C.funds-=p.p;C.own[p.slot].push(id);}C.eq[p.slot]=id;return'ok';}
/* partial score of a race result (used for ranking & for auto-assemble) */
function racePts(C,kind,res){if(res.crash)return -1500;const rank=rankOf(kind,C.year,res.time);return(7-rank)*100+res.flash*.25+res.fW*50+res.god*30;}
function evalEq(C,eq,seed){let s=0;for(const k of['yoi','hon']){const R=mkRace(k,C,eq,seed+(k==='hon'?7:0));R.pol=mkPol('auto',seed);const res=runRace(R,SIMDT);s+=racePts(C,k,res)-(res.time||0)*10;}return s;}
function estU(C,s){const d=deriveS(C,s);let U=0;
 for(const k of['yoi','hon']){const co=COURSES[k];const vcs=co.corners.map(cn=>cornerSpeed(d,cn,d.limit-.07));const vm=vcs.reduce((a,b)=>a+b,0)/vcs.length;
  const T=co.L/(.55*d.vmax+.45*vm)+co.corners.length*.8;const fe=flEff(d,co.night);U+=-T*45+.5*(fe*.012*T*45+fe*(6+2*co.corners.length)*.4);}

function autoAssemble(C,opt){
 opt=opt||{};const top=opt.top||8,seed=opt.seed||12345;
 const opts=SLOTS.map(([k])=>PARTS[k].filter(p=>p.y<=C.year&&(C.own[k].includes(p.id)||p.p<=C.funds)));
 const cands=[];const cur=new Array(SLOTS.length);
 (function rec(i,cost,sp,tu,du,wt,fl,ln){
  if(i===SLOTS.length){const s={spd:sp,turn:tu,dur:du,wt,fl,lan:ln};cands.push({ids:cur.slice(),cost,u:estU(C,s)-cost*.01});return;}
  const k=SLOTS[i][0];
  for(const p of opts[i]){const c=cost+(C.own[k].includes(p.id)?0:p.p);if(c>C.funds)continue;cur[i]=p.id;rec(i+1,c,sp+p.spd,tu+p.turn,du+p.dur,wt+p.wt,fl+p.fl,k==='lantern'?p.fl:ln);}
 })(0,0,0,0,BASE.dur,BASE.wt,0,0);
 cands.sort((a,b)=>b.u-a.u);
 const mk=ids=>{const eq={};SLOTS.forEach(([k],i)=>eq[k]=ids[i]);return eq;};
 const list=cands.slice(0,top).map(c=>({eq:mk(c.ids),cost:c.cost}));
 list.push({eq:Object.assign({},C.eq),cost:0});
 let best=null,bv=-1e9;
 for(const c of list){const v=evalEq(C,c.eq,seed)-c.cost*.012;if(v>bv){bv=v;best=c;}}

function applyEq(C,eq){for(const [k] of SLOTS)buyEquip(C,eq[k]);}
function randomAssemble(C,rng){for(const [k] of SLOTS){const l=PARTS[k].filter(p=>p.y<=C.year&&(C.own[k].includes(p.id)||p.p<=C.funds));const p=l[Math.floor(rng()*l.length)];if(rng()<.6)buyEquip(C,p.id);}}
function recordRace(C,kind,res){res.kind=kind;
 if(res.crash){C.yr.crash=true;C.yr[kind]=res;res.pts=0;return res;}
 res.rank=rankOf(kind,C.year,res.time);res.pts=Math.round((7-res.rank)*100+res.flash*.25+res.fW*50+res.god*30);C.yr[kind]=res;C.god+=res.god;C.raced++;C.rankSum+=res.rank;C.flashTot+=res.flash;C.hp=res.hp;return res;}
function closeYear(C){const y=C.yr,rs=[y.yoi,y.hon].filter(r=>r&&!r.crash);let pts=0,txt,tone,repD=0,memD=0;
 const flashAvg=rs.length?rs.reduce((a,r)=>a+r.flash,0)/rs.length:0;
 if(C.banned){pts=-300;repD=-5;memD=-1;C.banLeft--;C.bannedYears++;C.streak=0;txt=`出場停止中（のこり${C.banLeft}年）。資金集めだけの年`;tone='bad';}
 else if(y.crash){pts=rs.reduce((a,r)=>a+r.pts,0);repD=-15;memD=-3;C.banLeft=3;C.banCount++;C.streak=0;
  const k=y.yoi&&y.yoi.crash?'宵宮':'本宮';txt=`${k}のやりまわしで横転！向こう3年出場停止`;tone='bad';}
 else{pts=rs.reduce((a,r)=>a+r.pts,0);const ar=rs.reduce((a,r)=>a+r.rank,0)/rs.length;
  repD=Math.round((4-ar)*3+flashAvg/400+rs.reduce((a,r)=>a+r.fW-r.fL,0)*2);memD=(ar<=2?2:ar<=4?1:0)+(C.rep>=50?1:0);
  C.streak++;C.maxStreak=Math.max(C.maxStreak,C.streak);
  txt=`宵宮${y.yoi.rank}位・本宮${y.hon.rank}位／派手さ${Math.round(y.yoi.flash+y.hon.flash)}／神やりまわし${y.yoi.god+y.hon.god}`;tone=ar<=2?'good':'';}
 C.rep=clamp(C.rep+repD,0,100);C.members=Math.max(6,C.members+memD);C.lastFlash=flashAvg||C.lastFlash*.7;
 let repair=(y.crash?1200:Math.round((1-C.hp)*600))+500+400*C.year;repair=Math.min(repair,C.funds);C.funds-=repair;C.hp=1;
 C.score+=pts;const row={y:C.year,txt,tone,pts};C.log.push(row);
 C.sum={pts,repD,memD,repair,txt,tone,banned:C.banned,crash:y.crash};

function advance(C){if(C.year>=10){C.done=true;C.phase='end';return false;}C.year++;startYear(C);return true;}
function finalScore(C){return Math.round(C.score+C.rep*10);}
const TITLES=[[28000,'伝説の若頭','町の語り草。祭りの神さんも惚れる走りやった。'],[20000,'名物若頭','この人が曳くと町が沸く。堂々の名物男。'],[12000,'頼れる若頭','しっかり町をまとめた。来年も任せたで！'],[5000,'一人前の若頭','なんとか祭りを守りきった。伸びしろ十分や。'],[-1e9,'見習い若頭','まだまだこれから。もう一回、ええ祭りにしようや。']];
function titleOf(sc){return TITLES.find(t=>sc>=t[0]);}
/* headless career (balance testing) */
function simCareer(pol,seed,dt){if(dt)SIMDT=dt;seed=seed>>>0||1;const C=newCareer(seed),rng=mulberry(seed*7+3);startYear(C);let races=0,crashRaces=0;const ranks=[];
 for(let yr=1;yr<=10;yr++){
  while(C.days>0){let a=pol==='random'?[{k:'prac'},{k:'merch',i:Math.floor(rng()*3)},{k:'don',i:Math.floor(rng()*3)}][Math.floor(rng()*3)]:prepAuto(C);
   const taps=pol==='random'?rng()*54:pol==='auto'?54:40;
   if(a.k==='prac')doPractice(C,taps);else if(a.k==='merch')doMerch(C,a.i,taps);else doDonate(C,a.i);}
  if(pol==='random')randomAssemble(C,rng);else applyEq(C,autoAssemble(C,{seed:seed+yr}));
  if(!C.banned){let k=0;for(const kind of['yoi','hon']){const R=mkRace(kind,C,C.eq,seed*13+yr*5+k++);R.pol=mkPol(pol,seed+yr+k);const res=recordRace(C,kind,runRace(R,SIMDT));races++;if(res.crash){crashRaces++;break;}ranks.push(res.rank);}}
  closeYear(C);advance(C);}
 const sc=finalScore(C);return{score:sc,crashes:C.banCount,bannedYears:C.bannedYears,races,crashRaces,avgRank:ranks.length?ranks.reduce((a,b)=>a+b,0)/ranks.length:null,flashAvg:C.raced?C.flashTot/C.raced:0,god:C.god,rep:C.rep,streak:C.maxStreak,funds:C.funds,train:C.train,members:C.members};}

function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}

/* --- assemble --- */
function statRows(C,cur,nw){ // returns html of compare rows
 const a=deriveS(C,cur),b=deriveS(C,nw),ne=(c,d)=>flEff(d,1);
 const rows=[
  ['速さ',a.vmax*KMH,b.vmax*KMH,17*KMH,'km/h',0],
  ['曲がり',a.vsafe*KMH,b.vsafe*KMH,12*KMH,'安全km/h',0],
  ['耐久',a.dur,b.dur,36,'',0],
  ['派手さ',flEff(a,1),flEff(b,1),75,'',0]];
 let h=rows.map(r=>cmpRow(r[0],r[1],r[2],r[3],r[4])).join('');
 const cap=a.cap,mx=Math.max(cap,a.wt,b.wt)*1.05;
 const over=b.wt>cap;
 h+=`<div class="cmp"><label>重さ</label><div class="cb"><i class="base" style="width:${Math.min(a.wt,b.wt)/mx*100}%"></i>${b.wt>a.wt?`<i class="${over?'ov':'up'}" style="left:${a.wt/mx*100}%;width:${(b.wt-a.wt)/mx*100}%"></i>`:b.wt<a.wt?`<i class="up" style="left:${b.wt/mx*100}%;width:${(a.wt-b.wt)/mx*100}%;opacity:.6"></i>`:''}<i style="left:${cap/mx*100}%;width:2px;background:var(--gold);z-index:2"></i></div><span style="${over?'color:#ff8a8a':''}">${a.wt}${a.wt!==b.wt?'→'+b.wt:''}/${cap.toFixed(0)}</span></div>`;
 return h+(over?`<p class="note" style="color:#ff9a9a;margin:2px">⚠ 積載オーバー！ 速さ・曲がりが落ちる（団員や練習で積載を増やそう）</p>`:'');}
function cmpRow(lab,a,b,mx,unit){const lo=Math.min(a,b),hi=Math.max(a,b);
 const cls=b>a?'up':'dn';
 return `<div class="cmp"><label>${lab}</label><div class="cb"><i class="base" style="width:${clamp(lo/mx,0,1)*100}%"></i>${b!==a?`<i class="${cls}" style="left:${clamp(lo/mx,0,1)*100}%;width:${clamp((hi-lo)/mx,0,1)*100}%"></i>`:''}</div><span style="${b>a?'color:#7dffb4':b<a?'color:#ff9a9a':''}">${Math.round(a)}${b!==a?'→'+Math.round(b):''}</span></div>`;}
function partChips(p){const f=(n,v)=>v?`<em class="${v>0?'p':'m'}">${n}${v>0?'+':''}${v}</em>`:'';return `<div class="chips">${f('速',p.spd)}${f('曲',p.turn)}${f('耐',p.dur)}<em>重${p.wt}</em>${f('派',p.fl)}</div>`;}
function renderAsm(){const C=G.C,A=G.asm,slot=A.slot;
 const cur=sumsOf(C.eq),selId=A.sel,np=selId?BYID[selId]:null;
 const eq2=np?Object.assign({},C.eq,{[np.slot]:np.id}):C.eq,nw=sumsOf(eq2);
 const tabs=SLOTS.map(([k,n,e])=>`<button class="tab ${k===slot?'on':''}" data-a="slot:${k}">${e} ${n}<small>${esc(BYID[C.eq[k]].n)}</small></button>`).join('');
 const list=PARTS[slot].map(p=>{const locked=p.y>C.year,own=owns(C,p.id),eqd=C.eq[slot]===p.id;
  if(locked)return `<div class="card" style="opacity:.5;cursor:default"><b>🔒 ???</b><span class="tag g">${p.y}年目から</span><small>まだ店に並んでいない。</small></div>`;
  return `<button class="card ${selId===p.id?'sel':''}" data-a="pick:${p.id}"><b>${esc(p.n)}</b>${eqd?'<span class="tag g">装備中</span>':own?'<span class="tag g">所持</span>':`<span class="tag">${yen(p.p)}</span>`}<small>${esc(p.note)}</small>${partChips(p)}</button>`;}).join('');
 let act='';
 if(np){const own=owns(C,np.id),eqd=C.eq[slot]===np.id;
  act=eqd?`<button class="big" disabled>装備中</button>`:own?`<button class="big" data-a="equip">装備する</button>`:C.funds>=np.p?`<button class="big" data-a="equip">${yen(np.p)}で買って装備</button>`:`<button class="big" disabled>資金不足（${yen(np.p)}）</button>`;}
 else act=`<button class="big" disabled>パーツを選んでください</button>`;
 P(`<div class="tabs">${tabs}</div>${statRows(C,cur,nw)}<div style="margin-top:4px">${list}</div>
  <div class="sticky">${act}<div class="row2"><button class="alt" data-a="auto-asm">🤖 おまかせ</button><button class="alt" data-a="asm-done">✔ 完了</button></div></div>`);
 const sc=$('panel');}

function newGame(seed){ac();G.C=newCareer(seed!==undefined?seed:(Math.random()*4294967296)>>>0);startYear(G.C);G.note='';G.autoAsm=false;G.endInfo=null;G.R=null;saveCareer();G.save=null;setScene('prep');}
function contGame(){ac();G.C=G.save;G.note='';G.autoAsm=false;G.R=null;G.save=null;setScene('prep');}

function miniTap(){const m=G.mini;if(!m||G.scene!=='mini')return;m.taps++;sfx('tap');spawnCoin(m);}
function finishMini(){const C=G.C,m=G.mini;let msg;
 if(m.kind==='merch'){const y=doMerch(C,m.i,m.taps);msg=`${MERCH[m.i].n}で ${yen(y)} 稼いだ！（${m.taps}回）`;sfx('coin');}
 else{const g=doPractice(C,m.taps);msg=`練習！ 団員の体力 +${g.toFixed(1)}（積載 ${capOf(C).toFixed(0)}）`;sfx('good');}
 G.note=msg;G.mini=null;saveCareer();setScene('prep');}

function startRace(kind){const C=G.C;C.phase=kind;const seed=(crng(C)*4294967296)>>>0;const R=mkRace(kind,C,C.eq,seed);if(G.auto)R.pol=mkPol('auto',seed);R.intro=1.5;G.R=R;G.fx=[];G.txt=[];G.shake=0;G.note='';setScene('race');toast('ヨーイ…');}
function raceDone(){const C=G.C,R=G.R,kind=R.cid,res=recordRace(C,kind,R.result);G.res=res;const b=G.best;
 if(!res.crash){if(!b.tYoi&&kind==='yoi'||kind==='yoi'&&res.time<b.tYoi)b.tYoi=res.time;if(!b.tHon&&kind==='hon'||kind==='hon'&&res.time<b.tHon)b.tHon=res.time;}
 if(res.flash>b.flash)b.flash=res.flash;if(C.god>b.god)b.god=C.god;if(C.maxStreak>b.streak)b.streak=C.maxStreak;saveBest();
 if(res.crash){sfx('crash');}else sfx('goal');
 setScene('result');}
function toYearEnd(){closeYear(G.C);setScene('yearend');}

function act(a){ac();const C=G.C;const [k,v]=a.split(':');
 switch(k){
 case'new':sfx('start');newGame();break;
 case'cont':sfx('start');contGame();break;

 case'log':sfx('ui');setScene('log');break;
 case'asm':sfx('ui');openAsm('prep');break;
 case'asm2':sfx('ui');openAsm('result');break;

 case'pick':sfx('ui');G.asm.sel=G.asm.sel===v?null:v;renderAsm();break;
 case'equip':equipSel();break;
 case'auto-asm':{sfx('coin');applyEq(C,autoAssemble(C,{seed:C.year*31+C.funds}));saveCareer();G.asm.sel=null;renderAsm();updInfo();break;}
 case'asm-done':sfx('ui');asmDone();break;
 case'race':sfx('start');startRace(v);break;
 case'skip':sfx('ui');toYearEnd();break;

function setAuto(on){G.auto=!!on;$('autoBtn').setAttribute('aria-pressed',G.auto?'true':'false');
 if(G.auto){ac();const R=G.R;if(G.scene==='race'&&R&&!R.done){R.pol=R.pol||mkPol('auto',(R.rng()*4294967296)>>>0);}G.at=0;}
 else if(G.R&&G.R.pol&&G.scene==='race')G.R.pol=null;
 G.mul=G.auto?2.4:1;}

addEventListener('keydown',e=>{

 const k=e.code;
 if(G.scene==='race'){
  if(k==='Space'||k==='Enter'||k==='KeyF'||k==='KeyJ'){e.preventDefault();if(G.auto&&e.isTrusted)setAuto(false);pd('pull');document.getElementById('bPull')&&document.getElementById('bPull').classList.add('dn');}
  else if(k==='ArrowLeft'||k==='ArrowRight'||k==='KeyX'||k==='ArrowDown'){e.preventDefault();if(G.auto&&e.isTrusted)setAuto(false);if(!e.repeat)pd('turn');}
  else if(k==='ArrowUp'||k==='KeyZ'){e.preventDefault();if(G.auto&&e.isTrusted)setAuto(false);if(!e.repeat)pd('jump');}
 }else if(G.scene==='mini'){if(k==='Space'||k==='Enter'){e.preventDefault();if(G.auto)setAuto(false);miniTap();}}

});

function spawnConfetti(n,x,y){const cols=['#d4361f','#f0c33c','#fff','#2a56b8','#1d8a55','#ff8fb0'];for(let i=0;i<n;i++)G.fx.push({k:'conf',x:x===undefined?Math.random()*W:x+(Math.random()-.5)*40,y:y===undefined?-10-Math.random()*80:y,vx:(Math.random()-.5)*(x===undefined?120:320),vy:x===undefined?(50+Math.random()*120):(-120-Math.random()*220),life:2.4+Math.random()*1.6,col:cols[i%6],w:4+Math.random()*5,h:3+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*12});}
function spawnDust(x,y,n,big){for(let i=0;i<n;i++)G.fx.push({k:'dust',x:x+(Math.random()-.5)*30,y:y-Math.random()*10,vx:(Math.random()-.3)*(big?160:70),vy:-(20+Math.random()*(big?120:50)),life:.7+Math.random()*(big?1.2:.5),max:1.4,r:(big?14:7)+Math.random()*(big?18:8)});}
function spawnCoin(m){G.fx.push({k:'txt',s:m.kind==='merch'?['まいど！','毎度あり','ええ品や'][m.taps%3]:'エッサ！',x:W/2+(Math.random()-.5)*360,y:190+Math.random()*40,vx:0,vy:-60,life:.8,col:'#ffe27a',size:22});}
function say(s,x,y,col,size){G.txt.push({s,x,y,vy:-46,life:1.1,max:1.1,col:col||'#fff',size:size||26});}
function fxStep(dt){const f=G.fx;for(let i=f.length-1;i>=0;i--){const p=f[i];p.life-=dt;if(p.life<=0){f.splice(i,1);continue;}p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.k==='conf'){p.vy+=60*dt;p.vx*=.995;p.r+=p.vr*dt;}else if(p.k==='dust'){p.vy*=.96;p.vx*=.96;p.r+=14*dt;}}
 const t=G.txt;for(let i=t.length-1;i>=0;i--){const p=t[i];p.life-=dt;if(p.life<=0){t.splice(i,1);continue;}p.y+=p.vy*dt;p.vy*=.95;}
 G.shake=Math.max(0,G.shake-dt*40);}
function fxDraw(c){for(const p of G.fx){if(p.k==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.col;c.globalAlpha=Math.min(1,p.life);c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore();}
  else if(p.k==='dust'){c.globalAlpha=Math.max(0,p.life/p.max)*.55;c.fillStyle='#d8c39a';circ(c,p.x,p.y,p.r);c.fill();}
  else if(p.k==='txt'){c.globalAlpha=Math.min(1,p.life*1.6);c.fillStyle=p.col;c.font='900 '+p.size+'px '+FONT;c.textAlign='center';c.strokeStyle=INK;c.lineWidth=4;c.strokeText(p.s,p.x,p.y);c.fillText(p.s,p.x,p.y);}}
 c.globalAlpha=1;
 for(const p of G.txt){c.globalAlpha=Math.min(1,p.life*2);c.font='900 '+p.size+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=5;c.strokeText(p.s,p.x,p.y);c.fillStyle=p.col;c.fillText(p.s,p.x,p.y);}
 c.globalAlpha=1;}
function outText(c,s,x,y,size,col,sw,font,al){c.font='900 '+size+'px '+(font||FONT);c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=sw||6;c.strokeText(s,x,y);c.fillStyle=col||'#fff';c.fillText(s,x,y);}

 switch(e){
 case'tap':sfx('tap');break;
 case'push':sfx('push');if(Math.random()<.18)say(['エイッ！','ソーリャ！','負けるな！','気張れ！'][Math.random()*4|0],DANX+(Math.random()-.5)*160,GY-150,'#ffe27a',24);G.shake=Math.max(G.shake,2);break;
 case'jump':sfx('jump');break;
 case'perf':sfx('perf');say('決まった！',DANX,cy-30,'#ffe27a',30);spawnConfetti(10,DANX,cy);break;
 case'good':sfx('good');say('ええで！',DANX,cy-30,'#9ef0c0',24);break;
 case'whiff':sfx('whiff');break;
 case'turn':sfx('turn');say('ソーリャ！',DANX+140,GY-170,'#fff',30);break;
 case'grade_god':sfx('grade_god');toast('神やりまわし！！');spawnConfetti(50);G.shake=8;break;

 case'grade_slow':sfx('grade_slow');toast('ゆっくり曲がった');break;

 case'fightLose':sfx('fightLose');toast('押し負けた…');break;

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
