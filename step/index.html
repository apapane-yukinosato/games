<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="音楽に合わせて矢印をふむ音ゲー。コーギーといっしょにステップ！">
<title>コギ・ステップ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{ --bg:#140F2A; --panel:#211A45; --line:#3A2F75; --ink:#F3EEFF; --mute:#A89CD6; --pink:#FF5FA2; --blue:#4FB7FF; --lemon:#FFE14D; --mint:#4FE3A6; color-scheme:dark; }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.disp{font-family:"Dela Gothic One",sans-serif;font-weight:400}
#app{height:100%;box-sizing:border-box;max-width:560px;margin:0 auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
#top{display:flex;align-items:center;gap:8px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800}
#top h1{flex:1;margin:0;text-align:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel);color:var(--ink);cursor:pointer}
.mini[aria-pressed=true]{background:var(--pink);border-color:#FF9CC6}
.mini:focus-visible{outline:2px solid var(--lemon);outline-offset:2px}
#stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#0B0820}
#cv{display:block;width:100%;height:100%;touch-action:none}
#pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{font:inherit;font-size:30px;height:74px;border:2px solid var(--line);border-radius:16px;background:linear-gradient(#2B2260,#1A1440);color:var(--ink);cursor:pointer;touch-action:none;box-shadow:0 4px 0 #0A0720}
.pad.on{transform:translateY(3px);box-shadow:0 1px 0 #0A0720;background:linear-gradient(#FF5FA2,#B8347A);border-color:#FF9CC6}
.pad:focus-visible{outline:2px solid var(--lemon);outline-offset:2px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;background:rgba(10,7,25,.84);overflow:auto;z-index:5}
.card{background:#F7F3FF;color:#1D1638;border-radius:18px;padding:16px;width:100%;max-width:420px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card h2{margin:0 0 4px;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:26px;text-align:center;color:#E23E86}
.card .sub{text-align:center;font-size:12px;color:#6D6490;margin:0 0 8px}
.songs{display:grid;gap:6px;margin:8px 0}
.song{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font:inherit;text-align:left;border:2px solid #DCD3F5;border-radius:12px;background:#fff;color:#1D1638;padding:8px 10px;cursor:pointer}
.song b{font-size:15px}
.song span{font-size:11px;color:#6D6490}
.song i{grid-row:1/3;grid-column:2;font-style:normal;font-size:11px;color:#9A88D8;text-align:right;align-self:center;white-space:nowrap}
.song[aria-pressed=true]{border-color:#E23E86;background:#FFE8F2}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;font-size:12px;font-weight:800;color:#6D6490}
.row .lab{width:62px;flex:none}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;font:inherit;font-weight:800;font-size:12px;padding:7px 0;border:2px solid #DCD3F5;border-radius:10px;background:#fff;color:#1D1638;cursor:pointer}
.seg button[aria-pressed=true]{background:#1D1638;border-color:#1D1638;color:#fff}
.seg button span{display:block;font-size:10px;font-weight:500;opacity:.75}
.go{font:inherit;font-weight:800;font-size:17px;width:100%;min-height:50px;border:0;border-radius:14px;cursor:pointer;margin-top:8px;background:#E23E86;color:#fff;box-shadow:0 4px 0 #9A1F55}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #9A1F55}
.go.alt{background:#E6DFF7;color:#1D1638;box-shadow:0 4px 0 #BFB3E0}
.go.dl{font-size:14px;min-height:40px;margin:2px 0 8px}
.go:disabled{opacity:.7;cursor:default}
.go:focus-visible,.song:focus-visible,.seg button:focus-visible{outline:3px solid #4FB7FF;outline-offset:2px}
.note{font-size:11px;color:#6D6490;text-align:center;margin:6px 0}
.grade{font-family:"Dela Gothic One",sans-serif;font-size:64px;text-align:center;line-height:1;margin:4px 0;color:#E23E86}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px;margin:8px 0}
.rows b{text-align:right;font-variant-numeric:tabular-nums}
.back{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:#6D6490;text-decoration:none}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1 class="disp">コギ・ステップ！</h1>
    <button class="mini" id="autoBtn" aria-pressed="false">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="ov" id="menuOv">
      <div class="card">
        <h2>コギ・ステップ！</h2>
        <p class="sub">音楽に合わせて、上のわくに矢印がかさなった瞬間にふもう！</p>
        <div class="songs" id="songs"></div>
        <button class="go alt dl" id="dlBtn">⬇ 曲をダウンロード</button>
        <div class="row"><span class="lab">むずかしさ</span><div class="seg" id="diffs"></div></div>
        <div class="row"><span class="lab">スピード</span><div class="seg" id="speeds"></div></div>
        <div class="row"><span class="lab">タイミング</span><div class="seg" id="offs"><button data-o="-10">−10ms</button><button id="offVal" disabled style="opacity:1">0ms</button><button data-o="10">＋10ms</button></div></div>
        <button class="go" id="startBtn">▶ スタート</button>
        <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
        <p class="note">キーボード：← ↓ ↑ →（D F J K でもOK）／ O オート ／ P ポーズ<br>長い矢印（フリーズ）は、終わりまでおしつづけよう</p>
        <p class="note">ワイヤレスイヤホンで音がおくれるときは「タイミング」を＋にしてね</p>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>

    <div class="ov" id="resultOv" hidden>
      <div class="card">
        <p class="sub" id="resSong"></p>
        <div class="grade" id="resGrade">A</div>
        <p class="note" id="resMsg" style="font-size:13px;font-weight:800"></p>
        <div class="rows" id="resRows"></div>
        <button class="go" id="againBtn">もう一回</button>
        <button class="go alt" id="toMenuBtn">曲をえらぶ</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>

    <div class="ov" id="pauseOv" hidden>
      <div class="card" style="max-width:300px">
        <h2>ポーズ</h2>
        <button class="go" id="resumeBtn">つづける</button>
        <button class="go alt" id="quitBtn">曲をえらぶ</button>
      </div>
    </div>
  </div>
  <div id="pads">
    <button class="pad" data-l="0" aria-label="左">←</button>
    <button class="pad" data-l="1" aria-label="下">↓</button>
    <button class="pad" data-l="2" aria-label="上">↑</button>
    <button class="pad" data-l="3" aria-label="右">→</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d');
const FONT='"M PLUS Rounded 1c",sans-serif', DISP='"Dela Gothic One",sans-serif';
const LANES=4, ROT=[-Math.PI/2,Math.PI,0,Math.PI/2];   // arrow rotation for ← ↓ ↑ →  (base arrow points up)
const WIN={perfect:.045,great:.09,good:.135};
const LEAD=2.0;                                         // seconds before beat 0

// ---------- songs (generated music) ----------
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
const SONGS=[
  {id:'pop',  title:'コギコギ・ポップ',       bpm:120,root:60,scale:'major',prog:[0,5,3,4],bars:32,lead:'square',  hat:2,swing:0,  color:'#FF8FB1',seed:11},
  {id:'night',title:'ミッドナイト・ドッグラン',bpm:140,root:57,scale:'minor',prog:[0,5,2,6],bars:40,lead:'sawtooth',hat:2,swing:0,  color:'#7A8CFF',seed:23},
  {id:'hyper',title:'ワンダフル・ハイパー',    bpm:170,root:62,scale:'major',prog:[0,4,5,3],bars:48,lead:'square',  hat:4,swing:0,  color:'#FFD25A',seed:37},
  {id:'jazz', title:'コーギー・チェンジズ',     bpm:160,root:60,scale:'major',prog:[0,0,0,0],bars:40,lead:'sawtooth',hat:0,swing:1,  color:'#4FD1C5',seed:59,style:'jazz',sax:1},
];
const DIFFS=[{name:'かんたん'},{name:'ふつう'},{name:'むずかしい'}];
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function degNote(song,deg,oct=0){ const sc=SCALES[song.scale], n=sc.length, o=Math.floor(deg/n), d=((deg%n)+n)%n; return song.root+sc[d]+12*(o+oct); }
function section(song,bar){ const B=song.bars; if(bar<4)return'intro'; if(bar>=B-4)return'outro'; if(bar>=B/2-2&&bar<B/2+2)return'break'; return 'main'; }
// ---------- jazz: swing, walking bass, ride cymbal, piano comping ----------
// the form moves key centres by major thirds (C → A♭ → E), the harmonic idea John Coltrane made famous.
// the chord order and the melody are original to this game.
const PCN={C:0,Db:1,D:2,Eb:3,E:4,F:5,'F#':6,G:7,Ab:8,A:9,Bb:10,B:11};
const QUAL={maj7:[0,4,7,11],'7':[0,4,7,10],m7:[0,3,7,10]}, COMPV={maj7:[4,11,14],'7':[4,10,14],m7:[3,10,14]};
const JAZZ_FORM=('C maj7,Eb 7,Ab maj7,B 7,E maj7,G 7,C maj7,C maj7,F# m7,B 7,E maj7,G 7,C maj7,Eb 7,Ab maj7,Ab maj7,'+
  'D m7,G 7,C maj7,Eb 7,Ab maj7,B 7,E maj7,E maj7,Bb m7,Eb 7,Ab maj7,B 7,E maj7,G 7,D m7,G 7').split(',').map(x=>{ const [n,q]=x.split(' '); return {pc:PCN[n],q}; });
function composeJazz(song){
  const r=rng(song.seed), ev=[], mel=[], SW=2/3, B=song.bars, pick=a=>a[r()*a.length|0];
  const II={pc:2,q:'m7'}, V={pc:7,q:'7'}, I={pc:0,q:'maj7'};
  const halves=[];
  for(let bar=0;bar<B;bar++) for(let h=0;h<2;h++){
    if(bar<4||bar===B-4||bar===B-3) halves.push(h?V:II);            // intro / turnaround: Dm7 G7
    else if(bar>=B-2) halves.push(I);                                 // ending on Cmaj7
    else halves.push(JAZZ_FORM[((bar-4)%16)*2+h]); }
  const chordAt=b=>halves[Math.max(0,Math.min(halves.length-1,Math.floor(b/2+1e-6)))];
  const same=(a,b)=>a.pc===b.pc&&a.q===b.q;
  const tones=c=>QUAL[c.q].map(x=>(c.pc+x)%12);
  const near=(pcs,to,lo,hi)=>{ let best=lo,bd=1e9; for(let m=lo;m<=hi;m++){ if(!pcs.includes(((m%12)+12)%12)) continue; const d=Math.abs(m-to); if(d<bd){ bd=d; best=m; } } return best; };
  const voicing=c=>COMPV[c.q].map(i=>{ let m=c.pc+i+48; while(m<52)m+=12; while(m>67)m-=12; return m; });
  // rhythm section
  let bp=43;
  for(let bar=0;bar<B;bar++){
    const sec=section(song,bar), b0=bar*4;
    if(bar===B-1) continue;                                           // the final hit is placed below
    if(bar===B-2){ ev.push({t:b0,type:'ride',vol:1.5,open:1},{t:b0,type:'kick',vol:.8},{t:b0,type:'snare',vol:.5});
      ev.push({t:b0,type:'bass',midi:36,dur:7,wave:'triangle',vol:1.8},{t:b0,type:'comp',notes:voicing(I).concat([60,64]),dur:7,vol:1.3}); continue; }
    if(sec==='break'){ const c=chordAt(b0), m=near([c.pc],bp,36,50); bp=m;   // stop-time: everyone hits beat 1, the lead plays alone
      ev.push({t:b0,type:'ride',vol:1.3,open:1},{t:b0,type:'kick',vol:.6},{t:b0,type:'snare',vol:.45},{t:b0,type:'bass',midi:m,dur:1,wave:'triangle',vol:1.8},{t:b0,type:'comp',notes:voicing(c),dur:.6,vol:1}); continue; }
    const soft=sec==='intro'?.6:1;
    for(const x of [0,1,1+SW,2,3,3+SW]) ev.push({t:b0+x,type:'ride',vol:soft*(x%1?.65:(x===1||x===3)?1:.85)});
    ev.push({t:b0+1,type:'hat',vol:.6},{t:b0+3,type:'hat',vol:.6});
    if(sec!=='intro'){ for(let q=0;q<4;q++){ ev.push({t:b0+q,type:'kick',vol:.2}); if(r()<.22) ev.push({t:b0+q+SW,type:'snare',vol:.16}); }
      if(r()<.2) ev.push({t:b0+3+SW,type:'snare',vol:.4}); }
    for(let q=0;q<4;q++){ const beat=b0+q, c=chordAt(beat), nx=chordAt(beat+1); let m;       // walking bass
      if(beat===0||!same(chordAt(beat-1),c)) m=near([c.pc],bp,36,50);
      else if(!same(nx,c)) m=near([nx.pc],bp,37,49)+(r()<.5?1:-1);           // chromatic approach to the next root
      else m=near(tones(c).slice(1),bp+(bp>46?-3:3),36,52);
      ev.push({t:beat,type:'bass',midi:m,dur:.85,wave:'triangle',vol:1.8}); bp=m; }
    for(let h=0;h<2;h++){ const st=b0+h*2, c=halves[bar*2+h], x=r(), v=voicing(c);                 // piano comping
      if(x<.45) ev.push({t:st,type:'comp',notes:v,dur:.5,vol:soft});
      else if(x<.8&&st>0) ev.push({t:st-(1-SW),type:'comp',notes:v,dur:.7,vol:soft});   // anticipation on the swung "and"
      else ev.push({t:st,type:'comp',notes:v,dur:.4,vol:soft},{t:st+1+SW,type:'comp',notes:v,dur:.3,vol:soft*.8}); }
  }
  ev.push({t:(B-1)*4+3.99,type:'kick',vol:.001});
  // melody: chorus 1 = a simple head, chorus 2 = swung bebop eighths
  const HEAD=[[[0,2]],[[0,1],[1,1]],[[0,SW],[SW,1-SW],[1,1]],[[0,1],[1,SW],[1+SW,1-SW]],[[0,1.5]]];
  const SOLO=[[[0,SW],[SW,1-SW],[1,SW],[1+SW,1-SW]],[[0,1],[1,SW],[1+SW,1-SW]],[[SW,1-SW],[1,SW],[1+SW,1-SW]],[[0,SW],[SW,1-SW],[1,1]],[[0,SW],[SW,1-SW],[1,SW],[1+SW,1-SW]]];
  const headRhy=[]; for(let ph=0;ph<2;ph++){ const a=[]; for(let k=0;k<8;k++) a.push(k===7?[[0,1.5]]:k===3?pick([HEAD[0],HEAD[1]]):pick(HEAD)); headRhy.push(a); }
  let prev=67;
  const place=(t0,rhy,segEnd)=>{ for(const [st,len] of rhy){ const t=t0+st, c=chordAt(t), last=t+len>=segEnd-1e-6, nx=chordAt(segEnd), onBeat=Math.abs(t-Math.round(t))<1e-6;
      let m;
      if(last&&!onBeat&&!same(nx,c)){ const tg=near(tones(nx),prev,61,78); m=tg+(prev<tg?-1:1); }                // chromatic approach
      else if(onBeat) m=near(tones(c),prev+(r()<.3?pick([-5,5,-7,7,4,-4]):0),60,79);                          // chord tone on the beat
      else m=Math.max(60,Math.min(79,prev+pick([-2,-1,1,2,-3,3])));                                           // passing tone
      ev.push({t,type:'lead',midi:m,dur:len}); mel.push({t,midi:m,dur:len,step:0}); prev=m; } };
  for(let bar=4;bar<B-4;bar++){ const fb=(bar-4)%16, chorus=(bar-4)>>4;
    for(let h=0;h<2;h++){ const st=bar*4+h*2, k=(fb%4)*2+h;
      const rhy=chorus===0?headRhy[(fb>>2)%2][k]:(k===7?pick([[[0,1]],[[0,SW],[SW,1-SW]]]):pick(SOLO));
      place(st,rhy,st+2); } }
  place((B-4)*4,SOLO[0],(B-4)*4+2); place((B-4)*4+2,SOLO[1],(B-4)*4+4); place((B-3)*4,SOLO[3],(B-3)*4+2); place((B-3)*4+2,[[0,SW],[SW,1-SW]],(B-3)*4+4);
  { const t=(B-2)*4, m=near([0],prev,64,76); ev.push({t,type:'lead',midi:m,dur:6}); mel.push({t,midi:m,dur:6,step:0}); }
  return {ev:ev.sort((a,b)=>a.t-b.t),mel,beats:B*4};
}
function composeSong(song){
  if(song.style==='jazz') return composeJazz(song);
  const r=rng(song.seed), ev=[], mel=[];
  // melody: rhythms come from fixed on-beat patterns (16th grid, [start,len]) so the tune locks to the beat
  const pick=a=>a[r()*a.length|0];
  const RHY=[[[0,4],[4,4],[8,4],[12,4]], [[0,4],[4,2],[6,2],[8,4],[12,4]], [[0,2],[2,2],[4,4],[8,2],[10,2],[12,4]],
    [[0,6],[6,2],[8,8]], [[0,4],[4,4],[8,8]], [[0,2],[2,2],[4,2],[6,2],[8,4],[12,4]], [[0,4],[4,2],[6,2],[8,2],[10,2],[12,4]]];
  const RHY16=[[[0,2],[2,1],[3,1],[4,4],[8,2],[10,2],[12,4]], [[0,4],[4,1],[5,1],[6,2],[8,4],[12,4]]];
  const RHYEND=[[[0,4],[4,4],[8,8]], [[0,2],[2,2],[4,4],[8,8]], [[0,4],[4,2],[6,2],[8,8]]];
  const CT=[-3,0,2,4,7,9];                       // chord tones in scale steps above the chord root
  let prev=2;
  const pitchBar=(rhy,end)=>rhy.map(([st,len],i)=>{
    if(end&&i===rhy.length-1){ prev=Math.abs(prev)<=Math.abs(prev-7)?0:7; }                 // cadence on the root
    else if(st%4===0){ const near=CT.filter(d=>Math.abs(d-prev)<=4&&d!==prev); prev=near.length?pick(near):pick(CT); } // beats: chord tones
    else { prev=Math.max(-3,Math.min(9,prev+pick([-1,1,-1,1,-2,2]))); }                     // passing steps
    return {s:st,deg:prev,len};
  });
  const rhythm=()=>song.bpm<=150&&r()<.25?pick(RHY16):pick(RHY);
  const makeMotif=end=>{ const b1=pitchBar(rhythm()), b2=pitchBar(end?pick(RHYEND):rhythm(),end); return [b1,b2]; };
  const phrase=[makeMotif(), makeMotif(), null, makeMotif(true)]; phrase[2]=phrase[0];   // A B A C
  for(let bar=0;bar<song.bars;bar++){
    const sec=section(song,bar), chord=song.prog[bar%4], b0=bar*4;
    // drums
    for(let q=0;q<4;q++){
      const t=b0+q;
      if(sec==='main'||sec==='outro'||(sec==='intro'&&q%2===0)) ev.push({t,type:'kick'});
      if(sec==='main'&&song.id==='night'&&q===2) ev.push({t:t+.5,type:'kick'});
      if(sec==='main'&&(q===1||q===3)) ev.push({t,type:'snare'});
      if(sec!=='break') for(let h=0;h<song.hat;h++) ev.push({t:t+h/song.hat,type:'hat',open:h===song.hat-1&&q===3});
    }
    if(sec==='break') for(let q=0;q<4;q++) ev.push({t:b0+q,type:'hat'});
    // bass and pad
    if(sec!=='intro'){ for(let e=0;e<8;e++){ const oct=e%2===1&&song.id!=='pop'?1:0; ev.push({t:b0+e/2,type:'bass',midi:degNote(song,chord,-2+oct),dur:.45}); } }
    ev.push({t:b0,type:'pad',notes:[0,2,4].map(k=>degNote(song,chord+k,-1)),dur:4});
    // lead melody (main + break)
    if(sec==='main'||sec==='break'){
      const phraseBar=bar%8, motifBar=phrase[phraseBar>>1][phraseBar&1];
      for(const n of motifBar){ const s=n.s, t=b0+s/4;
        const midi=degNote(song,n.deg+chord,0), dur=n.len/4;
        ev.push({t,type:'lead',midi,dur}); mel.push({t,midi,dur,step:s}); }
    }
  }
  return {ev:ev.sort((a,b)=>a.t-b.t),mel,beats:song.bars*4};
}
function makeChart(song,comp,diff){
  const r=rng(song.seed*7+diff), notes=[];
  const spb=60/song.bpm, minGap=[1,.5,song.swing?1/3:song.bpm>150?.5:.25][diff], OFF=song.swing?2/3:.5;
  const cand=[];

  // paws
  g.fillStyle='#E0893A'; const up=pose===2, down=pose===1;
  g.beginPath(); g.ellipse(-r*.7,r*(up||pose===0?.5:1.3),r*.18,r*.3,.3,0,Math.PI*2); g.ellipse(r*.7,r*(up||pose===3?.5:1.3),r*.18,r*.3,-.3,0,Math.PI*2); g.fill();
  for(const k of [-1,1]){ g.fillStyle='#B8611E'; g.beginPath(); g.moveTo(k*r*.85,-r*.2); g.lineTo(k*r*.75,-r*1.15); g.lineTo(k*r*.2,-r*.72); g.fill(); }
  g.fillStyle='#EE9A3E'; g.beginPath(); g.ellipse(0,0,r,r*.88,0,0,Math.PI*2); g.fill();
  g.fillStyle='#FFFDF8'; g.beginPath(); g.ellipse(0,r*.4,r*.6,r*.42,0,0,Math.PI*2); g.fill();
  g.fillStyle='#2A1D1D'; g.strokeStyle='#2A1D1D'; g.lineWidth=5; g.lineCap='round';
  for(const k of [-1,1]){ if(combo>=10){ g.beginPath(); g.arc(k*r*.38,-r*.05,r*.13,Math.PI*1.1,Math.PI*1.9); g.stroke(); } else { g.beginPath(); g.arc(k*r*.38,-r*.08,r*.12,0,Math.PI*2); g.fill(); } }
  g.beginPath(); g.ellipse(0,r*.2,r*.14,r*.1,0,0,Math.PI*2); g.fill();
  if(down||combo>=30){ g.fillStyle='#8B2E3A'; g.beginPath(); g.arc(0,r*.38,r*.16,0,Math.PI); g.fill(); }
  g.restore(); g.globalAlpha=1;
}
function render(){
  g.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  const col=song?song.color:'#FF8FB1';
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#1B1240'); bg.addColorStop(1,'#0B0820'); g.fillStyle=bg; g.fillRect(0,0,W,H);
  // disco lights
  for(let i=0;i<6;i++){ const a=performance.now()/1400+i*1.05; g.fillStyle=`hsla(${(i*60+performance.now()/40)%360},90%,60%,${.05+beatPulse*.07})`; g.beginPath(); g.moveTo(W/2,-20); g.lineTo(W/2+Math.cos(a)*W,H); g.lineTo(W/2+Math.cos(a+.18)*W,H); g.fill(); }
  drawCorgi();
  // lanes
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(laneX(0)-36,0,72*4,H);
  for(let l=0;l<4;l++){ if(held[l]){ const gr=g.createLinearGradient(0,RECEPT,0,H); gr.addColorStop(0,'rgba(255,95,162,.35)'); gr.addColorStop(1,'rgba(255,95,162,0)'); g.fillStyle=gr; g.fillRect(laneX(l)-36,RECEPT,72,H); } }
  // receptors
  for(let l=0;l<4;l++){ const p=1+beatPulse*.08+flashL[l]*.12; drawArrow(laneX(l),RECEPT,l,flashL[l]>0?`rgba(255,255,255,${.3+flashL[l]*.5})`:'rgba(255,255,255,.12)',1,p); }
  if(phase==='play'||phase==='result'){
    const st=songTime(), sp=420*hs;
    for(let i=notes.length-1;i>=0;i--){
      const n=notes[i]; if(n.judged&&n.judged!=='miss'&&!n.len)continue; if(n.len&&n.done&&!n.holding&&n.judged!=='miss')continue;
      let y=RECEPT+(n.t-st)*sp; const y2=RECEPT+(n.t+n.len-st)*sp;
      if(n.len){ if(y2<RECEPT-40)continue; }
      else if(y<-40)continue;
      if(y>H+40)continue;
      if(n.len){ const yt=n.holding?RECEPT:y; g.fillStyle=n.judged==='miss'||(n.done&&!n.holding)?'rgba(120,120,140,.5)':'rgba(79,227,166,.55)'; g.fillRect(laneX(n.lane)-16,yt,32,Math.max(0,y2-yt)); g.fillStyle='rgba(79,227,166,.9)'; g.fillRect(laneX(n.lane)-20,y2-6,40,8); if(n.holding)y=RECEPT; }
      const c=n.judged==='miss'?'#666':n.len?'#4FE3A6':beatColor(n.beat);
      drawArrow(laneX(n.lane),y,n.lane,c,n.judged==='miss'?.5:1);
    }
    // judgement + combo
    if(judge&&judge.t<.7){
      const T={perfect:['PERFECT!!','#FFE14D'],great:['GREAT','#4FE3A6'],good:['GOOD','#4FB7FF'],miss:['MISS','#FF6B8B'],ok:['OK!','#4FE3A6'],ng:['NG','#FF6B8B']}[judge.j];
      const sc=1+Math.max(0,.15-judge.t)*2; g.save(); g.translate(W/2,H*.42); g.scale(sc,sc); g.font=`400 30px ${DISP}`; g.textAlign='center'; g.textBaseline='middle';
      g.lineWidth=6; g.strokeStyle='#140F2A'; g.strokeText(T[0],0,0); g.fillStyle=T[1]; g.fillText(T[0],0,0); g.restore();
      if(combo>=4){ g.font=`400 22px ${DISP}`; g.textAlign='center'; g.lineWidth=5; g.strokeStyle='#140F2A'; g.strokeText(`${combo} COMBO`,W/2,H*.42+36); g.fillStyle='#fff'; g.fillText(`${combo} COMBO`,W/2,H*.42+36); }
    }
    // life gauge + score
    g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(12,14,W-24,12); const lg=g.createLinearGradient(12,0,W-12,0); lg.addColorStop(0,'#4FB7FF'); lg.addColorStop(1,'#FF5FA2'); g.fillStyle=life>25?lg:'#FF6B8B'; g.fillRect(12,14,(W-24)*Math.max(0,life)/100,12);
    g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=1.5; g.strokeRect(12,14,W-24,12);
    g.font=`800 12px ${FONT}`; g.fillStyle='#fff'; g.textAlign='left'; g.fillText(song.title,12,44); g.textAlign='right'; g.fillText(Math.round(score).toLocaleString(),W-12,44);
    if(auto){ g.textAlign='right'; g.fillStyle='#FF9CC6'; g.fillText('🤖 AUTO',W-12,60); }
    const spb=60/song.bpm, st2=songTime(); if(st2<LEAD){ g.font=`400 26px ${DISP}`; g.textAlign='center'; g.fillStyle='#fff'; g.fillText(st2<LEAD-spb*2?'READY?':'HERE WE GO!',W/2,H*.42); }
    // progress
    const prog=Math.max(0,Math.min(1,(st-LEAD)/(comp.beats*spb))); g.fillStyle='rgba(255,255,255,.15)'; g.fillRect(12,H-6,W-24,3); g.fillStyle=col; g.fillRect(12,H-6,(W-24)*prog,3);
  }
}

// ---------- menu ----------
function buildMenu(){
  const box=$('songs'); box.innerHTML='';
  SONGS.forEach((s,i)=>{ const b=document.createElement('button'); b.className='song'; b.setAttribute('aria-pressed',i===songI);
    let best=0; try{best=+localStorage.getItem(`stepBest_${s.id}_${diff}`)||0;}catch(e){}
    b.innerHTML=`<b>${s.title}</b><span>BPM ${s.bpm}・約${Math.round(s.bars*4*60/s.bpm)}秒</span><i>${best?`ベスト<br>${gradeOf(best)} ${best.toLocaleString()}`:'♪'}</i>`;
    b.onclick=()=>{ songI=i; buildMenu(); }; box.appendChild(b); });
  const d=$('diffs'); d.innerHTML='';
  DIFFS.forEach((x,i)=>{ const s=SONGS[songI], n=makeChart(s,composeSong(s),i).length; const b=document.createElement('button'); b.setAttribute('aria-pressed',i===diff); b.innerHTML=`${x.name}<span>${n}ノーツ</span>`; b.onclick=()=>{ diff=i; buildMenu(); }; d.appendChild(b); });
  const sp=$('speeds'); sp.innerHTML='';
  [1,1.5,2,3].forEach(v=>{ const b=document.createElement('button'); b.setAttribute('aria-pressed',v===hs); b.textContent=`×${v}`; b.onclick=()=>{ hs=v; try{localStorage.setItem('stepHS',v);}catch(e){} buildMenu(); }; sp.appendChild(b); });
  $('offVal').textContent=`${offset>0?'+':''}${offset}ms`; dlLabel();
}
$('dlBtn').onclick=downloadSong;
for(const b of document.querySelectorAll('#offs button[data-o]')) b.onclick=()=>{ offset=Math.max(-200,Math.min(300,offset+ +b.dataset.o)); try{localStorage.setItem('stepOffset',offset);}catch(e){} buildMenu(); };
function toMenu(){ phase='menu'; paused=false; for(const id of ['resultOv','pauseOv'])$(id).hidden=true; $('menuOv').hidden=false; buildMenu(); }
function togglePause(){
  if(phase!=='play')return;
  paused=!paused; $('pauseOv').hidden=!paused;
  if(paused){ pauseAt=now(); if(AC&&fake==null)AC.suspend(); } else { if(AC&&fake==null)AC.resume(); }
}
function setAuto(v){ auto=v; $('autoBtn').setAttribute('aria-pressed',v); if(v&&phase==='menu')startSong(); if(!v)for(let l=0;l<4;l++){ held[l]=false; $('pads').children[l].classList.remove('on'); } }

// ---------- input ----------
const KEYMAP={ArrowLeft:0,KeyD:0,ArrowDown:1,KeyF:1,ArrowUp:2,KeyJ:2,ArrowRight:3,KeyK:3};
addEventListener('keydown',e=>{
  if(e.code==='KeyO'){ setAuto(!auto); return; }
  if(e.code==='KeyP'||e.code==='Escape'){ togglePause(); return; }
  if(e.code==='Enter'&&phase==='menu'){ startSong(); return; }
  const l=KEYMAP[e.code]; if(l==null)return; e.preventDefault(); if(e.repeat)return;
  if(auto)setAuto(false); $('pads').children[l].classList.add('on'); hit(l);
});
addEventListener('keyup',e=>{ const l=KEYMAP[e.code]; if(l==null)return; $('pads').children[l].classList.remove('on'); release(l); });
for(const b of document.querySelectorAll('.pad')){
  const l=+b.dataset.l;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); if(auto)setAuto(false); b.setPointerCapture(e.pointerId); b.classList.add('on'); hit(l); });
  const up=()=>{ if(b.classList.contains('on')){ b.classList.remove('on'); release(l); } };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
$('startBtn').onclick=()=>startSong();
$('autoStartBtn').onclick=()=>{ ac(); setAuto(true); };
$('autoBtn').onclick=()=>{ ac(); setAuto(!auto); };
$('againBtn').onclick=()=>startSong();
$('toMenuBtn').onclick=toMenu; $('quitBtn').onclick=()=>{ if(AC&&AC.state==='suspended')AC.resume(); toMenu(); };
$('resumeBtn').onclick=togglePause;
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&phase==='play'&&!paused)togglePause(); });

setMute(muted); layout(); buildMenu();
let last=performance.now();
function loop(t){ const dt=Math.min(.05,(t-last)/1000); last=t; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// test hook: fake clock lets tests step through a song deterministically
window.__step={setAuto, get s(){return {phase,auto,song:song&&song.id,diff,score:Math.round(score),stats:{...stats},combo,maxCombo,life,notes:notes&&notes.length,failed};},
  useFakeClock(){ fake=0; }, step(dt){ fake+=dt; update(dt); }, time:()=>songTime(), notes:()=>notes, comp:()=>comp, hit, release, setSong(i,d){ songI=i; diff=d; buildMenu(); }};
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
