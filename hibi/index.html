<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="動くバーのタイミングを合わせて地響きを起こし、アスファルトに網目状のヒビを入れる。歩道の足踏みから、地球そのものまで。">
<title>アスファルトに網目状のひびが入るよう</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="data:,">
<style>
html,body{touch-action:manipulation}
:root{--bg:#14151a;--panel:#1d1f27;--line:#363a48;--ink:#eef0f6;--mute:#9aa0b4;--acc:#ffcf4a;--ok:#46d19a;--red:#ff5a5f;--blue:#5ab0ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0b0c10;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:14px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:100vh;height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);overflow:hidden}
#hd{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#0e0f14;border-bottom:1px solid var(--line)}
#hd a{color:var(--acc);text-decoration:none;font-weight:800;font-size:13px;white-space:nowrap}
#hd h1{flex:1;margin:0;text-align:center;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;white-space:nowrap;min-height:32px}
.mini[aria-pressed=true]{background:var(--acc);color:#222;border-color:var(--acc)}
#sndBtn[aria-pressed=false]{color:var(--mute)}
#hud{flex:none;padding:5px 10px 6px;background:#101116;border-bottom:1px solid var(--line)}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.r1 b{font-size:14px;color:var(--acc)}
#hWho{color:var(--mute);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hShots{letter-spacing:1px;white-space:nowrap}
.r2{display:flex;align-items:center;gap:8px;margin-top:4px}
#meter{position:relative;flex:1;height:14px;border-radius:7px;background:#272a35;overflow:hidden}
#mFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4a6cff,#46d19a);border-radius:7px}
#mTarget{position:absolute;top:0;bottom:0;width:3px;background:var(--acc);box-shadow:0 0 6px var(--acc)}
#hCov{font-size:13px;font-weight:800;min-width:92px;text-align:right;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0c10;overflow:hidden}
#cv{display:block;touch-action:manipulation;cursor:crosshair}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;background:rgba(10,11,14,.86);overflow-y:auto;text-align:center}
.scr h2{margin:0;font-size:21px;line-height:1.25}
.scr h2 small{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-top:4px}
.btn{display:block;width:100%;max-width:300px;padding:12px 10px;border-radius:12px;background:var(--acc);color:#251c00;font-weight:900;font-size:16px;text-align:center;min-height:46px;box-shadow:0 3px 0 #b8902a;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8902a}
.btn.sub{background:#2a2e3b;color:var(--ink);box-shadow:0 3px 0 #171a22;font-size:14px}
.grid7{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%;max-width:320px}
.grid7 button{background:#242836;border:1px solid var(--line);border-radius:10px;padding:6px 6px;font-size:12px;text-align:left;min-height:42px;line-height:1.25}
.grid7 button b{display:block;font-size:13px}
.grid7 button small{color:var(--mute)}
.grid7 button:disabled{opacity:.4;cursor:default}
.rec{font-size:12px;color:var(--mute);line-height:1.6}
.rec b{color:var(--ink)}
.how{font-size:12px;color:var(--mute);max-width:320px}
#panel{flex:none;padding:7px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#101116;border-top:1px solid var(--line)}
#steps{display:flex;gap:6px;margin-bottom:6px;font-size:12px;font-weight:800}
#steps span{flex:1;text-align:center;padding:3px 0;border-radius:6px;background:#1c1f29;color:var(--mute)}
#steps span.on{background:var(--acc);color:#251c00}
#steps span.done{background:#2a3a33;color:var(--ok)}
.pg{display:grid;grid-template-columns:1fr 62px;gap:10px;align-items:stretch}
.pg .l{display:flex;flex-direction:column;gap:8px;justify-content:space-between}
#hbar,#vbar{position:relative;background:#262936;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
#hbar{height:40px}
#vbar{height:112px}
.zg,.zr,.zp{position:absolute}
#hbar .zg,#hbar .zr,#hbar .zp{top:0;bottom:0}
#vbar .zg,#vbar .zr,#vbar .zp{left:0;right:0}
.zg{background:#7a5a1a}.zr{background:#d9a21b}.zp{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#hcur{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2.5px;background:#fff;box-shadow:0 0 6px #fff,0 0 2px #000;border-radius:3px}
#vcur{position:absolute;left:-3px;right:-3px;height:5px;margin-bottom:-2.5px;background:#fff;box-shadow:0 0 6px #fff,0 0 2px #000;border-radius:3px}
#hbar.idle #hcur,#vbar.idle #vcur{opacity:.25}
#stopBtn{min-height:52px;border-radius:12px;background:var(--acc);color:#251c00;font-weight:900;font-size:16px;box-shadow:0 3px 0 #b8902a}
#stopBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8902a}
#stopBtn:disabled{background:#2a2e3b;color:var(--mute);box-shadow:none}
#judge{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 0 #000,0 0 8px #000;opacity:0;transition:opacity .25s}
#judge.show{opacity:1;transition:none}
</style>
</head>
<body>
<div id="app">
  <header id="hd">
    <a href="../">← 一覧</a>
    <h1>網目状のひび</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキーでも切りかえ">🤖 オート</button>
    <button class="mini" id="sndBtn" aria-pressed="true" aria-label="音">🔊</button>
  </header>
  <div id="hud">
    <div class="r1"><span id="hStage"><b>STAGE 1</b> 歩道</span><span id="hWho"></span><span id="hShots"></span></div>
    <div class="r2"><div id="meter"><i id="mFill"></i><i id="mTarget"></i></div><span id="hCov">0% / 40%</span></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="judge"></div>
    <div id="title" class="scr">
      <h2>アスファルトに<br>網目状のひびが入るよう<small>バーを止めて地響きを起こし、地面を網目にしろ</small></h2>
      <button class="btn" id="startBtn">▶ はじめから</button>
      <button class="btn sub" id="endlessBtn">♾ エンドレス（どこまで広げる？）</button>
      <div class="grid7" id="stageGrid"></div>
      <div class="rec" id="rec"></div>
      <div class="how">① 地面をタップして着弾点を決める → ② 横バー → ③ 縦バーを、まん中の PERFECT で止める（スペースでもOK）。前のヒビの近くに打つと、つながって広がる！</div>
    </div>
    <div id="ovl" class="scr" hidden></div>
  </div>
  <div id="panel">
    <div id="steps"><span id="s0">① ねらう</span><span id="s1">② よこ</span><span id="s2">③ たて</span></div>
    <div class="pg">
      <div class="l">
        <div id="hbar" class="idle"><i class="zg"></i><i class="zr"></i><i class="zp"></i><div id="hcur"></div></div>
        <button id="stopBtn" disabled>地面をタップしてねらう</button>
      </div>
      <div id="vbar" class="idle"><i class="zg"></i><i class="zr"></i><i class="zp"></i><div id="vcur"></div></div>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const WW=400, WH=480, CELL=10, LINK=70, RCOV=15, PI2=Math.PI*2;
const OFX=[], OFY=[];
{ const rc=RCOV/CELL, n=Math.ceil(rc); for(let dy=-n;dy<=n;dy++)for(let dx=-n;dx<=n;dx++) if(dx*dx+dy*dy<=rc*rc){ OFX.push(dx); OFY.push(dy); } }
const STAGES=[
 {n:'歩道',who:'ふつうの足踏み',kind:'foot',base:.46,pw:.085,gw:.19,go:.34,target:.48,shots:5},
 {n:'公園の駐車場',who:'力士の四股',kind:'sumo',base:.50,pw:.08,gw:.18,go:.32,target:.53,shots:5},
 {n:'商店街',who:'プロレスラーのボディプレス',kind:'wres',base:.55,pw:.075,gw:.17,go:.31,target:.57,shots:5},
 {n:'高速道路',who:'重機のドロップハンマー',kind:'hammer',base:.60,pw:.07,gw:.16,go:.29,target:.60,shots:5},
 {n:'空港の滑走路',who:'怪獣の足踏み',kind:'kaiju',base:.66,pw:.06,gw:.145,go:.27,target:.56,shots:5},
 {n:'国会議事堂前',who:'隕石',kind:'meteor',base:.72,pw:.055,gw:.13,go:.25,target:.50,shots:5},
 {n:'地球',who:'地球そのもの',kind:'earth',base:.78,pw:.05,gw:.12,go:.23,target:.77,shots:6,circle:true}
];
const END_ST={n:'エンドレス',who:'どこまでも広がる',kind:'foot',base:.6,pw:.065,gw:.15,go:.28,shots:25};
const ENDLESS_MAX=25, EARTH_R=190;
const ACC_V={PERFECT:1,GREAT:.8,GOOD:.55,MISS:.3};

/* ---------- save ---------- */
let save={snd:1,unlocked:1,st:{},endless:0,streak:0};
try{ const o=JSON.parse(localStorage.getItem('hibi_save')||'{}'); if(o&&typeof o==='object') save=Object.assign(save,o); }catch(e){}
function store(){ try{ localStorage.setItem('hibi_save',JSON.stringify(save)); }catch(e){} }

/* ---------- util ---------- */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rndSeed=()=>(Math.random()*4294967295)>>>0;

/* ---------- audio ---------- */
let ac=null, noiseBuf=null, gesture=false;
function audio(){
  if(!save.snd||!gesture) return null;
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    const n=ac.sampleRate; noiseBuf=ac.createBuffer(1,n,n); const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; }
  if(ac.state==='suspended') ac.resume().catch(()=>{});
  return ac;
}
function tone(f,dur,type,vol,t0,f2){
  const a=audio(); if(!a) return; const t=a.currentTime+(t0||0);
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur,vol,ftype,freq,t0,q){
  const a=audio(); if(!a) return; const t=a.currentTime+(t0||0);
  const s=a.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=0.8+Math.random()*0.5;
  const f=a.createBiquadFilter(); f.type=ftype; f.frequency.value=freq; f.Q.value=q||1;
  const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);
}
const sfx={
  boom(q){ tone(150,0.7,'sine',0.5+0.5*q,0,28); tone(70,0.5,'triangle',0.25*q,0,24); noise(0.6,0.5+0.4*q,'lowpass',380,0,0.7); },
  tick(){ noise(0.03,0.16+Math.random()*0.1,'highpass',2200+Math.random()*3000,0,2); },
  stop(name){ const f={PERFECT:880,GREAT:660,GOOD:500,MISS:200}[name]; tone(f,0.09,name==='MISS'?'sawtooth':'square',0.13); },
  perfect(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.28,'triangle',0.2,i*0.07)); tone(2093,0.5,'sine',0.1,0.34); },
  clear(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.22,'square',0.12,i*0.1)); tone(1568,0.5,'triangle',0.16,0.42); },
  fail(){ tone(330,0.3,'sawtooth',0.14,0,110); tone(247,0.5,'sawtooth',0.12,0.25,70); },
  aim(){ tone(1200,0.04,'square',0.07); }
};

/* ---------- world model ---------- */
function makeWorld(si){
  const end=si<0, st=end?END_ST:STAGES[si];
  const w={si,end,st,Wmax:end?1200:WW,Hmax:end?1440:WH,W:WW,H:WH,shots:[],pts:[],chips:[],cov:0,n:0};
  w.gw=Math.ceil(w.Wmax/CELL); w.gh=Math.ceil(w.Hmax/CELL);
  w.grid=new Uint8Array(w.gw*w.gh); w.mask=new Uint8Array(w.gw*w.gh);
  setSize(w,WW,WH); return w;
}
function setSize(w,W,H){
  w.W=W; w.H=H; w.cells=0; const R=w.st.circle?EARTH_R:0;
  for(let j=0;j<w.gh;j++)for(let i=0;i<w.gw;i++){
    const x=(i+.5)*CELL-w.Wmax/2, y=(j+.5)*CELL-w.Hmax/2;
    let m=Math.abs(x)<W/2&&Math.abs(y)<H/2;
    if(m&&R) m=x*x+y*y<R*R;
    w.mask[j*w.gw+i]=m?1:0; if(m) w.cells++;
  }
}
const ratio=w=>w.cov/w.cells;
function okPoint(w,x,y){ if(w.st.circle) return x*x+y*y<(EARTH_R-8)*(EARTH_R-8); return Math.abs(x)<w.W/2-8&&Math.abs(y)<w.H/2-8; }
function clampPt(w,x,y){
  if(w.st.circle){ const d=Math.hypot(x,y), m=EARTH_R-10; if(d>m){ x*=m/d; y*=m/d; } return [x,y]; }
  return [clamp(x,-w.W/2+10,w.W/2-10),clamp(y,-w.H/2+10,w.H/2-10)];
}
function markSegs(w,segs,rev){
  let gain=0; const gw=w.gw,gh=w.gh,g=w.grid,m=w.mask,hx=w.Wmax/2,hy=w.Hmax/2,n0=OFX.length;
  for(let s=0;s<segs.length;s++){
    const sg=segs[s], dx=sg.x2-sg.x1, dy=sg.y2-sg.y1, n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));
    for(let k=0;k<=n;k++){
      const ci=Math.floor((sg.x1+dx*k/n+hx)/CELL), cj=Math.floor((sg.y1+dy*k/n+hy)/CELL);
      for(let o=0;o<n0;o++){ const i=ci+OFX[o], j=cj+OFY[o]; if(i<0||j<0||i>=gw||j>=gh) continue; const idx=j*gw+i; if(m[idx]&&!g[idx]){ g[idx]=1; gain++; if(rev) rev.push(idx); } }
    }
  }
  return gain;
}
function walk(r,x,y,ang,len,st,wob){
  const out=[[x,y]]; let d=0;
  while(d<len){ ang+=(r()-.5)*wob*2; if(r()<.12) ang+=(r()-.5)*1.1; const s=st*(.7+.6*r()); x+=Math.cos(ang)*s; y+=Math.sin(ang)*s; d+=s; out.push([x,y]); }
  return out;
}
function ptAtR(poly,cx,cy,rr){
  for(let i=1;i<poly.length;i++){
    const d1=Math.hypot(poly[i][0]-cx,poly[i][1]-cy);
    if(d1>=rr){ const d0=Math.hypot(poly[i-1][0]-cx,poly[i-1][1]-cy), f=d1===d0?1:(rr-d0)/(d1-d0), a=poly[i-1], b=poly[i]; return [a[0]+(b[0]-a[0])*clamp(f,0,1),a[1]+(b[1]-a[1])*clamp(f,0,1)]; }
  }
  return null;
}
function nearestPt(w,x,y){
  const P=w.pts; let nd=1e9, ni=-1;
  for(let i=0;i<P.length;i+=2){ const dx=P[i]-x, dy=P[i+1]-y, d=dx*dx+dy*dy; if(d<nd){ nd=d; ni=i; } }
  return ni<0?null:{i:ni,d:Math.sqrt(nd)};
}
function genCrack(w,cx,cy,S,seed){
  const r=mulberry(seed), segs=[], pts=[], P=w.pts;
  const nn=nearestPt(w,cx,cy), chain=!!nn&&nn.d<LINK;
  const nRad=Math.round(5+S*7)+(chain?1:0);
  const L=WW*(.09+.19*S)*(chain?1.12:1);
  const step=WW*.024, rot=r()*PI2, rays=[];
  const tOf=d=>.04+.5*Math.min(1,d/L);
  const push=(poly,cls,t0,dt)=>{
    for(let i=0;i<poly.length-1;i++){
      const a=poly[i], b=poly[i+1];
      const ta=t0==null?tOf(Math.hypot((a[0]+b[0])/2-cx,(a[1]+b[1])/2-cy)):t0+i*dt;
      segs.push({x1:a[0],y1:a[1],x2:b[0],y2:b[1],a:ta,b:ta+.1,c:cls}); pts.push(b[0],b[1]);
    }
  };
  for(let i=0;i<nRad;i++){
    const ang=rot+(i+(r()-.5)*.5)*PI2/nRad, len=L*(.75+.5*r());
    const ray=walk(r,cx,cy,ang,len,step,.22); rays.push(ray); push(ray,0,null);
    for(let j=2;j<ray.length;j++){
      if(r()<.1+.09*S){
        const p=ray[j], side=r()<.5?-1:1, ba=ang+side*(.45+r()*.7), dd=Math.hypot(p[0]-cx,p[1]-cy);
        const bl=Math.max(step*2,(len-dd)*(.4+.5*r()));
        const br=walk(r,p[0],p[1],ba,bl,step*.85,.3); push(br,1,null);
        if(S>.55&&br.length>4&&r()<.45){ const q=br[2+Math.floor(r()*(br.length-3))]; push(walk(r,q[0],q[1],ba+side*(.5+r()*.6)*(r()<.5?-1:1),bl*.5,step*.7,.35),2,null); }
      }
    }
  }
  const nRing=Math.min(5,1+Math.floor(S*4.2));
  for(let k=1;k<=nRing;k++){
    const rr=L*.92*k/(nRing+.55), pa=rays.map(ry=>ptAtR(ry,cx,cy,rr));
    for(let i=0;i<nRad;i++){
      const A=pa[i], B=pa[(i+1)%nRad]; if(!A||!B||r()<.1) continue;
      const a0=Math.atan2(A[1]-cy,A[0]-cx), a1=Math.atan2(B[1]-cy,B[0]-cx); let da=a1-a0;
      while(da>Math.PI) da-=PI2; while(da<-Math.PI) da+=PI2; if(Math.abs(da)>2.2) continue;
      const n=Math.max(2,Math.ceil(Math.abs(da)*rr/step)), poly=[A];
      for(let m=1;m<n;m++){ const a=a0+da*m/n, rj=rr+(r()-.5)*step*.9; poly.push([cx+Math.cos(a)*rj,cy+Math.sin(a)*rj]); }
      poly.push(B); push(poly,k<=2?1:2,tOf(rr)+.1,.012);
    }
  }
  if(chain){
    const q=[P[nn.i],P[nn.i+1]], cp=walk(r,cx,cy,Math.atan2(q[1]-cy,q[0]-cx),nn.d,step*.8,.25);
    cp[cp.length-1]=q; push(cp,0,.05,.03);
    const cnt=3+Math.floor(S*4);
    for(let k=0;k<cnt;k++){
      for(let tr=0;tr<14;tr++){
        const i=2*Math.floor(r()*(P.length/2));
        if(Math.hypot(P[i]-cx,P[i+1]-cy)<LINK*2.2){ push(walk(r,P[i],P[i+1],r()*PI2,WW*.1*(.6+S),step*.85,.3),1,.2+k*.05,.03); break; }
      }
    }
  }
  let tEnd=0; for(const s of segs) if(s.b>tEnd) tEnd=s.b;
  return {cx,cy,S,segs,pts,chain,L,tEnd,t:0,done:false,paths:null,seed};
}
function commit(w,cx,cy,S,seed){
  const sh=genCrack(w,cx,cy,S,seed);
  sh.gain=markSegs(w,sh.segs); w.cov+=sh.gain;
  for(let i=0;i<sh.pts.length;i++) w.pts.push(sh.pts[i]);
  w.shots.push(sh); w.n++; return sh;
}
function bestPoint(w,S,seed,coarse){

function update(dt){

  } else if(phase==='bar1'||phase==='bar2') barUpdate(dt);

  if(shakeT>0) shakeT-=dt;
  if(flash){ flash.t+=dt; if(flash.t>.14) flash=null; }
  if(glass){ glass.t+=dt; if(glass.t>2.2) glass=null; }
  for(const p of parts){ if(p.delay>0){ p.delay-=gdt; continue; } p.t+=gdt; p.x+=p.vx*gdt; p.y+=p.vy*gdt; p.z+=p.vz*gdt; p.vz-=520*gdt; p.rot+=p.vr*gdt;

  dust=dust.filter(d=>d.t<d.life);

  rings=rings.filter(r=>r.t<.5);

  if(e.repeat) return;
  if(e.key==='o'||e.key==='O'){ setAuto(!auto); return; }
  if(e.key===' '||e.key==='Enter'){
    if(scr==='play'&&w){
      if(auto) setAuto(false);
      if(phase==='aim'){ e.preventDefault(); const p=hover||[0,0]; aimTap(p[0],p[1]); }
      else if(phase==='bar1'||phase==='bar2'){ e.preventDefault(); stopBar(); }
    }
  } else if(auto&&scr==='play'&&!e.metaKey&&!e.ctrlKey&&e.key.length<=1) setAuto(false);
});
function setAuto(v){
  auto=!!v; $('autoBtn').setAttribute('aria-pressed',auto?'true':'false');
  if(auto){
    if(scr==='title') startRun('stage',0);
    else if(phase==='aim'&&w){ beginAimAuto(); }
    else if(phase==='clear'){ autoT=.5; } else if(phase==='fail'){ autoT=.8; } else if(phase==='end'){ autoT=1.5; }
  }
}
function beginAimAuto(){ const bp=bestPoint(w,1,seed,false); autoFrom=hover||[0,0]; autoPt=[bp.x,bp.y]; autoT=.28; }
$('autoBtn').addEventListener('click',()=>{ gesture=true; setAuto(!auto); });
$('sndBtn').addEventListener('click',()=>{ gesture=true; save.snd=save.snd?0:1; store(); syncSnd(); if(save.snd) sfx.aim(); });
function syncSnd(){ $('sndBtn').setAttribute('aria-pressed',save.snd?'true':'false'); $('sndBtn').textContent=save.snd?'🔊':'🔇'; }
$('startBtn').addEventListener('click',()=>{ gesture=true; startRun('stage',0); });
$('endlessBtn').addEventListener('click',()=>{ gesture=true; startRun('endless'); });

/* ---------- loop ---------- */
let lastTs=0;
function frame(t){
  const dt=Math.min(.05,(t-lastTs)/1000||0); lastTs=t;
  update(dt); hudUpdate(); render();
  requestAnimationFrame(frame);
}
function stepN(dt){ let n=Math.ceil(dt*60); const d=dt/n; for(let i=0;i<n;i++) update(d); hudUpdate(); }

/* ---------- bot simulation (test) ---------- */
function simStage(i,n,minMs,maxMs,perfect){
  const st=i<0?END_ST:STAGES[i]; let clears=0, shotSum=0, covSum=0;
  for(let tr=0;tr<n;tr++){
    const ww=makeWorld(i); let used=0, cleared=false;
    for(let s=0;s<st.shots&&!cleared;s++){
      const sd=rndSeed(), bp=bestPoint(ww,perfect?1:.7,sd,true);
      const jit=()=>{ if(perfect) return 0; const m=(minMs+Math.random()*(maxMs-minMs))/1000; return Math.random()<.5?-m:m; };
      const one=(sp)=>{ const k=Math.floor(Math.random()*3), t=crossT(st.base*sp,k)+jit(); return judge(st,triPos(phiAt(st.base*sp,t))); };
      const q=ACC_V[one(1)]*ACC_V[one(1.12)];
      const pt=perfect?[bp.x,bp.y]:clampPt(ww,bp.x+(Math.random()-.5)*16,bp.y+(Math.random()-.5)*16);
      commit(ww,pt[0],pt[1],q,sd); used++;
      if(!ww.end&&ratio(ww)>=st.target) cleared=true;
    }
    if(cleared) clears++; shotSum+=used; covSum+=ratio(ww);
  }
  return {stage:i,n,clearRate:clears/n,avgShots:shotSum/n,avgCov:covSum/n};
}

window.__hibi={
  state(){ return {scr,phase,mode:w&&w.end?'endless':'stage',stage:si,shotsLeft,lives,score,streak,bestStreak:runBestStreak,auto,coverage:w?ratio(w):0,target:w&&!w.end?w.st.target:null,shots:w?w.n:0,cleared:runStages.map(s=>({si:s.si,rk:s.rk,cov:s.cov})),save,camW,overlay:$('ovl').hidden?'':$('ovl').textContent.slice(0,60)}; },
  step:stepN, setAuto, start(m,i){ gesture=true; startRun(m,i||0); }, title:toTitle,
  unlockAll(){ save.unlocked=7; store(); renderTitle(); }, reset(){ save={snd:1,unlocked:1,st:{},endless:0,streak:0}; store(); renderTitle(); },
  tap(x,y){ if(phase==='aim') aimTap(x,y); else stopBar(); }, stop(){ stopBar(); },
  sim:simStage, stages:STAGES, bar(){ return {phase,barPos,barT}; }, shots(){ return w?w.shots.length:0; }
};

/* ---------- init ---------- */
syncSnd(); renderTitle(); resetStatus(); resize();
requestAnimationFrame(t=>{ lastTs=t; requestAnimationFrame(frame); });
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
