<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>アーマーを、ほら</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
html,body{touch-action:manipulation}
:root{
  --bg:#dde4e9; --panel:#f3f6f8; --ink:#1d2b38; --sub:#5b6b79; --line:#b3c0ca;
  --accent:#e8a317; --accent-ink:#1d2b38; --me:#2a9d8f; --foe:#d64533;
  --arena:#c3cfd7; --wall:#7d8e9b; --grid:#b4c1ca;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16232f; --panel:#223546; --ink:#e6edf2; --sub:#9db0be; --line:#37505f;
    --accent:#f2b632; --accent-ink:#16232f; --me:#4cc4b3; --foe:#ee6a55;
    --arena:#1c2d3b; --wall:#5a7385; --grid:#25394a;
  }
}
:root[data-theme="dark"]{
  --bg:#16232f; --panel:#223546; --ink:#e6edf2; --sub:#9db0be; --line:#37505f;
  --accent:#f2b632; --accent-ink:#16232f; --me:#4cc4b3; --foe:#ee6a55;
  --arena:#1c2d3b; --wall:#5a7385; --grid:#25394a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.6; -webkit-tap-highlight-color:transparent;
}
#app{max-width:440px; margin:0 auto; padding:14px 14px 28px}
h1{font-size:32px; margin:6px 0 4px; letter-spacing:.08em; line-height:1.2}
.stripe{height:8px; margin:4px 0 10px; border-radius:2px; background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,var(--ink) 8px 16px)}
.lead{margin:0 0 14px; color:var(--sub); font-size:14px}
button{
  font:inherit; color:var(--ink); background:var(--panel);
  border:2px solid var(--line); border-bottom-width:4px; border-radius:8px;
  padding:10px 14px; cursor:pointer; touch-action:manipulation;
}
button:active{transform:translateY(2px); border-bottom-width:2px}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button:disabled{opacity:.45; cursor:default}
.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent-ink); font-size:17px; width:100%}
[hidden]{display:none !important}

#top{display:flex; align-items:center; gap:8px; margin-bottom:6px}
#top .back{color:var(--ink); text-decoration:none; font-size:14px; padding:6px 4px}
#top .sp{flex:1}
#top button{padding:5px 10px; font-size:13px}
#top button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent-ink)}
#sndBtn[aria-pressed="false"]{opacity:.7}

#slots{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.slot{
  text-align:left; display:grid; grid-template-columns:auto 1fr; gap:2px 10px;
  align-items:center; padding:10px 12px; border-radius:10px;
}
.slot.cur{border-color:var(--accent)}
.slot .pname{grid-column:1/3; font-size:13px; color:var(--sub)}
.slot .rank{font-size:38px; line-height:1; min-width:26px; text-align:center}
.slot .pips{display:flex; gap:3px; flex-wrap:wrap}
.pip{width:9px; height:9px; border:1px solid var(--sub); border-radius:2px}
.pip.on{background:var(--accent); border-color:var(--accent)}
.slot .stat{grid-column:1/3; font-size:12px; color:var(--sub)}
.summary{background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px}
.summary b{font-weight:normal; color:var(--accent)}
.hint{min-height:22px; font-size:13px; color:var(--sub); margin:6px 0 10px}
.row{display:flex; gap:8px; align-items:center; margin:8px 0 12px}
.row span{font-size:13px; color:var(--sub)}
.seg{flex:1}
.seg.sel{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.hud{display:grid; gap:6px; margin-bottom:8px; font-size:13px}
.bar{display:grid; grid-template-columns:64px 1fr 70px; align-items:center; gap:8px}
.track{position:relative; height:16px; background:var(--panel); border:2px solid var(--line); border-radius:4px; overflow:hidden}
.track::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--panel) calc(10% - 2px) 10%)}
.fill{height:100%; width:100%; transition:width .12s linear}
.fill.me{background:var(--me)} .fill.foe{background:var(--foe)}
.hudtop{display:flex; justify-content:space-between; align-items:center; gap:8px}
.hudtop button{padding:5px 10px; font-size:13px}
.stagewrap{position:relative; width:min(100%, calc((100svh - 360px) * .75)); min-width:260px; margin:0 auto}
canvas{display:block; width:100%; aspect-ratio:3/4; border:3px solid var(--line); border-radius:10px; background:var(--arena); touch-action:none}
#ov{
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
  gap:10px; padding:24px; border-radius:10px;
  background:color-mix(in srgb, var(--bg) 86%, transparent); text-align:center;
}
#ov h2{margin:0; font-size:24px}
#ov p{margin:0 0 4px; color:var(--sub); font-size:14px}
#controls{display:flex; justify-content:space-between; align-items:center; margin-top:12px; user-select:none; -webkit-user-select:none}
#controls.off{opacity:.35; pointer-events:none}
#stick{position:relative; width:130px; height:130px; border-radius:50%; background:var(--panel); border:3px solid var(--line); touch-action:none}
#knob{position:absolute; left:41px; top:41px; width:48px; height:48px; border-radius:50%; background:var(--accent); border:3px solid var(--accent-ink); pointer-events:none}
.acts{display:grid; grid-template-columns:repeat(2,70px); gap:10px}
.act{width:70px; height:70px; border-radius:50%; font-size:13px; padding:0; touch-action:none}
.act.cd{opacity:.5}
@keyframes glow{50%{box-shadow:0 0 16px var(--accent)}}
.act.ready{background:var(--accent); color:var(--accent-ink); border-color:var(--accent-ink); animation:glow 1s infinite}
.fill.ult{background:var(--accent)}
.keys{font-size:12px; color:var(--sub); margin-top:10px}
@media (pointer:coarse){ .keys{display:none} }
.slot{border-left-width:6px}
.slot.t1,.slot.t2{border-left-color:var(--sub)}
.slot.t3,.slot.t4{border-left-color:var(--me)}
.slot.t5{border-left-color:var(--accent)}
.slot.t6{border-left-color:var(--foe)}
.slot.t3 .rank,.slot.t4 .rank{color:var(--me)}
.slot.t5 .rank{color:var(--accent)}
.slot.t6 .rank{color:var(--foe)}
@keyframes pop{0%{transform:scale(1.9)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.slot.landed .rank{animation:pop .35s ease-out}
.slot .pips{grid-column:1/3}
.slot .pn{grid-column:1/3; font-size:14px; margin-top:2px}
.slot .icon{width:64px; height:64px; justify-self:end; border:0; background:none; border-radius:0; aspect-ratio:auto}
.title{font-size:clamp(30px,10.5vw,46px); margin:18px 0 6px; letter-spacing:.06em; line-height:1.25; text-align:center}
.tag{text-align:center; color:var(--sub); font-size:14px; margin:0}
#tv{display:block; width:100%; aspect-ratio:9/7; border:3px solid var(--line); border-radius:10px; background:var(--panel); margin:16px 0}
#pv{display:block; width:100%; aspect-ratio:9/5; border:3px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:12px}
#cv{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.splash{min-height:70vh; display:flex; flex-direction:column; justify-content:center; gap:14px; text-align:center; cursor:pointer}
.sp-main{font-size:clamp(34px,11vw,52px); letter-spacing:.12em; line-height:1.2; animation:rise .9s ease-out both}
.sp-sub{font-size:18px; letter-spacing:.5em; padding-left:.5em; color:var(--sub); animation:rise .9s .5s ease-out both}
.sp-skip{font-size:12px; color:var(--sub); margin-top:26px}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes fadeout{to{opacity:0}}
#s-splash.out{animation:fadeout .45s ease-in forwards}
@media (prefers-reduced-motion: reduce){ .sp-main,.sp-sub{animation:none} #s-splash.out{animation:none; opacity:0} }
@media (prefers-reduced-motion: reduce){ .fill{transition:none} .slot.landed .rank{animation:none} .act.ready{animation:none} }
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">

  <header id="top">
    <a class="back" href="../">← 一覧</a>
    <span class="sp"></span>
    <button id="autoBtn" aria-pressed="false" title="オートモード（O キー）">🤖 オート</button>
    <button id="sndBtn" aria-pressed="true" title="音（M キー）">🔊 音</button>
  </header>

  <section id="s-splash" class="splash" aria-label="ザ・ゲーム プレゼンツ">
    <div class="stripe"></div>
    <div class="sp-main">ザ・ゲーム</div>
    <div class="sp-sub">プレゼンツ</div>
    <div class="stripe"></div>
    <div class="sp-skip">タップでスキップ</div>
  </section>

  <section id="s-title" hidden>
    <div class="stripe" style="margin-top:22px"></div>
    <h1 class="title">アーマーを、ほら</h1>
    <p class="tag">ルーレットでパーツを引いて、3ステージを勝ち抜け。</p>
    <canvas id="tv" width="720" height="560" aria-label="タイトル画面のロボ"></canvas>
    <button class="primary" id="startBtn">スタート</button>
    <p class="tag" id="bestT" style="margin-top:10px"></p>
    <div class="stripe" style="margin-top:22px"></div>
  </section>

  <section id="s-assemble" hidden>
    <h1>パーツ組み立て</h1>
    <div class="stripe"></div>
    <p class="lead" id="lead">ルーレットでパーツを引いて、3ステージを勝ち抜こう。</p>
    <canvas id="pv" width="720" height="400" aria-label="組み立て中のロボ"></canvas>
    <div id="slots"></div>
    <div class="summary" id="summary"></div>
    <button class="primary" id="spinBtn">頭のパーツを回す</button>
    <div class="hint" id="hint"></div>
    <div class="row">
      <span>操作</span>
      <button class="seg sel" data-mode="manual">手動</button>
      <button class="seg" data-mode="auto">オート</button>
    </div>
    <button class="primary" id="goBtn" disabled>出撃</button>
  </section>

  <section id="s-battle" hidden>
    <div class="hud">
      <div class="hudtop"><span id="stageName"></span><button id="modeBtn">手動</button></div>
      <div class="bar"><span>あなた</span><div class="track"><div class="fill me" id="hpMe"></div></div><span id="hpMeT"></span></div>
      <div class="bar"><span>敵</span><div class="track"><div class="fill foe" id="hpFoe"></div></div><span id="hpFoeT"></span></div>
      <div class="bar"><span>必殺</span><div class="track"><div class="fill ult" id="gaugeMe" style="width:0%"></div></div><span id="gaugeT"></span></div>
    </div>
    <div class="stagewrap">
      <canvas id="cv" aria-label="バトルフィールド"></canvas>
      <div id="ov" hidden>
        <h2 id="ovT"></h2><p id="ovP"></p>
        <button class="primary" id="ovA"></button>
        <button id="ovB" hidden></button>
      </div>
    </div>
    <div id="controls">
      <div id="stick"><div id="knob"></div></div>
      <div class="acts">
        <button class="act" id="btnSlash">近接</button>
        <button class="act" id="btnShot">射撃</button>
        <button class="act" id="btnDash">ダッシュ</button>
        <button class="act" id="btnUlt">必殺</button>
      </div>
    </div>
    <p class="keys">PC：WASD / 矢印 移動　J 近接　K 射撃　L ダッシュ　スペース 必殺　O オート　M 音</p>
  </section>

</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return Math.abs(d)};
let seedV=(Date.now()%2147483646)+1;
function rnd(){ seedV=seedV*16807%2147483647; return (seedV-1)/2147483646; }
function gauss(){ let u=0; while(!u)u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); }

/* ---------- データ ---------- */
const TIERS=['E','D','C','B','A','S'];
const SLOTS=[
  {name:'頭',stat:'射撃',parts:['ブリキ頭','双眼カメラ','レーダー頭','タカの目バイザー','精密スコープ','神眼ユニット']},
  {name:'胴',stat:'装甲',parts:['ダンボール胴','鉄板ボディ','装甲コア','重装甲','ミスリル装甲','不壊のコア']},
  {name:'腕',stat:'近接',parts:['ゴム腕','鉄拳','パイルアーム','ブレードアーム','雷撃アーム','覇王の腕']},
  {name:'脚',stat:'速さ',parts:['車輪','二足','キャタピラ','逆関節','ホバー','瞬速脚']},
];
function statsOf(p){
  const t=i=>Math.max(0,p[i]);
  return {hp:80+30*t(1), melee:10+5*t(2), shot:Math.round(4+2.2*t(0)), speed:95+19*t(3),
    dashCd:+(1.3-.1*t(3)).toFixed(1), charge:+(1+.1*t(0)).toFixed(1), slashCd:.6, shotCd:.42};
}
// ルーレットの並び：S のとなりは A
const STRIP=[0,1,2,0,3,1,2,4,5,4,0,1,3,2,1,0,2,3], S_IDX=8, TICK=.075;
const STAGES=[
  {name:'ガラクタ兵',note:'遠くから撃ってくる',hp:150,melee:12,shot:6,speed:100,dashCd:1.8,slashCd:.9,shotCd:.85,bspd:210,pref:120,dodge:.2,aggro:.5,look:[0,1,0,1],r:16,
   pillars:[{x:60,y:222,w:64,h:28},{x:236,y:222,w:64,h:28}]},
  {name:'スチールナイト',note:'近づいて斬ってくる。よけるのがうまい',hp:240,melee:22,shot:8,speed:132,dashCd:1.3,slashCd:.7,shotCd:.8,bspd:230,pref:48,dodge:.5,aggro:.85,look:[2,3,3,2],r:17,
   pillars:[{x:66,y:150,w:36,h:36},{x:258,y:150,w:36,h:36},{x:66,y:296,w:36,h:36},{x:258,y:296,w:36,h:36}]},
  {name:'ザ・ゲーム・キング',note:'3方向の弾と必殺ビームを使うボス',boss:true,hp:300,melee:24,shot:10,speed:128,dashCd:1.2,slashCd:.7,shotCd:1.05,spread:true,bspd:240,pref:100,dodge:.55,aggro:.9,look:[5,5,5,4],r:22,ult:true,
   pillars:[{x:148,y:228,w:64,h:24}]},
];
const TIME_LIMIT=90;

/* ---------- 音 ---------- */
let AC=null, soundOn=LS.get('armor_sound','1')!=='0';
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function snd(f,d=.1,type='square',v=.06,f2=0,delay=0){
  if(!soundOn||!AC||S.manual)return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d=.12,v=.1,f=1200){
  if(!soundOn||!AC||S.manual)return;
  const n=Math.floor(AC.sampleRate*d), buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), fl=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; fl.type='bandpass'; fl.frequency.value=f; g.gain.value=v;
  s.connect(fl).connect(g).connect(AC.destination); s.start();
}
const SFX={
  tick:()=>snd(1200,.025,'square',.025),
  land:t=>{ const base=[330,392,440,523,659,784][t]; snd(base,.12,'square',.06); snd(base*1.5,.18,'square',.06,0,.08); if(t>=4) snd(base*2,.3,'triangle',.07,0,.18); },
  bad:()=>{ snd(300,.15,'square',.05,200); },
  go:()=>{ [523,659,784,1046].forEach((f,i)=>snd(f,.12,'square',.05,0,i*.07)); },
  shot:foe=>snd(foe?520:880,.08,'square',.035,foe?220:330),
  slash:()=>noise(.12,.14,2600),
  hit:()=>{ snd(170,.12,'sawtooth',.07,60); noise(.08,.08,900); },
  dash:()=>noise(.16,.06,600),
  charge:()=>snd(200,.35,'sawtooth',.05,900),
  beam:()=>{ snd(120,.5,'sawtooth',.08,40); noise(.45,.12,500); },
  ko:()=>{ noise(.7,.18,300); snd(90,.7,'sawtooth',.08,30); },
  win:()=>{ [523,659,784,659,784,1046].forEach((f,i)=>snd(f,.16,'square',.05,0,i*.11)); },
  lose:()=>{ [392,330,262,196].forEach((f,i)=>snd(f,.22,'triangle',.07,0,i*.18)); },
};

/* ---------- 状態 ---------- */
const S={screen:'splash',auto:false,manual:false,t:0,splashT:0,run:null,spin:null,autoT:0,bt:null,ovOn:false,
  best:(()=>{try{return JSON.parse(LS.get('armor_best','null'))||{score:0,cleared:0}}catch(e){return {score:0,cleared:0}}})(),
  stats:{runs:0,allClear:0,lose:[0,0,0],timeUp:0}};

/* ---------- 色 ---------- */
const MAT=['#a58a66','#8f9ba6','#4a9e93','#3a78b5','#e8a317','#d64533'];
const DARK='#1d2b38';
let CSSV={};
function readCss(){ const cs=getComputedStyle(document.documentElement); for(const k of ['bg','panel','ink','sub','line','accent','me','foe','arena','wall','grid']) CSSV[k]=cs.getPropertyValue('--'+k).trim(); }
readCss(); try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCss); }catch(e){}
function shade(hex,k){ const n=parseInt(hex.slice(1),16); const f=v=>clamp(Math.round(k<1?v*k:v+(255-v)*(k-1)),0,255); return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`; }

/* ---------- ロボの絵（正面） ---------- */
function rpath(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function rr(c,x,y,w,h,r,fill){ rpath(c,x,y,w,h,r); c.fillStyle=fill; c.fill(); c.stroke(); }
function circ(c,x,y,r,fill,stroke=true){ c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fillStyle=fill; c.fill(); if(stroke)c.stroke(); }
function poly(c,pts,fill){ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); c.fillStyle=fill; c.fill(); c.stroke(); }
function ghost(c,x,y,w,h){ c.save(); c.setLineDash([7,6]); c.lineWidth=2.5; c.strokeStyle=CSSV.sub; c.fillStyle='rgba(128,140,150,.1)'; rpath(c,x,y,w,h,8); c.fill(); c.stroke(); c.setLineDash([]); c.fillStyle=CSSV.sub; c.font='bold 22px "DotGothic16",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('?',x+w/2,y+h/2); c.restore(); }
function thick(c,pts,col,w){ c.lineCap='round'; c.lineJoin='round'; c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.strokeStyle=DARK; c.lineWidth=w+6; c.stroke(); c.strokeStyle=col; c.lineWidth=w; c.stroke(); c.lineWidth=3; c.strokeStyle=DARK; }
function wheel(c,x,y,r,T){ circ(c,x,y,r,'#3b4650'); circ(c,x,y,r*.45,'#aab4bc'); c.beginPath(); const a=T*6; c.moveTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8); c.lineTo(x-Math.cos(a)*r*.8,y-Math.sin(a)*r*.8); c.stroke(); }

function drawLegs(c,t,T){
  if(t<0) return ghost(c,-40,-72,80,72);
  const m=MAT[t], d=shade(m,.7);
  switch(t){

function newRun(){ S.run={stage:1,parts:[-1,-1,-1,-1],next:0,tickets:1,score:0}; S.stats.runs++; S.spin=null; toAsm(); setHint('上のボタンでルーレットを回して、もう一度押してストップ！'); }

}
function refreshAsm(){
  const r=S.run, sp=S.spin, s=statsOf(r.parts);

  $('summary').innerHTML=`HP <b>${s.hp}</b>　近接 <b>${s.melee}</b>　射撃 <b>${s.shot}</b>　速さ <b>${s.speed}</b><br>引き直し券 <b>${r.tickets}</b> 枚　STAGE <b>${r.stage}</b>/3　スコア <b>${r.score}</b>`;

  else { sb.textContent=r.tickets>0?`引き直し券 ${r.tickets} 枚：パーツをタップ`:'組み立て完了！'; sb.disabled=true; }

function startSpin(i,re){ const r=S.run; S.spin={slot:i,re:!!re,old:r.parts[i],pos:Math.floor(rnd()*STRIP.length),t:0,el:0,aiAt:null}; if(S.auto) planAI(); setHint(re?`${SLOTS[i].name}を引き直し中… よいほうが残る`:'回ってる！ もう一度押してストップ'); refreshAsm(); }

  else { r.parts[i]=got; r.next++; setHint(`${TIERS[got]}ランク「${SLOTS[i].parts[got]}」をゲット！`+(r.next>=4?(r.tickets>0?'　引き直し券でパーツをタップしてもう一度回せる':'　出撃しよう！'):'')); }
  (got>=3?SFX.land(got):got>=1?SFX.land(got):SFX.bad());
  const el=slotEls[i]; el.classList.remove('landed'); void el.offsetWidth; el.classList.add('landed'); setTimeout(()=>el.classList.remove('landed'),420);

}

function slotClick(i){ const r=S.run; if(S.screen!=='assemble')return;
  if(S.spin){ if(S.spin.slot===i) stopSpin(); return; }
  if(r.next<4){ setHint('上のボタンで、じゅんばんにルーレットを回そう'); return; }
  if(r.parts[i]>=5){ setHint('そのパーツはもう最高の S ランク！'); return; }

function updateAsm(dt){
  const r=S.run, sp=S.spin;

    if(S.auto&&sp.aiAt!==null&&sp.el>=sp.aiAt) stopSpin(); return; }

function collide(b){

}

function moveBot(b,mx,my,dt){

}
function hangar(c,w,h){ c.setTransform(1,0,0,1,0,0); c.fillStyle=CSSV.panel; c.fillRect(0,0,w,h); c.strokeStyle=CSSV.line; c.lineWidth=2;
  c.beginPath(); for(let x=0;x<w;x+=60){ c.moveTo(x,0); c.lineTo(x,h*.8); } c.stroke();
  c.fillStyle=CSSV.line; c.fillRect(0,h*.8,w,h*.2); c.save(); c.beginPath(); c.rect(0,h*.8,w,10); c.clip(); for(let x=-20;x<w;x+=24){ c.fillStyle=CSSV.accent; c.beginPath(); c.moveTo(x,h*.8+10); c.lineTo(x+12,h*.8); c.lineTo(x+24,h*.8); c.lineTo(x+12,h*.8+10); c.fill(); } c.restore(); }
function renderTitle(){ const c=$('tv').getContext('2d'); hangar(c,720,560); const k=Math.floor(S.t/1.4); const parts=[(k)%6,(k+2)%6,(k+4)%6,(k+1)%6];
  c.fillStyle='rgba(255,230,150,.18)'; c.beginPath(); c.moveTo(300,0); c.lineTo(420,0); c.lineTo(560,470); c.lineTo(160,470); c.fill();
  drawRobot(c,360,470,1.95,parts,S.t); }
function renderPreview(){ const c=$('pv').getContext('2d'); hangar(c,720,400); const r=S.run; if(!r) return; const p=r.parts.slice(); if(S.spin) p[S.spin.slot]=STRIP[S.spin.pos]; drawRobot(c,360,352,1.42,p,S.t); }

/* ---------- 全体の更新 ---------- */
function update(dt){
  S.t+=dt;
  if(S.screen==='splash'){ S.splashT+=dt; if(S.splashT>2.5) $('s-splash').classList.add('out'); if(S.splashT>2.95) toTitle(); }
  else if(S.screen==='title'){ if(S.auto){ S.autoT+=dt; if(S.autoT>.8) newRun(); } }
  else if(S.screen==='assemble') updateAsm(dt);
  else if(S.screen==='battle') updateBattle(dt);
}
function render(){
  if(S.screen==='title') renderTitle();
  else if(S.screen==='assemble'){ renderPreview(); if(Math.floor(S.t*8)!==render.k){ render.k=Math.floor(S.t*8); const r=S.run; if(r) for(let i=0;i<4;i++){ const t=S.spin&&S.spin.slot===i?STRIP[S.spin.pos]:r.parts[i]; if(t===4||t===5||t===2) drawIcon(slotEls[i].querySelector('.icon'),i,t,S.t); } } }
  else if(S.screen==='battle') renderBattle();
}
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!S.manual) update(dt); render(); requestAnimationFrame(frame); }

/* ---------- オート・音 ---------- */
function setAuto(v){
  S.auto=!!v; $('autoBtn').setAttribute('aria-pressed',String(S.auto)); S.autoT=0;
  document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('sel',(b.dataset.mode==='auto')===S.auto));
  if(S.auto){ stick.x=stick.y=0; for(const k in keys) keys[k]=false; $('knob').style.transform='';
    if(S.screen==='splash') toTitle();
    if(S.screen==='title') newRun();
    if(S.spin) planAI(); }
  else if(S.spin) S.spin.aiAt=null;
  if(bt) updHud();
}
function userAct(){ if(S.auto) setAuto(false); }
function setSound(v){ soundOn=v; LS.set('armor_sound',v?'1':'0'); $('sndBtn').setAttribute('aria-pressed',String(v)); $('sndBtn').textContent=v?'🔊 音':'🔇 音'; }
$('autoBtn').addEventListener('click',()=>{ ac(); setAuto(!S.auto); });
$('sndBtn').addEventListener('click',()=>{ ac(); setSound(!soundOn); });
$('modeBtn').addEventListener('click',()=>{ ac(); setAuto(!S.auto); });
document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>{ ac(); setAuto(b.dataset.mode==='auto'); }));
$('startBtn').addEventListener('click',()=>{ ac(); newRun(); });
$('spinBtn').addEventListener('click',()=>{ ac(); userAct(); spinPress(); });
$('goBtn').addEventListener('click',()=>{ ac(); userAct(); go(); });
$('s-splash').addEventListener('pointerdown',()=>{ ac(); toTitle(); });

/* ---------- 操作 ---------- */
function press(a){ if(!bt||bt.phase!=='fight') return; const p=bt.me;
  if(a==='slash') doSlash(p); else if(a==='shot') doShot(p); else if(a==='dash'){ const [x,y]=humanInput(); doDash(p,x,y); } else if(a==='ult') doUlt(p); }
[['btnSlash','slash'],['btnShot','shot'],['btnDash','dash'],['btnUlt','ult']].forEach(([id,a])=>{
  $(id).addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); userAct(); press(a); });
});
const stickEl=$('stick'), knob=$('knob');
function stickMove(e){ const r=stickEl.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const m=r.width/2-24, l=Math.hypot(dx,dy); if(l>m){dx*=m/l;dy*=m/l;} knob.style.transform=`translate(${dx}px,${dy}px)`; stick.x=dx/m; stick.y=dy/m; }
function stickEnd(e){ if(e.pointerId!==stick.id) return; stick.id=null; stick.x=stick.y=0; knob.style.transform=''; }
stickEl.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); userAct(); stick.id=e.pointerId; try{stickEl.setPointerCapture(e.pointerId)}catch(_){} stickMove(e); });
stickEl.addEventListener('pointermove',e=>{ if(e.pointerId===stick.id) stickMove(e); });
stickEl.addEventListener('pointerup',stickEnd); stickEl.addEventListener('pointercancel',stickEnd);
const MOVE=['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'];
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!S.auto); return; }
  if(k==='m'){ ac(); setSound(!soundOn); return; }
  if(S.screen==='splash'){ ac(); toTitle(); return; }
  if(S.screen==='title'){ if(k==='enter'||k===' '){ e.preventDefault(); ac(); newRun(); } return; }
  if(S.screen==='assemble'){ if((k==='enter'||k===' ')&&!e.repeat){ e.preventDefault(); ac(); userAct(); if(S.spin||S.run.next<4) spinPress(); else go(); } return; }
  if(S.screen==='battle'){
    if(S.ovOn){ if(k==='enter'&&!e.repeat){ e.preventDefault(); $('ovA').click(); } return; }
    if(MOVE.includes(k)){ e.preventDefault(); userAct(); keys[k]=true; return; }
    if(e.repeat) return;
    const a={j:'slash',z:'slash',k:'shot',x:'shot',l:'dash',shift:'dash',c:'dash',' ':'ult',u:'ult'}[k];
    if(a){ e.preventDefault(); ac(); userAct(); press(a); }
  }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });

/* ---------- テスト用フック ---------- */
window.__armor={
  get s(){ return S; }, get bt(){ return bt; },
  setAuto, start:()=>{ newRun(); }, seed:v=>{ seedV=(Math.abs(v|0)%2147483646)+1; },
  manual:()=>{ S.manual=true; }, step:(dt=1/60)=>update(dt),
  setParts:p=>{ S.run.parts=p.slice(); S.run.next=4; S.spin=null; refreshAsm(); }, go, stats:()=>statsOf(S.run.parts),
  skip:()=>toTitle(), stageTo:n=>{ S.run.stage=n; toAsm(); },
};

buildSlots(); setSound(soundOn); renderBest();
requestAnimationFrame(frame);
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
