<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="マサ新影流の後継者・宮沢活人が、敵のツボ（秘孔）を突いて倒す2Dアクション。自分のツボを押して回復・攻撃力アップ・防御力アップ。全3面、最後は黒影殺との対決">
<title>活殺ツボ拳</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<style>
:root{--bg:#120C10;--bg2:#2A1A20;--paper:#F2E6C8;--ink:#2A1608;--line:#A0642C;--red:#D8402C;--gold:#F2B83A;--blue:#5AB4FF;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#3A1E26 0%,var(--bg) 70%);color:#fff;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
#app{max-width:560px;margin:0 auto;height:100%;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px}
#top{display:flex;align-items:center;gap:8px;position:relative;z-index:25}
#top a{color:#F0D4B0;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:999px;padding:6px 10px;background:var(--bg2);color:#fff;cursor:pointer}
.mini[aria-pressed=true]{background:#E0A83A;color:#2A1608}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hud{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px 8px;align-items:center;font-size:11px;font-weight:800}
#hud .lv{color:var(--gold);font-size:14px}
.bar{height:11px;border-radius:99px;background:#000;overflow:hidden;box-shadow:inset 0 0 0 1px #5A3A40;position:relative}
.bar i{display:block;height:100%;width:100%;transition:width .12s}
#hp i{background:linear-gradient(90deg,#4CC070,#9AE860)}
#ki i{background:linear-gradient(90deg,#3A7AE0,#7AC8FF)}
#xp{grid-column:1/4;height:5px}
#xp i{background:#F2B83A}
#info{grid-column:1/4;display:flex;gap:8px;justify-content:space-between;color:#E8D4C0}
#buffs{color:#FFD890}
#wrap{position:relative;flex:0 1 auto;width:100%;aspect-ratio:360/320;min-height:90px;border-radius:12px;overflow:hidden;background:#0A0608;box-shadow:inset 0 0 0 2px #5A3A40}
#cv{display:block;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(20,8,10,.88);color:#FFE7A0;font-size:13px;font-weight:800;padding:5px 12px;border-radius:10px;width:max-content;max-width:94%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#spd{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:800;color:#9AF0A8;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:99px;display:none}
#ctl{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;user-select:none}
.pad{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:6px}
.cb{font:inherit;font-weight:800;border:2px solid #fff;border-radius:14px;color:#fff;background:#3A2A30;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.mv{width:66px;height:66px;font-size:26px}
.cb.on,.cb:active{filter:brightness(1.4);transform:translateY(2px)}
.hit{width:104px;height:46px;font-size:15px;line-height:1.1;border-radius:12px}
.hit small{display:block;font-size:10px;font-weight:600;opacity:.85}
#bH{background:#C0382C}#bM{background:#D08A20}#bL{background:#2F8A5A}
.sk{width:62px;height:62px;font-size:11px;line-height:1.15;padding:0;border-radius:50%;position:relative}
.sk b{display:block;font-size:20px}
.sk:disabled{filter:grayscale(.9) brightness(.55)}
#sk1{background:#2F8A5A}#sk2{background:#C0382C}#sk3{background:#2F6AC0}
#skrow{margin-top:auto;display:flex;gap:10px;justify-content:center;align-items:center}
.panel{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:14px;box-shadow:0 5px 0 #5A3A18}
.full{position:fixed;inset:0;z-index:20;overflow:auto;background:radial-gradient(120% 70% at 50% 0%,#4A2430 0%,var(--bg) 72%)}
.full .in{max-width:560px;margin:0 auto;padding:46px 14px 30px}
#title{text-align:center}
#title h2{font-size:42px;margin:6px 0 0;line-height:1.1;background:linear-gradient(180deg,#FFE9B0,#E0502C);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{font-size:14px;font-weight:800;color:#F0C8A0;margin:2px 0 6px}
#title p{font-size:13px;color:#EAD0C0;margin:4px 0;line-height:1.6}
#title canvas{width:100%;max-width:340px;aspect-ratio:340/200;display:block;margin:6px auto;border-radius:12px}
.btns{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:12px auto 0}
.big{width:100%;font:inherit;font-size:16px;font-weight:800;border:2px solid #7A5420;border-radius:12px;padding:12px;background:var(--gold);color:#2A1608;cursor:pointer;display:block;text-align:center}
.big.sub{background:var(--paper);border-color:#A0642C}
#title small{display:block;margin-top:12px;font-size:11px;color:#B89888;line-height:1.6}
#sel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:10px auto 0}
#sel button{font:inherit;font-size:13px;font-weight:800;border:2px solid #A0642C;border-radius:10px;padding:8px 0;background:var(--paper);color:var(--ink);cursor:pointer}
#sel button:disabled{opacity:.35}
#ov{background:rgba(10,4,6,.82);display:flex;align-items:flex-start;justify-content:center;padding:46px 14px 14px}
#ov .card{width:100%;max-width:440px;margin:auto;color:var(--ink);padding:14px 14px 16px;background:var(--paper);border:2px solid var(--line);border-radius:14px;box-shadow:0 6px 0 #5A3A18}
#ov h3{margin:0 0 2px;font-size:20px;text-align:center}
#ov .tag{font-size:12px;font-weight:800;color:#8A4A18;letter-spacing:.08em;text-align:center}
#ov p{font-size:14px;line-height:1.65;margin:6px 0}
#ov .row{display:flex;gap:8px;margin-top:12px}
#ov .row .big{flex:1;font-size:15px;padding:10px}
#ov .who{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
#ov .who .face{font-size:38px;line-height:1}
#ov .who .t{font-size:14px;line-height:1.65;font-weight:700;background:#fff;border:1px solid #D8B880;border-radius:10px;padding:8px 10px;flex:1}
#ov .who .t small{display:block;font-size:11px;color:#8A4A18}
.stat{display:flex;justify-content:space-around;margin:8px 0;font-size:13px;font-weight:800}
.stat b{display:block;font-size:20px;color:#8A4A18;font-variant-numeric:tabular-nums}
.rank{font-size:56px;font-weight:800;color:#C8402A;text-align:center;line-height:1.1}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.tbl td{border-top:1px solid #D8B880;padding:3px 4px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>👊 活殺ツボ拳</h1>
    <button class="mini" id="bSnd" aria-pressed="true">🔊</button>
    <button class="mini" id="bAuto" aria-pressed="false" title="オートモード（Oキー）">🤖 オート</button>
  </div>
  <div id="hud">
    <span class="lv" id="lv">Lv1</span><div class="bar" id="hp"><i></i></div><div class="bar" id="ki"><i></i></div>
    <div class="bar" id="xp"><i></i></div>
    <div id="info"><span id="stn"></span><span id="buffs"></span><span id="left"></span></div>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="toast"></div><div id="spd">▶▶ オート</div></div>
  <div id="skrow">
    <button class="cb sk" id="sk1"><b>💚</b>足三里<br>回復</button>
    <button class="cb sk" id="sk2"><b>🔥</b>合谷<br>攻撃↑</button>
    <button class="cb sk" id="sk3"><b>🛡</b>腎兪<br>防御↑</button>
  </div>
  <div id="ctl">
    <div class="pad"><button class="cb mv" id="bL2">◀</button><button class="cb mv" id="bR2">▶</button></div>
    <div></div>
    <div class="col"><button class="cb hit" id="bH">上段突き<small>頭のツボ</small></button><button class="cb hit" id="bM">中段突き<small>胸のツボ</small></button><button class="cb hit" id="bL">下段突き<small>足のツボ</small></button></div>
  </div>
</div>
<div id="title" class="full"><div class="in">
  <h2>活殺ツボ拳</h2><div class="sub">― マサ新影流 後継者伝 ―</div>
  <canvas id="tcv" width="680" height="400"></canvas>
  <p>後継者・<b>宮沢 活人</b>（みやざわ かつと）。<br>敵の「ツボ」を突いて、のばしてしまえ。</p>
  <p>自分のツボを押せば、回復・攻撃力アップ・防御力アップ。<br>レベルが上がると、もっと強いツボが使える。</p>
  <div class="btns"><button class="big" id="bNew">はじめから</button><button class="big sub" id="bCont" hidden>つづきから</button></div>
  <div id="sel" hidden></div>
  <small id="tbest"></small>
  <small>操作：← → / A D で移動、Z X C（J K L）で上・中・下段突き、1 2 3 で自分のツボ、O でオート</small>
</div></div>
<div id="ov" class="full" hidden><div class="card"></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let seedV=0; function rnd(){ if(!seedV) return Math.random(); seedV|=0; seedV=seedV+0x6D2B79F5|0; let t=Math.imul(seedV^seedV>>>15,1|seedV); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const fmt=n=>Math.round(n).toLocaleString('ja-JP');

/* ================= data ================= */
const W=360, H=320, GY=252, REACH=46;
const HY=[-58,-36,-12];                         // body height (head / chest / leg) relative to the ground line
const TS_NAME=[['人中','膻中','足三里'],['風池','中脘','委中'],['百会','巨闕','湧泉']];
const TS_DMG=[0,34,62,110];
const EXP_THR=[0,0,40,120,240,400];             // exp needed for Lv2..Lv5
const HNAME=['上段','中段','下段'];
const ENEMY={
 thug:{n:'ごろつき',hp:30,spd:38,reach:30,dmg:9,wind:.55,rec:.9,ts:1,exp:15,col:'#B8683A',pts:100},
 fighter:{n:'拳法家',hp:46,spd:58,reach:34,dmg:12,wind:.45,rec:.7,ts:2,exp:22,col:'#3A9A6A',pts:160},
 elite:{n:'殺影会の精鋭',hp:64,spd:64,reach:36,dmg:15,wind:.4,rec:.6,ts:3,exp:30,col:'#3A3A58',blink:true,pts:250},
 boss:{n:'黒影 殺',hp:420,spd:54,reach:44,dmg:20,wind:.5,rec:.8,ts:0,exp:0,col:'#5A1428',boss:true,pts:3000}
};
const STAGES=[
 {n:'夜の路地裏',bg:'alley',q:['thug','thug','thug','thug','thug','thug','thug','thug'],max:2,gap:2.2,
  pre:['宮沢 活人','ここは 街の はずれの 路地裏。殺影会の ごろつきが 暴れている。','ごろつきは ツボが ひとつ。光る点の 高さに 合わせて 突け！']},
 {n:'ネオン商店街',bg:'street',q:['thug','fighter','fighter','thug','fighter','fighter','fighter','fighter'],max:3,gap:2.0,
  pre:['宮沢 活人','商店街に 殺影会の 拳法家たちが 待ちぶせていた。','拳法家は ツボが ふたつ。一発では 終わらない。']},
 {n:'殺影会 本部道場',bg:'dojo',q:['fighter','elite','elite','fighter','elite','elite','elite','boss'],max:3,gap:1.9,
  pre:['宮沢 活人','殺影会の 本部。奥に 黒影 殺が いる。','精鋭は ツボが 点滅する。光った ときを ねらえ！']}
];
const SK=[{k:'heal',n:'足三里',d:'回復'},{k:'atk',n:'合谷',d:'攻撃力アップ'},{k:'def',n:'腎兪',d:'防御力アップ'}];
const SK_COST=40, BUFF_T=12;

/* ================= audio ================= */
let ac=null, soundOn=true;
try{ soundOn=localStorage.getItem('tsuboken_snd')!=='0'; }catch(_){}
function AC(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d,type='square',v=0.06,sl=0,at=0){ if(!soundOn) return; const a=AC(); if(!a) return; const t=a.currentTime+at; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(sl) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.02); }
function noise(d,v=0.08,fr=1500,at=0){ if(!soundOn) return; const a=AC(); if(!a) return; const t=a.currentTime+at; const n=Math.floor(a.sampleRate*d), buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(); s.buffer=buf; const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=fr; const g=a.createGain(); g.gain.value=v; s.connect(fl).connect(g).connect(a.destination); s.start(t); }
const SFX={
 swing(){ noise(0.07,0.04,2500); },
 punch(){ noise(0.1,0.1,900); tone(150,0.1,'square',0.06,-70); },
 tsubo(t){ tone(1300+t*200,0.12,'triangle',0.09); tone(1950+t*200,0.3,'triangle',0.07,0,0.05); noise(0.12,0.06,3000); },
 hurt(){ noise(0.18,0.12,500); tone(110,0.2,'sawtooth',0.07,-50); },
 ko(){ tone(420,0.35,'square',0.06,-300); noise(0.2,0.08,700); },
 press(){ tone(240,0.22,'sine',0.1,160); },
 heal(){ [523,659,784].forEach((f,i)=>tone(f,0.2,'sine',0.07,0,i*0.08)); },
 buff(){ tone(330,0.3,'sawtooth',0.05,330); tone(660,0.25,'triangle',0.05,0,0.12); },
 lv(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.16,'triangle',0.07,0,i*0.07)); },
 clear(){ [392,523,659,784,1046].forEach((f,i)=>tone(f,0.2,'triangle',0.07,0,i*0.1)); },
 bad(){ tone(200,0.4,'sawtooth',0.06,-120); },
 parry(){ tone(1600,0.06,'square',0.05); tone(800,0.1,'square',0.05,0,0.05); }
};

/* ================= state ================= */
const SAVE_KEY='tsuboken_save_v1';
const defSave=()=>({unlocked:1,lv:1,exp:0,best:0});
let SV=defSave();
try{ const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(j&&j.unlocked) SV=Object.assign(defSave(),j); }catch(_){}
const save=()=>{ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(SV)); }catch(_){} };
const maxHp=lv=>100+(lv-1)*20;
const tierOf=lv=>lv>=5?3:lv>=3?2:1;
const S={mode:'title',auto:false,si:0,t:0,score:0,kills:0,tsHits:0,P:null,E:[],q:[],spawnT:0,fx:[],texts:[],keys:{},hold:{l:false,r:false},shake:0,flash:0,wait:0,after:null,res:null,tcombo:0,tcT:0,bossIntro:false,end:0,toastT:0,lvStart:1,expStart:0};
function newPlayer(lv,exp){ return {x:W/2,face:1,hp:maxHp(lv),lv,exp,ki:20,act:'idle',actT:0,pokeH:1,hitDone:false,pressK:0,inv:0,stun:0,atkB:0,defB:0,walk:0,vx:0,hurtT:0}; }

/* ================= helpers ================= */
const alive=()=>S.E.filter(e=>!e.dead);
function addText(x,y,txt,col='#fff',big=false){ S.texts.push({x,y,txt,col,t:0,big}); }
function burst(x,y,col,n=8,sp=3){ for(let i=0;i<n;i++){ const a=rnd()*6.283, s=(0.4+rnd())*sp*30; S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:0,life:0.35+rnd()*0.3,col}); } }
function ring(x,y,col){ S.fx.push({x,y,ring:true,t:0,life:0.45,col}); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.opacity=1; S.toastT=2.4; }
const tsName=(h,lv)=>TS_NAME[tierOf(lv)-1][h];

/* ================= stage flow ================= */
function startStage(si,keep){
  S.si=si; const lv=SV.lv, exp=SV.exp; S.P=newPlayer(lv,exp); S.E=[]; S.q=STAGES[si].q.slice(); S.spawnT=0.6; S.fx=[]; S.texts=[]; S.t=0; S.kills=0; S.tsHits=0; if(!keep) S.score=0; S.tcombo=0; S.bossIntro=false; S.end=0; S.res=null; S.lvStart=lv; S.expStart=exp;
  S.mode='play'; closeOv(); $('#title').hidden=true; hud(); toast('第'+(si+1)+'面　'+STAGES[si].n);
}
function spawn(){
  const st=STAGES[S.si]; if(!S.q.length) return; const type=S.q[0];
  if(type==='boss'){ if(alive().length) return; if(!S.bossIntro){ S.bossIntro=true; return bossIntro(); } }
  else if(alive().length>=st.max) return;
  S.q.shift(); const d=ENEMY[type], side=S.kills%2===0?1:-1;
  const e={type,d,x:side>0?W+26:-26,face:side>0?-1:1,hp:d.hp,max:d.hp,ts:d.ts,h:Math.floor(rnd()*3),state:'walk',st:0,stun:0,t:rnd()*3,flash:0,dead:0,chT:1.6,vx:0,boss:!!d.boss,phase:1,ah:1,att:0};
  if(d.boss){ e.x=W-40; e.face=-1; }
  S.E.push(e);
}
function bossIntro(){
  S.mode='story';
  showStory([['👹','黒影 殺','来たか、マサ新影流の小僧。ツボは「壊す」ためにある。殺法こそ 真の拳だ！'],['👊','宮沢 活人','ちがう。ツボは 人を「活かす」ためにある。あなたの 肩こりも、ほぐしてやる。'],['👹','黒影 殺','……ほざけ！']],()=>{ S.mode='play'; });
}
function clearStage(){
  S.mode='clear'; SFX.clear(); const si=S.si, last=si>=STAGES.length-1;
  SV.lv=S.P.lv; SV.exp=S.P.exp; SV.unlocked=Math.max(SV.unlocked,Math.min(3,si+2)); SV.best=Math.max(SV.best,S.score); save();
  S.res={si,last};
  if(last) return finale();
  showClear();
}
function failStage(){ S.mode='fail'; SFX.bad(); showFail(); }

/* ================= leveling ================= */
function gainExp(n){ const P=S.P; P.exp+=n; while(P.lv<5&&P.exp>=EXP_THR[P.lv+1]){ P.lv++; const mh=maxHp(P.lv); P.hp=Math.min(mh,P.hp+Math.round(mh*0.35)); SFX.lv(); const nw=tierOf(P.lv)>tierOf(P.lv-1); toast('レベルアップ！ Lv'+P.lv+(nw?'　新しいツボ「'+TS_NAME[tierOf(P.lv)-1].join('・')+'」！':'')); addText(P.x,GY-80,'LEVEL UP!','#FFE070',true); ring(P.x,GY-30,'#FFE070'); } hud(); }

/* ================= actions ================= */
function nearestEnemy(maxd=160){ const P=S.P; let b=null,bd=maxd; for(const e of alive()){ const d=Math.abs(e.x-P.x); if(d<bd){ bd=d; b=e; } } return b; }
function poke(h){
  const P=S.P; if(S.mode!=='play'||P.act!=='idle'||P.stun>0) return false;
  const e=nearestEnemy(); if(e) P.face=e.x>=P.x?1:-1;
  P.act='poke'; P.actT=0; P.pokeH=h; P.hitDone=false; SFX.swing(); return true;
}
function resolvePoke(){
  const P=S.P; P.hitDone=true; let tg=null,bd=1e9;
  for(const e of alive()){ const dx=(e.x-P.x)*P.face; if(dx>=-8&&dx<=REACH&&dx<bd){ bd=dx; tg=e; } }
  if(!tg){ return; }

/* ================= update ================= */
function update(dt){
  S.toastT=Math.max(0,S.toastT-dt); if(S.toastT<=0) $('#toast').style.opacity=0;
  for(const f of S.fx){ f.t+=dt; if(!f.ring){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=240*dt; } } S.fx=S.fx.filter(f=>f.t<f.life);
  for(const t of S.texts) t.t+=dt; S.texts=S.texts.filter(t=>t.t<1.2);
  S.shake=Math.max(0,S.shake-dt); S.flash=Math.max(0,S.flash-dt);
  if(S.after&&S.wait>0&&S.auto){ S.wait-=dt; if(S.wait<=0){ const f=S.after; S.after=null; f(); } }
  if(S.mode!=='play') return;
  S.t+=dt; const P=S.P;
  if(S.end>0){ S.end+=dt; for(const e of S.E) if(e.dead) e.dead+=dt; if(S.end>1.6) clearStage(); return; }
  if(S.tcT>0){ S.tcT-=dt; if(S.tcT<=0) S.tcombo=0; }
  P.inv=Math.max(0,P.inv-dt); P.stun=Math.max(0,P.stun-dt); P.atkB=Math.max(0,P.atkB-dt); P.defB=Math.max(0,P.defB-dt); P.ki=Math.min(100,P.ki+dt*2.5);
  // input
  let mv=0, wantPoke=-1, wantSk=-1;
  if(S.auto){ const a=aiStep(dt); mv=a.mv; wantPoke=a.poke; wantSk=a.sk; }
  else { const k=S.keys; mv=((k.ArrowRight||k.d||k.D||S.hold.r)?1:0)-((k.ArrowLeft||k.a||k.A||S.hold.l)?1:0); }
  if(wantPoke>=0) poke(wantPoke); if(wantSk>=0) skill(wantSk);
  // player
  if(P.act==='idle'&&P.stun<=0){ P.x+=mv*108*dt; if(mv){ P.face=mv; P.walk+=dt*9; } }
  P.x+=P.vx*dt; P.vx*=Math.pow(0.0005,dt); P.x=clamp(P.x,14,W-14);
  if(P.act==='poke'){ P.actT+=dt; if(!P.hitDone&&P.actT>=0.07) resolvePoke(); if(P.actT>=0.34) P.act='idle'; }
  else if(P.act==='press'){ P.actT+=dt; if(P.actT>=0.5){ P.act='idle'; applySkill(P.pressK); } }
  // spawn
  S.spawnT-=dt; if(S.spawnT<=0){ spawn(); S.spawnT=STAGES[S.si].gap; }
  // enemies
  for(const e of S.E){
    if(e.dead){ e.dead+=dt; continue; }
    e.t+=dt; e.flash=Math.max(0,e.flash-dt); e.x+=e.vx*dt; e.vx*=Math.pow(0.001,dt);
    if(e.boss){ e.chT-=dt; if(e.chT<=0){ let nh; do{ nh=Math.floor(rnd()*3); }while(nh===e.h); e.h=nh; e.chT=e.phase===2?1.3:1.8; } }
    if(e.stun>0){ e.stun-=dt; continue; }
    const dx=P.x-e.x, ad=Math.abs(dx); e.face=dx>=0?1:-1; const sp=e.d.spd*(e.phase===2?1.4:1);
    if(e.state==='walk'){ if(ad>e.d.reach-6) e.x+=e.face*sp*dt; if(ad<=e.d.reach-2||(ad<=e.d.reach+2&&rnd()<dt*3)){ e.state='wind'; e.st=e.d.wind*(e.phase===2?0.75:1); e.ah=Math.floor(rnd()*3); } }
    else if(e.state==='wind'){ e.st-=dt; if(e.st<=0){ if(Math.abs(P.x-e.x)<=e.d.reach+8) hurtPlayer(e.d.dmg,e.x); SFX.swing(); e.state='rec'; e.st=e.d.rec*(e.phase===2?0.6:1); } }
    else if(e.state==='rec'){ e.st-=dt; if(e.st<=0) e.state='walk'; }
  }
  // keep enemies from stacking
  const L=alive(); for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){ const a=L[i],b=L[j], d=a.x-b.x; if(Math.abs(d)<22){ const p=(22-Math.abs(d))/2*(d>=0?1:-1); a.x+=p; b.x-=p; } }
  S.E=S.E.filter(e=>!(e.dead>1.3));
  if(!S.q.length&&!alive().length&&S.end<=0&&!S.E.some(e=>e.dead)) clearStage();
  hud(true);
}

/* ================= auto (perfect, fast) ================= */
function aiStep(dt){
  const P=S.P, out={mv:0,poke:-1,sk:-1}, L=alive();
  if(P.act==='idle'&&P.stun<=0&&P.ki>=SK_COST){
    const boss=L.some(e=>e.boss);
    if(P.hp<maxHp(P.lv)*0.55) out.sk=0; else if(L.length&&P.atkB<=0&&(boss||L.length>=2||S.si>=1)) out.sk=1; else if(L.length&&P.defB<=0&&(boss||P.hp<maxHp(P.lv)*0.8)) out.sk=2;
  }
  let e=null,bd=1e9; for(const x of L){ const d=Math.abs(x.x-P.x); if(d<bd){ bd=d; e=x; } }
  if(!e){ out.mv=Math.abs(P.x-W/2)>8?Math.sign(W/2-P.x):0; return out; }
  const dx=e.x-P.x, ad=Math.abs(dx), sgn=Math.sign(dx)||1;
  let ready=false;
  if(e.d.blink) ready=(0.95-(e.t%1.4))>=0.14&&(e.t%1.4)<0.95; else if(e.boss) ready=e.chT>0.14; else ready=true;
  if(P.act==='idle'&&P.stun<=0&&ad<=REACH-5&&ready){ out.poke=e.h; return out; }
  if(P.act!=='idle'||P.stun>0) return out;
  if(e.state==='wind'&&ad<=e.d.reach+12) out.mv=-sgn;              // dodge the telegraphed swing
  else if(ad>REACH-8) out.mv=sgn;                                   // close in to just inside our reach
  else if(ad<REACH-18) out.mv=-sgn;                                 // stay outside theirs
  return out;
}

  for(const t of S.texts){ const k=t.t/1.2; g.globalAlpha=1-k*k; g.font=(t.big?'bold 15px ':'bold 12px ')+'sans-serif'; g.textAlign='center'; g.lineWidth=3; g.strokeStyle='#000'; g.strokeText(t.txt,t.x,t.y-k*26); g.fillStyle=t.col; g.fillText(t.txt,t.x,t.y-k*26); g.globalAlpha=1; }
  const boss=S.E.find(e=>e.boss&&!e.dead); if(boss){ rr(40,8,W-80,10,'#000'); rr(41,9,(W-82)*Math.max(0,boss.hp/boss.max),8,boss.phase===2?'#FF3A3A':'#C040E0'); g.fillStyle='#fff'; g.font='bold 10px sans-serif'; g.textAlign='center'; g.fillText('黒影 殺',W/2,30); }
  if(S.flash>0){ g.fillStyle='rgba(255,255,255,'+(S.flash/0.6)+')'; g.fillRect(0,0,W,H); }
  g.restore();
}
function drawTitle(){
  const tc=$('#tcv'), q=tc.getContext('2d'); q.save(); q.scale(2,2); const gr=q.createLinearGradient(0,0,0,200); gr.addColorStop(0,'#2A0C20'); gr.addColorStop(1,'#6A2024'); q.fillStyle=gr; q.fillRect(0,0,340,200);
  q.fillStyle='#FFE9B0'; q.beginPath(); q.arc(270,50,26,0,7); q.fill(); q.fillStyle='#4A1424'; q.beginPath(); q.arc(282,44,24,0,7); q.fill();
  q.fillStyle='#1A0A12'; q.fillRect(0,160,340,40); q.fillStyle='#8A3A30'; q.fillRect(0,160,340,3);
  q.translate(0,160-GY); g=q; S.t=0.3;
  drawFighter({x:96,face:1,skin:'#F0C8A0',cloth:'#F4F0E8',belt:'#111',hair:'#222',pants:'#F4F0E8',band:'#D8302C',pokeT:0.2,pokeY:-58,walk:0,flash:0});

  const px=244, py=GY-58*1.35; const rg=q.createRadialGradient(px,py,1,px,py,14); rg.addColorStop(0,'#fff'); rg.addColorStop(0.5,'rgba(255,200,40,.85)'); rg.addColorStop(1,'rgba(255,160,0,0)'); q.fillStyle=rg; q.beginPath(); q.arc(px,py,14,0,7); q.fill();
  g=main2d; q.restore();

/* ================= UI ================= */
const ov=$('#ov'), card=ov.querySelector('.card');
const openOv=h=>{ card.innerHTML=h; ov.hidden=false; ov.scrollTop=0; }; const closeOv=()=>{ ov.hidden=true; };
function wait(sec,fn){ S.wait=sec; S.after=fn; }
function hud(fast){
  const P=S.P; if(!P) return; const mh=maxHp(P.lv);
  $('#lv').textContent='Lv'+P.lv; $('#hp i').style.width=Math.max(0,P.hp/mh*100)+'%'; $('#ki i').style.width=P.ki+'%';
  const cur=P.exp-EXP_THR[P.lv], need=P.lv>=5?1:EXP_THR[P.lv+1]-EXP_THR[P.lv]; $('#xp i').style.width=(P.lv>=5?100:Math.min(100,cur/need*100))+'%';
  $('#stn').textContent=(S.si+1)+'. '+STAGES[S.si].n+'　HP '+Math.ceil(P.hp)+'/'+mh+'　気 '+Math.floor(P.ki); $('#left').textContent='のこり '+(S.q.length+alive().length)+'人';
  $('#buffs').textContent=(P.atkB>0?'🔥'+Math.ceil(P.atkB)+' ':'')+(P.defB>0?'🛡'+Math.ceil(P.defB):'');
  for(let k=0;k<3;k++){ $('#sk'+(k+1)).disabled=P.ki<SK_COST||S.mode!=='play'; }
}
function showStory(pages,done){
  let i=0; S.mode==='play'&&(S.mode='story'); const adv=()=>{ i++; if(i<pages.length) draw(); else { closeOv(); done(); } };
  const draw=()=>{ const p=pages[i]; openOv('<div class="who"><div class="face">'+p[0]+'</div><div class="t"><small>'+p[1]+'</small>'+p[2]+'</div></div><div class="row"><button class="big" id="bSn">'+(i<pages.length-1?'つぎへ':'おう！')+'</button></div>'); $('#bSn').onclick=()=>{ if(S.auto) return; adv(); }; wait(S.auto?0.7:0,adv); if(!S.auto) S.after=null; };
  draw();
}
function toTitle(){ S.mode='title'; closeOv(); $('#title').hidden=false; $('#bCont').hidden=!(SV.unlocked>1||SV.lv>1); buildSel(); $('#tbest').textContent=SV.best?'ベストスコア '+fmt(SV.best):''; }
function buildSel(){ const s=$('#sel'); if(SV.unlocked<=1){ s.hidden=true; return; } s.hidden=false; s.innerHTML=''; for(let i=0;i<3;i++){ const b=document.createElement('button'); b.textContent='第'+(i+1)+'面'; b.disabled=i>=SV.unlocked; b.onclick=()=>showBrief(i); s.appendChild(b); } }
function startNew(){ SV.lv=1; SV.exp=0; save(); $('#title').hidden=true; S.mode='story';
  showStory([['👴','師範 マサ','活人よ。マサ新影流は 人を「活かす」活法と、人を「倒す」殺法を あわせ持つ。'],['👴','師範 マサ','その殺法を 悪用する 一派「殺影会」が 街で 暴れておる。頭領は 黒影 殺。'],['👴','師範 マサ','おぬしは ツボを 見ぬく 目を 持つ。光る ツボを 突けば、敵は のびる。'],['👴','師範 マサ','自分の ツボを 押せば、回復・攻撃力アップ・防御力アップ。気を ためて 使うのじゃ。ゆけ！']],()=>showBrief(0)); }
function showBrief(si){
  S.mode='brief'; S.si=si; const st=STAGES[si], lv=SV.lv, tier=tierOf(lv);
  openOv('<div class="tag">STAGE '+(si+1)+' / 3</div><h3>'+st.n+'</h3><p>'+st.pre[1]+'<br>'+st.pre[2]+'</p><table class="tbl"><tr><td>いまのレベル</td><td><b>Lv'+lv+'</b></td></tr><tr><td>使えるツボ（上・中・下）</td><td><b>'+TS_NAME[tier-1].join(' / ')+'</b></td></tr></table><div class="row"><button class="big" id="bGo">たたかう！</button></div>');
  $('#bGo').onclick=()=>{ if(S.auto) return; AC(); startStage(si); }; wait(S.auto?0.9:0,()=>startStage(si)); if(!S.auto) S.after=null;
}
function showClear(){
  const si=S.si, P=S.P;
  openOv('<div class="tag">STAGE CLEAR</div><h3>'+STAGES[si].n+'</h3><div class="stat"><div>たおした<b>'+S.kills+'</b></div><div>ツボ命中<b>'+S.tsHits+'</b></div><div>スコア<b>'+fmt(S.score)+'</b></div></div><p style="text-align:center">Lv'+P.lv+(P.lv>S.lvStart?'（Lv'+S.lvStart+' から アップ！）':'')+'　つぎは 「'+STAGES[si+1].n+'」</p><div class="row"><button class="big" id="bNx">つぎの面へ</button><button class="big sub" id="bTi">タイトル</button></div>');
  $('#bNx').onclick=()=>{ if(!S.auto) showBrief(si+1); }; $('#bTi').onclick=toTitle; wait(S.auto?1.2:0,()=>showBrief(si+1)); if(!S.auto) S.after=null;
}
function showFail(){
  openOv('<div class="tag">GAME OVER</div><h3>やられた…</h3><p style="text-align:center">この面を もういちど。<br>ツボの 高さ（上・中・下）を よく見て、敵が殴る前に 突こう。</p><div class="row"><button class="big" id="bRe">もういちど</button><button class="big sub" id="bTi">タイトル</button></div>');
  $('#bRe').onclick=()=>{ if(!S.auto) startStage(S.si); }; $('#bTi').onclick=toTitle; wait(S.auto?1.0:0,()=>startStage(S.si)); if(!S.auto) S.after=null;
}
function finale(){
  showStory([['👹','黒影 殺','ぐっ…！ 体が…軽い…？ 長年の 肩こりが…消えた…？'],['👊','宮沢 活人','それが 活法だ。ツボは 人を 活かす ためにある。'],['👹','黒影 殺','……負けだ。殺法は 捨てよう。']],()=>showEnding());
}
function showEnding(){
  S.mode='ending'; const P=S.P;
  openOv('<div class="tag">EPILOGUE</div><div style="font-size:64px;text-align:center;line-height:1.2">🏯</div><h3>免許皆伝</h3><div class="who"><div class="face">👴</div><div class="t"><small>師範 マサ</small>見事じゃ、活人。敵のツボを 突くより、人を 活かす手を 持つ者こそ 真の後継者。</div></div><p style="text-align:center;font-size:28px;font-weight:800;color:#C8402A;margin:4px 0">活殺自在</p><div class="stat"><div>レベル<b>Lv'+P.lv+'</b></div><div>ツボ命中<b>'+S.tsHits+'</b></div><div>スコア<b>'+fmt(S.score)+'</b></div></div><div class="row"><button class="big" id="bAg">もういちど</button><button class="big sub" id="bTi">タイトル</button></div>');
  SV.best=Math.max(SV.best,S.score); SV.unlocked=3; save(); SFX.clear();
  $('#bAg').onclick=()=>{ if(!S.auto) startNew(); }; $('#bTi').onclick=toTitle; wait(S.auto?2.5:0,startNew); if(!S.auto) S.after=null;
}
function setAuto(on){ S.auto=on; $('#bAuto').setAttribute('aria-pressed',on?'true':'false'); $('#spd').style.display=on?'block':'none'; if(on){ if(S.mode==='title') startNew(); else if(S.mode!=='play'&&!ov.hidden&&!S.after){ S.wait=0.8; } } }

/* ================= input ================= */
const KEYMAP={z:0,Z:0,j:0,J:0,x:1,X:1,k:1,K:1,c:2,C:2,l:2,L:2}, KS={'1':0,'2':1,'3':2};
addEventListener('keydown',e=>{
  const k=e.key; if(k==='o'||k==='O'){ if(!e.repeat) setAuto(!S.auto); return; }
  const used=k in KEYMAP||k in KS||['ArrowLeft','ArrowRight','a','A','d','D'].includes(k); if(!used) return; if(k.startsWith('Arrow')) e.preventDefault();
  if(S.mode!=='play') return; if(S.auto) setAuto(false); AC();
  if(k in KEYMAP){ if(!e.repeat) poke(KEYMAP[k]); } else if(k in KS){ if(!e.repeat) skill(KS[k]); } else S.keys[k]=true;
});
addEventListener('keyup',e=>{ delete S.keys[e.key]; }); addEventListener('blur',()=>{ S.keys={}; S.hold.l=S.hold.r=false; });
function holdBtn(id,key){ const b=$(id); const on=e=>{ e.preventDefault(); if(S.auto&&S.mode==='play') setAuto(false); AC(); S.hold[key]=true; b.classList.add('on'); }; const off=()=>{ S.hold[key]=false; b.classList.remove('on'); }; b.addEventListener('pointerdown',on); ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off)); }
holdBtn('#bL2','l'); holdBtn('#bR2','r');
[['#bH',0],['#bM',1],['#bL',2]].forEach(([id,h])=>$(id).addEventListener('pointerdown',e=>{ e.preventDefault(); if(S.auto&&S.mode==='play') setAuto(false); AC(); poke(h); }));
[['#sk1',0],['#sk2',1],['#sk3',2]].forEach(([id,k])=>$(id).addEventListener('pointerdown',e=>{ e.preventDefault(); if(S.auto&&S.mode==='play') setAuto(false); AC(); skill(k); }));
$('#bAuto').addEventListener('click',()=>{ AC(); setAuto(!S.auto); });
$('#bSnd').addEventListener('click',()=>{ soundOn=!soundOn; $('#bSnd').setAttribute('aria-pressed',soundOn); $('#bSnd').textContent=soundOn?'🔊':'🔇'; try{ localStorage.setItem('tsuboken_snd',soundOn?'1':'0'); }catch(_){} if(soundOn) AC(); });
$('#bSnd').setAttribute('aria-pressed',soundOn); $('#bSnd').textContent=soundOn?'🔊':'🔇';
$('#bNew').addEventListener('click',()=>{ AC(); startNew(); });
$('#bCont').addEventListener('click',()=>{ AC(); showBrief(clamp(SV.unlocked-1,0,2)); });

/* ================= loop & hooks ================= */
function runFor(sec){ let r=sec; while(r>1e-9){ const d=Math.min(1/60,r); update(d); r-=d; } }
let last=0;
function frame(ts){ const dt=Math.min(0.05,(ts-last)/1000||0); last=ts; runFor(dt*(S.auto&&S.mode==='play'?1.6:1)); render(); requestAnimationFrame(frame); }
S.P=newPlayer(1,0); drawTitle(); toTitle(); resize(); hud(); requestAnimationFrame(frame);
window.__tsuboken={S,SV,STAGES,ENEMY,step:(dt,n=1)=>{ for(let i=0;i<n;i++) runFor(dt); },setAuto,startStage,startNew,showBrief,toTitle,poke,skill,
  state:()=>({mode:S.mode,si:S.si,t:+S.t.toFixed(1),hp:Math.round(S.P.hp),lv:S.P.lv,exp:S.P.exp,ki:Math.round(S.P.ki),kills:S.kills,ts:S.tsHits,score:S.score,left:S.q.length+alive().length,auto:S.auto})};
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
