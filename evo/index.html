<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="オスのブルースがメスに求婚して、子に血筋をつなぐ進化ゲーム。目立ちすぎると天敵があつまる。8世代かけて偉大な生き物をめざそう。">
<title>ブルースの進化物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#10231B;--ink:#F1F5E9;--card:#1F3A2D;--line:#34584A;--mute:#9DB8A8;--gold:#F5C242;--red:#E5584A;--green:#5DD28A;--pink:#FF7BAE;--blue:#5BA8FF}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2A2008}
#hud{background:var(--card);border-radius:12px;padding:6px 8px;margin-bottom:6px}
#hud .r1{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;gap:6px}
#hud .r1 b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:15px}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}
.bar{font-size:10.5px;color:var(--mute);font-weight:800}
.bar i{display:block;height:9px;border-radius:999px;background:#0b1812;margin-top:2px;overflow:hidden}
.bar i u{display:block;height:100%;width:0;border-radius:999px;text-decoration:none}
#bGrow u{background:var(--green)}
#bNote u{background:linear-gradient(90deg,#F5C242,#E5584A)}
#bLife u{background:var(--blue)}
#bNote.hot{color:var(--red)}
#wrap{position:relative}
#cv{display:block;width:100%;aspect-ratio:480/640;border-radius:16px;background:#1B5E8A;touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,16,11,.62);border-radius:16px;padding:12px;z-index:3}
.card{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:400px;max-height:100%;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.card h2{margin:0;text-align:center;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:24px;line-height:1.3;font-weight:400}
.card h2 span{color:var(--gold)}
.sub{text-align:center;font-size:12px;color:var(--mute);margin:6px 0 10px;line-height:1.7}
.card ul{margin:8px 0;padding-left:20px;font-size:12.5px;line-height:1.8}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;background:var(--gold);color:#2A2008;box-shadow:0 4px 0 #A97A12}
.back{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.big{font-family:"Dela Gothic One",sans-serif;font-size:40px;text-align:center;line-height:1.1;margin:6px 0;color:var(--gold)}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin:8px 0}
.rows b{text-align:right}
.emo{font-size:44px;text-align:center;line-height:1.2}
.note{font-size:11.5px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
.pbar{position:relative;height:34px;border-radius:999px;background:#0b1812;margin:14px 0 4px;overflow:hidden}
.pbar .z{position:absolute;top:0;bottom:0;background:rgba(93,210,138,.7);border-left:2px solid var(--green);border-right:2px solid var(--green)}
.pbar .c{position:absolute;top:2px;bottom:2px;width:6px;margin-left:-3px;border-radius:3px;background:var(--pink)}
.help{font-size:11.5px;color:var(--mute);text-align:center;margin:10px 0 0;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>ブルースの進化物語</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="hud">
    <div class="r1"><span id="who">　</span><span id="hearts"></span><b id="gen">　</b></div>
    <div class="bars">
      <div class="bar" id="bGrow">せいちょう<i><u></u></i></div>
      <div class="bar" id="bNote">注目度<i><u></u></i></div>
      <div class="bar" id="bLife">寿命<i><u></u></i></div>
    </div>
  </div>
  <div id="wrap">
    <canvas id="cv" width="480" height="640" aria-label="ゲーム画面"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <p class="help">画面をおさえた方向へ進む。エサを食べて大人になり、🎀 のメスに求婚しよう。食べすぎて目立つと天敵があつまる。草むらにかくれると注目度が早く下がる。<span class="pc"><br>キー：矢印 / WASD で移動、Space でプロポーズ、O でオート</span></p>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), W=480, H=640, WW=1000, WH=1000;
const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
const ld=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(_){ return d; } };
const sv=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} };
let sndOn=ld('evo_snd',true), best=ld('evo_best',{score:0,gen:0});
const MAXGEN=8, LIFE=130;
const ERA=[
 {n:'さかな',me:'🐟',prey:'🦐',pred:'🐙',bg:'#1B5E8A',gr:'rgba(255,255,255,.07)'},
 {n:'カエル',me:'🐸',prey:'🪰',pred:'🐍',bg:'#2E7D4F',gr:'rgba(255,255,255,.07)'},
 {n:'トカゲ',me:'🦎',prey:'🐜',pred:'🦅',bg:'#5E7F3A',gr:'rgba(255,255,255,.07)'},
 {n:'ネズミ',me:'🐭',prey:'🌰',pred:'🐈',bg:'#7A6A3E',gr:'rgba(255,255,255,.07)'},
 {n:'オオカミ',me:'🐺',prey:'🐇',pred:'🐻',bg:'#4C6B5A',gr:'rgba(255,255,255,.07)'},
 {n:'ゴリラ',me:'🦍',prey:'🐗',pred:'🐅',bg:'#2F6B3A',gr:'rgba(255,255,255,.07)'},
 {n:'ライオン',me:'🦁',prey:'🦌',pred:'🐘',bg:'#A58A3E',gr:'rgba(255,255,255,.08)'},
 {n:'ドラゴン',me:'🐉',prey:'🐄',pred:'🦖',bg:'#5B3A7A',gr:'rgba(255,255,255,.08)'}];
const TR={spd:'はやあし',stl:'かくれじょうず',chm:'ベッピン'};
const FN=['ミミ','ココ','ルル','ナナ','ポポ','リリ','モモ','ララ'];
const S={mode:'title',auto:false,gen:1,tr:{spd:0,stl:0,chm:0},hp:3,inv:0,eaten:0,need:6,notice:0,alarm:false,life:LIFE,score:0,
 p:{x:500,y:500,r:16,dx:1,dy:0,moving:false},preys:[],preds:[],fems:[],bushes:[],fx:[],msg:'',msgT:0,shake:0,wait:0,rw:0,prop:null,ptr:null,keys:{},aiHide:false,marry:null,lastFem:null,t:0,hits:0,proposals:0,failedProp:0,ate:0};

// ---- sound ----
let ac=null;
const aud=()=>{ if(!sndOn) return null; try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }catch(_){ return null; } };
function tone(f,d,type,v,when,f2){ const a=aud(); if(!a) return; const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime+(when||0);
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(v||.06,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.03); }
const sfx={
  eat(){ tone(500,.07,'sine',.1,0,900); },
  hit(){ tone(160,.25,'sawtooth',.12,0,60); },
  alarm(){ tone(700,.12,'square',.06); tone(520,.12,'square',.06,.14); tone(700,.12,'square',.06,.28); },
  fem(){ [784,988,1319].forEach((f,i)=>tone(f,.12,'triangle',.08,i*.08)); },
  ok(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,'triangle',.1,i*.1)); },
  ng(){ tone(220,.2,'triangle',.09,0,140); },
  over(){ tone(330,.25,'triangle',.1); tone(247,.25,'triangle',.1,.2); tone(165,.5,'triangle',.1,.4); }
};

// ---- helpers ----
const rnd=(a,b)=>a+Math.random()*(b-a), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const era=()=>ERA[S.gen-1];
const nameOf=g=>'ブルース'+g+'世';
function farPos(min){ for(let i=0;i<30;i++){ const o={x:rnd(40,WW-40),y:rnd(40,WH-40)}; if(dist(o,S.p)>=min) return o; } return {x:rnd(40,WW-40),y:rnd(40,WH-40)}; }
const inBush=o=>S.bushes.some(b=>dist(o,b)<b.r-8);
const baseGain=()=>Math.max(5,14-0.8*S.tr.stl);
const predCount=()=>2+Math.floor(S.gen/2);
function say(m,t){ S.msg=m; S.msgT=t||1.8; }
function fx(x,y,txt,col){ S.fx.push({x,y,txt,col,t:0}); }

// ---- generation setup ----
function startGen(){
  S.p={x:WW/2+rnd(-40,40),y:WH/2+rnd(-40,40),r:14+S.gen*1.6,dx:1,dy:0,moving:false};
  S.hp=3; S.inv=1; S.eaten=0; S.need=5+S.gen; S.notice=0; S.alarm=false; S.life=LIFE; S.fems=[]; S.fx=[]; S.prop=null; S.aiHide=false; S.lastFem=null;
  S.bushes=[]; for(let i=0;i<7;i++){ const b=farPos(120); b.r=rnd(42,58); S.bushes.push(b); }
  S.preys=[]; for(let i=0;i<28;i++) S.preys.push(newPrey());
  S.preds=[]; for(let i=0;i<predCount();i++) S.preds.push(newPred(false));
  S.mode='play'; hideOv(); say(nameOf(S.gen)+' たんじょう！',2);
}
function newPrey(){ const o=farPos(90); return {x:o.x,y:o.y,vx:0,vy:0,t:0}; }
function newPred(extra){ const o=farPos(330); return {x:o.x,y:o.y,vx:0,vy:0,r:20+S.gen*1.3,tx:o.x,ty:o.y,t:0,stun:0,extra:!!extra,chase:false}; }
function newFem(){ const o=farPos(260), keys=Object.keys(TR); return {x:o.x,y:o.y,vx:0,vy:0,r:S.p.r,bonus:keys[Math.floor(Math.random()*3)],nm:FN[Math.floor(Math.random()*FN.length)],t:0}; }
function startGame(){
  S.gen=1; S.tr={spd:0,stl:0,chm:0}; S.score=0; S.hits=0; S.proposals=0; S.failedProp=0; S.ate=0; S.t=0; ac||aud(); startGen();
}

// ---- finish / marriage ----
function finish(win,why){
  S.mode='result'; S.rw=2.2; S.win=win; S.why=why||'';
  if(win) sfx.ok(); else sfx.over();
  const g=win?MAXGEN:S.gen, prev=best.score;
  if(S.score>best.score) best={score:S.score,gen:Math.max(best.gen,g)}; else if(g>best.gen) best.gen=g;
  sv('evo_best',best); showResult(S.score>prev);
}
function startPropose(f){
  S.mode='propose'; S.proposals++;
  const zw=clamp(.12+.025*S.tr.chm,.12,.4);
  S.prop={f,tries:3,ang:Math.random()*6,spd:3.2,zc:rnd(.25,.75),zw,pos:.5,done:0};
  showPropose();
}
function pressPropose(){
  const P=S.prop; if(S.mode!=='propose'||!P||P.done>0) return;
  if(Math.abs(P.pos-P.zc)<=P.zw/2){ P.done=1; sfx.ok(); S.wait=.5; S.marryPending=true; ov.querySelector('.pm').textContent='💘 だいせいこう！'; }
  else{ P.tries--; sfx.ng(); if(P.tries<=0){ P.done=-1; S.wait=.7; ov.querySelector('.pm').textContent='💔 ふられた…'; }
    else{ P.zc=rnd(.2,.8); P.spd*=1.12; ov.querySelector('.pm').textContent='おしい！ あと'+P.tries+'回'; } }
  const t=ov.querySelector('.pt'); if(t) t.textContent='のこり '+P.tries+'回';
}
function afterPropose(){
  const P=S.prop, f=P.f;
  if(P.done===1){
    const child={...S.tr}; child[f.bonus]=Math.min(10,child[f.bonus]+2);
    const ks=Object.keys(TR), mk=ks[Math.floor(Math.random()*3)]; child[mk]=Math.min(10,child[mk]+1);
    const bonus=Math.ceil(S.life)*5+1000*S.gen; S.score+=bonus;
    S.marry={from:{...S.tr},to:child,f,mut:mk,bonus}; S.tr=child; S.prop=null;
    if(S.gen>=MAXGEN) return finish(true,'');
    S.mode='marry'; S.wait=1.2; showMarry();
  }else{
    S.failedProp++; S.fems=S.fems.filter(x=>x!==f); S.prop=null; S.mode='play'; hideOv();
    const a=Math.atan2(S.p.y-f.y,S.p.x-f.x); S.p.x=clamp(S.p.x+Math.cos(a)*70,20,WW-20); S.p.y=clamp(S.p.y+Math.sin(a)*70,20,WH-20); S.inv=2;
    say(f.nm+'は にげていった…',2);
    if(S.fems.length===0&&S.eaten>=S.need){ S.fems.push(newFem()); say('べつのメスがあらわれた！',2); }
  }
}
function nextGen(){ S.gen++; startGen(); }

// ---- update ----
function inputDir(){
  const k=S.keys; let x=(k.ArrowRight||k.d||k.D?1:0)-(k.ArrowLeft||k.a||k.A?1:0), y=(k.ArrowDown||k.s||k.S?1:0)-(k.ArrowUp||k.w||k.W?1:0);
  if(x||y){ const l=Math.hypot(x,y); return {x:x/l,y:y/l}; }
  if(S.ptr){ const c=cam(), sx=S.p.x-c.x, sy=S.p.y-c.y, dx=S.ptr.x-sx, dy=S.ptr.y-sy, l=Math.hypot(dx,dy); if(l>18) return {x:dx/l,y:dy/l}; }
  return {x:0,y:0};
}
function aiDir(){
  const p=S.p, mature=S.eaten>=S.need; let tg=null;
  const inB=inBush(p);
  if(S.aiHide&&S.notice<40) S.aiHide=false;
  if(!S.aiHide&&S.notice>82&&!mature) S.aiHide=true;
  if(mature&&S.fems.length){ tg=S.fems.slice().sort((a,b)=>dist(a,p)-dist(b,p))[0]; }
  else if(S.aiHide){ const bs=S.bushes.slice().sort((a,b)=>dist(a,p)-dist(b,p))[0]; if(inB) return {x:0,y:0}; tg=bs; }
  else{
    const safe=S.preys.filter(q=>!S.preds.some(d=>dist(d,q)<190||(dist(d,p)<260&&dist(d,q)<dist(q,p)+60)));
    const ok=q=>!(q.ban>S.t), pool0=safe.length?safe:S.preys, pool=pool0.filter(ok).length?pool0.filter(ok):S.preys;
    tg=pool.slice().sort((a,b)=>dist(a,p)-dist(b,p))[0];
    // 1.5秒たっても進めないときは、そのエサをあきらめて別のエサへ
    const L=S.aiLast; if(!L||S.t-L.t>1.5){ if(L&&Math.hypot(L.x-p.x,L.y-p.y)<25&&tg) tg.ban=S.t+5; S.aiLast={x:p.x,y:p.y,t:S.t}; }
  }
  // 24方向を先読みして、ねらいに近づきつつ天敵からいちばん遠い方向をえらぶ（TAS ふうの先読み）
  const sp=130+7*S.tr.spd, T=.55; let bestA=null, bestS=-1e9;
  for(let k=0;k<24;k++){
    const a=k*Math.PI/12, dx=Math.cos(a), dy=Math.sin(a), nx=clamp(p.x+dx*sp*T,16,WW-16), ny=clamp(p.y+dy*sp*T,16,WH-16);
    let sc=0; if(tg) sc+=(dist(tg,p)-Math.hypot(tg.x-nx,tg.y-ny))/(sp*T)*1.2;
    for(const d of S.preds){
      const cs=(105+5*S.gen)*(S.alarm?1.2:1), dd=dist(d,p), mv=(d.chase||dd<260)?cs*T:0, ux=(nx-d.x)/(Math.hypot(nx-d.x,ny-d.y)||1), uy=(ny-d.y)/(Math.hypot(nx-d.x,ny-d.y)||1);
      const fx2=d.x+ux*mv, fy2=d.y+uy*mv, nd=Math.hypot(nx-fx2,ny-fy2), safe=d.r+p.r+100;
      if(nd<safe) sc-=(safe-nd)/safe*3.2*(d.chase?1.6:1);
    }
    const m=50; sc-=(Math.max(0,m-nx)+Math.max(0,nx-(WW-m))+Math.max(0,m-ny)+Math.max(0,ny-(WH-m)))/m*.25;
    if(sc>bestS){ bestS=sc; bestA=a; }
  }
  if(!tg&&!S.preds.some(d=>dist(d,p)<260)) return {x:0,y:0};
  return {x:Math.cos(bestA),y:Math.sin(bestA)};
}
function stepPlay(dt){
  const p=S.p; S.life-=dt; S.t+=dt;
  if(S.life<=0){ S.life=0; return finish(false,'寿命がつきて、血筋がとだえた…'); }
  const dir=S.auto?aiDir():inputDir(), sp=130+7*S.tr.spd;
  p.moving=!!(dir.x||dir.y); if(p.moving){ p.dx=dir.x; p.dy=dir.y; }
  p.x=clamp(p.x+dir.x*sp*dt,16,WW-16); p.y=clamp(p.y+dir.y*sp*dt,16,WH-16);
  if(S.inv>0) S.inv-=dt;
  // prey
  for(const q of S.preys){
    q.t-=dt; const d=dist(q,p);
    if(d<100){ q.vx=(q.x-p.x)/d*62; q.vy=(q.y-p.y)/d*62; }
    else if(q.t<=0){ const a=rnd(0,6.28), s=Math.random()<.4?0:30; q.vx=Math.cos(a)*s; q.vy=Math.sin(a)*s; q.t=rnd(1,2.2); }
    q.x=clamp(q.x+q.vx*dt,40,WW-40); q.y=clamp(q.y+q.vy*dt,40,WH-40);
  }
  for(let i=S.preys.length-1;i>=0;i--){ const q=S.preys[i];
    if(dist(q,p)<p.r+9){ S.preys.splice(i,1); S.preys.push(newPrey()); S.eaten++; S.ate++; S.notice+=baseGain(); sfx.eat(); fx(q.x,q.y,'+1','#fff');
      if(S.eaten===S.need){ for(let k=0;k<3;k++) S.fems.push(newFem()); say('おとなになった！ 🎀のメスをさがせ！',2.6); sfx.fem(); } } }
  // notice
  const bush=inBush(p); S.notice=Math.max(0,S.notice-(bush?9:4)*dt);
  if(!S.alarm&&S.notice>=100){ S.alarm=true; S.alarmT=0; sfx.alarm(); say('目立ちすぎた！ 天敵があつまってくる！',2.4); }
  if(S.alarm){ S.notice=Math.min(S.notice,130); S.alarmT+=dt;
    if(S.alarmT>2.2&&S.preds.filter(d=>d.extra).length<4){ S.alarmT=0; S.preds.push(newPred(true)); }
    if(S.notice<50){ S.alarm=false; S.preds=S.preds.filter(d=>!d.extra); say('ようすをみている…',1.5); } }
  // predators
  const det=(190-9*S.tr.stl)*(bush?.4:1)*(S.alarm?1.25:1);
  for(const d of S.preds){
    d.t-=dt; if(d.stun>0){ d.stun-=dt; continue; }
    const dd=dist(d,p); d.chase=dd<(d.chase?det*1.4:det);
    const cs=(105+5*S.gen)*(S.alarm?1.2:1);
    if(d.chase){ d.vx=(p.x-d.x)/dd*cs; d.vy=(p.y-d.y)/dd*cs; }
    else{ if(d.t<=0||Math.hypot(d.tx-d.x,d.ty-d.y)<20){ d.tx=rnd(40,WW-40); d.ty=rnd(40,WH-40); d.t=rnd(3,6); } const l=Math.hypot(d.tx-d.x,d.ty-d.y)||1; d.vx=(d.tx-d.x)/l*55; d.vy=(d.ty-d.y)/l*55; }
    d.x=clamp(d.x+d.vx*dt,20,WW-20); d.y=clamp(d.y+d.vy*dt,20,WH-20);
    if(S.inv<=0&&dd<p.r+d.r*.75){ S.hp--; S.hits++; S.inv=1.6; S.shake=.3; d.stun=1; sfx.hit(); if(S.hp<=0) return finish(false,'天敵にたべられて、血筋がとだえた…'); }
  }
  // females
  for(const f of S.fems){
    f.t-=dt; const d=dist(f,p);
    if(d<110){ f.vx=(f.x-p.x)/d*46; f.vy=(f.y-p.y)/d*46; }
    else if(f.t<=0){ const a=rnd(0,6.28); f.vx=Math.cos(a)*20; f.vy=Math.sin(a)*20; f.t=rnd(1,3); }
    f.x=clamp(f.x+f.vx*dt,30,WW-30); f.y=clamp(f.y+f.vy*dt,30,WH-30);
  }
  if(S.eaten>=S.need) for(const f of S.fems){ if(dist(f,p)<p.r+f.r+6){ startPropose(f); break; } }
}
function stepPropose(dt){
  const P=S.prop; if(!P) return;
  if(P.done!==0){ S.wait-=dt; if(S.wait<=0) afterPropose(); return; }
  P.ang+=dt*P.spd; P.pos=.5+.5*Math.sin(P.ang);
  if(S.auto&&Math.abs(P.pos-P.zc)<P.zw*.16) pressPropose();
  const c=ov.querySelector('.c'), z=ov.querySelector('.z');
  if(c){ c.style.left=P.pos*100+'%'; z.style.left=(P.zc-P.zw/2)*100+'%'; z.style.width=P.zw*100+'%'; }
}
function step(dt){
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt);
  if(S.msgT>0) S.msgT-=dt;
  for(const f of S.fx){ f.t+=dt; } S.fx=S.fx.filter(f=>f.t<.8);
  if(S.mode==='play') stepPlay(dt);
  else if(S.mode==='propose') stepPropose(dt);
  else if(S.mode==='marry'){ if(S.auto){ S.wait-=dt; if(S.wait<=0) nextGen(); } }
  else if(S.mode==='result'&&S.auto){ S.rw-=dt; if(S.rw<=0) startGame(); }
  refresh();
}

// ---- UI ----
const ov=$('ov');
function hideOv(){ ov.hidden=true; ov.innerHTML=''; }
function showOv(h){ ov.hidden=false; ov.innerHTML=h; }
function showTitle(){
  showOv(`<div class="card"><h2>ブルースの<span>進化物語</span></h2>
  <div class="emo">🐟💘🎀</div>
  <p class="sub">弱小のオス「ブルース」が、メスに求婚して子へ血筋をつなぐ。子が新しい主人公になり、8世代かけて「偉大な生き物」へ。</p>
  <ul><li>エサを食べて大人になると、🎀のメスがあらわれる</li><li>近づいて求婚。タイミングを合わせて「プロポーズ！」</li><li>食べすぎて目立つと天敵があつまる。草むらでひと休み</li><li>寿命がくる前に結婚できないと、血筋がとだえる</li></ul>
  <div class="rows"><span>ベスト</span><b>${best.score}点（第${best.gen}世代）</b></div>
  <button class="go" id="startBtn">はじめる</button>
  <a class="back" href="../">← ゲーム一覧にもどる</a></div>`);
  $('startBtn').onclick=()=>startGame();
}
function showPropose(){
  const P=S.prop, f=P.f;
  showOv(`<div class="card"><h2>プロポーズ！</h2>
  <div class="emo">${era().me}💘${era().me}🎀</div>

  <div class="pbar"><div class="z"></div><div class="c"></div></div>
  <p class="note pt">のこり 3回</p>
  <button class="go" id="prBtn">💘 プロポーズ！</button>
  <p class="note pm">ピンクの線が、みどりの帯に入った瞬間にタップ</p></div>`);
  $('prBtn').onclick=pressPropose;
}
function showMarry(){
  const M=S.marry, nx=ERA[S.gen], rows=Object.keys(TR).map(k=>`<span>${TR[k]}</span><b>${M.from[k]} → ${M.to[k]}${k===M.mut?' ✨変異':''}${k===M.f.bonus?'（母ゆずり）':''}</b>`).join('');
  showOv(`<div class="card"><h2>ゴールイン！<span>💒</span></h2>
  <div class="emo">${era().me}🎀${nx.me}</div>
  <p class="sub">${nameOf(S.gen)} と ${M.f.nm} に、子がうまれた。<br>つぎの主人公は ${nameOf(S.gen+1)}（${nx.n}）！</p>
  <div class="rows">${rows}<span>世代ボーナス</span><b>+${M.bonus}</b></div>
  <button class="go" id="nxBtn">つぎの世代へ</button></div>`);
  $('nxBtn').onclick=nextGen;
}
function showResult(nb){
  showOv(`<div class="card"><h2>${S.win?'偉大な<span>生き物に！</span>':'血筋が<span>とだえた…</span>'}</h2>
  <div class="emo">${S.win?'🐉👑':era().me+'💤'}</div>
  <p class="sub">${S.win?'8世代の血筋をつないで、ブルースの子孫は偉大な生き物になった！':S.why}</p>
  <div class="big">${S.score}点</div>
  <div class="rows"><span>とうたつ</span><b>第${S.win?MAXGEN:S.gen}世代</b><span>天敵にやられた</span><b>${S.hits}回</b><span>ふられた</span><b>${S.failedProp}回</b><span>ベスト</span><b>${best.score}点${nb?'（新記録！）':''}</b></div>
  <button class="go" id="againBtn">もういちど</button>
  <a class="back" href="../">← ゲーム一覧にもどる</a></div>`);
  $('againBtn').onclick=startGame;
}
function refresh(){
  const playing=S.mode==='play'||S.mode==='propose'||S.mode==='marry';
  $('who').textContent=playing?nameOf(S.gen)+' '+era().me:'　';
  $('gen').textContent=playing?'第'+S.gen+'世代':'　';
  $('hearts').textContent=playing?'❤️'.repeat(Math.max(0,S.hp))+'🖤'.repeat(Math.max(0,3-S.hp)):'';
  $('bGrow').querySelector('u').style.width=Math.min(100,S.eaten/S.need*100)+'%';
  $('bGrow').firstChild.textContent=S.eaten>=S.need?'おとな！':'せいちょう';
  $('bNote').querySelector('u').style.width=Math.min(100,S.notice)+'%'; $('bNote').classList.toggle('hot',S.alarm);
  $('bLife').querySelector('u').style.width=Math.max(0,S.life/LIFE*100)+'%';
  $('autoBtn').setAttribute('aria-pressed',S.auto); $('muteBtn').textContent=sndOn?'音 ON':'音 OFF';
}

// ---- drawing ----
const cam=()=>({x:clamp(S.p.x-W/2,0,WW-W),y:clamp(S.p.y-H/2,0,WH-H)});
function emoji(ch,x,y,size,alpha){ ctx.globalAlpha=alpha==null?1:alpha; ctx.font=size+'px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ch,x,y); ctx.globalAlpha=1; }
function draw(){
  ctx.save(); ctx.clearRect(0,0,W,H);
  const E=era(), c=cam();
  if(S.shake>0) ctx.translate(Math.sin(S.shake*80)*6,0);
  ctx.fillStyle=E.bg; ctx.fillRect(-10,-10,W+20,H+20);
  ctx.translate(-c.x,-c.y);
  ctx.strokeStyle=E.gr; ctx.lineWidth=1; ctx.beginPath(); for(let x=0;x<=WW;x+=80){ ctx.moveTo(x,0); ctx.lineTo(x,WH);} for(let y=0;y<=WH;y+=80){ ctx.moveTo(0,y); ctx.lineTo(WW,y);} ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=8; ctx.strokeRect(0,0,WW,WH);
  for(const b of S.bushes){ ctx.fillStyle='rgba(20,70,35,.78)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); emoji('🌿',b.x,b.y,b.r*1.1,.9); }
  for(const q of S.preys) emoji(E.prey,q.x,q.y,20);
  for(const f of S.fems){ ctx.fillStyle='rgba(255,123,174,.28)'; ctx.beginPath(); ctx.arc(f.x,f.y,f.r+10,0,7); ctx.fill(); emoji(E.me,f.x,f.y,f.r*2.2); emoji('🎀',f.x+f.r*.5,f.y-f.r*1.1,f.r*1.2); ctx.fillStyle='#FFD3E5'; ctx.font='800 11px sans-serif'; ctx.fillText(f.nm+' '+TR[f.bonus]+'+2',f.x,f.y+f.r+14); }
  for(const d of S.preds){ if(d.chase){ ctx.strokeStyle='rgba(229,88,74,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(d.x,d.y,d.r+8,0,7); ctx.stroke(); } emoji(E.pred,d.x,d.y,d.r*2.3,d.stun>0?.5:1); }
  const p=S.p;
  if(!(S.inv>0&&Math.floor(S.inv*10)%2)){
    ctx.fillStyle='rgba(91,168,255,.3)'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+8,0,7); ctx.fill();
    ctx.save(); ctx.translate(p.x,p.y); if(p.dx<0) ctx.scale(-1,1); emoji(E.me,0,0,p.r*2.2); ctx.restore();
    ctx.fillStyle='#fff'; ctx.font='800 11px sans-serif'; ctx.textAlign='center'; ctx.fillText('♂ '+nameOf(S.gen),p.x,p.y+p.r+16);
  }
  for(const f of S.fx){ ctx.globalAlpha=1-f.t/.8; ctx.fillStyle=f.col; ctx.font='800 16px sans-serif'; ctx.fillText(f.txt,f.x,f.y-f.t*40); ctx.globalAlpha=1; }
  ctx.translate(c.x,c.y);
  // arrow to the nearest female
  if((S.mode==='play')&&S.eaten>=S.need&&S.fems.length){
    const f=S.fems.slice().sort((a,b)=>dist(a,p)-dist(b,p))[0], sx=f.x-c.x, sy=f.y-c.y;
    if(sx<10||sx>W-10||sy<10||sy>H-10){ const cx=W/2, cy=H/2, a=Math.atan2(sy-(p.y-c.y),sx-(p.x-c.x)), ax=clamp(sx,26,W-26), ay=clamp(sy,26,H-26);
      ctx.save(); ctx.translate(ax,ay); ctx.rotate(a); ctx.fillStyle='#FF7BAE'; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-8,-10); ctx.lineTo(-8,10); ctx.closePath(); ctx.fill(); ctx.restore(); emoji('🎀',ax-Math.cos(a)*18,ay-Math.sin(a)*18,16); }
  }
  if(S.alarm){ ctx.strokeStyle='rgba(229,88,74,'+(.35+.2*Math.sin(S.t*8))+')'; ctx.lineWidth=10; ctx.strokeRect(0,0,W,H); }
  if(S.msgT>0&&S.mode==='play'){ ctx.globalAlpha=Math.min(1,S.msgT*2); ctx.fillStyle='rgba(6,16,11,.78)'; const w=Math.min(W-30,ctx.measureText(S.msg).width+40); ctx.font='800 16px sans-serif'; const tw=Math.min(W-30,ctx.measureText(S.msg).width+40); ctx.beginPath(); ctx.roundRect?ctx.roundRect(W/2-tw/2,24,tw,38,12):ctx.rect(W/2-tw/2,24,tw,38); ctx.fill(); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(S.msg,W/2,43); ctx.globalAlpha=1; }
  ctx.restore();
}

// ---- input ----
const ptrAt=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}; };
cv.addEventListener('pointerdown',e=>{ S.ptr=ptrAt(e); try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
cv.addEventListener('pointermove',e=>{ if(S.ptr) S.ptr=ptrAt(e); });
const up=()=>{ S.ptr=null; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
$('muteBtn').onclick=()=>{ sndOn=!sndOn; sv('evo_snd',sndOn); refresh(); };
function setAuto(on){ S.auto=!!on; refresh(); if(S.auto&&S.mode==='title') startGame(); }
$('autoBtn').onclick=()=>setAuto(!S.auto);
addEventListener('pointerdown',e=>{ if(S.auto&&e.isTrusted&&!e.target.closest('#autoBtn')) setAuto(false); },true);
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='o'||k==='O'){ setAuto(!S.auto); return; }
  if(S.auto&&e.isTrusted) setAuto(false);
  S.keys[k]=true;
  if(k===' '||k==='Enter'){ if(S.mode==='propose'&&!(e.target.closest&&e.target.closest('button'))){ pressPropose(); e.preventDefault(); } }
  if(k.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup',e=>{ S.keys[e.key]=false; });
addEventListener('blur',()=>{ S.keys={}; });

// ---- loop & test hook ----
let last=0;
function loop(ts){ const dt=last?Math.min(.05,(ts-last)/1000):0; last=ts; if(dt>0) step(dt); draw(); requestAnimationFrame(loop); }
window.__evo={
  state:()=>({mode:S.mode,gen:S.gen,hp:S.hp,eaten:S.eaten,need:S.need,notice:S.notice,alarm:S.alarm,life:S.life,score:S.score,auto:S.auto,tr:{...S.tr},fems:S.fems.length,preds:S.preds.length,hits:S.hits,failedProp:S.failedProp,win:S.win,t:S.t,best:{...best}}),
  step(dt){ let r=dt; while(r>0){ const d=Math.min(1/60,r); step(d); r-=d; } draw(); },
  setAuto, start:startGame, draw, press:pressPropose, S
};
showTitle(); refresh(); requestAnimationFrame(loop);
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
