<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="3Dのアクションじゃんぷ…ではなく、リアルタイムで敵をたおしてレベルを上げる3Dアクション RPG。3つの地方のボスをたおして、雪の里をすくおう。">
<title>ユキノブレード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#10192A;--ink:#F2F1E8;--card:#1E2C46;--line:#3B5380;--mute:#9DB0D4;--gold:#FFD25A;--red:#FF5D6C;--green:#6FE0A0;--blue:#6FB4FF}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:6px 8px 14px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2A1B00}
#hud{background:var(--card);border-radius:12px;padding:5px 8px;margin-bottom:5px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:11px;font-weight:800}
#hud .lv{font-family:"Dela Gothic One",sans-serif;font-size:17px;color:var(--gold)}
.bar{position:relative;height:11px;border-radius:999px;background:#0a1220;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px}
.bar span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:11px;color:#fff;text-shadow:0 0 2px #000}
#hpb i{background:linear-gradient(90deg,#FF5D6C,#FF9A6C)}
#mpb i{background:linear-gradient(90deg,#4F7BFF,#6FD0FF)}
#xpb i{background:linear-gradient(90deg,#9ED76A,#E4F57A)}
#hud .lbl{color:var(--mute);font-size:10px;text-align:right}
#hud .info{grid-column:1/4;display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
#stage{position:relative;width:100%;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#9BD8FF;touch-action:none}
#gl{display:block;width:100%;height:100%}
#bossbar{position:absolute;left:14%;right:14%;top:8px;text-align:center;font-size:12px;font-weight:800;text-shadow:0 0 3px #000;pointer-events:none}
#bossbar .bar{height:10px;margin-top:2px}
#bossbar i{background:linear-gradient(90deg,#D13BD4,#FF5D6C)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:"Dela Gothic One",sans-serif;font-size:26px;color:#FFE9A8;text-shadow:0 0 6px #000,0 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .3s}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:"Dela Gothic One",sans-serif;font-size:15px;color:#fff;text-shadow:0 0 3px #000,0 1px 0 #000;white-space:nowrap}
.pop.h{color:#FF8A8A}.pop.c{color:#FFD25A;font-size:19px}.pop.g{color:#8DF0B0}.pop.lv{color:#FFE24A;font-size:22px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,22,.76);padding:10px;z-index:3}
.card{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:100%;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.card h2{margin:0;text-align:center;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:25px;line-height:1.35;font-weight:400}
.card h2 span{color:var(--gold)}
.story{font-size:12.5px;line-height:1.8;margin:8px 0}
.go{display:block;width:100%;min-height:44px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;background:var(--gold);color:#2A1B00;box-shadow:0 4px 0 #A97A12}
.go.alt{background:#3B5380;color:var(--ink);box-shadow:0 4px 0 #283A5C}
.back{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin:8px 0}
.rows b{text-align:right}
.note{font-size:11.5px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
#ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
#joy{position:relative;width:148px;height:148px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid var(--line);touch-action:none;flex:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8FB4F0,#3B5380);box-shadow:0 3px 8px rgba(0,0,0,.5)}
#btns{display:grid;grid-template-columns:repeat(2,70px);grid-template-rows:84px 64px;gap:8px}
#btns button{border:0;border-radius:18px;font-weight:800;font-size:13px;cursor:pointer;background:#3B5380;color:var(--ink);box-shadow:0 4px 0 #283A5C;touch-action:none;line-height:1.3;padding:0}
#btns button.dn,#btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #283A5C}
#atkBtn{grid-column:1/3;font-size:17px!important;background:linear-gradient(to top,#FFD25A calc(var(--g,1)*100%),#6B5A2E calc(var(--g,1)*100%))!important;color:#2A1B00!important;box-shadow:0 4px 0 #A97A12!important}
#atkBtn.full{animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
.help{font-size:11px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">

<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>ユキノブレード</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="hud">
    <div class="lv" id="lv">Lv1</div>
    <div>
      <div class="bar" id="hpb"><i></i><span></span></div>
      <div class="bar" id="mpb" style="margin-top:3px"><i></i><span></span></div>
    </div>
    <div class="lbl">HP<br>MP</div>
    <div class="bar" id="xpb" style="grid-column:1/4"><i></i><span></span></div>
    <div class="info"><span id="zn">—</span><span id="pt">くすり ×3</span></div>
  </div>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="bossbar" hidden><div id="bossname"></div><div class="bar"><i id="bossfill"></i></div></div>
    <div id="banner"></div>
    <div id="pops"></div>
    <div class="ov" id="ov"></div>
  </div>
  <div id="ctl">
    <div id="joy"><div id="knob"></div></div>
    <div id="btns">
      <button id="atkBtn" type="button">⚔ こうげき</button>
      <button id="rollBtn" type="button">かいひ</button>
      <button id="skillBtn" type="button">わざ<br><small>MP20</small></button>
    </div>
  </div>
  <p class="help"><span class="pc">WASD・矢印で移動 ／ J か スペース：こうげき ／ K か Shift：かいひ ／ L：わざ ／ E：くすり ／ O：オート<br></span>こうげきは、ゲージが満タンのときに最大の威力。ボスは、こうげきのあとのスキに大ダメージ。赤い範囲は、かいひでよけよう。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
const RA=36,HSPD=6.2,RSPD=12.5,ROLL_T=0.34,GRATE=1.05,SKILL_MP=20,RESPAWN=16,MAXLV=20;
const statsFor=lv=>({max:Math.round(70+16*lv),atk:10+3.2*lv,def:3+1.5*lv,mpMax:Math.round(20+5*lv)});
const needExp=lv=>Math.round(14*Math.pow(lv,1.55));
const dir=a=>[Math.sin(a),Math.cos(a)];
const angTo=(dx,dz)=>Math.atan2(dx,dz);
const adiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};

/* ---------- データ ---------- */
const ZONES=[
 {name:'みどりの そうげん',ground:0x74C45E,sky:0x9BD8FF,fog:0xBFE6FF,en:[['slime',9],['bee',5]],boss:'slimeKing',rec:4,deco:'tree'},
 {name:'くらやみの もり',ground:0x2E6B45,sky:0x294A44,fog:0x1E3A36,en:[['goblin',7],['wolf',6]],boss:'treant',rec:9,deco:'pine'},
 {name:'こおりの どうくつ',ground:0xA9C6DC,sky:0x7FA2CC,fog:0x9CBBDD,en:[['golem',3],['bat',8]],boss:'iceDragon',rec:13,deco:'ice'}
];
const ET={
 slime:{n:'スライム',hp:26,spd:2.4,r:0.8,aggro:11,exp:6,dmg:9,atk:'lunge',wind:0.7,dash:[14,0.26],rec:0.7,cd:1.0,range:4.2,stand:1.4},
 bee:{n:'おおばち',hp:16,spd:5,r:0.5,aggro:13,exp:8,dmg:8,atk:'lunge',wind:0.55,dash:[16,0.3],rec:0.55,cd:0.9,range:5,stand:2.6,fly:1.6},
 goblin:{n:'ゴブリン',hp:72,spd:2.9,r:0.7,aggro:12,exp:24,dmg:20,atk:'swing',wind:0.75,rec:0.9,cd:1.1,range:2.3,stand:1.6,shield:true,cone:[2.7,0.95]},
 wolf:{n:'こわいオオカミ',hp:56,spd:4.2,r:0.8,aggro:15,exp:28,dmg:22,atk:'lunge',wind:0.85,dash:[18,0.38],rec:1.0,cd:1.1,range:6.5,stand:3},
 golem:{n:'こおりゴーレム',hp:280,spd:1.7,r:1.5,aggro:11,exp:80,dmg:42,atk:'slam',wind:1.1,rec:1.8,cd:0.8,range:3.8,stand:2.2,circ:3.8,mul:[0.45,1.8]},
 bat:{n:'こおりコウモリ',hp:40,spd:5.4,r:0.6,aggro:15,exp:42,dmg:18,atk:'lunge',wind:0.5,dash:[17,0.3],rec:0.45,cd:0.8,range:6,stand:2.8,fly:2},
 slimeKing:{n:'スライムキング',hp:520,spd:1.8,r:2.6,aggro:18,exp:220,boss:1,stand:4,mul:[0.2,1.5],seq:['slam','slam','summon']},
 treant:{n:'もりの主 トレント',hp:1200,spd:1.5,r:2.8,aggro:18,exp:700,boss:1,stand:5,mul:[0.15,1.5],seq:['roots','roots','sweep']},
 iceDragon:{n:'こおりのドラゴン',hp:2600,spd:1.6,r:3.4,aggro:20,exp:1800,boss:1,stand:6,mul:[0.12,1.6],seq:['shards','breath','shards','tail']}
};

/* ---------- 音 ---------- */
let ctx=null,master=null,nbuf=null,muted=ls.get('yb_mute')==='1',silent=false,bgmT=0,bgmN=0;
function ensureAudio(){
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=muted?0:0.7; master.connect(ctx.destination);
    nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ctx=null} }
  if(ctx&&ctx.state==='suspended') ctx.resume();
}
function tone(f,d,type,vol,when,f2){ if(!ctx||silent) return; const w=ctx.currentTime+(when||0),o=ctx.createOscillator(),g=ctx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,w); if(f2) o.frequency.exponentialRampToValueAtTime(f2,w+d);
  g.gain.setValueAtTime(0.0001,w); g.gain.linearRampToValueAtTime(vol||0.1,w+0.006); g.gain.exponentialRampToValueAtTime(0.0001,w+d); o.connect(g); g.connect(master); o.start(w); o.stop(w+d+0.05); }
function nz(d,freq,vol,when,type){ if(!ctx||silent) return; const w=ctx.currentTime+(when||0),s=ctx.createBufferSource(); s.buffer=nbuf; const f=ctx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq; const g=ctx.createGain();
  g.gain.setValueAtTime(vol,w); g.gain.exponentialRampToValueAtTime(0.0001,w+d); s.connect(f); f.connect(g); g.connect(master); s.start(w,Math.random()*0.5); s.stop(w+d+0.05); }
const NOTE=m=>440*Math.pow(2,(m-69)/12);
function sfx(k){
  switch(k){
    case 'swing': nz(0.12,3000,0.1,0,'bandpass'); break;
    case 'swingF': nz(0.16,4200,0.16,0,'bandpass'); tone(660,0.12,'triangle',0.06,0,1320); break;
    case 'hit': nz(0.08,1800,0.2); tone(180,0.1,'square',0.06,0,90); break;
    case 'crit': nz(0.12,2400,0.25); tone(NOTE(84),0.14,'triangle',0.12); tone(220,0.14,'square',0.07,0,80); break;
    case 'die': nz(0.25,1200,0.22); tone(300,0.25,'square',0.06,0,70); break;
    case 'hurt': nz(0.2,900,0.28); tone(150,0.2,'sawtooth',0.1,0,70); break;
    case 'roll': nz(0.2,1500,0.12,0,'highpass'); break;
    case 'skill': tone(NOTE(76),0.3,'sawtooth',0.07,0,NOTE(88)); nz(0.3,3500,0.1,0,'bandpass'); break;
    case 'potion': [76,79,83].forEach((m,i)=>tone(NOTE(m),0.2,'sine',0.1,i*0.07)); break;
    case 'level': [72,76,79,84,88].forEach((m,i)=>tone(NOTE(m),0.35,'triangle',0.12,i*0.1)); break;
    case 'fountain': [79,83,86,91].forEach((m,i)=>tone(NOTE(m),0.5,'sine',0.09,i*0.1)); break;
    case 'boss': tone(80,0.9,'sawtooth',0.16,0,45); nz(0.7,500,0.25); break;
    case 'warn': tone(NOTE(70),0.08,'square',0.03); break;
    case 'bdie': nz(1.2,1100,0.4); tone(110,1.2,'sawtooth',0.15,0,30); break;
    case 'clear': [72,76,79,84,79,84,88,91].forEach((m,i)=>tone(NOTE(m),0.4,'triangle',0.12,i*0.14)); break;
    case 'over': [57,53,50,45].forEach((m,i)=>tone(NOTE(m),0.5,'sawtooth',0.1,i*0.25)); break;
  }
}
const SCALES=[[0,2,4,7,9],[0,3,5,7,10],[0,2,3,7,8]];
const MEL=[0,2,4,2,1,3,2,0, 4,3,2,1,0,2,1,-1];
function bgm(g){
  if(!ctx||silent||g.mode!=='play') return;
  const now=ctx.currentTime; if(bgmT<now) bgmT=now+0.05;
  const boss=g.en.some(e=>!e.dead&&ET[e.type].boss&&e.state!=='idle'),beat=boss?0.17:0.3-g.zone*0.02,sc=SCALES[g.zone];
  while(bgmT<now+0.25){
    const n=bgmN++,deg=MEL[n%16],o=deg<0?-5:Math.floor(deg/5)*12,m=60+[0,0,-2][g.zone]+sc[((deg%5)+5)%5]+o;
    if(n%2===0||boss) tone(NOTE(m),beat*1.6,g.zone===2?'sine':'triangle',boss?0.06:0.045,bgmT-now);
    if(n%8===0) tone(NOTE(m-24),beat*7,'sine',0.08,bgmT-now);
    if(boss&&n%4===0) tone(90,0.15,'sine',0.12,bgmT-now,45);
    bgmT+=beat;
  }
}

/* ---------- シミュレーション（データだけ。クローン・テストしやすい） ---------- */
let G=null;
function rnd(g){ g.seed=(g.seed+0x6D2B79F5)|0; let t=g.seed; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }
function newGame(save){
  const s=statsFor(1);
  G={t:0,mode:'play',zone:0,seed:777+(Math.random()*9999|0),nid:1,ev:[],en:[],proj:[],bossDead:[false,false,false],clock:0,
    hero:{x:0,z:28,face:Math.PI,hp:s.max,mp:s.mpMax,lv:1,exp:0,gauge:1,atkT:0,swingT:0,swingG:0,rollT:0,rollCd:0,rollDx:0,rollDz:1,inv:0,hurtT:0,skillCd:0,potCd:0,dead:false,pots:3,fountainCd:0},
    kills:0,deaths:0,fade:0,endT:0};
  if(save){ const h=G.hero; h.lv=save.lv; h.exp=save.exp; h.pots=save.pots; G.bossDead=save.bossDead.slice(); G.zone=save.zone; G.clock=save.clock||0; const t=statsFor(h.lv); h.hp=t.max; h.mp=t.mpMax; }
  setupZone(G,G.zone);
}
function setupZone(g,i){
  g.zone=i; g.en=[]; g.proj=[]; const z=ZONES[i],h=g.hero;
  h.x=0; h.z=28; h.face=Math.PI; h.rollT=0; h.hurtT=0; h.atkT=0; h.swingT=0;
  for(const [type,cnt] of z.en) for(let k=0;k<cnt;k++){
    let x,zz,tries=0; do{ const a=rnd(g)*Math.PI*2,r=9+rnd(g)*24; x=Math.cos(a)*r; zz=Math.sin(a)*r-2; tries++; }while(Math.hypot(x,zz-28)<14&&tries<20);
    addEnemy(g,type,x,zz);
  }
  if(!g.bossDead[i]) addEnemy(g,z.boss,0,-20);
  g.zoneT=0; g.ev.push({k:'zone'});
}
function addEnemy(g,type,x,z){
  const sp=ET[type]; const e={id:g.nid++,type,x,z,sx:x,sz:z,face:rnd(g)*6.28,hp:sp.hp,max:sp.hp,state:'idle',t:0,tmax:1,cd:rnd(g)*1.5,dead:false,rt:0,shapes:[],vuln:false,hitT:0,dx:0,dz:1,dt:0,hitDone:false,ai:0,cur:'',wt:0,wx:x,wz:z,jx:x,jz:z,phase2:false,summoned:false};
  g.en.push(e); return e;
}
function stat(g){ return statsFor(g.hero.lv); }
function hurtHero(g,base,sx,sz){
  const h=g.hero; if(h.inv>0||h.dead||g.mode!=='play') return false;
  const dmg=Math.max(1,Math.round(base*(100/(100+stat(g).def*3))*(0.9+rnd(g)*0.2)));
  h.hp-=dmg; h.inv=0.55; h.hurtT=0.3; g.ev.push({k:'hurt',x:h.x,z:h.z,v:dmg});
  const kx=h.x-sx,kz=h.z-sz,kd=Math.hypot(kx,kz)||1; h.x+=kx/kd*0.7; h.z+=kz/kd*0.7; h.atkT=Math.min(h.atkT,0); h.swingT=0;
  if(h.hp<=0){ h.hp=0; h.dead=true; g.mode='dead'; g.deaths++; g.ev.push({k:'over'}); }
  return true;
}
function inShape(s,x,z,pad){
  if(s.k==='circle') return Math.hypot(x-s.x,z-s.z)<s.r+pad;
  if(s.k==='cone'){ const dx=x-s.x,dz=z-s.z,d=Math.hypot(dx,dz); if(d>s.r+pad) return false; if(d<1) return true; return Math.abs(adiff(angTo(dx,dz),s.dir))<s.a+pad/Math.max(d,1); }
  if(s.k==='line'){ const [ux,uz]=dir(s.dir),dx=x-s.x,dz=z-s.z,p=dx*ux+dz*uz,q=Math.abs(dx*uz-dz*ux); return p>-pad&&p<s.len+pad&&q<s.w+pad; }
  return false;
}
function addExp(g,n){
  const h=g.hero; if(h.lv>=MAXLV) return; h.exp+=n;
  while(h.lv<MAXLV&&h.exp>=needExp(h.lv)){ h.exp-=needExp(h.lv); h.lv++; const s=stat(g); h.hp=s.max; h.mp=s.mpMax; g.ev.push({k:'level',v:h.lv}); }
  if(h.lv>=MAXLV) h.exp=0;
}
function mulFor(g,e,fromFront){
  const sp=ET[e.type]; let m=1;
  if(sp.mul) m=e.vuln?sp.mul[1]:sp.mul[0];

  if(!heroView.userData.blob){ const bl=new THREE.Mesh(new THREE.CircleGeometry(0.7,14),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.3})); bl.rotation.x=-Math.PI/2; scene.add(bl); heroView.userData.blob=bl; } heroView.userData.blob.position.set(h.x,0.04,h.z);
  for(const e of g.en) syncView(e,t);
  for(const [id,v] of views){ if(!g.en.some(e=>e.id===id)){ scene.remove(v); scene.remove(v.userData.blob); views.delete(id); } }
  // たま
  while(projViews.length<g.proj.length){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,6),new THREE.MeshBasicMaterial({color:0xffffff})); scene.add(m); projViews.push(m); }
  for(let i=0;i<projViews.length;i++){ const p=g.proj[i],m=projViews[i]; if(!p){ m.visible=false; continue; } m.visible=true; m.position.set(p.x,p.hostile?1.2:1.4,p.z); m.material.color.setHex(p.hostile?0x9AD4FF:0xFFF08A); m.scale.setScalar(p.hostile?1.1:1.6); }
  teleDraw(g,t);
  // ポータル
  const open=g.bossDead[g.zone]; portal.visible=true; portal.userData.inner.visible=open; portal.children[0].material=mat(open?0xBFE6FF:0x667799,{emissive:open?0x4A9AFF:0x111122}); portal.rotation.y=Math.sin(t*0.8)*0.1; fountain.children[3].position.y=2.2+Math.sin(t*3)*0.1;
  // カメラ
  const sx=(Math.random()-0.5)*shake,sz=(Math.random()-0.5)*shake; shake=Math.max(0,shake-0.03);
  camera.position.set(h.x*0.92+sx,20,h.z*0.92+15+sz); camera.lookAt(h.x*0.92,0.5,h.z*0.92-2.5);
  renderer.render(scene,camera);
  // ポップ
  updatePops();
}
let pops=[];
function addPop(txt,cls,x,y,z){ pops.push({txt,cls,x,y,z,age:0,el:null}); if(pops.length>18){ const o=pops.shift(); if(o.el) o.el.remove(); } }
function updatePops(){
  const st=$('stage'),w=st.clientWidth,hh=st.clientHeight,v=new THREE.Vector3();
  for(const p of pops){ if(!p.el){ p.el=document.createElement('div'); p.el.className='pop '+p.cls; p.el.textContent=p.txt; $('pops').appendChild(p.el); }
    v.set(p.x,p.y+p.age*1.4,p.z).project(camera); p.el.style.left=((v.x*0.5+0.5)*w)+'px'; p.el.style.top=((-v.y*0.5+0.5)*hh)+'px'; p.el.style.opacity=Math.max(0,1-p.age/0.9); }
  pops=pops.filter(p=>{ if(p.age>0.9){ if(p.el) p.el.remove(); return false; } return true; });
}

/* ---------- 画面・入力 ---------- */
let auto=false,botMoving=false,lastMode='',lastZone=-1,autoT=0,bannerT=0;
const inpState={mx:0,mz:0,atk:false,roll:false,skill:false,potion:false,aim:null};
const keys={};
let atkHeld=false,rollReq=false,skillReq=false,potReq=false;
function banner(txt,sec){ const b=$('banner'); b.textContent=txt; b.style.opacity=1; bannerT=sec||2.4; }
function update(dt){
  if(!G) return;
  if(G.mode==='play'||G.mode==='ending'){
    let inp;
    if(auto){ inp=botInput(G); botMoving=!!(inp.mx||inp.mz); }
    else{
      let mx=stickX,mz=stickY; if(keys.a||keys.ArrowLeft) mx-=1; if(keys.d||keys.ArrowRight) mx+=1; if(keys.w||keys.ArrowUp) mz-=1; if(keys.s||keys.ArrowDown) mz+=1;
      inp={mx,mz,atk:atkHeld||!!keys.j||!!keys[' '],roll:rollReq||!!keys.k||!!keys.Shift,skill:skillReq||!!keys.l,potion:potReq||!!keys.e,aim:null}; Object.assign(inpState,inp); botMoving=false;
    }
    rollReq=skillReq=potReq=false;
    tick(G,dt,inp);
  }
  handleEvents();
  for(const p of pops) p.age+=dt;
  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) $('banner').style.opacity=0; }
  if(G.mode!==lastMode){ lastMode=G.mode; autoT=0; if(G.mode==='dead') showDead(); else if(G.mode==='ending') {} }
  autoT+=dt;
  if(G.mode==='ending'&&G.endT>3.5&&!$('ov').dataset.end){ showEnding(); $('ov').dataset.end='1'; }
  if(auto){
    if(G.mode==='dead'&&autoT>1.4) revive();
    if(G.mode==='ending'&&G.endT>9){ $('ov').hidden=true; delete $('ov').dataset.end; newGame(); lastMode='play'; lastZone=-1; }
  }
  bgm(G);
}
function handleEvents(){
  const g=G; for(const e of g.ev){
    if(!silent) sfx(e.k==='quake'?'hit':e.k==='drop'?'potion':e.k==='bossStart'?'boss':e.k==='bossclear'?'clear':e.k==='save'?'fountain':e.k);
    switch(e.k){
      case 'hit': addPop(e.v,'',e.x,e.y||1.5,e.z); break;
      case 'crit': addPop(e.v+'!','c',e.x,e.y||1.5,e.z); shake=Math.max(shake,0.15); break;
      case 'hurt': addPop(e.v,'h',e.x,2.4,e.z); shake=Math.max(shake,0.5); break;
      case 'die': addPop('+'+e.v+'EXP','g',e.x,1.8,e.z); break;
      case 'bdie': addPop('+'+e.v+'EXP','g',e.x,4,e.z); shake=1.2; break;
      case 'level': addPop('LEVEL UP! Lv'+e.v,'lv',g.hero.x,3.2,g.hero.z); banner('レベル '+e.v+' に なった！',1.8); break;
      case 'potion': addPop('かいふく','g',g.hero.x,2.8,g.hero.z); break;
      case 'drop': addPop('くすり ゲット','g',e.x,1.6,e.z); break;
      case 'fountain': addPop('HP・MP かいふく','g',g.hero.x,2.8,g.hero.z); banner('いずみの ちからで かいふく！',1.5); saveGame(); break;
      case 'quake': shake=Math.max(shake,0.8); break;
      case 'bossStart': banner(ET[e.type].n,2.4); break;
      case 'bossclear': banner('ボスを たおした！ 北の ゲートが ひらいた',3); saveGame(); break;
      case 'zone': banner(ZONES[g.zone].name,2.6); break;
    }
  } g.ev.length=0;
}
function saveGame(){ const h=G.hero; ls.set('yb_save',JSON.stringify({zone:G.zone,lv:h.lv,exp:h.exp,pots:h.pots,bossDead:G.bossDead,clock:G.clock})); }
function loadSave(){ try{ return JSON.parse(ls.get('yb_save')||'null'); }catch(_){ return null; } }
function fmtT(s){ s=Math.round(s); return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'; }
function showTitle(){
  const sv=loadSave(),best=JSON.parse(ls.get('yb_best')||'null');
  $('ov').dataset.end=''; delete $('ov').dataset.end;
  $('ov').innerHTML=`<div class="card"><h2>ユキノ<span>ブレード</span></h2>
  <p class="story">ゆきの里に つたわる 伝説の剣「ユキノブレード」を もつ 少年。さいきん、里の まわりの 3つの 地方に 魔物が あふれている。<br>魔物を たおして レベルを あげ、各地方の ボスを たおして、里に へいわを とりもどせ！</p>
  <button class="go" data-act="new">はじめから</button>${sv?`<button class="go alt" data-act="cont">つづきから（Lv${sv.lv}・${ZONES[sv.zone].name}）</button>`:''}
  <p class="note">${best?`ベスト：クリア ${fmtT(best.time)}（Lv${best.lv}）`:'まだ クリアしていません'}</p><a class="back" href="../">← ゲーム一覧にもどる</a></div>`;
  $('ov').hidden=false;
}
function startGame(save){ ensureAudio(); newGame(save); $('ov').hidden=true; delete $('ov').dataset.end; lastMode='play'; renderer&&(renderer._zone=-1); bgmT=0; }
function showDead(){
  $('ov').innerHTML=`<div class="card"><h2>やられた…</h2><p class="story">Lv${G.hero.lv} の 勇者は たおれた。けいけんちは そのまま、地方の いりぐちから やりなおせる。</p><button class="go" data-act="revive">もういちど</button><button class="go alt" data-act="title">タイトルへ</button></div>`; $('ov').hidden=false;
}
function revive(){ const h=G.hero,s=stat(G); h.dead=false; h.hp=s.max; h.mp=s.mpMax; h.inv=2; h.pots=Math.max(h.pots,3); G.mode='play'; setupZone(G,G.zone); $('ov').hidden=true; lastMode='play'; if(ctx) bgmT=0; }
function showEnding(){
  const h=G.hero,best=JSON.parse(ls.get('yb_best')||'null'),isBest=!best||G.clock<best.time; if(isBest) ls.set('yb_best',JSON.stringify({time:Math.round(G.clock),lv:h.lv}));
  ls.set('yb_save','null');
  $('ov').innerHTML=`<div class="card"><h2>ゲーム<span>クリア！</span></h2><p class="story">こおりのドラゴンが たおれ、3つの地方に へいわが もどった。ゆきの里に あさひが のぼる。伝説の剣は、ふたたび しずかな ねむりについた。</p>
  <div class="rows"><span>クリアタイム</span><b>${fmtT(G.clock)}${isBest?' 🎉ベスト！':''}</b><span>さいしゅう レベル</span><b>Lv${h.lv}</b><span>たおした 魔物</span><b>${G.kills}</b><span>やられた 回数</span><b>${G.deaths}</b></div>
  <button class="go" data-act="new">もういちど はじめから</button><a class="back" href="../">← ゲーム一覧にもどる</a>${auto?'<p class="note">🤖 オート中：まもなく はじまります</p>':''}</div>`; $('ov').hidden=false;
}
function setAuto(on,quiet){ auto=!!on; $('autoBtn').setAttribute('aria-pressed',auto); if(on&&!quiet&&lastMode==='title'){ startGame(); } }
let hs='';
function hud(){
  if(!G) return; const h=G.hero,s=stat(G),need=needExp(h.lv);
  const k=[h.lv,Math.round(h.hp),Math.round(h.mp),h.exp,h.pots,G.zone,Math.round(h.gauge*20),G.mode==='play'].join('|'); if(k===hs&&!G.en.some(e=>ET[e.type].boss&&!e.dead&&e.state!=='idle')) return; hs=k;
  $('lv').textContent='Lv'+h.lv;
  const setb=(id,v,m,txt)=>{ const b=$(id); b.querySelector('i').style.width=Math.max(0,Math.min(100,v/m*100))+'%'; b.querySelector('span').textContent=txt; };
  setb('hpb',h.hp,s.max,Math.ceil(h.hp)+' / '+s.max); setb('mpb',h.mp,s.mpMax,Math.floor(h.mp)+' / '+s.mpMax); setb('xpb',h.lv>=MAXLV?1:h.exp,h.lv>=MAXLV?1:need,h.lv>=MAXLV?'MAX':'EXP '+h.exp+' / '+need);
  $('zn').textContent=ZONES[G.zone].name+(G.bossDead[G.zone]?'（ボス たおした）':''); $('pt').textContent='くすり ×'+h.pots;
  $('atkBtn').style.setProperty('--g',h.gauge); $('atkBtn').classList.toggle('full',h.gauge>=1);
  $('skillBtn').style.opacity=h.lv>=3?1:0.4; $('skillBtn').style.filter=h.mp>=SKILL_MP?'none':'saturate(.3)';
  const b=G.en.find(e=>!e.dead&&ET[e.type].boss&&e.state!=='idle'); $('bossbar').hidden=!b; if(b){ $('bossname').textContent=ET[b.type].n+(b.vuln?'　★こうげきチャンス！':''); $('bossfill').style.width=b.hp/b.max*100+'%'; }
}
let last=performance.now(),hudT=0;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); render(); hudT+=dt; hs=hudT>0.05?(hudT=0,''):hs; hud(); $('atkBtn').style.setProperty('--g',G?G.hero.gauge:1); }

// ジョイスティック
let stickX=0,stickY=0,joyId=null;
(()=>{
  const j=$('joy'),k=$('knob'),R=50;
  const mv=e=>{ const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; let dx=e.clientX-cx,dy=e.clientY-cy; const d=Math.hypot(dx,dy); if(d>R){ dx*=R/d; dy*=R/d; } k.style.transform=`translate(${dx}px,${dy}px)`; stickX=dx/R; stickY=dy/R; if(Math.hypot(stickX,stickY)<0.15){ stickX=stickY=0; } };
  j.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio(); if(auto) setAuto(false); joyId=e.pointerId; try{j.setPointerCapture(e.pointerId)}catch(_){} mv(e); });
  j.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) mv(e); });
  for(const ev of ['pointerup','pointercancel']) j.addEventListener(ev,e=>{ if(e.pointerId===joyId){ joyId=null; stickX=stickY=0; k.style.transform=''; } });
})();
function press(btn,on,off){
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio(); if(auto) setAuto(false); btn.classList.add('dn'); try{btn.setPointerCapture(e.pointerId)}catch(_){} on(); });
  for(const ev of ['pointerup','pointercancel','lostpointercapture']) btn.addEventListener(ev,()=>{ btn.classList.remove('dn'); off&&off(); });
}
press($('atkBtn'),()=>{ atkHeld=true; },()=>{ atkHeld=false; }); press($('rollBtn'),()=>{ rollReq=true; }); press($('skillBtn'),()=>{ skillReq=true; });
$('stage').addEventListener('dblclick',()=>{});
const KEYMAP={j:'j',' ':' ',k:'k',Shift:'Shift',l:'l',e:'e',w:'w',a:'a',s:'s',d:'d',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight'};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='o'){ if(!e.repeat){ ensureAudio(); setAuto(!auto); } return; }
  if(KEYMAP[k]){ if(G&&G.mode==='play'){ e.preventDefault(); if(auto) setAuto(false); ensureAudio(); } keys[KEYMAP[k]]=true; }
});
addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; if(KEYMAP[k]) keys[KEYMAP[k]]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; stickX=stickY=0; });
$('ov').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; if(auto) setAuto(false);
  const act=a.dataset.act;
  if(act==='new') startGame(); else if(act==='cont') startGame(loadSave()); else if(act==='revive') revive(); else if(act==='title'){ newGame(); G.mode='title'; lastMode='title'; showTitle(); }
});
$('autoBtn').addEventListener('click',()=>{ ensureAudio(); setAuto(!auto); });
$('muteBtn').addEventListener('click',()=>{ muted=!muted; ls.set('yb_mute',muted?'1':'0'); applyMute(); });
function applyMute(){ $('muteBtn').textContent=muted?'音 OFF':'音 ON'; if(master) master.gain.value=muted?0:0.7; }

window.__yb={
  state:()=>({mode:G.mode,zone:G.zone,lv:G.hero.lv,exp:G.hero.exp,hp:Math.round(G.hero.hp),max:stat(G).max,pots:G.hero.pots,kills:G.kills,deaths:G.deaths,clock:Math.round(G.clock),bossDead:G.bossDead.slice(),x:G.hero.x,z:G.hero.z,auto}),
  step(dt){ let r=dt; while(r>1e-9){ const d=Math.min(r,1/60); update(d); r-=d; } },
  setAuto, start:(s)=>startGame(s), setSilent:v=>{silent=!!v}, G:()=>G, setLv:(n)=>{ const h=G.hero,s=statsFor(n); h.lv=n; h.hp=s.max; h.mp=s.mpMax; h.exp=0; }, setZone:(i)=>{ setupZone(G,i); }
};
initThree(); newGame(); G.mode='title'; lastMode='title'; applyMute(); showTitle(); requestAnimationFrame(loop);
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
<script>
// ダブルタップ・ピンチでズームしない（iPhone Safari 対策）
(()=>{
  let lt=0;
  document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lt<350&&!(e.target.closest&&e.target.closest('a'))) e.preventDefault(); lt=n; },{passive:false});
  for(const ev of ['gesturestart','gesturechange','gestureend']) document.addEventListener(ev,e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault());
})();
</script>
