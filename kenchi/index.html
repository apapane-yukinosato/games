<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="検地奉行・堅物田之助になって、秋の巡回で5つの村を歩き、隠し田や隠し米を見やぶる時代劇コミカル推理アドベンチャー。">
<title>検地奉行</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
html,body{touch-action:manipulation}
:root{--bg:#EBDDB8;--paper:#F6EBCF;--paper2:#EBD9AE;--ink:#3A2A1A;--mute:#7A6648;--shu:#C8321E;--shu2:#9E2412;--indigo:#2F3F6B;--gold:#C89A2A;--green:#5F8F55;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(circle at 20% 10%,#F2E5C2,transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.mc{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
#app{height:100dvh;max-width:1180px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top,0px)) 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px}
#top{display:flex;align-items:center;gap:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:4px 9px;background:var(--paper);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--shu);border-color:var(--shu2);color:#fff}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.st{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:2px 4px;font-size:11px;font-weight:800;line-height:1.25;min-width:0}
.st b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st i{display:block;height:4px;border-radius:2px;background:#d7c79c;margin-top:1px;overflow:hidden}
.st i s{display:block;height:100%;background:var(--green);text-decoration:none;transition:width .3s}
.st.u i s{background:var(--shu)}.st.d i s{background:#6a4a9a}.st.k i s{background:var(--gold)}
#time{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;background:var(--paper2);border:2px solid var(--ink);border-radius:8px;padding:2px 8px}
#time span{white-space:nowrap}
#tbar{flex:1;display:flex;gap:2px;height:10px}
#tbar i{flex:1;background:#d7c79c;border:1px solid var(--ink);border-radius:2px}
#tbar i.on{background:var(--gold)}
#tbar i.dv{margin-left:4px}
#game{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
#mapWrap{flex:0 0 47%;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
#cv{height:100%;aspect-ratio:4/5;max-width:100%;border:3px solid var(--ink);border-radius:6px;background:var(--paper);touch-action:manipulation;display:block}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;position:relative}
#dlg{position:relative;background:#FFF8E4;border:3px solid var(--ink);border-radius:10px;padding:14px 10px 8px;min-height:92px;max-height:128px;cursor:pointer;box-shadow:0 3px 0 rgba(58,42,26,.35)}
#dname{position:absolute;left:10px;top:-12px;background:var(--ink);color:var(--paper);font-weight:800;font-size:12px;padding:1px 10px;border-radius:6px}
#dtext{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow:auto;max-height:80px}
#dnext{position:absolute;right:10px;bottom:3px;font-size:11px;color:var(--shu);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#tabs{display:flex;gap:4px}
#tabs button{flex:1;border:2px solid var(--ink);border-radius:8px 8px 0 0;background:var(--paper2);font-weight:800;font-size:13px;padding:5px 2px;cursor:pointer}
#tabs button[aria-selected=true]{background:var(--paper);box-shadow:0 2px 0 var(--paper)}
#content{flex:1;min-height:0;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:0 0 10px 10px;margin-top:-5px;padding:8px;overscroll-behavior:contain}
#content.dim{opacity:.45;pointer-events:none}
#screen{flex:1;min-height:0;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:10px;text-align:center;overscroll-behavior:contain}
.btn{display:block;width:100%;border:2px solid var(--ink);border-radius:10px;background:var(--paper2);font-weight:800;font-size:14px;padding:8px 8px;cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(58,42,26,.4);margin-bottom:6px;line-height:1.35}
.btn small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.btn.pri{background:var(--shu);border-color:var(--shu2);color:#fff;box-shadow:0 3px 0 var(--shu2)}
.btn.pri small{color:#ffe0d8}
.btn.go{background:var(--indigo);border-color:#1b2748;color:#fff;box-shadow:0 3px 0 #1b2748}
.btn.go small{color:#d0d8f0}
.btn:disabled{opacity:.4;cursor:default}
.btn.c{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
h4{margin:6px 0 4px;font-size:13px;letter-spacing:.06em;border-bottom:2px solid var(--ink);padding-bottom:1px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.card{border:2px solid var(--ink);border-radius:8px;background:#FFF8E4;padding:4px 5px;text-align:left;cursor:pointer;font-size:11px;line-height:1.35;min-width:0}
.card b{display:block;font-size:12px}
.card span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mute)}
.card em{font-style:normal;display:inline-block;background:var(--indigo);color:#fff;border-radius:6px;padding:0 5px;font-size:10px;margin-top:2px}
.card.sel{background:#FFE2B8;border-color:var(--shu);box-shadow:0 0 0 2px var(--shu)}
.inf{background:#FFF0D0;border:2px solid var(--shu);border-radius:8px;padding:4px 8px;margin-bottom:4px;font-size:12.5px;font-weight:800}
.docs .doc{background:#FFF8E4;border:2px solid var(--ink);border-radius:8px;padding:4px 6px 6px;margin-bottom:6px}
.docs .doc.cl{border-color:var(--shu);background:#FFEFD8}
.docs .doc h5{margin:0 0 3px;font-size:12px;color:var(--mute);letter-spacing:.06em}
.ln{display:block;width:100%;text-align:left;border:1.5px dashed #b9a679;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px;font-weight:800;margin-bottom:3px;cursor:pointer}
.ln.sel{background:#FFE2B8;border:2px solid var(--shu)}
.ln.hit{border:2px solid var(--shu);background:#FFD9CF}
.muted{color:var(--mute);font-size:12px}
.toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(58,42,26,.92);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:4px 12px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:3}
.title-big{font-size:34px;font-weight:800;letter-spacing:.12em;margin:4px 0 0;color:var(--shu2)}
.sub-big{font-size:15px;font-weight:800;letter-spacing:.2em;margin:0 0 8px}
.endt{font-size:26px;font-weight:800;letter-spacing:.1em;color:var(--shu2);margin:2px 0}
.dz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}
.dz div{border:2px solid var(--ink);border-radius:8px;padding:3px;font-size:11px;font-weight:800;background:#FFF8E4}
.dz div.no{opacity:.45;background:#d7c79c}
@media (min-width:900px){
  #game{flex-direction:row}
  #mapWrap{flex:0 0 auto;height:100%}
  #cv{height:100%;width:auto}
  #panel{flex:1;max-width:560px}
  #dtext{font-size:15px;max-height:96px}
  #dlg{max-height:150px}
}
@media (max-height:700px){#hud{display:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><a href="../" id="back">← 一覧</a><h1 class="mc">検地奉行</h1><button class="mini" id="autoBtn" aria-pressed="false" title="オートモード（Oキー）">🤖 オート</button><button class="mini" id="muteBtn">音 ON</button></header>
  <div id="hud" hidden>
    <div class="st"><span>🏅 藩の評価</span><b id="hHyo">40</b><i><s id="bHyo" style="width:40%"></s></i></div>
    <div class="st u"><span>🔥 村の恨み</span><b id="hUra">0</b><i><s id="bUra" style="width:0"></s></i></div>
    <div class="st k"><span>💰 懐</span><b id="hKob">0両</b><i><s id="bKob" style="width:0"></s></i></div>
    <div class="st d"><span>👁 目付の疑い</span><b id="hUta">0</b><i><s id="bUta" style="width:0"></s></i></div>
  </div>
  <div id="time" hidden><span id="tvil">第1村</span><div id="tbar"></div><span id="tleft">残り24刻</span></div>
  <main id="game">
    <div id="mapWrap"><canvas id="cv" width="320" height="400" aria-label="村の地図"></canvas></div>
    <section id="panel">
      <div id="dlg" role="status" hidden><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
      <div id="tabs" role="tablist" hidden>
        <button role="tab" data-t="act" aria-selected="true">🧭 命令</button>
        <button role="tab" data-t="note" aria-selected="false">📒 手帳</button>
        <button role="tab" data-t="docs" aria-selected="false">📜 資料</button>
      </div>
      <div id="content" hidden></div>
      <div id="screen"></div>
    </section>
  </main>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const W=8,H=10,TS=40,HALF=48; // 3日×8刻 = 24刻 = 48半刻

/* ===== 乱数（seed つき） ===== */
function mkRng(seed){
  let a=(seed|0)||1;
  const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  return {f,i:(x,y)=>x+Math.floor(f()*(y-x+1)),pick:arr=>arr[Math.floor(f()*arr.length)],chance:p=>f()<p,
    shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}};
}

/* ===== マス ===== */
const TC={g:1,p:1,'=':1,d:1,w:1,B:1,b:1,H:1,Y:1,K:1,T:1,M:2,F:2,s:2,R:99};
const TN={g:'草地',p:'田',_:'',  '=':'道',d:'山道',w:'水路',B:'板橋',b:'橋',H:'農家',Y:'名主屋敷',K:'蔵',T:'お寺',M:'山',F:'林',s:'沢',R:'川'};
const walkable=t=>t!=='R';

/* ===== 名前・せりふの素材 ===== */
const POOL={
  village:['稲葉','雨宮','水無','大田原','千束','小糠','蛙沢','白河原','米蔵','麦野','藁科','実野','瑞穂','畦道','案山子','千石'],
  chief:['狸塚 腹右衛門','貉田 太兵衛','狸原 ぽん蔵','豆狸 満右衛門','腹鼓 たぬ兵衛'],
  farmer:['権助','与作','万吉','茂兵衛','孫六','五平'],
  widow:['おタネ','おヨネ','おスミ','お梅','おクマ'],
  child:['太郎','小春','次郎','おミツ','金坊'],
  hunter:['弥平','源蔵','又八','熊五郎'],
  monk:['慈念','玄海','徳庵','空円'],
  temple:['万福','慈光','常楽','福禄','大悲'],
  pers:['gamets','kiyowa','oshaberi','ganko','ochoushi']
};
const PERS={gamets:'がめつい',kiyowa:'気弱',oshaberi:'おしゃべり',ganko:'頑固',ochoushi:'お調子者'};
const PS={
  gamets:{hi:'へい、お奉行さま。話の代金は…いえ冗談ですじゃ。',suf:'…ところで、お代は？'},
  kiyowa:{hi:'ひっ！お、お奉行さま…！',suf:'…かもしれませんです…'},
  oshaberi:{hi:'あらあらお奉行さま、聞いてくださいな！',suf:'…ねえ、聞いてる？'},
  ganko:{hi:'……何の用じゃ。',suf:'…それだけじゃ。'},
  ochoushi:{hi:'へいっ、お奉行さま！ご機嫌うるわしゅう！',suf:'ってなもんでさぁ！'}
};
const ROLE_JA={chief:'名主',farmer:'農民',child:'子ども',widow:'後家',hunter:'猟師',monk:'和尚'};
const CAUSE_JA={rain:'長雨',pest:'ウンカの害',drought:'日照り'};

/* ===== 手がかりの種類 ===== */
const FIELD_CLUES={
  water:{icon:'💧',title:'水路の分岐',text:z=>`水路から、帳簿にない細い水の筋が${z}の方角へ分かれている。誰かが勝手に水を引いておるな。`},
  foot:{icon:'👣',title:'新しい足跡',text:z=>`山道に新しい足跡と、こぼれた籾（もみ）。${z}のほうへ点々と続いている。`},
  sparrow:{icon:'🐦',title:'スズメの群れ',text:z=>`スズメが大群で${z}のほうへ飛んでいく。稲穂でもなければ、あんなに集まらぬ。`},
  ash:{icon:'🔥',title:'焼いた藁の灰',text:z=>`焼いた藁の灰が積もっている。${z}で、新しく畦（あぜ）を焼いたような跡だ。`},
  ridge:{icon:'🌾',title:'新しい畦',text:z=>`土の色が妙に新しい畦（あぜ）。${z}の奥へ続いている。つくって日が浅いぞ。`},
  mud:{icon:'🌊',title:'濁った沢',text:z=>`沢の水が茶色く濁っている。${z}の上で、誰かが土を掘り返しておるな。`}
};
const RICE_CLUES={
  tatami:{icon:'🛖',title:'床が沈む',text:b=>`${b}の床が、踏むとやけに沈む。床下に重たい物（米俵）があるぞ。`},
  rat:{icon:'🐀',title:'ネズミの群れ',text:b=>`${b}のまわりにネズミがうじゃうじゃ。米の匂いに集まっておるな。`},
  bran:{icon:'👃',title:'米ぬかの匂い',text:b=>`${b}から米ぬかの匂いがぷんぷんする。精米したてだ。`},
  rut:{icon:'🛒',title:'荷車の轍',text:b=>`夜中に通った荷車の新しい轍（わだち）が、${b}の裏口へ続いている。`}
};
const NEUTRAL=[
  {icon:'🦌',title:'鹿の足跡',text:'ただの鹿の足跡だった。ひづめの形が鹿そのもの。'},
  {icon:'🪵',title:'焚き火のあと',text:'猟師が昼めしを焚いた跡のようだ。事件とは関係なさそう。'},
  {icon:'🎎',title:'倒れた案山子',text:'案山子が倒れている。風のしわざか。カカシに罪はない。'},
  {icon:'🐸',title:'蛙の大合唱',text:'ケロケロうるさい。事件とは無関係だ。耳がつらい。'},
  {icon:'🍡',title:'団子の串',text:'団子の串が落ちている。……まだ新しい。豆吉の仕業では？'},
  {icon:'⛩',title:'小さな祠',text:'道端の祠に手を合わせた。田之助は今日も真面目である。'}
];
const HONEST_DECOY=[
  {icon:'🌾',title:'新しい畦',text:'新しい畦がある。……と思ったが、水害で崩れた畦を村人が直しただけだった。'},
  {icon:'👣',title:'山道の足跡',text:'山道の足跡は、猟師のものと分かった。怪しくない。'},
  {icon:'🔥',title:'焼いた藁',text:'焼いた藁の灰。虫にやられた稲を焼いて始末した跡だ。むしろ気の毒である。'},
  {icon:'💧',title:'水の筋',text:'水路から細い筋が……昔からある排水の溝だった。帳簿にもちゃんと載っている。'},
  {icon:'🐦',title:'スズメの群れ',text:'スズメが群れている。落ち穂をついばんでいるだけだ。腹ペコなのは人もスズメも同じか。'}
];

/* ===== 村をつくる ===== */
function genVillage(seed,idx,kind,used,opt){
  opt=opt||{};
  const rng=mkRng(seed);
  const V={idx,kind,seed};
  // 名前
  let nm; do{ nm=rng.pick(POOL.village); }while(used.includes(nm)); used.push(nm); V.name=nm+'村';
  let nb; do{ nb=rng.pick(POOL.village); }while(used.includes(nb)); V.nbName=nb+'村'; // 隣村（used には入れない）
  // ---- 地形 ----
  const flip=rng.chance(.5), fc=c=>flip?W-1-c:c;
  const g=[]; for(let r=0;r<H;r++) g.push(Array(W).fill('g'));
  const set=(r,c,t)=>{ g[r][fc(c)]=t; };
  for(let r=0;r<=2;r++) for(let c=0;c<W;c++){ const x=rng.f(); set(r,c, r===0?(x<.7?'M':'F'):(x<.4?'M':x<.8?'F':'g')); }
  const sc=rng.i(3,4);
  for(let r=0;r<=2;r++) set(r,sc,'s');
  for(let r=3;r<=7;r++) for(let c=0;c<W;c++) set(r,c,'p');
  for(let c=0;c<W;c++) set(5,c,'=');
  const cols=[0,1,2,3,4,5,6,7];
  const bc=rng.pick(cols.filter(c=>c>=1&&c<=6&&c!==sc));
  const nc=rng.pick(cols.filter(c=>c>=1&&c<=6&&c!==sc&&c!==bc));
  set(6,bc,'=');set(7,bc,'=');
  for(let c=0;c<W;c++) set(8,c,'R'); set(8,bc,'b'); set(9,bc,'=');
  set(3,nc,'=');set(4,nc,'=');set(2,nc,'d');
  set(3,sc,'w');set(4,sc,'w');set(5,sc,'B');set(6,sc,'w');set(7,sc,'w');
  const fr=rng.shuffle(cols.filter(c=>c!==sc&&c!==bc&&c!==nc));
  const yc=fr[0], yr=rng.pick([4,6]); set(yr,yc,'Y');
  const kr=yr===4?3:7; set(kr,yc,'K');
  const farms=[];
  for(let k=1;k<=2;k++){ const r=rng.pick([4,6]); set(r,fr[k],'H'); farms.push({r,c:fc(fr[k])}); }
  const tc=fr[3], tr=rng.pick([3,7]); set(tr,tc,'T'); set(tr===3?4:6,tc,'d');
  if(rng.chance(.5)){ const r=rng.pick([4,6]); set(r,fr[4],'H'); farms.push({r,c:fc(fr[4])}); }
  V.grid=g; V.flip=flip;
  V.start={r:9,c:fc(bc)};
  V.chiefHouse={r:yr,c:fc(yc)}; V.kura={r:kr,c:fc(yc)}; V.temple={r:tr,c:fc(tc)}; V.farms=farms;
  V.canalCol=fc(sc);
  V.ts=rng.i(1,99999);
  // ---- 区域（隠し田の候補地） ----
  const zdef=[[0,2,'西'],[3,4,'北'],[5,7,'東']];
  const zones=zdef.map((z,i)=>{
    const tiles=[]; let nF=0,nM=0,nS=0;
    for(let r=0;r<=2;r++) for(let c=z[0];c<=z[1];c++){ tiles.push({r,c}); const t=g[r][c]; if(t==='F')nF++; if(t==='M')nM++; if(t==='s')nS++; }
    const suf=nS?'の沢':(nF>=nM?'の林':'の山裏');
    return {id:'z'+i,kind:'zone',name:z[2]+suf,tiles,center:{r:1,c:Math.floor((z[0]+z[1])/2)},hasS:nS>0};
  });
  V.zones=zones;
  // ---- 人物 ----
  const occ=new Set([V.start.r+','+V.start.c]);
  const K_=(r,c)=>r+','+c;
  const free=(r,c)=>r>=0&&r<H&&c>=0&&c<W&&walkable(g[r][c])&&!occ.has(K_(r,c));
  const folks=[]; V.folks=folks;
  function mkFolk(role,pos){

  const decoys=sites.filter((s,i)=>i!==ti);
  // ---- 手がかりスポット ----
  const spots=[]; V.spots=spots; V.paddyMod={};
  const near=(cen,rad)=>{ const o=[]; for(let r=cen.r-rad;r<=cen.r+rad;r++)for(let c=cen.c-rad;c<=cen.c+rad;c++){ if(free(r,c)&&(Math.abs(r-cen.r)+Math.abs(c-cen.c))<=rad) o.push({r,c}); } return o; };
  const placeFrom=(cands,fallbackCen)=>{
    let a=cands.filter(t=>free(t.r,t.c));

  const addSpot=(o,tile)=>{

  const zoneTiles=z=>z.tiles.filter(t=>free(t.r,t.c)&&g[t.r][t.c]!=='s');

  const plainNear=z=>{ const o=[]; for(let r=3;r<=4;r++)for(let c=z.tiles[0].c-1;c<=z.tiles[z.tiles.length-1].c+1;c++) if(free(r,c)&&(g[r][c]==='p'||g[r][c]==='=')) o.push({r,c}); return o; };
  const ring=(b)=>{ let o=near(b.center,1); if(!o.length) o=near(b.center,2); return o; };
  function fieldSpot(cat,z){

    if(cat==='water') cands=canalTiles(); else if(cat==='sparrow') cands=plainNear(z);

  const addNeutral=(n)=>{ for(let k=0;k<n;k++){ const d=rng.pick(NEUTRAL); const cs=[]; for(let r=3;r<=9;r++)for(let c=0;c<W;c++) if(free(r,c)&&r!==8) cs.push({r,c}); const t=rng.pick(cs); addSpot({cat:'none',icon:d.icon,title:d.title,text:d.text,label:TN[g[t.r][t.c]]},t); } };
  const notes={}; // 証言ノート（人物id→定義）

  const flavor={

  if(kind==='field'||kind==='rice'){

      const hf=F('hunter'); mkTalk('hunter',{cat:'smoke',site:T.id,icon:'🪵'},
        [['hunter',quote(hf,`${T.name}の奥で、夜ふけに煙が上がるのを見たぞ。炭焼きの季節でもないのにな`)]]);
      const cf=F('child'); mkTalk('child',{cat:'child',site:T.id,icon:'🧒'},

      const lf=F(liarRole); const mudTile=placeFrom(near({r:lf.r,c:lf.c},2),{r:lf.r,c:lf.c});
      const mud=addSpot({cat:'sandal',site:T.id,icon:'🥾',title:'泥だらけの草鞋',text:`ぬれた草鞋（わらじ）が干してある。底に${T.name}の赤土がべったり。`,label:TN[g[mudTile.r][mudTile.c]]},mudTile);
      mkTalk(liarRole,{cat:'lie',site:null,contra:mud.id,icon:'🙊'},[[liarRole,quote(lf,`${T.name}？あんな所へは誰も行っとらん。わしも山へは行っとらんぞ`)]]);
      mud.contra=lf.id; mud.contraText=`「山へは行っとらん」と言うのに、草鞋は${T.name}の泥だらけ！つまり${T.name}に何かがある！`;

  }else{

      pest:{cat:'pest',icon:'🐛',title:'ウンカの害',text:'稲にウンカがびっしり。茎ごと枯れて、穂がスカスカだ。虫害は本物だ。',mod:'pest'},
      drought:{cat:'dry',icon:'🏜',title:'ひび割れた田',text:'田んぼの土がカラカラにひび割れている。水不足で稲が立ち枯れておる。日照りは本物だ。',mod:'crack'}}[cause];
    const pcs=[]; for(let r=3;r<=7;r++)for(let c=0;c<W;c++) if(g[r][c]==='p'&&free(r,c)) pcs.push({r,c});

    addSpot({cat:'bin',site:'honest',icon:'🍚',title:'空の米びつ',text:'のぞいた米びつは空っぽ。底にぬかが少し残るだけ。暮らしの苦しさが伝わる。',label:'農家'},binTile);
    // 怪しく見えるが無関係なもの

    for(const d of hd){ const cs=[]; for(let r=1;r<=7;r++)for(let c=0;c<W;c++) if(free(r,c)) cs.push({r,c}); const t=rng.pick(cs); addSpot({cat:'none',icon:d.icon,title:d.title,text:d.text,label:TN[g[t.r][t.c]]},t); }
    addNeutral(1);
    const ch=F('child'); mkTalk('child',{cat:'hunger',site:'honest',icon:'🧒'},[['child',`「おなかすいた…。ごはんは、ひえのおかゆだけなの…」`]]);
    const fm=F('farmer'); mkTalk('farmer',{cat:'ftalk',site:'honest',icon:'🧑‍🌾'},[['farmer',quote(fm,`今年は${CAUSE_JA[cause]}でなあ…。稲がみんなやられちまった`)]]);
    const wd=F('widow'); mkTalk('widow',{cat:'wtalk',site:'honest',icon:'👵'},[['widow',quote(wd,'米びつが空でねえ。種もみまで食べちまいそうさ')]]);
    mkTalk('hunter',null,[['hunter',quote(F('hunter'),rng.pick(flavor.hunter))]]);
    mkTalk('monk',null,[['monk',quote(F('monk'),'今年は檀家からのお布施も減ってのう。みな苦しいのじゃ')]]);

  if(kind!=='honest'){

    V.hintNote={id:'n_hint',kind:'talk',cat:'hint',site:T.id,contra:null,icon:'🙏',title:'名主の白状',text:`名主「降参ですじゃ…。隠してあるのは、${T.name}の近くで…」`};
  }

  for(const f of folks){ if(f.role==='chief') continue; if(!f.lines) f.lines=[[f.role,quote(f,rng.pick(flavor[f.role]))]]; }
  // 田の見た目（普通の村）
  V.spotsByTile={}; spots.forEach(s=>{ V.spotsByTile[K_(s.r,s.c)]=s; });

  else V.hiddenTiles=[];
  return V;
}

/* ===== 申告と資料 ===== */
function buildDecl(V){
  const rainTxt={heavy:'多い（長雨）',normal:'例年なみ',light:'少ない（日照り）'}[V.weather.rain];
  const facts=[
    {id:'F1a',doc:'去年の検地帳',text:`田 ${V.L} 枚`},
    {id:'F1b',doc:'去年の検地帳',text:`石高 ${V.K} 石`},
    {id:'F2a',doc:'藩の天候記録',text:`雨量：${rainTxt}`},
    {id:'F2b',doc:'藩の天候記録',text:`虫害：${V.weather.pest?'あり':'なし'}`},
    {id:'F2c',doc:'藩の天候記録',text:`水害：${V.weather.flood?'あり（川があふれた）':'なし'}`},
    {id:'F3a',doc:`隣の${V.nbName}`,text:`田 ${V.Ln} 枚`},
    {id:'F3b',doc:`隣の${V.nbName}`,text:`今年 ${V.Qn} 石（去年 ${V.Kn} 石）`}
  ];
  const claims=[
    {id:'C1',text:`田は ${V.D} 枚`},
    {id:'C2',text:`石高は ${V.Q} 石`},
    {id:'C3',text:`不作のわけは「${CAUSE_JA[V.cause]}」`}
  ];
  const w=V.weather, cause=V.cause;
  const oursR=(V.Q/V.D)/(V.K/V.L), nbR=V.Qn/V.Kn;
  const yieldBad=oursR<nbR-.2;
  const causeBad=cause==='rain'?w.rain!=='heavy':cause==='drought'?w.rain!=='light':!w.pest;
  const res={};
  for(const c of claims)for(const f of facts) res[c.id+':'+f.id]={contra:false,msg:'その二つは、関係がなさそうだ。'};
  // 田の枚数
  res['C1:F1a']= V.D<V.L ? (w.flood?{contra:false,msg:`田が${V.L-V.D}枚減っているが、水害の記録がある。潰れた田があるのだろう。ムジュンはない。`}
      :{contra:true,kind:'fewer',msg:`去年は${V.L}枚、今年は${V.D}枚。水害の記録もないのに、田が${V.L-V.D}枚も消えるか！`}) : {contra:false,msg:'去年と同じ枚数だ。ムジュンはない。'};
  if(V.D<V.L&&w.flood) res['C1:F2c']={contra:false,msg:'水害の記録があるので、田が減ったのも納得がいく。ムジュンはない。'};
  // 原因
  if(cause==='pest'){
    res['C3:F2b']= causeBad?{contra:true,kind:'cause',msg:'「ウンカの害」と言うが、天候記録に虫害はない！'}:{contra:false,msg:'虫害の記録がある。申告どおりだ。ムジュンはない。'};
  }else{
    res['C3:F2a']= causeBad?{contra:true,kind:'cause',msg:cause==='rain'?'「長雨」と言うが、記録では雨量は多くない！':'「日照り」と言うが、記録では雨は少なくない！'}:{contra:false,msg:'記録も同じ天気だ。申告どおり。ムジュンはない。'};
  }
  // 石高
  res['C2:F3b']= yieldBad?{contra:true,kind:'yield',msg:`田一枚あたりの取れ高が、隣の${V.nbName}より明らかに低い！同じ空の下でこれはおかしい！`}
      :{contra:false,msg:`隣の${V.nbName}の取れ高と比べても、おかしくはない。ムジュンはない。`};
  const list=Object.keys(res).filter(k=>res[k].contra);
  return {claims,facts,res,contras:list};
}

/* ===== 手がかりの組み合わせ（推理） ===== */
function pairResult(V,a,b){
  if(!a||!b||a.id===b.id) return null;
  if(a.contra===b.id||b.contra===a.id){
    const sp=a.kind==='clue'&&a.contraText?a:(b.kind==='clue'&&b.contraText?b:null);
    const siteId=(a.site||b.site);
    return {site:siteId,by:'contra',text:sp?sp.contraText:'ムジュンを見つけた！'};
  }
  if(a.site&&a.site===b.site&&a.cat!==b.cat) return {site:a.site,by:'combo'};
  return null;
}
function siteName(V,id){ if(id==='honest') return null; const s=V.sites.find(x=>x.id===id); return s?s.name:'?'; }

function tone(f,d,type,v,t0,f2){
  if(muted) return; const a=ac(); if(!a) return;
  try{ const t=a.currentTime+(t0||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||.15,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.05); }catch(e){}
}
function noise(d,v,t0,lp){
  if(muted) return; const a=ac(); if(!a) return;
  try{ const t=a.currentTime+(t0||0), n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), x=b.getChannelData(0);
    for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||3000;
    s.buffer=b; g.gain.value=v||.2; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }catch(e){}
}

function pathTo(r,c){
  const V=S.V, g=V.grid; if(r<0||r>=H||c<0||c>=W||g[r][c]==='R') return null;
  const dist=[],prev=[]; for(let i=0;i<H;i++){ dist.push(Array(W).fill(1e9)); prev.push(Array(W).fill(null)); }
  dist[S.pos.r][S.pos.c]=0; const q=[[S.pos.r,S.pos.c]];
  while(q.length){ q.sort((a,b)=>dist[a[0]][a[1]]-dist[b[0]][b[1]]); const [y,x]=q.shift();
    for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){ const ny=y+dy,nx=x+dx; if(ny<0||ny>=H||nx<0||nx>=W) continue; const t=g[ny][nx]; if(t==='R') continue;

  if(dist[r][c]>=1e9) return null;
  const path=[]; let cur=[r,c]; while(!(cur[0]===S.pos.r&&cur[1]===S.pos.c)){ path.unshift({r:cur[0],c:cur[1]}); cur=prev[cur[0]][cur[1]]; }
  return {path,cost:dist[r][c]};
}

function updateDlg(dt){
  const d=S.dlg, l=d.lines[d.i];
  if(d.ch<l.t.length){ d.ch=Math.min(l.t.length,d.ch+dt*(S.auto?999:55)); }
  else if(S.auto){ d.wait+=dt; if(d.wait>.14+l.t.length*.003){ advance(); S.dirty=true; } }
}
function updateWalk(dt){
  const w=S.walk; w.t+=dt; const st=S.auto?.04:.13;
  while(S.walk&&w.t>=st){
    w.t-=st; const p=w.path[w.i];
    S.kpos={r:S.pos.r,c:S.pos.c}; S.pos={r:p.r,c:p.c}; spend(TC[tileAt(p.r,p.c)]); sfx('step'); w.i++;
    if(w.i>=w.path.length){ S.walk=null; S.dirty=true; break; }
    if(S.fx) break;
  }
}
function update(dt){
  S.tm+=dt; if(S.rev) S.rev.t+=dt;
  if(S.fx){ S.fx.t0+=dt; if(S.fx.t0>=S.fx.dur){ S.fx=null; S.dirty=true; } return; }
  if(S.dlg){ updateDlg(dt); return; }
  if(S.walk){ updateWalk(dt); return; }
  if(S.ui==='play'){
    if(S.pend&&(S.phase==='explore'||S.phase==='declare')){ startEnding(S.pend); return; }
    if(S.phase==='explore'&&!S.choice&&!S.accuse&&leftH()<=0&&!S.tu){
      S.tu=true;
      say([['tano','日が暮れ、三日目も終わってしまった…。もはや調べる刻はない。','s'],['koz','最後に、あやしい所を指して勝負するか、裁定に入るか…でやんす。','n']],()=>{
        S.choice={k:'timeup',title:'刻が尽きた。どうする？',opts:[
          {label:'最後に摘発する！',sub:'当てずっぽうでも、賭けてみる',cls:'pri',fn:()=>{ S.choice=null; startAccuse(); }},
          {label:'裁定に入る',sub:'',cls:'',fn:()=>{ S.choice=null; toJudge(); }}]}; S.dirty=true; });
      return;
    }
  }
  if(S.auto) autoStep(dt);
}

/* ===== 🤖 オート（TAS 風：最短・最速・最適） ===== */
function dijk(V,sr,sc){
  const g=V.grid, dist=[]; for(let i=0;i<H;i++) dist.push(Array(W).fill(1e9));
  dist[sr][sc]=0; const q=[[sr,sc]];
  while(q.length){ q.sort((a,b)=>dist[a[0]][a[1]]-dist[b[0]][b[1]]); const [y,x]=q.shift();
    for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){ const ny=y+dy,nx=x+dx; if(ny<0||ny>=H||nx<0||nx>=W||g[ny][nx]==='R') continue; const nd=dist[y][x]+TC[g[ny][nx]]; if(nd<dist[ny][nx]){ dist[ny][nx]=nd; q.push([ny,nx]); } } }
  return dist;
}
function approach(V,dist,t){ // 対象の隣（または同じマス）へ行く最小コスト
  let best=null;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(Math.abs(dr)+Math.abs(dc)>1) continue; const r=t.r+dr,c=t.c+dc; if(r<0||r>=H||c<0||c>=W||V.grid[r][c]==='R') continue; if(dist[r][c]>=1e9) continue;
    if(!best||dist[r][c]<best.cost) best={r,c,cost:dist[r][c]}; }
  return best;
}
function bestPair(V,from){
  const info=analyze(V), ns=info.notes, truthSite=V.truth?V.truth.id:'honest';
  const d0=dijk(V,from.r,from.c); let best=null;
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const p=pairResult(V,ns[i],ns[j]); if(!p||p.site!==truthSite) continue;
    for(const [a,b] of [[ns[i],ns[j]],[ns[j],ns[i]]]){
      const pa=approach(V,d0,a); if(!pa) continue;
      const da=dijk(V,pa.r,pa.c), pb=approach(V,da,b); if(!pb) continue;
      const cost=pa.cost+2+pb.cost+2; if(!best||cost<best.cost) best={a,b,cost};
    }
  }
  return best;
}
function autoPlan(){
  const V=S.V, bp=bestPair(V,S.pos);
  const steps=[]; if(bp){ steps.push(bp.a,bp.b); }
  return {vi:S.vi,seed:S.seed,steps,i:0,combined:false,pressed:false,pair:bp};
}
function autoChoice(){
  const c=S.choice, V=S.V; let i=0;
  if(c.k==='daughter') i=1;
  else if(c.k==='judge') i=V.kind==='honest'?1:0;
  c.opts[i].fn(); S.dirty=true;
}
function autoDeclare(){
  const V=S.V, todo=V.decl.contras.filter(k=>!S.cf[k]);
  if(todo.length){ const [c,f]=todo[0].split(':'); S.doc={c,f}; tryTsuki(); S.dirty=true; return; }
  startExplore(); S.dirty=true;
}
function autoGoNear(t){ // t のそばまで最短で行く。着いていれば true
  if(man(t,S.pos)<=1) return true;
  const dist=dijk(S.V,S.pos.r,S.pos.c), a=approach(S.V,dist,t);
  if(!a||a.cost>leftH()){ return 'fail'; }
  goTo(a.r,a.c); return false;
}
function autoExplore(){
  const V=S.V;
  if(!S.ap||S.ap.vi!==S.vi||S.ap.seed!==S.seed) S.ap=autoPlan();
  const ap=S.ap;
  while(ap.i<ap.steps.length&&S.notes.find(n=>n.id===ap.steps[ap.i].id)) ap.i++;
  if(ap.i<ap.steps.length){
    const t=ap.steps[ap.i], r=autoGoNear(t);
    if(r==='fail'){ ap.i=ap.steps.length; ap.failed=true; return; }
    if(r===true){ if(t.src==='spot'){ const s=V.spots.find(x=>x.id===t.id); investigate(s); } else { talk(V.folks.find(x=>x.id===t.id)); } }
    return;
  }
  if(!ap.combined){
    ap.combined=true;
    if(ap.pair){ const want=V.truth?V.truth.id:'honest'; if(!S.infers.find(x=>x.site===want)){ S.selNotes=[]; pickNote(ap.pair.a.id); pickNote(ap.pair.b.id); } }
    return;
  }
  if(V.kind==='honest'||ap.failed){ if(V.kind==='honest') { toJudge(); return; } }
  if(V.daughter&&!V.pressed&&S.infers.length&&leftH()>=2){
    const r=autoGoNear(V.chief);
    if(r===true) talkChief(); else if(r==='fail') V.pressed=true;
    return;
  }
  if(V.kind!=='honest'){
    const T=V.truth.center; startAccuse(); askAccuse(T.r,T.c); S.dirty=true; return;
  }
  toJudge();
}
function autoStep(dt){
  S.aw=(S.aw||0)-dt; if(S.aw>0) return; S.aw=.1;
  if(S.ui==='title'){ newGame(); return; }
  if(S.ui==='result'){ S.resultWait+=.1; if(S.resultWait>=3) newGame(S.seed+1); return; }
  if(S.ui!=='play') return;
  if(S.choice){ autoChoice(); return; }
  if(S.phase==='declare') return autoDeclare();
  if(S.phase==='explore') return autoExplore();
}

/* ===== ループ ===== */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-lastT)/1000); lastT=now;
  update(dt); if(S.dirty) render(); dlgText(); draw();
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{ S.dirty=true; });
function fitMap(){ /* 地図は CSS の aspect-ratio で自動フィット */ }

/* ===== テスト用フック ===== */
function flush(){ let n=0; while((S.dlg||S.fx||S.walk)&&n++<20000){ if(S.fx){ S.fx.t0=S.fx.dur; S.fx=null; } else if(S.walk){ updateWalk(1); } else advance(); } S.dirty=true; }
function truthInfo(){
  const V=S.V; if(!V) return null;
  return {kind:V.kind,name:V.name,truth:V.truth?{id:V.truth.id,name:V.truth.name,center:V.truth.center}:null,daughter:V.daughter,
    contras:V.decl.contras.slice(),spots:V.spots.map(s=>({id:s.id,r:s.r,c:s.c,cat:s.cat,site:s.site,title:s.title})),
    folks:V.folks.map(f=>({id:f.id,role:f.role,r:f.r,c:f.c,cat:f.note&&f.note.cat,site:f.note&&f.note.site})),
    weather:V.weather,cause:V.cause,L:V.L,D:V.D,K:V.K,Q:V.Q,hidKoku:V.hidKoku,bribe:V.bribe};
}
function stateOut(){
  return {ui:S.ui,phase:S.phase,auto:S.auto,seed:S.seed,vi:S.vi,plan:S.plan.slice(),kind:S.V&&S.V.kind,left:leftH(),used:S.used,pos:S.pos,
    hyo:S.hyo,ura:S.ura,kob:S.kob,uta:S.uta,bribes:S.bribes,strict:S.strict,mercy:S.mercy,right:S.right,caughtN:S.caughtN,falseAcc:S.falseAcc,
    notes:S.notes.map(n=>n.id),infers:S.infers.map(i=>i.site),contras:Object.keys(S.cf),caught:S.vcaught,ending:S.ending,result:S.result,score:S.score,
    vlog:S.vlog,dlg:!!S.dlg,choice:S.choice?{k:S.choice.k,n:S.choice.opts.length}:null,pend:S.pend,akuda:S.akuda,view:S.view,tab:S.tab};
}
window.__kenchi={
  state:stateOut, setAuto, reveal:truthInfo,
  step(dt,n){ n=n||1; for(let k=0;k<n;k++){ let t=dt; while(t>0){ const d=Math.min(t,.05); update(d); t-=d; } } if(S.dirty) render(); dlgText(); draw(); },
  newGame(seed,opt){ S.forceDaughter=opt&&opt.daughter?[1,1,1,1,1]:null; newGame(seed); },
  flush, choose(i){ act('choice',null,i); flush(); },
  forceEnding(id){ flush(); startEnding(id); },
  toTitle,
  startExplore(){ flush(); startExplore(); flush(); },
  tsuki(c,f){ S.doc={c,f}; tryTsuki(); },
  goTo(r,c){ return goTo(r,c); },
  invest(id){ const s=S.V.spots.find(x=>x.id===id); investigate(s); },
  talk(id){ const f=S.V.folks.find(x=>x.id===id); talk(f); },
  combine(a,b){ S.selNotes=[]; pickNote(a); pickNote(b); },
  accuse(r,c){ doAccuse(r,c); }, toJudge, judge(k){ judge(k); }, nextVillage, afterJudge,
  press(){ pressChief(); },
  tab:setTab, tap:onTap, lsClear(){ try{ localStorage.removeItem('kenchiBest'); localStorage.removeItem('kenchiEndings'); }catch(e){} book=[]; best={score:0,rank:'-'}; },
  S, gen(seed,idx,kind,opt){ return genVillage(seed,idx,kind,[],opt); },
  analyze, bestPair, dijk, genVillage, pairResult, mkRng,
  setUsed(n){ S.used=n; S.dirty=true; },
  verify(n){
    const out={n,bad:[],honestCounts:{},stats:{minCost:[],kinds:{field:0,rice:0,honest:0},contraOk:0,daughter:0,unreachable:0}};
    for(let seed=1;seed<=n;seed++){
      resetRun(seed); const h=S.plan.filter(k=>k==='honest').length; out.honestCounts[h]=(out.honestCounts[h]||0)+1;
      if(h<1) out.bad.push({seed,why:'no honest'});
      const used=[];
      for(let i=0;i<5;i++){
        const V=genVillage(seed*1009+i*7919+13,i,S.plan[i],used,{}); out.stats.kinds[V.kind]++; if(V.daughter) out.stats.daughter++;
        const truthSite=V.truth?V.truth.id:'honest';
        const an=analyze(V);
        if(an.sites.length!==1||an.sites[0]!==truthSite) out.bad.push({seed,i,kind:V.kind,why:'sites',sites:an.sites,truth:truthSite});
        // 申告の整合
        if(V.kind==='honest'&&V.decl.contras.length) out.bad.push({seed,i,why:'honest has contra',c:V.decl.contras});
        if(V.kind!=='honest'&&!V.decl.contras.length) out.bad.push({seed,i,why:'dishonest no contra'});
        if(V.kind==='field'&&!V.decl.contras.includes('C1:F1a')) out.bad.push({seed,i,why:'field w/o fewer'});
        if(V.kind==='rice'&&!V.decl.contras.includes('C2:F3b')) out.bad.push({seed,i,why:'rice w/o yield'});
        // 到達性
        const d=dijk(V,V.start.r,V.start.c);
        for(const s of V.spots) if(!approach(V,d,s)) { out.bad.push({seed,i,why:'spot unreachable',s:s.id}); }
        for(const f of V.folks) if(!approach(V,d,f)) { out.bad.push({seed,i,why:'folk unreachable',f:f.id}); }
        // 重複マス
        const seen=new Set(); for(const s of V.spots){ const k=s.r+','+s.c; if(seen.has(k)) out.bad.push({seed,i,why:'dup tile',k}); seen.add(k); if(V.grid[s.r][s.c]==='R') out.bad.push({seed,i,why:'spot on river'}); }
        for(const f of V.folks){ const k=f.r+','+f.c; if(seen.has(k)) out.bad.push({seed,i,why:'folk overlaps',k}); seen.add(k); }
        const bp=bestPair(V,V.start); if(!bp) out.bad.push({seed,i,why:'no pair'}); else { out.stats.minCost.push(bp.cost); if(bp.cost>34) out.bad.push({seed,i,why:'too far',cost:bp.cost}); }
        // 全手がかりを集めた場合の総コスト（全部は調べ切れないこと）
        let tot=0; V.spots.forEach(()=>tot+=2); V.folks.forEach(()=>tot+=2); out.stats['tot']=(out.stats['tot']||0)+tot;
      }
    }
    return out;
  }
};

/* ===== 起動 ===== */
toTitle(); render(); draw(); requestAnimationFrame(loop);
})();
</script>

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
