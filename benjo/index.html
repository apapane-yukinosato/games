<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="お腹が痛い！ トイレはこの通路の先…なのに、通路がループする。異変を見つけたら引き返せ。見のがしたら最初から。もらしたらおしまい。">
<title>便所の入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#17181A;--ink:#EDEBE4;--card:#24262A;--line:#3A3D42;--mute:#9A9A92;--acc:#F2C230;--red:#E0503A}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;font-weight:800;white-space:nowrap}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#222}
#wrap{position:relative}
#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;background:#000;touch-action:none}
#pad{display:flex;gap:8px;margin-top:8px}
#pad button{min-height:64px;border:0;border-radius:16px;font-weight:800;font-size:19px;cursor:pointer;touch-action:none}
#goBtn{flex:2;background:linear-gradient(#5A6A5A,#3A4A3A);color:#fff;box-shadow:0 5px 0 #222}
#goBtn.on{transform:translateY(3px);box-shadow:0 2px 0 #222}
#backBtn{flex:1;background:linear-gradient(#7A4A3A,#5A2A1A);color:#fff;box-shadow:0 5px 0 #2A1A10}
#backBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2A1A10}
.ov{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;background:rgba(0,0,0,.6);border-radius:14px;padding:12px;z-index:3;overflow-y:auto;overscroll-behavior:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:380px;text-align:center;margin:auto 0;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card h2{margin:0;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:28px;line-height:1.3;color:var(--acc);letter-spacing:.06em}
.sub{font-size:13px;color:var(--mute);margin:6px 0 10px;line-height:1.7;white-space:pre-line}
.rules{text-align:left;font-size:12.5px;line-height:1.75;background:#1A1B1E;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.rules b{color:var(--acc)}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:12px;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px;background:var(--acc);color:#222;box-shadow:0 4px 0 #A07A10}
.go.alt{background:#34373C;color:var(--ink);box-shadow:0 4px 0 #1A1B1E}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.big{font-size:44px;margin:2px 0}
.stat{font-size:12px;color:var(--mute);margin:6px 0 0}
.help{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 0;line-height:1.6}
@media (pointer:coarse){.pc{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>🚻 便所の入口</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap">
    <canvas id="cv" width="360" height="480" aria-label="地下通路を歩く一人称の画面"></canvas>
    <div class="ov" id="titleOv">
      <div class="card">
        <h2>便所の入口</h2>
        <p class="sub">お腹が…痛い…！ トイレはこの通路の先。<br>なのに、なぜか同じ通路にもどってくる。</p>
        <div class="rules">
          ・<b>異変</b>を見のがさないこと<br>
          ・異変を見つけたら、すぐに<b>引き返す</b>こと<br>
          ・異変が見つからなかったら、引き返さないこと<br>
          ・看板の「<b>トイレまで あと 8</b>」が 0 になれば、便所の入口<br>
          ・まちがえると「あと 8」からやり直し。お腹のげんかいが来たら……<b>おしまい</b>
        </div>
        <button class="go" id="startBtn">🚶 通路へ</button>
        <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
        <p class="stat" id="titleStat"></p>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
    <div class="ov" id="resultOv" hidden>
      <div class="card">
        <div class="big" id="resIcon"></div>
        <h2 id="resTitle"></h2>
        <p class="sub" id="resText"></p>
        <button class="go" id="retryBtn">もう一度</button>
        <button class="go alt" id="menuBtn">タイトルへ</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
  </div>
  <div id="pad"><button id="goBtn">⬆ 進む（長押し）</button><button id="backBtn">↩ 引き返す</button></div>
  <p class="help">「進む」を押している間だけ歩く。画面の長押しでも歩ける。<span class="pc"><br>PC：↑/W/スペースで進む　↓/S で引き返す　O オート　M 音</span></p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(rnd()*a.length)];
const W=360,H=480;
const cv=$('cv'), g=cv.getContext('2d');

/* ================= the corridor (one-point perspective) ================= */
const HW=1.4, CH=2.5, EYE=1.55, F=240, HY=212, L=24, SIGN_Z=2.6, START_Z=1.0;
// the anomalies. detect(): when a careful walker would notice it (used by the auto)
const ANOMS=[
  {id:'posterEyes',n:'広告のおじさんが見ている',d:s=>s.cz>5.2},
  {id:'redLights',n:'照明が赤い',d:s=>s.lt>.6},
  {id:'flicker',n:'照明がチカチカする',d:s=>s.lt>1.9},
  {id:'extraDoor',n:'左のかべに知らないドア',d:s=>s.cz>13},
  {id:'signArrow',n:'看板の矢印が逆',d:s=>s.lt>.5},
  {id:'puddle',n:'床に水たまりが広がる',d:s=>s.cz>6.5},
  {id:'noExt',n:'消火器がない',d:s=>s.cz>7.5},
  {id:'paper',n:'トイレットペーパーが転がってくる',d:s=>s.paper&&s.paper.t>.8},
  {id:'hands',n:'かべに赤い手形',d:s=>s.cz>9},
  {id:'walkerStare',n:'おじさんが立ち止まってこっちを見る',d:s=>s.walker&&s.walker.stareT>.5},
  {id:'walkerBig',n:'おじさんが大きすぎる',d:s=>s.walker&&(s.walker.z-s.cz)<12},
  {id:'noWalker',n:'おじさんがいない',d:s=>s.lt>2.4},
  {id:'cleanDoor',n:'清掃用具室のドアがすこし開いている',d:s=>s.cz>3.2},
  {id:'exitMirror',n:'非常口の人が逆向き',d:s=>s.cz>10.5},
  {id:'pinkWall',n:'かべがピンク色',d:s=>s.lt>.6},
  {id:'posterExtra',n:'広告が1枚多い',d:s=>s.cz>14},
  {id:'shadow',n:'だれもいないのに床に影',d:s=>s.cz>3.5},
  {id:'ventEye',n:'天井の通気口に目',d:s=>s.cz>2.6},
];
const AMAP=Object.fromEntries(ANOMS.map(a=>[a.id,a]));

const S={scene:'title',cz:START_Z,dir:1,v:0,left:8,anom:null,lastAnom:null,loop:0,lt:0,t:0,pain:15,cramp:0,nextCramp:22,mist:0,found:0,
  walker:null,paper:null,trans:0,transKind:'',turnT:0,bob:0,shake:0,msg:'',msgT:9,holdUser:false,keyGo:false,auto:false,manual:false,resT:0,
  ai:{notice:-1,miss:false,fake:-1},flick:0,
  best:(()=>{ try{ return JSON.parse(localStorage.getItem('benjoBest')||'null')||{time:0,clears:0}; }catch(e){ return {time:0,clears:0}; } })(),
  seen:(()=>{ try{ return new Set(JSON.parse(localStorage.getItem('benjoSeen')||'[]')); }catch(e){ return new Set(); } })()};
function saveBest(){ if(S.auto) return; try{ localStorage.setItem('benjoBest',JSON.stringify(S.best)); localStorage.setItem('benjoSeen',JSON.stringify([...S.seen])); }catch(e){} }

function start(){
  S.scene='play'; S.left=8; S.mist=0; S.pain=15; S.cramp=0; S.nextCramp=20+rnd()*8; S.t=0; S.lastAnom=null; S.found=0;
  ['titleOv','resultOv'].forEach(id=>$(id).hidden=true);
  newLoop(true); say('お腹が…痛い…。トイレをさがそう'); sfx('start');
}
function newLoop(first){
  S.loop++; S.cz=START_Z; S.dir=1; S.v=0; S.lt=0; S.turnT=0; S.paper=null; S.ai={notice:-1,miss:rnd()<.04,fake:rnd()<.025?3+rnd()*15:-1};
  // the first corridor and the toilet corridor are always normal
  if(first||S.left===0||rnd()>.62) S.anom=null;
  else { let a; do{ a=pick(ANOMS).id; }while(a===S.lastAnom); S.anom=a; S.lastAnom=a; }
  S.walker=S.anom==='noWalker'||S.left===0?null:{z:L-1.5,x:-.78,stareT:0,big:S.anom==='walkerBig',stare:S.anom==='walkerStare',ph:0};
}
const isA=id=>S.anom===id;
function say(m){ S.msg=m; S.msgT=0; }

/* ================= update ================= */
function update(dt){
  S.t+=dt; S.msgT+=dt;
  if(S.scene!=='play'){ if(S.auto&&S.scene!=='play'){ S.resT+=dt; if(S.resT>(S.scene==='title'?.6:3.5)){ S.resT=0; start(); } } return; }
  if(S.trans>0){ S.trans-=dt; if(S.trans<=.45&&S.transKind){ const k=S.transKind; S.transKind=''; finishLoop(k); } if(S.scene!=='play') return; S.pain+=.22*dt; return; }
  S.lt+=dt;
  // the stomach: slowly worse, with cramps every now and then
  S.pain+=.22*dt;
  if(S.cramp>0){ S.cramp-=dt; S.pain+=1.6*dt; S.shake=3; if(S.cramp<=0) S.nextCramp=22+rnd()*8; }
  else { S.nextCramp-=dt; if(S.nextCramp<=0){ S.cramp=2.6; say('ぐぎゅるるる……っ！'); sfx('growl'); } }
  S.shake=Math.max(0,S.shake-dt*4);
  if(S.pain>=100){ S.pain=100; return gameOver(); }
  if(S.auto) autoTick(dt);
  // walking
  const want=(S.holdUser||S.keyGo||S.autoGo)&&S.turnT<=0;
  const top=S.cramp>0?1.3:3.0;
  S.v+=((want?top:0)-S.v)*Math.min(1,dt*(want?6:9));
  if(S.turnT>0) S.turnT-=dt;
  S.cz+=S.v*S.dir*dt; S.bob+=S.v*dt*2.4;
  if(S.v>.5&&Math.floor(S.bob/Math.PI)!==Math.floor((S.bob-S.v*dt*2.4)/Math.PI)) sfx('step');
  // the man walks toward the start
  const w=S.walker;
  if(w){ const dz=(w.z-S.cz)*S.dir;
    if(w.stare&&dz>0&&dz<5.5&&S.dir>0){ w.stareT+=dt; if(w.stareT>1.4) w.z=Math.max(S.cz+2.6,w.z-1.1*dt); }
    else { w.z-=1.2*dt; w.ph+=dt*7; } }
  if(isA('paper')){ if(!S.paper&&S.cz>3.5&&S.dir>0) S.paper={z:L-2,t:0,z0:L-2}; if(S.paper){ S.paper.t+=dt; S.paper.z=Math.max(S.cz+1.2,S.paper.z-2.2*dt); } }
  if(isA('flicker')){ S.flick=((S.lt%2.3)<.35)?1:0; } else S.flick=0;
  // the end of the corridor
  if(S.dir>0&&S.cz>=L-1.1){ startTrans('fwd'); }
  else if(S.dir<0&&S.cz<=.5){ startTrans('back'); }
  S.cz=clamp(S.cz,.3,L-.9);
}
function startTrans(k){ S.trans=.9; S.transKind=k; S.v=0; sfx('step'); }
function finishLoop(k){
  if(S.left===0&&k==='fwd') return clear();
  const right=(k==='fwd')===(S.anom==null);
  if(S.anom&&k==='back'){ S.seen.add(S.anom); S.found++; }
  if(right){ S.left--; sfx('ok'); if(S.left===0) say('……あった！ この先が便所の入口だ！'); else say(''); }
  else { S.left=8; S.mist++; S.pain+=12; sfx('bad'); S.shake=4; say(S.anom?'……異変を見のがした。お腹がキュッとなる':'……異変なんてなかった。お腹がキュッとなる'); }
  newLoop(false);
  if(S.pain>=100){ S.pain=100; gameOver(); }
}
function turnBack(){ if(S.scene!=='play'||S.trans>0||S.turnT>0) return; S.dir*=-1; S.turnT=.45; S.v=0; sfx('turn'); }
function clear(){
  S.scene='result'; S.resT=0; S.trans=0; sfx('clear');
  const tm=Math.round(S.t), nb=!S.best.time||tm<S.best.time; if(!S.auto){ if(nb) S.best.time=tm; S.best.clears++; } saveBest();
  $('resIcon').textContent='🚽✨'; $('resTitle').textContent='まにあった……！';
  $('resText').textContent=`便所の入口に たどりついた。\nかかった時間 ${tm}秒${nb&&!S.auto?'（ベスト！）':''}　見のがし・かんちがい ${S.mist}回\nお腹のげんかい ${Math.round(S.pain)}%\n見つけた異変の種類 ${S.seen.size} / ${ANOMS.length}`;
  $('resultOv').hidden=false;
}
function gameOver(){
  S.scene='result'; S.resT=0; sfx('over'); saveBest();
  $('resIcon').textContent='💧🩲'; $('resTitle').textContent='……もれた。';
  $('resText').textContent=`トイレまで あと ${S.left}　のところで、げんかいが来た。\n見のがし・かんちがい ${S.mist}回\n異変に気づいたら、すぐ引き返そう。\n見つけた異変の種類 ${S.seen.size} / ${ANOMS.length}`;
  $('resultOv').hidden=false;
}

/* ================= auto: walk, look carefully, turn back the moment something is off ================= */
function autoTick(){
  S.autoGo=true; const a=S.ai;
  if(S.dir<0) return;               // already heading back: just walk
  if(S.anom&&!a.miss&&AMAP[S.anom].d(S)&&a.notice<0){ a.notice=S.lt+.45+rnd()*.35; say('……ん？'); }
  if(!S.anom&&a.fake>0&&S.cz>a.fake&&a.notice<0){ a.notice=S.lt+.5; say('……ん？（気のせい？）'); }
  if(a.notice>=0){ S.autoGo=false; if(S.lt>=a.notice&&S.v<.4){ turnBack(); a.notice=-1; } }
}

/* ================= drawing ================= */
let SX=0,SY=0;
function P(x,y,z){ const dz=Math.max(.05,(z-S.cz)*S.dir), X=x*S.dir; return {x:W/2+X*F/dz+SX,y:HY+(EYE+Math.sin(S.bob)*.03-y)*F/dz+SY,dz}; }
const nearZ=()=>S.cz+.22*S.dir;
function cz2(z){ return S.dir>0?Math.max(z,nearZ()):Math.min(z,nearZ()); }
function poly(pts,fill){ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.closePath(); g.fillStyle=fill; g.fill(); }
const visible=(z0,z1)=>Math.max((z0-S.cz)*S.dir,(z1-S.cz)*S.dir)>.25;
function fog(dz){ return clamp((dz-3)/22,0,.55); }
// a rectangle on a side wall, plus an affine frame to draw its contents in (-50..50 units)
function sideRect(x,z0,z1,y0,y1,fill,content){
  if(!visible(z0,z1)) return; const a=cz2(z0), b=cz2(z1);
  poly([P(x,y0,a),P(x,y1,a),P(x,y1,b),P(x,y0,b)],fill);
  const zc=(z0+z1)/2, dzc=(zc-S.cz)*S.dir; if(!content||Math.min((z0-S.cz)*S.dir,(z1-S.cz)*S.dir)<.35) return;
  const ym=(y0+y1)/2, near=(z0-S.cz)*S.dir<(z1-S.cz)*S.dir?z0:z1, far=near===z0?z1:z0;
  const pn=P(x,ym,near), pf=P(x,ym,far), c=P(x,ym,zc), X=x*S.dir;
  const ex=X<0?{x:pf.x-pn.x,y:pf.y-pn.y}:{x:pn.x-pf.x,y:pn.y-pf.y}, h=P(x,y0,zc).y-P(x,y1,zc).y;
  g.save(); g.setTransform(ex.x/100,ex.y/100,0,h/100,c.x,c.y); content(); g.restore();
  shade(pn,pf,x,z0,z1,y0,y1,dzc);
}
function shade(pn,pf,x,z0,z1,y0,y1,dz){ const f=fog(dz); if(f<=0) return; const a=cz2(z0), b=cz2(z1); g.globalAlpha=f; poly([P(x,y0,a),P(x,y1,a),P(x,y1,b),P(x,y0,b)],'#1A1A18'); g.globalAlpha=1; }
function frontRect(x0,x1,y0,y1,z,fill,content){ const dz=(z-S.cz)*S.dir; if(dz<.3) return; const a=P(x0,y1,z), b=P(x1,y0,z);
  const l=Math.min(a.x,b.x), w=Math.abs(b.x-a.x), t=a.y, h=b.y-a.y; g.fillStyle=fill; g.fillRect(l,t,w,h);
  if(content){ g.save(); g.translate(l+w/2,t+h/2); g.scale(h/100,h/100); content(w,h); g.restore(); } }
function txt(s,x,y,size,col,font){ g.fillStyle=col; g.font=`800 ${size}px ${font||'"M PLUS Rounded 1c",sans-serif'}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(s,x,y); g.textBaseline='alphabetic'; }

function drawCorridor(){
  const zEnd=S.dir>0?L:0, red=isA('redLights'), pink=isA('pinkWall');
  const wall=pink?'#E8B8C4':'#E2DED2', floor='#8E8C84', ceil='#CFCDC4';
  g.fillStyle='#111'; g.fillRect(0,0,W,H);
  const n=nearZ();
  // end wall with the turn
  const e0=P(-HW,CH,zEnd), e1=P(HW,0,zEnd); const ex0=Math.min(e0.x,e1.x), ew=Math.abs(e1.x-e0.x);
  g.fillStyle=pink?'#D8A8B4':'#D2CEC2'; g.fillRect(ex0,e0.y,ew,e1.y-e0.y);
  const goal=S.left===0&&S.dir>0;
  if(goal){ // the toilet entrance
    g.fillStyle='#2A5A9A'; g.fillRect(ex0,e0.y,ew,e1.y-e0.y);
    const d0=P(-.55,2.1,zEnd), d1=P(.55,0,zEnd); g.fillStyle='#F4EEDC'; g.fillRect(Math.min(d0.x,d1.x),d0.y,Math.abs(d1.x-d0.x),d1.y-d0.y);
    const nw=Math.abs(d1.x-d0.x); g.fillStyle='#3A6AAA'; g.fillRect(Math.min(d0.x,d1.x),d0.y,nw,(d1.y-d0.y)*.42);
    txt('便所',(d0.x+d1.x)/2,d0.y+(d1.y-d0.y)*.2,Math.max(8,nw*.32),'#fff','"Dela Gothic One",sans-serif');
    txt('🚹🚺',(d0.x+d1.x)/2,d0.y-(d1.y-d0.y)*.14,Math.max(7,nw*.25),'#fff');
  } else {
    const o0=P(.25*S.dir,2.2,zEnd), o1=P(HW*S.dir,0,zEnd); g.fillStyle='#6A6860'; g.fillRect(Math.min(o0.x,o1.x),o0.y,Math.abs(o1.x-o0.x),o1.y-o0.y);
    const ow=Math.abs(o1.x-o0.x); txt(S.dir>0?'🚻 →':'→',(o0.x+o1.x)/2,o0.y-ow*.18,Math.max(7,ow*.3),'#F2C230');
  }
  g.globalAlpha=fog(Math.abs(zEnd-S.cz)); g.fillStyle='#1A1A18'; g.fillRect(ex0,e0.y,ew,e1.y-e0.y); g.globalAlpha=1;
  // floor, ceiling, walls
  poly([P(-HW,0,n),P(HW,0,n),P(HW,0,zEnd),P(-HW,0,zEnd)],floor);
  poly([P(-HW,CH,n),P(HW,CH,n),P(HW,CH,zEnd),P(-HW,CH,zEnd)],ceil);
  poly([P(-HW,0,n),P(-HW,CH,n),P(-HW,CH,zEnd),P(-HW,0,zEnd)],wall);

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };

  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();

    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
</body>
</html>
