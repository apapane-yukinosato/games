<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="マサが主人公の2ライン格闘ゲーム。ライン移動、ライン飛ばし、体力が赤く光ったら超必殺技！">
<title>マサ伝説</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#0E0B12;--ink:#F4ECDD;--mute:#9C8FA8;--line:#3A2F44;--red:#E0433D;--gold:#F2B233}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"DotGothic16","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:6px 10px 14px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;letter-spacing:.2em;color:var(--gold)}
.mini{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:#1C1624;cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:#FF8A80}
#cv{display:block;width:100%;aspect-ratio:320/224;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:2px solid var(--line);border-radius:4px;touch-action:none}
#pad{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
#stick{position:relative;width:132px;height:132px;flex:none;border-radius:50%;background:#1C1624;border:2px solid var(--line);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#3A2F44;border:2px solid #6A5A7A;pointer-events:none}
#stick b{position:absolute;font-size:11px;color:var(--mute);font-weight:400}
#btns{display:grid;grid-template-columns:repeat(4,50px);grid-template-rows:repeat(2,50px);gap:7px}
#btns button{border-radius:50%;border:2px solid #0006;font-size:12px;line-height:1.1;cursor:pointer;touch-action:none;padding:0;box-shadow:0 3px 0 #0008}
#btns button.on{transform:translateY(2px);filter:brightness(1.3)}
.bA{background:#C8302A}.bB{background:#8A1E1E}.bC{background:#2A64C8}.bD{background:#1E3F8A}
.bS{background:#C8962A}.bL{background:#3E7E4A}.bX{background:#6A3A8A}.bU{background:#444}
.bU.ready{background:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 14px #FF5A4A}}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:8px;line-height:1.6}
@media (pointer:coarse){.keys{display:none}}
</style>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>マサ伝説</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <canvas id="cv" width="320" height="224" aria-label="格闘ゲームの画面"></canvas>
  <div id="pad">
    <div id="stick" aria-label="移動スティック"><i></i><b style="left:58px;top:4px">ジャンプ</b><b style="left:52px;bottom:4px">しゃがむ</b></div>
    <div id="btns">
      <button class="bA" data-b="lp">弱<br>P</button><button class="bB" data-b="hp">強<br>P</button><button class="bS" data-b="sp">必殺</button><button class="bL" data-b="line">ライン</button>
      <button class="bC" data-b="lk">弱<br>K</button><button class="bD" data-b="hk">強<br>K</button><button class="bX" data-b="blow">とば<br>し</button><button class="bU" data-b="sup" id="supBtn">超<br>必殺</button>
    </div>
  </div>
  <p class="keys">PC：←→ 移動　↑ ジャンプ　↓ しゃがむ　Z 弱P　X 強P　C 弱K　V 強K　A ライン移動　S 必殺　D ライン飛ばし　F 超必殺<br>
  必殺：S のみ／↓↘→＋P＝飛び道具　S＋↓／→↓↘＋P＝対空　S＋←／↓↙←＋P＝突進　／ O オート　M 音</p>
</div>

/* ================= moves ================= */
// frames: s = startup, a = active, r = recovery / box: x forward, y up (negative), w, h / hs = hitstun
const NORMAL={
  lp:{s:4,a:3,r:7,dmg:4,box:[10,-50,22,10],hs:13,bs:9,push:2,pose:'jab'},
  hp:{s:7,a:4,r:15,dmg:10,box:[12,-52,28,12],hs:19,bs:13,push:3.5,pose:'straight',step:1.2},
  lk:{s:5,a:3,r:9,dmg:5,box:[10,-30,26,12],hs:13,bs:9,push:2,pose:'kickL'},
  hk:{s:9,a:4,r:17,dmg:11,box:[10,-58,32,16],hs:19,bs:13,push:3.5,pose:'kickH'},
  clp:{s:4,a:3,r:7,dmg:4,box:[10,-34,22,10],hs:12,bs:8,push:2,pose:'cjab',crouch:1},
  chp:{s:6,a:5,r:15,dmg:9,box:[6,-66,24,34],hs:18,bs:12,push:2,pose:'cupper',crouch:1,aa:1},
  clk:{s:5,a:3,r:9,dmg:5,box:[10,-10,28,10],hs:12,bs:9,push:2,pose:'clk',crouch:1,low:1},
  chk:{s:8,a:4,r:20,dmg:9,box:[8,-10,38,10],hs:16,bs:11,push:2,pose:'sweep',crouch:1,low:1,kd:1},
  jp:{s:4,a:10,r:0,dmg:8,box:[4,-40,24,20],hs:16,bs:10,push:2,pose:'jpunch',air:1,over:1},
  jk:{s:5,a:10,r:0,dmg:9,box:[6,-30,28,16],hs:16,bs:10,push:2,pose:'jkick',air:1,over:1},
  blow:{s:12,a:4,r:22,dmg:12,box:[10,-56,34,24],hs:20,bs:14,push:4,pose:'blow',kd:1,lineBlow:1,step:1.5},
  latk:{s:1,a:6,r:14,dmg:9,box:[6,-60,32,40],hs:18,bs:12,push:3,pose:'blow',over:1},
};
function specialMove(sp,f){
  const d=sp.dmg*f.def.power;
  switch(sp.k){
    case 'proj': return {s:sp.slow?16:13,a:1,r:24,dmg:d,pose:'wave',proj:{spd:sp.slow?2.3:3.4,col:sp.col,ground:sp.ground,dmg:d},sp};
    case 'bigproj': return {s:16,a:1,r:30,dmg:d,pose:'wave',proj:{spd:3,col:sp.col,big:1,dmg:d,hits:3},sp,inv:16,superM:1};
    case 'breath': return {s:10,a:14,r:18,dmg:d,box:[10,-60,48,30],hs:18,bs:12,push:2,pose:'breath',sp,fire:sp.col,every:7};
    case 'rise': return {s:3,a:14,r:18,dmg:d,box:[4,-80,28,76],hs:24,bs:14,push:2,pose:'rise',kd:1,inv:8,rise:1,sp,aa:1};
    case 'rush': return {s:8,a:16,r:18,dmg:d,box:[8,-56,26,40],hs:22,bs:14,push:4,pose:'rush',kd:1,dash:5.2,sp};
    case 'spin': return {s:6,a:26,r:14,dmg:d,box:[-2,-50,40,44],hs:16,bs:10,push:1.5,pose:'spin',dash:2.6,every:8,sp,lastKd:1};
    case 'grab': return {s:5,a:3,r:24,dmg:d,pose:'grab',grab:1,range:40,sp};
    case 'grabs': return {s:4,a:4,r:26,dmg:d,pose:'grab',grab:1,range:48,sp,inv:6,superM:1};
    case 'counter': return {s:2,a:14,r:20,dmg:d,pose:'counter',counter:1,sp};
    case 'rushs': return {s:10,a:26,r:22,dmg:d/4,box:[6,-60,30,50],hs:14,bs:8,push:1.5,pose:'rush',dash:5.6,every:6,sp,inv:10,lastKd:1,superM:1};
    case 'geyser': return {s:12,a:24,r:24,dmg:d/3,pose:'geyser',geyser:1,sp,inv:14,superM:1};
  }
}

/* ================= fighter ================= */
function mkFighter(id,side){
  const def=CH[id];
  return {id,def,side,x:side?220:100,y:0,vx:0,vy:0,line:0,facing:side?-1:1,hp:100,state:'idle',t:0,mv:null,mt:0,hitList:0,hs:0,inv:0,
    lineFrom:0,lineTo:0,lt:0,latk:false,walkT:0,air:false,airUsed:false,land:0,wins:0,ko:false,shin:0,flash:0,combo:0,thrower:null,lastHit:0,fireT:0};
}
const hurt=f=>{ const s=f.def.size*BODY, cr=f.state==='crouch'||(f.mv&&f.mv.crouch)||(f.state==='block'&&f.blockLow); return {x:f.x-10*s,y:-(cr?40:62)*s-f.y,w:20*s,h:(cr?40:62)*s}; };
const canAct=f=>f.state==='idle'||f.state==='walk'||f.state==='crouch';

/* ================= game state ================= */
const G={scene:'title',t:0,stage:0,order:[],pick:0,p:null,e:null,round:1,timer:60,projs:[],fx:[],hitstop:0,shake:0,msg:'',msgT:0,endT:0,cont:0,firstPicked:false,
  best:(()=>{ try{ return JSON.parse(localStorage.getItem('masaBest')||'null')||{stage:0,clears:0}; }catch(e){ return {stage:0,clears:0}; } })(),
  stats:{wins:0,loses:0,clears:0,rounds:0},dlog:{}};
let auto=false, manualClock=false;
function saveBest(){ try{ localStorage.setItem('masaBest',JSON.stringify(G.best)); }catch(e){} }

function startGame(){
  G.scene='select'; G.t=0; G.pick=0; G.stage=0; G.order=[]; G.cont=0; sfx('start');
}
function chooseFirst(i){
  // like the original: pick the first of four, then the rest in order
  const first=ORDER.slice(0,4), rest=first.filter((_,k)=>k!==i);
  G.order=[first[i],...rest,...ORDER.slice(4)]; G.stage=0; toVs();
}
function toVs(){ G.scene='vs'; G.t=0; G.p=mkFighter('masa',0); G.e=mkFighter(G.order[G.stage],1); G.p.wins=0; G.e.wins=0; G.round=1; sfx('vs'); }
function startRound(){
  const p=G.p, e=G.e; const pw=p.wins, ew=e.wins;
  Object.assign(p,mkFighter('masa',0),{wins:pw}); Object.assign(e,mkFighter(G.order[G.stage],1),{wins:ew});
  G.scene='fight'; G.phase='intro'; G.t=0; G.t0=0; G.timer=60; G.projs=[]; G.fx=[]; G.hitstop=0; G.endT=0; ai.p=newAI(); ai.e=newAI();
  G.msg=`ROUND ${G.round}`; G.msgT=0; sfx('round');
}
const skillOf=f=>f.side===0?.95:clamp(.3+G.stage*.06+(G.cont?-.04:0),.28,.8);

/* ================= input ================= */
const keys={}, pad={dx:0,dy:0}, held={}, pressQ=[];
let dirHist=[];      // for motion commands: [numpad dir, frame]
function readHuman(f){
  const L=keys.arrowleft||pad.dx<-.4, R=keys.arrowright||pad.dx>.4, U=keys.arrowup||pad.dy<-.5, D=keys.arrowdown||pad.dy>.5;
  const inp={l:L,r:R,u:U,d:D,p:{}};
  while(pressQ.length){ const b=pressQ.shift(); inp.p[b]=true; }
  if(inp.p.hp&&inp.p.hk) inp.p.blow=true;
  // motion commands (relative to facing)
  const fw=f.facing>0?R:L, bk=f.facing>0?L:R, nd=D?(fw?3:bk?1:2):U?(fw?9:bk?7:8):(fw?6:bk?4:5);
  if(!dirHist.length||dirHist[dirHist.length-1][0]!==nd) dirHist.push([nd,G.t]); if(dirHist.length>12) dirHist.shift();
  if(inp.p.lp||inp.p.hp){ const seq=dirHist.filter(d=>G.t-d[1]<22).map(d=>d[0]).join('');
    if(/2.?3.?6$/.test(seq)||/236/.test(seq.slice(-4))) inp.motion='f';
    else if(/6.?2.?3/.test(seq.slice(-5))) inp.motion='d';
    else if(/2.?1.?4/.test(seq.slice(-4))) inp.motion='b'; }
  return inp;
}

/* ================= AI ================= */
const ai={p:null,e:null};
function newAI(){ return {t:0,hold:{},act:null,react:0,lineWait:0,cool:0}; }
function aiInput(f,o,A){
  const sk=skillOf(f), inp={l:false,r:false,u:false,d:false,p:{}}, fwd=f.facing>0?'r':'l', back=f.facing>0?'l':'r';
  const dist=Math.abs(o.x-f.x), sameLine=f.line===o.line&&o.state!=='line';
  if(A.cool>0) A.cool--;
  // hold current plan
  if(A.t>0){ A.t--; Object.assign(inp,A.hold); if(A.hold.blockWhile){ inp[back]=true; } return inp; }
  A.hold={};
  if(!canAct(f)&&f.state!=='jump') return inp;
  const sup=f.hp<=25, sp=f.def.sp;
  // different lines: follow
  if(!sameLine&&o.state!=='line'&&f.state!=='line'){ if(++A.lineWait>(18-sk*12)){ A.lineWait=0; inp.p.line=true; } return inp; }
  A.lineWait=0;
  // threats: projectile coming
  const pr=G.projs.find(q=>q.owner!==f&&q.line===f.line&&Math.sign(f.x-q.x)===Math.sign(q.vx)&&Math.abs(f.x-q.x)<110);
  if(pr&&rnd()<sk){ const c=rnd(); if(c<.35){ inp.p.line=true; } else if(c<.65&&!pr.big){ inp.u=true; inp[fwd]=dist>60; A.t=4; A.hold={u:true}; } else { A.hold={[back]:true,d:false}; A.t=14; inp[back]=true; } return inp; }
  // opponent attacking close: block (or counter)
  if(o.state==='move'&&o.mt<(o.mv.s||0)+2&&dist<70&&rnd()<sk*.9){
    if(sp.d&&sp.d.k==='counter'&&!o.mv.proj&&!o.mv.low&&rnd()<.3){ inp.p.sp=true; inp.d=true; return inp; }
    const low=o.mv.low; A.hold={[back]:true,d:!!low}; A.t=10; inp[back]=true; inp.d=!!low; return inp; }
  // anti-air
  if((o.state==='jump'||o.latk)&&dist<80&&Math.abs(o.x-f.x)>6&&rnd()<sk){ if(sp.d&&sp.d.k==='rise'&&rnd()<.7){ inp.p.sp=true; inp.d=true; } else { inp.d=true; inp.p.hp=true; } A.cool=10; return inp; }
  if(A.cool>0){ return inp; }
  // super when available and in range
  if(sup&&rnd()<.05+sk*.2){ const k=sp.u.k; const ok=k==='geyser'?dist<90:k==='grabs'?dist<46:k==='bigproj'?true:dist<120; if(ok){ inp.p.sup=true; A.cool=30; return inp; } }
  const r=rnd();
  if(dist>140){ // far
    const proj=['proj'].includes(sp.f.k)?'f':null;
    if(proj&&r<.25+sk*.25&&!G.projs.some(q=>q.owner===f)){ inp.p.sp=true; A.cool=26; }
    else if(r<.85){ A.hold={[fwd]:true}; A.t=10+(rnd()*10|0); inp[fwd]=true; }
    else { inp.u=true; inp[fwd]=true; }
    return inp; }
  if(dist>55){ // mid
    if(r<.14){ inp.u=true; inp[fwd]=true; A.plannedAir=true; }
    else if(r<.24&&sp.b.k==='rush'){ inp.p.sp=true; inp[back]=true; A.cool=20; }
    else if(r<.34&&(sp.f.k==='proj'||sp.f.k==='spin'||sp.f.k==='rush')&&!G.projs.some(q=>q.owner===f)){ inp.p.sp=true; A.cool=20; }
    else if(r<.42){ inp.d=true; inp.p.hk=true; }
    else if(r<.5){ inp.p.line=true; }
    else { A.hold={[fwd]:true}; A.t=8+(rnd()*8|0); inp[fwd]=true; }
    return inp; }
  // close (against a counter user, keep it low)
  if(o.def.sp.d.k==='counter'&&rnd()<.55){ inp.d=true; if(rnd()<.5) inp.p.lk=true; else inp.p.hk=true; A.cool=Math.round(12-sk*7); return inp; }
  if(r<.16){ inp.p.lp=true; } else if(r<.28){ inp.p.lk=true; inp.d=rnd()<.5; }
  else if(r<.4){ inp.p.hp=true; } else if(r<.5){ inp.p.hk=true; }
  else if(r<.58){ inp.d=true; inp.p.hk=true; }
  else if(r<.64){ inp.p.blow=true; }
  else if(r<.7&&(sp.f.k==='grab')){ inp.p.sp=true; }
  else if(r<.76&&sp.b.k==='rush'){ inp.p.sp=true; inp[back]=true; }
  else if(r<.86){ A.hold={[back]:true}; A.t=12; inp[back]=true; }
  else { A.hold={[fwd]:true}; A.t=6; inp[fwd]=true; }
  A.cool=Math.round(10-sk*7);
  return inp;
}

/* ================= simulation ================= */
function startMove(f,mv,name){ f.state='move'; f.mv=mv; f.mt=0; f.mvName=name; f.hitList=0; f.hits=0; f.lastBucket=-1; if(mv.inv) f.inv=mv.inv; if(mv.superM){ G.fx.push({k:'superflash',t:0,f}); G.hitstop=18; sfx('super'); }
  if(mv.rise){ f.vy=-6.5; f.air=true; } if(mv.sp) sfx('special'); else sfx('swing'); }
function special(f,slot){ const sp=f.def.sp[slot]; if(!sp) return false; if(sp.k==='proj'&&G.projs.some(q=>q.owner===f&&!q.big)) return false; startMove(f,specialMove(sp,f),slot); return true; }
function control(f,o,inp){
  const fwdKey=f.facing>0?'r':'l', backKey=f.facing>0?'l':'r';
  const fw=inp[fwdKey], bk=inp[backKey];
  f.holdBack=bk&&!fw; f.holdDown=inp.d;
  if(f.state==='jump'){ if(!f.airUsed&&(inp.p.lp||inp.p.hp)){ f.airUsed=true; f.airMv=NORMAL.jp; f.amt=0; f.ahit=0; sfx('swing'); } else if(!f.airUsed&&(inp.p.lk||inp.p.hk)){ f.airUsed=true; f.airMv=NORMAL.jk; f.amt=0; f.ahit=0; sfx('swing'); } return; }
  if(f.state==='line'){ if((inp.p.lp||inp.p.hp||inp.p.lk||inp.p.hk)&&f.lineFrom===1) f.latk=true; return; }
  if(!canAct(f)) return;
  const p=inp.p, sup=f.hp<=25;
  if((p.sup||(p.sp&&inp.u))&&sup){ startMove(f,specialMove(f.def.sp.u,f),'u'); return; }
  if(p.sp){ const slot=inp.d?'d':bk?'b':'f'; if(special(f,slot)) return; }
  if(inp.motion&&special(f,inp.motion)) return;
  if(p.blow){ startMove(f,NORMAL.blow,'blow'); return; }
  if(p.line){ f.state='line'; f.lineFrom=f.line; f.lineTo=1-f.line; f.lt=0; f.latk=false; f.inv=30; sfx('line'); return; }
  // throw: close + strong punch
  if(p.hp&&Math.abs(o.x-f.x)<30&&o.line===f.line&&canAct(o)&&o.y===0&&o.inv<=0){ doThrow(f,o,12*f.def.power,'投げ'); return; }
  const cr=inp.d;
  for(const b of ['lp','hp','lk','hk']) if(p[b]){ const key=cr?'c'+b:b; startMove(f,NORMAL[key],key); return; }
  if(inp.u){ f.state='jump'; f.vy=-7.2; f.vx=(fw?1.9:bk?-1.9:0)*f.facing*f.def.speed; f.air=true; f.airUsed=false; f.airMv=null; sfx('jump'); return; }
  if(cr){ f.state='crouch'; return; }
  if(fw||bk){ f.state='walk'; f.x+=(fw?1.6:-1.3)*f.facing*f.def.speed; f.walkT++; } else f.state='idle';
}
function doThrow(f,o,dmg,name){
  f.state='move'; f.mv={s:0,a:0,r:28,pose:'throw'}; f.mt=0; f.mvName='throw';
  o.state='thrown'; o.t=0; o.thrower=f; o.throwDmg=dmg; o.inv=60; sfx('grab');
  if(name) G.fx.push({k:'txt',x:f.x,y:FY[f.line]-80,t:0,txt:name});
}
function stepFighter(f,o){
  if(f.inv>0) f.inv--;
  if(f.flash>0) f.flash--;
  const mv=f.mv;
  switch(f.state){
    case 'walk': case 'idle': case 'crouch': if(f.x!==o.x&&o.state!=='thrown') f.facing=o.x>f.x?1:-1; break;
    case 'jump': {
      f.x+=f.vx; f.vy+=.42; f.y-=f.vy; if(f.airMv){ f.amt++; }
      if(f.y<=0&&f.vy>0){ f.y=0; f.state='idle'; f.air=false; f.airMv=null; f.vx=0; sfx('land'); }
      break; }
    case 'line': {
      f.lt++; const L=24;
      if(f.lt>=L){ f.line=f.lineTo; f.state='idle'; f.y=0; if(f.latk&&f.line===0){ f.latk=false; startMove(f,NORMAL.latk,'latk'); f.inv=4; } }
      else f.y=Math.sin(f.lt/L*Math.PI)*26;
      break; }
    case 'move': {
      f.mt++;
      if(mv.step&&f.mt<mv.s) f.x+=mv.step*f.facing*.6;
      if(mv.dash&&f.mt>=mv.s&&f.mt<mv.s+mv.a) f.x+=mv.dash*f.facing;
      if(mv.rise){ if(f.mt<mv.s+mv.a){ f.x+=1.2*f.facing; } f.vy+=.34; f.y=Math.max(0,f.y-f.vy); }
      if(mv.proj&&f.mt===mv.s){ fireProj(f,mv); }
      if(mv.geyser&&f.mt>=mv.s&&f.mt<mv.s+mv.a&&(f.mt-mv.s)%8===0){ const k=(f.mt-mv.s)/8; G.fx.push({k:'geyser',x:f.x+f.facing*(28+k*26),line:f.line,t:0,last:k>=2}); sfx('boom'); G.shake=6; }
      if(mv.fire&&f.mt>=mv.s&&f.mt<mv.s+mv.a&&f.mt%3===0) G.fx.push({k:'fire',x:f.x+f.facing*(20+rnd()*30),y:FY[f.line]-50*f.def.size*BODY,line:f.line,t:0,col:mv.fire});
      if(mv.grab&&f.mt===mv.s){ if(Math.abs(o.x-f.x)<mv.range&&o.line===f.line&&(canAct(o)||o.state==='block')&&o.y===0&&o.inv<=0){ doThrow(f,o,mv.dmg,mv.sp.n); return; } }
      if(f.mt>=mv.s+mv.a+mv.r){ f.state=mv.crouch?'crouch':'idle'; f.mv=null; if(f.y>0){ f.state='jump'; f.vx=0; f.air=true; f.airUsed=true; f.airMv=null; f.vy=Math.max(0,f.vy); } }
      break; }
    case 'hit': case 'block': {
      f.hs--; f.x+=f.vx; f.vx*=.82;
      if(f.y>0){ f.vy+=.4; f.y=Math.max(0,f.y-f.vy); }
      if(f.hs<=0&&f.y<=0){ f.state=f.blockLow?'crouch':'idle'; f.blockLow=false; }
      break; }
    case 'down': {
      f.t++; f.x+=f.vx; f.vx*=.9;
      if(f.y>0||f.vy<0){ f.vy+=.4; f.y=Math.max(0,f.y-f.vy); }
      if(f.lineShift&&f.t<24){ f.lineProg=f.t/24; if(f.t===23){ f.line=f.lineShift.to; f.lineShift=null; f.lineProg=0; } }
      if(f.hp<=0){ f.ko=true; break; }
      if(f.t>44){ f.state='getup'; f.t=0; f.inv=16; }
      break; }
    case 'getup': f.t++; if(f.t>14){ f.state='idle'; } break;
    case 'thrown': {
      f.t++; const th=f.thrower;
      if(f.t<18){ f.x=th.x+th.facing*18; f.y=Math.sin(f.t/18*Math.PI)*34; }
      else { f.x=th.x-th.facing*26; f.y=0; applyHit(th,f,{dmg:f.throwDmg,kd:1,push:3,hs:20,unblock:1},true); f.vx=-th.facing*2.5; G.shake=8; sfx('boom'); }
      break; }
    case 'win': f.t++; break;
  }
  f.x=clamp(f.x,18,W-18);
}
function fireProj(f,mv){
  const P=mv.proj, y=P.ground?0:48*f.def.size*BODY;
  G.projs.push({owner:f,x:f.x+f.facing*20,y,vx:P.spd*f.facing,line:f.line,dmg:P.dmg,col:P.col,ground:P.ground,big:P.big,hits:P.hits||1,t:0,hitT:0});
}
function hitboxOf(f){
  let mv=f.state==='move'?f.mv:f.state==='jump'?f.airMv:null; if(!mv||!mv.box) return null;
  const t=f.state==='move'?f.mt:f.amt; if(t<mv.s||t>=mv.s+mv.a) return null;
  const sz=f.def.size*BODY, reach=(f.def.reach&&!mv.sp)?f.def.reach:1, [bx,by,bw,bh]=mv.box, w=bw*sz*reach;
  const x=f.facing>0?f.x+bx*sz:f.x-bx*sz-w;

}

function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='square',v=.06,f2=0,delay=0){ if(muted||manualClock||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v=.12,f=1200){ if(muted||manualClock||!AC) return; const n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(), fl=AC.createBiquadFilter(), gn=AC.createGain(); s.buffer=b; fl.type='bandpass'; fl.frequency.value=f; gn.gain.value=v; s.connect(fl).connect(gn).connect(AC.destination); s.start(); }
function sfx(k){
  switch(k){
    case 'swing': noise(.08,.06,2400); break;
    case 'hit': noise(.1,.16,900); tone(180,.08,'square',.05,90); break;
    case 'hitH': noise(.18,.22,600); tone(120,.15,'sawtooth',.07,50); break;
    case 'block': tone(1400,.05,'square',.04); noise(.05,.06,3000); break;
    case 'special': tone(300,.18,'sawtooth',.06,900); break;
    case 'super': [262,330,392,523,659].forEach((f,i)=>tone(f,.12,'square',.06,0,i*.05)); break;
    case 'boom': noise(.3,.2,300); tone(80,.3,'sine',.2,40); break;
    case 'grab': tone(200,.1,'square',.06,120); break;
    case 'jump': tone(420,.08,'triangle',.04,700); break;
    case 'land': noise(.05,.05,400); break;
    case 'line': tone(500,.12,'triangle',.05,250); break;
    case 'round': tone(523,.2,'square',.06); tone(784,.25,'square',.06,0,.18); break;
    case 'fight': [392,523,784].forEach((f,i)=>tone(f,.15,'square',.07,0,i*.08)); break;
    case 'ko': noise(.6,.2,400); tone(220,.6,'sawtooth',.08,55); break;
    case 'win': [523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.18,'square',.06,0,i*.12)); break;
    case 'lose': [392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.07,0,i*.22)); break;
    case 'start': case 'vs': noise(.4,.2,300); tone(110,.5,'sawtooth',.1,55); break;
  }
}

/* ================= input wiring ================= */
function setAuto(v){ auto=!!v; $('autoBtn').setAttribute('aria-pressed',auto); if(auto&&G.scene==='title') startGame(); }
function user(){ if(auto) setAuto(false); }
function button(b){
  ac();
  if(G.scene==='title'||G.scene==='continue'||G.scene==='gameover'||G.scene==='ending'){ user(); pressStart(); return; }
  if(G.scene==='select'){ user(); if(b==='lp'||b==='hp'||b==='lk'||b==='hk'||b==='sp') chooseFirst(G.pick); return; }
  if(G.scene==='fight'){ if(auto) setAuto(false); pressQ.push(b); }
}
const KEYMAP={z:'lp',x:'hp',c:'lk',v:'hk',a:'line',s:'sp',d:'blow',f:'sup'};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='o'){ ac(); setAuto(!auto); return; }
  if(k==='m'){ ac(); setMute(!muted); return; }
  if(['arrowleft','arrowright','arrowup','arrowdown'].includes(k)){ e.preventDefault(); if(G.scene==='select'&&!e.repeat){ user(); if(k==='arrowleft') G.pick=(G.pick+3)%4; if(k==='arrowright') G.pick=(G.pick+1)%4; return; } if(G.scene==='fight'&&auto) setAuto(false); keys[k]=true; return; }
  if(e.repeat) return;
  if(k==='enter'||k===' '){ e.preventDefault(); if(G.scene!=='fight') button('lp'); return; }
  if(KEYMAP[k]){ e.preventDefault(); button(KEYMAP[k]); }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.querySelectorAll('#btns button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); b.classList.add('on'); button(b.dataset.b); });
  const up=()=>b.classList.remove('on'); b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
});
cv.addEventListener('pointerdown',e=>{ ac(); if(G.scene==='select'){ user(); const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W; const i=clamp(Math.floor((x-6)/80),0,3); if(i===G.pick) chooseFirst(i); else G.pick=i; return; } if(G.scene!=='fight') button('lp'); });
const stick=$('stick'), knob=stick.querySelector('i'); let sid=null;
function stickMove(e){ const r=stick.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const m=r.width/2-26, l=Math.hypot(dx,dy); if(l>m){ dx*=m/l; dy*=m/l; } knob.style.transform=`translate(${dx}px,${dy}px)`; pad.dx=dx/m; pad.dy=dy/m; }
stick.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); if(G.scene==='fight'&&auto) setAuto(false); if(G.scene==='select'){ user(); const r=stick.getBoundingClientRect(); G.pick=(G.pick+(e.clientX<r.left+r.width/2?3:1))%4; return; } sid=e.pointerId; try{ stick.setPointerCapture(sid); }catch(_){} stickMove(e); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===sid) stickMove(e); });
const stickEnd=e=>{ if(e.pointerId!==sid) return; sid=null; pad.dx=pad.dy=0; knob.style.transform=''; };
stick.addEventListener('pointerup',stickEnd); stick.addEventListener('pointercancel',stickEnd);
$('autoBtn').onclick=()=>{ ac(); setAuto(!auto); };
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };

/* ================= loop ================= */
let acc=0, last=performance.now();
function loop(now){ const dt=Math.min(.1,(now-last)/1000); last=now; if(!manualClock){ acc+=dt; while(acc>=1/60){ acc-=1/60; frame(); } }
  $('supBtn').classList.toggle('ready',G.scene==='fight'&&G.p&&G.p.hp<=25);
  draw(); requestAnimationFrame(loop); }
setMute(muted); requestAnimationFrame(loop);

window.__masa={
  get G(){ return G; }, setAuto, manual(v=true){ manualClock=v; }, step(n=1){ for(let i=0;i<n;i++) frame(); }, seed(v){ seed=(Math.abs(v|0)%2147483646)+1; },
  start:startGame, choose:chooseFirst, goStage(n){ G.order=ORDER.slice(); G.stage=n; G.cont=0; toVs(); }, press:button, CH, ORDER,
};

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
