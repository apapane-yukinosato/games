<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="無茶ぶり・手柄どろぼう・プリン事件……いろいろしてくるハリーを、最後に許す？許さない？">
<title>ハリーを許す？許さない？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#F4EFE6;--ink:#2E2A33;--card:#FFFDF8;--line:#E4DACB;--mute:#8A7F74;--red:#E0433D;--blue:#3F6FD8;--gold:#F2B233;color-scheme:light}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 12px 18px;box-sizing:border-box;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#hud{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:6px}
#hud .lab{white-space:nowrap}
#meter{flex:1;height:14px;border-radius:7px;background:#E9E1D4;overflow:hidden;border:1px solid var(--line)}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2B233,#E0433D);transition:width .5s}
#hud .num{width:44px;text-align:right;font-variant-numeric:tabular-nums}
#stage{position:relative}
#cv{display:block;width:100%;aspect-ratio:3/2;border-radius:16px;background:#DCE6F5}
#chap:empty{display:none}
#chap{position:absolute;left:10px;top:8px;background:rgba(46,42,51,.8);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
#box{position:relative;margin-top:8px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px 22px;min-height:96px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
#who{position:absolute;top:-13px;left:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:8px}
#who.h{background:var(--red)}#who.y{background:var(--blue)}
#txt{font-size:16px;line-height:1.7;font-weight:800;min-height:54px;white-space:pre-wrap}
#next{position:absolute;right:12px;bottom:4px;font-size:12px;color:var(--mute);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#choices{display:grid;gap:8px;margin-top:10px}
.ch{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:11px 12px;text-align:left;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.ch:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ch small{display:block;font-size:11px;color:var(--mute);font-weight:500}
#final{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fb{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:24px;min-height:74px;border:0;border-radius:16px;cursor:pointer;color:#fff}
.fb.yes{background:#7FA4E6;box-shadow:0 5px 0 #4C6FB0}
.fb.no{background:var(--red);box-shadow:0 5px 0 #9E2A25}
.fb:active{transform:translateY(3px)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(46,42,51,.55);z-index:10;padding:16px}
.card{background:var(--card);border-radius:18px;padding:18px 16px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{margin:0;font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:26px;line-height:1.3}
.card .sub{font-size:13px;color:var(--mute);line-height:1.6;margin:8px 0 12px}
.go{display:block;width:100%;min-height:50px;border:0;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px;background:var(--red);color:#fff;box-shadow:0 4px 0 #9E2A25}
.go.alt{background:#EDE4D6;color:var(--ink);box-shadow:0 4px 0 #CFC2AE}
.back{display:block;margin-top:12px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
#endOv .card.over{background:#1E1A22;color:#fff}
#endOv .card.over .sub{color:#B9AFC2}
.verdict{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:34px;margin:10px 0;line-height:1.3}
.over .verdict{color:#FF6B8A}
.clear .verdict{color:var(--red)}
.big{font-family:"Dela Gothic One",sans-serif;font-size:14px;letter-spacing:.3em}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;text-align:left;margin:6px 0}
.rows b{text-align:right}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:10px}
@media (pointer:coarse){.keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>ハリーを許す？許さない？</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="hud"><span class="lab">😤 イライラ度</span><div id="meter"><i id="meterFill"></i></div><span class="num" id="meterNum">0%</span></div>
  <div id="stage"><canvas id="cv" width="720" height="480" aria-label="ハリーとオフィスのようす"></canvas><span id="chap"></span></div>
  <div id="box" role="button" aria-label="つぎへ"><span id="who"></span><div id="txt"></div><span id="next">▼ タップでつぎへ</span></div>
  <div id="choices"></div>
  <div id="final" hidden><button class="fb yes" id="yesBtn">許す</button><button class="fb no" id="noBtn">許さない</button></div>
  <p class="keys">PC：スペース / Enter つぎへ　1〜3 えらぶ　O オート　M 音</p>
</div>

<div class="ov" id="titleOv">
  <div class="card">
    <div class="big">OFFICE DRAMA</div>
    <h2>ハリーを<br><span style="color:var(--red)">許す？許さない？</span></h2>
    <p class="sub">同じ部署のハリーは、自分の仕事を通すためなら<br>無茶も意地悪もおかまいなし。<br>いろいろされたあと、あなたは最後に決める。</p>
    <div class="rows" id="bestRows"></div>
    <button class="go" id="startBtn">▶ はじめる</button>
    <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
    <a class="back" href="../">← ゲーム一覧にもどる</a>
  </div>
</div>

<div class="ov" id="endOv" hidden>
  <div class="card" id="endCard">
    <div class="big" id="endBig"></div>
    <div class="verdict" id="verdict"></div>
    <p class="sub" id="endSub"></p>
    <div class="rows" id="endRows"></div>
    <button class="go" id="againBtn">もう一回</button>
    <a class="back" href="../">← ゲーム一覧にもどる</a>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);

// ---------- story ----------
// who: 'h' = ハリー, 'n' = ナレーション, 'y' = あなた / face: smug, wink, laugh, sly, shock, sad
const SCENES=[
  {chap:'第1話　定時5分前',prop:'📄',bg:'#DCE6F5',lines:[
    {who:'n',text:'金曜日、定時の5分前。帰りじたくを始めたそのとき……'},
    {who:'h',face:'smug',text:'あ、これ月曜の朝までにまとめといて。100枚あるけど、君なら余裕でしょ？'}],
   choices:[{t:'「……はい」',s:'つい引き受けてしまう',a:8,r:'さっすが〜！　じゃ、ボクは飲み会あるから！'},
            {t:'「えっ、今からですか？」',s:'いちおう抵抗する',a:10,r:'今からじゃないよ、月曜の朝まで。時間はたっぷりあるじゃん'},
            {t:'（心の中で「は？」）',s:'顔には出さない',a:12,r:'なに、その顔？　よろしくね〜'}]},
  {chap:'第2話　手柄どろぼう',prop:'🏆',bg:'#E8E0F2',lines:[
    {who:'n',text:'部長への企画発表。あなたが3日かけて考えた企画が、スクリーンに映った。'},
    {who:'h',face:'smug',text:'この企画、ボクが一晩で考えました！'},
    {who:'n',text:'部長「さすがハリー君！　きみは会社の宝だ！」'}],
   choices:[{t:'「それ、わたしの企画です」',s:'その場で言う',a:10,r:'え〜？　チームの企画ってことでいいじゃん。細かいなあ'},
            {t:'だまって拍手する',s:'大人の対応',a:14,r:'（拍手ありがと！　ボーナス上がったら、ジュースおごるね）'},
            {t:'資料の最後のページに自分の名前があるのを見つける',s:'証拠はある',a:12,r:'あっ、そこは消し忘れ。……いや、なんでもない'}]},
  {chap:'第3話　カレンダー侵略',prop:'📅',bg:'#DDF0E4',lines:[
    {who:'n',text:'予定表を開くと、明日が一日中うまっていた。「ハリーの資料づくり（担当：あなた）」'},
    {who:'h',face:'wink',text:'空いてたから入れといたよ。空いてる時間って、みんなのものだからね！'}],
   choices:[{t:'予定を消す',s:'すぐ消す',a:9,r:'あれ、消えてる？　また入れとくね〜'},
            {t:'「わたしにも予定があるんですが」',s:'話し合う',a:11,r:'でもボクの仕事のほうが大事でしょ？　会社的に'},
            {t:'ため息をつく',s:'はぁ……',a:13,r:'ため息つくと幸せにげるよ？　ボクは幸せだけど'}]},
  {chap:'第4話　三週間ほうち',prop:'⏳',bg:'#F4E7D0',lines:[
    {who:'n',text:'3週間前にたのんだ確認。まだ返事がない。'},
    {who:'y',text:'「ハリーさん、あの確認って……」'},
    {who:'h',face:'sly',text:'あー、あれ？　今いそがしいんだよね〜。こっちの資料、先にやってくれたら見るよ'}],
   choices:[{t:'「では、いつまでに見てもらえますか？」',s:'期限を決める',a:10,r:'うーん、ボクの気分しだい？'},
            {t:'上司にも共有しておく',s:'記録を残す',a:8,r:'え、なんで部長にも言うの？　こわ〜'},
            {t:'言われたとおり資料を先にやる',s:'しかたなく',a:14,r:'ありがと！　あ、確認の件は来月見るね'}]},
  {chap:'第5話　プリン事件',prop:'🍮',bg:'#FBE3E0',lines:[
    {who:'n',text:'お昼休み。楽しみにしていた、名前を書いたプリンが冷蔵庫にない。'},
    {who:'n',text:'ハリーの口の横に、カラメルがついている。'},
    {who:'h',face:'laugh',text:'名前書いてあったけど、字が小さくて読めなかった。おいしかったよ！'}],
   choices:[{t:'「弁償してください」',s:'はっきり言う',a:10,r:'え〜、プリン1個で？　心がせまいなあ'},
            {t:'だまって冷蔵庫をしめる',s:'ぐっとこらえる',a:15,r:'あ、明日のもあるなら言ってね。食べないように気をつける（たぶん）'},
            {t:'名前をもっと大きく書くことにする',s:'対策する',a:12,r:'大きく書いても、ボクお腹すいてたら食べちゃうかも'}]},
  {chap:'第6話　責任てんか',prop:'💥',bg:'#E9E4DD',lines:[
    {who:'n',text:'ハリーの資料に大きなミスが見つかった。部長がこわい顔でやってくる。'},
    {who:'n',text:'部長「このミス、だれの指示だ？」'},
    {who:'h',face:'sly',text:'あの人に言われたとおりにやっただけです！'}],
   choices:[{t:'「メールの記録を出します」',s:'証拠で反論',a:9,r:'……ちっ。あ、いや、なんでもないです'},
            {t:'頭が真っ白になる',s:'ぼうぜん',a:15,r:'ほらね部長、何も言えないでしょ？'},
            {t:'「ハリーさん、それは違います」',s:'冷静に否定',a:11,r:'え〜、ボクの記憶ではそうだったんだけどなあ'}]},
  {chap:'第7話　とどめの一言',prop:'📦',bg:'#DCE6F5',lines:[
    {who:'n',text:'夜8時。やっと仕事が終わりかけたところに、段ボール箱がドンと置かれた。'},
    {who:'h',face:'wink',text:'で、これもお願い。君ならできるよね？'}],
   choices:[{t:'「できません」',s:'きっぱり',a:8,r:'え、できない？　じゃあ、できるようになってね！'},
            {t:'箱をそっと押しかえす',s:'無言の抵抗',a:11,r:'押しかえしても、また押すよ？'},
            {t:'天井を見つめる',s:'もう限界',a:15,r:'天井に答えは書いてないよ〜。よろしくね'}]},
];
const FINAL=[
  {who:'n',text:'次の日の朝。ハリーがにこにこしながら近づいてきた。'},
  {who:'h',face:'smug',text:'いろいろあったけどさ、ボクたち、同じチームの仲間だよね？'},
  {who:'h',face:'wink',text:'許してくれるよね？'},
];

// ---------- state ----------
let S=null, auto=false, autoT=0, manualClock=false;
let best={clear:0,over:0};
try{ const v=JSON.parse(localStorage.getItem('harryBest')||'null'); if(v) best={clear:+v.clear||0,over:+v.over||0}; }catch(e){}
const saveBest=()=>{ try{ localStorage.setItem('harryBest',JSON.stringify(best)); }catch(e){} };

function newGame(){
  S={phase:'play',scene:0,queue:[],cur:null,shown:0,anger:0,face:'smug',who:'n',wait:null,picks:[],shake:0,endT:0,result:null};
  $('titleOv').hidden=true; $('endOv').hidden=true; $('final').hidden=true;
  loadScene(0); render();
}
function loadScene(i){
  S.scene=i; const sc=SCENES[i]; S.queue=sc.lines.slice(); S.wait=null; S.shake=.4; sfx('don'); nextLine();
}
function nextLine(){
  const L=S.queue.shift();
  if(!L){ // lines finished -> choices or final question
    if(S.phase==='play'&&S.scene<SCENES.length) showChoices();
    else if(S.phase==='final') showFinal();
    return;
  }
  S.cur=L; S.shown=0; S.who=L.who; if(L.face) S.face=L.face; S.after=L.after||null;
  $('choices').innerHTML=''; render();
}
function showChoices(){
  S.wait='choice';
  const sc=SCENES[S.scene];
  $('choices').innerHTML=sc.choices.map((c,k)=>`<button class="ch" data-k="${k}">${k+1}. ${c.t}<small>${c.s}</small></button>`).join('');
  render();
}
function choose(k){
  if(!S||S.wait!=='choice') return;
  const c=SCENES[S.scene].choices[k]; if(!c) return;
  S.picks.push(k); S.anger=Math.min(100,S.anger+c.a); S.wait=null; $('choices').innerHTML='';
  sfx('pick');
  S.queue=[{who:'h',face:S.face==='laugh'?'laugh':'smug',text:c.r,after:'nextScene'}]; nextLine();
}
function showFinal(){ S.wait='final'; $('final').hidden=false; render(); }
function decide(forgive){
  if(!S||S.wait!=='final') return;
  S.wait=null; $('final').hidden=true;
  if(forgive){ S.phase='over'; S.face='laugh'; if(!auto) best.over++; sfx('over'); }
  else { S.phase='clear'; S.face='shock'; if(!auto) best.clear++; sfx('clear'); }
  if(!auto) saveBest();
  S.cur={who:forgive?'n':'n',text:forgive?'あなたは、ハリーを許した。':'「許しません」　あなたは、きっぱり言った。'}; S.shown=0; S.who='n'; S.endT=0;
  render();
}
function endScreen(){
  const over=S.phase==='over';
  $('endCard').className='card '+(over?'over':'clear');
  $('endBig').textContent=over?'GAME OVER':'GAME CLEAR';
  $('verdict').textContent=over?'お前は\nへんじんね':'よく言った！';
  $('verdict').style.whiteSpace='pre-line';
  $('endSub').textContent=over?'あれだけされて許すなんて……。ハリーは今日も、だれかに無茶ぶりをしている。':'ハリーはしょんぼりして、自分の仕事を自分でやりはじめた。あなたの心に、平和がもどった。';
  $('endRows').innerHTML=[['イライラ度',S.anger+'%'],['クリア',best.clear+'回'],['へんじん認定',best.over+'回']].map(([a,b])=>`<span>${a}</span><b>${b}</b>`).join('');
  $('endOv').hidden=false; autoT=0; renderBest();
}
// tap / Space: finish typing, or go on
function advance(){
  if(!S||S.phase==='title') return;
  if(S.cur&&S.shown<S.cur.text.length){ S.shown=S.cur.text.length; render(); return; }
  if(S.phase==='over'||S.phase==='clear'){ if($('endOv').hidden) endScreen(); return; }
  if(S.wait) return;
  if(S.after==='nextScene'){ S.after=null;
    if(S.scene+1<SCENES.length) loadScene(S.scene+1);
    else { S.phase='final'; S.scene=SCENES.length; S.queue=FINAL.slice(); S.shake=.3; sfx('don'); nextLine(); }
    return; }
  nextLine();
}

// ---------- auto: reads every line, picks the calm "keep a record" answers, and never forgives ----------
const AUTO_PICK=[1,2,0,1,0,0,0];
function setAuto(v){ auto=v; $('autoBtn').setAttribute('aria-pressed',v); autoT=0; if(v&&(!S||$('titleOv').hidden===false)) newGame(); }
function user(){ if(auto) setAuto(false); }
function autoTick(dt){
  autoT+=dt;
  if(!S) return;
  if(!$('endOv').hidden){ if(autoT>3.2){ autoT=0; newGame(); } return; }
  if(S.wait==='choice'){ if(autoT>1.1){ autoT=0; choose(AUTO_PICK[S.scene]??0); } return; }
  if(S.wait==='final'){ if(autoT>1.6){ autoT=0; decide(false); } return; }
  if(S.cur&&S.shown>=S.cur.text.length&&autoT>1.2){ autoT=0; advance(); }
}

// ---------- update / render ----------
function update(dt){
  if(S){ if(S.cur&&S.shown<S.cur.text.length){ const before=Math.floor(S.shown); S.shown=Math.min(S.cur.text.length,S.shown+dt*28); if(Math.floor(S.shown)!==before){ renderText(); if(Math.floor(S.shown)%2===0) sfx('blip'); } }
    if(S.shake>0) S.shake=Math.max(0,S.shake-dt);
    if((S.phase==='over'||S.phase==='clear')&&S.cur&&S.shown>=S.cur.text.length){ S.endT+=dt; if(S.endT>1.4&&$('endOv').hidden) endScreen(); } }
  if(auto) autoTick(dt);
}
const WHO={h:'ハリー',n:'',y:'あなた'};
function renderText(){ if(!S||!S.cur) return; $('txt').textContent=S.cur.text.slice(0,Math.floor(S.shown)); $('next').hidden=!(S.shown>=S.cur.text.length&&!S.wait&&S.phase!=='over'&&S.phase!=='clear'); }
function render(){
  if(!S) return;
  const w=$('who'); w.textContent=WHO[S.who]||''; w.className=S.who; w.hidden=!WHO[S.who];
  renderText();
  $('meterFill').style.width=S.anger+'%'; $('meterNum').textContent=S.anger+'%';
  $('chap').textContent=S.scene<SCENES.length?SCENES[S.scene].chap:(S.phase==='final'?'最終話　その答えは':'');
}
function renderBest(){ $('bestRows').innerHTML=[['クリア',best.clear+'回'],['へんじん認定',best.over+'回']].map(([a,b])=>`<span>${a}</span><b>${b}</b>`).join(''); }

// ---------- drawing (Harry and the office) ----------
const cv=$('cv'), g=cv.getContext('2d');
function drawHarry(x,y,face,t){
  g.save(); g.translate(x,y);
  const bob=Math.sin(t*2)*4; g.translate(0,bob);
  // body: suit and tie
  g.fillStyle='#3B4A6B'; g.beginPath(); g.moveTo(-120,240); g.quadraticCurveTo(-110,90,0,80); g.quadraticCurveTo(110,90,120,240); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.moveTo(-34,86); g.lineTo(0,150); g.lineTo(34,86); g.fill();
  g.fillStyle='#E0433D'; g.beginPath(); g.moveTo(-10,96); g.lineTo(10,96); g.lineTo(16,190); g.lineTo(0,210); g.lineTo(-16,190); g.fill();
  // head
  g.fillStyle='#F3D2B3'; g.beginPath(); g.ellipse(0,0,72,82,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(-72,8,12,18,0,0,7); g.ellipse(72,8,12,18,0,0,7); g.fill();
  // slicked hair with a big swoop
  g.fillStyle='#C9A24A'; g.beginPath(); g.moveTo(-74,-6); g.quadraticCurveTo(-80,-86,0,-92); g.quadraticCurveTo(96,-96,86,-30); g.quadraticCurveTo(60,-66,-10,-52); g.quadraticCurveTo(-50,-44,-74,-6); g.fill();
  g.beginPath(); g.moveTo(20,-92); g.quadraticCurveTo(80,-130,110,-80); g.quadraticCurveTo(80,-100,40,-80); g.fill();
  // brows / eyes / mouth by face
  g.strokeStyle='#2E2A33'; g.fillStyle='#2E2A33'; g.lineWidth=6; g.lineCap='round';
  const eye=(ex,kind)=>{ g.beginPath();
    if(kind==='closed'){ g.arc(ex,6,12,Math.PI*1.1,Math.PI*1.9); g.stroke(); }
    else if(kind==='wide'){ g.fillStyle='#fff'; g.arc(ex,4,15,0,7); g.fill(); g.fillStyle='#2E2A33'; g.beginPath(); g.arc(ex,4,6,0,7); g.fill(); }
    else if(kind==='half'){ g.moveTo(ex-13,4); g.lineTo(ex+13,4); g.stroke(); g.beginPath(); g.arc(ex,8,5,0,7); g.fill(); }
    else { g.arc(ex,6,7,0,7); g.fill(); } };
  if(face==='wink'){ eye(-26,'dot'); eye(26,'closed'); }
  else if(face==='laugh'){ eye(-26,'closed'); eye(26,'closed'); }
  else if(face==='shock'){ eye(-26,'wide'); eye(26,'wide'); }
  else if(face==='sly'){ eye(-26,'half'); eye(26,'half'); }
  else { eye(-26,'half'); eye(26,'dot'); }
  g.lineWidth=5; g.beginPath();
  if(face==='shock'){ g.moveTo(-40,-30); g.lineTo(-14,-38); g.moveTo(40,-30); g.lineTo(14,-38); }
  else { g.moveTo(-42,-24); g.lineTo(-14,-18); g.moveTo(42,-30); g.lineTo(14,-20); }
  g.stroke();
  g.lineWidth=6; g.beginPath();
  if(face==='shock'){ g.fillStyle='#8A3B2B'; g.ellipse(0,44,13,17,0,0,7); g.fill(); }
  else if(face==='laugh'){ g.fillStyle='#8A3B2B'; g.moveTo(-32,32); g.quadraticCurveTo(0,80,32,32); g.closePath(); g.fill(); }
  else { g.moveTo(-26,36); g.quadraticCurveTo(6,58,34,26); g.stroke(); }
  if(face==='wink'){ g.fillStyle='#F2B233'; g.font='40px sans-serif'; g.fillText('✨',70,-40); }
  if(face==='laugh'&&S&&S.scene===4){ g.fillStyle='#8B4A12'; g.beginPath(); g.arc(38,40,6,0,7); g.fill(); }   // caramel on the mouth
  if(face==='shock'){ g.fillStyle='#7CC4F2'; g.beginPath(); g.moveTo(80,-40); g.quadraticCurveTo(96,-10,80,-4); g.quadraticCurveTo(64,-10,80,-40); g.fill(); }
  g.restore();
}
function drawScene(){
  const t=performance.now()/1000, W=720, H=480;
  let bg='#DCE6F5', prop='', face='smug';
  if(S){ const sc=SCENES[Math.min(S.scene,SCENES.length-1)]; bg=S.phase==='over'?'#2A2330':S.phase==='clear'?'#FFF1C9':S.scene<SCENES.length?sc.bg:'#F0E6FA'; prop=S.scene<SCENES.length?sc.prop:''; face=S.face; }
  g.setTransform(1,0,0,1,0,0);
  if(S&&S.shake>0) g.translate((Math.random()-.5)*S.shake*40,(Math.random()-.5)*S.shake*30);
  g.fillStyle=bg; g.fillRect(-20,-20,W+40,H+40);
  // office: window, desk, clock
  g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(40,40,200,150); g.strokeStyle='rgba(46,42,51,.25)'; g.lineWidth=6; g.strokeRect(40,40,200,150); g.beginPath(); g.moveTo(140,40); g.lineTo(140,190); g.moveTo(40,115); g.lineTo(240,115); g.stroke();
  g.fillStyle='#fff'; g.beginPath(); g.arc(620,90,44,0,7); g.fill(); g.stroke();
  const hr=S&&S.scene===0?4.9:S&&S.scene===6?8:(t/60)%12; g.lineWidth=5; g.beginPath(); g.moveTo(620,90); g.lineTo(620+Math.sin(hr/12*Math.PI*2)*24,90-Math.cos(hr/12*Math.PI*2)*24); g.moveTo(620,90); g.lineTo(620+Math.sin(t)*34,90-Math.cos(t)*34); g.stroke();
  g.fillStyle='#B98B5A'; g.fillRect(0,360,W,120); g.fillStyle='#9C7348'; g.fillRect(0,360,W,12);
  drawHarry(360,250,face,t);
  if(prop){ g.font='96px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; const py=380+Math.sin(t*3)*6;
    if(prop==='📄'){ for(let i=0;i<5;i++) g.fillText('📄',150+i*6,py-i*10); } else g.fillText(prop,150,py); g.textBaseline='alphabetic'; }
  if(S&&S.phase==='over'){ g.fillStyle='rgba(255,107,138,.9)'; g.font='bold 44px "Dela Gothic One",sans-serif'; g.textAlign='center'; g.fillText('ざんねん…',360,450); }
  if(S&&S.phase==='clear'){ for(let i=0;i<14;i++){ g.fillStyle=['#E0433D','#F2B233','#3F6FD8','#3E9E6E'][i%4]; g.fillRect((i*97+t*120)%W,(i*53+t*160)%H,10,16); } }
  // anger symbols grow with the meter
  if(S&&S.anger>30){ g.font=`${30+S.anger*.4}px sans-serif`; g.textAlign='center'; g.fillText('💢',600,260+Math.sin(t*6)*4); }
  requestAnimationFrame(drawScene);
}

// ---------- sound ----------
let AC=null, muted=false;
try{ muted=localStorage.getItem('harryMute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',v=.06,delay=0,f2=0){ if(muted||manualClock||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function sfx(k){
  if(k==='blip') tone(S&&S.who==='h'?520:760,.03,'square',.025);
  else if(k==='don'){ tone(110,.35,'sawtooth',.12,0,55); tone(80,.4,'sine',.2); }
  else if(k==='pick') tone(880,.08,'triangle',.08);
  else if(k==='clear') [523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.1));
  else if(k==='over') [392,370,349,330].forEach((f,i)=>tone(f,.45,'sawtooth',.06,i*.35));
}
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{ localStorage.setItem('harryMute',m?'1':'0'); }catch(e){} }

// ---------- input ----------
$('box').addEventListener('click',()=>{ ac(); user(); advance(); });
$('choices').addEventListener('click',e=>{ const b=e.target.closest('.ch'); if(!b) return; ac(); user(); choose(+b.dataset.k); });
$('yesBtn').onclick=()=>{ ac(); user(); decide(true); };
$('noBtn').onclick=()=>{ ac(); user(); decide(false); };
$('startBtn').onclick=()=>{ ac(); user(); newGame(); };
$('autoStartBtn').onclick=()=>{ ac(); setAuto(true); };
$('againBtn').onclick=()=>{ ac(); user(); newGame(); };
$('autoBtn').onclick=()=>{ ac(); setAuto(!auto); };
$('muteBtn').onclick=()=>{ ac(); setMute(!muted); };
addEventListener('keydown',e=>{
  if(e.repeat) return; const k=e.key;
  if(k==='o'||k==='O'){ ac(); setAuto(!auto); return; }
  if(k==='m'||k==='M'){ ac(); setMute(!muted); return; }
  if(!$('titleOv').hidden){ if(k==='Enter'||k===' '){ e.preventDefault(); ac(); newGame(); } return; }
  if(!$('endOv').hidden){ if(k==='Enter'){ ac(); user(); newGame(); } return; }
  if(S&&S.wait==='choice'&&/^[1-3]$/.test(k)){ ac(); user(); choose(+k-1); return; }
  if(S&&S.wait==='final'){ if(k==='1'){ ac(); user(); decide(true); } else if(k==='2'){ ac(); user(); decide(false); } return; }
  if(k===' '||k==='Enter'){ e.preventDefault(); ac(); user(); advance(); }
});

setMute(muted); renderBest();
let last=performance.now();
function loop(t){ const dt=Math.min(.1,(t-last)/1000); last=t; if(!manualClock) update(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop); requestAnimationFrame(drawScene);

// test hook
window.__harry={
  get s(){ return S&&{phase:S.phase,scene:S.scene,anger:S.anger,wait:S.wait,who:S.who,text:S.cur&&S.cur.text,picks:[...S.picks],end:!$('endOv').hidden}; },
  get best(){ return {...best}; },
  setAuto, newGame, advance, choose, decide, manual(v=true){ manualClock=v; }, step(dt=1/60){ update(dt); },
};
})();
</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
