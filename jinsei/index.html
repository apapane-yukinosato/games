<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="生まれ・親の年収・才能・学校・就職・結婚・老後…人生のすべてがガチャで決まる！ レア度が高いほど人生ポイントUP。努力コインと分かれ道で運命をちょっとだけ動かそう。CPU3人と対戦も。">
<title>人生ガチャ</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<style>
html,body{touch-action:manipulation}
:root{--bg1:#1c1a4a;--bg2:#3a1f6b;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.18);--ink:#fff;--mute:#b9b4dd;--gold:#ffd34d;--c0:#d8dee9;--c1:#4aa3ff;--c2:#b66bff;--c3:#ffc83d;--c4:#ff5fa8;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

#app{max-width:560px;height:100%;margin:0 auto;padding:calc(6px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#top{display:flex;align-items:center;gap:6px}

#board{display:flex;gap:4px}
.pc{flex:1;min-width:0;display:flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 5px;font-size:11px}

.pc em{font-style:normal;font-weight:800}

.btns{display:flex;flex-direction:column;gap:7px}

.turn{text-align:center;font-weight:900;color:var(--gold);background:var(--card);border-radius:10px;padding:4px}
.odds{background:var(--card);border-radius:14px;padding:7px 9px;display:flex;flex-direction:column;gap:3px}

.mini2{padding:7px 12px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:13px;min-height:38px}
.mini2.on{background:var(--gold);color:#3a1d00;border-color:#fff}.mini2:disabled{opacity:.4}
.card{border-radius:16px;padding:10px 12px;background:var(--card);border:2px solid var(--line);position:relative;overflow:hidden}
.card h3{margin:4px 0 2px;font-size:17px}.card p{margin:0 0 6px;font-size:13px;color:#e8e4ff}
.card .ct{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.card .chips{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}.card .chips span{background:rgba(0,0,0,.28);border-radius:999px;padding:1px 9px}.card .chips b{color:var(--gold)}
.card.r0{border-color:var(--c0)}.card.r1{border-color:var(--c1);background:rgba(74,163,255,.14)}.card.r2{border-color:var(--c2);background:rgba(182,107,255,.18)}
.card.r3{border-color:var(--c3);background:rgba(255,200,61,.2);box-shadow:0 0 18px rgba(255,200,61,.45)}
.card.r4{border:3px solid transparent;background:linear-gradient(#2d1b5e,#2d1b5e) padding-box,linear-gradient(90deg,#ff6b6b,#ffd34d,#6be36b,#6bb8ff,#c06bff,#ff6b6b) border-box;box-shadow:0 0 22px rgba(255,120,200,.6)}
.card.lg{padding:14px}.card.lg h3{font-size:21px}.card.lg p{font-size:14px}
.card.r3::after,.card.r4::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-100%);animation:shine 2.6s infinite;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
.prev{font-size:11px;color:var(--mute)}
.stand{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:12px;padding:5px 8px;border:1px solid var(--line)}
.row.me{border-color:var(--gold)}
.row .no{font-style:normal;font-weight:900;width:26px;text-align:center;color:var(--gold)}
.row .av{font-size:22px}.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:14px}.row .nm small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{text-align:right}.row .sc b{font-size:17px;display:block;line-height:1.1}.row .sc small{font-size:11px;color:#8be78b}
.mv{width:30px;text-align:center;font-size:11px;font-weight:800;color:var(--mute)}.mv.up{color:#6ee06e}.mv.dn{color:#ff7a7a}
.ttl{text-align:center}.ttl h2{margin:0;font-size:30px;letter-spacing:.12em;background:linear-gradient(90deg,#ffd34d,#ff7ac8,#7ad0ff);-webkit-background-clip:text;background-clip:text;color:transparent}.ttl p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.modes{display:flex;flex-direction:column;gap:6px}

.modes button.on,.hn button.on,.viewsel button.on{border-color:var(--gold);background:rgba(255,211,77,.18)}
.hn{display:flex;gap:6px;align-items:center;font-size:13px}.hn button{flex:1}
.best{background:var(--card);border-radius:14px;padding:8px 12px}.best h4{margin:0 0 4px;font-size:13px;color:var(--gold)}

.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:8px 2px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:13px;min-height:42px}.tabs button[aria-selected=true]{border-color:var(--gold);background:rgba(255,211,77,.18)}
.viewsel{display:flex;gap:5px;flex-wrap:wrap}.viewsel button{flex:1;padding:4px 4px;min-height:36px;font-size:11px;white-space:nowrap}
.final{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:10px 14px}
.rk{width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:#1a1530;background:#9aa}
.rk.kS{background:linear-gradient(135deg,#ffe27a,#ff9f2e,#ff5fa8,#7ad0ff);animation:hue 3s linear infinite}.rk.kA{background:#ff8a65}.rk.kB{background:#5ab0ff}.rk.kC{background:#7be08a}.rk.kD{background:#b9b9c9}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.fi b{font-size:16px;display:block}.fi small{color:var(--mute)}.tot{font-size:30px;font-weight:900;color:var(--gold);line-height:1.1}.tot small{font-size:14px}
.brk{background:var(--card);border-radius:14px;padding:6px 12px}.brk b{font-weight:800}
.rec{background:linear-gradient(90deg,#ff7ac8,#ffd34d);color:#3a1d00;font-weight:900;border-radius:12px;padding:6px 10px;text-align:center;font-size:13px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.tl li{display:flex;gap:8px;background:var(--card);border-radius:12px;padding:5px 9px;border-left:5px solid var(--c0);font-size:12px}
.tl li.r1{border-color:var(--c1)}.tl li.r2{border-color:var(--c2)}.tl li.r3{border-color:var(--c3)}.tl li.r4{border-color:#ff5fa8}
.tl .ag{width:36px;color:var(--gold);font-weight:800;font-size:11px;flex:none;padding-top:2px}.tl .tn{font-weight:800;font-size:14px}.tl small{display:block;color:var(--mute)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cards .card{padding:7px 8px}.cards .card h3{font-size:13px}.cards .card p{display:none}.cards .chips{font-size:10px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50}
#flash.f2{background:radial-gradient(circle,rgba(190,120,255,.7),transparent 70%)}
#flash.f3{background:radial-gradient(circle,rgba(255,220,100,.95),rgba(255,200,60,.3) 70%)}
#flash.f4{background:conic-gradient(from 0deg,#ff6b6b,#ffd34d,#6be36b,#6bb8ff,#c06bff,#ff6b6b);mix-blend-mode:screen}
#dex{position:fixed;inset:0;z-index:60;background:#18123a;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.dexh{display:flex;justify-content:space-between;align-items:center;font-size:18px}.dexh button{font-size:20px;padding:6px 12px}
.dexsum{display:flex;gap:5px;margin:8px 0}.dexsum div{flex:1;text-align:center;background:var(--card);border-radius:10px;padding:4px 2px;font-size:12px}.dexsum b,.dexsum small{display:block}.dexsum small{color:var(--mute)}
.dexall{font-size:13px;color:var(--mute);margin-bottom:4px}.dexall b{color:var(--gold)}
.dexbody{flex:1;overflow-y:auto}.dexbody h5{margin:10px 0 4px;font-size:13px;color:var(--gold)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:4px}.dc{background:var(--card);border-radius:8px;padding:3px 6px;font-size:11px;border-left:4px solid var(--c0);display:flex;align-items:center;gap:4px;min-width:0}
.dc .rb{min-width:26px;line-height:15px;font-size:9px;padding:0 3px}.dc small{margin-left:auto;color:var(--mute)}.dc.r1{border-color:var(--c1)}.dc.r2{border-color:var(--c2)}.dc.r3{border-color:var(--c3)}.dc.r4{border-color:#ff5fa8}.dc.no{color:#7a76a8;border-color:#3a3566}
@media (max-width:500px){.pc b{display:none}.pc{justify-content:center}.pc em{margin-left:auto}}
@media (min-width:900px){
  #app{max-width:1120px}
  #main{flex-direction:row;gap:14px}
  #left{width:520px;flex:none;overflow-y:auto}
  #panel{padding-right:4px}
}
@media (prefers-reduced-motion:reduce){.card.r3::after,.card.r4::after,.rk.kS{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a href="../">← 一覧</a>
    <h1>人生ガチャ</h1>
    <button id="autoBtn" class="mini" aria-pressed="false" aria-label="オートモード（Oキー）">🤖 オート</button>
    <button id="dexBtn" class="mini" aria-label="人生カード図鑑">📖</button>
    <button id="sndBtn" class="mini" aria-pressed="false" aria-label="音">🔊</button>

  <div id="main">

      <div id="hud"></div>
      <div id="board"></div>

</div>
<div id="flash"></div>
<div id="dex" hidden></div>
<script>

function introHTML(){

  const route=st.route?S.sel.route:null;
  const boost=S.sel.boost&&L.coins>0;
  const p=oddsWith(L.bst[s],route,boost);
  const pNo=oddsWith(L.bst[s],route,false);
  const p0=oddsWith(0,route,false);
  const fx=effectsFor(L,s);
  let h='';
  if(S.humans>1)h+='<div class="turn">'+pl.av+' '+pl.name+'の番</div>';
  h+='<div class="stg"><span class="ic">'+st.icon+'</span><div><b>'+st.name+'ガチャ</b><small>'+(s===0?pl.month+'月生まれ。':'')+st.q+'</small></div></div>';
  h+='<div class="odds">'+oddsRows(p,boost?pNo:p0)+'</div>';
  if(fx.length){
    const e=fx[0];const ri=pNo[3]>.0005?3:2;
    const sn=STAGES[e.src].name+'ガチャ'+rb(e.r)+(STAGES[e.src].id==='talent'&&L.tal?'（'+TALTAG[L.tal]+'）':'');
    h+='<div class="fx"><b>確率UP！</b> '+sn+'の効果で '+st.name+'ガチャの'+RN[ri]+'率 <b>'+pct(p0[ri])+'%→'+pct(pNo[ri])+'%</b>'+(fx.length>1?'<small>（ほか '+fx.slice(1,3).map(f=>STAGES[f.src].name+' '+RN[f.r]).join('・')+'）</small>':'')+'</div>';
  }else h+='<div class="fx none">まだ確率UPの効果はありません</div>';
  if(st.route){
    h+='<div class="routes">';
    ['s','r'].forEach((k,n)=>{
      const q=oddsWith(L.bst[s],k,boost);
      h+='<button data-act="route" data-v="'+k+'" class="rt '+k+(S.sel.route===k?' sel':'')+'" aria-pressed="'+(S.sel.route===k)+'"><span class="k">'+(k==='s'?'🛡 安定':'🎲 ハイリスク')+'</span><b>'+(k==='s'?st.route.s:st.route.r)+'</b><small>'+(k==='s'?st.route.sd:st.route.rd)+'</small><em>SSR以上 '+pct(q[3]+q[4])+'% ／ UR '+pct(q[4])+'%</em></button>';
    });
    h+='</div>';
  }
  h+='<div class="coinrow"><span>🪙 努力コイン <b>×'+L.coins+'</b></span><button data-act="boost" class="mini2'+(boost?' on':'')+'" aria-pressed="'+boost+'"'+(L.coins<1&&!boost?' disabled':'')+'>⚡ ブースト（🪙1）</button></div>';
  h+='<div class="hint">ブースト＝レア度が1段階上がりやすい。引いたあと🪙1で引き直しもできるよ。</div>';
  h+='<button class="big" data-act="pull">🎰 ガチャを引く！</button>';
  return h;
}
function cardHTML(s,idx,big){
  const it=itemOf(s,idx),pt=it.p!=null?it.p:PT[it.r];
  return '<div class="card r'+it.r+(big?' lg':'')+'"><div class="ct">'+rb(it.r)+'<span>'+STAGES[s].icon+' '+STAGES[s].name+'</span></div><h3>'+it.n+'</h3><p>'+it.d+'</p><div class="chips"><span>人生P <b>+'+pt+'</b></span>'+(it.inc?'<span>収入 <b>'+(it.inc>0?'+':'')+fmtYen(it.inc)+'</b></span>':'')+(it.c?'<span>🪙 <b>'+(it.c>0?'+':'')+it.c+'</b></span>':'')+'</div></div>';
}
function resultHTML(){
  const s=S.stage,P=S.pend,it=itemOf(s,P.idx),L=cur().L;
  let h='<div class="stg"><span class="ic">'+STAGES[s].icon+'</span><div><b>'+STAGES[s].name+'ガチャ 結果</b>'+(P.fresh?'<small class="nw">📖 図鑑に新登録！</small>':'')+'</div></div>';
  h+=cardHTML(s,P.idx,true);
  if(P.prev.length)h+='<div class="prev">引き直し前：'+P.prev.map(i=>rb(itemOf(s,i).r)+itemOf(s,i).n).join(' → ')+'</div>';
  h+='<div class="btns">';
  if(L.coins>0&&it.r<4)h+='<button class="alt" data-act="reroll">🎲 引き直す（🪙1）</button>';
  else if(it.r>=4)h+='<div class="hint">URは引き直せません。最高！</div>';
  h+='<button class="big" data-act="accept">これで決定 →</button></div>';
  return h;
}
function standingsHTML(){
  const s=S.stage,od=ranking(),prev=S.prevOrder;
  let h='<div class="stg"><span class="ic">'+STAGES[s].icon+'</span><div><b>'+STAGES[s].name+'ガチャ 結果発表</b><small>みんなの結果と順位</small></div></div><div class="stand">';
  od.forEach((i,k)=>{
    const p=S.players[i],lg=S.log[s][i],it=itemOf(s,lg.idx);const pk=prev.indexOf(i);const mv=pk-k;
    h+='<div class="row'+(p.human?' me':'')+'"><i class="no">'+(k+1)+'</i><span class="av">'+p.av+'</span><div class="nm"><b>'+p.name+'</b><small>'+rb(it.r)+' '+it.n+'</small></div><div class="sc"><b>'+Math.round(scoreOf(p))+'</b><small>+'+Math.round(lg.d)+'</small></div><span class="mv '+(mv>0?'up':mv<0?'dn':'')+'">'+(mv>0?'▲'+mv:mv<0?'▼'+(-mv):'－')+'</span></div>';
  });
  h+='</div><button class="big" data-act="next">'+(s===NS-1?'結果を見る →':'次のガチャへ →')+'</button>';
  return h;
}
const AGE_AT=['0歳','0歳','0歳','0歳','3歳','6歳','15歳','18歳','22歳','30歳','34歳','37歳','42歳','55歳','65歳','80歳',''];
const MED=['🥇','🥈','🥉','4位'];

  let h='';
  const tabs=[['sum','まとめ'],['time','年表'],['cards','人生カード']];

  if(S.players.length>1){h+='<div class="viewsel">'+S.players.map((p,i)=>'<button data-act="view" data-p="'+i+'" class="'+(i===S.view?'on':'')+'">'+p.av+' '+p.name+'</button>').join('')+'</div>';}
  if(S.tab==='sum'){

    h+='<div class="final"><div class="rk k'+rk+'">'+rk+'</div><div class="fi"><b>'+vp.name+'の人生</b><small>享年 '+(endIt?endIt.age:'?')+'歳</small><div class="tot">'+Math.round(sc)+'<small> pt</small></div></div></div>';
    h+='<div class="brk"><div><span>人生ポイント</span><b>'+L.pts+' pt</b></div><div><span>生涯収入</span><b>'+fmtYen(L.inc)+'</b></div><div><span>収入のポイント換算</span><b>+'+Math.round(L.inc/CONV)+' pt</b></div><div><span>引いたUR</span><b>'+L.ur+' 枚</b></div></div>';
    if(S.newRec&&S.newRec.length&&vp.human&&S.view===0)h+='<div class="rec">🎉 自己ベスト更新：'+S.newRec.join('・')+'</div>';
    if(S.autoUsed)h+='<div class="hint">🤖 オートで遊んだ人生はベスト記録に入りません（図鑑とUR回数は数えます）。</div>';
    h+='<div class="btns"><button class="big" data-act="again">もう一度、人生をひく</button><button class="alt" data-act="title">モード変更</button><a class="alt lnk" href="../">← ゲーム一覧にもどる</a></div>';
  }else if(S.tab==='time'){
    h+='<ol class="tl">'+STAGES.map((st,s)=>{const i=L.h[s];if(i<0)return '';const it=itemOf(s,i);return '<li class="r'+it.r+'"><span class="ag">'+AGE_AT[s]+'</span><div><b>'+st.icon+' '+st.name+'</b> '+rb(it.r)+'<br><span class="tn">'+it.n+'</span><small>'+it.d+'</small></div></li>';}).join('')+'</ol>';
  }else{
    const ord=STAGES.map((st,s)=>({s,i:L.h[s]})).filter(x=>x.i>=0).sort((a,b)=>itemOf(b.s,b.i).r-itemOf(a.s,a.i).r);
    h+='<div class="cards">'+ord.map(x=>cardHTML(x.s,x.i,false)).join('')+'</div>';
  }
  return h;
}
function titleHTML(){
  const d=dexByRarity();
  let h='<div class="ttl"><h2>人生ガチャ</h2><p>生まれから大往生まで、人生ぜんぶがガチャ！<br>レア度が高いほど人生ポイントUP。ポイントと生涯収入でスコアが決まる。</p></div>';
  h+='<div class="modes">'+[['cpu','⚔️ CPU3人と対戦'],['solo','🙂 ひとりで'],['hot','👥 みんなで（ホットシート）']].map(m=>'<button data-act="mode" data-m="'+m[0]+'" class="'+(S.mode===m[0]?'on':'')+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>';
  if(S.mode==='hot')h+='<div class="hn">人数：'+[2,3,4].map(n=>'<button data-act="hn" data-n="'+n+'" class="'+(S.hn===n?'on':'')+'">'+n+'人</button>').join('')+'</div>';
  h+='<button class="big" data-act="start">▶ はじめる</button>';
  h+='<div class="best"><h4>🏆 ベスト記録</h4><div><span>最高スコア</span><b>'+(BEST.score?BEST.score+' pt':'－')+'</b></div><div><span>最高ランク</span><b>'+BEST.rank+'</b></div><div><span>最高の生涯収入</span><b>'+(BEST.inc?fmtYen(BEST.inc):'－')+'</b></div><div><span>図鑑コンプ率</span><b>'+Math.floor(dexCount()/dexTotal()*100)+'%（'+dexCount()+'/'+dexTotal()+'）</b></div><div><span>URを引いた回数</span><b>'+(BEST.ur||0)+' 回</b></div></div>';
  h+='<div class="btns"><button class="alt" data-act="dex">📖 人生カード図鑑</button></div>';
  h+='<div class="hint">🤖 オート（Oキー）でTASのようにプロ並みの人生を眺められます。</div>';
  return h;
}
function dexHTML(){
  const d=dexByRarity();
  let h='<div class="dexh"><b>📖 人生カード図鑑</b><button data-act="closeDex" aria-label="閉じる">✕</button></div><div class="dexsum">';
  for(let r=4;r>=0;r--)h+='<div class="r'+r+'"><span class="rb r'+r+'">'+RN[r]+'</span><b>'+d.got[r]+'/'+d.tot[r]+'</b><small>'+Math.floor(d.got[r]/d.tot[r]*100)+'%</small></div>';
  h+='</div><div class="dexall">全体 <b>'+Math.floor(dexCount()/dexTotal()*100)+'%</b>（'+dexCount()+'/'+dexTotal()+'）</div><div class="dexbody">';
  STAGES.forEach((st,s)=>{
    h+='<h5>'+st.icon+' '+st.name+'</h5><div class="dg">';
    const idxs=st.items.map((_,i)=>i).sort((a,b)=>st.items[a].r-st.items[b].r);
    idxs.forEach(i=>{const it=st.items[i];const got=DEX[s+':'+i];h+=got?'<div class="dc r'+it.r+'"><span class="rb r'+it.r+'">'+RN[it.r]+'</span>'+it.n+(got>1?'<small>×'+got+'</small>':'')+'</div>':'<div class="dc no">？？？</div>';});
    h+='</div>';
  });
  return h+'</div>';
}
let lastKey='';
function render(){
  S.dirty=false;
  $('hud').innerHTML=hudHTML();$('bar').innerHTML=barHTML();$('board').innerHTML=boardHTML();
  let h='';
  switch(S.phase){
    case 'title':h=titleHTML();break;
    case 'intro':h=introHTML();break;
    case 'anim':h='<div class="stg"><span class="ic">'+STAGES[S.stage].icon+'</span><div><b>'+STAGES[S.stage].name+'ガチャ</b><small>ガチャを回しています…</small></div></div><div class="hint big2">タップでスキップ</div><button class="alt" data-act="skip">スキップ ⏩</button>';break;
    case 'result':h=resultHTML();break;
    case 'standings':h=standingsHTML();break;
    case 'ending':h=endHTML();break;
  }
  const el=$('panel');const key=S.phase+S.stage+'/'+S.cur+S.tab+S.view;
  const sc=el.scrollTop;el.innerHTML=h;el.scrollTop=key===lastKey?sc:0;lastKey=key;
  el.classList.toggle('auto',S.auto&&S.phase!=='title');
  const dx=$('dex');dx.hidden=!S.dexOpen;if(S.dexOpen)dx.innerHTML=dexHTML();
}
function act(a,d){
  if(S.auto&&a!=='autoNone'){setAuto(false);}
  SFX.click();
  switch(a){
    case 'start':newGame({});break;
    case 'mode':S.mode=d.m;S.dirty=true;break;
    case 'hn':S.hn=+d.n;S.dirty=true;break;
    case 'pull':doPull();break;
    case 'route':S.sel.route=d.v;S.dirty=true;break;
    case 'boost':if(cur().L.coins>0||S.sel.boost){S.sel.boost=!S.sel.boost;}S.dirty=true;break;
    case 'reroll':reroll();break;
    case 'accept':accept();break;
    case 'skip':finishAnim();break;
    case 'next':next();break;
    case 'tab':S.tab=d.t;S.dirty=true;break;
    case 'view':S.view=+d.p;S.dirty=true;break;
    case 'again':restart();break;
    case 'title':toTitle();break;
    case 'dex':S.dexOpen=true;S.dirty=true;break;
    case 'closeDex':S.dexOpen=false;S.dirty=true;break;
  }
}
document.addEventListener('click',e=>{
  ac();
  if(e.target.id==='autoBtn'){setAuto(!S.auto);return;}
  if(e.target.id==='sndBtn'){setSnd(!S.snd);return;}
  if(e.target.id==='dexBtn'){act('dex',{});return;}
  if(e.target.closest&&e.target.closest('#cv')&&S.phase==='anim'){if(S.auto)setAuto(false);finishAnim();return;}
  const b=e.target.closest&&e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='o'||k==='O'){setAuto(!S.auto);return;}
  if(S.dexOpen){if(k==='Escape')act('closeDex',{});return;}
  const was=S.auto;
  if(k==='Enter'||k===' '){e.preventDefault();
    if(was)setAuto(false);
    ({title:()=>newGame({}),intro:doPull,anim:finishAnim,result:accept,standings:next,ending:restart})[S.phase]();return;}
  if(S.phase==='intro'){
    if(k==='1'||k==='2'){if(was)setAuto(false);if(STAGES[S.stage].route){S.sel.route=k==='1'?'s':'r';S.dirty=true;}}
    if(k==='b'||k==='B'){if(was)setAuto(false);act('boost',{});}
  }else if(S.phase==='result'&&(k==='r'||k==='R')){if(was)setAuto(false);reroll();}
});
function state(){
  const ps=S.players.map((p,i)=>({name:p.name,human:p.human,gender:p.gender,score:+scoreOf(p).toFixed(2),pts:p.L.pts,inc:p.L.inc,coins:p.L.coins,ur:p.L.ur,rank:rankOf(scoreOf(p)),h:p.L.h.slice(),route:p.L.rt.slice()}));
  return {phase:S.phase,stage:S.stage,stageName:STAGES[S.stage]&&STAGES[S.stage].name,auto:S.auto,cur:S.cur,humans:S.humans,mode:S.mode,seed:S.seed,sel:Object.assign({},S.sel),
    pend:S.pend?{idx:S.pend.idx,r:itemOf(S.stage,S.pend.idx).r,name:itemOf(S.stage,S.pend.idx).n,boost:S.pend.boost,route:S.pend.route,prev:S.pend.prev.slice()}:null,
    players:ps,order:S.endInfo?S.endInfo.order:null,best:Object.assign({},BEST),dex:{count:dexCount(),total:dexTotal(),byRarity:dexByRarity()},errors:S.err||0};
}
function oddsHook(stage){
  const s=stage==null?S.stage:stage;const p=cur()||S.players[0];if(!p)return null;
  const route=STAGES[s].route?S.sel.route:null;const boost=S.sel.boost&&p.L.coins>0&&s===S.stage;
  const pr=oddsWith(p.L.bst[s],route,boost),p0=oddsWith(0,route,false);
  return {stage:s,name:STAGES[s].name,route,boost,bonus:+p.L.bst[s].toFixed(3),pct:Object.fromEntries(RN.map((n,i)=>[n,+(pr[i]*100).toFixed(2)])),base:Object.fromEntries(RN.map((n,i)=>[n,+(p0[i]*100).toFixed(2)])),
    effects:effectsFor(p.L,s).map(e=>({from:STAGES[e.src].name,rarity:RN[e.r],amt:+e.amt.toFixed(2)}))};
}
window.__jinsei={
  state,step,odds:oddsHook,
  setAuto:v=>{setAuto(v);return S.auto;},
  newGame:o=>{S.dexOpen=false;return newGame(o||{});},
  pull:()=>{if(S.phase==='intro')doPull();if(S.phase==='anim')finishAnim();render();return state();},
  accept:()=>{accept();render();return state();},
  next:()=>{if(S.phase==='standings')next();render();return state();},
  useCoin:kind=>{if(kind==='boost'&&S.phase==='intro'){if(cur().L.coins>0)S.sel.boost=true;}else if(kind==='reroll'&&S.phase==='result'){reroll();finishAnim();}render();return state();},
  choose:rt=>{if(S.phase==='intro'){S.sel.route=rt;S.dirty=true;render();}return state();},
  setMode:(m,n)=>{S.mode=m;if(n)S.hn=n;S.dirty=true;render();},
  openDex:v=>{S.dexOpen=v!==false;S.dirty=true;render();},
  setTab:t=>{S.tab=t;S.dirty=true;render();},
  setView:i=>{S.view=i;S.dirty=true;render();},
  toTitle:()=>{toTitle();render();},
  simLife:(policy,seed,N)=>simLifeCore(policy||'auto',seed==null?1:seed,N||40),
  // 見た目確認用：指定のレア度の演出を出す
  demoAnim:r=>{if(S.phase!=='intro')return;doPull();S.pend.idx=STAGES[S.stage].items.findIndex(it=>it.r===r);if(S.pend.idx<0)S.pend.idx=0;S.anim.r=STAGES[S.stage].items[S.pend.idx].r;},
  S,
};
/* ---- 起動 ---- */
function layout(){fit();S.dirty=true;}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
setSnd(S.snd);fit();render();
let lastT=performance.now();
function frame(now){const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  try{tick(dt);paint(dt);if(S.dirty)render();}catch(e){S.err=(S.err||0)+1;console.error(e);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
