<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="他人のお金を吸い取る男「マネーダイソン」。街の人から吸って能力を上げ、世界一の大富豪をめざすアクション。">
<title>マネーダイソン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Dela+Gothic+One&display=swap">
<style>
:root{--bg:#14101E;--ink:#F4EEE2;--card:#221A30;--line:#3E3252;--mute:#A898BC;--gold:#F2C23A;--red:#E0433D;--green:#46C07A;--purple:#8A5AE0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:8px 10px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;font-family:"Dela Gothic One",sans-serif;color:var(--gold);letter-spacing:.08em}
.mini{font-size:12px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.mini[aria-pressed=true]{background:var(--red);border-color:var(--red)}
#wrap{position:relative}
#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;background:#3A3A44;touch-action:none}
#pad{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
#stick{position:relative;width:126px;height:126px;flex:none;border-radius:50%;background:var(--card);border:2px solid var(--line);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#4A3A62;border:2px solid #7A6A92;pointer-events:none}
#acts{display:grid;grid-template-columns:repeat(2,auto);gap:8px;align-items:center}
.act{border:0;border-radius:18px;font-weight:800;cursor:pointer;touch-action:none;color:#fff}
#suckBtn{grid-row:span 2;width:96px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B08AF8,#6A3AC8);box-shadow:0 5px 0 #3E2280;font-size:17px}
#suckBtn.on{transform:translateY(3px);box-shadow:0 2px 0 #3E2280;filter:brightness(1.25)}
#touchBtn{width:88px;height:52px;background:#C8302A;box-shadow:0 4px 0 #7A1A16;font-size:13px}
#touchBtn:disabled{background:#4A3A52;box-shadow:0 4px 0 #2A2032;color:#8A7A9A}
#shopBtn{width:88px;height:52px;background:#C8962A;box-shadow:0 4px 0 #7A5A16;font-size:13px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.72);border-radius:14px;padding:12px;z-index:3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:400px;max-height:100%;overflow:auto;text-align:center}
.card h2{margin:0;font-family:"Dela Gothic One",sans-serif;font-size:24px;line-height:1.3;color:var(--gold)}
.story{font-size:14px;line-height:1.8;text-align:left;margin:10px 0;white-space:pre-line}
.sub{font-size:12px;color:var(--mute);line-height:1.6;margin:6px 0}
.go{display:block;width:100%;min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;background:var(--purple);color:#fff;box-shadow:0 4px 0 #4A2A90}
.go.alt{background:#3A2E4E;box-shadow:0 4px 0 #221A30}
.go.gold{background:var(--gold);color:#221A30;box-shadow:0 4px 0 #8A6A16}
.back{display:block;margin-top:10px;font-size:13px;font-weight:800;color:var(--mute);text-decoration:none}
.skills{display:grid;gap:6px;text-align:left;margin-top:8px}
.sk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:#2C2240;border-radius:12px;padding:8px 10px}
.sk b{font-size:14px}.sk.rec{outline:2px solid var(--gold)}.sk em{font-style:normal;font-size:11px;color:var(--gold);margin-left:6px}.sk small{grid-column:1;font-size:11px;color:var(--mute)}
.sk button{grid-row:1/3;grid-column:2;border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;background:var(--gold);color:#221A30;cursor:pointer;min-width:92px}
.sk button:disabled{background:#4A3E5A;color:#8A7A9A;cursor:default}
#nameIn{width:100%;font-size:18px;padding:10px;border-radius:10px;border:2px solid var(--gold);background:#120E1A;text-align:center;margin-top:6px}
.keys{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}
@media (pointer:coarse){.keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>マネーダイソン</h1>
    <button class="mini" id="autoBtn" aria-pressed="false" title="Oキー">🤖 オート</button>
    <button class="mini" id="muteBtn">音 ON</button>
  </div>
  <div id="wrap">
    <canvas id="cv" width="360" height="480" aria-label="街のようす。人に近づいてお金を吸う"></canvas>
    <div class="ov" id="storyOv">
      <div class="card">
        <h2 id="storyTitle">マネーダイソン</h2>
        <div class="story" id="storyText"></div>
        <button class="go gold" id="storyBtn">はじめる</button>
        <button class="go alt" id="autoStartBtn">🤖 オートで見る</button>
        <a class="back" href="../">← ゲーム一覧にもどる</a>
      </div>
    </div>
    <div class="ov" id="shopOv" hidden>
      <div class="card">
        <h2>能力ショップ</h2>
        <p class="sub" id="shopMoney"></p>
        <div class="skills" id="skills"></div>
        <button class="go" id="shopClose">街にもどる</button>
      </div>
    </div>
    <div class="ov" id="nameOv" hidden>
      <div class="card">
        <h2>某SNS 買収</h2>
        <div class="story">世界一の大富豪になったマネーダイソンは、
世界中の人がつぶやく「某SNS」を、まるごと買い取った。

新しい名前をつけよう。</div>
        <input id="nameIn" maxlength="14" placeholder="なまえ" value="ダイソンX">
        <button class="go gold" id="nameBtn">この名前にする</button>
      </div>
    </div>
  </div>
  <div id="pad">
    <div id="stick" aria-label="移動スティック"><i></i></div>
    <div id="acts">
      <button class="act" id="suckBtn">🌀<br>吸う</button>
      <button class="act" id="touchBtn" disabled>✋ 直触り</button>
      <button class="act" id="shopBtn">💰 ショップ</button>
    </div>
  </div>
  <p class="keys">PC：WASD / 矢印 移動　スペース（おしっぱなし）吸う　T 直触り　B ショップ　人をクリックでねらいを固定　O オート　M 音</p>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let seed=(Date.now()%2147483646)+1; const rnd=()=>{ seed=seed*16807%2147483647; return (seed-1)/2147483646; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const W=360,H=480, TOP=44, AREA={x0:14,x1:346,y0:TOP+50,y1:H-40};
const lr=(a,b)=>Math.exp(Math.log(a)+(Math.log(b)-Math.log(a))*rnd());      // log-uniform money
function yen(v){ v=Math.floor(v); if(v<1e4) return v.toLocaleString()+'円';
  const u=[[1e12,'兆'],[1e8,'億'],[1e4,'万']]; for(const [d,n] of u) if(v>=d){ const x=v/d; return (x>=100?Math.floor(x).toLocaleString():x>=10?x.toFixed(1):x.toFixed(2))+n+'円'; } }

/* ================= people & stages ================= */
const T={
  student:{n:'学生',m:[0,5000],col:'#5A8AD8',sp:1},
  mom:{n:'主婦',m:[1000,50000],col:'#D87A9A',sp:.9},
  oji:{n:'おじさん',m:[0,80000],col:'#8A8A6A',sp:.8},
  shop:{n:'八百屋',m:[5e4,8e5],col:'#6AA84A',sp:.7},
  worker:{n:'会社員',m:[1e5,3e6],col:'#4A5A7A',sp:1},
  ol:{n:'OL',m:[1e5,2e6],col:'#C87AB8',sp:1},
  boss:{n:'部長',m:[5e6,3e7],col:'#3A4A6A',sp:.85},
  ceo:{n:'社長',m:[5e7,3e8],col:'#2A2A3A',sp:.8,rich:1},
  madam:{n:'奥様',m:[1e7,1e8],col:'#B84A7A',sp:.8},
  rich:{n:'お金持ち',m:[1e9,5e9],col:'#C8962A',sp:.75,rich:1,guards:2,dz:84},
  trader:{n:'トレーダー',m:[1e8,1e9],col:'#2A6A5A',sp:1.1},
  investor:{n:'投資家',m:[1e10,1e11],col:'#D8A83A',sp:.8,rich:1,guards:2,dz:112},
  chairman:{n:'会長',m:[1e11,5e11],col:'#E8C84A',sp:.7,rich:1,guards:3,dz:128},
  tycoon:{n:'資産家',m:[1e12,1e13],col:'#E0B040',sp:.8,rich:1,guards:1,dz:112},
  magnate:{n:'大富豪',m:[1e13,8e13],col:'#FFE070',sp:.65,rich:1,guards:3,dz:150},
  police:{n:'警官',m:[3e6,8e6],col:'#2A4A9A',sp:1,police:1},
  sp:{n:'SP',m:[4e6,1e7],col:'#141418',sp:1.4,isSP:1},
};
const STAGES=[
  {n:'下町商店街',goal:3e5,mix:{student:3,mom:4,oji:3,shop:2},police:1,count:10,rec:{},bg:['#8A7A6A','#A8987A'],
   intro:'ある朝、男は気づいた。\n人に手をかざすと、その人のお金が自分の口座に流れこんでくる――。\n\n男は自分を「マネーダイソン」と名づけた。\nまずは商店街で、この力をためしてみよう。',
   tip:'ほとんどの人はお金を持っていない。長く吸いすぎると怪しまれて、たたかれるぞ。\n警官（公務員）は結構持っているが、怪しまれると追いかけてくる。追ってくる警官はあわてているので、3倍吸いやすい。'},
  {n:'オフィス街',goal:4e8,mix:{worker:5,ol:4,boss:2,ceo:.7},police:2,count:11,rec:{pow:3,stl:2},bg:['#5A6A7A','#7A8A9A'],
   intro:'商店街では小銭しか吸えない。\nマネーダイソンはビルの立ちならぶオフィス街へやってきた。',tip:'社長はSPなしで歩いている。直触りなら一瞬で全部吸えるが、警察に追われる。'},
  {n:'高級住宅街',goal:3e10,mix:{madam:4,rich:2,ceo:1},police:3,count:10,rec:{rng:3,pow:5,stl:3},bg:['#5A7A5A','#7A9A6A'],
   intro:'ここからは本物のお金持ちの街。\nだが、お金持ちにはいつもSPがついている。',tip:'SPに近づくとなぐられる。「吸引距離」をきたえて、遠くから吸おう。'},
  {n:'金融街',goal:5e12,mix:{trader:3,investor:3,chairman:2},police:3,count:10,rec:{rng:3,pow:7,stl:4,hp:3},bg:['#3A3A5A','#5A5A7A'],
   intro:'世界のお金が集まる金融街。\n投資家も会長も、SPでがっちり守られている。',tip:'会長のSPはさらに多い。吸引距離とステルスを上げておこう。'},
  {n:'世界長者サミット',goal:6e14,mix:{tycoon:3,magnate:2},police:4,count:9,rec:{rng:4,pow:9,stl:5,hp:4},bg:['#5A3A2A','#8A5A3A'],
   intro:'世界中の大富豪が集まるサミット会場。\nここで世界一になれば、あの「某SNS」だって買える。',tip:'目標は600兆円。大富豪のSPはとても多い。吸引距離を上げて、SPの外から吸おう。'},
];
// abilities (cost grows fast so each town's money matters)
const SK=[
  {id:'pow',n:'吸引力',d:l=>`1秒で ${yen(powOf(l))} 吸う`,max:10,cost:l=>1e5*Math.pow(12,l-1)},
  {id:'rng',n:'吸引距離',d:l=>`とどく距離 ${rngOf(l)}`,max:6,cost:l=>1.5e5*Math.pow(40,l-1)},
  {id:'stl',n:'怪しまれにくさ',d:l=>`怪しまれる速さ ${Math.round(stlOf(l)*100)}%`,max:6,cost:l=>5e4*Math.pow(35,l-1)},
  {id:'hp',n:'体力',d:l=>`HP ${hpOf(l)}`,max:5,cost:l=>4e4*Math.pow(45,l-1)},
  {id:'spd',n:'俊足',d:l=>`足の速さ ${Math.round(spdOf(l)*100)}%`,max:5,cost:l=>1e5*Math.pow(40,l-1)},
];
// each level is a big jump: power x2.5, reach +50..60, suspicion x0.55, HP +3, speed +25%
const powOf=l=>3e4*Math.pow(10,l-1),  // yen per second: x10 each level
       rngOf=l=>[44,104,160,212,262,300][l-1], stlOf=l=>Math.pow(.55,l-1), hpOf=l=>3+3*(l-1), spdOf=l=>1+.25*(l-1);

/* ================= state ================= */
const S={scene:'story',stage:0,money:0,lv:{pow:1,rng:1,stl:1,hp:1,spd:1},p:null,npcs:[],fx:[],alarm:0,t:0,target:null,lock:null,sucking:false,paused:false,auto:false,manual:false,
  start:null,msg:'',msgT:0,endT:0,sns:null,ending:null,
  best:(()=>{ try{ return JSON.parse(localStorage.getItem('dysonBest')||'null')||{stage:0,clears:0}; }catch(e){ return {stage:0,clears:0}; } })(),
  stats:{slaps:0,caught:0,drained:0,touches:0}};
let nid=1;
function saveBest(){ try{ localStorage.setItem('dysonBest',JSON.stringify(S.best)); }catch(e){} }

function mkNpc(type,x,y){
  const t=T[type], m=lr(Math.max(1,t.m[0]),t.m[1])*(t.m[0]===0&&rnd()<.35?0:1);
  const n={id:nid++,type,t,x,y,tx:x,ty:y,money:Math.floor(m),max:Math.floor(m),sp:(t.sp||1)*(34+rnd()*10),state:'walk',sus:0,wary:0,idle:0,guards:[],angryT:0,face:1,life:25+rnd()*25};
  if(n.money<=0){ n.money=0; n.state='drained'; }
  return n;
}
function spawnPerson(st,edge){
  const keys=Object.keys(st.mix), tot=keys.reduce((s,k)=>s+st.mix[k],0); let r=rnd()*tot, type=keys[0]; for(const k of keys){ r-=st.mix[k]; if(r<0){ type=k; break; } }
  const x=edge?(rnd()<.5?AREA.x0:AREA.x1):AREA.x0+rnd()*(AREA.x1-AREA.x0), y=AREA.y0+rnd()*(AREA.y1-AREA.y0);
  const n=mkNpc(type,x,y); S.npcs.push(n);
  if(n.t.guards){ for(let k=0;k<n.t.guards;k++){ const g=mkNpc('sp',x+(rnd()-.5)*30,y+(rnd()-.5)*30); g.owner=n.id; g.ang=k/n.t.guards*Math.PI*2; g.state='guard'; n.guards.push(g.id); S.npcs.push(g); } }
  return n;
}
function startStage(i){
  const st=STAGES[i]; S.stage=i; S.npcs=[]; S.fx=[]; S.alarm=0; S.target=null; S.lock=null; S.scene='play'; S.paused=false;
  S.p={x:180,y:AREA.y1-30,hp:hpOf(S.lv.hp),inv:0,vx:0,vy:0,face:0};
  for(let k=0;k<st.count;k++) spawnPerson(st,false);
  for(let k=0;k<st.police;k++){ const n=mkNpc('police',AREA.x0+rnd()*(AREA.x1-AREA.x0),AREA.y0+rnd()*80); S.npcs.push(n); }
  S.start={money:S.money,lv:{...S.lv}}; S.msg=`STAGE ${i+1}　${st.n}`; S.msgT=0;
  if(i>S.best.stage){ S.best.stage=i; if(!S.auto) saveBest(); }
  hideAll(); sfx('start');
}
function hideAll(){ $('storyOv').hidden=true; $('shopOv').hidden=true; $('nameOv').hidden=true; }
function story(title,text,btn,fn,showAuto){ S.scene='story'; $('storyTitle').textContent=title; $('storyText').textContent=text; $('storyBtn').textContent=btn; storyFn=fn; $('autoStartBtn').hidden=!showAuto; $('storyOv').hidden=false; S.endT=0; }
let storyFn=null;
function titleScreen(){ S.money=0; S.lv={pow:1,rng:1,stl:1,hp:1,spd:1}; S.ending=null;
  story('マネーダイソン','他人のお金を吸い取る力を手にした男、マネーダイソン。\n街の人に手をかざして資産を吸い、能力をきたえ、\n世界一の大富豪をめざせ！\n\n'+`（とうたつ：STAGE ${S.best.stage+1}／クリア ${S.best.clears}回）`,'はじめる',()=>stageIntro(0),true); }
function recText(i){ const r=STAGES[i].rec, ks=Object.keys(r); if(!ks.length) return ''; return '\n\n⭐ おすすめ能力：'+ks.map(k=>`${SK.find(s=>s.id===k).n}Lv${r[k]}${S.lv[k]>=r[k]?'✓':''}`).join('・'); }
function stageIntro(i){ const st=STAGES[i]; story(`STAGE ${i+1}　${st.n}`,st.intro+'\n\n💡 '+st.tip+recText(i)+`\n\n目標：${yen(st.goal)}`,'この街へ',()=>startStage(i),false); }
function stageClear(){
  S.scene='cleared'; sfx('clear');
  if(S.stage<STAGES.length-1){ story('STAGE CLEAR!',`${STAGES[S.stage].n}で ${yen(S.money)} 集めた。\n\n次の街はもっときびしい。着いたら💰ショップで能力をきたえよう。`+recText(S.stage+1),'次の街へ',()=>stageIntro(S.stage+1),false); }
  else { S.best.clears++; if(!S.auto) saveBest(); story('世界一の大富豪',`マネーダイソンの資産は ${yen(S.money)}。\nついに世界のお金持ちのトップに立った。\n\nそして男は、あるものに目をつけた――。`,'某SNSを買う',()=>{ if(S.auto){ endingStart('マネーダイソン'); } else { $('storyOv').hidden=true; $('nameOv').hidden=false; } },false); }
}
function faint(){ S.scene='down'; sfx('lose'); story('たおれた…',`たたかれすぎて、マネーダイソンはたおれた。\n${STAGES[S.stage].n}のはじめからやり直しだ。`,'もう一度',()=>{ S.money=S.start.money; S.lv={...S.start.lv}; startStage(S.stage); },false); }

/* ================= ending: the SNS that makes money forever ================= */
function endingStart(name){
  hideAll(); S.scene='ending'; S.ending={name:name||'ダイソンX',t:0,rate:1e12,spent:0,spendT:0,msgs:[]}; sfx('clear');
}
function spendMoney(){ const E=S.ending; if(!E) return; const cut=S.money*.5; S.money-=cut; E.spent+=cut; E.rate*=1.8; E.msgs.push({t:0,txt:`-${yen(cut)}… でも、すぐ増える`}); sfx('coin'); }

/* ================= player actions ================= */
function nearestTouchable(){ const p=S.p; let best=null,bd=26; for(const n of S.npcs){ if(n.state==='drained'||n.money<=0) continue; const d=Math.hypot(n.x-p.x,n.y-p.y); if(d<bd){ bd=d; best=n; } } return best; }
function directTouch(){
  if(S.scene!=='play'||S.paused) return; const n=nearestTouchable(); if(!n) return;
  S.money+=n.money; S.fx.push({k:'txt',x:n.x,y:n.y-20,t:0,txt:`+${yen(n.money)}`,col:'#F2C23A',big:1}); n.money=0; drainPerson(n);
  S.stats.touches++; S.p.dash=4; startAlarm(); sfx('touch');
}
function startAlarm(){
  const st=STAGES[S.stage]; S.alarm=9; S.msg='🚨 警察が来た！ 逃げろ！'; S.msgT=0;
  const cops=S.npcs.filter(n=>n.t.police&&n.state!=='drained');
  for(let k=cops.length;k<st.police+1;k++){ const n=mkNpc('police',rnd()<.5?AREA.x0:AREA.x1,AREA.y0+rnd()*(AREA.y1-AREA.y0)); S.npcs.push(n); }
  for(const n of S.npcs) if(n.t.police&&n.state!=='drained') n.state='chase';
  sfx('siren');
}
function drainPerson(n){ n.state='drained'; n.sus=0; S.stats.drained++; S.fx.push({k:'txt',x:n.x,y:n.y-30,t:0,txt:'…',col:'#A898BC'});
  if(n.t.rich) for(const gid of n.guards){ const g=S.npcs.find(x=>x.id===gid); if(g) { g.state='leave'; } } }
function hurt(src,kind){

  p.hp--; p.inv=1.2; S.stats.slaps++; S.stats[kind]=(S.stats[kind]||0)+1; const a=Math.atan2(p.y-src.y,p.x-src.x); p.vx=Math.cos(a)*260; p.vy=Math.sin(a)*260;

  let best=null,bv=-1; for(const n of S.npcs){ if(n.state==='drained'||n.money<=0||n.wary>0) continue; const d=Math.hypot(n.x-p.x,n.y-p.y); if(d>R) continue; if(n.money>bv){ bv=n.money; best=n; } }

/* ================= update ================= */
function update(dt){
  S.t+=dt; if(AUTO.touchCd>0) AUTO.touchCd-=dt; for(const f of S.fx) f.t+=dt; S.fx=S.fx.filter(f=>f.t<1.4); S.msgT+=dt;
  if(S.scene==='ending'){ updateEnding(dt); return; }
  if(S.scene!=='play'){ if(S.auto){ S.endT+=dt; if(S.endT>2.2){ S.endT=0; if(!$('storyOv').hidden&&storyFn){ const f=storyFn; f(); } } } return; }
  if(S.paused){ if(S.auto){ S.endT+=dt; if(S.endT>1.2){ S.endT=0; closeShop(); } } return; }
  const p=S.p, st=STAGES[S.stage];
  if(S.auto) autoTick(dt);
  // player movement
  const mv=inputDir(), spd=78*spdOf(S.lv.spd)*(S.sucking?.55:1)*(p.dash>0?1.45:1); if(p.dash>0) p.dash-=dt;
  p.x+=(mv.x*spd+p.vx)*dt; p.y+=(mv.y*spd+p.vy)*dt; p.vx*=Math.pow(.02,dt); p.vy*=Math.pow(.02,dt);
  if(mv.x||mv.y) p.face=Math.atan2(mv.y,mv.x);
  p.x=clamp(p.x,AREA.x0,AREA.x1); p.y=clamp(p.y,AREA.y0,AREA.y1); if(p.inv>0) p.inv-=dt;
  // suck

  if(S.target){ const n=S.target, d=Math.hypot(n.x-p.x,n.y-p.y), R=rngOf(S.lv.rng);
    const amt=Math.min(n.money,powOf(S.lv.pow)*(n.state==='chase'?3:1)*dt); n.money-=amt; S.money+=amt; S.gainT=(S.gainT||0)+amt;
    const sus=.6*stlOf(S.lv.stl)*(n.t.rich?1.25:1)*(n.t.police?1.15:1)*(.55+.45*(1-d/R));
    n.sus+=sus*dt; if(Math.random()<dt*14) S.fx.push({k:'coin',x:n.x,y:n.y,tx:p.x,ty:p.y,t:0});
    if(n.money<=0){ n.money=0; drainPerson(n); sfx('drain'); }
    else if(n.sus>=1) enrage(n); }
  if(S.gainT&&Math.random()<dt*6){ S.fx.push({k:'txt',x:p.x+20,y:p.y-24,t:0,txt:`+${yen(S.gainT)}`,col:'#F2C23A'}); S.gainT=0; }

  for(const n of S.npcs) stepNpc(n,dt,p);
  S.npcs=S.npcs.filter(n=>!n.gone);
  // keep the town populated
  const living=S.npcs.filter(n=>!n.t.isSP&&!n.t.police&&n.state!=='drained').length;
  if(living<st.count&&rnd()<dt*.6) spawnPerson(st,true);
  if(S.npcs.filter(n=>n.state==='drained').length>8){ const d=S.npcs.find(n=>n.state==='drained'); d.state='leaveD'; }
  if(S.alarm>0){ S.alarm-=dt; if(S.alarm<=0){ S.alarm=0; for(const n of S.npcs) if(n.t.police&&n.state==='chase') n.state='walk'; S.msg='逃げきった！'; S.msgT=0; } }
  $('touchBtn').disabled=!nearestTouchable();
  if(S.money>=st.goal&&S.scene==='play') stageClear();
}
function enrage(n){
  n.sus=0; n.wary=9; S.fx.push({k:'txt',x:n.x,y:n.y-26,t:0,txt:n.t.police?'逮捕だ！':'ドロボー！',col:'#FF6A5A'}); sfx('alert');
  if(n.t.police){ startAlarm(); return; }
  if(n.t.rich&&n.guards.length){ for(const gid of n.guards){ const g=S.npcs.find(x=>x.id===gid); if(g&&g.state!=='leave'){ g.state='charge'; g.angryT=3.4; } } }
  else { n.state='angry'; n.angryT=5; }
}
function stepNpc(n,dt,p){
  if(n.wary>0) n.wary-=dt; if(n.sus>0&&S.target!==n) n.sus=Math.max(0,n.sus-.12*dt);
  const toP=Math.hypot(p.x-n.x,p.y-n.y);
  const moveTo=(tx,ty,sp)=>{ const dx=tx-n.x, dy=ty-n.y, d=Math.hypot(dx,dy)||1; const s=Math.min(d,sp*dt); n.x+=dx/d*s; n.y+=dy/d*s; if(Math.abs(dx)>1) n.face=dx>0?1:-1; return d; };
  switch(n.state){
    case 'drained': return;
    case 'leaveD': case 'leave': { const ex=n.x<180?-30:W+30; moveTo(ex,n.y,40); if(n.x<-20||n.x>W+20) n.gone=1; return; }
    case 'angry': { n.angryT-=dt; moveTo(p.x,p.y,n.sp*1.9); if(toP<16){ hurt(n,'slap'); n.state='walk'; n.angryT=0; } if(n.angryT<=0) n.state='walk'; return; }
    case 'chase': { moveTo(p.x,p.y,64+S.stage*2); if(toP<15) hurt(n,'police'); return; }
    case 'charge': { n.angryT-=dt; if(n.angryT>2.2) return; moveTo(p.x,p.y,n.sp*1.2); if(toP<16){ hurt(n,'sp'); n.state='guard'; } if(n.angryT<=0) n.state='guard'; return; }
    case 'guard': { const o=S.npcs.find(x=>x.id===n.owner); if(!o||o.state==='drained'){ n.state='leave'; return; }
      n.ang+=dt*.8; moveTo(o.x+Math.cos(n.ang)*26,o.y+Math.sin(n.ang)*20,n.sp*1.2);
      if(Math.hypot(p.x-o.x,p.y-o.y)<o.t.dz&&p.inv<=0){ n.state='charge'; n.angryT=2.8; S.fx.push({k:'txt',x:n.x,y:n.y-22,t:0,txt:'近よるな！',col:'#FF6A5A'}); }
      return; }
    default: { // walk / idle; after a while people head home and new ones arrive
      if(!n.t.police&&!n.t.isSP){ n.life-=dt; if(n.life<=0&&S.target!==n){ n.state='leave'; for(const gid of n.guards){ const gg=S.npcs.find(x=>x.id===gid); if(gg) gg.state='leave'; } return; } }

}

/* ================= auto: picks the best target it can drain safely ================= */
const AUTO={t:0,want:null,cool:0};
function autoTick(dt){
  const p=S.p, R=rngOf(S.lv.rng); AUTO.t-=dt; AUTO.cool-=dt;
  // shop: buy upgrades while keeping most of the money

  let mx=0,my=0; const flee=(x,y,w)=>{ const d=Math.hypot(p.x-x,p.y-y)||1; mx+=(p.x-x)/d*w; my+=(p.y-y)/d*w; };

  let danger=false;
  for(const n of S.npcs){ const d=Math.hypot(n.x-p.x,n.y-p.y);
    if((n.state==='angry'||n.state==='charge')&&d<120){ flee(n.x,n.y,2); danger=true; }
    if(n.state==='chase'&&d<140){ flee(n.x,n.y,1.5); danger=true; }
    if(n.state==='guard'){ const o=S.npcs.find(x=>x.id===n.owner); if(o){ const od=Math.hypot(p.x-o.x,p.y-o.y); if(od<o.t.dz+14) { flee(o.x,o.y,3); danger=true; } else if(od<o.t.dz+50){ flee(o.x,o.y,1.6*(1-(od-o.t.dz-14)/36)); } } } }
  // during an alarm, drain the police that chase us
  let goal=null;
  if(S.alarm>0){ // run; only drain a cop that is almost empty (sucking slows us down)
    S.sucking=false; const cop=S.npcs.filter(n=>n.state==='chase').sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
    if(cop&&Math.hypot(cop.x-p.x,cop.y-p.y)<R&&cop.money<=powOf(S.lv.pow)*3*1.2){ S.lock=cop.id; S.sucking=true; } }
  else {
    // choose target: value you can safely reach
    let best=null,bv=0;
    for(const n of S.npcs){ if(n.state==='drained'||n.money<=0||n.wary>0||n.t.isSP||n.state!=='walk') continue;
      if(n.t.police) continue;
      let stand=R-8; if(n.t.rich&&n.t.dz){ if(R<n.t.dz+14) continue; stand=Math.max(n.t.dz+12,R-10); }
      const d=Math.hypot(n.x-p.x,n.y-p.y), v=Math.min(n.money,n.max*.35)/(1+d/120);

    if(best){ const n=best.n, d=Math.hypot(n.x-p.x,n.y-p.y);
      // unguarded, very rich, and we are healthy: the risky direct touch
      if(d<22&&false){}
      if(S.stage>=1&&!n.guards.length&&!n.t.police&&n.money>STAGES[S.stage].goal*.08&&S.p.hp>=3&&S.alarm===0&&S.lv.spd>=2&&(AUTO.touchCd||0)<=0&&S.npcs.filter(x=>x.t.police&&x.state!=='drained').length<=2){ if(d<22){ directTouch(); AUTO.touchCd=60; return; } goal={x:n.x,y:n.y}; }
      else { if(d>best.stand) goal={x:n.x,y:n.y}; else if(d<best.stand-26) flee(n.x,n.y,1);

  if(danger){ // keep off the walls and slide around the chasers instead of getting cornered
    const m=70; if(p.x<AREA.x0+m) mx+=(1-(p.x-AREA.x0)/m)*3; if(p.x>AREA.x1-m) mx-=(1-(AREA.x1-p.x)/m)*3; if(p.y<AREA.y0+m) my+=(1-(p.y-AREA.y0)/m)*3; if(p.y>AREA.y1-m) my-=(1-(AREA.y1-p.y)/m)*3;
    const cx=(AREA.x0+AREA.x1)/2-p.x, cy=(AREA.y0+AREA.y1)/2-p.y, side=(mx*cy-my*cx)>0?1:-1; const tx=-my*side, ty=mx*side; mx+=tx*.8; my+=ty*.8; }

function drawTown(){

  for(let x=0;x<W;){ const w=34+r()*30, h=30+r()*20; g.fillStyle=`hsl(${(S.stage*60+r()*60)|0},25%,${30+r()*20}%)`; g.fillRect(x,TOP+48-h,w-3,h); g.fillStyle='rgba(255,240,180,.55)'; for(let yy=TOP+48-h+5;yy<TOP+42;yy+=8) for(let xx=x+4;xx<x+w-8;xx+=8) if(r()<.5) g.fillRect(xx,yy,4,4); x+=w; }
  g.fillStyle=st.bg[1]; g.fillRect(0,TOP+48,W,H-TOP-48);
  g.strokeStyle='rgba(255,255,255,.08)'; g.lineWidth=1; for(let y=TOP+60;y<H;y+=24){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  for(let x=0;x<W;x+=48){ g.beginPath(); g.moveTo(x,TOP+48); g.lineTo(x,H); g.stroke(); }

}
function drawPlayer(){
  const p=S.p, x=p.x, y=p.y; if(p.inv>0&&Math.floor(p.inv*12)%2) return;
  // range ring
  g.strokeStyle=S.sucking?'rgba(176,138,248,.55)':'rgba(176,138,248,.22)'; g.lineWidth=1.5; g.setLineDash([4,5]); g.beginPath(); g.arc(x,y,rngOf(S.lv.rng),0,7); g.stroke(); g.setLineDash([]);

  g.fillStyle='#5A2A9A'; g.beginPath(); g.moveTo(x-10,y+10); g.lineTo(x,y-10); g.lineTo(x+10,y+10); g.fill();       // cape
  g.fillStyle='#1E1A2A'; g.fillRect(x-6,y-4,12,13); g.fillStyle='#F2C23A'; g.fillRect(x-1,y-3,2,9);                  // suit + gold tie
  g.fillStyle='#F2D2B0'; g.beginPath(); g.arc(x,y-9,6.5,0,7); g.fill();

  g.fillStyle='#F2C23A'; g.font='800 8px sans-serif'; g.textAlign='center'; g.fillText('¥',x,y-17);
  // the vacuum hand
  const t=S.target; if(t){ const a=Math.atan2(t.y-y,t.x-x); g.strokeStyle='rgba(176,138,248,.7)'; g.lineWidth=3; for(let k=0;k<3;k++){ const ph=(S.t*3+k/3)%1; const px=t.x+(x-t.x)*ph, py=t.y+(y-t.y)*ph; g.beginPath(); g.arc(px,py,3+4*(1-ph),a,a+Math.PI*1.6); g.stroke(); } }
}
function drawHud(){
  const st=STAGES[S.stage], p=S.p;
  g.fillStyle='rgba(16,10,26,.88)'; g.fillRect(0,0,W,TOP);
  g.fillStyle='#F2C23A'; g.font='800 16px "M PLUS Rounded 1c",sans-serif'; g.textAlign='left'; g.fillText('💰 '+yen(S.money),8,18);
  g.fillStyle='#E8E0F0'; g.font='800 10px "M PLUS Rounded 1c",sans-serif'; g.fillText(`STAGE ${S.stage+1} ${st.n}　目標 ${yen(st.goal)}`,8,36);
  const k=Math.min(1,S.money/st.goal); g.fillStyle='#2C2240'; g.fillRect(200,28,150,8); g.fillStyle='#F2C23A'; g.fillRect(200,28,150*k,8);
  g.textAlign='right'; g.font='13px sans-serif'; g.fillText('❤️'.repeat(Math.max(0,p.hp))+'🤍'.repeat(Math.max(0,hpOf(S.lv.hp)-p.hp)),W-8,18);
  if(S.alarm>0){ g.fillStyle=`rgba(224,67,61,${.25+.2*Math.sin(S.t*12)})`; g.fillRect(0,TOP,W,H-TOP); g.fillStyle='#fff'; g.textAlign='center'; g.font='800 14px "M PLUS Rounded 1c",sans-serif'; g.fillText(`🚨 警察に追われている！ ${Math.ceil(S.alarm)}秒`,W/2,TOP+18); }
  if(S.msg&&S.msgT<2.2){ g.globalAlpha=Math.min(1,2.2-S.msgT); g.fillStyle='rgba(16,10,26,.8)'; g.fillRect(40,H/2-24,280,40); g.fillStyle='#F2C23A'; g.textAlign='center'; g.font='800 17px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.msg,W/2,H/2+2); g.globalAlpha=1; }
  if(S.auto){ g.fillStyle='#B08AF8'; g.font='800 11px sans-serif'; g.textAlign='left'; g.fillText('🤖 AUTO',8,H-8); }
}
function drawFx(){
  for(const f of S.fx){
    if(f.k==='coin'){ const k=Math.min(1,f.t/.5); const x=f.x+(f.tx-f.x)*k, y=f.y+(f.ty-f.y)*k-Math.sin(k*Math.PI)*14; g.fillStyle='#F2C23A'; g.beginPath(); g.arc(x,y,3,0,7); g.fill(); if(k>=1) f.t=9; }
    else if(f.k==='txt'){ g.globalAlpha=Math.max(0,1-f.t/1.4); g.font=`800 ${f.big?15:11}px "M PLUS Rounded 1c",sans-serif`; g.textAlign='center'; g.lineWidth=3; g.strokeStyle='#120E1A'; g.strokeText(f.txt,f.x,f.y-f.t*22); g.fillStyle=f.col; g.fillText(f.txt,f.x,f.y-f.t*22); g.globalAlpha=1; }
  }
}
function drawEnding(){
  const E=S.ending, t=E.t;
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#0A0614'); gr.addColorStop(1,'#2A1A40'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // falling coins
  for(let i=0;i<40;i++){ const x=(i*47+t*20*(1+i%3))%W, y=(i*83+t*(60+i%5*20))%H; g.fillStyle=i%3?'#F2C23A':'#FFE9A0'; g.beginPath(); g.arc(x,y,3+i%3,0,7); g.fill(); }
  // SNS logo
  g.fillStyle='#fff'; g.beginPath(); g.arc(W/2,120,46,0,7); g.fill(); g.fillStyle='#8A5AE0'; g.font='800 40px "Dela Gothic One",sans-serif'; g.textAlign='center'; g.fillText((E.name[0]||'X').toUpperCase(),W/2,136);
  g.fillStyle='#fff'; g.font='800 20px "M PLUS Rounded 1c",sans-serif'; g.fillText(`「${E.name}」`,W/2,196);
  g.font='800 12px "M PLUS Rounded 1c",sans-serif'; g.fillStyle='#C8B8E0'; g.fillText('世界中の投稿が、広告が、課金が、',W/2,222); g.fillText('ぜんぶマネーダイソンのお金になる。',W/2,240);
  g.fillStyle='#F2C23A'; g.font='800 22px "M PLUS Rounded 1c",sans-serif'; g.fillText(yen(S.money),W/2,290);
  g.fillStyle='#C8B8E0'; g.font='800 11px "M PLUS Rounded 1c",sans-serif'; g.fillText(`1秒で +${yen(E.rate)}`,W/2,310);
  for(const m of E.msgs){ g.globalAlpha=Math.max(0,1-m.t/2); g.fillStyle='#FF8A7A'; g.font='800 12px "M PLUS Rounded 1c",sans-serif'; g.fillText(m.txt,W/2,332-m.t*16); g.globalAlpha=1; }
  // spend button
  g.fillStyle='#E0433D'; g.beginPath(); g.roundRect?g.roundRect(100,404,160,44,14):g.rect(100,404,160,44); g.fill(); g.fillStyle='#fff'; g.font='800 15px "M PLUS Rounded 1c",sans-serif'; g.fillText('お金を使う',W/2,432);
  if(t>6){ g.globalAlpha=Math.min(1,(t-6)/2); g.fillStyle='#fff'; g.font='800 13px "M PLUS Rounded 1c",sans-serif'; g.fillText('使っても使っても、お金は増えつづける。',W/2,352);
    g.fillStyle='#F2C23A'; g.font='800 14px "M PLUS Rounded 1c",sans-serif'; g.fillText('マネーダイソンは、',W/2,374); g.fillText('お金を減らすことが、できなくなってしまった。',W/2,392); g.globalAlpha=1; }
  if(t>9){ g.fillStyle='rgba(255,255,255,.8)'; g.font='800 12px "Dela Gothic One",sans-serif'; g.fillText('─ THE END ─',W/2,60); g.fillStyle='#C8B8E0'; g.font='800 12px "M PLUS Rounded 1c",sans-serif'; g.fillText('▼ ここをタップでタイトルへ',W/2,470); }
}
function draw(){
  g.setTransform(1,0,0,1,0,0);
  if(S.scene==='ending'){ drawEnding(); return; }
  if(!S.p){ g.fillStyle='#14101E'; g.fillRect(0,0,W,H); g.fillStyle='#F2C23A'; g.font='800 40px "Dela Gothic One",sans-serif'; g.textAlign='center'; g.fillText('¥',W/2,H/2); return; }
  drawTown();
  const all=[...S.npcs].sort((a,b)=>a.y-b.y);
  for(const n of all) person(n);
  drawPlayer(); drawFx(); drawHud();
}

/* ================= sound ================= */
let AC=null, muted=false; try{ muted=localStorage.getItem('dysonMute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type='square',v=.06,delay=0,f2=0){ if(muted||S.manual||!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function sfx(k){
  if(k==='coin'){ tone(1320,.06,'square',.04); tone(1760,.1,'square',.04,.05); }
  else if(k==='drain') tone(440,.4,'sine',.06,0,110);
  else if(k==='alert') tone(880,.15,'square',.06,0,1320);
  else if(k==='slap'){ tone(160,.1,'sawtooth',.1,0,60); }
  else if(k==='siren'){ for(let i=0;i<4;i++) tone(i%2?660:880,.18,'sawtooth',.05,i*.18); }
  else if(k==='touch'){ [262,392,523,784,1046].forEach((f,i)=>tone(f,.12,'square',.05,i*.05)); }
  else if(k==='buy') tone(988,.12,'triangle',.07,0,1480);
  else if(k==='start') [392,523,659].forEach((f,i)=>tone(f,.15,'triangle',.07,i*.1));
  else if(k==='clear') [523,659,784,1046,1319].forEach((f,i)=>tone(f,.2,'square',.05,i*.1));
  else if(k==='lose') [330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.07,i*.2));
}
function setMute(m){ muted=m; $('muteBtn').textContent=m?'音 OFF':'音 ON'; try{ localStorage.setItem('dysonMute',m?'1':'0'); }catch(e){} }
// soft suction hum while draining
setInterval(()=>{ if(S.target&&S.scene==='play'&&!S.paused) tone(220+Math.random()*40,.12,'sine',.025); },140);

setMute(muted); titleScreen();
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(!S.manual) update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

window.__dyson={ get S(){ return S; }, setAuto, manual(v=true){ S.manual=v; }, step(dt=1/60){ update(dt); }, seed(v){ seed=(Math.abs(v|0)%2147483646)+1; },
  startStage, stageIntro, buy, directTouch, openShop, closeShop, endingStart, spendMoney, STAGES, yen };
})();

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
