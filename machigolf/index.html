html,body{touch-action:manipulation}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);

#app{height:100%;box-sizing:border-box;max-width:1280px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#top{display:flex;align-items:center;gap:8px}
#top a{color:var(--mute);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.mini:focus-visible,.club:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 #0a0f1c;background:#10162a}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bar{display:flex;gap:6px}
.club{flex:1;min-width:0;font:inherit;font-size:13px;font-weight:800;border:0;border-radius:12px;padding:9px 2px;min-height:44px;background:#34456b;color:var(--ink);box-shadow:0 3px 0 #121a2c;cursor:pointer;line-height:1.2}
.club small{display:block;font-size:10px;font-weight:500;color:var(--mute)}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

// ================= 物理（決定的・固定ステップ） =================
const DT=1/120, GRAV=900, BR=5, CUPR=12, CUPV=430, CELL=100, MAXPULL=140;
const CLUBS=[
  {id:'driver',nm:'ドライバー',vh:1000,loft:.30,landD:.78,bounce:1},
  {id:'iron',  nm:'アイアン',  vh:520, loft:.95,landD:.42,bounce:.6},
  {id:'putter',nm:'パター',    vh:520, loft:0,  landD:1,  bounce:0}
];
const GR={
  asphalt:{t:'asphalt',k:.9, c:38, rest:.38,damp:.80,col:'#6f7581',nm:'アスファルト'},
  grass:  {t:'grass',  k:1.7,c:70, rest:.25,damp:.60,col:'#7ccb6b',nm:'しばふ'},
  floor:  {t:'floor',  k:.30,c:14, rest:.45,damp:.85,col:'#efe6d2',nm:'つるつる床'},
  carpet: {t:'carpet', k:4.2,c:150,rest:.10,damp:.35,col:'#c4506a',nm:'カーペット'},
  sand:   {t:'sand',   k:12, c:400,rest:0,  damp:.10,col:'#ecd694',nm:'すなば'},
  water:  {t:'water',  k:1,  c:1,  rest:0,  damp:0,  col:'#58b4e8',nm:'水',water:1},
  void:   {t:'void',   k:1,  c:1,  rest:0,  damp:0,  col:'#1d2a4a',nm:'吹き抜け',water:1,voidz:1}
};

// 当たったもの（ギャグ）
const KIND={
  bld:   {top:999,g:10,e:.70,say:['なに!?','うわっ！','ドン!?'],snd:'thud'},
  wall:  {top:999,g:0, e:.60,say:[]},
  car:   {top:26, g:16,e:.45,say:['ブーッ！','おいコラ！','キズがつく！','パーーッ！'],snd:'horn',angry:1},
  cart:  {top:20, g:10,e:.50,say:['カートが！','ガシャン！'],snd:'thud'},
  shelf: {top:999,g:12,e:.50,say:['お客さま!?','商品が！','お客さま〜!?'],snd:'beep',angry:1},
  low:   {top:24, g:12,e:.50,say:['お客さま!?','ちょっと！'],snd:'beep',angry:1},
  crate: {top:22, g:12,e:.50,say:['うちの大根が！','ちょっとお客さん！','トマトが！'],snd:'beep',angry:1},
  bench: {top:20, g:6, e:.50,say:['ゴン！'],snd:'thud'},
  bush:  {top:22, g:4, e:.30,say:['ガサッ'],snd:'soft'},
  pole:  {top:999,g:8, e:.60,say:['カーン！'],snd:'ping'},
  tree:  {top:999,g:5, e:.40,say:['バサッ'],snd:'soft'},
  person:{top:40, g:18,e:.40,say:['きゃっ！','いてっ！','なにするの！','ちょっと！'],snd:'ouch',angry:1},
  pigeon:{top:16, g:8, e:.30,say:['クルッポー！'],snd:'coo'},
  train: {top:999,g:30,e:.60,say:['ガタンゴトン!?','プァーーン！'],snd:'horn',angry:1},
  bar:   {top:30, g:6, e:.50,say:['カンカン！'],snd:'ping'},
  fence: {top:30, g:0, e:.60,say:[]},
  glass: {top:40, g:22,e:.50,say:['パリーン！'],snd:'glass'},
  table: {top:24, g:6, e:.50,say:['ガタッ！'],snd:'thud'},
  vend:  {top:999,g:10,e:.50,say:['ガコン！'],snd:'thud'},
  reg:   {top:999,g:14,e:.50,say:['ピッ！','お客さま!?'],snd:'beep',angry:1}
};

let W=null; // コンパイル済みのホール

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function evalKeys(keys,t){
  for(let j=0;j<keys.length-1;j++){
    const a=keys[j], b=keys[j+1];
    if(t>=a[0]&&t<b[0]){ const u=(t-a[0])/(b[0]-a[0]); return [a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]; }
  }
  const l=keys[keys.length-1]; return [l[1],l[2]];
}

function compile(h){
  const w={h,w:h.w,hh:h.h,cup:{x:h.cup[0],y:h.cup[1]},oob:!!h.oob,zones:[],so:[],mv:[],ng:0};
  w.baseZ=Object.assign({},GR[h.base||'asphalt']);
  for(const z of (h.zones||[])){
    const q=Object.assign({},GR[z.t],z);
    q.sh=z.r!=null?1:0; if(q.sh){q.r2=z.r*z.r;}
    w.zones.push(q);
  }
  w.gx=Math.ceil(h.w/CELL); w.gy=Math.ceil(h.h/CELL);
  w.grid=[]; for(let i=0;i<w.gx*w.gy;i++) w.grid.push([]);
  (h.obs||[]).forEach((o,i)=>{
    const kd=KIND[o.k]||KIND.bld;
    const ob={raw:o,id:o.k+i,k:o.k,kd,top:o.top!=null?o.top:kd.top,e:kd.e,gl:!!o.gl,gi:-1,pg:!!o.pg};
    if(o.r!=null){ ob.sh=1; ob.cx=o.cx; ob.cy=o.cy; ob.r=o.r; ob.x0=o.cx-o.r; ob.y0=o.cy-o.r; ob.x1=o.cx+o.r; ob.y1=o.cy+o.r; }
    else { ob.sh=0; ob.x0=o.x; ob.y0=o.y; ob.x1=o.x+o.w; ob.y1=o.y+o.h; }
    if(ob.gl){ ob.gi=w.ng++; }
    w.so.push(ob);
    const ax=Math.max(0,Math.floor((ob.x0-BR)/CELL)), bx=Math.min(w.gx-1,Math.floor((ob.x1+BR)/CELL));
    const ay=Math.max(0,Math.floor((ob.y0-BR)/CELL)), by=Math.min(w.gy-1,Math.floor((ob.y1+BR)/CELL));
    for(let cy=ay;cy<=by;cy++) for(let cx=ax;cx<=bx;cx++) w.grid[cy*w.gx+cx].push(ob);
  });
  (h.mov||[]).forEach((m,i)=>{
    const kd=KIND[m.k]||KIND.car;
    const N=Math.round(m.T/DT);
    const tab=new Float32Array(N*2);
    for(let s=0;s<N;s++){ const p=evalKeys(m.keys,s*DT); tab[2*s]=p[0]; tab[2*s+1]=p[1]; }
    const person=m.k==='person'||m.k==='pigeon'||!!m.r;
    w.mv.push({raw:m,id:'m'+m.k+i,k:m.k,kd,top:m.top!=null?m.top:kd.top,e:kd.e,sh:person?1:0,r:person?(m.r||9):0,w:m.w||0,h:m.h||0,N,ph:Math.round((m.ph||0)/DT),tab,gl:false,pg:false});
  });
  w.maxT=0; for(const m of w.mv) w.maxT=Math.max(w.maxT,m.N);
  buildField(w);
  return w;
}

function groundAt(x,y){
  const z=W.zones;
  for(let i=z.length-1;i>=0;i--){
    const q=z[i];
    if(q.sh){ const dx=x-q.cx, dy=y-q.cy; if(dx*dx+dy*dy<q.r2) return q; }
    else if(x>=q.x&&x<q.x+q.w&&y>=q.y&&y<q.y+q.h) return q;
  }
  return W.baseZ;
}

// ---------- 距離フィールド（カップまでの道のり。オートの評価に使う） ----------
function buildField(w){
  const cs=16, nx=Math.ceil(w.w/cs), ny=Math.ceil(w.hh/cs);
  const cost=new Float32Array(nx*ny), dist=new Float32Array(nx*ny).fill(1e9);
  const prevW=W; W=w;
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const px=(i+.5)*cs, py=(j+.5)*cs; let c=1;
    const g=groundAt(px,py);
    if(g.water) c=1e9; else if(g.conv) c=1; else { if(g.t==='sand') c=1.6; if(g.bad) c=3; }
    if(c<1e8){
      const cl=w.grid[Math.min(w.gy-1,(py/CELL|0))*w.gx+Math.min(w.gx-1,(px/CELL|0))];
      for(const ob of cl){
        if(ob.gl) continue;
        const inside=ob.sh?((px-ob.cx)**2+(py-ob.cy)**2<(ob.r+BR+3)**2):(px>ob.x0-BR-3&&px<ob.x1+BR+3&&py>ob.y0-BR-3&&py<ob.y1+BR+3);
        if(inside){ if(ob.top>=900){c=1e9;break;} c=Math.max(c,3); }
      }
    }
    cost[j*nx+i]=c;
  }
  W=prevW;
  // Dijkstra
  const heap=[]; // [d,idx]
  const push=(d,i)=>{ heap.push([d,i]); let a=heap.length-1; while(a>0){const p=(a-1)>>1; if(heap[p][0]<=heap[a][0])break; [heap[p],heap[a]]=[heap[a],heap[p]]; a=p;} };
  const pop=()=>{ const t=heap[0], l=heap.pop(); if(heap.length){ heap[0]=l; let a=0; for(;;){ let b=a*2+1; if(b>=heap.length)break; if(b+1<heap.length&&heap[b+1][0]<heap[b][0])b++; if(heap[a][0]<=heap[b][0])break; [heap[a],heap[b]]=[heap[b],heap[a]]; a=b; } } return t; };
  const ci=Math.min(nx-1,Math.floor(w.cup.x/cs)), cj=Math.min(ny-1,Math.floor(w.cup.y/cs));
  dist[cj*nx+ci]=0; push(0,cj*nx+ci);
  while(heap.length){
    const [d,idx]=pop(); if(d>dist[idx]) continue;
    const i=idx%nx, j=(idx/nx)|0;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){
      if(!di&&!dj) continue;
      const a=i+di, b=j+dj; if(a<0||b<0||a>=nx||b>=ny) continue;
      const c2=cost[b*nx+a]; if(c2>=1e8) continue;
      const nd=d+cs*(di&&dj?1.414:1)*(c2+cost[idx])/2;
      if(nd<dist[b*nx+a]){ dist[b*nx+a]=nd; push(nd,b*nx+a); }
    }
  }
  w.fld={cs,nx,ny,dist};
}
function remain(x,y){
  const dc=Math.hypot(x-W.cup.x,y-W.cup.y); if(dc<50) return dc;
  const f=W.fld; const i=clamp(Math.floor(x/f.cs),0,f.nx-1), j=clamp(Math.floor(y/f.cs),0,f.ny-1);
  let d=f.dist[j*f.nx+i];
  if(d>=1e8){ d=1e9; for(let b=-1;b<=1;b++) for(let a=-1;a<=1;a++){ const ii=i+a, jj=j+b; if(ii<0||jj<0||ii>=f.nx||jj>=f.ny) continue; const v=f.dist[jj*f.nx+ii]; if(v<d) d=v+20; } if(d>=1e8) d=9999; }
  return d;
}

// ---------- 状態 ----------
function newState(x,y){
  return {x,y,z:0,vx:0,vy:0,vz:0,k:0,rest:true,cup:0,club:0,gr:null,sand:0,
    nh:0,hv:0,nw:0,noob:0,ngl:0,brk:0,sc:0,cdId:'',cdK:-999,nomov:false,rec:false,evq:null,steps:0};
}
function cloneS(S){
  return {x:S.x,y:S.y,z:S.z,vx:S.vx,vy:S.vy,vz:S.vz,k:S.k,rest:S.rest,cup:S.cup,club:S.club,gr:S.gr,sand:S.sand,
    nh:0,hv:0,nw:0,noob:0,ngl:0,brk:S.brk,sc:S.sc,cdId:S.cdId,cdK:S.cdK,nomov:S.nomov,rec:false,evq:null,steps:0};
}
function launch(S,ang,p,club){
  const c=CLUBS[club]; if(S.sand){p*=.5;} S.sand=0;
  const vh=c.vh*p;
  S.vx=Math.cos(ang)*vh; S.vy=Math.sin(ang)*vh; S.vz=vh*c.loft; S.z=0; S.rest=false; S.club=club; S.cup=0;
  S.gr=groundAt(S.x,S.y);
}

function ev(S,o){ if(S.rec) S.evq.push(o); }

function react(S,ob,nx,ny,mvx,mvy){
  if(ob.gl){
    S.brk|=(1<<ob.gi); S.ngl++; S.nh++; S.hv+=ob.kd.g; S.vx*=.8; S.vy*=.8;
    ev(S,{t:'glass',ob,x:S.x,y:S.y}); return;
  }
  const vn=(S.vx-mvx)*nx+(S.vy-mvy)*ny;
  if(vn<0){ const f=(1+ob.e)*vn; S.vx-=f*nx; S.vy-=f*ny; }
  if(S.rest&&S.vx*S.vx+S.vy*S.vy>25) S.rest=false;
  if(-vn>40&&ob.kd.g>0&&!(ob.pg&&S.sc)){
    if(!(S.cdId===ob.id&&S.k-S.cdK<40)){
      S.nh++; S.hv+=ob.kd.g; if(ob.pg) S.sc=1;
      ev(S,{t:'hit',ob,x:S.x,y:S.y,v:-vn});
    }
    S.cdId=ob.id; S.cdK=S.k;
  } else if(-vn>40&&S.rec&&ob.kd.snd) ev(S,{t:'bump',ob,x:S.x,y:S.y});
}
function hitRect(S,ob,x0,y0,x1,y1,mvx,mvy){
  if(S.z>=ob.top) return;
  const px=S.x, py=S.y;
  const cx=px<x0?x0:px>x1?x1:px, cy=py<y0?y0:py>y1?y1:py;
  const dx=px-cx, dy=py-cy, d2=dx*dx+dy*dy;
  if(d2>=BR*BR) return;
  let nx,ny;
  if(d2>1e-9){ const d=Math.sqrt(d2); nx=dx/d; ny=dy/d; if(!ob.gl){S.x=cx+nx*BR; S.y=cy+ny*BR;} }
  else {
    const l=px-x0, r=x1-px, t=py-y0, b=y1-py, m=Math.min(l,r,t,b);
    if(m===l){nx=-1;ny=0;if(!ob.gl)S.x=x0-BR;} else if(m===r){nx=1;ny=0;if(!ob.gl)S.x=x1+BR;}
    else if(m===t){nx=0;ny=-1;if(!ob.gl)S.y=y0-BR;} else {nx=0;ny=1;if(!ob.gl)S.y=y1+BR;}
  }

}
function hitCirc(S,ob,cx,cy,r,mvx,mvy){
  if(S.z>=ob.top) return;
  const dx=S.x-cx, dy=S.y-cy, rr=r+BR, d2=dx*dx+dy*dy;
  if(d2>=rr*rr) return;
  let nx=1,ny=0; const d=Math.sqrt(d2);
  if(d>1e-6){ nx=dx/d; ny=dy/d; }
  S.x=cx+nx*rr; S.y=cy+ny*rr;
  react(S,ob,nx,ny,mvx,mvy);
}
function collideMovers(S){
  const mv=W.mv;
  for(let i=0;i<mv.length;i++){
    const m=mv[i]; if(S.z>=m.top) continue;
    const idx=(S.k+m.ph)%m.N;
    const cx=m.tab[2*idx], cy=m.tab[2*idx+1];
    const hw=(m.sh?m.r:m.w/2)+BR, hh=(m.sh?m.r:m.h/2)+BR;
    if(S.x<cx-hw||S.x>cx+hw||S.y<cy-hh||S.y>cy+hh) continue;
    const pi=(idx+m.N-1)%m.N;
    const mvx=(cx-m.tab[2*pi])/DT, mvy=(cy-m.tab[2*pi+1])/DT;
    if(m.sh) hitCirc(S,m,cx,cy,m.r,mvx,mvy);
    else hitRect(S,m,cx-m.w/2,cy-m.h/2,cx+m.w/2,cy+m.h/2,mvx,mvy);
  }
}
function collideStatic(S){
  const w=W;
  const cxi=clamp((S.x/CELL)|0,0,w.gx-1), cyi=clamp((S.y/CELL)|0,0,w.gy-1);
  const cl=w.grid[cyi*w.gx+cxi];
  for(let i=0;i<cl.length;i++){
    const ob=cl[i];
    if(ob.pg&&S.sc) continue;
    if(ob.gl&&((S.brk>>ob.gi)&1)) continue;
    if(ob.sh) hitCirc(S,ob,ob.cx,ob.cy,ob.r,0,0); else hitRect(S,ob,ob.x0,ob.y0,ob.x1,ob.y1,0,0);

}
function stopBall(S){ S.vx=S.vy=S.vz=0; S.z=0; S.rest=true; }
function splash(S,g){
  if(g.voidz){ S.nw++; ev(S,{t:'void',x:S.x,y:S.y}); } else { S.nw++; ev(S,{t:'water',x:S.x,y:S.y}); }

}
function cupCheck(S){
  const dx=S.x-W.cup.x, dy=S.y-W.cup.y;

  }
}
function bounds(S){
  const w=W;
  if(w.oob){
    if(S.x<0||S.x>w.w||S.y<0||S.y>w.hh){ S.noob++; ev(S,{t:'oob',x:S.x,y:S.y}); stopBall(S); }
    return;
  }
  if(S.x<BR){S.x=BR; if(S.vx<0)S.vx*=-.6;} else if(S.x>w.w-BR){S.x=w.w-BR; if(S.vx>0)S.vx*=-.6;}
  if(S.y<BR){S.y=BR; if(S.vy<0)S.vy*=-.6;} else if(S.y>w.hh-BR){S.y=w.hh-BR; if(S.vy>0)S.vy*=-.6;}
}
function land(S){
  const g=groundAt(S.x,S.y), c=CLUBS[S.club];
  S.gr=g;
  if(g.water){ splash(S,g); return; }
  const imp=-S.vz; S.z=0;
  const dm=g.damp*c.landD;
  S.vx*=dm; S.vy*=dm; S.vz=imp*g.rest*c.bounce; if(S.vz<55) S.vz=0;
  S.z=S.vz>0?.01:0;
  cupCheck(S); if(S.cup) return;
  ev(S,{t:'land',x:S.x,y:S.y,imp,g});
}

function step(S){
  S.k++; S.steps++;
  if(S.rest){
    if(!S.nomov&&!S.cup&&W.mv.length) collideMovers(S);
    return;
  }
  if(S.vz>0||S.z>0){
    S.vz-=GRAV*DT; S.x+=S.vx*DT; S.y+=S.vy*DT; S.z+=S.vz*DT;
    bounds(S); if(S.rest) return;
    collideStatic(S); if(!S.nomov&&W.mv.length) collideMovers(S);
    if(S.z<=0&&S.vz<=0) land(S);
  } else {
    const g=S.gr||(S.gr=groundAt(S.x,S.y));
    if(g.conv){
      const cv=g.conv; S.vx=cv.dx*cv.sp; S.vy=cv.dy*cv.sp;
    } else {
      const spd=Math.sqrt(S.vx*S.vx+S.vy*S.vy);
      if(spd<8){ stopBall(S); return; }
      const ns=spd-(g.k*spd+g.c)*DT;
      if(ns<=0){ stopBall(S); return; }
      const f=ns/spd; S.vx*=f; S.vy*=f;
    }
    S.x+=S.vx*DT; S.y+=S.vy*DT;
    bounds(S); if(S.rest) return;
    collideStatic(S); if(!S.nomov&&W.mv.length) collideMovers(S);
    const g2=groundAt(S.x,S.y); S.gr=g2;
    if(g2.water){ splash(S,g2); return; }
    if(g2.conv&&g2.conv.to){
      const cv=g2.conv;
      if((cv.dx>0&&S.x>=cv.exit)||(cv.dx<0&&S.x<=cv.exit)||(cv.dy>0&&S.y>=cv.exit)||(cv.dy<0&&S.y<=cv.exit)){
        S.x=cv.to[0]; S.y=cv.to[1]; S.vx=cv.dx*60; S.vy=cv.dy*60; S.gr=groundAt(S.x,S.y);
        ev(S,{t:'escal',x:S.x,y:S.y});
      }
    }
    cupCheck(S);
  }
}
const SIM_MAX=2400;
function simShot(S0,ang,p,club,nomov,delay){
  const S=cloneS(S0); S.nomov=nomov; S.k+=delay||0; launch(S,ang,p,club);
  let n=0; while(!S.rest&&n++<SIM_MAX) step(S);
  return S;
}

function resize(){
  const r=cv.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
  cw=Math.max(100,r.width); ch=Math.max(100,r.height);
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
}
function baseZoom(){ return Math.min(cw,ch)/(cw<ch?430:500); }
function fitZoom(){ return Math.min(cw/(W.w+50),ch/(W.hh+50)); }
function w2sx(x){ return (x-cam.x)*cam.z+cw/2; }
function w2sy(y){ return (y-cam.y)*cam.z+ch/2; }
function s2wx(x){ return (x-cw/2)/cam.z+cam.x; }
function s2wy(y){ return (y-ch/2)/cam.z+cam.y; }

function shade(col,a){
  if(col[0]!=='#'||col.length<7) return col;
  const n=parseInt(col.slice(1,7),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  if(a>=0){ r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; } else { r*=1+a; g*=1+a; b*=1+a; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function paintBG(){
  const h=W.h, rnd=mulberry(holeIdx*77+5);
  bg=document.createElement('canvas'); bg.width=Math.ceil(W.w*BGS); bg.height=Math.ceil(W.hh*BGS);
  const c=bg.getContext('2d'); c.scale(BGS,BGS);
  const zones=[Object.assign({sh:0,x:0,y:0,w:W.w,h:W.hh},W.baseZ)].concat(W.zones);
  for(const q of zones){
    c.save(); c.beginPath();
    if(q.sh) c.arc(q.cx,q.cy,q.r,0,7); else c.rect(q.x,q.y,q.w,q.h);
    c.fillStyle=q.col||GR[q.t].col; c.fill(); c.clip();
    const bx=q.sh?q.cx-q.r:q.x, by=q.sh?q.cy-q.r:q.y, bw=q.sh?q.r*2:q.w, bh=q.sh?q.r*2:q.h, area=bw*bh;
    if(q.t==='grass'){ c.strokeStyle='rgba(30,100,40,.22)'; c.lineWidth=1.3; c.beginPath(); for(let i=0;i<area/900;i++){const x=bx+rnd()*bw,y=by+rnd()*bh; c.moveTo(x,y); c.lineTo(x+1.5,y-5);} c.stroke(); }
    else if(q.t==='asphalt'){ c.fillStyle='rgba(0,0,0,.09)'; for(let i=0;i<area/500;i++) c.fillRect(bx+rnd()*bw,by+rnd()*bh,1.6,1.6); c.fillStyle='rgba(255,255,255,.07)'; for(let i=0;i<area/900;i++) c.fillRect(bx+rnd()*bw,by+rnd()*bh,1.4,1.4); }
    else if(q.t==='sand'){ c.fillStyle='rgba(150,110,40,.25)'; for(let i=0;i<area/60;i++) c.fillRect(bx+rnd()*bw,by+rnd()*bh,1.4,1.4); }
    else if(q.t==='carpet'){ c.fillStyle='rgba(0,0,0,.13)'; for(let y=by;y<by+bh;y+=10) for(let x=bx+((y/10|0)%2)*5;x<bx+bw;x+=10){ c.beginPath(); c.arc(x,y,1.6,0,7); c.fill(); } }
    else if(q.t==='water'){ c.strokeStyle='rgba(255,255,255,.4)'; c.lineWidth=1.4; for(let i=0;i<area/1400;i++){ const x=bx+rnd()*bw,y=by+rnd()*bh; c.beginPath(); c.arc(x,y,5,3.5,5.9); c.stroke(); } }
    else if(q.t==='void'){ const g=c.createLinearGradient(bx,0,bx+bw,0); g.addColorStop(0,'#0e1630'); g.addColorStop(.5,'#2a4170'); g.addColorStop(1,'#0e1630'); c.fillStyle=g; c.fillRect(bx,by,bw,bh);
      c.strokeStyle='rgba(180,220,255,.25)'; c.lineWidth=2; for(let y=by;y<by+bh;y+=40){ c.beginPath(); c.moveTo(bx,y); c.lineTo(bx+bw,y+18); c.stroke(); } }
    c.restore();
    if(q.t==='water'&&q.sh){ c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=3; c.beginPath(); c.arc(q.cx,q.cy,q.r,0,7); c.stroke(); }
  }
  // 装飾
  for(const d of (h.dec||[])){
    const t=d[0];
    if(t==='dash'){ c.strokeStyle=d[5]; c.lineWidth=d[6]; c.setLineDash([16,14]); c.beginPath(); c.moveTo(d[1],d[2]); c.lineTo(d[3],d[4]); c.stroke(); c.setLineDash([]); }
    else if(t==='line'){ c.strokeStyle=d[5]; c.lineWidth=d[6]; c.beginPath(); c.moveTo(d[1],d[2]); c.lineTo(d[3],d[4]); c.stroke(); }
    else if(t==='rect'){ c.fillStyle=d[5]; c.fillRect(d[1],d[2],d[3],d[4]); }
    else if(t==='ring'){ c.strokeStyle=d[4]; c.lineWidth=d[5]; c.beginPath(); c.arc(d[1],d[2],d[3],0,7); c.stroke(); }
    else if(t==='text'){ c.font='800 '+d[4]+'px '+FONT; c.fillStyle=d[5]; c.textAlign='center'; c.textBaseline='middle'; c.fillText(d[3],d[1],d[2]); }
    else if(t==='zebra'){ c.fillStyle='rgba(255,255,255,.85)'; const [x,y,w,hh,vert]=[d[1],d[2],d[3],d[4],d[5]]; if(vert){ for(let yy=y+4;yy<y+hh-6;yy+=18) c.fillRect(x+4,yy,w-8,9); } else { for(let xx=x+4;xx<x+w-6;xx+=18) c.fillRect(xx,y+4,9,hh-8); } }
    else if(t==='lot'){ c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=2.4; const [x,y,w,hh,n,vert]=[d[1],d[2],d[3],d[4],d[5],d[6]]; c.beginPath(); for(let i=0;i<=n;i++){ if(vert){ const yy=y+hh*i/n; c.moveTo(x,yy); c.lineTo(x+w,yy);} else { const xx=x+w*i/n; c.moveTo(xx,y); c.lineTo(xx,y+hh);} } c.stroke(); }
    else if(t==='tiles'){ const [x,y,w,hh,s]=[d[1],d[2],d[3],d[4],d[5]]; c.save(); c.beginPath(); c.rect(x,y,w,hh); c.clip(); c.strokeStyle='rgba(0,0,0,.09)'; c.lineWidth=1.5; c.beginPath(); for(let xx=x;xx<=x+w;xx+=s){c.moveTo(xx,y);c.lineTo(xx,y+hh);} for(let yy=y;yy<=y+hh;yy+=s){c.moveTo(x,yy);c.lineTo(x+w,yy);} c.stroke(); c.restore(); }
    else if(t==='rails'){ const [x,y,w,hh]=[d[1],d[2],d[3],d[4]]; c.fillStyle='#6f5a3f'; for(let yy=y;yy<y+hh;yy+=16) c.fillRect(x,yy,w,7); c.fillStyle='#c8ccd2'; c.fillRect(x+w*.18,y,5,hh); c.fillRect(x+w*.18+36,y,5,hh); c.fillRect(x+w*.62,y,5,hh); c.fillRect(x+w*.62+36,y,5,hh); }
    else if(t==='bars'){ c.fillStyle='#fff'; c.fillRect(d[1],d[2],d[3],d[4]); c.fillStyle='#d33'; for(let yy=d[2];yy<d[2]+d[4];yy+=16) c.fillRect(d[1],yy,d[3],8); }
    else if(t==='esc'){ const [x,y,w,hh]=[d[1],d[2],d[3],d[4]]; c.fillStyle='#8892a8'; c.fillRect(x,y,w,hh); c.fillStyle='#4b5470'; c.fillRect(x,y-6,w,6); c.fillRect(x,y+hh,w,6); }
    else if(t==='table'){ const [x,y,r]=[d[1],d[2],d[3]]; c.fillStyle='rgba(0,0,0,.2)'; c.beginPath(); c.arc(x+3,y+5,r,0,7); c.fill(); c.fillStyle='#f6f2ea'; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.strokeStyle='#caa97a'; c.lineWidth=4; c.stroke();
      c.fillStyle='#d9534f'; for(let i=0;i<4;i++){ const a=i*Math.PI/2+.8; c.beginPath(); c.arc(x+Math.cos(a)*(r+13),y+Math.sin(a)*(r+13),9,0,7); c.fill(); } }
  }
  if(!W.oob){ c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=8; c.strokeRect(0,0,W.w,W.hh); }
}

// ---------- 物体 ----------
function heading(m){
  if(!m.hd){
    m.hd=new Float32Array(m.N); let last=0, init=false;
    for(let s=0;s<m.N;s++){ const p=(s+m.N-1)%m.N; const dx=m.tab[2*s]-m.tab[2*p], dy=m.tab[2*s+1]-m.tab[2*p+1]; const d=Math.hypot(dx,dy); if(d>.05&&d<20){ last=Math.atan2(dy,dx); init=true; } m.hd[s]=last; }
    if(init){ let f=0; for(let s=0;s<m.N;s++){ if(m.hd[s]!==0){ f=m.hd[s]; break; } } for(let s=0;s<m.N&&m.hd[s]===0;s++) m.hd[s]=f; }
  }
  return m.hd;
}
function drawCar(c,cx,cy,L,Wd,ang,col){
  c.save(); c.translate(cx,cy); c.rotate(ang);
  c.fillStyle='rgba(0,0,0,.28)'; rr(c,-L/2+3,-Wd/2+5,L,Wd,9); c.fill();
  c.fillStyle='#222'; c.fillRect(-L*.36,-Wd/2-2,L*.16,Wd+4); c.fillRect(L*.2,-Wd/2-2,L*.16,Wd+4);
  c.fillStyle=col; rr(c,-L/2,-Wd/2,L,Wd,9); c.fill();
  c.fillStyle=shade(col,.25); rr(c,-L*.22,-Wd/2+3,L*.46,Wd-6,6); c.fill();
  c.fillStyle='#2b3a52'; c.fillRect(L*.2,-Wd/2+5,L*.1,Wd-10); c.fillRect(-L*.3,-Wd/2+5,L*.07,Wd-10);
  c.fillStyle=shade(col,-.2); c.fillRect(-L*.16,-Wd/2+7,L*.34,Wd-14);
  c.fillStyle='#fff3a0'; c.fillRect(L/2-4,-Wd/2+3,4,7); c.fillRect(L/2-4,Wd/2-10,4,7);
  c.fillStyle='#e33'; c.fillRect(-L/2,-Wd/2+3,3,7); c.fillRect(-L/2,Wd/2-10,3,7);
  c.restore();
}
function drawPerson(c,x,y,col,r,big){
  c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x+2,y+3,r*1.1,r*.8,0,0,7); c.fill();
  c.fillStyle=col; c.beginPath(); c.ellipse(x,y+r*.15,r*1.05,r*.75,0,0,7); c.fill();
  c.fillStyle='#f5cfa6'; c.beginPath(); c.arc(x,y-r*.1,r*.62,0,7); c.fill();
  c.fillStyle='#3a2a20'; c.beginPath(); c.arc(x,y-r*.22,r*.64,3.3,6.1); c.fill();
}
function drawPlayer(c,x,y,ang){
  const r=11, bx=x-Math.cos(ang)*20, by=y-Math.sin(ang)*20;
  const sw=animT-swingT; let ca=ang;
  if(sw<.35&&sw>=0) ca=ang+(1-sw/.35)*-2.2;
  c.save(); c.translate(bx,by);
  c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(2,3,r*1.1,r*.8,0,0,7); c.fill();
  c.strokeStyle='#cfd6e4'; c.lineWidth=2.4; c.lineCap='round'; c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(ca)*34,Math.sin(ca)*34); c.stroke();
  c.fillStyle='#2f9e6a'; c.beginPath(); c.ellipse(0,1,r*1.05,r*.78,ang,0,7); c.fill();
  c.fillStyle='#f5cfa6'; c.beginPath(); c.arc(0,0,r*.62,0,7); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(0,-1,r*.64,3.2,6.2); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.moveTo(Math.cos(ang)*r*.5,Math.sin(ang)*r*.5); c.lineTo(Math.cos(ang)*r*1.15,Math.sin(ang)*r*1.15); c.lineWidth=3; c.strokeStyle='#fff'; c.stroke();
  c.restore();
}
function drawLabel(c,txt,cx,cy,size,col){ c.font='800 '+size+'px '+FONT; c.fillStyle=col||'rgba(255,255,255,.9)'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(txt,cx,cy); }

      c.fillStyle=shade(o.c||'#555',.35); c.beginPath(); c.arc(cx-r*.25,cy-r*.25,r*.55,0,7); c.fill();
      if(o.lb&&r>=10) drawLabel(c,o.lb,cx,cy+r+9,10,'rgba(0,0,0,.45)');
    } else if(k==='bush'){
      c.fillStyle='rgba(0,0,0,.2)'; c.beginPath(); c.arc(cx+2,cy+3,r,0,7); c.fill();
      c.fillStyle='#3f9a45'; c.beginPath(); c.arc(cx,cy,r,0,7); c.fill(); c.fillStyle='#58b85c'; c.beginPath(); c.arc(cx-r*.3,cy-r*.3,r*.6,0,7); c.fill(); c.fillStyle='#e98aa6'; c.fillRect(cx+r*.2,cy+r*.1,3,3);
    } else if(k==='tree'){
      c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.arc(cx+6,cy+8,r,0,7); c.fill();
      c.fillStyle='#2f8a3a'; c.beginPath(); c.arc(cx,cy,r,0,7); c.fill(); c.fillStyle='#46a64e'; c.beginPath(); c.arc(cx-r*.25,cy-r*.3,r*.7,0,7); c.fill(); c.fillStyle='#63c46a'; c.beginPath(); c.arc(cx-r*.4,cy-r*.45,r*.35,0,7); c.fill();
    } else if(k==='table'){
      c.fillStyle='rgba(0,0,0,.22)'; c.beginPath(); c.arc(cx+3,cy+4,r,0,7); c.fill();
      c.fillStyle='#f6f2ea'; c.beginPath(); c.arc(cx,cy,r,0,7); c.fill(); c.strokeStyle='#caa97a'; c.lineWidth=3; c.stroke();
      c.fillStyle='#d9534f'; c.beginPath(); c.arc(cx+r+7,cy,7,0,7); c.fill(); c.beginPath(); c.arc(cx-r-7,cy,7,0,7); c.fill();
    } else if(k==='person'){ drawPerson(c,cx,cy,o.c||'#e07a5f',r,0); if(o.lb) drawLabel(c,o.lb,cx,cy-r-8,10,'rgba(255,255,255,.9)'); }
    else if(k==='pigeon'){

// ---------- 予測線（最初の着地点まで） ----------
function previewPath(){
  const S2=cloneS(S); S2.rec=true; S2.evq=[]; S2.nomov=false;
  launch(S2,aim.ang,aim.pw,club);
  const pts=[]; let n=0, endEv=null;
  while(!S2.rest&&n<1500){
    step(S2); n++;
    if(n%3===0) pts.push([S2.x,S2.y-S2.z*.65]);
    if(S2.evq.length){ const e=S2.evq[S2.evq.length-1]; if(e.t==='land'||e.t==='hit'||e.t==='glass'||e.t==='water'||e.t==='void'||e.t==='oob'||e.t==='cup'||e.t==='escal'){ pts.push([e.x,e.y]); endEv=e; break; } }
    if(club===2&&pts.length>80) break;
  }
  if(!endEv&&S2.rest) pts.push([S2.x,S2.y]);
  return {pts,end:endEv};
}

function drawBubbles(c){

}

function simTick(){

function camTarget(dt){

  else if(view.free){ tx=view.fx; ty=view.fy; tz=view.fz; }

function update(dtReal){
  let dt=dtReal;
  if(auto){ if(mode==='fly'){ const sp=Math.hypot(S.vx,S.vy); dt*=(sp<220&&S.z<=0)?4:1.6; } else if(mode==='police'||mode==='cup'||mode==='pen') dt*=2; }
  animT+=dt; holeT+=dt;
  if(view.overview&&view.tOv>0&&!view.userOv){ view.tOv-=dt; if(view.tOv<=0){ view.overview=false; $('viewBtn').setAttribute('aria-pressed','false'); } }
  acc+=dt; let n=0;
  while(acc>=DT&&n<60){ acc-=DT; n++; simTick(); }
  if(acc>DT*2) acc=0;
  if(mode==='cup'){ cupT+=dt; if(cupT>.9) finishHole('cup'); }
  else if(mode==='police'){ policeT-=dt; if(policeT<=0) finishHole('police'); }
  else if(mode==='pen'){ penT-=dt; if(penT<=0){ pen=null; S.x=S.px; S.y=S.py; S.z=0; S.vx=S.vy=S.vz=0; S.rest=true; settleAim(); } }
  if(auto){

    else if(mode==='card'){ cardT+=dt; if(cardT>3.2) startRound(); }
  }

// ---------- オート（TAS 風） ----------
function distToCup(R){ return Math.hypot(R.x-W.cup.x,R.y-W.cup.y); }

function powerSweep(base,a,club,g0,out){
  const coarse=[]; let found=null;
  for(let p=.04;p<=1.0001;p+=.04){
    const R=simShot(base,a,p,club,true,0);
    if(validCup(R,g0)){ found={ang:a,p,club,hv:R.hv,steps:R.steps,cup:true}; out.push(found); if(R.hv===0) return; continue; }
    coarse.push([p,distToCup(R)]);
  }
  coarse.sort((u,v)=>u[1]-v[1]);
  for(let i=0;i<Math.min(2,coarse.length);i++){
    if(coarse[i][1]>120) break;
    for(let p=Math.max(.01,coarse[i][0]-.04);p<=Math.min(1,coarse[i][0]+.04)+1e-9;p+=.004){
      const R=simShot(base,a,p,club,true,0);
      if(validCup(R,g0)){ out.push({ang:a,p,club,hv:R.hv,steps:R.steps,cup:true}); if(R.hv===0) return; break; }
    }
  }
}
function bankTargets(base,list){
  const cx=W.cup.x, cy=W.cup.y, bx=base.x, by=base.y, c=[];
  const addV=(lx,y0,y1)=>{ // 縦の面 x=lx（ボール・カップが同じ側）
    if((bx-lx)*(cx-lx)<=0) return; const mx=2*lx-cx, my=cy; const t=(lx-bx)/(mx-bx); if(t<=0||t>=1) return; const yy=by+t*(my-by); if(yy<y0-2||yy>y1+2) return; c.push([mx,my,Math.hypot(mx-bx,my-by)]);
  };
  const addH=(ly,x0,x1)=>{
    if((by-ly)*(cy-ly)<=0) return; const mx=cx, my=2*ly-cy; const t=(ly-by)/(my-by); if(t<=0||t>=1) return; const xx=bx+t*(mx-bx); if(xx<x0-2||xx>x1+2) return; c.push([mx,my,Math.hypot(mx-bx,my-by)]);
  };
  if(!W.oob){ addV(BR,-1e5,1e5); addV(W.w-BR,-1e5,1e5); addH(BR,-1e5,1e5); addH(W.hh-BR,-1e5,1e5); }
  for(const ob of W.so){
    if(ob.top<900||ob.sh||ob.gl) continue;
    addV(ob.x0-BR,ob.y0,ob.y1); addV(ob.x1+BR,ob.y0,ob.y1); addH(ob.y0-BR,ob.x0,ob.x1); addH(ob.y1+BR,ob.x0,ob.x1);
  }
  c.sort((u,v)=>u[2]-v[2]);
  for(const t of c.slice(0,6)) list.push([t[0],t[1]]);
}
function cupSearch(base,banks,g0){
  const out=[], targets=[[W.cup.x,W.cup.y]];
  if(banks) bankTargets(base,targets);
  for(let ti=0;ti<targets.length;ti++){
    const dx=targets[ti][0]-base.x, dy=targets[ti][1]-base.y, d=Math.hypot(dx,dy); if(d<8) continue;
    const a0=Math.atan2(dy,dx), half=clamp(14/d,.018,.1), st=clamp(4/d,.0022,.009);
    for(let a=a0-half;a<=a0+half+1e-9;a+=st){
      for(const cl of [2,1,0]){ powerSweep(base,a,cl,g0,out); if(out.length&&out[out.length-1].hv===0&&out.length>2) return out; }
    }
    if(out.some(o=>o.hv===0)) break;
  }
  return out;
}
function endScore(R,g0){
  let s=remain(R.x,R.y);
  if(R.nw||R.noob) s+=3000; if(R.ngl) s+=1500;
  if(R.nh>0) s+=400+R.hv*20;
  if(g0+R.hv>=100) s+=5000;
  const g=groundAt(R.x,R.y); if(g.t==='sand') s+=120; if(g.bad) s+=600;
  return s;
}
function approachScan(base,g0){
  const res=[];
  const pw=[.12,.2,.3,.4,.5,.6,.7,.8,.9,1];
  const a0=Math.atan2(W.cup.y-base.y,W.cup.x-base.x);
  const evalOne=(a,p,cl)=>{ const R=simShot(base,a,p,cl,true,0); const sc=endScore(R,g0); res.push({ang:a,p,club:cl,score:sc,x:R.x,y:R.y,sand:groundAt(R.x,R.y).t==='sand'?1:0,hv:R.hv,cup:false}); };
  for(const cl of [0,1,2]) for(let ad=0;ad<360;ad+=3) for(const p of pw) evalOne(ad*Math.PI/180,p,cl);
  res.sort((u,v)=>u.score-v.score);
  // 上位を細かく
  const top=[]; for(const r of res){ if(top.length>=6) break; if(top.every(t=>Math.hypot(t.x-r.x,t.y-r.y)>40)) top.push(r); }
  for(const t of top){
    for(let da=-2.4;da<=2.4;da+=.8) for(let dp=-.06;dp<=.06;dp+=.02){ const p=clamp(t.p+dp,.03,1); evalOne(t.ang+da*Math.PI/180,p,t.club); }
  }
  res.sort((u,v)=>u.score-v.score);
  const out=[]; for(const r of res){ if(out.length>=14) break; if(out.every(t=>Math.hypot(t.x-r.x,t.y-r.y)>14||t.club!==r.club)) out.push(r); }
  return out;
}
function moverDelay(S0,cand,maxD){
  if(!W.mv.length) return 0;
  const base=cloneS(S0); const R0=simShot(base,cand.ang,cand.p,cand.club,true,0);
  const T=W.maxT;
  for(let d=0;d<Math.min(T,maxD||T);d+=6){
    const R=simShot(S0,cand.ang,cand.p,cand.club,false,d);
    if(R.nh>R0.nh||R.nw||R.noob) continue;
    if(R0.cup){ if(R.cup) return d; continue; }
    if(Math.hypot(R.x-R0.x,R.y-R0.y)<10) return d;
  }
  return -1;
}
function planShot(S0){
  const g0=gauge;
  const base=cloneS(S0); base.nomov=true; base.sand=S0.sand;
  let list=[];
  let cups=cupSearch(base,false,g0);
  if(!cups.length) cups=cupSearch(base,true,g0);
  cups.sort((u,v)=>u.hv-v.hv||u.steps-v.steps);
  list=list.concat(cups.slice(0,5));
  if(!cups.length||true){
    const app=approachScan(base,g0).filter(r=>r.score<2500);
    // 2手先（カップインできる位置か）
    const twoPly=[];
    for(const r of app.slice(0,5)){
      const B=cloneS(base); B.x=r.x; B.y=r.y; B.z=0; B.vx=B.vy=B.vz=0; B.rest=true; B.sand=r.sand; B.gr=groundAt(r.x,r.y);
      const c2=cupSearch(B,false,g0+r.hv);
      if(c2.length){ twoPly.push(Object.assign({},r,{two:true,score:r.score-100000+Math.min.apply(null,c2.map(o=>o.hv))*50})); }
    }
    twoPly.sort((u,v)=>u.score-v.score);
    list=list.concat(twoPly,app);
  }
  for(let i=0;i<list.length&&i<18;i++){
    const d=moverDelay(S0,list[i]);
    if(d>=0) return Object.assign({k:S0.k+d,delay:d},list[i]);
  }
  if(list.length) return Object.assign({k:S0.k,delay:0},list[0]);
  return null;
}
function autoAim(dt){
  if(!autoPlan){
    const t0=performance.now();
    autoPlan=planShot(S);
    if(!autoPlan){ const a=angTo(S.x,S.y); autoPlan={ang:a,p:.5,club:2,k:S.k}; }
    autoPlan.ms=performance.now()-t0; autoAimT=0;
    view.overview=false;
  }
  if(S.k<autoPlan.k){ // 車や電車が通りすぎるのを待つ（早送り）
    for(let i=0;i<14&&S.k<autoPlan.k&&mode==='aim';i++){ simTick(); }
    return;
  }
  if(mode!=='aim') return;
  autoAimT+=dt;
  aim.on=true; aim.ang=autoPlan.ang; aim.pw=autoPlan.p*Math.min(1,autoAimT/.18); setClub(autoPlan.club);
  if(autoAimT>=.3){ const pl=autoPlan; doShoot(pl.ang,pl.p,pl.club); lastPlan=pl; }
}
let lastPlan=null;
function setAuto(b){
  b=!!b; const was=auto; auto=b; $('autoBtn').setAttribute('aria-pressed',String(b));
  autoPlan=null; autoAimT=0;

}

// ---------- 人間っぽいボット（テスト用） ----------
const calibCache={};
function calibTable(cl,gname){
  const key=cl+gname; if(calibCache[key]) return calibCache[key];
  const save=W; const E={w:1e6,hh:1e6,gx:1,gy:1,grid:[[]],so:[],mv:[],zones:[],baseZ:Object.assign({},GR[gname]),cup:{x:-1e9,y:-1e9},oob:false,ng:0,maxT:0};
  W=E; const tab=[];
  for(let p=.02;p<=1.0001;p+=.02){ const T=newState(5e5,5e5); launch(T,0,p,cl); let n=0; while(!T.rest&&n++<4000) step(T); tab.push([p,T.x-5e5]); }
  W=save; calibCache[key]=tab; return tab;
}
function powerFor(cl,gname,d){
  const tab=calibTable(cl,gname);
  for(let i=0;i<tab.length;i++) if(tab[i][1]>=d){ if(i===0) return tab[0][0]*d/Math.max(1,tab[0][1]); const a=tab[i-1], b=tab[i]; return a[0]+(b[0]-a[0])*(d-a[1])/Math.max(1,b[1]-a[1]); }
  return 1;
}
function botShot(rnd){
  const dx=W.cup.x-S.x, dy=W.cup.y-S.y, d=Math.hypot(dx,dy);
  const cl=d>260?1:2, g=groundAt(S.x,S.y), gname=g.conv?'floor':(GR[g.t]&&!g.water?g.t:'asphalt');
  const ang=Math.atan2(dy,dx)+(rnd()*2-1)*8*Math.PI/180;
  const p=clamp(powerFor(cl,gname,d)*(1+(rnd()*2-1)*.15),.03,1);
  return doShoot(ang,p,cl);
}

const ptrs=new Map(); let gest=null;
function ballScreen(){ return [w2sx(S.x),w2sy(S.y)]; }

function aimFromPointer(sx,sy){
  const wx=s2wx(sx), wy=s2wy(sy), dx=wx-S.x, dy=wy-S.y, len=Math.hypot(dx,dy)*cam.z;
  aim.pw=clamp(len/MAXPULL,0,1); aim.px=wx; aim.py=wy;

}
function enterFree(){ if(!view.free){ view.free=true; view.fx=cam.x; view.fy=cam.y; view.fz=cam.z; } if(view.overview){ view.overview=false; view.userOv=false; $('viewBtn').setAttribute('aria-pressed','false'); } }
cv.addEventListener('pointerdown',e=>{
  unlock(); if(mode==='title') return;

    else { gest={type:'pan',lx:p.x,ly:p.y}; }

cv.addEventListener('pointermove',e=>{

function endPtr(e){

window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='o'||k==='O'){ unlock(); setAuto(!auto); e.preventDefault(); return; }

<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
