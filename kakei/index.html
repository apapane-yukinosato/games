<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="description" content="手取りや今の固定費を入れて、スマホ代・保険・車の固定費を削ったら10年後・20年後にいくら差がつくかを比べる家計見直しシミュレーター">
<title>家計見直しシミュレーター</title>
<style>
html,body{touch-action:manipulation}
:root{
  --bg:#17233B; --bg2:#22335A; --bg3:#2D4272; --card:#FFF8EC; --ink:#2A2440; --mute:#98A3C4; --soft:#C9D3EE;
  --gold:#F6C343; --green:#5BD19A; --green2:#2E9E6B; --red:#FF6B6B; --gray:#B0B8D0; --gray2:#6C7799; --orange:#F0A04B; --blue:#6FB7FF;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#fff;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:8px 14px calc(28px + env(safe-area-inset-bottom,0px))}
#top{display:flex;align-items:center;gap:8px;padding:2px 0 6px}
#top a{color:var(--soft);text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}
#top h1{flex:1;margin:0;text-align:center;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:999px;padding:6px 10px;background:var(--bg2);color:#fff;cursor:pointer}
.mini[aria-pressed=true]{background:#E0A83A;color:#2A2440}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:13px 18px;background:var(--gold);color:#2A2440;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sub{background:var(--bg3);color:#fff}
.btn.block{display:block;width:100%}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:2px 0 8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
#tabs button{font:inherit;font-size:12px;font-weight:800;border:0;border-radius:10px;padding:8px 1px;background:var(--bg2);color:var(--soft);cursor:pointer;white-space:nowrap}
#tabs button[aria-selected=true]{background:var(--gold);color:#2A2440}
/* title */
#title{text-align:center;padding:26px 6px 10px}
#title .big{font-size:64px;line-height:1.1}
#title h2{font-size:26px;margin:8px 0 4px}
#title p{color:var(--soft);font-size:14px;margin:6px 0}
#title .row{display:flex;flex-direction:column;gap:10px;margin:20px auto 8px;max-width:320px}
.note{font-size:11px;color:var(--mute);margin:14px 2px 0}
/* summary */
.sum{background:var(--bg2);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.sum .r{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}
.sum .r b{color:#fff;font-variant-numeric:tabular-nums}
.sum .rest{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-weight:800}
.sum .rest span{font-size:13px}
.sum .rest b{font-size:28px;font-variant-numeric:tabular-nums}
.sum .rest b.bad{color:var(--red)} .sum .rest b.ok{color:var(--gold)} .sum .rest b.good{color:var(--green)}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#0F1930;margin:6px 0}
.bar i{display:block;height:100%;transition:width .5s}
.sv{font-size:12px;color:var(--green);font-weight:800;margin-top:2px}
.prog{font-size:12px;color:var(--soft);display:flex;justify-content:space-between;margin-bottom:6px}
/* settings */
.set{display:grid;gap:8px}
.inr{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center}
.inr span{font-size:13px;font-weight:800;color:var(--soft)}
.inr span small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.inr .w{position:relative}
.inr input{width:100%;font:inherit;font-size:16px;font-weight:800;text-align:right;padding:7px 28px 7px 6px;border-radius:10px;border:2px solid #3B5287;background:#0F1930;color:#fff;font-variant-numeric:tabular-nums}
.inr .w:after{content:"円";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mute)}
.inr .man{grid-column:2;font-size:11px;color:var(--mute);text-align:right;margin-top:-6px}
/* cut cards */
.it{background:var(--card);color:var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.it h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.it h3 small{margin-left:auto;font-size:11px;font-weight:800;color:#2E8B62;white-space:nowrap}
.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;border:2px solid #E3D9C2;background:#fff;border-radius:12px;padding:8px 10px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800;font-size:14px}
.opt .p{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.opt[aria-pressed=true]{border-color:#2E8B62;background:#E8F8EF}
.opt[aria-pressed=true].first{border-color:#D9534F;background:#FDECEA}
.it.none{opacity:.55}
.nt{font-size:12px;color:#5C5675;margin:6px 2px 0}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,0);z-index:20;pointer-events:none;font-size:26px;font-weight:800;color:var(--green);text-shadow:0 2px 8px #000;opacity:0;white-space:nowrap}
.pop.go{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
/* panels */
.pn{background:var(--bg2);border-radius:16px;padding:12px;margin-bottom:10px}
.pn h3{margin:0 0 6px;font-size:15px}
.pn p{margin:4px 0;font-size:13px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font:inherit;font-size:13px;font-weight:800;border:2px solid transparent;border-radius:999px;padding:7px 12px;background:var(--bg3);color:#fff;cursor:pointer}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--gold);color:#2A2440}
.fld{margin:8px 0}
.fld label{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--soft)}
.fld label b{color:#fff;font-variant-numeric:tabular-nums}
.fld input[type=range]{width:100%;accent-color:var(--gold);margin:2px 0}
.out{background:#0F1930;border-radius:14px;padding:10px 12px;margin-top:8px}
.out .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;color:var(--soft)}
.out .l b{color:#fff;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.out .l.g b{color:var(--green)} .out .l.r b{color:var(--red)}
.verdict{font-size:15px;font-weight:800;margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:#33224A;color:#FFE08A}
.verdict small{display:block;font-size:12px;color:#E9D9FF;font-weight:400;margin-top:2px}
.fine{font-size:11px;color:var(--mute);margin-top:6px}
/* bars */
.bars{margin-top:8px}
.bars .b{margin:8px 0}
.bars .bl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--soft)}
.bars .bl b{color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .tr{height:18px;background:#0F1930;border-radius:6px;overflow:hidden;display:flex;margin-top:2px}
.bars .tr i{display:block;height:100%;transition:width .5s}
.bars .bs{font-size:11px;color:var(--mute)}
/* compare */
.hero{text-align:center}
.hero .t{font-size:14px;color:var(--soft);font-weight:800}
.hero .big{font-size:36px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
.hero .rk{font-size:13px;font-weight:800;color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vs > div{border-radius:14px;padding:8px 10px;background:#0F1930;text-align:left}
.vs .h{font-size:12px;font-weight:800;color:var(--soft)}
.vs .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.vs .s{font-size:11px;color:var(--mute)}
.vs .bf .v{color:var(--gray)} .vs .af .v{color:var(--green)}
.vs .af{outline:2px solid var(--green2)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--soft);margin-top:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;color:var(--mute);font-weight:800;text-align:right;padding:4px 2px;border-bottom:1px solid #3B5287}
.tbl th:first-child{text-align:left}
.tbl td{padding:5px 2px;border-bottom:1px solid #31456F;text-align:right;white-space:nowrap}
.tbl td:first-child{text-align:left}
.tbl td.g{color:var(--green);font-weight:800} .tbl td.r{color:var(--red);font-weight:800}
.tbl tr.tot td{font-weight:800;border-top:2px solid #3B5287;border-bottom:0}
svg.ch{width:100%;height:auto;display:block}
.ends{display:flex;flex-direction:column;gap:8px;margin-top:12px}
</style>

<body>
<div id="app">
  <div id="top">
    <a href="../">← 一覧</a>
    <h1>💸 家計見直しシミュレーター</h1>
    <button class="mini" id="bSnd" aria-pressed="true">🔊</button>
    <button class="mini" id="bAuto" aria-pressed="false" title="オートモード（Oキー）">🤖 オート</button>
  </div>
  <div id="title">
    <div class="big">💸</div>
    <h2>家計見直しシミュレーター</h2>
    <p>スマホ・保険・車…ありがちな家計は、毎月じわじわお金が消えていく。</p>
    <p>手取りや今の固定費を入れて、固定費を削ったら<br>10年後・20年後にいくら差がつくか比べてみよう。</p>
    <div class="row">
      <button class="btn block" id="bStart">スタート</button>
      <button class="btn sub block" id="bWhat">🔮「もしも」電卓だけ使う</button>
    </div>
    <div class="note">書籍『お金の大学』（両＠リベ大学長）の「まず固定費を見直す」「貯める・増やす・守る」という考え方をもとにした学習用シミュレーターです。金額は目安のモデルで、将来の利益を保証するものではありません。入力した数字はこの端末にだけ保存されます。</div>
  </div>
  <div id="game" hidden>
    <div id="tabs" role="tablist">
      <button role="tab" data-tab="home">🏠 わが家</button>
      <button role="tab" data-tab="cut">① けずる</button>
      <button role="tab" data-tab="grow">② ふやす</button>
      <button role="tab" data-tab="res">③ くらべる</button>
      <button role="tab" data-tab="what">🔮 もしも</button>
    </div>
    <div id="main"></div>
  </div>
</div>
<div class="pop" id="pop"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const yen=n=>{ n=Math.round(n); const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e8) return s+(a/1e8).toFixed(2).replace(/\.?0+$/,'')+'億円';
  if(a>=1e4) return s+Math.round(a/1e4).toLocaleString('ja-JP')+'万円';
  return s+a.toLocaleString('ja-JP')+'円'; };
const yenF=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const sgn=n=>(n>0?'+':n<0?'−':'')+yen(Math.abs(n));
const sgnF=n=>(n>0?'+':n<0?'−':'')+yenF(Math.abs(n));

/* ---------- data ---------- */
const NISA_ROOM=18000000, TAX=0.20315;
const ITEMS=[
 {id:'phone',sn:'スマホ',ic:'📱',name:'スマホ代（家族の合計）',opts:[
   {t:'大手キャリア',c:16000,n:'いまの契約。使わない付帯サービスもセットで高い'},
   {t:'サブブランド',c:9000,n:'少し安いが、まだ高め'},
   {t:'格安SIM・オンライン専用プラン',c:4400,n:'回線品質はほぼ同じで半額以下になる（目安）'}]},
 {id:'saving',sn:'貯蓄性保険',ic:'🐷',name:'貯蓄性保険（終身・養老など）',opts:[
   {t:'そのまま続ける',c:15000,n:'返戻率が低く、早く解約すると元本割れすることも'},
   {t:'解約して投資へ',c:0,n:'解約返戻金（「わが家」で入力）を投資にまわす。解約損が出る場合もある'}]},
 {id:'cancer',sn:'医療・がん',ic:'🏥',name:'医療保険・がん保険',opts:[
   {t:'そのまま続ける',c:7000,n:'治療費は「高額療養費制度」で月の自己負担に上限がある'},
   {t:'共済（掛け捨て）に変更',c:2500,n:'安い共済で最低限だけ備える'},
   {t:'やめて貯蓄で備える',c:0,n:'高額療養費制度＋貯蓄で備える（「もしも」電卓で比べてみよう）'}]},
 {id:'life',sn:'死亡保障',ic:'👨‍👩‍👧',name:'死亡保障（生命保険）',opts:[
   {t:'手厚い保障のまま',c:10000,n:'子どもが大きくなるほど必要な保障は減っていく'},
   {t:'掛け捨ての定期保険に',c:3000,n:'必要額だけを安い掛け捨てで（遺族年金も考慮）'}]},
 {id:'carins',sn:'自動車保険',ic:'🚗',name:'自動車保険（任意保険）',opts:[
   {t:'代理店型',c:9000,n:'対面で安心だけど、人件費ぶん高い'},
   {t:'ネット型（ダイレクト）',c:5000,n:'同じ補償でも安くなることが多い'}]},
 {id:'carbody',sn:'車両保険',ic:'💥',name:'車両保険',opts:[
   {t:'フルカバーで付ける',c:5000,n:'使うと等級が下がって翌年から保険料もアップ'},
   {t:'はずして貯金で備える',c:0,n:'対人・対物は無制限のまま、自分の車の修理だけ自己負担'}]},
 {id:'energy',sn:'電気・ガス',ic:'💡',name:'電気・ガス',opts:[
   {t:'地域の大手のまま',c:18000,n:'契約プランを見直したことがない'},
   {t:'プラン・会社を見直す',c:16000,n:'乗りかえで1割ほど下がることも（目安）'}]},
 {id:'subs',sn:'サブスク',ic:'📺',name:'サブスク（動画・音楽・アプリ）',opts:[
   {t:'なんとなく全部契約',c:6000,n:'月に一度も使っていないものがある'},
   {t:'使うものだけ残す',c:1500,n:'解約はアプリからすぐできる'}]},
 {id:'loan',sn:'住居',ic:'🏠',name:'住居（住宅ローン／家賃）',opts:[
   {t:'契約したまま',c:95000,n:'金利や家賃を見直したことがない'},
   {t:'借りかえ・家賃交渉',c:88000,n:'低金利への借りかえや更新時の交渉（目安）'}]}
];
// rate of each cheaper option relative to the model's current cost, so they follow the user's own amount
ITEMS.forEach(it=>it.opts.forEach(o=>o.k=o.c/it.opts[0].c));
const DEF_CFG={inc:300000,bonus:0,varc:100000,cash:1000000,refund:800000,cur:{}};
ITEMS.forEach(it=>DEF_CFG.cur[it.id]=it.opts[0].c);
const ALLOC={
  bank:{t:'💴 預金のみ',w:[1,0,0],d:'ほぼ増えない（年0.1%）'},
  world:{t:'🌏 全世界株式',w:[0,1,0],d:'投資信託で世界中に分散（想定 年5%）'},
  div:{t:'🏦 高配当株',w:[0,0,1],d:'配当3.5%＋成長で想定 年4.5%'},
  mix:{t:'⚖️ 半々（おすすめ）',w:[0,.5,.5],d:'全世界株式と高配当株を半分ずつ'}
};
const C_BEF='#B0B8D0', C_AFT='#5BD19A', C_BAND='rgba(91,209,154,.18)';
const INIT_PICK={}; ITEMS.forEach(it=>INIT_PICK[it.id]=0);

/* ---------- state ---------- */
const S={phase:'title',tab:'home',pick:Object.assign({},INIT_PICK),alloc:'mix',share:50,nisa:true,years:20,
  calc:'save',cv:{},auto:false,snd:true,best:0,runs:0,cfg:JSON.parse(JSON.stringify(DEF_CFG))};
try{
  S.best=+localStorage.getItem('kakeiBestGap')||0; if(localStorage.getItem('kakeiSnd')==='0') S.snd=false;
  const c=JSON.parse(localStorage.getItem('kakeiCfg')||'null');
  if(c&&typeof c==='object'){ for(const k of ['inc','bonus','varc','cash','refund']) if(isFinite(c[k])) S.cfg[k]=Math.max(0,+c[k]);
    if(c.cur) ITEMS.forEach(it=>{ if(isFinite(c.cur[it.id])) S.cfg.cur[it.id]=Math.max(0,+c.cur[it.id]); }); }
}catch(_){}
const saveCfg=()=>{ try{ localStorage.setItem('kakeiCfg',JSON.stringify(S.cfg)); }catch(_){} };

/* ---------- math ---------- */
const fvA=(m,L,r,n)=>{ const i=r/12,g=Math.pow(1+i,n); return L*g+(i?m*(g-1)/i:m*n); };
function pfVal(m,L,w,delta,y,nisa){
  const n=y*12, C=m*n+L; let tot=0,gain=0;
  [[w[0],0.001],[w[1],Math.max(0,0.05+delta)],[w[2],Math.max(0,0.045+delta)]].forEach(([wt,r])=>{
    if(!wt) return; const v=fvA(m*wt,L*wt,r,n); tot+=v; gain+=Math.max(0,v-C*wt); });
  const sh=!C?0:(nisa?Math.max(0,C-NISA_ROOM)/C:1);
  return tot-gain*sh*TAX;
}
const optCost=(it,i,cfg)=>{ const cur=cfg.cur[it.id]; return i===0?cur:Math.round(cur*it.opts[i].k/100)*100; };
const costOf=(pick,cfg)=>ITEMS.reduce((s,it)=>s+optCost(it,pick[it.id],cfg),0);
function plan(pick,alloc,share,nisa,cfg){
  cfg=cfg||S.cfg;
  const bonusM=cfg.bonus/12, cost0=costOf(INIT_PICK,cfg), cost=costOf(pick,cfg);
  const sur0=cfg.inc-cfg.varc-cost0+bonusM, sur=cfg.inc-cfg.varc-cost+bonusM, sp=Math.max(0,sur);
  const prem=cfg.cur.saving, keep=pick.saving===0, refund=prem>0?cfg.refund:0;
  const m=sp*share/100, rest=sp-m+Math.min(0,sur), L=keep?0:refund, w=ALLOC[alloc].w;
  const out={cost0,cost,sur0,sur,m,rest,L,keep,before:[],low:[],mid:[],high:[],pBefore:[],pAfter:[]};
  for(let y=0;y<=30;y++){
    const n=y*12, ins=keep?fvA(prem,refund,0.005,n):0, bank=fvA(rest,cfg.cash,0.001,n);
    out.low.push(pfVal(m,L,w,-0.03,y,nisa)+bank+ins);
    out.mid.push(pfVal(m,L,w,0,y,nisa)+bank+ins);
    out.high.push(pfVal(m,L,w,0.02,y,nisa)+bank+ins);
    out.before.push(fvA(sur0,cfg.cash,0.001,n)+fvA(prem,refund,0.005,n));
    out.pBefore.push(cfg.cash+sur0*n+refund+prem*n);
    out.pAfter.push(cfg.cash+L+(m+rest)*n+(keep?refund+prem*n:0));
  }
  out.divM=(()=>{ const wt=w[2]; if(!wt) return 0; const v=fvA(m*wt,L*wt,0.045,240); return v*0.035*(nisa?1:1-TAX)/12; })();
  return out;
}
function irrYear(m,total,n){
  let lo=-0.2,hi=0.5; for(let k=0;k<60;k++){ const mid=(lo+hi)/2; if(fvA(m,0,mid,n)<total) lo=mid; else hi=mid; } return (lo+hi)/2;
}
function cancerOOP(months,med,extra){
  const cap=85800+Math.max(0,med-286000)*0.01; let tot=0; const blocks=[];
  for(let k=0;k<months;k++){
    const mo=Math.min(med*0.3,k>=3?44400:cap); const b=Math.floor(k/12); blocks[b]=(blocks[b]||0)+mo; }
  blocks.forEach(b=>tot+=Math.min(b,530000));
  return tot+extra;
}
// horizontal bars; each row: [label, value, color, sub] or [label, [[v,color],...], null, sub]
function bars(rows){
  const tot=r=>Array.isArray(r[1])?r[1].reduce((s,p)=>s+Math.max(0,p[0]),0):Math.max(0,r[1]);
  const max=Math.max(1,...rows.map(tot));
  return '<div class="bars">'+rows.map(r=>{

function tone(f,d,type,vol,slide){ if(!S.snd) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol||.08,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(_){} }

/* ---------- timers (virtual clock so tests can fast-forward) ---------- */
let autoT=0, autoQ=[], autoI=0, popT=0;
function tick(dt){
  if(popT>0){ popT-=dt; if(popT<=0) $('#pop').classList.remove('go'); }
  if(!S.auto) return;
  if(S.phase==='title'){ autoT-=dt; if(autoT<=0){ startGame(); buildAuto(); } return; }
  autoT-=dt;
  while(S.auto&&autoT<=0&&autoI<autoQ.length){ const [d,fn]=autoQ[autoI++]; fn(); autoT+=d; }
  if(S.auto&&autoI>=autoQ.length&&autoT<=0){ restart(); buildAuto(); }
}
let last=0;
function loop(ts){ const dt=last?Math.min(100,ts-last):0; last=ts; tick(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function buildAuto(){
  autoQ=[]; autoI=0; autoT=800;
  const q=(d,fn)=>autoQ.push([d,fn]);
  q(2200,()=>setTab('home'));
  q(900,()=>setTab('cut'));
  // biggest monthly savings first, skipping items this household does not have
  const order=ITEMS.map(it=>{ const b=it.opts.length-1; return {id:it.id,best:b,save:optCost(it,0,S.cfg)-optCost(it,b,S.cfg)}; })
    .filter(o=>o.save>0).sort((a,b)=>b.save-a.save);
  order.forEach(o=>q(850,()=>pick(o.id,o.best)));
  q(1400,()=>setTab('grow'));
  q(1000,()=>setAlloc('mix')); q(800,()=>setNisa(true)); q(900,()=>setShare(90));
  q(1500,()=>setTab('res'));
  q(2600,()=>setYears(10)); q(2600,()=>setYears(20)); q(2600,()=>setYears(30)); q(1800,()=>setYears(20));
  q(1200,()=>setTab('what'));
  ['save','cancer','car','endow','div'].forEach(k=>q(2800,()=>setCalc(k)));
  q(1500,()=>{});
}

  const pts=a=>a.map((v,y)=>X(y).toFixed(1)+','+Y(v).toFixed(1));
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="見直す前と見直した後の資産のすいい">`;
  [0,.5,1].forEach(f=>{ const v=min+(max-min)*f; s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#31456F"/><text x="${pl-4}" y="${Y(v)+4}" fill="#98A3C4" font-size="10" text-anchor="end">${yen(v)}</text>`; });
  [0,10,20,30].forEach(y=>s+=`<text x="${X(y)}" y="${H-6}" fill="#98A3C4" font-size="10" text-anchor="middle">${y}年</text>`);
  s+=`<polygon fill="${C_BAND}" points="${pts(r.high).concat(pts(r.low).reverse()).join(' ')}"/>`;
  s+=`<polyline fill="none" stroke="${C_BEF}" stroke-width="2.5" stroke-dasharray="5 3" points="${pts(r.before).join(' ')}"/>`;
  s+=`<polyline fill="none" stroke="${C_AFT}" stroke-width="3" points="${pts(r.mid).join(' ')}"/>`;
  const xa=X(yr), right=yr>=24, anc=right?'end':'start', dx=right?-6:6;
  s+=`<line x1="${xa}" x2="${xa}" y1="${pt}" y2="${H-pb}" stroke="#F6C343" stroke-dasharray="3 3"/>`;
  s+=`<circle cx="${xa}" cy="${Y(r.mid[yr])}" r="4.5" fill="${C_AFT}"/><circle cx="${xa}" cy="${Y(r.before[yr])}" r="4.5" fill="${C_BEF}"/>`;
  s+=`<text x="${xa+dx}" y="${Y(r.mid[yr])-7}" fill="${C_AFT}" font-size="12" font-weight="800" text-anchor="${anc}">後 ${yen(r.mid[yr])}</text>`;
  s+=`<text x="${xa+dx}" y="${Y(r.before[yr])+16}" fill="${C_BEF}" font-size="12" font-weight="800" text-anchor="${anc}">前 ${yen(r.before[yr])}</text>`;
  return s+'</svg>';
}
function renderRes(){
  const r=result(), yr=S.years, a=r.mid[yr], b=r.before[yr], gap=a-b, saved=r.cost0-r.cost, g20=r.mid[20]-r.before[20];
  const rk=g20>=20000000?'👑 家計マスター':g20>=10000000?'💎 見直しの達人':g20>=5000000?'🌱 つみたて上手':g20>=1000000?'🔰 見直しはじめ':'😵 まだまだこれから';
  const ys=[10,20,30].map(y=>`<button class="chip" data-act="years" data-y="${y}" aria-pressed="${yr===y}">${y}年後</button>`).join('');
  // item breakdown, biggest saving first
  const rows=ITEMS.filter(it=>S.cfg.cur[it.id]>0).map(it=>{ const c0=optCost(it,0,S.cfg), c1=optCost(it,S.pick[it.id],S.cfg); return {it,c0,c1,d:c0-c1}; }).sort((x,y)=>y.d-x.d);
  let h=`<div class="pn hero"><div class="chips" style="justify-content:center">${ys}</div>
   <div class="t">見直すと、${yr}年後のお金が</div><div class="big">${sgn(gap)}</div><div class="t">${gap>=0?'ふえる':'へる'}（標準シナリオ）</div>
   <div class="vs"><div class="bf"><div class="h">見直す前</div><div class="v">${yen(b)}</div><div class="s">固定費 月${yenF(r.cost0)}<br>のこり 月${yenF(r.sur0)}・預金と貯蓄性保険</div></div>
   <div class="af"><div class="h">見直した後</div><div class="v">${yen(a)}</div><div class="s">固定費 月${yenF(r.cost)}<br>のこり 月${yenF(r.sur)}・うち投資 月${yenF(r.m)}</div></div></div>`+
   bars([['見直す前',b>0?[[Math.min(b,r.pBefore[yr]),'#7E89A8'],[Math.max(0,b-r.pBefore[yr]),C_BEF]]:[[b,C_BEF]]],['見直した後',a>0?[[Math.min(a,r.pAfter[yr]),'#2E9E6B'],[Math.max(0,a-r.pAfter[yr]),C_AFT]]:[[a,C_AFT]]]])+
   (r.sur<0?`<div class="verdict" style="background:#4A2230;color:#FFB3B3">⚠️ 見直した後も毎月${yenF(-r.sur)}の赤字です<small>赤字の分は貯金を取りくずし、足りなくなると借金になる計算です。「わが家」で生活費や固定費をもう一度見てみよう。</small></div>`:'')+
   `<div class="lg"><span><i style="background:#2E9E6B"></i>こい色＝自分で入れたお金（元本）</span><span><i style="background:${C_AFT}"></i>うすい色＝運用で増えた分</span></div>
   <div class="rk" style="margin-top:6px">${rk}　ベスト（20年後の差）${sgn(Math.max(S.best,Math.round(g20)))}</div></div>
   <div class="pn"><h3>どこで差がついた？（項目べつ）</h3><table class="tbl"><tr><th>項目</th><th>前 → 後（月）</th><th>月の差</th><th>${yr}年で</th></tr>`+
   rows.map(o=>`<tr><td>${o.it.ic} ${o.it.sn}</td><td>${yenF(o.c0)}<br><span style="color:var(--mute)">→ ${yenF(o.c1)}</span></td><td class="${o.d>0?'g':''}">${o.d>0?'−'+yenF(o.d):'—'}</td><td class="${o.d>0?'g':''}">${o.d>0?yen(o.d*12*yr):'—'}</td></tr>`).join('')+
   `<tr class="tot"><td>合計</td><td>${yenF(r.cost0)}<br><span style="color:var(--mute)">→ ${yenF(r.cost)}</span></td><td class="g">${saved>0?'−'+yenF(saved):'—'}</td><td class="g">${saved>0?yen(saved*12*yr):'—'}</td></tr></table>
   <div class="fine">「${yr}年で」は削った金額を使わずにためた合計（運用なし）。これを投資にまわすと上のグラフの差になります。</div></div>
   <div class="pn"><h3>お金のすいい</h3>${chartSVG(r,yr)}
   <div class="lg"><span><i style="background:${C_BEF}"></i>見直す前</span><span><i style="background:${C_AFT}"></i>見直した後（標準）</span><span><i style="background:${C_BAND};outline:1px solid ${C_AFT}"></i>相場しだいの幅（悲観〜楽観）</span></div>
   <div class="out"><div class="l"><span>${yr}年後・見直した後の幅</span><b>${yen(r.low[yr])} 〜 ${yen(r.high[yr])}</b></div>
   ${r.divM>0?`<div class="l g"><span>20年後にもらえる配当（月・目安）</span><b>${yen(r.divM)}</b></div>`:''}</div>
   <div class="fine">標準は全世界株式5%・高配当株4.5%、悲観は−3pt、楽観は＋2ptで計算。将来の利益を保証するものではありません。税金・手数料は概算です。</div></div>
   <div class="ends"><button class="btn" data-act="tab" data-t="what">🔮「もしも」電卓で、保険料と治療費などを比べる</button>
   <button class="btn sub" data-act="tab" data-t="home">🏠 わが家の数字を変える</button>
   <button class="btn sub" data-act="restart">もういちど見直す</button><a class="btn sub" href="../">← ゲーム一覧にもどる</a></div>`;
  return h;
}
function renderWhat(){
  const c=CALCS[S.calc], v=S.cv[S.calc];
  return `<div class="pn"><h3>🔮 「もしも」を数字にする</h3><div class="chips" role="tablist">`+
    Object.keys(CALCS).map(k=>`<button class="chip" role="tab" data-act="calc" data-k="${k}" aria-selected="${S.calc===k}">${CALCS[k].tab}</button>`).join('')+
    `</div></div><div class="pn"><h3>${c.title}</h3><div id="cout"></div>`+
    (c.presets?`<div class="chips" style="margin-top:10px">`+c.presets.map((p,i)=>`<button class="chip" data-act="preset" data-i="${i}">${p[0]}</button>`).join('')+`</div>`:'')+
    c.f.map(f=>`<div class="fld"><label>${f.l}<b id="v_${f.k}">${f.f(v[f.k])}</b></label><input type="range" data-f="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v[f.k]}"></div>`).join('')+
    `<div id="cfine"></div></div><div class="ends"><a class="btn sub" href="../">← ゲーム一覧にもどる</a></div>`;
}
function calcOut(){
  const o=CALCS[S.calc].run(S.cv[S.calc]);
  return `<div class="verdict">🆚 ${o.vs}<small>${o.sub}</small></div>`+bars(o.bars)+
    (o.rows.length?`<div class="out">`+o.rows.map(r=>`<div class="l ${r[2]}"><span>${r[0]}</span><b style="white-space:normal">${r[1]}</b></div>`).join('')+`</div>`:'');
}
function fillCalc(){ $('#cout').innerHTML=calcOut(); $('#cfine').innerHTML=`<div class="fine">${CALCS[S.calc].run(S.cv[S.calc]).fine}</div>`; }
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const m=$('#main');
  m.innerHTML = S.tab==='home'?renderHome():S.tab==='cut'?renderCut():S.tab==='grow'?renderGrow():S.tab==='res'?renderRes():renderWhat();
  if(S.tab==='what') fillCalc();
  if(S.tab==='grow'){ const r=$('#rShare'); r.oninput=()=>{ S.share=+r.value; const y=window.scrollY; render(); window.scrollTo(0,y); $('#rShare').focus(); }; }
  if(S.tab==='what') m.querySelectorAll('input[data-f]').forEach(inp=>{ inp.oninput=()=>{ const k=inp.dataset.f; S.cv[S.calc][k]=+inp.value; const f=CALCS[S.calc].f.find(x=>x.k===k); $('#v_'+k).textContent=f.f(+inp.value); fillCalc(); }; });
  if(S.tab==='home') m.querySelectorAll('input[data-cfg]').forEach(inp=>{
    inp.oninput=()=>{ setCfg(inp.dataset.cfg,inp.value,inp.dataset.id); $('#sum').outerHTML=summary(); };
    inp.onchange=()=>{ inp.value=inp.dataset.id?S.cfg.cur[inp.dataset.id]:S.cfg[inp.dataset.cfg]; };
    inp.onfocus=()=>inp.select(); });
}

/* ---------- events ---------- */
$('#main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; humanTouch();
  const a=b.dataset.act;
  if(a==='pick') pick(b.dataset.id,+b.dataset.i);
  else if(a==='tab'){ setTab(b.dataset.t); window.scrollTo(0,0); }
  else if(a==='alloc') setAlloc(b.dataset.k);
  else if(a==='nisa') setNisa(b.dataset.v==='1');
  else if(a==='years') setYears(+b.dataset.y);
  else if(a==='calc') setCalc(b.dataset.k);
  else if(a==='preset'){ Object.assign(S.cv[S.calc],CALCS[S.calc].presets[+b.dataset.i][1]); sTap(); render(); }
  else if(a==='reset') resetCfg();
  else if(a==='restart') restart();
});
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ humanTouch(); setTab(b.dataset.tab); window.scrollTo(0,0); } });
$('#bStart').onclick=()=>{ humanTouch(); startGame(); };
$('#bWhat').onclick=()=>{ humanTouch(); S.calc='save'; startGame(); setTab('what'); };
$('#bSnd').onclick=()=>setSnd(!S.snd);
$('#bAuto').onclick=()=>setAuto(!S.auto);
function humanTouch(){ if(S.auto) setAuto(false); }
addEventListener('keydown',e=>{
  if((e.key==='o'||e.key==='O')&&!(e.target&&e.target.matches&&e.target.matches('input[type=number]'))){ setAuto(!S.auto); return; }
  if(S.auto&&!e.metaKey&&!e.ctrlKey&&e.key!=='Shift') humanTouch();
});
$('#main').addEventListener('input',()=>humanTouch());
setSnd(S.snd);

window.__kakei={S,plan,costOf,optCost,ITEMS,CALCS,cancerOOP,fvA,
  result,calcOut,step:dt=>tick(dt),setAuto,setTab,pick,setAlloc,setNisa,setShare,setYears,setCalc,setCfg,resetCfg,startGame,restart,render,
  get phase(){return S.phase;},get tab(){return S.tab;}};
})();
</script>

<!-- zoom guard: ピンチ・ダブルタップでズームしない -->
<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
