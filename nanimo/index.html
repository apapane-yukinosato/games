let AC=null, master=null;
function ac(){
  if(!save.snd) return null;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); }catch(_){ return null; } }
  if(AC.state==='suspended'){ try{ AC.resume(); }catch(_){} }
  return AC;
}
function tone(f,d,type,v,slide,delay){
  const a=ac(); if(!a) return; const t=a.currentTime+(delay||0);
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.03);
}
function noise(d,fq,v,type,delay){
  const a=ac(); if(!a) return; const t=a.currentTime+(delay||0);
  const n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||2000;
  const g=a.createGain(); g.gain.setValueAtTime(v||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}

  G.emo='';
  const k=G.cur, st=S(k), kind=G.c.who.kind, pick=a=>a[(G.moves+k)%a.length];
  if(st.s>0&&st.p.includes(id)){
    if(G.shake<st.n){
      G.shake=Math.min(100,G.shake+4); G.evade++;
      say('npc',pick(EVADE[kind]),'evade','（まだ強気だ。もう少し動揺させれば崩れそうだ…）'); sfx('evade'); G.curKeep=true;
    }else{
      G.done.add(k); G.steps.add(st.s); G.shake=Math.min(100,G.shake+5);
      say('npc',st.c,'ok','【ムジュン発見！】　'+'⑴⑵⑶⑷⑸⑹⑺⑻⑼⑽'[st.s-1]+' '+G.c.labs[st.s-1]);
      sfx('good'); G.hitT=.6; G.curKeep=false;
      if(G.steps.size>=10) G.pending='conf';
    }
  }else{
    G.miss++; G.trust--; G.shake=Math.max(0,G.shake-4); G.curKeep=true;
    say('npc',pick(WRONG[kind]),'bad','（的外れだった…！　信頼度が下がった）'); sfx('bad'); G.hitT=.6;
    if(G.trust<=0) G.pending='over:trust';
  }
  postAction(); R(); return true;
}
function pressGain(cmd){
  const C=CMDS[cmd], who=G.c.who, m=who.m[cmd]==null?1:who.m[cmd], n=G.used[cmd]||0;
  return {gain:C.s*m*Math.max(.3,Math.pow(.78,n)), hr:C.h*(who.hm||1), m};
}
function press(cmd){
  if(!canAct()) return false; const C=CMDS[cmd]; if(!C) return false;
  if(C.hp&&G[C.hp]<=0) return false;
  G.moves++; G.press++;
  const who=G.c.who, kind=who.kind, pg=pressGain(cmd);
  G.used[cmd]=(G.used[cmd]||0)+1; G.curKeep=true;
  let gain=pg.gain, hr=pg.hr, text='', cls='', emo='';
  const wasShake=G.shake;
  G.fx={k:cmd==='kb'?'kb':cmd==='ms'?'ms':'desk',age:0}; G.hitT=.5;
  popBang(C.bang,cmd);
  sfx(C.snd||cmd);
  if(C.hp){
    G[C.hp]--;
    if(G[C.hp]<=0){
      gain=-8; hr+=6; G.fx.k='brk'+(cmd==='kb'?'kb':'ms'); sfx('crash'); cls='broke';
      text='…あなたも、何もしてないのに壊しましたね。';
      popBang('バキィッ！',cmd);
    }
  }
  if(!cls&&wasShake>=who.cryAt&&C.h>=6){
    gain=-30; hr+=10; G.stun=1; emo=who.cry; cls='cry'; text=pick2(CRYTXT[who.cry]); sfx(who.cry==='rage'?'rage':'cry');
  }
  if(!cls&&pg.m===0){ gain=-5; hr+=6; text=SPECIAL[kind+':'+cmd]||'効かん。'; cls='immune'; }
  if(!cls){
    const lvl=wasShake<25?0:wasShake<55?1:2;
    text=SPECIAL[kind+':'+cmd]&&pg.m<=.5?SPECIAL[kind+':'+cmd]:(pg.m>=1.4&&SPECIAL[kind+':'+cmd]?SPECIAL[kind+':'+cmd]:pick2(RX[kind][lvl]));
  }
  G.shake=clamp(G.shake+gain,0,100); G.hr=Math.max(0,G.hr+hr);
  G.emo=emo;
  let warn='';
  if(G.hr>=100){ G.pending='over:hr'; text=(cls==='broke'?text+'　しかも、その態度…':'')+'…もう限界です。今のは、パワハラですよね。人事部に報告します。'; cls='over'; sfx('alarm'); }
  else if(G.hr>=70) warn='（人事の目が…光っている！　やりすぎると通報されるぞ）';
  say('npc',text,cls||'press',C.me); if(warn) G.msg.warn=warn;
  R(); return true;
}
function pick2(a){ return a[(G.moves+G.press)%a.length]; }
function ok(){
  if(!G||!G.msg) return false;
  G.msg=null; sfx('step');
  const p=G.pending;
  if(p){ G.pending=null; if(p==='conf') enterConf(); else showOver(p.split(':')[1]); return true; }
  if(G.curKeep!==true) nextCur();
  const o=openList(); if(!o.includes(G.cur)&&o.length) G.cur=o[0];
  R(); return true;
}
function gotoSt(k){ if(!G) return; if(openList().includes(k)){ G.cur=k; G.curKeep=true; R(); } }
function navSt(d){
  if(!canAct()) return; const o=openList(); if(o.length<2) return;

function rankOf(){
  const c=G.c, mv=G.moves-c.par, pp=G.press-c.parP;
  if(G.miss===0&&mv<=2&&pp<=2) return 'S';
  if(G.miss<=1&&mv<=8) return 'A';
  if(G.miss<=3&&mv<=16) return 'B';
  return 'C';
}
function enterConf(){
  const lines=[];
  for(let n=1;n<=10;n++){ const st=G.c.st.find(s=>s.s===n); lines.push({n,t:st.c}); }
  G.cf={lines,i:1,fin:false};
  G.rank=rankOf(); const id=G.c.id;
  save.clear[id]=1;
  if(!save.rank[id]||RANKV[G.rank]>RANKV[save.rank[id]]) save.rank[id]=G.rank;
  if(!save.best[id]||G.moves<save.best[id]) save.best[id]=G.moves;
  store(); sfx('fan');
  setScreen('conf');
}
function cfAdvance(all){
  const cf=G.cf; if(!cf) return;
  if(cf.fin){ setScreen('res'); return; }
  if(all) cf.i=11; else cf.i++;
  if(cf.i>=11){ cf.i=11; cf.fin=true; sfx('good'); }
  else sfx('step');
  R();
}
function totalBest(){ let s=0; for(const c of CASES){ if(!save.best[c.id]) return null; s+=save.best[c.id]; } return s; }
function nextCaseIdx(){ return (G.i+1)%CASES.length; }

/* ====================== キャラ描画 ====================== */
function rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function el(x,cx,cy,rx,ry){ x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); }
function drawScene(cv,mode){
  if(!cv||!G) return; const x=cv.getContext('2d'); if(!x) return;
  const W=320,H=176; x.setTransform(cv.width/W,0,0,cv.height/H,0,0); x.clearRect(0,0,W,H);
  const who=G.c.who, Lk=who.look, t=TM, sh=G.shake;
  const bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#34416a'); bg.addColorStop(1,'#222b47'); x.fillStyle=bg; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.05)'; for(let i=0;i<6;i++) x.fillRect(14,12+i*13,64,7);
  x.fillStyle='rgba(255,255,255,.07)'; rr(x,236,18,64,44,3); x.fill(); x.fillStyle='#8fb8e8'; x.fillRect(240,22,26,16); x.fillStyle='#e8c78f'; x.fillRect(270,22,26,16);
  const bow=mode==='bow'?13:0, bob=Math.sin(t*2)*1, jx=(sh>=55&&mode!=='bow')?Math.sin(t*34)*1.3:0;
  const emo=mode==='bow'?'bow':(G.emo||''), hit=G.hitT>0;
  x.save(); x.translate(jx,bow+bob);
  // body
  x.fillStyle=Lk.cloth; x.beginPath(); x.moveTo(84,180); x.lineTo(96,130); x.quadraticCurveTo(160,108,224,130); x.lineTo(236,180); x.closePath(); x.fill();
  if(Lk.tie){ x.fillStyle='#fff'; x.beginPath(); x.moveTo(146,118); x.lineTo(160,136); x.lineTo(174,118); x.lineTo(160,114); x.closePath(); x.fill(); x.fillStyle='#c83c4a'; x.beginPath(); x.moveTo(160,128); x.lineTo(154,136); x.lineTo(160,166); x.lineTo(166,136); x.closePath(); x.fill(); }
  else{ x.fillStyle='#fff'; x.beginPath(); x.moveTo(144,118); x.lineTo(160,138); x.lineTo(176,118); x.lineTo(160,114); x.closePath(); x.fill(); }
  x.fillStyle=Lk.skin; x.fillRect(150,104,20,16);
  // back hair
  x.fillStyle=Lk.hair;
  if(Lk.style==='bob'){ rr(x,118,52,84,66,26); x.fill(); }
  if(Lk.style==='perm'){ for(let i=0;i<9;i++){ el(x,122+i*9.5,66+Math.abs(i-4)*3,12,12); x.fill(); } el(x,160,64,42,34); x.fill(); }
  // head
  x.fillStyle=Lk.skin; el(x,160,82,33,37); x.fill();
  // front hair
  x.fillStyle=Lk.hair;
  const cap=(ry)=>{ x.beginPath(); x.ellipse(160,76,36,ry,0,Math.PI,2*Math.PI); x.fill(); };
  if(Lk.style==='short'){ cap(38); x.fillRect(124,74,8,10); x.fillRect(188,74,8,10); }
  if(Lk.style==='spiky'){ cap(36); for(let i=-3;i<=3;i++){ x.beginPath(); x.moveTo(160+i*10-7,50); x.lineTo(160+i*10,30-Math.abs(i)*1.2); x.lineTo(160+i*10+7,50); x.fill(); } }
  if(Lk.style==='comb'){ cap(37); x.fillStyle='rgba(255,255,255,.18)'; x.beginPath(); x.ellipse(150,54,16,7,-.3,0,Math.PI*2); x.fill(); x.fillStyle=Lk.hair; x.fillRect(124,72,7,14); x.fillRect(189,72,7,14); }
  if(Lk.style==='bob'){ cap(38); x.fillRect(124,60,72,16); }
  if(Lk.style==='perm'){ for(let i=0;i<7;i++){ el(x,132+i*9.3,52-Math.abs(i-3)*2.2,11,10); x.fill(); } }
  if(Lk.beard){ x.fillStyle='rgba(60,60,70,.35)'; x.beginPath(); x.ellipse(160,100,25,15,0,0,Math.PI); x.fill(); x.fillStyle='#8a8a92'; rr(x,150,95,20,4,2); x.fill(); }
  // eyes
  const nerv=sh>=25, panic=sh>=55;
  const blink=(t%4.3)<.12;
  const closed=emo==='bow'||emo==='cry'||emo==='silent'||blink||hit;
  const eyeY=82;
  for(const ex of [146,174]){
    if(closed){
      x.strokeStyle='#222'; x.lineWidth=2; x.beginPath();
      if(emo==='cry'||emo==='bow'||hit){ x.moveTo(ex-6,eyeY-2); x.lineTo(ex,eyeY+2); x.lineTo(ex+6,eyeY-2); } else { x.moveTo(ex-6,eyeY); x.lineTo(ex+6,eyeY); }
      x.stroke();
    }else{
      x.fillStyle='#fff'; el(x,ex,eyeY,7,6.5); x.fill();
      const px=panic?Math.sin(t*7+ex)*3.2:(nerv?Math.sin(t*2.2+ex)*1.6:0), py=panic?Math.cos(t*5)*1.8:0;
      x.fillStyle='#222'; el(x,ex+px,eyeY+py,3,3.2); x.fill();
    }
    // brows
    x.strokeStyle=Lk.hair==='#bdbdc4'?'#777':'#2a2a2a'; x.lineWidth=2.4; x.beginPath();
    const inner=ex<160?1:-1;
    if(emo==='rage'){ x.moveTo(ex-inner*7,eyeY-14); x.lineTo(ex+inner*7,eyeY-8); }
    else if(nerv){ x.moveTo(ex-inner*7,eyeY-8); x.lineTo(ex+inner*7,eyeY-14); }
    else { x.moveTo(ex-7,eyeY-11); x.lineTo(ex+7,eyeY-11); }
    x.stroke();
    if(Lk.glasses){ x.strokeStyle='#40424a'; x.lineWidth=1.6; el(x,ex,eyeY,10,9); x.stroke(); }
  }
  if(Lk.glasses){ x.strokeStyle='#40424a'; x.lineWidth=1.6; x.beginPath(); x.moveTo(156,eyeY); x.lineTo(164,eyeY); x.stroke(); }
  // nose + mouth
  x.strokeStyle='rgba(120,70,40,.5)'; x.lineWidth=1.5; x.beginPath(); x.moveTo(160,86); x.lineTo(158,93); x.lineTo(162,93); x.stroke();
  x.strokeStyle='#7a2c2c'; x.fillStyle='#7a2c2c'; x.lineWidth=2.2;
  const my=104;
  if(emo==='cry'){ x.beginPath(); x.arc(160,my+6,7,Math.PI*1.1,Math.PI*1.9); x.stroke(); }
  else if(emo==='rage'){ rr(x,150,my-3,20,9,3); x.fill(); x.fillStyle='#fff'; x.fillRect(153,my-2,14,3); }
  else if(emo==='silent'){ x.beginPath(); x.moveTo(152,my); x.lineTo(168,my); x.stroke(); }
  else if(emo==='bow'){ x.beginPath(); x.arc(160,my-2,7,Math.PI*.15,Math.PI*.85); x.stroke(); }
  else if(panic){ el(x,160,my+1,6+Math.sin(t*9)*1,5); x.fill(); }
  else if(nerv){ x.beginPath(); x.moveTo(150,my); for(let i=0;i<=5;i++) x.lineTo(150+i*4,my+(i%2?2.5:-1)); x.stroke(); }
  else { x.beginPath(); x.moveTo(152,my); x.quadraticCurveTo(160,my+3,168,my); x.stroke(); }
  // sweat
  if(sh>=35&&emo!=='bow'){
    const drops=sh>=60?3:sh>=45?2:1;
    for(let i=0;i<drops;i++){ const ph=(t*26+i*17)%34, dx=[124,198,134][i], dy=[58,56,50][i]+ph;
      x.fillStyle='rgba(120,200,255,'+(1-ph/40).toFixed(2)+')'; x.beginPath(); x.moveTo(dx,dy-6); x.quadraticCurveTo(dx+5,dy+1,dx,dy+5); x.quadraticCurveTo(dx-5,dy+1,dx,dy-6); x.fill(); }
  }
  if(emo==='cry'){ x.strokeStyle='rgba(120,200,255,.9)'; x.lineWidth=3; for(const ex of [146,174]){ const ph=(t*40)%30; x.beginPath(); x.moveTo(ex,eyeY+4); x.lineTo(ex-1,eyeY+8+ph); x.stroke(); } }
  x.restore();
  if(emo==='silent'){ x.fillStyle='#fff'; rr(x,208,30,56,28,10); x.fill(); x.fillStyle='#333'; x.font='bold 20px sans-serif'; x.fillText('…',224,52); }
  if(emo==='rage'){ x.font='28px sans-serif'; x.fillText('💢',206+Math.sin(t*20)*2,56); }
  // desk
  x.fillStyle='#5b4126'; x.fillRect(0,140,W,40); x.fillStyle='#7a5a37'; x.fillRect(0,140,W,4);
  if(mode!=='bow'){
    // keyboard
    x.save();
    const kbOk=G.kb>0;
    if(!kbOk){ x.translate(76,156); x.rotate(-.18); x.translate(-76,-156); }
    x.fillStyle='#c9ced8'; rr(x,26,146,100,22,4); x.fill();
    x.fillStyle='#eef0f5';
    for(let r=0;r<3;r++) for(let c=0;c<12;c++){
      if(!kbOk&&((r*12+c)%5===2)) continue;
      if(G.kb===2&&r===1&&c===5) continue;
      x.fillRect(30+c*7.8,149+r*6,6,4.5);
    }
    if(!kbOk){ x.strokeStyle='#555'; x.lineWidth=1.5; x.beginPath(); x.moveTo(60,146); x.lineTo(72,157); x.lineTo(66,168); x.stroke(); }
    x.restore();
    if(!kbOk){ x.fillStyle='#eef0f5'; for(const [a,b] of [[132,150],[142,158],[150,147],[20,170],[136,170]]) x.fillRect(a,b,7,5); }
    // mouse
    if(G.ms>0){ x.fillStyle='#c9ced8'; el(x,250,158,11,14); x.fill(); x.strokeStyle='#8a90a0'; x.lineWidth=1.5; x.beginPath(); x.moveTo(250,144); x.lineTo(250,154); x.moveTo(239,154); x.lineTo(261,154); x.stroke(); x.strokeStyle='#333'; x.beginPath(); x.moveTo(250,144); x.quadraticCurveTo(250,128,276,126); x.stroke(); }
    else{ x.fillStyle='#b4b9c6'; x.save(); x.translate(250,162); x.rotate(.5); x.fillRect(-12,-6,11,12); x.rotate(-1); x.fillRect(2,-6,10,12); x.restore(); x.strokeStyle='#333'; x.lineWidth=1.5; x.beginPath(); x.moveTo(274,162); x.lineTo(285,150); x.stroke(); }
    // hp markers
    x.font='11px sans-serif'; x.fillStyle='rgba(255,255,255,.8)';
  }
  // impact fx
  if(G.fx&&G.fx.age<.4){
    const k=G.fx.k, p=k==='kb'||k==='brkkb'?[76,156]:(k==='ms'||k==='brkms')?[250,156]:[160,142];
    const a=G.fx.age/.4; x.strokeStyle='rgba(255,236,150,'+(1-a).toFixed(2)+')'; x.lineWidth=3;
    for(let i=0;i<10;i++){ const ang=i*Math.PI/5+.2, r1=10+a*14, r2=r1+10+a*10; x.beginPath(); x.moveTo(p[0]+Math.cos(ang)*r1,p[1]+Math.sin(ang)*r1*.7); x.lineTo(p[0]+Math.cos(ang)*r2,p[1]+Math.sin(ang)*r2*.7); x.stroke(); }
    if(k==='brkkb'||k==='brkms'){ x.font='26px sans-serif'; x.fillText('💥',p[0]-12,p[1]-6); }
  }
}

/* ====================== オート（TAS風） ====================== */
function autoNeeds(c){
  const need=new Set();
  for(let k=1;k<=10;k++){ const st=c.st[k]; const has=st.p.find(id=>need.has(id)); need.add(has||st.p[0]); }
  return [...need];
}
function bestPress(need){
  let best=null, bestReach=null;
  for(const k of Object.keys(CMDS)){
    const C=CMDS[k]; if(C.hp&&G[C.hp]<=1) continue;
    const pg=pressGain(k); if(pg.gain<=0) continue;
    if(G.hr+pg.hr>55) continue;
    if(G.shake>=G.c.who.cryAt-1) continue;
    const score=pg.gain;
    if(G.shake+pg.gain>=need){ if(!bestReach||pg.hr<bestReach.hr||(pg.hr===bestReach.hr&&pg.gain>bestReach.gain)) bestReach={k,hr:pg.hr,gain:pg.gain}; }
    if(!best||score>best.score) best={k,score};
  }
  return best?best.k:null;
}
function autoPlan(){
  const o=openList();
  const truth=o.find(k=>S(k).s===0);
  if(truth!=null){ G.cur=truth; G.curKeep=true; ask(); return; }
  const lies=o.slice().sort((a,b)=>S(a).n-S(b).n);
  const tgt=lies[0]; G.cur=tgt; G.curKeep=true;
  const st=S(tgt);
  if(G.shake<st.n){ const k=bestPress(st.n); if(k){ press(k); return; } ask(); return; }
  const id=st.p.find(i=>G.got.has(i)); present(id);
}
function autoStep(){
  if(screen==='title'){ let i=autoIdx; if(!unlocked(i)) i=CASES.findIndex((c,j)=>unlocked(j)&&!save.clear[c.id]); if(i<0) i=0; autoIdx=i; startCase(i); return; }
  if(screen==='ticket'){ enterInv(); return; }
  if(screen==='inv'){
    const nx=autoNeeds(G.c).find(id=>!G.got.has(id));
    if(nx){ const e=evOf(nx); G.win={app:e.app,tab:e.tab||(APPS[e.app].tabs?Object.keys(APPS[e.app].tabs)[0]:''),sel:nx}; collect(nx); R(); return; }
    enterInt(); if(G.msg) G.msg=null; R(); return;
  }
  if(screen==='int'){ if(G.msg){ ok(); return; } autoPlan(); return; }
  if(screen==='conf'){ cfAdvance(true); return; }
  if(screen==='res'){ aT=.6; autoIdx=(G.i+1)%CASES.length; startCase(autoIdx); return; }
  if(screen==='over'){ retry(); return; }
}
function setAuto(b){
  auto=!!b; aT=.3; R();
}

/* ====================== ループ ====================== */
function tick(dt,fast){
  TM+=dt;
  if(G){ if(G.fx){ G.fx.age+=dt; if(G.fx.age>1) G.fx=null; } if(G.hitT>0) G.hitT-=dt; }
  if(auto){ aT-=dt; if(aT<=0){ aT=AUTO_DT; autoStep(); } }
  if(screen==='int'&&spFull){ tw+=dt*48; const tx=$('#spTxt'); if(tx){ const n=Math.min(spFull.length,Math.floor(tw)); const s=spFull.slice(0,n); if(tx.textContent!==s) tx.textContent=s; } }
  if(!fast){
    if(screen==='int') drawScene($('#cv'),'');
    else if(screen==='conf'&&G&&G.cf) drawScene($('#cfCv'),G.cf.fin?'bow':'');
  }
}
let lastTs=0;
function frame(ts){ const dt=Math.min(.1,(ts-lastTs)/1000||0); lastTs=ts; tick(dt); requestAnimationFrame(frame); }

/* ====================== 入力 ====================== */
document.addEventListener('click',e=>{
  if(auto&&e.isTrusted&&e.target.closest&&e.target.closest('button,a')&&!e.target.closest('#autoBtn,#sndBtn')) setAuto(false);
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(auto&&e.isTrusted&&a!=='skiptw') setAuto(false);
  ac();
  switch(a){
    case 'case': { const i=+b.dataset.i; if(unlocked(i)){ sfx('click'); startCase(i); } break; }
    case 'autostart': setAuto(true); break;
    case 'title': G=null; setScreen('title'); break;
    case 'goinv': sfx('click'); enterInv(); break;
    case 'app': { sfx('click'); const ap=b.dataset.app; G.win={app:ap,tab:APPS[ap].tabs?Object.keys(APPS[ap].tabs)[0]:'',sel:null}; R(); break; }
    case 'closewin': G.win=null; R(); break;
    case 'tab': G.win.tab=b.dataset.tab; G.win.sel=null; sfx('click'); R(); break;
    case 'item': G.win.sel=b.dataset.id; sfx('click'); R(); { const d=$('#det'); if(d) d.scrollTop=0; } break;
    case 'take': collect(b.dataset.id); break;
    case 'goint': sfx('click'); if(G.got.size===0&&!confirmEmpty()) break; enterInt(); break;
    case 'backinv': G.sheet=null; setScreen('inv'); break;
    case 'ask': ask(); break;
    case 'sheetev': G.sheet='ev'; G.sel=null; sfx('click'); R(); break;
    case 'sheetpress': G.sheet='press'; sfx('click'); R(); break;
    case 'closesheet': G.sheet=null; R(); break;
    case 'selev': G.sel=b.dataset.id; sfx('click'); R(); break;
    case 'present': { const id=G.sel; G.sheet=null; G.sel=null; if(id) present(id); break; }
    case 'press': { G.sheet=null; press(b.dataset.cmd); break; }
    case 'ok': ok(); break;
    case 'prev': navSt(-1); break;
    case 'next': navSt(1); break;
    case 'tl': { const i=+b.dataset.i; G.tlSel=G.steps.has(i)?(G.tlSel===i?0:i):0; sfx('click'); R(); break; }
    case 'skiptw': tw=1e9; break;
    case 'cfnext': cfAdvance(false); break;
    case 'cfall': cfAdvance(true); break;
    case 'cfdone': setScreen('res'); break;
    case 'nextcase': gotoNext(); break;
    case 'retrycase': startCase(G.i); break;
    case 'retry': retry(); break;
  }
});
function confirmEmpty(){ return true; }
$('#autoBtn').addEventListener('click',()=>{ ac(); setAuto(!auto); });
$('#sndBtn').addEventListener('click',()=>{ save.snd=!save.snd; store(); if(save.snd) sfx('click'); R(); });
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='o'||e.key==='O'){ ac(); setAuto(!auto); e.preventDefault(); return; }
  if(auto&&e.isTrusted) setAuto(false);
  if((e.key==='Enter'||e.key===' ')&&screen==='int'&&G&&G.msg&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){ ok(); e.preventDefault(); }
});

/* ====================== テスト用フック ====================== */
window.__nanimo={
  state(){ return {screen,auto,case:G&&G.i,trust:G&&G.trust,shake:G&&Math.round(G.shake*10)/10,hr:G&&Math.round(G.hr*10)/10,moves:G&&G.moves,miss:G&&G.miss,press:G&&G.press,steps:G&&G.steps.size,kb:G&&G.kb,ms:G&&G.ms,got:G&&[...G.got],cur:G&&G.cur,open:G&&screen==='int'?openList():null,msg:G&&G.msg?G.msg.text:null,pending:G&&G.pending,rank:G&&G.rank,over:G&&G.over,stun:G&&G.stun,evade:G&&G.evade}; },
  data(){ return CASES; },
  save(){ return save; },
  startCase, toInv:enterInv, toInt:enterInt, collect, collectAll(){ G.c.ev.forEach(e=>G.got.add(e.id)); R(); },
  ask, present, press, ok, goto:gotoSt, retry,
  setAuto, step(dt){ tick(dt,true); }, draw(){ tick(0,false); },
  reset(){ save={rank:{},clear:{},best:{},snd:save.snd}; store(); G=null; setScreen('title'); },
  unlockAll(){ CASES.forEach(c=>save.clear[c.id]=1); store(); R(); },
  title(){ G=null; setScreen('title'); },
  setScreen, openList(){ return G?openList():[]; },
  autoNeeds:i=>autoNeeds(CASES[i]), pressGain:c=>pressGain(c), finishConf(){ cfAdvance(true); }
};
setScreen('title');
requestAnimationFrame(t=>{ lastTs=t; requestAnimationFrame(frame); });
})();
</script>

<script>(function(){var p=function(e){e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false});});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('dblclick',function(e){var t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();},{passive:false});})();</script>
<!-- swipe guard: an edge swipe or a single "back" does not leave the game (a second back within 2.5s does) -->
<style>html,body{overscroll-behavior:none}#swipeGuardToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483647;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(20,20,20,.86);color:#fff;font:700 14px/1.4 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:10px 16px;border-radius:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}</style>
<script>
(()=>{
  const EDGE=24;
  // iPhone Safari: a touch that starts at the left/right edge would become the "go back" swipe
  addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t||e.touches.length>1) return;
    if(t.clientX>EDGE&&t.clientX<innerWidth-EDGE) return;
    if(e.target.closest&&e.target.closest('a,button,input,select,textarea,label,[role=button]')) return;
    e.preventDefault();
  },{passive:false});
  // back gesture / back button: the first one stays in the game, a second one within 2.5s leaves
  let armed=false, lastBack=0, hideT=0;
  const arm=()=>{ if(armed) return; armed=true; try{ history.pushState({swipeGuard:1},''); }catch(_){} };
  addEventListener('pointerdown',arm,true); addEventListener('keydown',arm,true);
  addEventListener('popstate',()=>{
    if(!armed) return;
    const now=Date.now();
    if(now-lastBack<2500){ history.back(); return; }
    lastBack=now; try{ history.pushState({swipeGuard:1},''); }catch(_){}
    let el=document.getElementById('swipeGuardToast');
    if(!el){ el=document.createElement('div'); el.id='swipeGuardToast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent='ゲームを続けます（もう一度もどる操作をすると、ゲームをやめます）';
    el.style.opacity=1; clearTimeout(hideT); hideT=setTimeout(()=>{ el.style.opacity=0; },2500);
  });
})();
</script>
